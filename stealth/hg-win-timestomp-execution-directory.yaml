id: hg-win-timestomp-execution-directory
info:
  name: Timestomping in an execution directory
  severity: medium
  description: >-
    File timestamps rewritten to blend a dropped payload into its surroundings and
    defeat timeline-based triage.
  author:
    - huntgraph
  tags:
    - stealth
    - anti-forensics
    - defense-evasion
    - windows
  references:
    - https://attack.mitre.org/techniques/T1070/006/
  mitre:
    tactics:
      - TA0005
    techniques:
      - T1070.006

hypothesis: |
  The first question in any host investigation is "what changed recently". Timestomping
  answers it wrongly: a payload back-dated to match the surrounding OS files drops out
  of every recently-modified listing an analyst builds.

  Normal software does not rewrite creation times. The operation is rare enough that
  volume is not the problem — the problem is that it is invisible unless specifically
  looked for, which makes it a hunt rather than an alert.

requires:
  platforms:
    - windows
  data_sources:
    - file_modification
    - process_creation
  connectors:
    - crowdstrike-ngsiem

baseline:
  window: 30d
  queries:
    - id: timestamp_modifying_processes
      description: Anything that legitimately rewrites file times here.
      query: |
        #event_simpleName=/ProcessRollup2/
        | CommandLine=/SetFileTime|CreationTime\s*=|LastWriteTime\s*=|touch\s+-[amt]/i
        | groupBy([ImageFileName, ComputerName], function=count(as=hits))
  signals:
    - rare_command_lines
    - first_seen
    - per_host_frequency

hunt:
  connector: crowdstrike-ngsiem
  window: 7d
  max_results: 2000
  query: |
    #event_simpleName=ProcessRollup2
    | CommandLine=/\.CreationTime\s*=|\.LastWriteTime\s*=|\.LastAccessTime\s*=|SetFileTime|timestomp/i
    {{tuning_filters}}
  tunable:
    exclude_images: []
    exclude_hosts: []
    exclude_paths: []

triage:
  fields:
    - ComputerName
    - UserName
    - ImageFileName
    - CommandLine
    - ParentBaseFileName
  escalate_when: |
    The target file sits in a user-writable or temporary directory, the new timestamp is
    back-dated rather than current, or the rewrite is performed by a script host
    (powershell, wscript, cscript) rather than by build or packaging tooling. Correlate
    with a recent file write to the same path — a drop immediately followed by a
    timestamp rewrite is the signature pattern.
  false_positive_hints:
    - Build systems and installers set deterministic timestamps for reproducible builds.
    - Backup and archive restores preserve original timestamps by design.
    - Source-control and sync clients rewrite times when materialising files.

output:
  finding_title: Timestomping observed on {{ComputerName}}
