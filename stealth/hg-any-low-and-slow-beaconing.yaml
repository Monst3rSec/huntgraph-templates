id: hg-any-low-and-slow-beaconing
info:
  name: Low-and-slow C2 beaconing
  severity: high
  description: >-
    Outbound connections at a regular interval to a single destination, at a volume
    deliberately kept below rate-based alerting thresholds.
  author:
    - huntgraph
  tags:
    - stealth
    - command-and-control
    - network
  references:
    - https://attack.mitre.org/techniques/T1071/
  mitre:
    tactics:
      - TA0011
    techniques:
      - T1071.001

hypothesis: |
  An implant must call home, and calling home on a timer produces a regularity that
  human-driven traffic does not have. Modern frameworks add jitter to break exact
  periodicity, but jitter widens the distribution of intervals without removing its
  central tendency — the pattern survives.

  Volume-based detection fails here by design: the adversary chose an interval that
  stays under the threshold. Regularity and destination rarity are the signal, and both
  are only meaningful relative to what this environment's normal outbound traffic looks
  like — which is why the baseline covers destination popularity before the hunt runs.

requires:
  data_sources:
    - network_connection
    - dns
  connectors:
    - crowdstrike-ngsiem

baseline:
  window: 30d
  queries:
    - id: destination_popularity
      description: How many hosts talk to each destination — rare destinations matter most.
      query: |
        #event_simpleName=NetworkConnectIP4 RemotePort=/^(80|443|8080|8443)$/
        | groupBy([RemoteAddressIP4], function=[count(ComputerName, distinct=true, as=hosts), count(as=hits)])
        | sort(hosts, order=asc)
    - id: process_network_profile
      description: Which processes normally make outbound connections here.
      query: |
        #event_simpleName=NetworkConnectIP4
        | groupBy([ImageFileName], function=count(as=hits))
  signals:
    - value_distribution
    - peer_comparison
    - per_host_frequency
    - field_cardinality

hunt:
  connector: crowdstrike-ngsiem
  window: 7d
  max_results: 10000
  query: |
    #event_simpleName=NetworkConnectIP4
    | RemoteAddressIP4!=/^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.|169\.254\.)/
    | groupBy([ComputerName, ImageFileName, RemoteAddressIP4, RemotePort],
              function=[count(as=connections), min(@timestamp, as=first), max(@timestamp, as=last)])
    | interval_span := (last - first) / connections
    | connections >= 12
    {{tuning_filters}}
  tunable:
    exclude_destinations: []
    exclude_images: []
    exclude_hosts: []
    min_connections: 12
    max_interval_variance: 0.25

triage:
  fields:
    - ComputerName
    - ImageFileName
    - RemoteAddressIP4
    - RemotePort
    - connections
    - interval_span
  escalate_when: |
    Connection intervals cluster tightly around a single value (low variance relative to
    the mean) over many hours, the destination is contacted by only one or two hosts in
    the whole estate, and the connecting process is not a browser or a known updater.
    A destination registered recently, or one reached by IP with no preceding DNS
    resolution, escalates. Beaconing that continues across a reboot or outside working
    hours on a workstation is stronger still.
  false_positive_hints:
    - Software updaters, telemetry agents, and monitoring clients beacon by design.
    - NTP, certificate revocation, and cloud-sync clients poll on fixed intervals.
    - Long-lived websocket or streaming connections can look periodic when re-established.
    - CDN and cloud provider IPs are contacted by many hosts and are rarely rare.

output:
  finding_title: Possible C2 beaconing from {{ComputerName}} to {{RemoteAddressIP4}}
