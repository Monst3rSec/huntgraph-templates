type: detection

id: hg-win-hearth-h239-starland-rat-pythonw-license-txt-and-wldr-powershell-stager-t1059-006
version: 1.0.0

info:
  name: pythonw running LICENSE.txt with MyApp Run-key and PythonLauncher task persistence
  description: >-
    Cisco Talos reports UAT-11795 using ClickFix-style HTA execution and trojanized NSIS
    installers for MobaXterm, WebEx, Zoom, DBeaver and FACEIT. The installer runs
    pythonw.exe against a file named LICENSE.txt, which is the Starland RAT. The HTA
    sets a Run value named MyApp that points back at mshta.exe, and scheduled tasks
    named PythonLauncher- with a suffix restart the RAT at logon with highest
    privileges. Starland then runs host and domain reconnaissance and brings in WLDR, a
    PowerShell implant fetched with curl and held in memory. WLDR's decode logic,
    runspace pool and polling are script content and HTTP paths, which are not collected
    here. Python given a .txt file to run, the Run value, the task name and the commands
    pythonw starts are all on process and registry events. H009 and H045 hold remote HTA
    execution in general.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - execution
    - persistence
    - python
    - starland-rat
    - wldr
    - uat-11795
    - mshta
    - trojanized-installer
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H239.md
    - https://attack.mitre.org/techniques/T1059
    - https://attack.mitre.org/techniques/T1059/006
    - https://attack.mitre.org/techniques/T1547/001
    - https://attack.mitre.org/detectionstrategies/DET0063
    - https://attack.mitre.org/detectionstrategies/DET0365
    - https://blog.talosintelligence.com/uat-11795-deploys-novel-starland-rat-and-bespoke-wldr-c2-implant-in-financially-motivated-campaign/

mitre:
  tactics:
    - TA0002
    - TA0003
    - TA0004
  techniques:
    - T1059
    - T1547
  sub_techniques:
    - T1059.006
    - T1547.001
  detection_strategies:
    - DET0063
    - DET0365
  analytics:
    - AN0172
    - AN1032
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - Windows Registry Key Modification

hypothesis:
  statement: >-
    An adversary uses a weaponized HTA and trojanized NSIS installer to launch Starland
    RAT through pythonw.exe and LICENSE.txt, then pulls WLDR PowerShell tasking for
    interactive control.
  attacker_behavior:
    - Has the user run mshta.exe against a remote HTA.
    - Sets a Run value named MyApp whose data starts mshta.exe again at logon.
    - Delivers an installer that runs pythonw.exe with LICENSE.txt as the script.
    - Registers a scheduled task named PythonLauncher- with a suffix, at logon, with highest privileges.
    - Runs whoami, systeminfo, net user /dom, nltest /dclist and WMI queries from the RAT.
    - Fetches the WLDR stager with curl and runs it in PowerShell.
  legitimate_behavior:
    - Installers bundle a Python runtime and run scripts with pythonw.exe.
    - Python applications are started by scheduled tasks and Run values.
    - Inventory agents written in Python run the same discovery commands.
  risk_indicator:
    - pythonw.exe is given a .txt file as its script.
    - A Run value named MyApp, or any Run value, starts mshta.exe.
    - A task named PythonLauncher- is created.
    - pythonw.exe starts domain reconnaissance commands.
    - curl output is piped into PowerShell after the RAT starts.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: python-running-a-text-file-as-script
        name: Python interpreter given a .txt, .dat or .log file as its script
        purpose: >-
          Return python.exe and pythonw.exe whose first argument is a file with a text
          or data extension, which is how LICENSE.txt is run. Python does not care about
          the extension; people and products name their scripts .py or .pyw. A script
          passed after interpreter switches such as -u is not matched by this pattern.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^pythonw?\.exe$/i
          | CommandLine=/pythonw?(\.exe)?["']?\s+("[^"]+\.(txt|dat|log)"|[^"\s-]\S*\.(txt|dat|log))(\s|$)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: run-value-starting-mshta
        name: Run value whose data starts mshta.exe
        purpose: >-
          Return Run values, under any name and in either hive, whose data runs mshta.
          The reported value is named MyApp; the test is on the data so a renamed value
          is still returned.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run\\?$/i
          | RegStringValue=/\bmshta(\.exe)?\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: run-value-named-myapp
        name: Run value named MyApp written
        purpose: >-
          Return writes of a Run value named exactly MyApp, with its data. The name is a
          common placeholder and sample applications use it; the data tells them apart.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run\\?$/i
          | RegValueName=/^MyApp$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-creating-pythonlauncher-task
        name: Command naming a PythonLauncher- task
        purpose: >-
          Return schtasks and PowerShell commands that name a task beginning
          PythonLauncher-. A task registered through the Task Scheduler API or by a
          cmdlet inside an existing PowerShell session starts no process and is not
          seen.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(schtasks|powershell|pwsh|cmd)\.exe$/i
          | CommandLine=/PythonLauncher-/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reconnaissance-started-by-pythonw
        name: Shell or discovery command started by pythonw.exe
        purpose: >-
          Return shells, discovery utilities and curl whose parent is pythonw.exe. A
          command run with shell=True has cmd.exe as its parent and pythonw one level
          up; the cmd.exe event is returned here with the command text, and the agent
          follows its process id to the utility.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^pythonw\.exe$/i
          | FileName=/^(cmd|powershell|pwsh|whoami|systeminfo|net|net1|nltest|wmic|curl)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: curl-output-run-by-powershell
        name: curl output piped into PowerShell
        purpose: >-
          Return command lines in which curl fetches from a URL and the result is piped
          to PowerShell or to iex, the reading taken here of the curl-launched stager
          Talos describes. A stager saved to disk first and run by a second command is
          not matched.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(cmd|powershell|pwsh)\.exe$/i
          | CommandLine=/curl(\.exe)?\s[^|]*https?:\/\/[^|]*\|\s*(powershell|pwsh|iex|Invoke-Expression)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: python_runs_text_file
      name: Python ran a text file as its script
      description: >-
        python.exe or pythonw.exe was started with a .txt, .dat or .log file as the
        script to run.
      source: process_creation
      field: command_line
      indicates: disguised_python_payload_execution

  supporting:
    - id: installer_parent
      name: Parent is an installer or a task
      description: >-
        The parent of pythonw.exe is a setup program, an NSIS stub or the Task Scheduler
        service.
      source: process_creation
      field: parent_process
      indicates: trojanized_installer_or_persistence_start
    - id: run_value_starts_mshta
      name: Run value starts mshta.exe
      description: >-
        A Run value's data runs mshta.exe.
      source: registry
      field: registry_data
      indicates: hta_logon_persistence
    - id: run_value_named_myapp
      name: Run value is named MyApp
      description: >-
        The Run value written is named MyApp.
      source: registry
      field: registry_value
      indicates: reported_persistence_name
    - id: pythonlauncher_task_command
      name: PythonLauncher- task named in a command
      description: >-
        A command names a scheduled task beginning PythonLauncher-.
      source: process_creation
      field: command_line
      indicates: scheduled_task_persistence
    - id: pythonw_child_reconnaissance
      name: pythonw.exe started reconnaissance
      description: >-
        pythonw.exe is the parent of a shell or a host and domain discovery command.
      source: process_creation
      field: image_name
      indicates: rat_driven_discovery
    - id: stager_fetched_and_run
      name: curl output run by PowerShell
      description: >-
        A command pipes a curl download into PowerShell.
      source: process_creation
      field: command_line
      indicates: second_implant_delivery

  contradicting:
    - id: vendor_python_application
      name: Script belongs to an installed Python application
      description: >-
        Asset records tie the Python runtime and the script path to an approved product
        that names its scripts this way.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software
    - id: recurring_python_job
      name: Same Python command recurs
      description: >-
        The same command line recurs on the host over weeks with no persistence change
        around it.
      source: baseline
      field: CommandLine
      indicates: routine_application_behaviour

  risk_logic:
    required:
      - python_runs_text_file

    supporting:
      any:
        - installer_parent
        - run_value_starts_mshta
        - run_value_named_myapp
        - pythonlauncher_task_command
        - pythonw_child_reconnaissance
        - stager_fetched_and_run
      all:
        - run_value_starts_mshta
        - pythonw_child_reconnaissance

    contradicting:
      any:
        - vendor_python_application
        - recurring_python_job
      all: []

  verdict:
    low_risk_when:
      - python_runs_text_file
      - vendor_python_application
      - recurring_python_job
    suspicious_when:
      - python_runs_text_file
      - installer_parent
    high_risk_when:
      - python_runs_text_file
      - pythonw_child_reconnaissance
      - run_value_starts_mshta

  false_positive:
    - condition: Python given a data file as an argument.
      explanation: >-
        A script can be run as python -m or with the script first and a data file after.
        The pattern needs the text file to be the first argument, but python some.txt
        used on purpose by a developer matches.
    - condition: Sample and tutorial applications that register MyApp.
      explanation: >-
        MyApp is a placeholder developers leave in. Its data points at their own
        executable, not at mshta.
    - condition: Inventory agents written in Python.
      explanation: >-
        They run whoami and systeminfo under pythonw on a schedule from a product
        directory.
