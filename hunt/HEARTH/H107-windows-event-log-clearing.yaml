# Converted from THORCollective/HEARTH Flames/H107.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h107-windows-event-log-clearing-t1685-005
version: 1.0.0

info:
  name: Windows event logs cleared with wevtutil, PowerShell or WMI
  description: >-
    Clearing the System, Application and Security logs is among the last things a
    ransomware operator does, and the ActiveMQ-to-LockBit intrusion ended that way.
    Windows records the clearing itself as event 1102 or 104, but Windows event channels
    are not collected here, so the hunt reads the command that did it: wevtutil with its
    clear verb, the PowerShell cmdlets and .NET methods that clear a log, the WMI method,
    and deletion of the .evtx files. A cmdlet typed into a PowerShell session that is
    already open starts no process and is not seen; a clear made from the Event Viewer
    console is not seen either.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - defense-impairment
    - event-log
    - wevtutil
    - indicator-removal
    - ransomware
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H107.md
    - https://attack.mitre.org/techniques/T1685
    - https://attack.mitre.org/techniques/T1685/005
    - https://attack.mitre.org/detectionstrategies/DET0532

mitre:
  tactics:
    - TA0112
  techniques:
    - T1685
  sub_techniques:
    - T1685.005
  detection_strategies:
    - DET0532
  analytics:
    - AN1472
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary is clearing Windows event logs using wevtutil, Clear-EventLog, or similar
    utilities to destroy forensic evidence of their intrusion activity after achieving
    their objectives.
  attacker_behavior:
    - Runs wevtutil cl against Security, System and Application.
    - Loops over every log wevtutil el lists and clears each one.
    - Calls Clear-EventLog, Remove-EventLog or the EventLogSession ClearLog method from PowerShell.
    - Uses the WMI ClearEventlog method through wmic.
    - Deletes the .evtx files under winevt\Logs after stopping the service.
  legitimate_behavior:
    - Imaging and sysprep scripts clear logs before a machine is captured.
    - Administrators clear a noisy application log during troubleshooting.
    - Some product installers reset their own log channel.
  risk_indicator:
    - The Security log is among those cleared.
    - Several logs are cleared within seconds from one parent process.
    - The command runs under an account or parent that does no administration.
    - The host shows shadow-copy deletion or mass file writes around the same time.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: wevtutil-clear-log
        name: wevtutil clearing a log
        purpose: >-
          Return wevtutil run with its cl or clear-log verb. The log name is on the
          command line.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^wevtutil\.exe$/i
          | CommandLine=/\s(cl|clear-log)\s/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: clear-all-logs-loop
        name: Loop that clears every log wevtutil lists
        purpose: >-
          Return cmd.exe and PowerShell commands that enumerate logs with wevtutil el and
          clear inside the loop. Each wevtutil cl the loop starts is also returned by the
          first case.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(cmd|powershell|pwsh)\.exe$/i
          | CommandLine=/wevtutil(\.exe)?"?\s+(el|enum-logs)\b/i
          | CommandLine=/\b(cl|clear-log)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: powershell-clear-eventlog
        name: PowerShell command line clearing or removing an event log
        purpose: >-
          Return PowerShell started with a command that clears or removes a log. Only a
          cmdlet passed on the command line is seen.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/Clear-EventLog|Remove-EventLog|\.ClearLog\(|ClearEventLog\(|\bClear-WinEvent\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: wmic-clear-eventlog
        name: wmic calling the event-log clear method
        purpose: >-
          Return wmic commands against the nteventlog class that call ClearEventlog.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^wmic\.exe$/i
          | CommandLine=/nteventlog/i
          | CommandLine=/cleareventlog/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: evtx-file-deletion-command
        name: Command deleting event-log files
        purpose: >-
          Return commands that delete files under winevt\Logs. The deletion is not a file
          event this deployment collects; only a delete issued as a command is seen.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(cmd|powershell|pwsh)\.exe$/i
          | CommandLine=/\\winevt\\Logs\\/i
          | CommandLine=/\b(del|erase|Remove-Item|rm|ri)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: log_clear_command
      name: Command that clears or deletes a Windows event log
      description: >-
        wevtutil, PowerShell, wmic or a shell ran with a verb, cmdlet or method that
        empties or removes an event log.
      source: process_creation
      field: command_line
      indicates: event_log_cleared

  supporting:
    - id: security_log_targeted
      name: Security log is among those cleared
      description: >-
        The command line names the Security log, or clears every log.
      source: process_creation
      field: command_line
      indicates: audit_trail_destroyed
    - id: several_logs_in_succession
      name: Several logs cleared from one parent within seconds
      description: >-
        Clear commands for different logs share a parent process id and fall within
        seconds of each other, which the agent derives from the returned events.
      source: process_creation
      field: parent_process_id
      indicates: scripted_log_wipe
    - id: unusual_parent_or_account
      name: Parent or account does no administration
      description: >-
        The parent is a remote-access tool, a script host or an application service, or
        the user is not an administrator of the host.
      source: process_creation
      field: parent_process
      indicates: clearing_outside_administration
    - id: impact_activity_nearby
      name: Recovery inhibition or mass writes on the host
      description: >-
        Other hunts show shadow-copy deletion, backup removal or bulk file writes on the
        same host around the clearing.
      source: process_creation
      field: host
      indicates: intrusion_cleanup_stage

  contradicting:
    - id: imaging_or_build_task
      name: Host is being imaged or built
      description: >-
        Change records show a sysprep, imaging or build task on the host at the time.
      source: change_management
      field: ComputerName
      indicates: provisioning_cleanup
    - id: recurring_maintenance_clear
      name: Same clear recurs as maintenance
      description: >-
        Earlier activity shows the same command against the same application log on a
        schedule.
      source: baseline
      field: CommandLine
      indicates: established_maintenance

  risk_logic:
    required:
      - log_clear_command

    supporting:
      any:
        - security_log_targeted
        - several_logs_in_succession
        - unusual_parent_or_account
        - impact_activity_nearby
      all:
        - security_log_targeted
        - several_logs_in_succession

    contradicting:
      any:
        - imaging_or_build_task
        - recurring_maintenance_clear
      all: []

  verdict:
    low_risk_when:
      - log_clear_command
      - imaging_or_build_task
    suspicious_when:
      - log_clear_command
      - security_log_targeted
    high_risk_when:
      - log_clear_command
      - security_log_targeted
      - several_logs_in_succession

  false_positive:
    - condition: Image preparation.
      explanation: >-
        Sysprep and capture scripts clear every log so the image starts empty. The host is
        a build machine and the task is in the change record.
    - condition: Troubleshooting a single application log.
      explanation: >-
        An administrator clears one noisy channel. The Security log is untouched and the
        account administers the host.
