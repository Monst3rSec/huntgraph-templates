# Converted from THORCollective/HEARTH Flames/H214.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h214-obfuscated-interpreter-command-lines-t1027-010
version: 1.0.0

info:
  name: Obfuscated PowerShell and cmd command lines, including encoded commands run through WMI
  description: >-
    The DFIR Report's BumbleBee to AdaptixC2 to Akira intrusion ran Base64-encoded
    PowerShell through WMI, wrote interpreter names in toggled case (pOWerShELl.exE,
    CmD.eXe) and rebuilt strings at run time, all to defeat matching on command lines.
    HEARTH's primary telemetry is PowerShell script block logging, which shows the text
    after decoding; it is not collected here. The command line is, and the obfuscation
    is itself visible on it: the encoded switch with a long blob, an interpreter name in
    a case nobody types, character arithmetic, format-operator reassembly, carets and
    substring expansion. The hunt returns those. What the encoded command does once
    decoded is for the agent to read from the blob on the event. The consent.exe
    side-load the report mentions is a module load and is not hunted.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - stealth
    - command-obfuscation
    - powershell
    - encoded-command
    - wmi
    - bumblebee
    - akira
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H214.md
    - https://attack.mitre.org/techniques/T1027/010
    - https://attack.mitre.org/detectionstrategies/DET0505
    - https://thedfirreport.com/2026/06/29/from-bing-search-to-ransomware-bumblebee-and-adaptixc2-deliver-akira-3/

mitre:
  tactics:
    - TA0005
  techniques:
    - T1027
  sub_techniques:
    - T1027.010
  detection_strategies:
    - DET0505
  analytics:
    - AN1394
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary evades command-line detection by executing obfuscated commands — Base64
    -e/-EncodedCommand PowerShell run via WMI, mixed-case pOWerShELl.exE/CmD.eXe
    interpreter names, and runtime string reconstruction — matching the
    BumbleBee→AdaptixC2→Akira tradecraft from the DFIR Report (SEO-poisoned MSI,
    consent.exe sideloading msimg32.dll).
  attacker_behavior:
    - Runs PowerShell with an encoded command through WMI on a remote host.
    - Writes the interpreter name in toggled case so a case-sensitive match misses it.
    - Builds strings from character codes, joins and the format operator at run time.
    - Breaks cmd keywords with carets and environment-variable substrings.
  legitimate_behavior:
    - Configuration management and endpoint agents run encoded PowerShell as SYSTEM.
    - Installers generate long command lines with the format operator.
    - Batch files escape special characters with a caret.
  risk_indicator:
    - The parent of the encoded command is WmiPrvSE.exe.
    - The interpreter name is in a case no shortcut, script or person produces.
    - Several obfuscation forms appear on one command line.
    - The decoded blob downloads, injects or disables a security tool.
    - The same blob runs on many hosts within minutes.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: encoded-command-started-through-wmi
        name: Encoded PowerShell command started by the WMI provider host
        purpose: >-
          Return PowerShell and cmd processes started by WmiPrvSE.exe whose command line
          carries an encoded-command switch and a Base64 blob. This is the remote
          execution form the report shows. Management tools that use WMI match; the blob
          on the event is what the agent decodes.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^WmiPrvSE\.exe$/i
          | FileName=/^(powershell|pwsh|cmd)\.exe$/i
          | CommandLine=/\s-e(c|n|nc|nco|ncod|ncode|ncoded|ncodedc\w*)?\s+[A-Za-z0-9+\/=]{40,}/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: long-encoded-powershell-command
        name: PowerShell started with a long encoded command by any parent
        purpose: >-
          Return PowerShell runs with an encoded command of 200 characters or more,
          whoever started them. Endpoint management agents are the bulk of this over a
          long window; the agent groups by parent and blob and keeps what is rare.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/\s-e(c|n|nc|nco|ncod|ncode|ncoded|ncodedc\w*)?\s+[A-Za-z0-9+\/=]{200,}/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: powershell-name-in-toggled-case
        name: PowerShell named in toggled case on the command line
        purpose: >-
          Return interpreter processes whose command line spells powershell in a case
          other than the four forms Windows, scripts and people produce. The test is two
          steps: any case first, then not one of the usual spellings. A command line
          that contains a usual spelling as well as a toggled one is not returned.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh|cmd)\.exe$/i
          | CommandLine=/powershell/i
          | CommandLine!=/powershell|PowerShell|POWERSHELL|Powershell/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: cmd-name-in-toggled-case
        name: cmd.exe named in toggled case on the command line
        purpose: >-
          The same two-step test for cmd.exe. Usual spellings are all lower, all upper
          and the capitalised forms.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh|cmd)\.exe$/i
          | CommandLine=/\bcmd\.exe\b/i
          | CommandLine!=/\b(cmd\.exe|CMD\.EXE|Cmd\.exe|CMD\.exe|cmd\.EXE|Cmd\.Exe)\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: powershell-runtime-string-reconstruction
        name: PowerShell command line rebuilding strings from characters or format placeholders
        purpose: >-
          Return PowerShell command lines with three or more character casts, a string
          join call, three or more format placeholders handed to the format operator, or
          four or more backtick escapes. Each is a way of keeping a keyword off the
          command line until it runs.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/(\[char\]\s*\(?\s*(0x)?[0-9a-f]+.*){3}|\[string\]::join|(\{\d+\}\s*){3,}['"]\s*-f\b|(`[a-zA-Z][^`]*){4}/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: cmd-caret-or-substring-obfuscation
        name: cmd.exe command line broken up with carets or variable substrings
        purpose: >-
          Return cmd command lines with four letters in a row each followed by a caret,
          or two environment-variable substring expansions. A single caret before a pipe
          or an ampersand is ordinary escaping and does not match.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^cmd\.exe$/i
          | CommandLine=/([a-z]\^){4}|%[a-z_0-9]+:~-?\d+(,-?\d+)?%.*%[a-z_0-9]+:~-?\d+(,-?\d+)?%/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: obfuscated_command_line
      name: Command line carries an obfuscation form
      description: >-
        The command line has an encoded command, an interpreter name in toggled case,
        run-time string reassembly, or caret or substring splitting.
      source: process_creation
      field: command_line
      indicates: command_obfuscation

  supporting:
    - id: started_through_wmi
      name: Started by the WMI provider host
      description: >-
        The parent is WmiPrvSE.exe, which is how a command issued remotely over WMI
        appears.
      source: process_creation
      field: parent_process
      indicates: remote_execution_through_wmi
    - id: decoded_content_is_hostile
      name: Decoded command downloads, injects or disables defences
      description: >-
        The Base64 blob on the command line decodes to a download, an in-memory load or
        a change to a security tool. The agent decodes it from the returned event.
      source: process_creation
      field: command_line
      indicates: malicious_payload_command
    - id: same_command_on_many_hosts
      name: Same command on several hosts
      description: >-
        The same command line appears on several hosts within a short interval. The
        agent derives the count from the returned events.
      source: process_creation
      field: host
      indicates: hands_on_keyboard_spread

  contradicting:
    - id: parent_is_management_agent
      name: Parent is a management or security agent
      description: >-
        The parent is a deployed configuration management, patching or endpoint agent
        that is documented to run encoded commands.
      source: asset_inventory
      field: ComputerName
      indicates: sanctioned_automation

  risk_logic:
    required:
      - obfuscated_command_line

    supporting:
      any:
        - started_through_wmi
        - decoded_content_is_hostile
        - same_command_on_many_hosts
      all:
        - started_through_wmi
        - decoded_content_is_hostile

    contradicting:
      any:
        - parent_is_management_agent
      all: []

  verdict:
    low_risk_when:
      - obfuscated_command_line
      - parent_is_management_agent
    suspicious_when:
      - obfuscated_command_line
      - started_through_wmi
    high_risk_when:
      - obfuscated_command_line
      - started_through_wmi
      - decoded_content_is_hostile

  false_positive:
    - condition: Configuration management runs encoded PowerShell.
      explanation: >-
        The parent is the agent, the blob is the same on every host and it decodes to
        inventory or policy code.
    - condition: Vendor installers use format strings and carets.
      explanation: >-
        The parent is the installer and the command is the same on every install of that
        product.
