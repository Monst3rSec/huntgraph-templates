# Converted from THORCollective/HEARTH Flames/H318.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# Kept at parent T1505: no sub-technique describes an Apache module. It fails the L2
# leaf check by design.
type: detection

id: hg-lin-hearth-h318-apache-module-compiled-and-enabled-on-web-server-t1505
version: 1.0.0

info:
  name: Apache module compiled on a Linux web server and added to its configuration
  description: >-
    After compromising a Linux web server the actor works out the distribution, compiles
    a module on the host from a source file named opsproxy.c and adds the resulting
    shared object to Apache with a LoadModule directive. The module runs inside every
    httpd worker, stays quiet for ordinary requests and rewrites the
    Content-Security-Policy header on paths beginning /wps, /bmw or /card so that
    injected SEO content can run. HEARTH's two invariants are a loaded module that no
    package owns and a policy header that differs between paths. Neither is visible
    here: a module loading into httpd is a Module Load event, package ownership is an
    rpm or dpkg audit, and the header is in HTTP responses. What the sensor does report
    is the work done to get the module there: the compiler or apxs run on a production
    web server, the shared object written into the modules directory, and the command
    that enables it. A module copied in ready-built and enabled by editing a file in an
    editor leaves only the file write.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - apache
    - server-software-component
    - web-server
    - seo-fraud
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H318.md
    - https://attack.mitre.org/techniques/T1505
    - https://attack.mitre.org/detectionstrategies/DET0547

mitre:
  tactics:
    - TA0003
  techniques:
    - T1505
  sub_techniques: []
  detection_strategies:
    - DET0547
  analytics:
    - AN1508
  platforms:
    - Linux
  data_sources:
    - auditd:SYSCALL
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An attacker who has compromised a Linux web server compiles a malicious Apache
    module on the host from a source file named opsproxy.c, adds the shared object to
    the Apache configuration with a LoadModule directive so it loads into every httpd
    worker, and uses it to rewrite the Content-Security-Policy header on selected URL
    paths to allow injected SEO content.
  attacker_behavior:
    - Identifies the distribution as Debian, Ubuntu, CentOS or Red Hat.
    - Compiles opsproxy.c into a shared object with gcc or apxs on the server.
    - Copies the shared object into the Apache modules directory.
    - Adds a LoadModule line or runs a2enmod, then restarts or reloads Apache.
    - Changes the file's timestamps to match its neighbours.
  legitimate_behavior:
    - Package managers install and upgrade Apache modules.
    - Administrators build a third-party module with apxs during a planned change.
    - Configuration management enables modules with a2enmod.
    - Build servers compile Apache modules as their job.
  risk_indicator:
    - A compiler or apxs runs on a production web server that has no build role.
    - The command line names opsproxy or Apache's header directory.
    - A shared object appears in the modules directory outside a package operation.
    - The compile, the copy and the enable command share one parent shell.
    - The parent chain leads to a web worker or an interactive session, not a package manager.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewExecutableWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: apxs-run-on-host
        name: Apache extension tool apxs run
        purpose: >-
          Return runs of apxs or apxs2, the tool that compiles and installs an Apache
          module. It is a Perl script, so it is matched on the command line and not the
          image name.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/(^|\/|\s)apxs2?(\s|$)/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: compiler-run-naming-apache-headers-or-reported-source
        name: Compiler or linker run that names Apache headers, a module source or opsproxy
        purpose: >-
          Return compiler, linker and make runs whose command line names the reported
          source file, Apache's include directory or a mod_ source or object. A module
          built without those names on the command line, for example from a Makefile in
          the working directory, shows only the bare make and is not returned.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(gcc|cc|cc1|g\+\+|clang|make|ld|collect2|libtool)(-[0-9.]+)?$/
          | CommandLine=/opsproxy|\/usr\/include\/(apache2|httpd)|-I\S*(apache2|httpd|apr-1)|\bmod_[a-z0-9_]+\.(c|so|la|lo|o)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: shared-object-written-into-apache-modules-directory
        name: Shared object written into an Apache modules directory
        purpose: >-
          Return shared objects created in the Debian and Red Hat module directories.
          Package installs write here too; the event carries the writing process id and
          the agent checks whether it belongs to dpkg, rpm or their front ends.
        query: |
          #event_simpleName=NewExecutableWritten
          | event_platform=Lin
          | TargetFileName=/^\/(usr\/lib(64)?\/(apache2|httpd)\/modules|etc\/httpd\/modules)\/[^\/]+\.so$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: apache-module-enabled-by-command
        name: Command enabling an Apache module or writing a LoadModule line
        purpose: >-
          Return a2enmod runs and shell or file-utility commands that name a LoadModule
          directive or a module load file. a2enmod is a Perl script and appears under
          perl. An edit made in an interactive editor names only the file, and is
          returned when the file is one of the module load files.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(perl[0-9.]*|sh|bash|dash|tee|sed|cp|mv|ln|install|python[0-9.]*|vi|vim|nano)$/
          | CommandLine=/\ba2enmod\b|LoadModule\s|\/(mods-enabled|mods-available|conf\.modules\.d)\/[^\s"']+\.(load|conf)\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: module_build_or_enable_command
      name: Apache module built or enabled by a command
      description: >-
        A command line runs apxs, compiles against Apache's headers, or enables a module
        through a2enmod or a LoadModule line.
      source: process_creation
      field: command_line
      indicates: web_server_module_installation

  supporting:
    - id: module_file_written
      name: Shared object created in the modules directory
      description: >-
        A .so file was written into an Apache modules directory.
      source: file_creation
      field: file_path
      indicates: module_binary_dropped
    - id: writer_not_package_manager
      name: Writer is not a package manager
      description: >-
        The process id that wrote the shared object does not belong to dpkg, rpm, apt,
        yum or dnf. The agent resolves the id against the process events.
      source: file_creation
      field: writer_process_id
      indicates: unpackaged_module
    - id: reported_source_name
      name: Command names opsproxy
      description: >-
        The command line contains the reported source or module name opsproxy.
      source: process_creation
      field: command_line
      indicates: known_campaign_artifact
    - id: build_on_production_web_server
      name: Compiler ran on a host with no build role
      description: >-
        The image is a compiler or linker and the host is a production web server.
      source: process_creation
      field: image_name
      indicates: compile_on_target
    - id: parent_is_web_worker_or_shell
      name: Parent is a web worker or an interactive shell
      description: >-
        The parent is apache2, httpd, php-fpm or an interactive shell, and not a package
        manager or a configuration-management agent.
      source: process_creation
      field: parent_process
      indicates: post_exploitation_activity
    - id: build_copy_enable_under_one_parent
      name: Build, copy and enable share one parent
      description: >-
        The compile, the copy into the modules directory and the enable command carry
        the same parent process id, which the agent derives from the returned events.
      source: process_creation
      field: parent_process_id
      indicates: single_operator_session

  contradicting:
    - id: planned_module_change
      name: Module build or enablement was a recorded change
      description: >-
        A change record covers the module, the host and the time.
      source: change_management
      field: ComputerName
      indicates: authorised_configuration_change
    - id: build_host_role
      name: Host is a build or packaging server
      description: >-
        The host compiles Apache modules as part of its role.
      source: asset_inventory
      field: ComputerName
      indicates: expected_build_activity

  risk_logic:
    required:
      - module_build_or_enable_command

    supporting:
      any:
        - module_file_written
        - writer_not_package_manager
        - reported_source_name
        - build_on_production_web_server
        - parent_is_web_worker_or_shell
        - build_copy_enable_under_one_parent
      all:
        - module_file_written
        - writer_not_package_manager

    contradicting:
      any:
        - planned_module_change
        - build_host_role
      all: []

  verdict:
    low_risk_when:
      - module_build_or_enable_command
      - planned_module_change
      - build_host_role
    suspicious_when:
      - module_build_or_enable_command
      - build_on_production_web_server
    high_risk_when:
      - module_build_or_enable_command
      - module_file_written
      - writer_not_package_manager
      - parent_is_web_worker_or_shell

  false_positive:
    - condition: Package installs and upgrades.
      explanation: >-
        apt, dnf and yum write shared objects into the modules directory and run a2enmod
        from maintainer scripts. The writer and the parent chain lead to the package
        manager.
    - condition: Third-party modules built by administrators.
      explanation: >-
        ModSecurity, mod_wsgi and vendor agents are sometimes built with apxs. The work
        is a planned change and the module name is the product's.
    - condition: Configuration management.
      explanation: >-
        Ansible, Puppet and Chef enable modules on every run; the parent is the agent.
