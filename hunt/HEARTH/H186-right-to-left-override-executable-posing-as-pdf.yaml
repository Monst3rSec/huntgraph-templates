# Converted from THORCollective/HEARTH Flames/H186.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h186-right-to-left-override-executable-posing-as-pdf-t1036-002
version: 1.0.0

info:
  name: Executable whose name carries a right-to-left override to pose as a PDF
  description: >-
    An SSA-themed phish reported by Deception.Pro in May 2026 delivered a RAR whose
    payload was named with the right-to-left override character, U+202E, so that fdp.exe
    at the end of the name is drawn as exe.pdf. Run, it used certutil to pull further
    tooling into C:\Users\Public. The character cannot be seen in a file listing but it
    is in the bytes of the path the sensor records for the process and for the
    executable as it is written. The hunt matches the character itself, the
    reversed-extension shape for sensors or pipelines that drop it, the children of such
    a process, and executables landing in the Public folders the report names.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - defense-evasion
    - masquerading
    - right-to-left-override
    - rtlo
    - phishing
    - certutil
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H186.md
    - https://attack.mitre.org/techniques/T1036
    - https://attack.mitre.org/techniques/T1036/002
    - https://attack.mitre.org/detectionstrategies/DET0527

mitre:
  tactics:
    - TA0005
  techniques:
    - T1036
  sub_techniques:
    - T1036.002
  detection_strategies:
    - DET0527
  analytics:
    - AN1461
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary delivers a malicious executable whose filename embeds the right-to-left
    override character (U+202E) so it renders as a PDF, tricking the user into running
    it; the file lands in a user-writable path (Downloads, Temp or an extracted RAR) and
    is the parent of follow-on staging activity.
  attacker_behavior:
    - Names an executable so that U+202E reverses the tail of the name into a document extension.
    - Delivers it inside a RAR attached to a phishing email.
    - Relies on the user opening what looks like a PDF.
    - Stages further tools with certutil -urlcache -split -f.
    - Writes payload.exe and stub.exe into the Public Documents and Downloads folders.
  legitimate_behavior:
    - File names in Arabic or Hebrew can contain directional marks.
    - Some installers write executables into Public folders.
    - A few product names happen to end in letters that read as a reversed extension.
  risk_indicator:
    - The image path of a process contains U+202E.
    - The name ends in a reversed document extension followed by .exe or .scr.
    - The parent is an archive tool, a mail client or Explorer.
    - The process starts certutil with -urlcache.
    - Executables appear in a Public folder afterwards.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: process-image-containing-rtlo
        name: Process whose image path contains U+202E
        purpose: >-
          Return processes whose image path carries the override character, matched on
          the code point and not on the drawn name.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ImageFileName=/\x{202E}/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: executable-written-with-rtlo-name
        name: Executable written with U+202E in its path
        purpose: >-
          Return executables written with the character in their path, which is the file
          leaving the archive before anyone runs it.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\x{202E}/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-line-naming-rtlo-file
        name: Command line containing U+202E or one of its encodings
        purpose: >-
          Return command lines that carry the character raw or percent-encoded, as when
          an archive tool or a shell is handed the file's name.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\x{202E}|%E2%80%AE/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: child-of-rtlo-named-process
        name: Process started by an RTLO-named parent
        purpose: >-
          Return everything such a process starts, which is where the certutil staging
          appears.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/\x{202E}/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reversed-document-extension-executable
        name: Executable name ending in a reversed document extension
        purpose: >-
          Return processes whose file name ends in a document extension spelt backwards
          followed by an executable extension. This catches the name when the control
          character has been stripped somewhere between the sensor and the search.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/(fdp|cod|xcod|slx|xslx|tpp|xtpp|gpj|gnp|txt|ftr)\.(exe|scr|com|pif)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: executable-written-to-public-documents-or-downloads
        name: Executable written into Public Documents or Public Downloads
        purpose: >-
          Return executables written into the two Public folders the report names as
          staging locations.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\Users\\Public\\(Documents|Downloads)\\[^\\]+\.(exe|dll|scr)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: rtlo_named_executable_run
      name: Executable with a right-to-left override in its name ran
      description: >-
        A process image path contains U+202E, or its name ends in a reversed document
        extension before .exe.
      source: process_creation
      field: image_path
      indicates: masqueraded_executable_run

  supporting:
    - id: rtlo_file_written
      name: RTLO-named executable written to disk
      description: >-
        An executable with U+202E in its path was written before the process started.
      source: file_creation
      field: file_path
      indicates: masqueraded_payload_delivered
    - id: opened_from_archive_or_mail
      name: Parent is an archive tool, mail client or Explorer
      description: >-
        The parent of the RTLO-named process is WinRAR, 7-Zip, Outlook or Explorer.
      source: process_creation
      field: parent_process
      indicates: user_opened_attachment
    - id: staging_child_process
      name: Process started a download utility
      description: >-
        The RTLO-named process starts certutil with -urlcache, or another download
        utility.
      source: process_creation
      field: command_line
      indicates: follow_on_tool_staging
    - id: payload_in_public_folder
      name: Executable staged in a Public folder
      description: >-
        An executable is written into Public Documents or Public Downloads after the
        process starts, which the agent derives by ordering the returned events.
      source: file_creation
      field: writer_process_id
      indicates: second_stage_staging

  contradicting:
    - id: bidirectional_language_name
      name: Name is genuine right-to-left text
      description: >-
        The surrounding characters are Arabic or Hebrew and the file's real extension
        matches its content.
      source: derived
      field: ImageFileName
      indicates: legitimate_bidirectional_text
    - id: authorised_phishing_exercise
      name: File belongs to a recorded phishing exercise
      description: >-
        A change record covers a simulation that used this file.
      source: change_management
      field: ComputerName
      indicates: authorised_security_test

  risk_logic:
    required:
      - rtlo_named_executable_run

    supporting:
      any:
        - rtlo_file_written
        - opened_from_archive_or_mail
        - staging_child_process
        - payload_in_public_folder
      all:
        - rtlo_file_written
        - staging_child_process

    contradicting:
      any:
        - bidirectional_language_name
        - authorised_phishing_exercise
      all: []

  verdict:
    low_risk_when:
      - rtlo_named_executable_run
      - bidirectional_language_name
      - authorised_phishing_exercise
    suspicious_when:
      - rtlo_named_executable_run
      - opened_from_archive_or_mail
    high_risk_when:
      - rtlo_named_executable_run
      - opened_from_archive_or_mail
      - staging_child_process
      - payload_in_public_folder

  false_positive:
    - condition: Right-to-left languages.
      explanation: >-
        Directional marks occur in real names, but U+202E before a reversed extension on
        an executable does not.
    - condition: A product name matches the reversed-extension shape.
      explanation: >-
        A name ending in txt.exe or cod.exe can be real. It runs from an installed path
        and is signed.
    - condition: Installers write to Public folders.
      explanation: >-
        Some games and tools do. The writer is a signed installer, not a process from
        Downloads.
