# Converted from THORCollective/HEARTH Flames/H087.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# Also holds H103 (TeamPCP: a compromised npm package whose lifecycle script fetches an
# infostealer) and H141 (install-time credential harvest sent to a telemetry-themed
# endpoint, with a bundled Bun runtime). Both are the same install-time behaviour; the
# last two cases were added for them.
type: detection

id: hg-any-hearth-h087-npm-preinstall-worm-credential-harvest-t1195-001
version: 1.1.0

info:
  name: npm preinstall script harvesting credentials and republishing packages
  description: >-
    Shai-Hulud v2 is a worm that lives in npm packages. A poisoned package's preinstall
    script runs as soon as a developer or a build job installs it, before any review is
    possible. It runs TruffleHog over the home directory, collects npm, GitHub and cloud
    tokens, then uses the stolen npm token to add the same hook to every package that
    developer maintains and publish new versions, and it carries a destructive fallback
    if it cannot spread. The registry side of this is not endpoint telemetry. The install
    side is: a package manager starting a secret scanner, a credential-store read or a
    publish, none of which an install should do.
  severity: critical
  author: huntgraph
  tags:
    - hearth
    - initial-access
    - credential-access
    - supply-chain
    - npm
    - worm
    - shai-hulud
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H087.md
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H103.md
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H141.md
    - https://attack.mitre.org/techniques/T1195
    - https://attack.mitre.org/techniques/T1195/001
    - https://attack.mitre.org/techniques/T1552
    - https://attack.mitre.org/techniques/T1552/001
    - https://attack.mitre.org/detectionstrategies/DET0009
    - https://attack.mitre.org/detectionstrategies/DET0307

mitre:
  tactics:
    - TA0001
    - TA0006
  techniques:
    - T1195
    - T1552
  sub_techniques:
    - T1195.001
    - T1552.001
  detection_strategies:
    - DET0009
    - DET0307
  analytics:
    - AN0021
    - AN0022
    - AN0023
    - AN0857
    - AN0858
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - WinEventLog:Sysmon
    - auditd:SYSCALL
    - auditd:EXECVE
    - macos:endpointsecurity
    - macos:unifiedlog
  data_components:
    - Process Creation
    - Command Execution

hypothesis:
  statement: >-
    An adversary is injecting malicious preinstall scripts into npm packages using stolen
    developer tokens, targeting software development organizations, to harvest
    credentials across cloud platforms and propagate through the software supply chain.
  attacker_behavior:
    - Publishes a new version of a legitimate package with a preinstall hook added.
    - Has the hook download a second runtime or scanner and run TruffleHog against the home directory.
    - Reads npm, GitHub, AWS, GCP and Azure credentials from files, environment and metadata endpoints.
    - Publishes the harvest to a public repository created under the victim's own account.
    - Republishes the victim's other packages with the hook, and wipes the home directory if it cannot.
  legitimate_behavior:
    - Packages with native code compile during install with node-gyp, make or a compiler.
    - Security teams and developers run secret scanners over repositories on purpose.
    - Release pipelines run npm publish from build agents.
  risk_indicator:
    - A secret scanner is started by node or a package manager during an install.
    - The scanner's target is a home directory and not a repository.
    - npm publish runs on a developer workstation outside a release.
    - An install script queries a cloud metadata address or lists cloud secrets.
    - A recursive delete of the home directory follows a failed publish.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: secret-scanner-started-by-package-runtime
        name: Secret scanner started by node or a package manager
        purpose: >-
          Return TruffleHog and similar scanners whose parent is a JavaScript runtime or
          package manager. Parent and command line are both narrow, so few events reach
          the second test.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(node|npm|npx|yarn|pnpm|bun|deno|sh|bash|cmd)(\.exe|\.cmd)?$/i
          | CommandLine=/\b(trufflehog|gitleaks|noseyparker)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: secret-scanner-over-home-directory
        name: Secret scanner pointed at a home directory or filesystem root
        purpose: >-
          Return scanner runs in filesystem mode against a home directory or the root,
          whoever started them, the target a worm chooses and a repository audit does
          not.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/\btrufflehog\b/i
          | CommandLine=/\bfilesystem\b\s+(--\S+\s+)*("?(\/|~|\$HOME|%USERPROFILE%|\/home\/[^\/\s]+|\/Users\/[^\/\s]+|[A-Za-z]:\\Users\\[^\\\s]+)\/?"?)(\s|$)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: install-script-cloud-credential-collection
        name: Package runtime child collecting cloud or registry credentials
        purpose: >-
          Return children of JavaScript runtimes that query a cloud metadata address,
          list cloud secrets or print registry and source-control tokens.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(node|npm|npx|yarn|pnpm|bun|deno)(\.exe|\.cmd)?$/i
          | CommandLine=/169\.254\.169\.254|metadata\.google\.internal|\baws\s+(sts|secretsmanager|configure\s+(list|export))|\bgcloud\s+(auth|secrets)\b|\baz\s+(account\s+get-access-token|keyvault)|\bgh\s+auth\s+token\b|\bnpm\s+(token|whoami|config\s+get\s+\S*auth)|\.npmrc|\.git-credentials|\.aws[\\\/]credentials|\.ssh[\\\/]id_[a-z0-9]+|\bprintenv\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: package-republish-or-destructive-fallback
        name: npm publish or recursive home deletion started by a package runtime
        purpose: >-
          Return the propagation step and the destructive fallback when a JavaScript
          runtime, not a person or a release job, starts them.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(node|bun|deno|sh|bash|cmd|powershell|pwsh)(\.exe)?$/i
          | CommandLine=/\bnpm(\.cmd)?"?\s+publish\b|\bgh\s+repo\s+create\b|\brm\s+-[a-z]*r[a-z]*f?[a-z]*\s+("?(~|\$HOME|\/home\/[^\/\s]+|\/Users\/[^\/\s]+)\/?"?)(\s|$)|\b(del|rd|rmdir)\s+\/s\s+\/q\s+"?%USERPROFILE%|shred\s+-/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: install-lifecycle-fetch-and-run
        name: Package manager child that fetches and runs a payload or installs a user service
        purpose: >-
          Return children of a package runtime that download and execute, decode and
          execute, or register a user service, the infostealer form of the same
          lifecycle script. A script that does everything inside node starts no process
          and is not seen.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(node|npm|npx|yarn|pnpm|bun|deno)(\.exe|\.cmd)?$/i
          | CommandLine=/(curl|wget)\s[^|;]*\|\s*(ba|z|da)?sh\b|base64\s+(-d|--decode|-D)[^|]*\|\s*(ba|z)?sh\b|\bIEX\b|Invoke-Expression|DownloadString|\s-e(nc|ncodedcommand)?\s+[A-Za-z0-9+\/=]{40,}|systemctl\s+--user\s+(enable|start)|\/dev\/tcp\//i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: secondary-runtime-fetched-by-package-script
        name: Package script downloading the Bun runtime or contacting the reported endpoint
        purpose: >-
          Return children of a package manager or its shell that download the Bun
          runtime or name the endpoint H141 reports. A hook that fetches Bun through
          Node's own HTTP client starts no process and is not seen.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(node|npm|npx|yarn|pnpm|sh|bash|cmd|powershell|pwsh)(\.exe|\.cmd)?$/i
          | CommandLine=/oven-sh\/bun\/releases|bun\.sh\/install|audit\.checkmarx\.cx/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: install_time_credential_harvest
      name: Package install starting a credential harvest
      description: >-
        A JavaScript runtime or package manager starts a secret scanner, queries cloud
        credentials, or reads registry and source-control tokens.
      source: process_creation
      field: command_line
      indicates: credential_harvest_by_install_script

  supporting:
    - id: package_runtime_parent
      name: Parent is a package manager or JavaScript runtime
      description: >-
        The parent process is node, npm, bun or another package runtime, placing the
        command inside an install or a script it ran.
      source: process_creation
      field: parent_process
      indicates: dependency_initiated_execution
    - id: home_directory_scanned
      name: Scanner target is a home directory
      description: >-
        The scanner's filesystem target is a user's home directory or the root, not a
        repository path.
      source: process_creation
      field: command_line
      indicates: broad_secret_sweep
    - id: republish_or_wipe
      name: Publish or destructive command follows
      description: >-
        The same parent chain runs npm publish, creates a repository, or recursively
        deletes the home directory, which the agent links through parent process ids.
      source: process_creation
      field: parent_process_id
      indicates: worm_propagation_or_destruction
    - id: developer_or_build_identity
      name: Account holds publishing or cloud credentials
      description: >-
        The user is a package maintainer, a developer with cloud access or a build
        service account.
      source: process_creation
      field: user
      indicates: high_value_credentials_exposed
    - id: payload_retrieval_from_install_script
      name: Install script fetched and ran a payload
      description: >-
        A child of the package runtime downloads and executes content, registers a user
        service, or fetches a second JavaScript runtime during the install.
      source: process_creation
      field: command_line
      indicates: payload_retrieval_from_install_script

  contradicting:
    - id: sanctioned_secret_scan
      name: Scan is a sanctioned security job
      description: >-
        A pipeline definition or change record shows the secret scan is part of the
        organisation's own checks for that repository.
      source: change_management
      field: ComputerName
      indicates: authorised_security_testing
    - id: release_pipeline_host
      name: Host is a release build agent
      description: >-
        Asset records class the host as a release agent where npm publish is the job's
        purpose.
      source: asset_inventory
      field: ComputerName
      indicates: expected_release_activity

  risk_logic:
    required:
      - install_time_credential_harvest

    supporting:
      any:
        - package_runtime_parent
        - home_directory_scanned
        - republish_or_wipe
        - developer_or_build_identity
        - payload_retrieval_from_install_script
      all:
        - package_runtime_parent
        - home_directory_scanned

    contradicting:
      any:
        - sanctioned_secret_scan
        - release_pipeline_host
      all: []

  verdict:
    low_risk_when:
      - install_time_credential_harvest
      - sanctioned_secret_scan
    suspicious_when:
      - install_time_credential_harvest
      - package_runtime_parent
    high_risk_when:
      - install_time_credential_harvest
      - package_runtime_parent
      - home_directory_scanned
      - republish_or_wipe

  false_positive:
    - condition: A security pipeline runs TruffleHog.
      explanation: >-
        Scanners in pipelines are often started through npx or a node wrapper. They scan
        the checked-out repository, on a build agent, as a defined job.
    - condition: Deployment scripts in package.json call cloud tools.
      explanation: >-
        npm run deploy commonly invokes aws, gcloud or az. Those scripts are the
        project's own, run on request, and do not print tokens or query metadata
        addresses.
    - condition: Release jobs run npm publish.
      explanation: >-
        Publishing from a build agent under a release account is the normal path. A
        publish from a developer workstation during an install is not.
