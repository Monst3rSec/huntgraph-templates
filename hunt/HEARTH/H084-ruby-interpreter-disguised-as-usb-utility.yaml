# Converted from THORCollective/HEARTH Flames/H084.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h084-ruby-interpreter-disguised-as-usb-utility-t1091
version: 1.0.0

info:
  name: Ruby interpreter disguised as a USB utility relaying across an air gap
  description: >-
    APT37's RubyJumper toolset installs a full Ruby 3.3.0 runtime under the name
    usbspeed.exe and hijacks RubyGems' operating_system.rb so its code loads whenever
    that interpreter starts. It then watches for removable drives, keeps hidden
    directories on them, and uses each drive as a courier: commands travel in to
    air-gapped machines and collected data travels out. The sensor does not report
    removable-media mounts in this deployment, so the drive itself is not seen. A Ruby
    interpreter under another name, Ruby running from a directory where nothing
    installed it, and a start-up file written into its RubyGems defaults are.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - initial-access
    - lateral-movement
    - removable-media
    - air-gap
    - apt37
    - rubyjumper
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H084.md
    - https://attack.mitre.org/techniques/T1091
    - https://attack.mitre.org/detectionstrategies/DET0301

mitre:
  tactics:
    - TA0001
    - TA0008
  techniques:
    - T1091
  sub_techniques: []
  detection_strategies:
    - DET0301
  analytics:
    - AN0841
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An adversary is deploying a malicious Ruby interpreter disguised as a legitimate USB
    utility on removable media, targeting air-gapped networks in critical infrastructure
    and research sectors, to establish a bidirectional covert command-and-control relay
    that bridges isolated network segments for data exfiltration and command delivery.
  attacker_behavior:
    - Installs a Ruby runtime in ProgramData or a user profile with the interpreter renamed usbspeed.exe.
    - Replaces operating_system.rb in the RubyGems defaults so its script loads at every start.
    - Creates a scheduled task that runs the disguised interpreter every few minutes.
    - Creates hidden directories on each removable drive and copies command and data files through them.
    - Runs shell commands delivered on the drive and stages the output for the return trip.
  legitimate_behavior:
    - Developers install Ruby under a version manager or a standard install directory.
    - Some applications bundle a Ruby runtime inside their own program folder.
    - Real USB benchmarking utilities exist under similar names.
  risk_indicator:
    - A process named after a USB utility is in fact a Ruby interpreter, or runs with Ruby arguments.
    - ruby.exe or rubyw.exe runs from ProgramData, Temp or a profile with no version manager.
    - operating_system.rb is written under a rubygems defaults directory.
    - The interpreter is started by the task scheduler at short intervals.
    - It starts cmd, PowerShell or discovery tools.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: usbspeed-process-executed
        name: Process named usbspeed.exe executed
        purpose: >-
          Return runs of the disguised interpreter by the name reported for it. The match
          is exact and cheap.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^usbspeed\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ruby-interpreter-from-unusual-path
        name: Ruby interpreter running from ProgramData, Temp or a bare profile path
        purpose: >-
          Return ruby.exe and rubyw.exe whose image path is not a standard install or a
          version manager's directory, which finds the runtime if it keeps its name.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^rubyw?\.exe$/i
          | ImageFileName=/\\(ProgramData|Windows\\Temp|Users\\Public|Users\\[^\\]+\\AppData\\(Local\\Temp|Roaming))\\/i
          | ImageFileName!=/\\(rbenv|uru|chocolatey|scoop|RubyInstaller)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: rubygems-startup-file-written
        name: operating_system.rb written under a RubyGems defaults directory
        purpose: >-
          Return the hijack file being created. The path ends in a fixed name, so the
          match is exact.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/\\rubygems\\defaults\\operating_system\.rb$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: non-ruby-named-process-with-ruby-arguments
        name: Process with Ruby arguments whose name is not ruby
        purpose: >-
          Return processes given a .rb script or Ruby's -e and -r options although the
          image is not called ruby, the general form of a renamed interpreter.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\.exe"?\s+("[^"]+\.rb"|\S+\.rb)(\s|$)|\.exe"?\s+-r\s*\S+\s+-e\s/i
          | FileName!=/^(rubyw?|jruby|irb|bundle|gem|rake|rails)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: disguised_ruby_runtime
      name: Ruby runtime disguised or run from an unusual path
      description: >-
        A process event shows usbspeed.exe, a Ruby interpreter under ProgramData, Temp
        or a profile, or a non-Ruby-named image given Ruby arguments.
      source: process_creation
      field: image_path
      indicates: masqueraded_script_interpreter

  supporting:
    - id: rubygems_hijack_file
      name: RubyGems start-up file written
      description: >-
        A script-written event records operating_system.rb under a rubygems defaults
        directory, which loads on every interpreter start.
      source: file_creation
      field: file_path
      indicates: interpreter_startup_hijack
    - id: scheduled_task_parent
      name: Interpreter started by the task scheduler
      description: >-
        The parent is the scheduled-task host, starting the interpreter at short regular
        intervals.
      source: process_creation
      field: parent_process
      indicates: scheduled_persistence
    - id: ruby_script_arguments
      name: Command line carries Ruby script arguments
      description: >-
        The disguised process is given a .rb script or inline Ruby options.
      source: process_creation
      field: command_line
      indicates: interpreter_identity_confirmed
    - id: isolated_network_user
      name: Host or user is in an isolated or research environment
      description: >-
        The account or host belongs to an air-gapped, research or critical
        infrastructure segment.
      source: process_creation
      field: user
      indicates: targeted_victim_profile

  contradicting:
    - id: developer_ruby_install
      name: Host has a developer Ruby installation
      description: >-
        Asset records show Ruby installed for development on the host, under the path
        observed.
      source: asset_inventory
      field: ComputerName
      indicates: expected_development_activity
    - id: bundled_runtime_known
      name: Runtime is bundled with installed software
      description: >-
        Earlier activity shows the same interpreter path and hash started by the same
        application on many hosts.
      source: baseline
      field: ImageFileName
      indicates: established_software_behaviour

  risk_logic:
    required:
      - disguised_ruby_runtime

    supporting:
      any:
        - rubygems_hijack_file
        - scheduled_task_parent
        - ruby_script_arguments
        - isolated_network_user
      all:
        - rubygems_hijack_file
        - scheduled_task_parent

    contradicting:
      any:
        - developer_ruby_install
        - bundled_runtime_known
      all: []

  verdict:
    low_risk_when:
      - disguised_ruby_runtime
      - developer_ruby_install
      - bundled_runtime_known
    suspicious_when:
      - disguised_ruby_runtime
      - scheduled_task_parent
    high_risk_when:
      - disguised_ruby_runtime
      - scheduled_task_parent
      - rubygems_hijack_file

  false_positive:
    - condition: A real USB benchmarking utility uses the same name.
      explanation: >-
        A genuine tool with this name is a small signed program run by a user. It takes
        no Ruby arguments and sits in a download or program folder, not beside a Ruby
        runtime.
    - condition: Software bundles Ruby under ProgramData.
      explanation: >-
        Some management and build products ship a private Ruby there. The parent is the
        product's service and the path is the same across the fleet.
    - condition: RubyGems packaging writes operating_system.rb.
      explanation: >-
        Distribution packages of Ruby include this file legitimately. It is written once
        by the installer into the standard Ruby directory.
