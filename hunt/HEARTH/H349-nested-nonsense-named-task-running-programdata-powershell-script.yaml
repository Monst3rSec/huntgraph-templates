# Converted from THORCollective/HEARTH Flames/H349.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH also cites T1059.001 and T1027. Task registration event 4698 and the task
# XML, with its description, are not collected; a task registered through the
# scheduler's COM interface is seen only when it runs.
type: detection

id: hg-win-hearth-h349-nested-nonsense-named-task-running-programdata-powershell-script-t1053-005
version: 1.0.0

info:
  name: Scheduled task nested under invented folder names running a PowerShell script from ProgramData
  description: >-
    In an INC Ransom intrusion the first foothold was a scheduled task registered at
    \Nonweighise\Cancellationizing\Illuminateers, with a description made of invented
    words, running an obfuscated script at C:\ProgramData\Vendettister\jocularities.ps1.
    Seventeen days passed before a second set of activity deployed ransomware to at
    least 175 endpoints, which Huntress reads as an access broker handing over to an
    affiliate. The names are real word stems with extra suffixes, so they pass entropy
    checks and still belong to no vendor. The task's description and registration record
    are not available to the sensor. The hunt returns task creation commands with a path
    two or more folders deep, PowerShell started by the scheduler against a script in a
    one-level ProgramData folder, and such scripts being written.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - scheduled-task
    - powershell
    - programdata
    - inc-ransom
    - initial-access-broker
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H349.md
    - https://attack.mitre.org/techniques/T1053
    - https://attack.mitre.org/techniques/T1053/005
    - https://attack.mitre.org/detectionstrategies/DET0441

mitre:
  tactics:
    - TA0002
    - TA0003
    - TA0004
  techniques:
    - T1053
  sub_techniques:
    - T1053.005
  detection_strategies:
    - DET0441
  analytics:
    - AN1221
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An intruder is persisting on Windows hosts with a scheduled task registered under a
    multi-level folder path built from generated pseudo-words, carrying a word-salad
    description, and executing an obfuscated PowerShell script from a similarly-named
    directory directly under C:\ProgramData, so tasks whose folder path belongs to no
    installed vendor and whose action runs a .ps1 out of a single-purpose ProgramData
    subfolder expose the foothold, which can sit in place for weeks before the
    ransomware stage.
  attacker_behavior:
    - Creates a folder directly under ProgramData with an invented name and writes one script into it.
    - Registers a task two or three folders deep under names no vendor uses.
    - Sets the task action to PowerShell with the script as its file.
    - Leaves the task running for weeks before any further activity.
  legitimate_behavior:
    - Vendors register tasks under their own folder, usually one level deep.
    - Management agents keep scripts in a ProgramData folder named after the product.
    - Administrators schedule PowerShell scripts from a scripts share or an admin folder.
  risk_indicator:
    - The task path has two or more folder levels and none is Microsoft or an installed vendor.
    - The folder and script names are word-like and match no product.
    - The ProgramData folder holds the script and nothing else.
    - The script was written by PowerShell or a remote session and not by an installer.
    - The task runs as SYSTEM or a service account on a server.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: task-created-under-nested-folder-path
        name: schtasks creating a task two or more folders deep
        purpose: >-
          Return schtasks /create commands whose task name has at least two folder
          levels and does not start under \Microsoft. The full task path and action are
          on the command line.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^schtasks\.exe$/i
          | CommandLine=/\/create\b/i
          | CommandLine=/\/tn\s+"?\\?[^\\"\/]+\\[^\\"\/]+\\[^\\"\/]+/i
          | CommandLine!=/\/tn\s+"?\\?Microsoft\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: task-registered-by-powershell-under-nested-path
        name: PowerShell registering a task with a nested task path
        purpose: >-
          Return PowerShell command lines that register a task and give a task path of
          two or more levels. A registration typed into an open session, or made through
          the scheduler's COM interface by a program, starts no process and is not seen
          here.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/Register-ScheduledTask/i
          | CommandLine=/-TaskPath\s+["']?\\?[^\\"'\s]+\\[^\\"'\s]+/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: scheduler-started-powershell-script-from-programdata-subfolder
        name: Task Scheduler starting PowerShell against a script one folder below ProgramData
        purpose: >-
          Return PowerShell started by the Task Scheduler service whose command line
          names a .ps1 exactly one folder below ProgramData. This is the task firing and
          it is seen however the task was registered. The task name is not on this
          event.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | ParentBaseFileName=/^(svchost|taskeng|taskhostw)\.exe$/i
          | CommandLine=/[a-z]:\\ProgramData\\[^\\"\s]+\\[^\\"\s]+\.ps1\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: script-written-one-folder-below-programdata
        name: PowerShell script written one folder below ProgramData
        purpose: >-
          Return .ps1 files written exactly one folder below ProgramData, with the
          writing process, leaving out Microsoft's own folder and the package caches.
          Product folders are returned and repeat across hosts; an invented folder name
          appears on one or a few.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/\\ProgramData\\[^\\]+\\[^\\]+\.ps1$/i
          | TargetFileName!=/\\ProgramData\\(Microsoft|chocolatey|Package Cache|Packages)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: task_runs_programdata_script
      name: Scheduled PowerShell script in a one-level ProgramData folder
      description: >-
        A task creation command or a PowerShell process started by the Task Scheduler
        names a .ps1 one folder below ProgramData.
      source: process_creation
      field: command_line
      indicates: scheduled_script_persistence

  supporting:
    - id: nested_task_path
      name: Task path is two or more folders deep outside Microsoft
      description: >-
        The task name on a creation command has at least two folder levels and none
        belongs to Microsoft or an installed vendor.
      source: process_creation
      field: command_line
      indicates: task_hidden_in_invented_folders
    - id: script_written_to_new_folder
      name: Script written into a ProgramData folder of its own
      description: >-
        A .ps1 was written one folder below ProgramData in a folder whose name matches
        no installed product.
      source: file_creation
      field: file_path
      indicates: single_purpose_staging_folder
    - id: script_writer_not_installer
      name: Script writer is a shell or remote session process
      description: >-
        The writing process is PowerShell, cmd, a remote-management agent or a script
        host and not an installer.
      source: file_creation
      field: writer_process_name
      indicates: hands_on_staging
    - id: folder_name_rare
      name: Folder name appears on few hosts
      description: >-
        The ProgramData folder name is seen on one or a few hosts, which the agent
        counts from the returned events.
      source: file_creation
      field: host
      indicates: rare_folder_name
    - id: task_runs_on_schedule_for_weeks
      name: Script runs repeatedly over a long period
      description: >-
        The same script path is started by the scheduler again and again across days or
        weeks, by the agent's reading of event times.
      source: process_creation
      field: process_id
      indicates: dormant_foothold

  contradicting:
    - id: vendor_task_and_folder
      name: Task and folder belong to an installed product
      description: >-
        The folder under ProgramData and the task folder carry the name of a product
        installed on the host.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software
    - id: script_common_in_estate
      name: Same script path runs on many hosts
      description: >-
        Earlier activity shows the same path scheduled on most hosts by a management
        tool.
      source: baseline
      field: CommandLine
      indicates: established_scheduled_job

  risk_logic:
    required:
      - task_runs_programdata_script

    supporting:
      any:
        - nested_task_path
        - script_written_to_new_folder
        - script_writer_not_installer
        - folder_name_rare
        - task_runs_on_schedule_for_weeks
      all:
        - script_written_to_new_folder
        - folder_name_rare

    contradicting:
      any:
        - vendor_task_and_folder
        - script_common_in_estate
      all: []

  verdict:
    low_risk_when:
      - task_runs_programdata_script
      - vendor_task_and_folder
      - script_common_in_estate
    suspicious_when:
      - task_runs_programdata_script
      - folder_name_rare
    high_risk_when:
      - task_runs_programdata_script
      - nested_task_path
      - folder_name_rare

  false_positive:
    - condition: A management agent schedules its own scripts from ProgramData.
      explanation: >-
        The folder is named after the agent, the same path is on every managed host and
        the installer wrote the script.
    - condition: An administrator files tasks under nested folders.
      explanation: >-
        The folder names are the organisation's or a team's, and the script lives in an
        admin scripts directory.
