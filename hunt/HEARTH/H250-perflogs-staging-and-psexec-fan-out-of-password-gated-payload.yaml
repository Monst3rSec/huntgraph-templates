# Converted from THORCollective/HEARTH Flames/H250.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h250-perflogs-staging-and-psexec-fan-out-of-password-gated-payload-t1569-002
version: 1.0.0

info:
  name: "Payload staged in C:\\PerfLogs and pushed with PsExec under a password argument"
  description: >-
    In the Qilin intrusions Arctic Wolf describes, the operators arrive with
    administrative credentials, dump LSASS with comsvcs.dll and take an NTDS
    install-from-media copy, then place the encryptor as C:\PerfLogs\win.exe, add a Run
    value whose name starts with an asterisk, and use PsExec across administrative
    shares to start it with --password and --no-admin arguments. PerfLogs is an empty
    system folder that nothing executes from. The LSASS dump, the NTDS copy and the log
    clearing are H108, H116 and H107; this template hunts the staging folder, the
    password-gated arguments, the Run value and the PsExec service starting the payload.
  severity: critical
  author: huntgraph
  tags:
    - hearth
    - ransomware
    - qilin
    - lateral-movement
    - psexec
    - perflogs
    - staging
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H250.md
    - https://attack.mitre.org/techniques/T1570
    - https://attack.mitre.org/techniques/T1569
    - https://attack.mitre.org/techniques/T1569/002
    - https://attack.mitre.org/detectionstrategies/DET0183
    - https://attack.mitre.org/detectionstrategies/DET0421

mitre:
  tactics:
    - TA0008
    - TA0002
  techniques:
    - T1570
    - T1569
  sub_techniques:
    - T1569.002
  detection_strategies:
    - DET0183
    - DET0421
  analytics:
    - AN0516
    - AN1185
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An adversary with stolen administrative credentials dumps LSASS and NTDS, stages
    C:\PerfLogs\win.exe, then uses PsExec over administrative shares to launch Qilin
    with password-gated arguments.
  attacker_behavior:
    - "Copies the encryptor to C:\\PerfLogs\\win.exe, or to \\\\host\\c$\\Windows\\Temp\\win.exe on targets."
    - Adds a Run value named with an asterisk and six letters that starts the encryptor.
    - Runs PsExec against many hosts so PSEXESVC.exe starts the payload on each.
    - Passes --password and --no-admin so the binary does nothing without the key.
  legitimate_behavior:
    - "Performance Monitor writes data collector logs, not executables, into PerfLogs."
    - Administrators use PsExec for software deployment and support.
    - Some command-line tools take a --password argument.
  risk_indicator:
    - Any executable is written to or runs from PerfLogs.
    - A command line carries --password together with --no-admin.
    - PSEXESVC.exe starts a binary from PerfLogs or the Windows Temp folder.
    - A Run value begins with an asterisk or points into PerfLogs.
    - The same payload path appears on many hosts within minutes.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: process-running-from-perflogs
        name: Process running from the PerfLogs folder
        purpose: >-
          Return every process whose image is under PerfLogs, with its parent and
          arguments.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ImageFileName=/\\PerfLogs\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: executable-written-to-perflogs
        name: Executable written to PerfLogs or as win.exe in Windows Temp
        purpose: >-
          Return executables written under PerfLogs on any host, and the reported
          win.exe name in the Windows Temp folder, where the copy over the c$ share
          lands on a target. The share access itself is not collected.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\PerfLogs\\|\\Windows\\Temp\\win\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: perflogs-path-on-command-line
        name: Command line naming an executable or script in PerfLogs
        purpose: >-
          Return commands that name a file in PerfLogs: the PsExec client on the source
          host, cmd.exe starting the payload, a copy to a remote share. Every Windows
          process event is tested against the regex.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\\PerfLogs\\[^"\s]+\.(exe|dll|bat|cmd|ps1)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: password-gated-payload-arguments
        name: Process started with password and no-admin arguments
        purpose: >-
          Return processes whose arguments carry both a password switch and no-admin,
          whatever the binary is called and wherever it sits.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\s--?password[\s=]/i
          | CommandLine=/\s--?no-admin\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: payload-started-by-psexec-service
        name: PsExec service starting a staged payload
        purpose: >-
          Return children of PSEXESVC.exe that run from PerfLogs or the Windows Temp
          folder or carry a password switch. A service renamed with PsExec's -r option
          has another parent name; the first and fourth cases still return its child.
          Fan-out is counted by the agent from the hosts returned.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^PSEXESVC\.exe$/i
          | CommandLine=/\\(PerfLogs|Windows\\Temp)\\[^"\s]+\.exe|\s--?password[\s=]/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: run-value-with-asterisk-prefix
        name: Run value named with an asterisk and six letters
        purpose: >-
          Return Run-key values whose name is an asterisk followed by six letters, the
          shape reported.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run\\?$/i
          | RegValueName=/^\*[a-z]{6}$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: run-value-pointing-into-perflogs
        name: Run value whose data points into PerfLogs
        purpose: >-
          Return Run and RunOnce values whose data names a path under PerfLogs.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run(Once)?\\?$/i
          | RegStringValue=/\\PerfLogs\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: payload_in_perflogs_or_password_gated
      name: Staged payload executed
      description: >-
        A process runs from PerfLogs, is named on a command line there, or is started
        with password and no-admin arguments.
      source: process_creation
      field: command_line
      indicates: ransomware_payload_execution

  supporting:
    - id: psexec_service_parent
      name: Parent is the PsExec service
      description: >-
        The parent of the payload is PSEXESVC.exe.
      source: process_creation
      field: parent_process
      indicates: remote_service_execution
    - id: executable_staged
      name: Executable written to the staging folder
      description: >-
        An executable was written under PerfLogs or as win.exe in the Windows Temp
        folder.
      source: file_creation
      field: file_path
      indicates: payload_staging
    - id: asterisk_run_value
      name: Run value with an asterisk name
      description: >-
        A Run value named with an asterisk and six letters was written.
      source: registry
      field: registry_value
      indicates: ransomware_persistence
    - id: run_value_data
      name: Run value starts the staged payload
      description: >-
        The data of the Run value names the payload in PerfLogs.
      source: registry
      field: registry_data
      indicates: ransomware_persistence
    - id: many_hosts
      name: Same payload on many hosts
      description: >-
        The same payload path or arguments appear on several hosts within minutes. The
        agent counts the hosts in the returned events.
      source: process_creation
      field: host
      indicates: fan_out_deployment
    - id: image_in_perflogs
      name: Image path is under PerfLogs
      description: >-
        The image of the running process is under PerfLogs.
      source: process_creation
      field: image_path
      indicates: execution_from_staging_folder

  contradicting:
    - id: deployment_tool_job
      name: Run is an approved deployment job
      description: >-
        The PsExec run matches a change record and the binary is an approved installer.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software_deployment
    - id: known_tool_with_password_switch
      name: Binary is a known tool that takes a password
      description: >-
        The process is a signed backup or database tool whose documented arguments
        include a password.
      source: baseline
      field: ImageFileName
      indicates: legitimate_password_argument

  risk_logic:
    required:
      - payload_in_perflogs_or_password_gated

    supporting:
      any:
        - psexec_service_parent
        - executable_staged
        - asterisk_run_value
        - run_value_data
        - many_hosts
        - image_in_perflogs
      all:
        - psexec_service_parent
        - many_hosts

    contradicting:
      any:
        - deployment_tool_job
        - known_tool_with_password_switch
      all: []

  verdict:
    low_risk_when:
      - payload_in_perflogs_or_password_gated
      - deployment_tool_job
      - known_tool_with_password_switch
    suspicious_when:
      - payload_in_perflogs_or_password_gated
      - executable_staged
    high_risk_when:
      - payload_in_perflogs_or_password_gated
      - psexec_service_parent
      - many_hosts

  false_positive:
    - condition: Tools that take a --password argument.
      explanation: >-
        Backup, database and archive tools do. They do not also take --no-admin and do
        not run from PerfLogs.
    - condition: PsExec software deployment.
      explanation: >-
        Support teams push installers with PsExec. The binary is signed, comes from a
        distribution share and follows a change record.
    - condition: Performance Monitor data collector sets.
      explanation: >-
        They write logs under PerfLogs and no executable.
