# Converted from THORCollective/HEARTH Flames/H054.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-mac-hearth-h054-applescript-with-fake-document-extension-t1553-001
version: 1.0.0

info:
  name: Compiled AppleScript with a fake document extension opened in Script Editor
  description: >-
    A file named report.docx.scpt, given a Word icon through its resource fork, looks
    like a document in Finder. Opening it starts Script Editor, and running the script
    from there executes it without the Gatekeeper prompt a downloaded application would
    get. The technique began with BlueNoroff and is now used by commodity stealers such
    as Odyssey and MacSync. The icon and the quarantine attribute are not visible to the
    sensor. The double extension is, on the command line of Script Editor or osascript,
    and so is what Script Editor starts next.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - defense-impairment
    - gatekeeper
    - applescript
    - double-extension
    - macos
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H054.md
    - https://attack.mitre.org/techniques/T1553
    - https://attack.mitre.org/techniques/T1553/001
    - https://attack.mitre.org/detectionstrategies/DET0288
    - https://pberba.github.io/security/2025/11/11/macos-infection-vector-applescript-bypass-gatekeeper/

mitre:
  tactics:
    - TA0112
  techniques:
    - T1553
  sub_techniques:
    - T1553.001
  detection_strategies:
    - DET0288
  analytics:
    - AN0800
  platforms:
    - macOS
  data_sources:
    - macos:unifiedlog
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    Threat actors are using compiled AppleScript files with fake document extensions such
    as .docx.scpt and .pptx.scpt, combined with custom icons stored in resource forks, to
    trick users into executing malicious scripts through Script Editor and bypass
    Gatekeeper quarantine restrictions on macOS.
  attacker_behavior:
    - Delivers a .scpt file whose name ends in a document extension followed by .scpt.
    - Sets a Word, PowerPoint or PDF icon in the file's resource fork.
    - Relies on the user opening it in Script Editor and pressing Run, as a comment at the top instructs.
    - Has the script fetch and run a stealer with curl and a shell.
    - Sends the file inside a disk image or zip so the extension is less noticeable.
  legitimate_behavior:
    - Developers and power users open their own scripts in Script Editor.
    - Automation shared inside a team is distributed as .scpt files.
    - Documentation occasionally ships example scripts with descriptive names.
  risk_indicator:
    - The script name carries a document extension immediately before .scpt.
    - The file is in Downloads, a mounted disk image or a temporary directory.
    - Script Editor starts curl, a shell or osascript with a remote URL.
    - The user is not someone who writes AppleScript.

requires:
  platforms:
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: double-extension-script-opened
        name: Script with a document extension before .scpt opened or run
        purpose: >-
          Return any process whose command line names a file ending in a document
          extension followed by .scpt or .applescript. The pattern is specific enough to
          run on its own without an image filter.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | CommandLine=/\.(docx?|xlsx?|pptx?|pdf|rtf|pages|numbers|key|txt|csv|png|jpe?g|zip)\.(scpt|scptd|applescript)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: script-editor-opening-delivered-script
        name: Script Editor opening a script from a download or mounted location
        purpose: >-
          Return Script Editor launches whose argument is a script under Downloads, a
          mounted volume or a temporary directory, where a delivered file is opened from.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=/^Script Editor$/
          | CommandLine=/\/(Downloads|Desktop)\/|\/Volumes\/|\/(private\/)?(tmp|var\/folders)\//
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: script-editor-spawned-shell-or-fetch
        name: Shell or download tool started by Script Editor
        purpose: >-
          Return what a script run inside Script Editor went on to start, which is the
          execution Gatekeeper did not question.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | ParentBaseFileName=/^Script Editor$/
          | FileName=/^(sh|bash|zsh|curl|wget|osascript|python3?|perl|ruby|nscurl|chmod|xattr|open)$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: quarantine-attribute-removed
        name: Quarantine attribute removed from a file
        purpose: >-
          Return xattr commands that strip the quarantine flag, the step a script takes
          so that whatever it downloads also runs unprompted.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=xattr
          | CommandLine=/com\.apple\.quarantine|\s-c[r]?\s|\s-[r]?c\s/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: disguised_script_opened
      name: Script disguised as a document opened or run
      description: >-
        A process command line names a compiled AppleScript whose file name carries a
        document extension before .scpt, or Script Editor opens a script from a delivery
        location.
      source: process_creation
      field: command_line
      indicates: masqueraded_script_execution

  supporting:
    - id: script_editor_child_process
      name: Script Editor started a shell or download tool
      description: >-
        A process whose parent is Script Editor is a shell, curl, osascript or another
        interpreter.
      source: process_creation
      field: parent_process
      indicates: script_executed_past_gatekeeper
    - id: quarantine_stripped
      name: Quarantine attribute removed
      description: >-
        An xattr command on the host removes com.apple.quarantine or clears extended
        attributes.
      source: process_creation
      field: command_line
      indicates: gatekeeper_bypass_for_followup_payload
    - id: non_scripting_user
      name: User does not write AppleScript
      description: >-
        The account has no history of running Script Editor and no automation role.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: user_owned_automation
      name: User regularly works in Script Editor
      description: >-
        Earlier activity shows the same user running Script Editor on their own scripts
        over a long period.
      source: baseline
      field: UserName
      indicates: established_user_automation
    - id: internal_script_distribution
      name: Script is distributed internally
      description: >-
        The script name and source match automation the organisation distributes to
        staff.
      source: asset_inventory
      field: ComputerName
      indicates: approved_internal_tooling

  risk_logic:
    required:
      - disguised_script_opened

    supporting:
      any:
        - script_editor_child_process
        - quarantine_stripped
        - non_scripting_user
      all:
        - script_editor_child_process
        - non_scripting_user

    contradicting:
      any:
        - user_owned_automation
        - internal_script_distribution
      all: []

  verdict:
    low_risk_when:
      - disguised_script_opened
      - user_owned_automation
      - internal_script_distribution
    suspicious_when:
      - disguised_script_opened
      - non_scripting_user
    high_risk_when:
      - disguised_script_opened
      - non_scripting_user
      - script_editor_child_process

  false_positive:
    - condition: A developer runs scripts in Script Editor.
      explanation: >-
        Script Editor starting a shell is normal for someone writing automation. Their
        scripts live in their own folders and do not carry document extensions.
    - condition: A script is named after the document it processes.
      explanation: >-
        A name such as convert.pdf.scpt is possible in someone's own collection. It is
        in a scripts folder, not Downloads, and has run before.
    - condition: Installers and developers clear quarantine attributes.
      explanation: >-
        The xattr case matches routine developer and installer use. It matters on a host
        that also opened a disguised script.
