type: detection

id: hg-any-hearth-h233-import-time-node-loader-sync-js-and-miasma-monitor-persistence-t1195-001
version: 1.0.0

info:
  name: Import-time Node loader writing sync.js to a NodeJS profile directory with miasma-monitor persistence
  description: >-
    In July 2026 five versions of @asyncapi npm packages were republished with a loader
    after a GitHub Actions workflow exposed a bot token. The loader does not use a
    preinstall or postinstall hook. It runs when an application or a developer tool
    imports the package, starts a hidden detached Node child, fetches sync.js from an
    IPFS gateway, writes it into a directory named NodeJS under the user's profile
    storage, and installs user persistence named miasma-monitor: a Run value on Windows,
    a systemd user unit on Linux, shell start-up files on macOS. H087 and H173 watch
    install hooks and would not see the trigger. The repository and CI side, the
    pull_request_target workflow and the publish, is in GitHub and npm audit logs this
    connector does not ingest. The endpoint side is on process, script file, registry
    and DNS events.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - initial-access
    - supply-chain
    - npm
    - nodejs
    - asyncapi
    - miasma
    - ipfs
    - developer-endpoint
    - windows
    - linux
    - macos
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H233.md
    - https://attack.mitre.org/techniques/T1195
    - https://attack.mitre.org/techniques/T1195/001
    - https://attack.mitre.org/detectionstrategies/DET0009
    - https://www.microsoft.com/en-us/security/blog/2026/07/15/unpacking-asyncapi-npm-supply-chain-compromise-import-time-payload-delivery/
    - https://unit42.paloaltonetworks.com/monitoring-npm-supply-chain-attacks/

