hypothesis:
  statement: >-
    A poisoned npm dependency executes during module import, spawns a detached Node
    child, writes sync.js into a NodeJS masquerade directory, and installs
    miasma-monitor persistence on a developer workstation or build host.
  attacker_behavior:
    - Republishes a trusted package with a loader that runs on import, not on install.
    - Starts a detached Node child with a hidden window and ignored standard streams.
    - Fetches sync.js from ipfs.io by content identifier.
    - Writes it to AppData\Local\NodeJS, Library/Application Support/NodeJS, .local/share/NodeJS or .config/NodeJS.
    - Adds a Run value, a systemd user unit or a shell start-up line named miasma-monitor.
    - Falls back to Ethereum RPC, Nostr relays and BitTorrent DHT for command and control.
  legitimate_behavior:
    - Node applications import hundreds of packages at start.
    - Build tools start Node child processes constantly.
    - Node.js installs under Program Files, /usr or a version manager's directory.
    - Developers use IPFS gateways.
  risk_indicator:
    - node runs a file named sync.js from a NodeJS directory under profile storage.
    - A script is written into such a directory.
    - A Run value or a command is named miasma-monitor.
    - node resolves ipfs.io shortly before the file appears.
    - The host is a developer workstation or a build agent that uses AsyncAPI packages.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
    - source: network_connection
      connector: crowdstrike-ngsiem
      event_types:
        - NetworkConnectIP4
      fields:
        agent_id: aid
        host: ComputerName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
        remote_address: RemoteAddressIP4
        remote_port: RemotePort

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: node-running-script-from-nodejs-profile-directory
        name: node running a script from a NodeJS directory under profile storage
        purpose: >-
          Return node processes whose command line names a file under
          AppData\Local\NodeJS, Application Support/NodeJS, .local/share/NodeJS or
          .config/NodeJS. Node.js does not install into any of these, so a script run
          from one is the loader's second stage whatever the file is called. The
          detached child that fetches the file runs inline code and names no such path;
          it is the parent of this process.
        query: |
          #event_simpleName=ProcessRollup2
          | FileName=/^node(\.exe)?$/i
          | CommandLine=/[\\\/](AppData[\\\/]Local|Application Support|\.local[\\\/]share|\.config)[\\\/]NodeJS[\\\/]/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: script-written-to-nodejs-profile-directory
        name: Script written into a NodeJS directory under profile storage
        purpose: >-
          Return script files written into the same four directories, with the writing
          process id. This case depends on the sensor reporting a .js write as a script
          write on each platform; confirm in the tenant.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/[\\\/](AppData[\\\/]Local|Application Support|\.local[\\\/]share|\.config)[\\\/]NodeJS[\\\/]/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: run-value-named-miasma-monitor
        name: Run value named miasma-monitor written
        purpose: >-
          Return writes of a Run value named miasma-monitor, with its data, however the
          write was made.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run\\?$/i
          | RegValueName=/miasma-monitor/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: run-value-starting-script-from-nodejs-profile-directory
        name: Run value whose data starts a script from the NodeJS profile directory
        purpose: >-
          Return Run values under any name whose data points into AppData\Local\NodeJS,
          which survives a change of the value's name.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run\\?$/i
          | RegStringValue=/\\AppData\\Local\\NodeJS\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-naming-miasma-monitor
        name: Command naming miasma-monitor
        purpose: >-
          Return any command that names miasma-monitor: systemctl --user enabling the
          unit on Linux, reg.exe adding the value on Windows, or a shell line appending
          to a start-up file on macOS. A unit file or a start-up line written directly
          by Node leaves no command; on Linux the corpus template for systemd units
          reads the unit file write.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/miasma-monitor/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-resolving-ipfs-gateway
        name: node resolving ipfs.io
        purpose: >-
          Return DNS requests for ipfs.io made by node. The content identifier is in the
          URL path and is not visible. Developers who use IPFS from Node match too.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)ipfs\.io$/i
          | ContextBaseFileName=/^node(\.exe)?$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: connection-to-reported-command-server
        name: Connection to the reported command server
        purpose: >-
          Return connections to 85.137.53.71, the address reported for this campaign, on
          any port. The address will change; the case is kept for looking back over the
          campaign window.
        query: |
          #event_simpleName=NetworkConnectIP4
          | RemoteAddressIP4=/^85\.137\.53\.71$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: node_runs_script_from_nodejs_profile_directory
      name: node ran a script from a NodeJS profile directory
      description: >-
        A node process names a script under a NodeJS directory in the user's profile
        storage on its command line.
      source: process_creation
      field: command_line
      indicates: second_stage_loader_execution

  supporting:
    - id: script_written_to_masquerade_directory
      name: Script written to the masquerade directory
      description: >-
        A script file is written into a NodeJS directory under profile storage.
      source: file_creation
      field: file_path
      indicates: loader_dropped
    - id: parent_is_node_or_package_tool
      name: Parent is node or a package tool
      description: >-
        The parent of the node process is node, npm, npx, yarn, pnpm or a build tool.
      source: process_creation
      field: parent_process
      indicates: import_time_execution
    - id: miasma_monitor_run_value
      name: Run value named miasma-monitor
      description: >-
        A Run value named miasma-monitor is written.
      source: registry
      field: registry_value
      indicates: logon_persistence
    - id: run_data_points_at_loader
      name: Run value data points at the loader
      description: >-
        A Run value's data names a script under AppData\Local\NodeJS.
      source: registry
      field: registry_data
      indicates: logon_persistence
    - id: ipfs_gateway_resolved_by_node
      name: node resolved ipfs.io
      description: >-
        node requested ipfs.io before the script appeared.
      source: dns_request
      field: query_name
      indicates: second_stage_retrieval
    - id: resolver_is_node
      name: Resolving process is node
      description: >-
        The process named on the DNS request is node.
      source: dns_request
      field: process_name
      indicates: script_driven_retrieval
    - id: reported_server_contacted
      name: Reported command server contacted
      description: >-
        A connection is made to the address reported for the campaign.
      source: network_connection
      field: remote_address
      indicates: command_and_control
    - id: connection_port_is_reported_port
      name: Port is one of the reported ports
      description: >-
        The remote port is 8080, 8081 or 8091.
      source: network_connection
      field: remote_port
      indicates: command_and_control

  contradicting:
    - id: project_owns_the_directory
      name: A project on the host uses that directory
      description: >-
        A known application on the host stores its own scripts in a NodeJS directory
        under the profile and the file recurs.
      source: baseline
      field: TargetFileName
      indicates: application_data_directory
    - id: no_affected_package_installed
      name: No affected package version is present
      description: >-
        The host's lock files and package cache hold none of the republished versions.
      source: derived
      field: ComputerName
      indicates: not_exposed_to_campaign

  risk_logic:
    required:
      - node_runs_script_from_nodejs_profile_directory

    supporting:
      any:
        - script_written_to_masquerade_directory
        - parent_is_node_or_package_tool
        - miasma_monitor_run_value
        - run_data_points_at_loader
        - ipfs_gateway_resolved_by_node
        - resolver_is_node
        - reported_server_contacted
        - connection_port_is_reported_port
      all:
        - script_written_to_masquerade_directory
        - miasma_monitor_run_value

    contradicting:
      any:
        - project_owns_the_directory
        - no_affected_package_installed
      all: []

  verdict:
    low_risk_when:
      - node_runs_script_from_nodejs_profile_directory
      - project_owns_the_directory
      - no_affected_package_installed
    suspicious_when:
      - node_runs_script_from_nodejs_profile_directory
      - parent_is_node_or_package_tool
    high_risk_when:
      - node_runs_script_from_nodejs_profile_directory
      - script_written_to_masquerade_directory
      - ipfs_gateway_resolved_by_node

  false_positive:
    - condition: Applications that keep data in a NodeJS directory.
      explanation: >-
        An application could use this directory name for its own files. The file recurs
        across versions and no persistence is added.
    - condition: IPFS use from Node.
      explanation: >-
        Web3 projects fetch from ipfs.io. Nothing is written to the profile directory
        and no Run value follows.
