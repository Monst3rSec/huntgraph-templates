# Converted from THORCollective/HEARTH Flames/H033.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h033-invoke-restmethod-payload-download-t1059-001
version: 1.0.0

info:
  name: Invoke-RestMethod used to download a ransomware payload
  description: >-
    Invoke-RestMethod is meant for calling web APIs, and returns whatever the server
    sends as a PowerShell object. Piped to Invoke-Expression, or written to disk with
    -OutFile, it is a downloader in a dozen characters that blends into administrative
    scripting. Operators who reach a network through remote-management software use it
    to bring in ransomware such as DragonForce and Medusa from domains registered days
    earlier. Domain age and reputation are not fields the sensor carries; the hunt
    returns the command and the DNS requests PowerShell makes, and the agent checks the
    domain against threat intelligence.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - execution
    - powershell
    - invoke-restmethod
    - ransomware
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H033.md
    - https://attack.mitre.org/techniques/T1059
    - https://attack.mitre.org/techniques/T1059/001
    - https://attack.mitre.org/detectionstrategies/DET0455
    - https://dispatch.thorcollective.com/p/from-the-fire-q1fy25

mitre:
  tactics:
    - TA0002
  techniques:
    - T1059
  sub_techniques:
    - T1059.001
  detection_strategies:
    - DET0455
  analytics:
    - AN1252
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    Threat actors are using PowerShell's Invoke-RestMethod cmdlet to download ransomware
    payloads from recently registered, low-reputation domains, in order to encrypt files
    and demand payment.
  attacker_behavior:
    - Runs irm against an attacker domain and pipes the result to iex.
    - Uses Invoke-RestMethod with -OutFile to drop an executable or script into a writable directory.
    - Issues the command through a remote-management tool's shell or a scheduled task.
    - Hosts the payload on a domain registered days before, or on a raw IP address.
    - Starts the downloaded file immediately and deletes it afterwards.
  legitimate_behavior:
    - Administrators and developers call REST APIs from scripts all day.
    - Published installers for developer tools use irm piped to iex.
    - Monitoring and automation jobs post and fetch JSON on a schedule.
  risk_indicator:
    - The result of Invoke-RestMethod is executed or saved as an executable.
    - The domain is newly registered, low reputation or a bare IP address.
    - The parent is a remote-management agent, a script host or a service.
    - The host shows backup deletion or mass file changes afterwards.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: restmethod-result-executed
        name: Invoke-RestMethod result piped to execution
        purpose: >-
          Return PowerShell runs that fetch with Invoke-RestMethod or its alias and
          execute the response in the same command line.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/Invoke-RestMethod|\birm\b/i
          | CommandLine=/\bIEX\b|Invoke-Expression|\|\s*&|\.Invoke\(|Start-Process|\bsaps\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: restmethod-download-to-file
        name: Invoke-RestMethod saving an executable or script
        purpose: >-
          Return runs that use -OutFile to write an executable, script or archive, the
          form that leaves the payload on disk.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/Invoke-RestMethod|\birm\b/i
          | CommandLine=/-o(utfile)?\s+\S*\.(exe|dll|ps1|bat|cmd|msi|scr|zip|7z|dat|bin)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: restmethod-to-raw-ip-or-odd-port
        name: Invoke-RestMethod against a raw IP address or non-standard port
        purpose: >-
          Return calls whose URL is an IP literal or names an explicit port, which
          published installers and real APIs seldom do.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/Invoke-RestMethod|\birm\b/i
          | CommandLine=/https?:\/\/(\d{1,3}\.){3}\d{1,3}|https?:\/\/[^\/\s"']+:\d{2,5}/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: powershell-dns-request
        name: DNS request made by PowerShell
        purpose: >-
          Return the names PowerShell resolved, with Microsoft and the common package
          hosts removed, so the agent can check each remaining domain's age and
          reputation.
        query: |
          #event_simpleName=DnsRequest
          | ContextBaseFileName=/^(powershell|pwsh)\.exe$/i
          | DomainName!=/(^|\.)(microsoft\.com|windows\.net|windowsupdate\.com|azure\.com|azureedge\.net|msftncsi\.com|office\.com|office365\.com|live\.com|powershellgallery\.com|github\.com|githubusercontent\.com|nuget\.org|chocolatey\.org|digicert\.com|local|lan|corp|internal)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: restmethod_download_command
      name: Invoke-RestMethod used as a downloader
      description: >-
        A PowerShell command line calls Invoke-RestMethod or irm and executes the
        response, saves it as a file, or targets a raw address.
      source: process_creation
      field: command_line
      indicates: powershell_payload_retrieval

  supporting:
    - id: low_reputation_domain
      name: Domain is newly registered or low reputation
      description: >-
        Threat intelligence shows the domain in the command or in PowerShell's DNS
        requests was registered recently or carries a poor reputation.
      source: threat_intel
      field: DomainName
      indicates: disposable_delivery_infrastructure
    - id: powershell_resolved_domain
      name: PowerShell resolved an unfamiliar domain
      description: >-
        A DNS request attributed to PowerShell names a domain outside the Microsoft and
        package hosts the estate normally reaches.
      source: dns_request
      field: query_name
      indicates: outbound_fetch_by_interpreter
    - id: remote_management_parent
      name: Command issued through remote-management tooling
      description: >-
        The parent is a remote-management or remote-support agent, a service or a script
        host, not an administrator's console.
      source: process_creation
      field: parent_process
      indicates: remote_operator_activity
    - id: unexpected_download_account
      name: Run under an unexpected account
      description: >-
        The user is SYSTEM, a service account or a standard user with no scripting role.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: published_installer_source
      name: URL is a published installer for known software
      description: >-
        The domain belongs to a vendor whose documented install command is irm piped to
        iex, and the software is approved for the host.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software_installation
    - id: scheduled_api_job
      name: Command is a recurring automation job
      description: >-
        Earlier activity shows the same command line on this host on a regular schedule.
      source: baseline
      field: CommandLine
      indicates: established_automation

  risk_logic:
    required:
      - restmethod_download_command

    supporting:
      any:
        - low_reputation_domain
        - powershell_resolved_domain
        - remote_management_parent
        - unexpected_download_account
      all:
        - low_reputation_domain
        - remote_management_parent

    contradicting:
      any:
        - published_installer_source
        - scheduled_api_job
      all: []

  verdict:
    low_risk_when:
      - restmethod_download_command
      - published_installer_source
      - scheduled_api_job
    suspicious_when:
      - restmethod_download_command
      - remote_management_parent
    high_risk_when:
      - restmethod_download_command
      - remote_management_parent
      - low_reputation_domain

  false_positive:
    - condition: Developer tools publish irm-piped-to-iex installers.
      explanation: >-
        Package managers and command-line tools document exactly this pattern. The domain
        is the vendor's long-standing one and the user is a developer or administrator.
    - condition: Automation calls REST APIs and saves the response.
      explanation: >-
        Reporting and integration jobs write JSON or CSV with -OutFile. They recur on a
        schedule, target known API hosts and do not save executables.
    - condition: PowerShell resolves many ordinary domains.
      explanation: >-
        The DNS case returns every unfamiliar name PowerShell asked for. Most are
        benign; it is the name's age and reputation, and a matching download command,
        that give one weight.
