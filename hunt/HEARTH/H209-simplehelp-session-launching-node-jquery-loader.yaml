# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h209-simplehelp-session-launching-node-jquery-loader-t1059-007
version: 1.0.0

info:
  name: SimpleHelp session starting Node.js against a file named jquery.js
  description: >-
    After the SimpleHelp authentication flaw (CVE-2026-48558) was exploited, operators
    used technician sessions on managed endpoints to start node.exe against a loader
    named jquery.js, the TaskWeaver chain that delivers the Djinn stealer. The loader
    reads browser, SSH, cloud and package-registry credential files and calls out
    through a temporary tunnel. The exploit happens on the SimpleHelp server and is not
    seen. On the endpoint the sensor reports the SimpleHelp agent's child processes,
    node running a script from a writable path, and node's DNS requests. It does not
    report file reads, so the credential stores being opened inside node are not seen;
    only a child command that names them is.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - execution
    - command-and-control
    - simplehelp
    - remote-support
    - nodejs
    - javascript
    - infostealer
    - taskweaver
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H209.md
    - https://attack.mitre.org/techniques/T1059/007
    - https://attack.mitre.org/techniques/T1219/002
    - https://attack.mitre.org/detectionstrategies/DET0264
    - https://attack.mitre.org/detectionstrategies/DET0259
    - https://blackpointcyber.com/blog/a-djinn-in-the-machine-taskweavers-node-js-intrusion-chain/
    - https://socradar.io/blog/cve-2026-48558-simplehelp-oidc-infostealer/

mitre:
  tactics:
    - TA0002
    - TA0011
  techniques:
    - T1059
    - T1219
  sub_techniques:
    - T1059.007
    - T1219.002
  detection_strategies:
    - DET0264
    - DET0259
  analytics:
    - AN0733
    - AN0714
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - Network Connection Creation

hypothesis:
  statement: >-
    An adversary abuses a SimpleHelp technician session to launch jquery.js through
    Node.js, then reads developer and cloud credential stores before outbound C2.
  attacker_behavior:
    - Opens a technician session to an endpoint through a compromised SimpleHelp server.
    - Places node.exe and a file named jquery.js or jsquery.js in a writable directory.
    - Starts node against that file from the remote support agent.
    - Reads browser, SSH, cloud and registry credential files from inside node.
    - Calls out through a temporary Cloudflare tunnel.
  legitimate_behavior:
    - Technicians open a shell through SimpleHelp to fix a machine.
    - Developers run node from their project folders and from a version manager.
    - Web projects contain files named jquery.js that a browser loads and node never runs.
  risk_indicator:
    - A SimpleHelp process is the parent of node.exe or a script host.
    - node runs a file named jquery.js from AppData, ProgramData or Temp.
    - node.exe itself sits in a writable directory and not under Program Files or a version manager.
    - node requests a trycloudflare.com subdomain.
    - No support ticket covers the session.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: simplehelp-process-started-node-or-script-host
        name: SimpleHelp process starting node, a shell or a script host
        purpose: >-
          Return node, shells, script hosts and transfer tools whose parent is a
          SimpleHelp service or session process. The parent names are those the reports
          and the product's Windows agent use; an agent installed under a customised
          name is not matched, so confirm the names in the tenant. A technician opening
          a shell matches by design.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(SimpleService|Remote Access|Remote AccessWinLauncher|Manage Remote Access Service|session_win|elev_win|windowslauncher|SimpleGatewayService)\.exe$/i
          | FileName=/^(node|powershell|pwsh|cmd|wscript|cscript|mshta|rundll32|curl|certutil)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-running-jquery-file-from-writable-path
        name: node.exe running a jquery-named script from a writable directory
        purpose: >-
          Return node runs whose command line names jquery.js or jsquery.js under
          AppData, ProgramData, a Temp folder, Users\Public or the remote support
          working directory. This does not depend on the parent, so it also finds the
          loader started from a shell the session opened.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^node\.exe$/i
          | CommandLine=/js?query[\w.\-]*\.js\b/i
          | CommandLine=/\\(AppData|ProgramData|Temp|Users\\Public|JWrapper[^\\]*)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-binary-running-from-writable-path
        name: node.exe whose image is in ProgramData, Temp, Roaming or Users\Public
        purpose: >-
          Return node.exe running from a writable directory that is not a version
          manager's. A loader that brings its own runtime shows here whatever its script
          is called.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^node\.exe$/i
          | ImageFileName=/\\(ProgramData|Windows\\Temp|AppData\\Local\\Temp|AppData\\Roaming|Users\\Public)\\/i
          | ImageFileName!=/\\(nvm|fnm|volta|npm|nodejs|chocolatey|scoop)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-child-naming-credential-stores
        name: Process started by node whose command line names a credential store
        purpose: >-
          Return children of node that name browser credential databases, SSH keys,
          cloud credentials or registry tokens. The reported loader reads these files
          itself; file reads are not reported, so this case sees only the collection it
          hands to a child command.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^node\.exe$/i
          | CommandLine=/Login Data|\\Network\\Cookies|\.ssh\\|\.aws\\credentials|\.npmrc|\.pypirc|\.git-credentials|\.docker\\config\.json/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-requesting-temporary-tunnel-domain
        name: node.exe requesting a trycloudflare.com subdomain
        purpose: >-
          Return DNS requests for temporary Cloudflare tunnel names made by node, with
          the process id for the agent to match against the loader.
        query: |
          #event_simpleName=DnsRequest
          | ContextBaseFileName=/^node\.exe$/i
          | DomainName=/\.trycloudflare\.com$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: node_loader_started
      name: node started by a remote support process or against a jquery-named file
      description: >-
        node.exe has a SimpleHelp process as parent, or its command line runs jquery.js
        from a writable directory.
      source: process_creation
      field: command_line
      indicates: javascript_loader_execution

  supporting:
    - id: parent_is_simplehelp
      name: Parent is a SimpleHelp process
      description: >-
        The parent of node or of the shell that started it is a SimpleHelp service or
        session process.
      source: process_creation
      field: parent_process
      indicates: remote_support_session_abuse
    - id: node_in_writable_path
      name: node.exe runs from a writable directory
      description: >-
        The image path of node.exe is under ProgramData, Temp, Roaming or Users\Public.
      source: process_creation
      field: image_path
      indicates: runtime_brought_by_attacker
    - id: tunnel_domain_requested
      name: node requested a temporary tunnel
      description: >-
        node.exe requested a trycloudflare.com subdomain.
      source: dns_request
      field: query_name
      indicates: tunnelled_command_and_control
    - id: tunnel_requester_is_node
      name: Requester of the tunnel name is the loader process
      description: >-
        The process id on the DNS request is the node process the loader case returned.
      source: dns_request
      field: process_id
      indicates: loader_calling_out

  contradicting:
    - id: recorded_support_session
      name: Session matches a support ticket
      description: >-
        A ticket records a technician session to this host at this time and the commands
        match the work described.
      source: change_management
      field: ComputerName
      indicates: authorised_support
    - id: simplehelp_not_deployed
      name: Process is a different product with a similar name
      description: >-
        Inventory shows the parent belongs to another product and SimpleHelp is not
        deployed.
      source: asset_inventory
      field: ComputerName
      indicates: unrelated_software

  risk_logic:
    required:
      - node_loader_started

    supporting:
      any:
        - parent_is_simplehelp
        - node_in_writable_path
        - tunnel_domain_requested
        - tunnel_requester_is_node
      all:
        - parent_is_simplehelp
        - node_in_writable_path

    contradicting:
      any:
        - recorded_support_session
        - simplehelp_not_deployed
      all: []

  verdict:
    low_risk_when:
      - node_loader_started
      - recorded_support_session
      - simplehelp_not_deployed
    suspicious_when:
      - node_loader_started
      - parent_is_simplehelp
    high_risk_when:
      - node_loader_started
      - parent_is_simplehelp
      - node_in_writable_path
      - tunnel_domain_requested

  false_positive:
    - condition: Technicians run scripts through SimpleHelp.
      explanation: >-
        A ticket covers the session and the script is the organisation's own.
    - condition: Developers keep a portable node in their profile.
      explanation: >-
        The parent is their terminal or editor and the script is in a project folder.
