# Converted from THORCollective/HEARTH Flames/H066.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h066-unvetted-browser-extension-loading-t1176-001
version: 1.0.0

info:
  name: Browser extensions posing as AI tools installed outside managed channels
  description: >-
    Extensions that clone AI productivity tools have been found reading ChatGPT and
    DeepSeek session tokens and whole conversations from the page and sending them out
    as analytics data. The theft happens inside the browser, where the sensor has no
    view: there is no event for an extension reading a tab or for which extensions are
    installed from the store. HEARTH's two techniques, token theft and session
    hijacking, are not observable here. What is observable is an extension arriving by a
    route other than the store: a browser started with an unpacked extension, a policy
    key written to force-install one, or an extension directory copied into a profile.
    The template is mapped to Browser Extensions for that reason, and does not cover an
    extension the user installs from the store.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - persistence
    - browser-extension
    - ai-tools
    - session-token-theft
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H066.md
    - https://attack.mitre.org/techniques/T1176
    - https://attack.mitre.org/techniques/T1176/001
    - https://attack.mitre.org/detectionstrategies/DET0044
    - https://www.malwarebytes.com/blog/news/2026/01/malicious-chrome-extensions-can-spy-on-your-chatgpt-chats
    - https://www.ox.security/blog/malicious-chrome-extensions-steal-chatgpt-deepseek-conversations/

mitre:
  tactics:
    - TA0003
  techniques:
    - T1176
  sub_techniques:
    - T1176.001
  detection_strategies:
    - DET0044
  analytics:
    - AN0123
    - AN0124
  platforms:
    - Windows
    - macOS
  data_sources:
    - WinEventLog:Security
    - macos:unifiedlog
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary is deploying malicious browser extensions that impersonate AI
    productivity tools to steal session tokens and conversation data from AI platforms,
    targeting users of ChatGPT, DeepSeek and similar services to harvest credentials and
    exfiltrate sensitive prompt data.
  attacker_behavior:
    - Publishes an extension that copies a legitimate AI tool and adds token and conversation collection.
    - Has malware start the browser with an unpacked extension so no store install is needed.
    - Writes a force-install policy so the extension is added and cannot be removed.
    - Copies an extension directory into a browser profile and edits the profile's preferences.
    - Sends captured tokens and prompts to its own server from inside the browser.
  legitimate_behavior:
    - Extension developers load unpacked extensions while building them.
    - Administrators deploy approved extensions through policy.
    - Test automation starts browsers with extension flags.
  risk_indicator:
    - A browser is started with an unpacked extension from a temporary or user-writable path.
    - A force-install or install-source policy is written by something other than management tooling.
    - The extension path or identifier is unknown to the organisation's approved list.
    - The browser's parent is a script, an installer for unrelated software or an unknown binary.

requires:
  platforms:
    - windows
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: browser-started-with-unpacked-extension
        name: Browser started with an unpacked extension
        purpose: >-
          Return Chromium-family browsers launched with a load-extension flag, with the
          extension path on the command line.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/--load-extension=|--disable-extensions-except=/i
          | ImageFileName=/(chrome|msedge|brave|opera|vivaldi|chromium|Google Chrome|Microsoft Edge|Brave Browser|Arc)[^\\\/]*$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: unpacked-extension-from-writable-path
        name: Unpacked extension loaded from a temporary or user-writable path
        purpose: >-
          Narrow to extension paths under Temp, Downloads, Desktop, Roaming, Public or a
          temporary directory, where a dropped extension sits and a developer's project
          usually does not.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/--load-extension=["']?[^\s"']*(\\Temp\\|\\Downloads\\|\\Desktop\\|\\AppData\\Roaming\\|\\Users\\Public\\|\\ProgramData\\|\/tmp\/|\/var\/folders\/|\/Users\/Shared\/|\/Downloads\/)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: extension-install-policy-written
        name: Extension force-install or install-source policy written from the command line
        purpose: >-
          Return commands that write the browser policy keys that add an extension
          without the user, on Windows through the registry and on macOS through
          defaults or a profile.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/ExtensionInstallForcelist|ExtensionInstallSources|ExtensionSettings|ExtensionInstallAllowlist/i
          | CommandLine=/\breg(\.exe)?"?\s+add\b|Set-ItemProperty|New-ItemProperty|New-Item\b|\bdefaults\s+write\b|PlistBuddy|\bprofiles\s+(install|-I)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: extension-directory-copied-into-profile
        name: Extension directory copied into a browser profile
        purpose: >-
          Return copy and archive-extract commands whose destination is a browser
          profile's Extensions folder, a sideloading route that needs no flag or policy.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/(User Data|Application Support\/(Google\/Chrome|Microsoft Edge|BraveSoftware))[^"']*[\\\/]Extensions[\\\/]/i
          | CommandLine=/\b(copy|xcopy|robocopy|Copy-Item|Expand-Archive|cp|ditto|unzip|tar|mv|move)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: extension_sideload_command
      name: Extension added outside the store
      description: >-
        A command line starts a browser with an unpacked extension, writes an extension
        install policy, or copies an extension directory into a browser profile.
      source: process_creation
      field: command_line
      indicates: browser_extension_sideloaded

  supporting:
    - id: extension_in_writable_path
      name: Extension path is temporary or user-writable
      description: >-
        The extension path on the command line is under Temp, Downloads, Public or
        another writable location.
      source: process_creation
      field: command_line
      indicates: dropped_extension
    - id: non_management_origin
      name: Sideload issued by a script or unknown binary
      description: >-
        The parent of the browser or of the policy-writing command is a script host, an
        unrelated installer or an executable in a writable path.
      source: process_creation
      field: parent_process
      indicates: malware_driven_installation
    - id: non_developer_user
      name: User is not an extension developer
      description: >-
        The account has no web or extension development role.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: managed_extension_policy
      name: Policy is deployed by management tooling
      description: >-
        The extension identifier in the policy is on the organisation's approved list
        and the write comes from the management agent.
      source: asset_inventory
      field: ComputerName
      indicates: approved_extension_deployment
    - id: extension_developer_host
      name: Host belongs to an extension developer or test runner
      description: >-
        Asset records class the host as a developer workstation or a browser test
        runner.
      source: asset_inventory
      field: ComputerName
      indicates: expected_development_activity

  risk_logic:
    required:
      - extension_sideload_command

    supporting:
      any:
        - extension_in_writable_path
        - non_management_origin
        - non_developer_user
      all:
        - extension_in_writable_path
        - non_management_origin

    contradicting:
      any:
        - managed_extension_policy
        - extension_developer_host
      all: []

  verdict:
    low_risk_when:
      - extension_sideload_command
      - managed_extension_policy
      - extension_developer_host
    suspicious_when:
      - extension_sideload_command
      - non_developer_user
    high_risk_when:
      - extension_sideload_command
      - non_developer_user
      - extension_in_writable_path

  false_positive:
    - condition: Developers load unpacked extensions.
      explanation: >-
        This is how extensions are built and tested. The path is a project directory
        and the user is a developer.
    - condition: Browser test automation uses extension flags.
      explanation: >-
        Test frameworks start browsers with a temporary profile and a helper extension.
        The parent is the test runner and the host is a build or test machine.
    - condition: An installed application adds its companion extension by policy.
      explanation: >-
        Password managers and conferencing tools write install policies during setup.
        The identifier is the vendor's published one.
