# Converted from THORCollective/HEARTH Flames/H267.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h267-sysvol-sweep-for-gpp-cpassword-and-description-secrets-t1552-006
version: 1.0.0

info:
  name: SYSVOL swept for Group Policy Preferences passwords and LDAP description secrets
  description: >-
    Any domain user can read SYSVOL, and Group Policy Preferences files written before
    2014 still carry cpassword values encrypted with a key Microsoft published. An
    operator looking for a first credential walks every policy folder for Groups.xml,
    Services.xml, ScheduledTasks.xml, DataSources.xml and Printers.xml, and in the same
    session reads the description and info attributes of service accounts over LDAP,
    where administrators leave passwords. The share-access and LDAP logs that show this
    best live on the domain controller and are not collected here. What the sensor does
    see is the search as a command: findstr or Select-String for cpassword, a recursive
    listing of the Policies tree, a directory searcher asking for description. Where a
    domain controller carries the sensor, opens of the five Preferences files over SMB
    are returned too, and the agent counts how many policy GUIDs one account touched.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - credential-access
    - group-policy-preferences
    - cpassword
    - sysvol
    - ldap
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H267.md
    - https://attack.mitre.org/techniques/T1552
    - https://attack.mitre.org/techniques/T1552/006
    - https://attack.mitre.org/detectionstrategies/DET0381

mitre:
  tactics:
    - TA0006
  techniques:
    - T1552
  sub_techniques:
    - T1552.006
  detection_strategies:
    - DET0381
  analytics:
    - AN1075
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
    - WinEventLog:Security
  data_components:
    - Process Creation
    - Network Share Access

hypothesis:
  statement: >-
    An operator who needs a credential before moving laterally recursively walks
    \\<domain>\SYSVOL\<domain>\Policies\ for cpassword values inside the Group Policy
    Preferences XML files, and in the same sweep reads the description and info
    attributes of service accounts over LDAP, where administrators write passwords.
  attacker_behavior:
    - Searches the SYSVOL Policies tree recursively for the string cpassword.
    - Opens Groups.xml, Services.xml, ScheduledTasks.xml, DataSources.xml and
      Printers.xml under every policy GUID in one burst.
    - Runs Get-GPPPassword or decrypts the value with the published AES key.
    - Queries LDAP with adsisearcher or DirectorySearcher for the description, info or
      ms-Mcs-AdmPwd attributes of service accounts.
  legitimate_behavior:
    - Every domain member reads the policies that apply to it from SYSVOL on a schedule.
    - Group Policy administrators browse and back up policy folders.
    - Directory assessment tools such as PingCastle and Purple Knight read all of SYSVOL
      and query description on purpose.
  risk_indicator:
    - The literal string cpassword appears in a command line.
    - One user account reads Preferences XML under many policy GUIDs within minutes.
    - The reading account is a person or a service account, not a machine account.
    - A directory search for description or ms-Mcs-AdmPwd follows from the same host.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: smb_file_access
      connector: crowdstrike-ngsiem
      event_types:
        - SmbFileOpen
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        share_name: ShareName
        file_path: TargetFileName
        remote_address: RemoteAddressIP4

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: cpassword-or-gpp-decryptor-on-command-line
        name: Command naming cpassword or a GPP password function
        purpose: >-
          Return any process whose command line carries cpassword or the name of a
          Preferences decryption function. The string has no use outside an assessment.
          A search typed at an open PowerShell prompt starts no process and is not seen;
          it is seen when findstr is used or the command arrives as an argument.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/cpassword|Get-GPPPassword|Get-CachedGPPPassword|Get-GPPAutologon|gpp-decrypt|gppref/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: recursive-search-of-sysvol-policies
        name: Recursive search or copy of the SYSVOL Policies tree
        purpose: >-
          Return search, listing and copy commands that address a SYSVOL share by UNC
          path and either recurse or name one of the Preferences files.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(findstr|find|powershell|pwsh|cmd|xcopy|robocopy|forfiles|where)\.exe$/i
          | CommandLine=/\\\\[^\\\s"']+\\SYSVOL\\/i
          | CommandLine=/-Recurse|\s\/s\b|\s\/e\b|\\(Groups|Services|ScheduledTasks|DataSources|Printers|Drives)\.xml|\*\.xml|Select-String|\bsls\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: directory-search-for-secret-bearing-attributes
        name: Directory search requesting description, info or LAPS attributes
        purpose: >-
          Return directory-search commands that ask for the attributes passwords are
          left in. Only the command-line form is visible; the LDAP filter of a search
          made inside a running PowerShell session is not.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh|cmd|dsquery|adfind|ldifde|csvde)\.exe$/i
          | CommandLine=/adsisearcher|DirectorySearcher|Get-ADUser|Get-ADObject|Get-ADComputer|Get-DomainUser|dsquery|adfind|ldifde|csvde/i
          | CommandLine=/\bdescription\b|ms-Mcs-AdmPwd|msLAPS-(Encrypted)?Password|userPassword|unixUserPassword|['"\[,]info['"\],]/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: gpp-xml-opened-on-sysvol-by-user-account
        name: Preferences XML opened on SYSVOL by a user account
        purpose: >-
          Return SMB opens of the five Preferences files on a SYSVOL share by accounts
          that are not machine accounts. The event exists only where the domain
          controller carries the sensor. Policy refresh opens these files for the
          policies that apply to the user, so a single open means little; the agent
          counts the distinct policy GUIDs in the paths per user and source address.
        query: |
          #event_simpleName=SmbFileOpen
          | ShareName=/^SYSVOL$/i
          | UserName!=/\$$/
          | TargetFileName=/\\Policies\\\{[0-9A-F-]{36}\}\\.*\\(Groups|Services|ScheduledTasks|DataSources|Printers|Drives)\.xml$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: gpp_credential_search
      name: Command searching SYSVOL for Preferences passwords
      description: >-
        A command names cpassword or a Preferences decryption function, or searches a
        SYSVOL share recursively for the Preferences XML files.
      source: process_creation
      field: command_line
      indicates: stored_credential_search

  supporting:
    - id: policy_fan_out
      name: Preferences files opened under many policy GUIDs
      description: >-
        One account opened Preferences XML under many different policy GUIDs in a short
        burst. The agent derives the count from the paths on the returned SMB events.
      source: smb_file_access
      field: file_path
      indicates: sweep_rather_than_policy_refresh
    - id: reader_is_user_principal
      name: Reader is a person or service account
      description: >-
        The account opening the files is not a machine account and has no role in Group
        Policy administration.
      source: smb_file_access
      field: user
      indicates: non_refresh_principal
    - id: secret_attribute_query
      name: Directory search for description or LAPS attributes
      description: >-
        The same host or user ran a directory search that requests description, info or
        a LAPS password attribute.
      source: process_creation
      field: command_line
      indicates: second_credential_source_searched
    - id: search_from_workstation_session
      name: Search started from a shell under a user session
      description: >-
        The searching process descends from an interactive shell or an implant on a
        workstation rather than from management tooling.
      source: process_creation
      field: parent_process
      indicates: hands_on_keyboard_activity

  contradicting:
    - id: sanctioned_directory_assessment
      name: Sanctioned directory assessment in its window
      description: >-
        The account and host belong to a scheduled PingCastle, Purple Knight or
        penetration-test run with a change record.
      source: baseline
      field: CommandLine
      indicates: authorised_assessment
    - id: group_policy_administrator
      name: Account administers Group Policy
      description: >-
        The user is a directory administrator working in the Group Policy Management
        Console or a GPO backup job.
      source: identity_context
      field: UserName
      indicates: routine_policy_administration

  risk_logic:
    required:
      - gpp_credential_search

    supporting:
      any:
        - policy_fan_out
        - reader_is_user_principal
        - secret_attribute_query
        - search_from_workstation_session
      all:
        - policy_fan_out
        - reader_is_user_principal

    contradicting:
      any:
        - sanctioned_directory_assessment
        - group_policy_administrator
      all: []

  verdict:
    low_risk_when:
      - gpp_credential_search
      - sanctioned_directory_assessment
      - group_policy_administrator
    suspicious_when:
      - gpp_credential_search
      - search_from_workstation_session
    high_risk_when:
      - gpp_credential_search
      - secret_attribute_query
      - search_from_workstation_session

  false_positive:
    - condition: Directory posture tools.
      explanation: >-
        PingCastle, Purple Knight, ADRecon and BloodHound collectors do exactly this and
        several also read description and ms-Mcs-AdmPwd. They run from named hosts under
        named accounts in a change window.
    - condition: Group Policy refresh.
      explanation: >-
        Members read the Preferences files of policies that apply to them, a handful of
        GUIDs at a time. It never names cpassword and never walks every GUID.
    - condition: Administrators auditing their own SYSVOL for cpassword.
      explanation: >-
        Cleaning up old Preferences passwords uses the same search. The account is a
        directory administrator and the work is ticketed.
