# Converted from THORCollective/HEARTH Flames/H289.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-lin-hearth-h289-sshd-binary-replaced-with-password-capturing-build-t1554
version: 1.0.0

info:
  name: sshd binary replaced outside package management with a password-capturing build
  description: >-
    An operator with root replaces /usr/sbin/sshd with a recompiled build that hooks
    userauth_passwd(), the function that receives the plaintext password before PAM, and
    appends every username and password to an encrypted file. Logins keep working, so
    nobody reports anything. In the documented DPRK campaign the log was a
    32-hex-character file under /var/lib/sshd. The log is written by sshd through the
    file API and package verification is a collection task; neither reaches this
    telemetry. The replacement itself does: a write of an executable to the sshd path
    that is not a package manager's temporary-then-rename, a cp, mv, install or download
    command whose target is that path, the service restart needed to bring the new
    binary into use, and later any command that names a file inside sshd's
    privilege-separation directory, which is how the harvest is read back. HEARTH lists
    T1556.003; no PAM module is involved, and the template is filed under T1554.
  severity: critical
  author: huntgraph
  tags:
    - hearth
    - persistence
    - credential-access
    - sshd
    - binary-replacement
    - password-capture
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H289.md
    - https://attack.mitre.org/techniques/T1554
    - https://attack.mitre.org/detectionstrategies/DET0336

mitre:
  tactics:
    - TA0003
  techniques:
    - T1554
  sub_techniques: []
  detection_strategies:
    - DET0336
  analytics:
    - AN0950
  platforms:
    - Linux
  data_sources:
    - auditd:EXECVE
    - auditd:SYSCALL
  data_components:
    - Process Creation
    - File Modification

hypothesis:
  statement: >-
    An operator with root on a Linux host replaces /usr/sbin/sshd with a recompiled
    build that hooks userauth_passwd() and appends every username and plaintext password
    to an encrypted file under /var/lib/sshd, while authentication continues to succeed
    normally.
  attacker_behavior:
    - Copies or downloads a prebuilt sshd over /usr/sbin/sshd.
    - Restarts the SSH service so the replacement is in use.
    - Lets the build write captured credentials to a hex-named file in /var/lib/sshd.
    - Returns to read or copy that file.
  legitimate_behavior:
    - Package managers replace sshd during openssh-server upgrades, by writing a
      temporary file and renaming it.
    - Administrators restart sshd after configuration changes.
    - A few sites build OpenSSH from source and install it under /usr/local.
  risk_indicator:
    - An executable is written directly to /usr/sbin/sshd.
    - cp, mv, install, curl or scp targets the sshd path outside a package transaction.
    - sshd is restarted shortly afterwards with no openssh package activity.
    - A command names a file inside /var/lib/sshd or /var/empty/sshd.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewExecutableWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: command-placing-a-file-on-the-sshd-path
        name: File tool or download writing to the sshd binary path
        purpose: >-
          Return copy, move, install and download commands, and shells carrying them,
          whose command line has the sshd binary path as an argument. Running sshd
          itself does not match, since its own process is not in the tool list; a shell
          that only tests the configuration with sshd -t is removed by the second
          filter.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(cp|mv|install|dd|cat|scp|rsync|curl|wget|tar|ln|sh|bash|dash)$/
          | CommandLine=/\s["']?(of=)?\/usr\/(local\/)?sbin\/sshd["']?(\s|;|&|\||$)/
          | CommandLine=/\b(cp|mv|install|dd|cat|scp|rsync|curl|wget|tar|ln)\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: executable-written-to-the-sshd-path
        name: Executable written directly to the sshd binary path
        purpose: >-
          Return executable writes whose target is exactly the sshd path. dpkg and rpm
          write under a temporary name and rename, so a direct write is not how a
          package arrives. Whether the sensor reports an overwrite of an existing binary
          this way should be confirmed in the tenant.
        query: |
          #event_simpleName=NewExecutableWritten
          | event_platform=Lin
          | TargetFileName=/^\/usr\/(local\/)?sbin\/sshd$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ssh-service-restarted
        name: SSH service restarted or reloaded by command
        purpose: >-
          Return systemctl and service commands that restart, reload, stop or start the
          SSH daemon. Routine on its own; the agent uses it to find a restart that
          follows one of the two cases above on the same host.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(systemctl|service)$/
          | CommandLine=/\b(restart|reload|try-restart|reload-or-restart|stop|start)\b/
          | CommandLine=/\bsshd?(\.service)?\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-naming-file-in-sshd-privilege-separation-directory
        name: Command naming a file inside sshd's privilege-separation directory
        purpose: >-
          Return commands that name a file under /var/lib/sshd or /var/empty/sshd. Those
          directories hold nothing, so a command that reads, copies or lists a file
          there is someone collecting what a modified sshd wrote. The write of the file
          by sshd itself is not visible.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/\/var\/(lib|empty)\/sshd\/[^\s\/"']+/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: sshd_binary_replacement
      name: sshd binary replaced by command
      description: >-
        A file tool, a download or a shell command places a file on /usr/sbin/sshd or
        /usr/local/sbin/sshd.
      source: process_creation
      field: command_line
      indicates: authentication_daemon_replaced

  supporting:
    - id: direct_executable_write
      name: Executable written directly to the sshd path
      description: >-
        An executable write targets the sshd path itself rather than a package manager's
        temporary name.
      source: file_creation
      field: file_path
      indicates: non_package_binary_write
    - id: non_package_parent
      name: Replacement not made by a package manager
      description: >-
        The parent of the replacing command is a shell or an unknown binary, not dpkg,
        rpm, yum, dnf, apt or a configuration-management agent.
      source: process_creation
      field: parent_process
      indicates: manual_binary_replacement
    - id: restart_after_replacement
      name: SSH service restarted afterwards
      description: >-
        The SSH service was restarted on the same host within minutes of the
        replacement. The agent derives the order from the returned events.
      source: process_creation
      field: command_line
      indicates: replacement_brought_into_use
    - id: credential_log_accessed
      name: File in the privilege-separation directory named by a command
      description: >-
        A later command reads or copies a file under /var/lib/sshd or /var/empty/sshd,
        where captured credentials are reported to be kept.
      source: process_creation
      field: command_line
      indicates: captured_credentials_collected

  contradicting:
    - id: package_upgrade
      name: openssh-server package upgrade
      description: >-
        The host installed or upgraded the OpenSSH server package at that time through
        its package manager.
      source: baseline
      field: CommandLine
      indicates: routine_package_upgrade
    - id: site_built_openssh
      name: Site builds OpenSSH from source
      description: >-
        The organisation maintains its own OpenSSH build and installs it through a
        documented procedure on this class of host.
      source: asset_inventory
      field: ComputerName
      indicates: documented_custom_build

  risk_logic:
    required:
      - sshd_binary_replacement

    supporting:
      any:
        - direct_executable_write
        - non_package_parent
        - restart_after_replacement
        - credential_log_accessed
      all:
        - non_package_parent
        - restart_after_replacement

    contradicting:
      any:
        - package_upgrade
        - site_built_openssh
      all: []

  verdict:
    low_risk_when:
      - sshd_binary_replacement
      - package_upgrade
      - site_built_openssh
    suspicious_when:
      - sshd_binary_replacement
      - non_package_parent
    high_risk_when:
      - sshd_binary_replacement
      - non_package_parent
      - restart_after_replacement

  false_positive:
    - condition: Package upgrades.
      explanation: >-
        Upgrades replace sshd and restart the service. The parent is the package
        manager, the write goes through a temporary name and the same thing happens
        across the fleet on patch day.
    - condition: Self-built OpenSSH.
      explanation: >-
        make install copies sshd into place. It is done by named administrators on hosts
        known to run a custom build, usually under /usr/local.
    - condition: Image builds and containers.
      explanation: >-
        Building a system image copies sshd into a root filesystem. The path is under a
        build directory, not the live /usr/sbin.
