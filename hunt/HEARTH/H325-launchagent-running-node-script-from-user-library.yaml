# Converted from THORCollective/HEARTH Flames/H325.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-mac-hearth-h325-launchagent-running-node-script-from-user-library-t1543-001
version: 1.0.0

info:
  name: LaunchAgent that runs a JavaScript file under node from a user data folder
  description: >-
    Mirage Kitten's macOS branch persists with per-user LaunchAgents whose labels claim
    vendors that do not ship the product on macOS: com.intel.dsa.helper for a
    Windows-only Intel tool, com.microsoft.edgeupdate for an updater whose real label is
    com.microsoft.EdgeUpdater, and com.harsh.requireobject. What the three share is the
    program: node, or a copied Node.js binary, run against a .js file under
    ~/Library/Application Support or a dot-prefixed folder such as ~/.config. H133 and
    H148 already hunt the plist being written or loaded by a command and launchd
    starting a binary from a hidden path. Neither returns this shape, because the image
    launchd starts is an ordinary node and the payload is its argument. The sensor does
    not report the plist, its label or its ProgramArguments, and it holds no inventory
    of bundle identifiers, so the test that a label matches no installed application is
    left to the agent. The hunt reads what launchd starts.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - launch-agent
    - nodejs
    - masquerading
    - mirage-kitten
    - macos
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H325.md
    - https://attack.mitre.org/techniques/T1543
    - https://attack.mitre.org/techniques/T1543/001
    - https://attack.mitre.org/detectionstrategies/DET0434

mitre:
  tactics:
    - TA0003
    - TA0004
  techniques:
    - T1543
  sub_techniques:
    - T1543.001
  detection_strategies:
    - DET0434
  analytics: []
  platforms:
    - macOS
  data_sources:
    - CrowdStrike:Endpoint
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary persists on macOS with user-level LaunchAgents whose reverse-DNS labels
    impersonate vendors that do not ship that product on macOS, and whose
    ProgramArguments run a script interpreter such as node, or a copied Node.js binary,
    against a .js file under ~/Library/Application Support or a dotfile directory.
  attacker_behavior:
    - Writes a plist into ~/Library/LaunchAgents labelled com.intel.dsa.helper, com.microsoft.edgeupdate or com.harsh.requireobject.
    - Points the agent at node with a .js file under Application Support or ~/.config.
    - Copies a Node.js binary into the same folder when the host has none.
    - Names the script after the impersonated product, such as idriver_support.js or msedge_update.js.
    - Beacons from the node process to hosts under azurewebsites.net.
  legitimate_behavior:
    - Developers run their own node services from LaunchAgents.
    - Electron and Node-based applications ship helpers that launchd starts from inside the application bundle.
    - Version managers keep node binaries under dot-prefixed folders in the home directory.
  risk_indicator:
    - launchd is the parent and the command line names a .js file under Application Support or a dot folder.
    - The node binary itself sits in a data folder and not under a version manager or /usr/local.
    - The script or label names Intel DSA or an Edge updater on a Mac.
    - The node process resolves an azurewebsites.net host the organisation does not own.

requires:
  platforms:
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: launchd-started-interpreter-with-script-in-user-data-folder
        name: launchd starting a process whose arguments name a .js file in a user data folder
        purpose: >-
          Return processes launchd starts whose command line names a JavaScript file
          under a user's Application Support folder or a dot-prefixed folder in the home
          directory. The image name is not tested, so a copied or renamed node is
          returned as well. A script kept elsewhere, for example under Documents, is
          not.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | ParentBaseFileName=launchd
          | CommandLine=/\/Users\/[^\/]+\/(Library\/Application Support|\.[^\/]+)\/[^"']*\.(js|mjs|cjs)\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-binary-running-from-user-data-folder
        name: node binary whose image is in Application Support or a dot folder that is not a version manager
        purpose: >-
          Return node processes whose image sits under Application Support or a
          dot-prefixed home folder, leaving out the version managers and editors that
          keep node there. This is the copied interpreter, whoever starts it.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=node
          | ImageFileName=/^\/Users\/[^\/]+\/(Library\/Application Support|\.[^\/]+)\//
          | ImageFileName!=/\/(\.nvm|\.volta|\.fnm|\.asdf|\.nodenv|\.nodebrew|\.n|\.local|\.cache|\.npm|\.vscode[^\/]*|\.cursor[^\/]*|Library\/Application Support\/(fnm|Code|Cursor|JetBrains|Herd))\//
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reported-label-or-script-name-on-command-line
        name: Command naming a reported LaunchAgent label or script
        purpose: >-
          Return commands that name one of the three labels or the two script files. The
          match is case-sensitive on purpose: the real Edge updater's label is
          com.microsoft.EdgeUpdater and does not match. These names will change; the
          first case does not depend on them.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | CommandLine=/com\.intel\.dsa\.helper|com\.microsoft\.edgeupdate\b|com\.harsh\.requireobject|idriver_support\.js|msedge_update\.js/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-resolving-azure-app-service-host
        name: node resolving a host under azurewebsites.net
        purpose: >-
          Return DNS requests from node for Azure App Service names, where the reported
          command servers were hosted. Developers working on their own App Service
          applications produce the same lookups; the agent compares the process id with
          the launchd-started processes above.
        query: |
          #event_simpleName=DnsRequest
          | event_platform=Mac
          | ContextBaseFileName=node
          | DomainName=/\.azurewebsites\.net$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: launchd_started_script_interpreter
      name: launchd runs an interpreter against a script in a user data folder
      description: >-
        A process whose parent is launchd names a .js file under Application Support or
        a dot-prefixed home folder on its command line.
      source: process_creation
      field: command_line
      indicates: launch_agent_script_persistence

  supporting:
    - id: interpreter_copied_into_data_folder
      name: node binary sits in a data folder
      description: >-
        The image path of the node process is under Application Support or a dot folder
        that no version manager owns.
      source: process_creation
      field: image_path
      indicates: bundled_interpreter
    - id: impersonated_vendor_name
      name: Script or label names a product the vendor does not ship on macOS
      description: >-
        The command line carries an Intel DSA or Edge update name, or one of the
        reported labels.
      source: process_creation
      field: command_line
      indicates: masqueraded_service_name
    - id: launchd_parent
      name: Parent is launchd
      description: >-
        The process was started by launchd and not by a terminal or an editor.
      source: process_creation
      field: parent_process
      indicates: login_persistence
    - id: app_service_host_resolved
      name: node resolves an Azure App Service host
      description: >-
        A DNS request from node names a host under azurewebsites.net.
      source: dns_request
      field: query_name
      indicates: cloud_hosted_command_server
    - id: resolver_is_launchd_started_node
      name: The resolving process is the launchd-started one
      description: >-
        The process id on the DNS event is the id of a process returned by the first
        case. The agent makes the match.
      source: dns_request
      field: process_id
      indicates: persistent_implant_beacon

  contradicting:
    - id: developer_owned_launch_agent
      name: Agent belongs to the developer's own project
      description: >-
        The user is a developer and the script is in a project they maintain.
      source: identity_context
      field: UserName
      indicates: developer_workflow
    - id: installed_application_helper
      name: Script belongs to an installed application
      description: >-
        An installed application documents the helper and its folder under Application
        Support.
      source: asset_inventory
      field: ComputerName
      indicates: application_component

  risk_logic:
    required:
      - launchd_started_script_interpreter

    supporting:
      any:
        - interpreter_copied_into_data_folder
        - impersonated_vendor_name
        - launchd_parent
        - app_service_host_resolved
        - resolver_is_launchd_started_node
      all:
        - launchd_parent
        - impersonated_vendor_name

    contradicting:
      any:
        - developer_owned_launch_agent
        - installed_application_helper
      all: []

  verdict:
    low_risk_when:
      - launchd_started_script_interpreter
      - developer_owned_launch_agent
      - installed_application_helper
    suspicious_when:
      - launchd_started_script_interpreter
      - launchd_parent
    high_risk_when:
      - launchd_started_script_interpreter
      - impersonated_vendor_name
      - app_service_host_resolved

  false_positive:
    - condition: Developers running services under launchd.
      explanation: >-
        A local API or build watcher started at login looks the same. The script is in a
        project folder the user recognises and the label is theirs.
    - condition: Applications with Node-based helpers.
      explanation: >-
        Some desktop applications keep a helper script under Application Support. The
        application is installed and the script path contains its name.
    - condition: Node installed by a tool not on the exclusion list.
      explanation: >-
        A less common version manager keeps node under a dot folder; the path names the
        tool.
