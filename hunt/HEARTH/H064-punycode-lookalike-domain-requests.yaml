# Converted from THORCollective/HEARTH Flames/H064.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h064-punycode-lookalike-domain-requests-t1036-005
version: 1.0.0

info:
  name: DNS requests for Punycode domains that imitate legitimate services
  description: >-
    An internationalised domain name is carried in DNS as ASCII with the prefix xn--. A
    domain that swaps a Latin letter for a Greek or Cyrillic one that looks the same is
    indistinguishable in an address bar and resolves to wherever its owner likes, which
    makes it a favourite for credential phishing and malware delivery. Every such name
    must use the xn-- form on the wire, so one pattern over DNS requests finds them all.
    Most Punycode domains are simply non-English sites; the agent's work is deciding
    which decode to a look-alike of a brand the organisation uses.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - stealth
    - masquerading
    - punycode
    - idn-homograph
    - dns
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H064.md
    - https://attack.mitre.org/techniques/T1036
    - https://attack.mitre.org/techniques/T1036/005
    - https://attack.mitre.org/detectionstrategies/DET0347
    - https://isc.sans.edu/diary/Add+Punycode+to+your+Threat+Hunting+Routine/32640/

# The analytics for T1036.005 list process and file data, not DNS, which is what this
# hunt reads. No analytic is declared, so data_sources and data_components describe the
# hunt, not an ATT&CK mapping.
mitre:
  tactics:
    - TA0005
  techniques:
    - T1036
  sub_techniques:
    - T1036.005
  detection_strategies:
    - DET0347
  analytics: []
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - CrowdStrike:Endpoint
  data_components:
    - Network Traffic Content

hypothesis:
  statement: >-
    Threat actors are using Punycode-encoded International Domain Names with the xn--
    prefix in DNS queries to masquerade visually similar domain names that impersonate
    legitimate services, for credential harvesting and malware delivery.
  attacker_behavior:
    - Registers a domain that replaces one or two letters of a brand with look-alike characters from another script.
    - Sends the link by email, chat or advertisement so it is clicked and never typed.
    - Hosts a credential page or a download that mimics the real service.
    - Uses the same domain as a download or callback address in a script.
  legitimate_behavior:
    - Staff visit sites whose names are in their own language and script.
    - Advertising and analytics networks resolve internationalised domains in the background.
    - Organisations own internationalised versions of their own brand.
  risk_indicator:
    - The decoded name is a near match for a brand, bank or internal service.
    - The Punycode label is in the registrable part of the name under a common TLD.
    - The request is made by a script interpreter, a mail client or an Office application.
    - The domain is newly registered or has no history in the estate.
    - A credential entry or a file download follows on the same host.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: punycode-domain-requested
        name: DNS request containing a Punycode label
        purpose: >-
          Return every request whose name has a label beginning xn--. The pattern is
          anchored to a label boundary, and one test on one field keeps the scan cheap
          over a long window.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)xn--/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: punycode-registrable-label-common-tld
        name: Punycode label directly under a common top-level domain
        purpose: >-
          Narrow to names where the encoded label is the registrable domain under a
          Latin-script TLD, the shape of a look-alike of a western brand, leaving out
          names whose TLD is itself internationalised.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)xn--[a-z0-9-]+\.(com|net|org|io|co|app|info|biz|online|site|xyz|top|us|uk|de|fr|eu)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: punycode-domain-requested-by-non-browser
        name: Punycode domain resolved by a non-browser process
        purpose: >-
          Return Punycode requests made by interpreters, Office applications and system
          utilities, where a user did not simply browse to a foreign-language site.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)xn--/i
          | ContextBaseFileName=/^(powershell|pwsh|cmd|mshta|wscript|cscript|rundll32|regsvr32|certutil|bitsadmin|curl|wget|python[0-9.]*w?|node|osascript|winword|excel|powerpnt|outlook|msiexec)(\.exe)?$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: punycode_domain_request
      name: DNS request for a Punycode domain
      description: >-
        A DNS request names a domain with an xn-- label, showing the host resolved an
        internationalised domain name.
      source: dns_request
      field: query_name
      indicates: internationalised_domain_contacted

  supporting:
    - id: decodes_to_brand_lookalike
      name: Name decodes to a look-alike of a known brand
      description: >-
        Decoded, the name differs from a brand, bank or internal service only by
        characters from another script, which the agent establishes by decoding the
        label.
      source: derived
      field: DomainName
      indicates: homograph_impersonation
    - id: non_browser_requester
      name: Request made by a non-browser process
      description: >-
        The requesting process is a script interpreter, an Office application or a
        transfer utility.
      source: dns_request
      field: process_name
      indicates: scripted_or_document_driven_request
    - id: newly_registered_domain
      name: Domain is newly registered or low reputation
      description: >-
        Threat intelligence shows the domain was registered recently or has a poor
        reputation.
      source: threat_intel
      field: DomainName
      indicates: disposable_phishing_infrastructure

  contradicting:
    - id: native_language_site
      name: Name decodes to an ordinary foreign-language site
      description: >-
        Decoded, the name is a word or brand in another language with no resemblance to
        a service the organisation uses.
      source: derived
      field: DomainName
      indicates: legitimate_internationalised_site
    - id: domain_long_established
      name: Domain has long history in the estate
      description: >-
        Earlier activity shows the same domain requested by many hosts over a long
        period.
      source: baseline
      field: DomainName
      indicates: established_destination

  risk_logic:
    required:
      - punycode_domain_request

    supporting:
      any:
        - decodes_to_brand_lookalike
        - non_browser_requester
        - newly_registered_domain
      all:
        - decodes_to_brand_lookalike
        - newly_registered_domain

    contradicting:
      any:
        - native_language_site
        - domain_long_established
      all: []

  verdict:
    low_risk_when:
      - punycode_domain_request
      - native_language_site
      - domain_long_established
    suspicious_when:
      - punycode_domain_request
      - decodes_to_brand_lookalike
    high_risk_when:
      - punycode_domain_request
      - decodes_to_brand_lookalike
      - newly_registered_domain

  false_positive:
    - condition: Staff browse sites in other languages.
      explanation: >-
        German, Chinese, Arabic and many other sites use internationalised names. In a
        multilingual organisation this is most of the results, and the decoded name
        makes it obvious.
    - condition: Advertising networks resolve internationalised domains.
      explanation: >-
        Background requests from browsers for ad and tracking domains include Punycode
        names. They recur across many hosts and resemble no brand.
    - condition: The organisation owns internationalised variants of its brand.
      explanation: >-
        Defensive registrations decode to the brand itself. They belong on an allow-list
        once identified.
