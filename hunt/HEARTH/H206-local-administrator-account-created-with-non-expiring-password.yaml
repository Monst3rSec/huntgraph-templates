# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h206-local-administrator-account-created-with-non-expiring-password-t1136-001
version: 1.0.0

info:
  name: Local account created, added to Administrators and set never to expire
  description: >-
    Amadey's command 0x19 creates a local account, adds it to the Administrators group,
    and stops its password expiring or being changed. The Windows Security events for
    this (4720, 4732, 4738) are not collected here, so the hunt reads the commands.
    Amadey can also make the account through the NetUserAdd and NetLocalGroupAddMembers
    APIs, in which case no net.exe runs and nothing in this template sees it. What is
    returned is the command form: an account added, an account added to Administrators,
    and expiry or password change switched off. The agent puts the three together by
    host and time and looks at what started them.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - create-account
    - local-account
    - administrators
    - amadey
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H206.md
    - https://attack.mitre.org/techniques/T1136/001
    - https://attack.mitre.org/detectionstrategies/DET0447
    - https://www.welivesecurity.com/en/eset-research/eset-takes-part-operation-endgame-disrupt-amadey-stealc/
    - https://www.microsoft.com/en-us/security/blog/2026/06/24/stealc-and-amadey-breaking-down-infostealers-and-the-cybercrime-services-that-deliver-them/

mitre:
  tactics:
    - TA0003
  techniques:
    - T1136
  sub_techniques:
    - T1136.001
  detection_strategies:
    - DET0447
  analytics:
    - AN1235
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    Amadey (Operation Endgame infostealer) creates a new local account via command 0x19,
    adds it to the Administrators group, and disables password expiration to establish
    privileged persistence. Hunt for local privileged-account creation correlated with
    execution of binaries in user-writable paths.
  attacker_behavior:
    - Creates a local account with a password of its choosing.
    - Adds the account to the local Administrators group.
    - Sets the password never to expire and stops the user changing it.
    - Runs these from a binary staged in a user profile or Temp folder.
    - Enables Remote Desktop and logs on with the new account.
  legitimate_behavior:
    - Build and imaging scripts create local service and break-glass accounts.
    - Help desk staff add a local administrator while fixing a machine.
    - Management tools rotate a managed local administrator account.
  risk_indicator:
    - The three commands run within minutes of each other on one host.
    - The parent is not a management agent, an installer or an administrator's shell.
    - The parent's image is under a user profile, Temp or ProgramData.
    - The account name is random or imitates a system account.
    - The host is a user workstation with no provisioning in progress.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: local-account-created-by-command
        name: Local account created with net, PowerShell or WMIC
        purpose: >-
          Return commands that add a local account. Domain account creation carries
          /domain and is H008's subject, so it is excluded. The password is on the
          command line when net user is used.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(net|net1|powershell|pwsh|wmic|cmd)\.exe$/i
          | CommandLine=/\buser\s+.*\/add\b|New-LocalUser\b|useraccount\s+create/i
          | CommandLine!=/\/do(m|ma|mai|main)?\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: account-added-to-local-administrators
        name: Account added to the local Administrators group
        purpose: >-
          Return commands that add a member to the Administrators group. The group name
          is matched by its stem so localised names such as Administratoren and
          Administradores also match.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(net|net1|powershell|pwsh|cmd)\.exe$/i
          | CommandLine=/localgroup\s+"?administra\w*"?\s+.*\/add\b|Add-LocalGroupMember\b.*administra/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: password-expiry-or-change-disabled
        name: Password expiry or password change switched off for an account
        purpose: >-
          Return commands that set a password never to expire or stop the user changing
          it. These are the two account flags the report describes; set through the API
          they leave no command.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(net|net1|powershell|pwsh|wmic|cmd)\.exe$/i
          | CommandLine=/PasswordExpires\s*=\s*['"]?false|\/expires:never|PasswordNeverExpires|\/maxpwage:unlimited|\/passwordchg:no|UserMayNotChangePassword|PasswordChangeable\s*=\s*['"]?false/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: local_account_created
      name: Local account created by command
      description: >-
        A net user /add, New-LocalUser or WMIC useraccount create command ran without
        /domain.
      source: process_creation
      field: command_line
      indicates: local_account_creation

  supporting:
    - id: added_to_administrators
      name: Account added to Administrators
      description: >-
        A command on the same host added an account to the local Administrators group.
        The agent matches the account name across the returned events.
      source: process_creation
      field: command_line
      indicates: privileged_account
    - id: expiry_disabled
      name: Password expiry or change disabled
      description: >-
        A command on the same host set a password never to expire or stopped the user
        changing it.
      source: process_creation
      field: command_line
      indicates: durable_account
    - id: started_by_unexpected_parent
      name: Command started by an unexpected parent
      description: >-
        The parent is not a management agent, an installer or an interactive
        administrator shell. The parent's path is not on the event; the agent looks it
        up by parent process id.
      source: process_creation
      field: parent_process
      indicates: malware_issued_command

  contradicting:
    - id: recorded_provisioning
      name: Account creation is recorded
      description: >-
        A ticket or provisioning record covers the account on this host at this time.
      source: change_management
      field: ComputerName
      indicates: authorised_account_creation
    - id: host_being_imaged
      name: Host is being built or imaged
      description: >-
        Inventory shows the host was in deployment when the commands ran.
      source: asset_inventory
      field: ComputerName
      indicates: provisioning_activity

  risk_logic:
    required:
      - local_account_created

    supporting:
      any:
        - added_to_administrators
        - expiry_disabled
        - started_by_unexpected_parent
      all:
        - added_to_administrators
        - expiry_disabled

    contradicting:
      any:
        - recorded_provisioning
        - host_being_imaged
      all: []

  verdict:
    low_risk_when:
      - local_account_created
      - recorded_provisioning
      - host_being_imaged
    suspicious_when:
      - local_account_created
      - added_to_administrators
    high_risk_when:
      - local_account_created
      - added_to_administrators
      - expiry_disabled
      - started_by_unexpected_parent

  false_positive:
    - condition: Imaging scripts create a local administrator.
      explanation: >-
        They run during deployment under the deployment tool and use the organisation's
        standard account name.
    - condition: Help desk adds a temporary local administrator.
      explanation: >-
        A ticket covers it and the technician's remote session is the parent.
