# Converted from THORCollective/HEARTH Flames/H362.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH also cites T1053.005 and T1105. The ssh.exe LocalCommand step of the same
# chain is H257's subject and is not repeated. The applet's load from the share is
# module-load telemetry and is not collected; the command line that names the
# share is.
type: detection

id: hg-win-hearth-h362-control-rundll-loading-applet-from-webdav-share-via-named-tasks-t1218-002
version: 1.0.0

info:
  name: control.exe Control_RunDLL loading a Control Panel applet from a WebDAV or UNC path
  description: >-
    In Star Blizzard's RedFlick chain an MSI creates scheduled tasks with names an
    administrator would pass over: Internet Quality Test Connection, Network
    Configuration Manager and System Health Monitor. One prepares WebDAV, and one runs
    control.exe Shell32.dll,Control_RunDLL against an applet DLL on a remote WebDAV
    path, which downloads the CosmicPulse Python backdoor. The downloader is never a
    local executable and the process that loads it is signed. Control_RunDLL with a path
    that is not local is the anchor; the hunt also returns the three task names wherever
    they appear on a command line, the WebClient redirector's rundll32 call that names
    the server, and control.exe started by the Task Scheduler.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - defense-evasion
    - control-panel
    - control-rundll
    - webdav
    - scheduled-task
    - star-blizzard
    - redflick
    - cosmicpulse
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H362.md
    - https://attack.mitre.org/techniques/T1218
    - https://attack.mitre.org/techniques/T1218/002
    - https://attack.mitre.org/detectionstrategies/DET0194

mitre:
  tactics:
    - TA0005
  techniques:
    - T1218
  sub_techniques:
    - T1218.002
  detection_strategies:
    - DET0194
  analytics:
    - AN0558
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    A Star Blizzard RedFlick intrusion is persisting through scheduled tasks with
    plausible IT-sounding names, one of which invokes control.exe
    Shell32.dll,Control_RunDLL against a Control Panel applet DLL staged on a remote
    WebDAV path, so the downloader never touches disk as a local executable, the loading
    process is a signed Windows binary, and the module arrives over WebDAV as what looks
    like ordinary file access.
  attacker_behavior:
    - Installs an MSI fetched by URL with msiexec /qn.
    - Creates scheduled tasks named after network and health checks.
    - Runs control.exe Shell32.dll,Control_RunDLL with a WebDAV path as the applet.
    - Downloads and installs a Python backdoor from the applet.
  legitimate_behavior:
    - Windows and shortcuts start control.exe or rundll32 with Control_RunDLL and a system .cpl.
    - Vendor control panels install a .cpl under System32 or Program Files.
    - Staff reach SharePoint and file shares over WebDAV from Explorer and Office.
  risk_indicator:
    - The Control_RunDLL argument is a UNC, DavWWWRoot, @SSL or http path.
    - The applet path is in a user-writable directory.
    - control.exe is started by the Task Scheduler.
    - One of the three reported task names appears on a command line.
    - The WebDAV server named by the redirector is not one the organisation uses.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: control-rundll-with-remote-applet-path
        name: Control_RunDLL with a UNC, WebDAV or URL applet path
        purpose: >-
          Return control.exe and rundll32.exe command lines that call Control_RunDLL
          with a path that begins with two backslashes, names DavWWWRoot or an @SSL or
          @port host, or is a URL. control.exe hands the call to rundll32.exe, so both
          processes are returned for one execution.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(control|rundll32)\.exe$/i
          | CommandLine=/Control_RunDLL/i
          | CommandLine=/Control_RunDLL(AsUser)?\s+"?(\\\\|https?:\/\/)|DavWWWRoot|@SSL\\|@\d{2,5}\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: control-rundll-with-applet-in-user-writable-path
        name: Control_RunDLL with an applet in a user-writable directory
        purpose: >-
          Return the same call where the applet is a local file under AppData,
          ProgramData, Users\Public, Downloads or a Temp folder, the form a variant that
          copies the applet down first would take.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(control|rundll32)\.exe$/i
          | CommandLine=/Control_RunDLL(AsUser)?\s+"?[a-z]:\\[^"]*\\(AppData|ProgramData|Users\\Public|Downloads|Temp)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: control-panel-started-by-task-scheduler
        name: control.exe started by the Task Scheduler
        purpose: >-
          Return control.exe whose parent is the scheduler's service host. A task that
          opens Control Panel has no ordinary purpose. The task name is not on this
          event.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^control\.exe$/i
          | ParentBaseFileName=/^(svchost|taskeng|taskhostw)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reported-task-names-on-command-line
        name: Command line naming one of the reported scheduled tasks
        purpose: >-
          Return any command line that contains Internet Quality Test Connection,
          Network Configuration Manager or System Health Monitor. The tasks were created
          by an MSI, whose custom action may register them without schtasks; this case
          sees them only when a command names them. The second and third names are
          ordinary enough that products may share them.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/Internet Quality Test Connection|Network Configuration Manager|System Health Monitor/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: webdav-redirector-connecting-to-server
        name: WebClient redirector call naming a WebDAV server
        purpose: >-
          Return rundll32 davclnt.dll,DavSetCookie, which Windows starts when a process
          first opens a WebDAV path. The server and path are on the command line, which
          is where the agent reads the host the applet came from. SharePoint and other
          WebDAV use is returned too.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^rundll32\.exe$/i
          | CommandLine=/davclnt\.dll,\s*DavSetCookie/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: control_rundll_non_system_applet
      name: Control_RunDLL called with a remote or user-writable applet
      description: >-
        control.exe or rundll32.exe calls Control_RunDLL with an applet path on a UNC or
        WebDAV location, a URL, or a user-writable local directory.
      source: process_creation
      field: command_line
      indicates: control_panel_proxy_execution

  supporting:
    - id: started_by_scheduler
      name: Call is started by the Task Scheduler
      description: >-
        The parent of control.exe is the Task Scheduler's service host.
      source: process_creation
      field: parent_process
      indicates: scheduled_task_persistence
    - id: reported_task_name
      name: Reported task name on a command line
      description: >-
        A command line on the host names one of the three reported tasks.
      source: process_creation
      field: command_line
      indicates: known_campaign_task
    - id: webdav_server_external
      name: WebDAV server is outside the organisation
      description: >-
        The redirector's command line names a server that is not the organisation's
        SharePoint or file service.
      source: process_creation
      field: command_line
      indicates: remote_payload_host
    - id: python_started_after_applet
      name: Python interpreter started after the applet ran
      description: >-
        A Python process from a user-writable path starts under the same rundll32
        process id shortly afterwards, by the agent's follow-up on the returned process
        id.
      source: process_creation
      field: process_id
      indicates: backdoor_installed_by_downloader
    - id: targeted_user
      name: User is in a targeted role
      description: >-
        The account belongs to someone in government, policy, NGO, academic or defence
        work.
      source: process_creation
      field: user
      indicates: targeted_victim_profile

  contradicting:
    - id: vendor_control_panel_applet
      name: Applet belongs to an installed product
      description: >-
        The applet path is a vendor's control panel on a share or folder the
        organisation deploys it from.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software
    - id: call_common_in_estate
      name: Same call runs on many hosts
      description: >-
        Earlier activity shows the same command line across the estate from a logon
        script or shortcut.
      source: baseline
      field: CommandLine
      indicates: established_administration

  risk_logic:
    required:
      - control_rundll_non_system_applet

    supporting:
      any:
        - started_by_scheduler
        - reported_task_name
        - webdav_server_external
        - python_started_after_applet
        - targeted_user
      all:
        - started_by_scheduler
        - webdav_server_external

    contradicting:
      any:
        - vendor_control_panel_applet
        - call_common_in_estate
      all: []

  verdict:
    low_risk_when:
      - control_rundll_non_system_applet
      - vendor_control_panel_applet
      - call_common_in_estate
    suspicious_when:
      - control_rundll_non_system_applet
      - started_by_scheduler
    high_risk_when:
      - control_rundll_non_system_applet
      - started_by_scheduler
      - webdav_server_external

  false_positive:
    - condition: A legacy application keeps its control panel applet on a file share.
      explanation: >-
        The share is internal, the same command runs for every user of the application
        and no scheduled task starts it.
    - condition: Help-desk shortcuts open a control panel by path.
      explanation: >-
        The path is under System32 or Program Files and is not matched by either applet
        case.
