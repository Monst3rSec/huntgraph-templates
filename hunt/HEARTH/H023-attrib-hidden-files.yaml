# Converted from THORCollective/HEARTH Flames/H023.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# Also holds H277 (attrib +h +s on a randomly named ProgramData staging directory after
# a ClickFix paste). It differs in lure and in setting the system attribute as well; the
# paste chain is H088.
type: detection

id: hg-win-hearth-h023-attrib-hidden-files-t1564-001
version: 1.1.0

info:
  name: attrib +h used to hide files and directories
  description: >-
    Setting the hidden attribute, often with the system attribute beside it, removes a
    file or folder from Explorer's default view and from a plain dir listing. It is a
    one-line way to keep a payload, a staging folder or a persistence script out of sight
    of the user and of a casual responder. attrib.exe is also used by installers and
    administrators, so the hunt returns each use that sets the attribute, with the target
    path and the parent, for the agent to separate by what was hidden and who hid it.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - stealth
    - hidden-files
    - attrib
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H023.md
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H277.md
    - https://attack.mitre.org/techniques/T1564
    - https://attack.mitre.org/techniques/T1564/001
    - https://attack.mitre.org/detectionstrategies/DET0032
    - https://www.huntress.com/blog/inside-bluenoroff-web3-intrusion-analysis

mitre:
  tactics:
    - TA0005
  techniques:
    - T1564
  sub_techniques:
    - T1564.001
  detection_strategies:
    - DET0032
  analytics:
    - AN0091
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    Threat actors are using the attrib +h command to hide files and directories on the
    compromised Windows system, to maintain stealth and evade detection by users and
    responders.
  attacker_behavior:
    - Runs attrib +h, usually with +s, on a dropped payload or script.
    - Hides a staging directory under a user profile, ProgramData or Public.
    - Hides the files that back a Run key, scheduled task or startup-folder entry.
    - Issues the command from a script, loader or remote shell straight after writing the file.
  legitimate_behavior:
    - Installers hide their own support and cache folders.
    - Administrators and scripts hide configuration files on shared machines.
    - Backup and synchronisation software marks its metadata files hidden.
  risk_indicator:
    - The hidden target is an executable, script or archive.
    - The target sits in a user-writable or temporary directory.
    - The parent is a script host, Office application, PowerShell or a remote-management process.
    - Both the hidden and system attributes are set on a file outside the Windows directory.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: attrib-sets-hidden
        name: attrib setting the hidden attribute
        purpose: >-
          Return every attrib run that adds the hidden attribute. The image-name test
          runs first, so the command-line pattern is tried only on attrib itself.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^attrib\.exe$/i
          | CommandLine=/\s\+[sr]*h/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: attrib-hides-in-writable-path
        name: attrib hiding a target in a user-writable location
        purpose: >-
          Narrow to targets under user profiles, ProgramData, Public and temporary
          directories, where hidden payloads and staging folders are kept.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^attrib\.exe$/i
          | CommandLine=/\s\+[sr]*h/i
          | CommandLine=/\\(Users|ProgramData|Windows\\Temp|PerfLogs|Temp|\$Recycle\.Bin)\\|%(APPDATA|LOCALAPPDATA|TEMP|TMP|PUBLIC|PROGRAMDATA)%/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: attrib-hides-executable-content
        name: attrib hiding an executable, script or archive
        purpose: >-
          Return runs whose target is a file type that carries code or staged data,
          wherever it sits.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^attrib\.exe$/i
          | CommandLine=/\s\+[sr]*h/i
          | CommandLine=/\.(exe|dll|scr|bat|cmd|ps1|vbs|vbe|js|jse|hta|lnk|zip|7z|rar)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: attrib-hidden-and-system-on-staging-directory
        name: attrib setting hidden and system together on a staging path under a shell
        purpose: >-
          Return attrib runs that add both +h and +s to a target under ProgramData,
          Public or AppData where the parent is a shell or script host. In the ClickFix
          chain attrib is started by the shell in the Terminal tab, not by Terminal
          itself.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^attrib\.exe$/i
          | ParentBaseFileName=/^(cmd|powershell|pwsh|wscript|cscript)\.exe$/i
          | CommandLine=/\s\+[sr]*h/i
          | CommandLine=/\s\+[hr]*s/i
          | CommandLine=/\\(ProgramData|Users\\Public|AppData\\(Roaming|Local))\\|%(PROGRAMDATA|PUBLIC|APPDATA|LOCALAPPDATA|TEMP)%/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: hidden_attribute_set
      name: Hidden attribute applied with attrib
      description: >-
        An attrib.exe command line adds the hidden attribute to a file or directory,
        naming the target path.
      source: process_creation
      field: command_line
      indicates: file_or_directory_concealment

  supporting:
    - id: hidden_code_or_archive
      name: Hidden target carries code or staged data
      description: >-
        The target named on the command line is an executable, script, shortcut or
        archive, or a directory in a user-writable location.
      source: process_creation
      field: command_line
      indicates: payload_or_staging_concealment
    - id: scripted_attrib_parent
      name: attrib launched by a script or unexpected parent
      description: >-
        The parent is a script host, PowerShell, an Office application or a
        remote-management process, not an installer or an administrator's console.
      source: process_creation
      field: parent_process
      indicates: abnormal_execution_chain
    - id: non_admin_attrib_user
      name: Run by an ordinary user account
      description: >-
        The user is a standard interactive account with no reason to change file
        attributes from the command line.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: installer_hides_own_files
      name: Target belongs to an installed product
      description: >-
        The hidden path is inside the directory of software inventoried for the host and
        the parent is that product's installer or updater.
      source: asset_inventory
      field: ComputerName
      indicates: expected_installer_behaviour
    - id: attrib_command_common
      name: Same command recurs across the fleet
      description: >-
        Earlier activity shows the identical attrib command on many hosts, as a logon
        script or deployment package would produce.
      source: baseline
      field: CommandLine
      indicates: established_software_behaviour

  risk_logic:
    required:
      - hidden_attribute_set

    supporting:
      any:
        - hidden_code_or_archive
        - scripted_attrib_parent
        - non_admin_attrib_user
      all:
        - hidden_code_or_archive
        - scripted_attrib_parent

    contradicting:
      any:
        - installer_hides_own_files
        - attrib_command_common
      all: []

  verdict:
    low_risk_when:
      - hidden_attribute_set
      - installer_hides_own_files
      - attrib_command_common
    suspicious_when:
      - hidden_attribute_set
      - hidden_code_or_archive
    high_risk_when:
      - hidden_attribute_set
      - hidden_code_or_archive
      - scripted_attrib_parent

  false_positive:
    - condition: Installers and updaters hide their support folders.
      explanation: >-
        Many products hide cache and rollback directories during setup. The parent is
        the installer and the path is under the product's own directory.
    - condition: Logon and deployment scripts hide configuration files.
      explanation: >-
        These run the same command on every host at logon or deployment, on the same
        path each time.
    - condition: A user hides personal files.
      explanation: >-
        It happens, usually on documents and pictures from an interactive prompt. The
        file type and the absence of a scripted parent distinguish it.
