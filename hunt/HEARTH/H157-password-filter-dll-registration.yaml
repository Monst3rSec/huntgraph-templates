# Converted from THORCollective/HEARTH Flames/H157.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h157-password-filter-dll-registration-t1556-002
version: 1.0.0

info:
  name: Password filter DLL added to the LSA notification packages
  description: >-
    The local security authority calls every DLL listed in the Notification Packages
    value of the Lsa key each time a password is set or changed, and hands it the new
    password in clear text. On a domain controller that is every domain password change.
    An intruder with administrator rights puts a DLL in System32, appends its name to
    the value and waits for the next restart; in the reported intrusion the DLL was
    passms.dll. The load into lsass is a Module Load event and is not claimed. The
    registration is a registry write, the DLL must be written into System32 for the
    filter to load, and either may be done through a command. On most hosts the value
    holds scecli alone, or scecli and rassfm, so any other name is worth reading.
  severity: critical
  author: huntgraph
  tags:
    - hearth
    - credential-access
    - persistence
    - password-filter
    - lsa
    - domain-controller
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H157.md
    - https://attack.mitre.org/techniques/T1556
    - https://attack.mitre.org/techniques/T1556/002
    - https://attack.mitre.org/detectionstrategies/DET0472

mitre:
  tactics:
    - TA0006
    - TA0003
  techniques:
    - T1556
  sub_techniques:
    - T1556.002
  detection_strategies:
    - DET0472
  analytics:
    - AN1303
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Windows Registry Key Modification
    - File Creation

hypothesis:
  statement: >-
    Threat actors are appending a malicious password filter DLL (for example passms.dll)
    to HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification Packages on a domain
    controller, receiving clear-text credentials from LSA through PasswordFilter
    callbacks on every password set or change after the next restart.
  attacker_behavior:
    - Writes a filter DLL into System32.
    - Appends the DLL's name to the Notification Packages value.
    - Restarts the host, or waits for a restart, so that LSA loads the filter.
    - Collects the passwords the filter writes to a file or sends out.
  legitimate_behavior:
    - Windows sets the value to scecli, and to rassfm where remote access is installed.
    - Password-quality products and Entra Password Protection add their own filter on domain controllers.
    - Security baselines and build scripts set the value to its expected contents.
  risk_indicator:
    - Notification Packages is written with a name that is not a Windows or installed-product filter.
    - A DLL of that name was written into System32 by something that is not an installer.
    - The write is made by reg.exe or PowerShell from a remote session.
    - The host is a domain controller.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: notification-packages-value-written
        name: Notification Packages value written under the Lsa key
        purpose: >-
          Return every write of Notification Packages, with the new list as its data.
          Nothing is excluded: the value changes when a filter is installed or removed
          and otherwise not at all. This case depends on the sensor reporting writes
          under Control\Lsa and carrying a multi-string value in its string field;
          confirm both in the tenant.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\Control\\Lsa\\?$/i
          | RegValueName=/^Notification Packages$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-editing-notification-packages
        name: Command naming the Notification Packages value
        purpose: >-
          Return any command that names the value: reg.exe, PowerShell, or a script that
          reads it. This is seen whether or not the sensor reports the registry write
          and gives the account and parent. A write made through registry API calls from
          the intruder's own program starts no such command.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/Notification Packages/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: dll-written-to-system32-outside-servicing
        name: DLL written into System32 by something other than Windows servicing
        purpose: >-
          Return DLLs written directly into System32 when the writer is not Windows
          servicing, the installer service or the antivirus engine. A password filter
          has to be in System32 to load, so the malicious DLL is in this set; so are
          DLLs that third-party installers place there, named by the writer.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\Windows\\System32\\[^\\]+\.dll$/i
          | ContextBaseFileName!=/^(TiWorker|TrustedInstaller|msiexec|wuauclt|MoUsoCoreWorker|dism|DismHost|poqexec|drvinst|setup|SetupHost|wusa|MsMpEng|mscorsvw|ngen|OfficeClickToRun)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: notification_packages_written
      name: Notification Packages value written
      description: >-
        A registry write changes the Notification Packages value under Control\Lsa.
      source: registry
      field: registry_value
      indicates: password_filter_registered

  supporting:
    - id: filter_name_unfamiliar
      name: List holds a name that is not a known filter
      description: >-
        The value's data includes a name other than scecli, rassfm and the filters of
        password-quality software installed on the host.
      source: registry
      field: registry_data
      indicates: untrusted_password_filter
    - id: registration_by_command
      name: Value changed by a command
      description: >-
        reg.exe, PowerShell or another process names Notification Packages on its
        command line.
      source: process_creation
      field: command_line
      indicates: manual_registry_registration
    - id: registration_from_remote_or_script_parent
      name: Command came from a remote session or script
      description: >-
        The parent of the command is a remote-management process, a script host or a
        service.
      source: process_creation
      field: parent_process
      indicates: operator_driven_execution
    - id: dll_written_to_system32
      name: DLL written into System32 beforehand
      description: >-
        A DLL whose name matches the new entry is written into System32 on the host by a
        process that is not Windows servicing or an installer.
      source: file_creation
      field: file_path
      indicates: filter_dll_staged
    - id: dll_writer_unexpected
      name: DLL writer is a shell, script host or copy utility
      description: >-
        The process named on the file-write event is cmd, PowerShell, a remote
        administration tool or an unknown executable.
      source: file_creation
      field: writer_process_name
      indicates: payload_dropped_by_untrusted_process
    - id: host_is_domain_controller
      name: Host is a domain controller
      description: >-
        The host on the registry event is a domain controller, where the filter sees
        every domain password change.
      source: registry
      field: host
      indicates: high_value_credential_source

  contradicting:
    - id: password_quality_product_installed
      name: Filter belongs to installed software
      description: >-
        Asset records show a password-quality product or Entra Password Protection on
        the host whose documented filter name matches the new entry.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software_installation
    - id: baseline_enforcement
      name: Write is baseline enforcement
      description: >-
        A change record or the configuration-management history shows the value being
        set to its standard contents.
      source: change_management
      field: ComputerName
      indicates: managed_configuration

  risk_logic:
    required:
      - notification_packages_written

    supporting:
      any:
        - filter_name_unfamiliar
        - registration_by_command
        - registration_from_remote_or_script_parent
        - dll_written_to_system32
        - dll_writer_unexpected
        - host_is_domain_controller
      all:
        - filter_name_unfamiliar
        - dll_written_to_system32

    contradicting:
      any:
        - password_quality_product_installed
        - baseline_enforcement
      all: []

  verdict:
    low_risk_when:
      - notification_packages_written
      - password_quality_product_installed
    suspicious_when:
      - notification_packages_written
      - filter_name_unfamiliar
    high_risk_when:
      - notification_packages_written
      - filter_name_unfamiliar
      - host_is_domain_controller

  false_positive:
    - condition: Password-quality products.
      explanation: >-
        Entra Password Protection, and commercial password-policy tools, install a
        filter on every domain controller. The name is documented and the write happens
        at install, on all controllers alike.
    - condition: Baseline and audit scripts.
      explanation: >-
        A script that reads the value to check it names the value on its command line
        and matches the second case. It reads and does not write.
