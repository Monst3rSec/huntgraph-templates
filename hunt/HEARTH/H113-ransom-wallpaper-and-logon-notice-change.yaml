# Converted from THORCollective/HEARTH Flames/H113.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h113-ransom-wallpaper-and-logon-notice-change-t1491-001
version: 1.0.0

info:
  name: Desktop wallpaper or logon notice changed to show a ransom message
  description: >-
    Once encryption has run, ransomware makes sure the user knows: LockBit replaced the
    desktop background in the ActiveMQ intrusion, and other families set the legal notice
    shown before logon or the logon screen background. These are registry values, written
    either by the ransomware itself or by reg.exe and PowerShell, and the hunt returns
    both forms along with the rundll32 call that makes a new wallpaper take effect and a
    ransom note being opened in a viewer. HEARTH also asks for the notes dropped in every
    directory; text and HTML file creation is not an event this deployment collects, so
    the notes are seen only when one is opened. This is a late signal. Its use is to
    trigger containment while encryption is still spreading to other hosts.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - impact
    - ransomware
    - defacement
    - wallpaper
    - legal-notice
    - lockbit
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H113.md
    - https://attack.mitre.org/techniques/T1491
    - https://attack.mitre.org/techniques/T1491/001
    - https://attack.mitre.org/detectionstrategies/DET0082

mitre:
  tactics:
    - TA0040
  techniques:
    - T1491
  sub_techniques:
    - T1491.001
  detection_strategies:
    - DET0082
  analytics:
    - AN0229
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary is modifying the desktop wallpaper, dropping ransom note files, or
    altering login screen settings via registry changes to display extortion messaging to
    users after ransomware deployment.
  attacker_behavior:
    - Writes an image to disk and points the Wallpaper value at it.
    - Sets legalnoticecaption and legalnoticetext so the demand shows before logon.
    - Enables OEMBackground or a lock-screen policy to replace the logon screen.
    - Calls UpdatePerUserSystemParameters so the wallpaper changes at once.
    - Opens the ransom note in Notepad or mshta on the desktop.
  legitimate_behavior:
    - Group Policy sets a corporate wallpaper and a legal notice on every host.
    - Users change their own wallpaper through Settings.
    - OEM images set a branded logon background.
  risk_indicator:
    - The wallpaper path points at Temp, ProgramData or a file with a random name.
    - The legal notice text mentions encryption, payment or a contact address.
    - The writing process is not Explorer, Settings or the Group Policy client.
    - The same value is written on many hosts within minutes.
    - Recovery inhibition or mass file writes are seen on the host just before.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: wallpaper-or-logon-notice-registry-write
        name: Registry write to the wallpaper, legal notice or logon background value
        purpose: >-
          Return writes to the Wallpaper value under Control Panel\Desktop or the
          Personalization policy key, to the legal notice values, and to OEMBackground.
          The event carries the new data and the writer's process id; the agent resolves
          the writer from process events. A user changing wallpaper in Settings matches.
          The case depends on the sensor reporting writes under these keys; confirm in the
          tenant.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegValueName=/^(Wallpaper|DesktopImagePath|LockScreenImage|legalnoticecaption|legalnoticetext|OEMBackground)$/i
          | RegObjectName=/\\Control Panel\\Desktop$|\\Policies\\System$|\\Windows\\(Personalization|PersonalizationCSP)$|\\Authentication\\LogonUI\\Background$|\\Windows NT\\CurrentVersion\\Winlogon$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-setting-wallpaper-or-logon-notice
        name: Command setting the wallpaper or legal notice
        purpose: >-
          Return reg.exe, PowerShell and cmd.exe commands that name the legal notice
          values, the Wallpaper value under Control Panel\Desktop, OEMBackground or the
          SystemParametersInfo call. Ransomware that writes the values through the
          registry API runs no such command and is seen only in the registry case.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(reg|powershell|pwsh|cmd)\.exe$/i
          | CommandLine=/legalnotice(caption|text)|Control Panel\\Desktop.*Wallpaper|OEMBackground|SystemParametersInfo/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: wallpaper-refresh-through-rundll32
        name: rundll32 refreshing per-user system parameters
        purpose: >-
          Return the rundll32 call that reloads the desktop settings so a changed
          wallpaper shows without a logoff.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^rundll32\.exe$/i
          | CommandLine=/user32(\.dll)?"?,\s*UpdatePerUserSystemParameters/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ransom-note-opened-in-viewer
        name: Note with a recovery-themed name opened in a viewer
        purpose: >-
          Return Notepad, WordPad and mshta started on a text, HTA or HTML file whose name
          speaks of restoring, recovering, decrypting or ransom. The note's creation is
          not seen; its display is.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(notepad|wordpad|mshta)\.exe$/i
          | CommandLine=/(restore|recover|decrypt|ransom|encrypted|locked|how[_ -]?to)[^\\"]*\.(txt|hta|html?)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: display_setting_changed
      name: Wallpaper, legal notice or logon background value written
      description: >-
        A registry event shows a write to the Wallpaper, legal notice, lock-screen or
        OEMBackground value.
      source: registry
      field: registry_value
      indicates: user_facing_display_changed

  supporting:
    - id: ransom_text_or_scratch_path
      name: New data is a ransom message or a scratch-path image
      description: >-
        The data written is text about encryption or payment, or an image path under Temp,
        ProgramData or a random name.
      source: registry
      field: registry_data
      indicates: extortion_message_displayed
    - id: policy_key_written
      name: Value sits under a policy key no policy sets
      description: >-
        The key is the System or Personalization policy key and no Group Policy in the
        environment configures it.
      source: registry
      field: registry_path
      indicates: policy_setting_forged
    - id: writer_not_shell_or_policy
      name: Writer is not Explorer, Settings or Group Policy
      description: >-
        The writer's process id resolves to a process other than explorer.exe,
        SystemSettings.exe or the Group Policy client, which the agent establishes from
        process events.
      source: registry
      field: writer_process_id
      indicates: display_changed_by_untrusted_process
    - id: set_by_command
      name: Value set from a command line
      description: >-
        reg.exe, PowerShell or cmd.exe ran with the value name on its command line, or
        rundll32 refreshed the desktop parameters.
      source: process_creation
      field: command_line
      indicates: scripted_display_change
    - id: ransom_note_displayed
      name: Recovery-themed note opened
      description: >-
        A viewer was started on a file whose name speaks of recovery or decryption.
      source: process_creation
      field: image_name
      indicates: ransom_note_shown_to_user
    - id: many_hosts_at_once
      name: Same change on many hosts within minutes
      description: >-
        The same value and data appear on several hosts in a short span, which the agent
        counts from the returned events.
      source: registry
      field: host
      indicates: fleet_wide_impact

  contradicting:
    - id: group_policy_branding
      name: Value matches the organisation's policy
      description: >-
        The data equals the wallpaper path or legal notice text the organisation deploys
        by Group Policy or device management.
      source: change_management
      field: ComputerName
      indicates: corporate_branding_policy
    - id: user_personalisation
      name: User changed their own wallpaper
      description: >-
        Earlier activity shows the user changing wallpaper from time to time, to images in
        their own Pictures folder.
      source: baseline
      field: RegStringValue
      indicates: routine_personalisation

  risk_logic:
    required:
      - display_setting_changed

    supporting:
      any:
        - ransom_text_or_scratch_path
        - policy_key_written
        - writer_not_shell_or_policy
        - set_by_command
        - ransom_note_displayed
        - many_hosts_at_once
      all:
        - ransom_text_or_scratch_path
        - writer_not_shell_or_policy

    contradicting:
      any:
        - group_policy_branding
        - user_personalisation
      all: []

  verdict:
    low_risk_when:
      - display_setting_changed
      - group_policy_branding
    suspicious_when:
      - display_setting_changed
      - writer_not_shell_or_policy
    high_risk_when:
      - display_setting_changed
      - writer_not_shell_or_policy
      - ransom_text_or_scratch_path

  false_positive:
    - condition: Group Policy and device management branding.
      explanation: >-
        The legal notice and a corporate wallpaper are standard policy settings. The data
        is the same on every host and matches the policy.
    - condition: Users personalising their desktop.
      explanation: >-
        Settings and Explorer write the Wallpaper value. The image is in the user's own
        folders and one host is involved.
    - condition: Wallpaper and theme utilities.
      explanation: >-
        Slideshow tools rewrite the value on a timer. The writer is the installed utility.
    - condition: Readme files with recovery in the name.
      explanation: >-
        Software ships files such as how-to or restore notes. They open once, from the
        product's folder.
