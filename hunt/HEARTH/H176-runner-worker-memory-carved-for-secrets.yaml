# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-lin-hearth-h176-runner-worker-memory-carved-for-secrets-t1003-007
version: 1.0.0

info:
  name: GitHub Actions Runner.Worker memory carved for unmasked secrets
  description: >-
    GitHub Actions masks secrets in job logs, but they sit in plain text inside the
    Runner.Worker process. Once it has root, the Miasma harvester (Microsoft, June 2026)
    finds the worker's process id by walking /proc, reads its memory through
    /proc/<pid>/maps and /proc/<pid>/mem, strips null bytes and greps for the structure
    the runner stores secrets in. The read of another process's memory is a file access
    and a process access, and this deployment collects neither, so it is not claimed.
    The hypothesis also names the carving pipeline, and that is process creation: a grep
    whose pattern contains isSecret, commands that name a /proc memory path, and tools
    that go looking for Runner.Worker.
  severity: critical
  author: huntgraph
  tags:
    - hearth
    - credential-access
    - proc-filesystem
    - memory-scraping
    - github-actions
    - ci-cd
    - miasma
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H176.md
    - https://attack.mitre.org/techniques/T1003
    - https://attack.mitre.org/techniques/T1003/007
    - https://attack.mitre.org/detectionstrategies/DET0593

mitre:
  tactics:
    - TA0006
  techniques:
    - T1003
  sub_techniques:
    - T1003.007
  detection_strategies:
    - DET0593
  analytics:
    - AN1631
  platforms:
    - Linux
  data_sources:
    - linux:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    A malicious process on a Linux CI/CD runner is harvesting in-memory secrets from the
    GitHub Actions Runner.Worker process by locating its PID through /proc enumeration
    and then reading its memory (/proc/<pid>/mem via /proc/<pid>/maps) and
    pattern-matching the decrypted-secret structure with tr and grep to recover masked
    workflow secrets (ACTIONS_RUNTIME_TOKEN, ACTIONS_ID_TOKEN_REQUEST_TOKEN and
    job-scoped secrets).
  attacker_behavior:
    - Gains root on the runner, for example through a passwordless sudo rule.
    - Finds the Runner.Worker process id by listing /proc or with pgrep.
    - Reads the worker's memory regions through /proc/<pid>/maps and /proc/<pid>/mem.
    - Pipes the dump through tr -d and grep -aoE with a pattern that ends isSecret true.
    - Sends the recovered tokens to a newly created public repository.
  legitimate_behavior:
    - Debuggers and profilers read /proc/<pid>/maps of the process they attach to.
    - Runner maintenance scripts check whether Runner.Worker is still running.
    - Developers of the runner itself search its source for the isSecret field.
  risk_indicator:
    - A grep pattern contains isSecret on a runner host.
    - A command names /proc/<pid>/mem for a process it does not own.
    - A script or shell under node, npm or bun looks up Runner.Worker.
    - The commands run as root during a job.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: secret-structure-pattern-in-command
        name: Command line carrying the runner secret-structure pattern
        purpose: >-
          Return any command whose line contains isSecret, the campaign's carving
          pattern, whether it is grep itself or a shell that holds the whole pipeline. A
          harvester that does the matching inside its own process starts no grep and is
          not seen.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/isSecret/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: process-memory-path-in-command
        name: Command naming a /proc memory or maps path
        purpose: >-
          Return commands that name /proc/<pid>/mem or /proc/<pid>/maps for a numbered
          process or a shell variable. This is the read as issued through a utility such
          as cat, dd or tail; a program that opens the path itself leaves no command and
          the read is not recorded.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/\/proc\/(\d+|\$\{?\w+\}?|\*)\/(mem|maps)\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: runner-worker-looked-up-by-utility
        name: Utility or script searching for the Runner.Worker process
        purpose: >-
          Return lookup utilities, shells and script interpreters whose command line
          names Runner.Worker or Runner.Listener. The runner's own processes have those
          names as their image and are excluded by the image list.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ImageFileName=/\/(pgrep|pidof|ps|grep|egrep|awk|sed|find|ls|cat|sh|bash|dash|python[\d.]*|perl|node|bun)$/
          | CommandLine=/Runner\.(Worker|Listener)/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: secret_carving_command
      name: Command carves or reads runner memory
      description: >-
        A command line carries the isSecret pattern or names a /proc memory path on a
        host that runs a CI agent.
      source: process_creation
      field: command_line
      indicates: runner_secret_harvesting

  supporting:
    - id: worker_process_located
      name: Runner.Worker looked up first
      description: >-
        A lookup utility or script names Runner.Worker before the read on the same host.
      source: process_creation
      field: image_path
      indicates: target_process_discovery
    - id: runs_as_root_in_job
      name: Command runs as root during a job
      description: >-
        The user on the event is root while a workflow job is active on the runner.
      source: process_creation
      field: user
      indicates: elevated_install_hook
    - id: descends_from_package_install
      name: Command descends from a package install
      description: >-
        The parent chain leads to node, npm or bun, which the agent establishes by
        following parent process ids.
      source: process_creation
      field: parent_process
      indicates: install_hook_execution
    - id: carving_pipeline_shared_parent
      name: Lookup, read and grep share one parent
      description: >-
        The lookup, the memory read and the grep start under the same parent process id
        within seconds, which the agent derives from the returned events.
      source: process_creation
      field: parent_process_id
      indicates: scripted_memory_scrape

  contradicting:
    - id: runner_maintenance_script
      name: Lookup is the runner's own maintenance
      description: >-
        The command is the runner's service or update script checking its own processes.
      source: derived
      field: CommandLine
      indicates: agent_self_management
    - id: debugging_session_recorded
      name: A debugging session is recorded
      description: >-
        An engineer was debugging the runner on this host under a change record.
      source: change_management
      field: ComputerName
      indicates: authorised_debugging

  risk_logic:
    required:
      - secret_carving_command

    supporting:
      any:
        - worker_process_located
        - runs_as_root_in_job
        - descends_from_package_install
        - carving_pipeline_shared_parent
      all:
        - worker_process_located
        - runs_as_root_in_job

    contradicting:
      any:
        - runner_maintenance_script
        - debugging_session_recorded
      all: []

  verdict:
    low_risk_when:
      - secret_carving_command
      - runner_maintenance_script
      - debugging_session_recorded
    suspicious_when:
      - secret_carving_command
      - worker_process_located
    high_risk_when:
      - secret_carving_command
      - worker_process_located
      - runs_as_root_in_job
      - descends_from_package_install

  false_positive:
    - condition: Runner service scripts name Runner.Listener.
      explanation: >-
        The runner's own wrapper scripts and systemd unit do. They repeat unchanged and
        never touch /proc memory paths.
    - condition: A developer greps the runner's source.
      explanation: >-
        isSecret is a field in the runner's code. The host is a workstation, not a
        runner, and the grep reads source files.
    - condition: Profilers read maps.
      explanation: >-
        They read the maps of a process they started or attached to, under a developer's
        account.
