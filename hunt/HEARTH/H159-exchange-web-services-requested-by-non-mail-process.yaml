# Converted from THORCollective/HEARTH Flames/H159.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h159-exchange-web-services-requested-by-non-mail-process-t1071-003
version: 1.0.0

info:
  name: Exchange host requested by a process with no mail role
  description: >-
    Kazuar can take its tasking from, and return its results to, a mailbox through
    Exchange Web Services: it creates, finds, updates and deletes items over HTTPS at
    /EWS/Exchange.asmx, which looks like Outlook traffic on the wire. The operations,
    the user agent and the URL path are inside TLS and in Exchange's own audit log,
    neither of which this connector reads, so the hypothesis as HEARTH frames it, by
    operation and user agent, is not testable here. What the endpoint does show is which
    process asked for the Exchange host's name. Kazuar runs inside a process it has
    injected into, so the requester is a system utility or a script host with no reason
    to talk to a mail server. The hunt returns those requests. An implant inside
    Outlook, Teams or a browser makes the same request those programs make and cannot be
    told apart here.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - command-and-control
    - exchange-web-services
    - ews
    - kazuar
    - mail-protocols
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H159.md
    - https://attack.mitre.org/techniques/T1071
    - https://attack.mitre.org/techniques/T1071/003
    - https://attack.mitre.org/detectionstrategies/DET0135

mitre:
  tactics:
    - TA0011
  techniques:
    - T1071
  sub_techniques:
    - T1071.003
  detection_strategies:
    - DET0135
  analytics:
    - AN0379
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Network Connection Creation
    - Process Creation

hypothesis:
  statement: >-
    Kazuar operators are using Exchange Web Services (EWS) as a covert
    command-and-control channel: CreateItem, FindItem, GetItem, UpdateItem and
    DeleteItem SOAP operations against /EWS/Exchange.asmx from a compromised mailbox
    carry tasking and exfiltration data, blending in with legitimate Outlook traffic.
  attacker_behavior:
    - Runs the implant inside an injected system process.
    - Connects to the organisation's Exchange Online or on-premises Exchange host over HTTPS.
    - Reads tasking from draft or folder items and writes results back as items.
    - Polls at a steady, low rate so the traffic resembles a mail client.
  legitimate_behavior:
    - Outlook, Teams, browsers and mobile-sync components resolve Exchange hosts all day.
    - Administrators connect to Exchange Online from PowerShell.
    - Backup, archiving and calendar integrations use EWS from their own services.
  risk_indicator:
    - A script host, a system utility or Explorer resolves an Exchange host.
    - The requests repeat at a regular interval from the same process.
    - A command line names the EWS endpoint or the EWS managed API.
    - The host has no mail integration and the user is not an Exchange administrator.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: exchange-online-host-requested-by-utility-or-script-host
        name: Exchange Online host requested by a system utility or script host
        purpose: >-
          Return name requests for the Exchange Online hosts that serve EWS when the
          requester is a script host, a proxy-execution utility, Explorer or another
          program that holds no mailbox. The requester list is the cheap test and comes
          first. svchost is left out because mail-account sync runs inside it and its
          volume is large. PowerShell is kept; administrators who use the Exchange
          Online module appear and are told apart by account.
        query: |
          #event_simpleName=DnsRequest
          | ContextBaseFileName=/^(powershell|pwsh|cmd|rundll32|regsvr32|mshta|wscript|cscript|msbuild|installutil|regasm|regsvcs|dllhost|werfault|notepad|msiexec|explorer|conhost|AddInProcess|AddInProcess32|vbc|csc)\.exe$/i
          | DomainName=/^(outlook\.office365\.com|outlook\.office\.com|outlook\.office365\.us|outlook\.office\.de|partner\.outlook\.cn)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: on-premises-exchange-host-requested-by-utility-or-script-host
        name: On-premises Exchange host requested by a system utility or script host
        purpose: >-
          Return the same requesters asking for a host whose first label is one
          conventionally given to Exchange: ews, owa, mail, exchange, autodiscover or
          webmail. The organisation's real Exchange host names should replace this guess
          before a long-window run.
        query: |
          #event_simpleName=DnsRequest
          | ContextBaseFileName=/^(powershell|pwsh|cmd|rundll32|regsvr32|mshta|wscript|cscript|msbuild|installutil|regasm|regsvcs|dllhost|werfault|notepad|msiexec|explorer|conhost|AddInProcess|AddInProcess32|vbc|csc)\.exe$/i
          | DomainName=/^(ews|owa|mail|exchange|autodiscover|webmail)[0-9]*\./i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ews-endpoint-or-library-on-command-line
        name: Command line naming the EWS endpoint or an EWS client library
        purpose: >-
          Return commands that name /EWS/Exchange.asmx, the EWS managed API assembly or
          the exchangelib package. This is how a script-driven client shows itself. A
          compiled implant names none of them on a command line.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\/EWS\/Exchange\.asmx|Microsoft\.Exchange\.WebServices|\bexchangelib\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: exchange_host_requested_by_non_mail_process
      name: Exchange host requested by a process with no mail role
      description: >-
        A name request for an Exchange Online or on-premises Exchange host comes from a
        script host, a system utility or Explorer.
      source: dns_request
      field: process_name
      indicates: mail_service_used_by_unexpected_process

  supporting:
    - id: regular_request_interval
      name: Requests repeat at a regular interval
      description: >-
        The same process on the same host requests the name at a steady interval over
        hours or days, which the agent derives from the timestamps of the returned
        events.
      source: dns_request
      field: process_id
      indicates: polling_command_channel
    - id: exchange_host_named
      name: Host is the organisation's EWS endpoint
      description: >-
        The requested name is the Exchange Online service host or the organisation's own
        Exchange server.
      source: dns_request
      field: query_name
      indicates: mailbox_service_destination
    - id: ews_named_on_command_line
      name: EWS endpoint or library named in a command
      description: >-
        A command on the host names the EWS endpoint or a client library for it.
      source: process_creation
      field: command_line
      indicates: scripted_mailbox_access
    - id: non_mail_host_role
      name: Host has no mail integration
      description: >-
        The host on the event is a server or workstation with no archiving, backup or
        calendar integration that would use EWS.
      source: dns_request
      field: host
      indicates: activity_outside_host_role

  contradicting:
    - id: exchange_administrator_session
      name: User is an Exchange administrator
      description: >-
        The account is an Exchange or Microsoft 365 administrator and the requester is
        PowerShell during an administration session.
      source: identity_context
      field: UserName
      indicates: routine_mail_administration
    - id: approved_ews_integration
      name: Host runs an approved EWS integration
      description: >-
        Asset records list a backup, archiving, room-booking or migration tool on the
        host that uses EWS.
      source: asset_inventory
      field: ComputerName
      indicates: approved_mail_integration

  risk_logic:
    required:
      - exchange_host_requested_by_non_mail_process

    supporting:
      any:
        - regular_request_interval
        - exchange_host_named
        - ews_named_on_command_line
        - non_mail_host_role
      all:
        - regular_request_interval
        - non_mail_host_role

    contradicting:
      any:
        - exchange_administrator_session
        - approved_ews_integration
      all: []

  verdict:
    low_risk_when:
      - exchange_host_requested_by_non_mail_process
      - exchange_administrator_session
    suspicious_when:
      - exchange_host_requested_by_non_mail_process
      - non_mail_host_role
    high_risk_when:
      - exchange_host_requested_by_non_mail_process
      - regular_request_interval
      - non_mail_host_role

  false_positive:
    - condition: Exchange Online PowerShell.
      explanation: >-
        The module connects to outlook.office365.com from powershell.exe. The account is
        an administrator's and the sessions are irregular.
    - condition: Shell extensions and add-ins.
      explanation: >-
        Explorer and dllhost load components that preview mail items or check calendar
        free-busy and resolve the Exchange host. They appear on many hosts alike and
        stop when the add-in is removed.
    - condition: Scripts that send reports through EWS.
      explanation: >-
        Operations teams send mail from scheduled scripts with the EWS managed API. The
        script is known, runs at a fixed time and from a named host.
