# Converted from THORCollective/HEARTH Flames/H031.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h031-crypto-wallet-extension-data-collection-t1005
version: 1.0.0

info:
  name: Cryptocurrency wallet browser-extension data enumerated and collected
  description: >-
    A browser wallet such as MetaMask, Phantom or Keplr keeps its encrypted vault in the
    browser profile, in a folder named after the extension's fixed identifier. Stealers
    walk every browser profile looking for those identifiers and copy the folders out,
    because the vault can be cracked offline or replayed. The sensor does not report file
    reads, so a stealer that opens the files through its own code leaves no event here.
    What it does report is any command that names those folders: a copy, an archive or a
    listing issued through a shell, which is how the BlueNoroff tooling and many scripted
    stealers work.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - collection
    - cryptocurrency
    - browser-extension
    - bluenoroff
    - infostealer
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H031.md
    - https://attack.mitre.org/techniques/T1005
    - https://attack.mitre.org/detectionstrategies/DET0380
    - https://www.huntress.com/blog/inside-bluenoroff-web3-intrusion-analysis

mitre:
  tactics:
    - TA0009
  techniques:
    - T1005
  sub_techniques: []
  detection_strategies:
    - DET0380
  analytics:
    - AN1070
    - AN1071
    - AN1072
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - WinEventLog:Security
    - auditd:SYSCALL
    - macos:unifiedlog
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    Threat actors are systematically enumerating and extracting sensitive data from
    cryptocurrency wallet browser extensions, including MetaMask, Phantom and Keplr, to
    support financial theft operations.
  attacker_behavior:
    - Lists each browser profile's Local Extension Settings folder looking for wallet identifiers.
    - Copies or archives the folders of MetaMask, Phantom, Keplr, Coinbase Wallet and others.
    - Collects desktop wallet directories such as Exodus, Electrum and Atomic alongside them.
    - Stages the copies in a temporary directory and uploads them with curl.
    - Runs the collection from a script, an interpreter or a binary in a user-writable path.
  legitimate_behavior:
    - The browser itself reads and writes these folders constantly.
    - Backup and profile-migration tools copy whole browser profiles.
    - Wallet developers and support staff inspect extension storage while debugging.
  risk_indicator:
    - A non-browser process names a wallet extension identifier on its command line.
    - Several wallet identifiers appear in one command or in quick succession.
    - The destination is a temporary directory or an archive.
    - An upload or outbound transfer follows from the same parent.
    - The user works with cryptocurrency assets.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: wallet-extension-id-in-command
        name: Command line naming a wallet extension identifier
        purpose: >-
          Return any command that carries the fixed identifier of a known wallet
          extension. The identifiers are 32-character literals, so the match is exact
          and cheap, and nothing but a wallet path contains them.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/nkbihfbeogaeaoehlefnkodbefgpgknn|bfnaelmomeimhlpmgjnjophhpkkoljpa|dmkamcknogkgcdfhhbddcghachkejeap|hnfanknocfeofbddgcijnmhnfnkdnaad|ibnejdfjmmkpcnlpebklmnkoeoihofec|fhbohimaelbohpjbbldcngcnapndodjp|egjidjbpglichdcondbcbdnbeeppgdph/
          | ImageFileName!=/(chrome|msedge|brave|opera|vivaldi|Google Chrome|Microsoft Edge|Brave Browser)[^\\\/]*$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: extension-storage-copied-or-archived
        name: Extension storage folder copied, listed or archived
        purpose: >-
          Return shell commands that act on a browser's extension storage folders as a
          whole, which catches collection of wallets not in the identifier list.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/Local Extension Settings|Sync Extension Settings|moz-extension|\/Extensions\/[a-p]{32}/
          | CommandLine=/\b(cp|copy|xcopy|robocopy|Copy-Item|zip|tar|7z|ditto|rsync|find|ls|dir|Get-ChildItem|Compress-Archive)\b/i
          | ImageFileName!=/(chrome|msedge|brave|opera|vivaldi|firefox|Google Chrome|Microsoft Edge|Brave Browser)[^\\\/]*$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: desktop-wallet-directory-collected
        name: Desktop wallet data directory copied or archived
        purpose: >-
          Return copy and archive commands over the data directories of desktop wallet
          applications, which the same tooling sweeps in the same pass.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/[\\\/](Exodus[\\\/]exodus\.wallet|Electrum[\\\/]wallets|\.electrum[\\\/]wallets|atomic[\\\/]Local Storage|Ledger Live|\.bitcoin[\\\/]wallet|Bitcoin[\\\/]wallets|Ethereum[\\\/]keystore|\.ethereum[\\\/]keystore|Coinomi[\\\/]wallets|\.config[\\\/]solana)/i
          | CommandLine=/\b(cp|copy|xcopy|robocopy|Copy-Item|zip|tar|7z|ditto|rsync|cat|type|Compress-Archive|curl)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: wallet_storage_command
      name: Command acting on wallet storage
      description: >-
        A non-browser process command line names a wallet extension identifier, a
        browser extension storage folder or a desktop wallet data directory.
      source: process_creation
      field: command_line
      indicates: wallet_data_collection_candidate

  supporting:
    - id: multiple_wallets_swept
      name: Several wallets touched under one parent
      description: >-
        Commands for different wallet identifiers or directories share one parent
        process id, which the agent derives by grouping the returned events.
      source: process_creation
      field: parent_process_id
      indicates: systematic_wallet_enumeration
    - id: collector_in_writable_path
      name: Collecting process runs from a writable path
      description: >-
        The image that issued the command, or its parent, sits in a temporary, download
        or hidden directory.
      source: process_creation
      field: image_path
      indicates: unpackaged_collection_tool
    - id: scripted_collection_parent
      name: Collection driven by an interpreter or script host
      description: >-
        The parent is osascript, a shell started by a non-terminal process, Python,
        Node or a Windows script host.
      source: process_creation
      field: parent_process
      indicates: automated_collection

  contradicting:
    - id: profile_backup_or_migration
      name: Command belongs to a profile backup or migration
      description: >-
        A change record or the host's backup product accounts for a copy of whole browser
        profiles at that time.
      source: change_management
      field: ComputerName
      indicates: authorised_data_handling
    - id: wallet_developer_host
      name: User develops or supports wallet software
      description: >-
        Identity records place the user in a wallet engineering or support role where
        inspecting extension storage is routine.
      source: identity_context
      field: UserName
      indicates: expected_development_activity

  risk_logic:
    required:
      - wallet_storage_command

    supporting:
      any:
        - multiple_wallets_swept
        - collector_in_writable_path
        - scripted_collection_parent
      all:
        - multiple_wallets_swept
        - scripted_collection_parent

    contradicting:
      any:
        - profile_backup_or_migration
        - wallet_developer_host
      all: []

  verdict:
    low_risk_when:
      - wallet_storage_command
      - profile_backup_or_migration
      - wallet_developer_host
    suspicious_when:
      - wallet_storage_command
      - scripted_collection_parent
    high_risk_when:
      - wallet_storage_command
      - scripted_collection_parent
      - multiple_wallets_swept

  false_positive:
    - condition: The browser is started with an extension path argument.
      explanation: >-
        Browsers pass extension identifiers to their own helper processes. The query
        drops browser images; a renamed browser binary would still show its real path.
    - condition: A backup or migration tool copies browser profiles.
      explanation: >-
        Profile copies include the extension folders but name the profile root, not a
        wallet identifier, and run under the backup product on a schedule.
    - condition: A wallet developer inspects extension storage.
      explanation: >-
        Developers list and copy these folders while debugging. It is one wallet, on a
        developer's machine, from a terminal.
