# Converted from THORCollective/HEARTH Flames/H236.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h236-node-project-server-collecting-clipboard-and-fetching-renamed-payloads-t1059-007
version: 1.0.0

info:
  name: Node project server reading the clipboard and fetching payloads saved as text files
  description: >-
    Elastic describes a Contagious Interview cluster that hands developers a working
    Node project. When the server starts, runServerValidation reads SVG flag images,
    takes Base64 fragments out of their HTML comments, decodes them and passes the
    result to eval. The OTTERCOOKIE-aligned payload then reads browser credential
    stores, wallet extension data and developer secrets, opens a Socket.IO channel and
    collects the clipboard. Almost all of that happens inside the node process: the SVG
    and credential-store reads are file reads, the decode and eval are script content,
    and neither is collected here. A node process making HTTPS connections is ordinary.
    What leaves node is the clipboard collection, which starts PowerShell with
    Get-Clipboard on Windows and pbpaste on macOS, and the follow-on payloads, which
    curl fetches as .txt files that are then renamed to .exe. The template hunts those
    and says plainly that the theft itself is out of view.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - execution
    - javascript
    - nodejs
    - contagious-interview
    - ottercookie
    - clipboard
    - developer-endpoint
    - windows
    - macos
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H236.md
    - https://attack.mitre.org/techniques/T1059
    - https://attack.mitre.org/techniques/T1059/007
    - https://attack.mitre.org/detectionstrategies/DET0264
    - https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography

mitre:
  tactics:
    - TA0002
  techniques:
    - T1059
  sub_techniques:
    - T1059.007
  detection_strategies:
    - DET0264
  analytics:
    - AN0733
    - AN0734
  platforms:
    - Windows
    - macOS
  data_sources:
    - WinEventLog:Sysmon
    - macos:osquery
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary ships a trojanized Node project that reconstructs JavaScript hidden in
    SVG comments during server startup, then uses the same Node process to read browser
    credential stores, wallet data, and developer secrets before opening C2.
  attacker_behavior:
    - Gives a developer a project to run with npm start or node server/index.js as an interview task.
    - Rebuilds a payload from comments in SVG files at server start and evaluates it.
    - Reads Login Data, Web Data, wallet extension settings, keychains and cloud credential files in-process.
    - Polls the clipboard through PowerShell Get-Clipboard or pbpaste.
    - Fetches hostService.txt, printSvc.txt or dhcpSvc.txt with curl and renames it to .exe.
    - Runs operator commands through child_process.exec.
  legitimate_behavior:
    - Development servers start shells and tools all day.
    - The clipboardy package reads the clipboard for command-line tools, using pbpaste on macOS.
    - Build scripts download files with curl.
  risk_indicator:
    - node, or a shell under node, runs PowerShell with Get-Clipboard and -NonInteractive.
    - pbpaste runs under node at a regular interval.
    - curl saves a .txt file that the same command renames to .exe.
    - The project was cloned recently for an interview or a freelance task.
    - The clipboard reads repeat for as long as the server runs.

requires:
  platforms:
    - windows
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: get-clipboard-under-node-or-its-shell
        name: PowerShell Get-Clipboard started by node or by a shell
        purpose: >-
          Return PowerShell commands that call Get-Clipboard whose parent is node or
          cmd. child_process.exec runs its command through cmd.exe, so PowerShell's
          parent is usually cmd and node is one level up; the cmd.exe event that wraps
          the command carries the same text and names node as its parent, and is
          returned too. The agent follows the parent process id to node where the parent
          is cmd.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh|cmd)\.exe$/i
          | ParentBaseFileName=/^(node|cmd)\.exe$/i
          | CommandLine=/Get-Clipboard/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: pbpaste-under-node-or-its-shell
        name: pbpaste started by node or by a shell
        purpose: >-
          Return pbpaste on macOS whose parent is node or a shell. exec starts /bin/sh
          -c pbpaste, and sh may replace itself with the command, so either parent is
          possible. A person typing pbpaste in a terminal matches the shell form; the
          agent keeps the events that lead back to node and repeat.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=pbpaste
          | ParentBaseFileName=/^(node|sh|bash|zsh)$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: curl-saving-text-file-renamed-to-executable
        name: curl fetching a .txt payload that is renamed to .exe
        purpose: >-
          Return commands that name one of the three reported payload files, or that
          fetch a .txt file with curl and rename it to .exe in the same command line. A
          rename done by a separate ren or move command is returned when that command
          names both extensions.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(curl|cmd|powershell|pwsh)\.exe$/i
          | CommandLine=/\b(hostService|printSvc|dhcpSvc)\.txt\b|curl[^|]*\.txt\b.*\b(ren|rename|move|Rename-Item|Move-Item)\b.*\.exe\b|\b(ren|rename|move)\s+\S+\.txt["']?\s+\S+\.exe\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: shell-or-tool-started-by-node-fetching-or-running
        name: Shell under node that fetches a file or runs from a temporary directory
        purpose: >-
          Return shells and curl whose parent is node on Windows and whose command line
          fetches from a URL or names an executable under Temp or ProgramData, the form
          operator commands and follow-on payloads take. Package scripts do this as
          well.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^node\.exe$/i
          | FileName=/^(cmd|powershell|pwsh|curl)\.exe$/i
          | CommandLine=/curl[^|]*https?:\/\/|\\(AppData\\Local\\Temp|ProgramData|Users\\Public)\\[^"'\s]*\.exe\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: clipboard_read_from_node_process_tree
      name: Clipboard read by a command under node
      description: >-
        PowerShell with Get-Clipboard or pbpaste runs with node as its parent or as the
        parent of its shell.
      source: process_creation
      field: command_line
      indicates: clipboard_collection_by_script_payload

  supporting:
    - id: parent_is_node
      name: Parent is node
      description: >-
        The parent named on the clipboard command, or on its shell, is node.
      source: process_creation
      field: parent_process
      indicates: script_runtime_origin
    - id: clipboard_read_repeats
      name: Clipboard read repeats at an interval
      description: >-
        The same clipboard command recurs under one node process id at a steady
        interval. The agent derives this from the returned events.
      source: process_creation
      field: parent_process_id
      indicates: polling_collection_loop
    - id: text_payload_renamed_to_executable
      name: Text file fetched and renamed to an executable
      description: >-
        A command fetches a .txt file with curl and renames it to .exe, or names one of
        the reported files.
      source: process_creation
      field: command_line
      indicates: follow_on_payload_staging
    - id: developer_account
      name: Runs in a developer's session
      description: >-
        The user is a developer and the node process was started from a project
        directory.
      source: process_creation
      field: user
      indicates: targeted_developer_host

  contradicting:
    - id: known_cli_tool_using_clipboard
      name: A known tool reads the clipboard
      description: >-
        The node process is a command-line tool that documents clipboard access and the
        read happens once on a user action.
      source: baseline
      field: CommandLine
      indicates: expected_clipboard_use
    - id: long_standing_internal_project
      name: Project is long-standing internal code
      description: >-
        The project is the organisation's own repository and the behaviour predates the
        campaign.
      source: derived
      field: CommandLine
      indicates: internal_application_behaviour

  risk_logic:
    required:
      - clipboard_read_from_node_process_tree

    supporting:
      any:
        - parent_is_node
        - clipboard_read_repeats
        - text_payload_renamed_to_executable
        - developer_account
      all:
        - parent_is_node
        - clipboard_read_repeats

    contradicting:
      any:
        - known_cli_tool_using_clipboard
        - long_standing_internal_project
      all: []

  verdict:
    low_risk_when:
      - clipboard_read_from_node_process_tree
      - known_cli_tool_using_clipboard
      - long_standing_internal_project
    suspicious_when:
      - clipboard_read_from_node_process_tree
      - parent_is_node
    high_risk_when:
      - clipboard_read_from_node_process_tree
      - clipboard_read_repeats
      - text_payload_renamed_to_executable

  false_positive:
    - condition: Command-line tools built on clipboardy.
      explanation: >-
        Many Node tools paste from the clipboard through pbpaste. They read once when
        the user asks; they do not poll.
    - condition: Editor and terminal integrations.
      explanation: >-
        Some editor extensions call Get-Clipboard through PowerShell. The parent is the
        editor's helper and the command has no -NonInteractive polling shape.
    - condition: Build scripts that download text assets.
      explanation: >-
        Fetching a .txt file is ordinary. Renaming it to .exe is not.
