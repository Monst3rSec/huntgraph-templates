# Converted from THORCollective/HEARTH Flames/H290.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-lin-hearth-h290-replaced-system-daemon-timestomped-to-reference-binary-t1070-006
version: 1.0.0

info:
  name: Replaced Linux system daemon given the timestamps of a reference binary
  description: >-
    An operator who overwrites crond, atd, agetty, polkitd or sshd in place leaves a
    fresh modification time that stands out in /usr/sbin, so they copy the times of an
    untouched neighbour onto it: touch -r /usr/bin/ssh /usr/bin/crond. The kernel still
    updates the inode change time, so the lasting evidence is an mtime years older than
    the ctime on a file that fails package verification. Both of those are read from the
    file system and neither reaches this telemetry. The act does when it is done with
    touch: the hunt returns touch with a reference file or an explicit date aimed at a
    system binary or library directory, and executables written to the daemon paths the
    campaign replaced, so the agent can pair a write with the timestamp change that
    follows. A program that calls utimensat itself leaves nothing here. One donor file
    reused across several targets is for the agent to spot in the returned commands.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - stealth
    - timestomp
    - indicator-removal
    - binary-replacement
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H290.md
    - https://attack.mitre.org/techniques/T1070
    - https://attack.mitre.org/techniques/T1070/006
    - https://attack.mitre.org/detectionstrategies/DET0591

mitre:
  tactics:
    - TA0005
  techniques:
    - T1070
  sub_techniques:
    - T1070.006
  detection_strategies:
    - DET0591
  analytics:
    - AN1627
  platforms:
    - Linux
  data_sources:
    - auditd:SYSCALL
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An operator who overwrites a Linux system daemon in place (crond, atd, agetty,
    polkitd, sshd) copies the access and modification times of an untouched reference
    binary onto the replacement with touch -r or its programmatic equivalent, leaving a
    file whose mtime is far older than its ctime and which fails package verification.
  attacker_behavior:
    - Replaces a daemon binary under /usr/bin or /usr/sbin with a trojanised build.
    - Runs touch -r with a neighbouring system binary as the reference.
    - Uses the same donor file for several replaced binaries.
    - Restarts the daemon so the replacement runs.
  legitimate_behavior:
    - Packaging and build scripts use touch -r to keep timestamps reproducible, in build
      directories.
    - Backup restores and file-sync tools preserve times through their own calls, not through touch.
    - Administrators occasionally touch a configuration file under /usr/lib to trigger a reload.
  risk_indicator:
    - touch -r names a system binary both as the reference and as the target.
    - touch sets an explicit past date on a file under /usr/bin or /usr/sbin.
    - An executable was written to the same path shortly before.
    - The parent is an interactive shell or an unknown binary, not a package manager.
    - The same reference file is reused for several targets.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewExecutableWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: touch-copying-timestamps-onto-system-binary
        name: touch -r aimed at a system binary or library directory
        purpose: >-
          Return touch runs that take their times from a reference file and name a path
          under a system binary or library directory. Both the donor and the target are
          on the command line.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(touch|busybox)$/
          | CommandLine=/\s(-[a-zA-Z]*r\s|--reference[=\s])/
          | CommandLine=/\/(usr\/)?(local\/)?(s?bin|libexec)\/|\/(usr\/)?lib(64)?\//
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: touch-setting-explicit-date-on-system-binary
        name: touch setting an explicit date on a system binary
        purpose: >-
          Return touch runs that set a stated time with -t, -d or --date on a path under
          a system binary directory, the other way to backdate a replaced file. Library
          directories are left out of this case because package scripts touch files
          there with dates.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(touch|busybox)$/
          | CommandLine=/\s(-[a-zA-Z]*[td]\s|--date[=\s]|--time[=\s])/
          | CommandLine=/\s\/(usr\/)?(local\/)?s?bin\/\S+/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: executable-written-to-system-daemon-path
        name: Executable written to a system daemon path
        purpose: >-
          Return executable writes whose target is one of the daemons the campaign
          replaced. Package managers write a temporary name and rename, so a direct
          write is unusual. The agent pairs each with a touch on the same path. Whether
          the sensor reports an overwrite of an existing binary this way should be
          confirmed in the tenant.
        query: |
          #event_simpleName=NewExecutableWritten
          | event_platform=Lin
          | TargetFileName=/^\/usr\/(s?bin|libexec|lib\/polkit-1)\/(crond|cron|atd|agetty|polkitd|sshd|haproxy)$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: timestamp_set_on_system_binary
      name: touch sets the times of a system binary
      description: >-
        touch was run with a reference file or an explicit date against a path under a
        system binary or library directory.
      source: process_creation
      field: command_line
      indicates: file_timestamps_falsified

  supporting:
    - id: target_is_daemon_binary
      name: Target is a system daemon
      description: >-
        The file whose times are changed is a daemon such as crond, atd, agetty,
        polkitd, sshd or haproxy.
      source: process_creation
      field: command_line
      indicates: daemon_replacement_concealed
    - id: binary_written_before_touch
      name: Executable written to the path beforehand
      description: >-
        An executable was written to the same path shortly before the touch. The agent
        derives the order from the returned events.
      source: file_creation
      field: file_path
      indicates: replacement_then_timestomp
    - id: non_package_parent
      name: Not run by packaging or build tooling
      description: >-
        The parent of touch is an interactive shell or an unknown binary rather than
        dpkg, rpm, make or a build system.
      source: process_creation
      field: parent_process
      indicates: manual_timestamp_change
    - id: donor_reused
      name: One reference file used for several targets
      description: >-
        The same reference path appears in touch commands against more than one system
        binary on the host. The agent derives this by comparing the returned command
        lines.
      source: process_creation
      field: command_line
      indicates: batch_timestomp

  contradicting:
    - id: package_or_build_script
      name: Package or build script
      description: >-
        The command runs inside a package maintainer script or an image build, under the
        package manager or build tool.
      source: baseline
      field: CommandLine
      indicates: routine_packaging_activity
    - id: image_build_host
      name: Host builds system images
      description: >-
        The host assembles operating-system images or containers and normalises
        timestamps as part of that.
      source: asset_inventory
      field: ComputerName
      indicates: reproducible_build_activity

  risk_logic:
    required:
      - timestamp_set_on_system_binary

    supporting:
      any:
        - target_is_daemon_binary
        - binary_written_before_touch
        - non_package_parent
        - donor_reused
      all:
        - target_is_daemon_binary
        - non_package_parent

    contradicting:
      any:
        - package_or_build_script
        - image_build_host
      all: []

  verdict:
    low_risk_when:
      - timestamp_set_on_system_binary
      - package_or_build_script
      - image_build_host
    suspicious_when:
      - timestamp_set_on_system_binary
      - non_package_parent
    high_risk_when:
      - timestamp_set_on_system_binary
      - non_package_parent
      - binary_written_before_touch

  false_positive:
    - condition: Reproducible builds and packaging.
      explanation: >-
        Build scripts copy timestamps with touch -r so output is stable. The paths are
        under a build root and the parent is make or the packaging tool.
    - condition: Image construction.
      explanation: >-
        Tools that assemble root filesystems set dates on everything. It happens on
        build hosts against a staging directory.
