# Converted from THORCollective/HEARTH Flames/H350.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH also cites T1036.003, T1219 and T1053.005. The general form, any
# executable in a product folder it does not belong to, needs a per-product file
# inventory; the template covers the 7-Zip folder the report names. Version
# information is not relied on: the reported binary carried no original file name.
type: detection

id: hg-win-hearth-h350-foreign-executable-in-7-zip-folder-launched-by-task-t1036-005
version: 1.0.0

info:
  name: Executable that is not part of 7-Zip running from the 7-Zip program folder
  description: >-
    In the second wave of an INC Ransom intrusion a scheduled task pointed at C:\Program
    Files\7-Zip\HealthUpdater.exe, a renamed Vicarius vRx agent. vRx is a
    vulnerability-remediation product that can run actions on endpoints, it is seldom on
    a remote-access allow or deny list, and a protected Program Files folder is trusted
    by path rules. The file's version information carried no original name, so a rename
    check on metadata finds nothing. 7-Zip ships a small fixed set of executables, which
    makes the folder checkable: anything else that runs from it, or is written into it,
    does not belong.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - defense-evasion
    - masquerading
    - program-files
    - 7-zip
    - vicarius-vrx
    - inc-ransom
    - scheduled-task
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H350.md
    - https://attack.mitre.org/techniques/T1036
    - https://attack.mitre.org/techniques/T1036/005
    - https://attack.mitre.org/detectionstrategies/DET0347

mitre:
  tactics:
    - TA0005
  techniques:
    - T1036
  sub_techniques:
    - T1036.005
  detection_strategies:
    - DET0347
  analytics:
    - AN0983
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An intruder is keeping a foothold on Windows hosts with a legitimate commercial
    vulnerability-remediation agent renamed to a generic updater name, placed inside an
    unrelated vendor's installation folder and launched by a scheduled task registered
    from a compromised user account, so an executable in a product folder that does not
    belong to that product, whose version information names a different vendor or
    carries no original file name at all, exposes a tool that RMM allowlists and
    path-based trust rules both pass over.
  attacker_behavior:
    - Copies a management or remediation agent into another product's Program Files folder.
    - Renames it to a generic updater or health-check name.
    - Registers a scheduled task that starts it.
    - Uses it beside a second remote-access tool.
  legitimate_behavior:
    - 7-Zip's installer writes 7z.exe, 7zFM.exe, 7zG.exe and Uninstall.exe.
    - Repackaged 7-Zip deployments add nothing executable to the folder.
  risk_indicator:
    - A process runs from the 7-Zip folder under a name 7-Zip does not ship.
    - The file was written there by a shell, a copy or a remote session.
    - The parent is the Task Scheduler service.
    - The process connects out or starts other programs.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: process-in-7-zip-folder-not-shipped-by-7-zip
        name: Process running from the 7-Zip folder that 7-Zip does not ship
        purpose: >-
          Return processes whose image is in a 7-Zip program folder and whose name is
          not one of the four executables the product installs.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ImageFileName=/\\Program Files( \(x86\))?\\7-Zip\\/i
          | FileName!=/^(7z|7zFM|7zG|Uninstall)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: executable-written-into-7-zip-folder
        name: Executable written into the 7-Zip folder that 7-Zip does not ship
        purpose: >-
          Return PE files written into a 7-Zip program folder under any other name, with
          the writing process. 7-Zip's own DLL and self-extractor modules are left out
          by name.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\Program Files( \(x86\))?\\7-Zip\\/i
          | TargetFileName!=/\\7-Zip\\(7z|7zFM|7zG|Uninstall)\.exe$|\\7-Zip\\(7z|7-zip|7-zip32)\.dll$|\\7-Zip\\7z(Con)?\.sfx$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: task-created-for-executable-in-7-zip-folder
        name: Task created to run a file in the 7-Zip folder
        purpose: >-
          Return task creation commands whose action is in the 7-Zip folder. A task
          registered remotely with Impacket atexec or through the COM interface is not
          seen here; the first case sees it run.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(schtasks|powershell|pwsh)\.exe$/i
          | CommandLine=/\/create\b|Register-ScheduledTask|New-ScheduledTaskAction/i
          | CommandLine=/\\7-Zip\\[^"\s]+\.exe/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reported-updater-name-anywhere
        name: HealthUpdater.exe running from any path
        purpose: >-
          Return the reported file name wherever it runs, for the case where the same
          binary was placed in another product's folder.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^HealthUpdater\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: foreign_executable_in_product_folder
      name: Executable in the 7-Zip folder that is not 7-Zip's
      description: >-
        A process image or a written PE sits in a 7-Zip program folder under a name the
        product does not install.
      source: process_creation
      field: image_path
      indicates: payload_hidden_in_trusted_product_folder

  supporting:
    - id: written_by_shell_or_copy
      name: File was written by a shell, copy or remote session process
      description: >-
        The writer of the executable is cmd, PowerShell, a remote-execution service or a
        remote-access tool and not an installer.
      source: file_creation
      field: writer_process_name
      indicates: manual_placement
    - id: started_by_task_scheduler
      name: Process is started by the Task Scheduler
      description: >-
        The parent of the process is the Task Scheduler's service host.
      source: process_creation
      field: parent_process
      indicates: scheduled_task_persistence
    - id: task_points_into_folder
      name: Task action points into the 7-Zip folder
      description: >-
        A task creation command names an executable in the 7-Zip folder.
      source: process_creation
      field: command_line
      indicates: task_registered_for_foreign_binary
    - id: generic_updater_name
      name: File carries a generic updater name
      description: >-
        The file name is HealthUpdater.exe or a similar updater or health-check name
        with no vendor in it.
      source: process_creation
      field: image_name
      indicates: generic_masquerade_name

  contradicting:
    - id: repackaged_7_zip_component
      name: File belongs to the organisation's 7-Zip package
      description: >-
        The organisation's own 7-Zip package adds the file, and it is present on every
        host that has the package.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software
    - id: file_common_in_estate
      name: Same file runs from that folder on many hosts
      description: >-
        Earlier activity shows the same name running from the 7-Zip folder across the
        estate for a long period.
      source: baseline
      field: ImageFileName
      indicates: established_execution

  risk_logic:
    required:
      - foreign_executable_in_product_folder

    supporting:
      any:
        - written_by_shell_or_copy
        - started_by_task_scheduler
        - task_points_into_folder
        - generic_updater_name
      all:
        - written_by_shell_or_copy
        - started_by_task_scheduler

    contradicting:
      any:
        - repackaged_7_zip_component
        - file_common_in_estate
      all: []

  verdict:
    low_risk_when:
      - foreign_executable_in_product_folder
      - repackaged_7_zip_component
      - file_common_in_estate
    suspicious_when:
      - foreign_executable_in_product_folder
      - started_by_task_scheduler
    high_risk_when:
      - foreign_executable_in_product_folder
      - written_by_shell_or_copy
      - started_by_task_scheduler

  false_positive:
    - condition: A 7-Zip plug-in or codec pack installs an extra executable.
      explanation: >-
        It is written by an installer, is present on every host with the pack and is not
        started by a scheduled task.
    - condition: A 7-Zip update brings a new shipped file name.
      explanation: >-
        The name then appears on every updated host at once and the writer is the 7-Zip
        installer.
