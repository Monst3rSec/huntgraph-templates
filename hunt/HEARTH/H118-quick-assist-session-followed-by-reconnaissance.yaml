# Converted from THORCollective/HEARTH Flames/H118.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h118-quick-assist-session-followed-by-reconnaissance-t1219-002
version: 1.0.0

info:
  name: Quick Assist or another remote support tool started and followed by reconnaissance
  description: >-
    Storm-1811 and others message a user on Microsoft Teams from an outside tenant, pose
    as the help desk, and talk the user into opening Quick Assist. The operator then has
    the user's desktop, with elevation, and begins with whoami, systeminfo, nltest and
    net commands before staging a payload. The Teams chat, the foreign tenant and the
    email flood that often comes first are Microsoft 365 audit data, which this
    connector does not ingest, so the phishing step HEARTH names is not observable here.
    The endpoint half is: a remote support tool starts, and reconnaissance commands
    follow on the same host within minutes. An operator in Quick Assist works on the
    user's desktop, so the commands run under the user's own shell and not as children
    of QuickAssist.exe. The hunt therefore returns the two sets of events and the agent
    pairs them by host, user and time.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - command-and-control
    - remote-access
    - quick-assist
    - helpdesk-impersonation
    - teams-phishing
    - storm-1811
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H118.md
    - https://attack.mitre.org/techniques/T1219
    - https://attack.mitre.org/techniques/T1219/002
    - https://attack.mitre.org/detectionstrategies/DET0259
    - https://www.microsoft.com/en-us/security/blog/2024/05/15/threat-actors-misusing-quick-assist-in-social-engineering-attacks-leading-to-ransomware/

mitre:
  tactics:
    - TA0011
  techniques:
    - T1219
  sub_techniques:
    - T1219.002
  detection_strategies:
    - DET0259
  analytics: []
  platforms:
    - Windows
  data_sources:
    - CrowdStrike:Endpoint
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary is impersonating IT helpdesk personnel via Microsoft Teams external
    messaging to socially engineer users into launching remote access tools like Quick
    Assist, enabling hands-on-keyboard intrusion from a cross-tenant attacker-controlled
    account.
  attacker_behavior:
    - Messages or calls the user on Teams from an external tenant under a help desk display name.
    - Asks the user to open Quick Assist and enter a code, or to install AnyDesk or ScreenConnect.
    - Takes control of the desktop and opens a command prompt or PowerShell.
    - Runs whoami, systeminfo, ipconfig, nltest and net user in quick succession.
    - Stages a payload under ProgramData and starts it.
  legitimate_behavior:
    - The real help desk uses Quick Assist or a licensed remote support product.
    - Technicians run the same discovery commands while troubleshooting.
    - Users start Quick Assist to help a colleague or family member.
  risk_indicator:
    - Reconnaissance commands start on the host within ten minutes of the remote tool.
    - The user is not technical staff and has no history of running those commands.
    - The remote tool is not the one the organisation's help desk uses.
    - No help desk ticket exists for the user at that time.
    - A shell or script host is started directly by the remote support agent.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: remote-support-tool-started
        name: Quick Assist or another remote support tool started
        purpose: >-
          Return starts of Quick Assist and the other tools reported in these
          intrusions, with host, user and time. Where one of these products is the
          organisation's own help desk tool, remove it from the list before a
          long-window run.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(QuickAssist|AnyDesk|TeamViewer|TeamViewer_Service|ScreenConnect\.ClientService|ScreenConnect\.WindowsClient|msra|rustdesk|SupremoService|Supremo|ZohoAssist|LogMeIn|g2ax_comm_customer|ateraagent|SplashtopStreamer|SRService)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reconnaissance-command-from-user-shell
        name: Reconnaissance utility started from a command shell
        purpose: >-
          Return the discovery utilities an operator runs first, where the parent is cmd
          or PowerShell. The agent keeps those on a host and user that the first case
          returned, within ten minutes after the tool started. A cmdlet run inside
          PowerShell starts no process and is not seen.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(cmd|powershell|pwsh)\.exe$/i
          | FileName=/^(whoami|nltest|systeminfo|quser|qwinsta|net|ipconfig)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: shell-started-by-remote-support-agent
        name: Shell or script host started by a remote support agent
        purpose: >-
          Return shells whose parent is a remote support agent that can run commands
          itself: ScreenConnect, AnyDesk, TeamViewer and the like. Quick Assist does not
          appear here because it starts nothing; its operator uses the desktop.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(QuickAssist|AnyDesk|TeamViewer|TeamViewer_Service|ScreenConnect\.ClientService|ScreenConnect\.WindowsClient|msra|rustdesk|SupremoService|Supremo|ZohoAssist|LogMeIn|g2ax_comm_customer|ateraagent|SplashtopStreamer|SRService)\.exe$/i
          | FileName=/^(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|msiexec|curl|certutil|bitsadmin)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: remote_support_tool_started
      name: Remote support tool started on the host
      description: >-
        Quick Assist or another remote support tool started in a user's session.
      source: process_creation
      field: image_name
      indicates: remote_control_session

  supporting:
    - id: reconnaissance_follows_session
      name: Reconnaissance commands follow the session start
      description: >-
        Discovery utilities start from a shell on the same host and under the same user
        within ten minutes of the remote tool. The agent derives the interval from the
        returned events.
      source: process_creation
      field: command_line
      indicates: hands_on_keyboard_reconnaissance
    - id: shell_under_remote_agent
      name: Shell started by the remote support agent
      description: >-
        The parent of a shell or script host is the remote support agent itself.
      source: process_creation
      field: parent_process
      indicates: remote_command_execution
    - id: non_technical_user
      name: User is not technical staff
      description: >-
        The account belongs to a role with no history of running discovery commands.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: help_desk_ticket_open
      name: A help desk session is on record
      description: >-
        A ticket or remote support record covers this user and time.
      source: change_management
      field: UserName
      indicates: authorised_support_session
    - id: sanctioned_support_tool
      name: Tool is the organisation's own support product
      description: >-
        Asset records list the tool as the approved remote support product on this host.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software

  risk_logic:
    required:
      - remote_support_tool_started

    supporting:
      any:
        - reconnaissance_follows_session
        - shell_under_remote_agent
        - non_technical_user
      all:
        - reconnaissance_follows_session
        - non_technical_user

    contradicting:
      any:
        - help_desk_ticket_open
        - sanctioned_support_tool
      all: []

  verdict:
    low_risk_when:
      - remote_support_tool_started
      - help_desk_ticket_open
    suspicious_when:
      - remote_support_tool_started
      - reconnaissance_follows_session
    high_risk_when:
      - remote_support_tool_started
      - reconnaissance_follows_session
      - non_technical_user

  false_positive:
    - condition: The real help desk troubleshooting a user's machine.
      explanation: >-
        A technician opens the same tool and runs the same commands. A ticket exists and
        the tool is the approved one.
    - condition: Administrators and developers running discovery commands.
      explanation: >-
        whoami and ipconfig are everyday commands for technical staff. They matter here
        only beside a remote support session on a non-technical user's host.
    - condition: Users helping each other with Quick Assist.
      explanation: >-
        A session between colleagues is followed by ordinary application use, not by a
        burst of discovery commands.
