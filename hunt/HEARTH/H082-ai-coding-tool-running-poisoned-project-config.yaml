# Converted from THORCollective/HEARTH Flames/H082.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# Also holds H094 (malicious agent skill packages delivering AMOS on macOS). It differs
# in the carrier, a SKILL.md install step, which the sensor does not see. The agent names
# H094 reports were added to the parent lists; if such an agent runs under node, its
# children show node as the parent and H067's runtime-child case returns them.
type: detection

id: hg-any-hearth-h082-ai-coding-tool-running-poisoned-project-config-t1195-001
version: 1.1.0

info:
  name: AI coding tool executing commands planted in a repository's project configuration
  description: >-
    AI coding tools read configuration from the project they are opened in: hooks that
    run a shell command on an event, MCP server definitions that start a process, and
    environment settings. A repository can carry those files, so cloning it and opening
    it in the tool can run an attacker's command with little warning, the flaw behind
    CVE-2025-59536 and CVE-2026-21852. The configuration file's contents and any
    redirected API traffic are not visible to the sensor. The command the tool then
    starts is. AI coding tools run shells constantly, so the hunt returns only children
    that fetch and execute, read credential stores, or send data out.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - initial-access
    - supply-chain
    - ai-coding-tools
    - mcp
    - developer-endpoint
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H082.md
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H094.md
    - https://attack.mitre.org/techniques/T1195
    - https://attack.mitre.org/techniques/T1195/001
    - https://attack.mitre.org/detectionstrategies/DET0009

mitre:
  tactics:
    - TA0001
  techniques:
    - T1195
  sub_techniques:
    - T1195.001
  detection_strategies:
    - DET0009
  analytics:
    - AN0021
    - AN0022
    - AN0023
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - WinEventLog:Sysmon
    - auditd:SYSCALL
    - macos:endpointsecurity
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary is poisoning AI coding tool project configurations, such as hooks, MCP
    servers and environment variables, in shared repositories, targeting developer
    workstations, to achieve remote code execution and API credential theft.
  attacker_behavior:
    - Commits a project settings file whose hook runs a shell command when the tool starts or uses a tool.
    - Adds an MCP server entry whose command is a download-and-run one-liner.
    - Points the tool's API base address at a server the attacker controls to capture the key.
    - Has the planted command read SSH keys, cloud credentials and tokens and post them out.
    - Hides the change in a large pull request or a repository offered as a coding test.
  legitimate_behavior:
    - Developers configure hooks that run linters, formatters and tests.
    - Teams share MCP server definitions in a repository.
    - AI coding tools run shell commands at the developer's request all day.
  risk_indicator:
    - The tool's direct child fetches remote content and pipes it to an interpreter.
    - The child reads credential stores or tool configuration and passes them to a transfer command.
    - The command runs seconds after the tool opens a freshly cloned repository.
    - The repository comes from outside the organisation.
    - The same command appears on several developers' machines after one repository change.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: ai-tool-spawned-fetch-and-run
        name: AI coding tool starting a fetch-and-run command
        purpose: >-
          Return direct children of AI coding tools whose command line downloads and
          executes, decodes into an interpreter or opens a raw socket. The parent test is
          an anchored match and runs before the command-line pattern.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(claude|claude-code|codex|gemini|cursor|cursor-agent|windsurf|aider|opencode|goose|amp|openclaw|clawdbot|moltbot|Cursor Helper.*|Claude Helper.*)(\.exe)?$/i
          | CommandLine=/(curl|wget)\s[^|;]*\|\s*(ba|z|da)?sh\b|\bIEX\b|Invoke-Expression|DownloadString|FromBase64String|base64\s+(-d|--decode|-D)[^|]*\|\s*(ba|z)?sh\b|\/dev\/tcp\/|\bnc(at)?\s+(-\w+\s+)*\S+\s+\d{2,5}\b|\s-e(nc|ncodedcommand)?\s+[A-Za-z0-9+\/=]{40,}/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ai-tool-spawned-secret-read-and-send
        name: AI coding tool child reading credentials and sending data
        purpose: >-
          Return children that name credential or token stores together with a transfer
          tool, the theft half of a poisoned hook.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(claude|claude-code|codex|gemini|cursor|cursor-agent|windsurf|aider|opencode|goose|amp|openclaw|clawdbot|moltbot|Cursor Helper.*|Claude Helper.*)(\.exe)?$/i
          | CommandLine=/\.ssh[\\\/]|id_(rsa|ed25519)|\.aws[\\\/]credentials|\.npmrc|\.netrc|\.config[\\\/]gcloud|\.kube[\\\/]config|\.git-credentials|API_KEY|_TOKEN\b|\.claude(\.json|[\\\/])|keychain/i
          | CommandLine=/\b(curl|wget|nc|ncat|scp|Invoke-WebRequest|Invoke-RestMethod|iwr|irm)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: mcp-server-entry-with-shell-one-liner
        name: Shell one-liner started as an MCP server or hook by an AI coding tool
        purpose: >-
          Return shells the tool starts with an inline command that is long or chained,
          which is what a configuration entry looks like when its command is not a server
          binary.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(claude|claude-code|codex|gemini|cursor|cursor-agent|windsurf|aider|opencode|goose|amp|openclaw|clawdbot|moltbot)(\.exe)?$/i
          | ImageFileName=/[\\\/](bash|sh|zsh|dash|cmd\.exe|powershell\.exe|pwsh(\.exe)?)$/i
          | CommandLine=/\s(-c|\/c|-Command)\s.*(https?:\/\/|&&\s*(curl|wget|chmod|nohup)|;\s*(curl|wget|chmod|nohup)|\|\s*(ba|z)?sh\b|>\s*\/dev\/null\s+2>&1\s*&)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: ai_tool_suspicious_child
      name: AI coding tool started a download, theft or chained shell command
      description: >-
        A process whose parent is an AI coding tool fetches and runs remote content,
        reads credential stores with a transfer tool, or runs a chained shell one-liner.
      source: process_creation
      field: command_line
      indicates: command_execution_from_project_configuration

  supporting:
    - id: tool_is_direct_parent
      name: The tool itself is the direct parent
      description: >-
        The parent is the AI tool's own process and not a shell it opened for the user,
        as a hook or an MCP server entry produces.
      source: process_creation
      field: parent_process
      indicates: configuration_driven_execution
    - id: credential_stores_named
      name: Command names credential or token stores
      description: >-
        The command line references SSH keys, cloud credential files, package registry
        tokens or the tool's own configuration.
      source: process_creation
      field: command_line
      indicates: developer_credential_theft
    - id: same_command_on_start
      name: Same command repeats at each tool start
      description: >-
        The identical command appears under successive tool processes on the host, which
        the agent derives by comparing parent process ids across the results.
      source: process_creation
      field: parent_process_id
      indicates: persistent_hook_or_server_entry
    - id: affected_developer
      name: Several developers show the command
      description: >-
        The same command line appears under different users on different hosts within a
        short period.
      source: process_creation
      field: user
      indicates: shared_repository_poisoned

  contradicting:
    - id: developer_requested_command
      name: Developer asked the tool to run the command
      description: >-
        The command matches work the developer directed, such as an installer one-liner
        from a vendor's documentation, on a single host.
      source: derived
      field: CommandLine
      indicates: user_directed_tool_use
    - id: reviewed_team_configuration
      name: Command comes from a reviewed team configuration
      description: >-
        The hook or server entry is part of the organisation's reviewed project
        configuration for an internal repository.
      source: change_management
      field: ComputerName
      indicates: approved_developer_tooling

  risk_logic:
    required:
      - ai_tool_suspicious_child

    supporting:
      any:
        - tool_is_direct_parent
        - credential_stores_named
        - same_command_on_start
        - affected_developer
      all:
        - credential_stores_named
        - affected_developer

    contradicting:
      any:
        - developer_requested_command
        - reviewed_team_configuration
      all: []

  verdict:
    low_risk_when:
      - ai_tool_suspicious_child
      - developer_requested_command
    suspicious_when:
      - ai_tool_suspicious_child
      - tool_is_direct_parent
    high_risk_when:
      - ai_tool_suspicious_child
      - tool_is_direct_parent
      - credential_stores_named

  false_positive:
    - condition: A developer asks the tool to install something.
      explanation: >-
        Vendor one-line installers are curl piped to a shell, and the tool runs them
        when asked. It is one host, one time, a known vendor URL.
    - condition: The tool reads configuration that mentions tokens.
      explanation: >-
        Commands that touch .npmrc or environment files are routine in development. The
        second case also needs a transfer tool; a legitimate deploy script can still
        match and is recognisable by its destination.
    - condition: Team hooks run chained commands.
      explanation: >-
        A reviewed hook that runs a formatter and a test in one line matches the third
        case's shape. It is the same on every developer's machine and has no remote
        fetch.
