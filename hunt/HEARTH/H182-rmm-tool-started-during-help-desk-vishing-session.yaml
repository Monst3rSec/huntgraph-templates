# Converted from THORCollective/HEARTH Flames/H182.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h182-rmm-tool-started-during-help-desk-vishing-session-t1219-002
version: 1.0.0

info:
  name: Remote-access tool started from a collaboration app or a download folder after a help-desk vishing call
  description: >-
    The phone call that starts a Luna Moth intrusion is not in any telemetry. Its
    consequence is: during a Quick Assist, Teams or Zoom session the caller has the
    victim install a remote-access tool, and passes links through privnote.com or a
    help-desk look-alike domain (Mandiant, June 2026). A tool the organisation deploys
    runs from Program Files under its deployment agent. One installed on a caller's
    instruction starts from a collaboration app or from Downloads. A file opened from a
    browser or a chat window is usually started by Explorer, not by the app, so the path
    case matters as much as the parent case. Microsoft 365 sign-in and call records are
    not collected here.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - command-and-control
    - remote-access
    - rmm
    - vishing
    - help-desk-impersonation
    - luna-moth
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H182.md
    - https://attack.mitre.org/techniques/T1219
    - https://attack.mitre.org/techniques/T1219/002
    - https://attack.mitre.org/detectionstrategies/DET0259

mitre:
  tactics:
    - TA0011
  techniques:
    - T1219
  sub_techniques:
    - T1219.002
  detection_strategies:
    - DET0259
  analytics: []
  platforms:
    - Windows
  data_sources:
    - CrowdStrike:Endpoint
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    Adversaries (UNC3753 / Luna Moth) use spearphishing voice (vishing) posing as IT
    help desk to drive victims into a screen-share, then install RMM tools; hunt RMM and
    remote-access binaries spawned by collaboration apps plus access to privnote and
    lookalike help-desk domains.
  attacker_behavior:
    - Calls the employee as the internal help desk, often several times over days.
    - Moves the victim into Quick Assist, Teams or Zoom screen sharing.
    - Has the victim download and run AnyDesk, Zoho Assist, Bomgar or SuperOps.
    - Passes install links and commands through self-destructing notes.
    - Registers domains that pair the organisation's name with helpdesk or itdesk.
    - Brings in WinSCP or rclone for collection once access holds.
  legitimate_behavior:
    - The real help desk uses a sanctioned remote-support tool.
    - Vendors support their products through AnyDesk or Zoho Assist sessions.
    - Staff use privnote to share a password with a colleague.
  risk_indicator:
    - A remote-access binary's parent is Teams, Zoom or Quick Assist.
    - The binary runs from Downloads, Desktop or a temporary directory.
    - The product is not the organisation's sanctioned tool.
    - privnote.com or a help-desk look-alike domain is resolved shortly before.
    - Quick Assist starts on a host whose user has not opened a ticket.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: remote-access-tool-started-by-collaboration-app
        name: Remote-access tool whose parent is a collaboration or screen-share app
        purpose: >-
          Return the remote-access and transfer tools HEARTH lists when their parent is
          Teams, Zoom, Quick Assist or Remote Assistance. A file saved from a chat and
          opened from the folder has Explorer as its parent and is not matched here; the
          next case covers it by path.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(Teams|ms-teams|Zoom|CptHost|quickassist|msra)\.exe$/i
          | FileName=/^(anydesk|bomgar[^\\]*|beyondtrust[^\\]*|zoho[^\\]*|ZA_[^\\]*|superops[^\\]*|winscp|rclone)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: remote-access-tool-running-from-user-path
        name: Remote-access tool running from Downloads, Desktop or a temporary directory
        purpose: >-
          Return the same tools when their image sits in a user download or scratch
          location instead of Program Files.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(anydesk|bomgar[^\\]*|beyondtrust[^\\]*|zoho[^\\]*|ZA_[^\\]*|superops[^\\]*|winscp|rclone)\.exe$/i
          | ImageFileName=/\\(Downloads|Desktop|AppData\\Local\\Temp|Users\\Public)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: screen-share-assistance-session-started
        name: Quick Assist or Remote Assistance started
        purpose: >-
          Return each start of Quick Assist and Remote Assistance, the screen-share
          tools that need no install. On its own this is ordinary; it gives the agent
          the time of a session on the host to set the other cases against.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(quickassist|msra)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: self-destructing-note-service-resolved
        name: DNS request for privnote.com
        purpose: >-
          Return requests for the note service the actor uses to pass links and
          commands.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)privnote\.com$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: help-desk-lookalike-domain-resolved
        name: DNS request for a name ending in a help-desk suffix
        purpose: >-
          Return requests for registered domains that end in -helpdesk, -itdesk,
          -itsupport, -servicedesk or -it. The organisation's name is not known to the
          query; the agent keeps the names that contain it or a client's.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/-(helpdesk|itdesk|it-?support|servicedesk|it)\.(com|net|org|us|co)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: unsanctioned_remote_access_tool_started
      name: Remote-access tool started outside its deployment path
      description: >-
        A remote-access or transfer tool starts as a child of a collaboration app or
        from a user download location.
      source: process_creation
      field: image_name
      indicates: remote_access_tool_installed_by_user

  supporting:
    - id: collaboration_app_parent
      name: Parent is a collaboration or screen-share app
      description: >-
        The parent process is Teams, Zoom, Quick Assist or Remote Assistance.
      source: process_creation
      field: parent_process
      indicates: install_during_screen_share
    - id: tool_in_user_download_path
      name: Image is in a download or scratch directory
      description: >-
        The tool's image path is under Downloads, Desktop, Temp or Public.
      source: process_creation
      field: image_path
      indicates: user_installed_software
    - id: note_service_or_lookalike_resolved
      name: privnote or a help-desk look-alike resolved
      description: >-
        The host resolves privnote.com or a domain pairing the organisation's name with
        a help-desk suffix.
      source: dns_request
      field: query_name
      indicates: social_engineering_infrastructure
    - id: session_precedes_install
      name: A screen-share session precedes the tool
      description: >-
        Quick Assist or a collaboration call started on the host within the hour before
        the tool, which the agent derives by ordering the returned events.
      source: process_creation
      field: process_id
      indicates: caller_guided_installation
    - id: non_technical_user
      name: User is not technical staff
      description: >-
        The account belongs to a role that does not install remote-support software.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: sanctioned_support_tool
      name: Tool is the organisation's sanctioned product
      description: >-
        The product is the help desk's approved tool and the session matches a ticket.
      source: asset_inventory
      field: ComputerName
      indicates: approved_remote_support
    - id: vendor_support_session
      name: A vendor support session is recorded
      description: >-
        A ticket with a named vendor covers a remote session on this host at this time.
      source: change_management
      field: ComputerName
      indicates: authorised_vendor_support

  risk_logic:
    required:
      - unsanctioned_remote_access_tool_started

    supporting:
      any:
        - collaboration_app_parent
        - tool_in_user_download_path
        - note_service_or_lookalike_resolved
        - session_precedes_install
        - non_technical_user
      all:
        - collaboration_app_parent
        - note_service_or_lookalike_resolved

    contradicting:
      any:
        - sanctioned_support_tool
        - vendor_support_session
      all: []

  verdict:
    low_risk_when:
      - unsanctioned_remote_access_tool_started
      - sanctioned_support_tool
      - vendor_support_session
    suspicious_when:
      - unsanctioned_remote_access_tool_started
      - tool_in_user_download_path
    high_risk_when:
      - unsanctioned_remote_access_tool_started
      - tool_in_user_download_path
      - note_service_or_lookalike_resolved
      - session_precedes_install

  false_positive:
    - condition: A vendor asks a user to run AnyDesk.
      explanation: >-
        It happens, from Downloads, and looks the same. A ticket and a known vendor
        contact settle it.
    - condition: Administrators run WinSCP or rclone from a download folder.
      explanation: >-
        The account is technical and no screen-share session or look-alike domain
        accompanies it.
    - condition: A real domain ends in -it.com.
      explanation: >-
        Plenty do. Only names that carry the organisation's own name or a client's are
        of interest.
