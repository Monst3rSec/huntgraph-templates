# Converted from THORCollective/HEARTH Flames/H259.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-mac-hearth-h259-keychain-secret-printed-from-coding-agent-shell-t1555-001
version: 1.0.0

info:
  name: "Keychain secret printed with the security tool from a coding agent's shell"
  description: >-
    A coding agent on macOS keeps its OAuth token in the login keychain and reads it
    with security find-generic-password -w, which prints the secret to standard output.
    Someone who has execution inside the agent session, through injected instructions or
    a poisoned tool response, can run the same command from the agent's shell and send
    the token to a tunnel URL. The command is the agent's own documented behaviour, so
    nothing about the binary or the arguments is unusual. The sensor reports the parent
    and not the responsible process, so the hunt returns every keychain read that prints
    a secret with its parent, the agent sessions started with their permission checks
    off, and curl commands that send to tunnel hosts; the agent follows parent process
    ids to decide which reads came from an agent's shell.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - credential-access
    - keychain
    - ai-coding-agent
    - mcp
    - tunnel
    - macos
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H259.md
    - https://attack.mitre.org/techniques/T1555
    - https://attack.mitre.org/techniques/T1555/001
    - https://attack.mitre.org/detectionstrategies/DET0396

mitre:
  tactics:
    - TA0006
  techniques:
    - T1555
  sub_techniques:
    - T1555.001
  detection_strategies:
    - DET0396
  analytics:
    - AN1112
  platforms:
    - macOS
  data_sources:
    - macos:unifiedlog
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary who has obtained execution inside an AI coding agent session on macOS
    harvests the agent's own OAuth token by running security find-generic-password with
    -w from an agent-spawned shell, where the parent chain runs back to a coding agent
    or MCP server and the same session then posts to an ephemeral tunnel domain.
  attacker_behavior:
    - Gets the agent to run a shell command through injected content or a tool response.
    - "Runs security find-generic-password -w for the agent's credential or a browser's safe-storage key."
    - Posts the output with curl to a quick-tunnel URL.
    - Relies on the agent having been started with permission prompts disabled.
  legitimate_behavior:
    - The coding agent reads its own credential this way at start-up.
    - Developers read keychain items in build and signing scripts.
    - Password-manager helpers call the security tool.
  risk_indicator:
    - "The read asks for a service the calling tool does not own, such as a browser's safe storage."
    - "The read's ancestry runs through an agent session started with a permission-bypass flag."
    - curl to a tunnel host follows from the same shell within minutes.
    - The session also reads cloud credential files.

requires:
  platforms:
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: keychain-secret-printed-by-security-tool
        name: security printing a keychain secret
        purpose: >-
          Return security find-generic-password and find-internet-password commands that
          ask for the secret with -w, -wa, -g or -ga, with the parent and its process
          id. The agent's own start-up read is in this set, and both it and a read typed
          into the agent's shell can have a shell as the parent. The agent follows the
          parent process id upward and reads what the same shell ran next.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=security
          | CommandLine=/find-(generic|internet)-password/
          | CommandLine=/\s-(w|wa|g|ga)(\s|$)/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: keychain-read-of-another-applications-secret
        name: "security asked for a browser, chat or agent credential by name"
        purpose: >-
          Return security commands that name a browser's or chat client's safe-storage
          item or the coding agent's credential item. Browsers read their own key
          through the keychain API and never through this tool, so a hit on a
          safe-storage name is a script reading a secret it does not own.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=security
          | CommandLine=/Claude Code-credentials|(Chrome|Chromium|Brave|Microsoft Edge|Opera|Vivaldi|Slack|Discord) Safe Storage/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: agent-started-with-permission-bypass
        name: Coding agent started with its permission checks disabled
        purpose: >-
          Return processes started with a flag that turns off an agent's approval
          prompts. One event per session; its process id is the ancestor the agent looks
          for above a keychain read.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | CommandLine=/--dangerously-skip-permissions|--dangerously-bypass-approvals-and-sandbox|--yolo\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: curl-to-tunnel-host
        name: curl sending to a tunnel or worker host
        purpose: >-
          Return curl commands whose URL is on a quick-tunnel, ngrok, localhost.run or
          workers.dev host. DNS for these hosts from non-browser processes is H062's
          third case and is not repeated.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=curl
          | CommandLine=/trycloudflare\.com|ngrok\.io|ngrok-free\.app|ngrok\.app|lhr\.life|localhost\.run|workers\.dev/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: keychain_secret_printed
      name: Keychain secret printed on standard output
      description: >-
        security was run with find-generic-password or find-internet-password and a flag
        that prints the secret.
      source: process_creation
      field: command_line
      indicates: keychain_credential_read

  supporting:
    - id: agent_ancestry
      name: Read descends from a coding agent session
      description: >-
        Following the parent process id upward from the read reaches a coding agent, an
        MCP server or their runtime and not a terminal application.
      source: process_creation
      field: parent_process_id
      indicates: agent_spawned_shell
    - id: shell_parent
      name: Parent is a shell
      description: >-
        The parent of the security process is zsh, bash or sh.
      source: process_creation
      field: parent_process
      indicates: scripted_keychain_access
    - id: permission_bypass_session
      name: Session runs with prompts disabled
      description: >-
        The ancestor agent process was started with a permission-bypass flag. The agent
        matches its process id to the ancestry of the read.
      source: process_creation
      field: process_id
      indicates: unattended_agent_execution
    - id: post_to_tunnel
      name: curl to a tunnel host follows
      description: >-
        curl to a tunnel host runs under the same shell within fifteen minutes of the
        read. The agent derives this from the returned events.
      source: process_creation
      field: image_name
      indicates: credential_exfiltration
    - id: developer_account
      name: Account holds developer credentials
      description: >-
        The user is a developer whose machine holds cloud and source-control tokens.
      source: process_creation
      field: user
      indicates: high_value_host

  contradicting:
    - id: agent_own_startup_read
      name: "Read is the agent's own start-up read"
      description: >-
        The read names the agent's own item, comes directly from the agent binary at
        session start and nothing is sent afterwards.
      source: baseline
      field: CommandLine
      indicates: expected_agent_behaviour
    - id: signing_or_build_script
      name: Read belongs to a build or signing script
      description: >-
        The read is part of a documented signing or release script run by the developer.
      source: identity_context
      field: UserName
      indicates: developer_tooling

  risk_logic:
    required:
      - keychain_secret_printed

    supporting:
      any:
        - agent_ancestry
        - shell_parent
        - permission_bypass_session
        - post_to_tunnel
        - developer_account
      all:
        - agent_ancestry
        - post_to_tunnel

    contradicting:
      any:
        - agent_own_startup_read
        - signing_or_build_script
      all: []

  verdict:
    low_risk_when:
      - keychain_secret_printed
      - agent_own_startup_read
      - signing_or_build_script
    suspicious_when:
      - keychain_secret_printed
      - agent_ancestry
    high_risk_when:
      - keychain_secret_printed
      - agent_ancestry
      - post_to_tunnel

  false_positive:
    - condition: The agent reading its own token.
      explanation: >-
        Every session start produces the read. It is told apart by what the same shell
        does afterwards.
    - condition: Build and signing scripts.
      explanation: >-
        Release scripts read signing passwords from the keychain with the same command.
    - condition: Developers using quick tunnels.
      explanation: >-
        curl to a trycloudflare or ngrok URL is routine when testing webhooks; it
        matters next to a keychain read.
