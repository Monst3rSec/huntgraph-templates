# Converted from THORCollective/HEARTH Flames/H226.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-lin-hearth-h226-proxyware-elf-enrolled-from-world-writable-directory-t1496-002
version: 1.0.0

info:
  name: Residential-proxy client run from a world-writable directory with account flags
  description: >-
    Proxyjacking sells a compromised host's bandwidth by enrolling it in a
    residential-proxy network. Sekoia documented the Mimo intrusion set doing this on
    Linux servers reached through Craft CMS: beside XMRig it dropped an IPRoyal Pawns
    client as hezb.x86_64 and ran it with the operator's e-mail address and password on
    the command line. Proxyware does not raise CPU the way a miner does, so the signal
    is the client and its enrolment arguments. Those arguments survive a rename of the
    binary and are on the process event. The open-relay traffic pattern HEARTH also
    describes needs flow records and inbound connection volumes this connector does not
    hold and is not claimed.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - impact
    - proxyjacking
    - proxyware
    - bandwidth-hijacking
    - mimo
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H226.md
    - https://attack.mitre.org/techniques/T1496
    - https://attack.mitre.org/techniques/T1496/002
    - https://attack.mitre.org/detectionstrategies/DET0028
    - https://www.sekoia.com/blog/the-sharp-taste-of-mimolette-analyzing-mimos-latest-campaign-targeting-craft-cms
    - https://www.sysdig.com/blog/proxyjacking-attackers-log4j-exploited

mitre:
  tactics:
    - TA0040
  techniques:
    - T1496
  sub_techniques:
    - T1496.002
  detection_strategies:
    - DET0028
  analytics:
    - AN0081
  platforms:
    - Linux
  data_sources:
    - auditd:SYSCALL
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary who has gained code execution on a Linux host drops and runs a
    residential-proxy (proxyware) ELF from a world-writable directory, enrolling the
    host into a residential-proxy network with account credentials on the command line
    to monetize the victim's bandwidth.
  attacker_behavior:
    - Downloads a proxyware client into /tmp, /var/tmp or /dev/shm through a web shell.
    - Marks it executable, using a bundled su binary when unprivileged.
    - Runs it with -email, -password and -accept-tos so the host joins the operator's account.
    - Renames the client so the file name says nothing.
    - Runs a cryptominer beside it.
  legitimate_behavior:
    - A person installs a bandwidth-sharing client on a machine of their own.
    - Other command-line tools take -email and -password arguments.
    - Build and test jobs run binaries from /tmp.
  risk_indicator:
    - A command line carries a terms-of-service acceptance flag with an e-mail address and a password.
    - The image is under /tmp, /var/tmp or /dev/shm.
    - The parent is a web server, PHP or a Java application server.
    - The host is a server with no reason to share bandwidth.
    - The host resolves a residential-proxy provider's domain.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewExecutableWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: process-with-proxyware-enrolment-flags
        name: Process started with a proxyware terms-acceptance flag
        purpose: >-
          Return any process whose command line carries the flag a proxyware client
          needs to accept its terms unattended: -accept-tos for IPRoyal Pawns,
          -tou-accept for Honeygain, start accept --token for Traffmonetizer. The test
          is on the arguments, so a renamed binary such as hezb.x86_64 is still
          returned. Clients that take their account from environment variables or a
          configuration file, as PacketStream and Repocket do in containers, show no
          such flag.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/\s-{1,2}accept-tos\b|\s-{1,2}tou-accept\b|\sstart\s+accept\s+--token\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: process-with-email-and-password-arguments-from-writable-directory
        name: Process in a world-writable directory given an e-mail address and a password
        purpose: >-
          Return processes whose image is under /tmp, /var/tmp or /dev/shm and whose
          command line passes both an e-mail address and a password, for a client whose
          acceptance flag differs from the three above.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ImageFileName=/^\/(tmp|var\/tmp|dev\/shm)\//
          | CommandLine=/\s-{1,2}e?mail[= ]\S+@\S+/
          | CommandLine=/\s-{1,2}pass(word)?[= ]\S+/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: named-proxyware-client-started
        name: Proxyware client started under its own name
        purpose: >-
          Return starts of known proxyware clients by file name. This sees only a client
          that was not renamed, and it also returns a client an administrator installed
          on purpose.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(pawns-cli|pawns|honeygain|traffmonetizer|psclient|p2pclient|repocket|earnfm[\w.-]*|bitpingd|peer2profit[\w.-]*|packetshare)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: web-service-started-binary-in-writable-directory
        name: Web or application service starting a binary from a world-writable directory
        purpose: >-
          Return processes whose image is under /tmp, /var/tmp or /dev/shm and whose
          parent is a web server, PHP or Java. A web shell usually starts the binary
          through sh, which then appears as the parent; those are found by following the
          parent process id from the first two cases. H162 holds the staging step.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ImageFileName=/^\/(tmp|var\/tmp|dev\/shm)\//
          | ParentBaseFileName=/^(php-fpm[0-9.]*|php[0-9.]*|httpd|apache2?|nginx|java|node)$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: proxyware-named-executable-written-to-writable-directory
        name: Executable with a proxyware name written to a world-writable directory
        purpose: >-
          Return executables written under /tmp, /var/tmp or /dev/shm whose name
          contains a proxyware client name or the hezb name reported for Mimo.
        query: |
          #event_simpleName=NewExecutableWritten
          | event_platform=Lin
          | TargetFileName=/^\/(tmp|var\/tmp|dev\/shm)\/[^\/]*(pawns|hezb|honeygain|traffmonetizer|psclient|p2pclient|repocket|earnfm|peer2profit|packetshare)[^\/]*$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: residential-proxy-provider-domain-resolved
        name: Residential-proxy provider domain resolved
        purpose: >-
          Return DNS requests for the domains of proxyware providers. No platform is
          named in the query: the agent reads the host. This case depends on the sensor
          reporting DNS requests from Linux hosts; confirm in the tenant.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)(pawns\.app|iproyal\.com|packetstream\.io|peer2profit\.com|honeygain\.com|traffmonetizer\.com|repocket\.co|earn\.fm|bitping\.com)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: proxyware_client_executed
      name: Proxyware client executed with enrolment arguments
      description: >-
        A process carries a proxyware terms-acceptance flag, or an e-mail address and
        password given to a binary in a world-writable directory, or is a named
        proxyware client.
      source: process_creation
      field: command_line
      indicates: bandwidth_hijacking

  supporting:
    - id: image_in_world_writable_directory
      name: Image is in a world-writable directory
      description: >-
        The image path is under /tmp, /var/tmp or /dev/shm.
      source: process_creation
      field: image_path
      indicates: dropped_binary_execution
    - id: web_service_ancestry
      name: Started by a web or application service
      description: >-
        The parent is a web server, PHP or Java, or a shell whose own parent is one. The
        agent follows the parent process id to establish the second form.
      source: process_creation
      field: parent_process
      indicates: post_exploitation_of_web_application
    - id: service_account_user
      name: Runs as a web service account
      description: >-
        The user is www-data, apache, nginx or an application service account.
      source: process_creation
      field: user
      indicates: compromised_service_context
    - id: proxyware_binary_written
      name: Proxyware-named executable written
      description: >-
        An executable with a proxyware name was written to a world-writable directory.
      source: file_creation
      field: file_path
      indicates: client_dropped
    - id: provider_domain_resolved
      name: Provider domain resolved from the host
      description: >-
        The host resolves a residential-proxy provider's domain.
      source: dns_request
      field: query_name
      indicates: enrolment_in_proxy_network

  contradicting:
    - id: approved_bandwidth_sharing
      name: Client is installed on purpose
      description: >-
        Asset records show the client was installed by the owner of the machine and is
        permitted.
      source: asset_inventory
      field: ComputerName
      indicates: sanctioned_software
    - id: unrelated_tool_with_similar_arguments
      name: Arguments belong to another tool
      description: >-
        The binary is a known tool that takes e-mail and password arguments and recurs
        on the host.
      source: baseline
      field: CommandLine
      indicates: routine_tool_usage

  risk_logic:
    required:
      - proxyware_client_executed

    supporting:
      any:
        - image_in_world_writable_directory
        - web_service_ancestry
        - service_account_user
        - proxyware_binary_written
        - provider_domain_resolved
      all:
        - image_in_world_writable_directory
        - web_service_ancestry

    contradicting:
      any:
        - approved_bandwidth_sharing
        - unrelated_tool_with_similar_arguments
      all: []

  verdict:
    low_risk_when:
      - proxyware_client_executed
      - approved_bandwidth_sharing
      - unrelated_tool_with_similar_arguments
    suspicious_when:
      - proxyware_client_executed
      - image_in_world_writable_directory
    high_risk_when:
      - proxyware_client_executed
      - image_in_world_writable_directory
      - web_service_ancestry

  false_positive:
    - condition: A user shares bandwidth on a personal or lab machine.
      explanation: >-
        The client runs from a home directory or a package path under that user's own
        account, not from /tmp under a web service.
    - condition: Mail and backup tools given credentials on the command line.
      explanation: >-
        Some tools take -email and -password. They are installed from packages and the
        second case requires a world-writable image path.
    - condition: Research into proxyware.
      explanation: >-
        Security teams run these clients in sandboxes. The host is a lab machine on
        record.
