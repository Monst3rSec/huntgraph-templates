# Converted from THORCollective/HEARTH Flames/H057.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h057-share-sweep-for-stored-credentials-t1135
version: 1.0.0

info:
  name: PowerShell sweep of shares and drives for files holding credentials
  description: >-
    Plump Spider, which targets banks, runs PowerShell scripts that list every share
    and local drive an account can reach and search them for passwords left in batch
    files, administrative documents, spreadsheets and configuration files. The recovered
    credentials feed password spraying against core banking systems. The sweep is
    automated and broad, which is what makes it visible: share enumeration followed by a
    recursive search for credential-bearing file types and keywords. The hunt returns
    the enumeration and search commands, and the credential-named files opened over SMB.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - discovery
    - network-share
    - credential-hunting
    - powershell
    - financial-sector
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H057.md
    - https://attack.mitre.org/techniques/T1135
    - https://attack.mitre.org/detectionstrategies/DET0182

mitre:
  tactics:
    - TA0007
  techniques:
    - T1135
  sub_techniques: []
  detection_strategies:
    - DET0182
  analytics:
    - AN0513
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:PowerShell
  data_components:
    - Process Creation
    - Command Execution

hypothesis:
  statement: >-
    Adversaries are executing PowerShell scripts that enumerate all accessible network
    shares and local drives to identify files containing authentication credentials, such
    as passwords stored in batch files, administrative documents, spreadsheets and
    configuration files, for subsequent use in password spraying attacks against core
    banking systems.
  attacker_behavior:
    - Enumerates shares across the domain with Get-SmbShare, net view or a share-finder script.
    - Recurses through each share and drive with Get-ChildItem filtered to scripts, documents and configuration files.
    - Searches file contents for password, pwd, credential and connection-string terms with Select-String or findstr.
    - Writes the matches to a results file for later use.
    - Runs the script under a compromised standard account against every server it can reach.
  legitimate_behavior:
    - Data-loss-prevention and data-discovery tools scan shares for sensitive content.
    - Administrators search shares for a file or audit for stored passwords.
    - Backup and indexing services walk share trees.
  risk_indicator:
    - A recursive search for credential keywords targets UNC paths or every drive letter.
    - The account is a standard user with no audit or administration role.
    - Many servers' shares are enumerated from one host in a short span.
    - Credential-named files are opened on shares the account does not normally use.
    - Authentication failures across many accounts follow.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
    - source: network_share_access
      connector: crowdstrike-ngsiem
      event_types:
        - SmbFileOpen
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        share_name: ShareName
        file_path: TargetFileName
        remote_address: RemoteAddressIP4

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: share-enumeration-by-script
        name: PowerShell or net enumerating shares across hosts
        purpose: >-
          Return share-listing commands issued through PowerShell and net, including
          the well-known share-finder functions.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh|net1?|cmd)\.exe$/i
          | CommandLine=/Get-SmbShare|Get-SmbConnection|Invoke-ShareFinder|Find-DomainShare|Get-NetShare|Win32_Share|\bview\s+\\\\|\bview\s+\/(all|domain)\b|Get-PSDrive|Get-Volume|\[System\.IO\.DriveInfo\]/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: recursive-credential-file-search
        name: Recursive search for credential-bearing files
        purpose: >-
          Return recursive file searches that filter on script, document and
          configuration types or on password-like names.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh|cmd|findstr|where|forfiles)\.exe$/i
          | CommandLine=/-Recurse|\/s\b|\/r\b/i
          | CommandLine=/\*\.(bat|cmd|ps1|vbs|config|ini|xml|txt|xlsx?|docx?|kdbx?|rdp)\b|\*pass\*|\*cred\*|\*secret\*|\*senha\*|unattend|web\.config|Find-InterestingFile/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: content-search-for-password-terms
        name: File content searched for password terms
        purpose: >-
          Return Select-String and findstr commands whose pattern is a credential
          keyword, the step that turns a file list into harvested passwords.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh|cmd|findstr)\.exe$/i
          | CommandLine=/Select-String|\bsls\b|findstr/i
          | CommandLine=/passw|pwd\s*=|senha|credential|connectionstring|net\s+use\s.*\/user/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: credential-named-file-opened-on-share
        name: Script or credential-named file opened over SMB
        purpose: >-
          Return SMB opens of batch and script files and of files with password-like
          names on non-default shares. Matching on the name keeps the result small enough
          to return raw over a long window.
        query: |
          #event_simpleName=SmbFileOpen
          | UserName!=/\$$/
          | ShareName!=/^(SYSVOL|NETLOGON|IPC\$|print\$)$/i
          | TargetFileName=/passw|senha|credential|secret|\.kdbx?$|unattend\.xml$|web\.config$|\.rdp$|\\(logins?|accounts?|users?)[^\\]*\.(xlsx?|docx?|txt|csv)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: share_and_file_sweep_command
      name: Shares enumerated and searched for credential files
      description: >-
        A command line lists shares or drives, recursively searches for
        credential-bearing file types, or searches file contents for password terms.
      source: process_creation
      field: command_line
      indicates: credential_hunting_across_shares

  supporting:
    - id: credential_file_opened
      name: Credential-named file opened on a share
      description: >-
        An SMB file-open event names a file whose name indicates stored passwords,
        logins or configuration secrets.
      source: network_share_access
      field: file_path
      indicates: stored_credential_access
    - id: many_shares_touched
      name: One account touches many shares
      description: >-
        The returned SMB events for one account span many share names or servers, which
        the agent derives by counting distinct shares per user.
      source: network_share_access
      field: share_name
      indicates: broad_share_sweep
    - id: standard_user_sweeping
      name: Sweep run by a standard user account
      description: >-
        The user has no audit, security or file-server administration role.
      source: process_creation
      field: user
      indicates: activity_outside_user_role
    - id: script_driven_parent
      name: Commands issued by a script or remote session
      description: >-
        The parent is PowerShell running a script file, a script host or a
        remote-management process.
      source: process_creation
      field: parent_process
      indicates: automated_collection

  contradicting:
    - id: data_discovery_tooling
      name: Activity belongs to a data-discovery or DLP product
      description: >-
        The host and account belong to a sanctioned data-discovery, DLP or indexing
        service that scans shares.
      source: asset_inventory
      field: ComputerName
      indicates: sanctioned_content_scanning
    - id: approved_password_audit
      name: Search is an approved stored-password audit
      description: >-
        A change record covers the account, scope and time for an audit of credentials
        stored on shares.
      source: change_management
      field: ComputerName
      indicates: authorised_security_testing

  risk_logic:
    required:
      - share_and_file_sweep_command

    supporting:
      any:
        - credential_file_opened
        - many_shares_touched
        - standard_user_sweeping
        - script_driven_parent
      all:
        - credential_file_opened
        - many_shares_touched

    contradicting:
      any:
        - data_discovery_tooling
        - approved_password_audit
      all: []

  verdict:
    low_risk_when:
      - share_and_file_sweep_command
      - data_discovery_tooling
      - approved_password_audit
    suspicious_when:
      - share_and_file_sweep_command
      - standard_user_sweeping
    high_risk_when:
      - share_and_file_sweep_command
      - standard_user_sweeping
      - credential_file_opened
      - many_shares_touched

  false_positive:
    - condition: A DLP or data-discovery product scans shares.
      explanation: >-
        These walk every share looking for sensitive content. The account is the
        product's service account and the scan is scheduled.
    - condition: An administrator searches for a file or audits stored passwords.
      explanation: >-
        The commands are the same. The account is administrative, the scope is a few
        servers, and the work is recorded.
    - condition: Developers search their own code for configuration values.
      explanation: >-
        Select-String for a connection string in a local repository is common. It
        targets a project directory, not UNC paths or every drive.
