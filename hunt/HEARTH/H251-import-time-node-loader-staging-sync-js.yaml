# Converted from THORCollective/HEARTH Flames/H251.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h251-import-time-node-loader-staging-sync-js-t1195-001
version: 1.0.0

info:
  name: Poisoned npm module staging sync.js in a NodeJS user-data folder at import time
  description: >-
    The AsyncAPI packages republished in July 2026 carried a loader that ran when the
    module was imported, not when it was installed, so --ignore-scripts and
    lifecycle-hook monitoring did not stop it. The loader started a hidden, detached
    node child, fetched a second stage through an IPFS gateway and wrote it as sync.js
    in a folder named NodeJS under the user's application-data directory, then
    registered persistence under the name miasma-monitor and read developer and CI
    credentials. Reading credential files through Node's own file API starts no process
    and is not seen. The staged script, the node process that runs it, the gateway
    lookup and the persistence name are.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - supply-chain
    - npm
    - asyncapi
    - nodejs
    - ipfs
    - developer-workstation
    - ci-runner
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H251.md
    - https://attack.mitre.org/techniques/T1195
    - https://attack.mitre.org/techniques/T1195/001
    - https://attack.mitre.org/detectionstrategies/DET0009

mitre:
  tactics:
    - TA0001
  techniques:
    - T1195
  sub_techniques:
    - T1195.001
  detection_strategies:
    - DET0009
  analytics:
    - AN0021
    - AN0022
    - AN0023
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - WinEventLog:Sysmon
    - auditd:SYSCALL
    - macos:endpointsecurity
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    A poisoned AsyncAPI package runs during Node import, stages sync.js under a
    user-writable NodeJS directory, then reads developer or CI credentials for follow-on
    API access.
  attacker_behavior:
    - "Runs its loader when the module is imported by a build, a test or an application start."
    - Starts a detached node child with inline code so the work outlives the importing process.
    - Fetches the second stage through a public IPFS gateway.
    - "Writes sync.js under %LOCALAPPDATA%\\NodeJS, ~/Library/Application Support/NodeJS, ~/.local/share/NodeJS or ~/.config/NodeJS."
    - Registers a Run value or a systemd user service named miasma-monitor.
  legitimate_behavior:
    - Build tools start node children with inline code.
    - Node installers and version managers create folders named nodejs.
    - A few projects fetch content from IPFS gateways on purpose.
  risk_indicator:
    - "A file named sync.js appears in a NodeJS folder under a user's application-data directory."
    - node runs that sync.js.
    - node resolves an IPFS gateway on a host with no IPFS project.
    - A persistence entry or path carries the name miasma.
    - "The host connects to the reported address on port 8080, 8081 or 8091."

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
    - source: network_connection
      connector: crowdstrike-ngsiem
      event_types:
        - NetworkConnectIP4
      fields:
        agent_id: aid
        host: ComputerName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
        remote_address: RemoteAddressIP4
        remote_port: RemotePort
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: sync-js-written-to-nodejs-user-folder
        name: sync.js written into a NodeJS user-data folder
        purpose: >-
          Return script writes of sync.js directly inside a folder named NodeJS, on any
          platform, with the writing process id. Whether the sensor classes a .js file
          with no interpreter line as a script on Linux and macOS is not established; on
          those platforms the next case is the dependable one.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/[\\\/]NodeJS[\\\/]sync\.js$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-running-staged-sync-js
        name: node running sync.js from a NodeJS user-data folder
        purpose: >-
          Return node processes whose arguments name sync.js in a NodeJS folder, with
          parent and user.
        query: |
          #event_simpleName=ProcessRollup2
          | FileName=/^node(\.exe)?$/i
          | CommandLine=/[\\\/]NodeJS[\\\/]sync\.js/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-inline-child-of-node
        name: node started by node with inline code
        purpose: >-
          Return node children of node that evaluate code from the command line, the
          detached stager's shape. Build tools do the same, so this case is wide and is
          context for the others: the agent keeps a child whose process id wrote sync.js
          or resolved a gateway.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^node(\.exe)?$/i
          | FileName=/^node(\.exe)?$/i
          | CommandLine=/\s(-e|--eval|-p|--print)\s/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ipfs-gateway-resolved-by-node
        name: IPFS gateway resolved by node
        purpose: >-
          Return DNS requests from node for public IPFS gateways. The reports give
          content paths and not the gateway used, so the list is the common public
          gateways; the content path is inside TLS and is not visible.
        query: |
          #event_simpleName=DnsRequest
          | ContextBaseFileName=/^node(\.exe)?$/i
          | DomainName=/(^|\.)(ipfs\.io|dweb\.link|cloudflare-ipfs\.com|cf-ipfs\.com|gateway\.pinata\.cloud|w3s\.link|nftstorage\.link|4everland\.io|ipfs\.fleek\.co)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reported-controller-address
        name: Connection to the reported controller address
        purpose: >-
          Return connections to the address the reports name, with the connecting
          process. The address will age.
        query: |
          #event_simpleName=NetworkConnectIP4
          | RemoteAddressIP4=/^85\.137\.53\.71$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: miasma-name-on-command-line
        name: miasma-monitor or the .miasma folder named on a command line
        purpose: >-
          Return any command that names the persistence unit or the lock folder:
          systemctl enabling the user service, a shell appending to a startup file,
          reg.exe adding the Run value.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/miasma-monitor|[\\\/]\.miasma[\\\/]/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: miasma-monitor-run-value
        name: Run value named miasma-monitor
        purpose: >-
          Return the Windows Run value the loader writes.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run\\?$/i
          | RegValueName=/^miasma-monitor$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: staged_sync_js_executed
      name: Staged sync.js run by node
      description: >-
        node runs sync.js from a NodeJS folder under a user's application-data
        directory.
      source: process_creation
      field: command_line
      indicates: second_stage_execution

  supporting:
    - id: sync_js_written
      name: sync.js written to the staging folder
      description: >-
        A script named sync.js was written into a NodeJS user-data folder.
      source: file_creation
      field: file_path
      indicates: second_stage_staged
    - id: node_parent
      name: Stager was started by node
      description: >-
        The parent of the inline node child is node, running a build, a test or an
        application.
      source: process_creation
      field: parent_process
      indicates: import_time_execution
    - id: ipfs_gateway_lookup
      name: node resolved an IPFS gateway
      description: >-
        A DNS request for a public IPFS gateway names node as the requester.
      source: dns_request
      field: query_name
      indicates: second_stage_retrieval
    - id: controller_connection
      name: Connection to the reported controller
      description: >-
        A process on the host connected to the reported address.
      source: network_connection
      field: remote_address
      indicates: command_and_control
    - id: miasma_run_value
      name: miasma-monitor Run value
      description: >-
        A Run value named miasma-monitor was written.
      source: registry
      field: registry_value
      indicates: user_persistence
    - id: stage_then_persist
      name: Staging and persistence in one session
      description: >-
        The write of sync.js, its execution and the persistence entry follow each other
        on one host under one user. The agent derives the order from the returned
        events.
      source: process_creation
      field: user
      indicates: loader_chain

  contradicting:
    - id: ipfs_project_host
      name: Host builds an IPFS project
      description: >-
        The host belongs to a team whose project fetches from IPFS gateways.
      source: asset_inventory
      field: ComputerName
      indicates: expected_ipfs_use
    - id: known_application_script
      name: sync.js belongs to an installed application
      description: >-
        The script path is part of an installed application the baseline records.
      source: baseline
      field: CommandLine
      indicates: application_component

  risk_logic:
    required:
      - staged_sync_js_executed

    supporting:
      any:
        - sync_js_written
        - node_parent
        - ipfs_gateway_lookup
        - controller_connection
        - miasma_run_value
        - stage_then_persist
      all:
        - sync_js_written
        - ipfs_gateway_lookup

    contradicting:
      any:
        - ipfs_project_host
        - known_application_script
      all: []

  verdict:
    low_risk_when:
      - staged_sync_js_executed
      - ipfs_project_host
      - known_application_script
    suspicious_when:
      - staged_sync_js_executed
      - sync_js_written
    high_risk_when:
      - staged_sync_js_executed
      - sync_js_written
      - miasma_run_value

  false_positive:
    - condition: Build tools starting node with inline code.
      explanation: >-
        Bundlers and test runners do this constantly. On its own the third case means
        nothing.
    - condition: Applications with a file named sync.js.
      explanation: >-
        The name is common inside project trees. It is not common in a folder called
        NodeJS directly under application data.
    - condition: IPFS development.
      explanation: >-
        Teams building on IPFS resolve gateways from node by design.
