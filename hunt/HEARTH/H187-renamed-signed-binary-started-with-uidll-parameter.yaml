# Converted from THORCollective/HEARTH Flames/H187.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h187-renamed-signed-binary-started-with-uidll-parameter-t1036-003
version: 1.0.0

info:
  name: Renamed signed binary started with the -uiDll parameter
  description: >-
    OceanLotus renames legitimately signed executables and uses them to load its
    SPECTRALVIPER downloader: Toolbox.exe becomes Genuine.exe, Updater.exe or
    AutoCAD242.exe, dtlupdate.exe becomes IntelAudioService.exe, and the -uiDll
    parameter tells the signed program which DLL to load (ESET). The signature is real,
    so trust-by-signer passes. The DLL load is a Module Load event this deployment does
    not collect, and no template here relies on the original file name recorded in the
    PE header, so neither the side-load nor the rename check HEARTH describes is
    claimed. The parameter is on the command line, and the masquerade names running or
    landing outside an install path are process and file-write events.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - defense-evasion
    - masquerading
    - renamed-binary
    - signed-binary
    - oceanlotus
    - spectralviper
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H187.md
    - https://attack.mitre.org/techniques/T1036
    - https://attack.mitre.org/techniques/T1036/003
    - https://attack.mitre.org/detectionstrategies/DET0005

mitre:
  tactics:
    - TA0005
  techniques:
    - T1036
  sub_techniques:
    - T1036.003
  detection_strategies:
    - DET0005
  analytics:
    - AN0012
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    A legitimately code-signed executable has been renamed and is side-loading an
    unsigned or invalid-signature DLL from a user-writable, non-standard path
    (OceanLotus signed-binary DLL side-loading).
  attacker_behavior:
    - Copies a signed vendor executable under a name that suggests another product.
    - Places it with a malicious DLL in ProgramData, AppData, Public or a temporary directory.
    - Starts it with -uiDll naming the DLL to load.
    - Lets the signed process carry the downloader past signature-based controls.
  legitimate_behavior:
    - The vendor's own launcher passes -uiDll to its toolbox program from the install directory.
    - Unrelated products ship an Updater.exe or a Genuine.exe of their own.
  risk_indicator:
    - A command line carries -uiDll and the image is outside Program Files.
    - The DLL named after -uiDll is in a user-writable directory.
    - AutoCAD242.exe, IntelAudioService.exe or Genuine.exe runs from outside an install path.
    - One of those names is written to a user-writable directory.
    - The parent is a script host, a scheduled task or an Office program.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: uidll-parameter-on-command-line
        name: Process started with the -uiDll parameter
        purpose: >-
          Return every process whose command line carries -uiDll, with its image path.
          The vendor's own use comes from its install directory; the agent keeps the
          events whose image or named DLL is elsewhere.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\s[-\/]uiDll\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: masquerade-name-running-outside-install-path
        name: Reported masquerade name running outside Program Files and Windows
        purpose: >-
          Return the three distinctive names the report gives when their image is not
          under Program Files or Windows. Updater.exe is also reported but is shipped by
          too many products to return by name; the first case covers it when the
          parameter is present.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(Genuine|AutoCAD242|IntelAudioService)\.exe$/i
          | ImageFileName!=/\\(Program Files( \(x86\))?|Windows)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: masquerade-name-written-to-disk
        name: Reported masquerade name written as an executable
        purpose: >-
          Return the write of an executable under one of the three names, with the
          writing process.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\(Genuine|AutoCAD242|IntelAudioService)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: signed_binary_started_to_load_dll
      name: Signed program started with -uiDll or under a masquerade name
      description: >-
        A process carries the -uiDll parameter, or runs under one of the reported
        masquerade names, from outside an install directory.
      source: process_creation
      field: command_line
      indicates: renamed_signed_binary_execution

  supporting:
    - id: image_in_user_writable_path
      name: Image is in a user-writable directory
      description: >-
        The image path is under ProgramData, AppData, Public or a temporary directory.
      source: process_creation
      field: image_path
      indicates: binary_staged_outside_install_path
    - id: masquerade_binary_dropped
      name: Masquerade-named executable written
      description: >-
        An executable named Genuine.exe, AutoCAD242.exe or IntelAudioService.exe is
        written to disk.
      source: file_creation
      field: file_path
      indicates: renamed_binary_staged
    - id: dropped_by_unexpected_writer
      name: Writer is not an installer
      description: >-
        The process named on the write is a script host, an archive tool or an Office
        program.
      source: file_creation
      field: writer_process_name
      indicates: loader_dropped_by_first_stage
    - id: non_interactive_parent
      name: Parent is a task, service or script host
      description: >-
        The parent is a scheduled task host, a service or a script interpreter rather
        than the vendor's launcher.
      source: process_creation
      field: parent_process
      indicates: persistence_launch

  contradicting:
    - id: vendor_product_installed
      name: Vendor product is installed and launching itself
      description: >-
        Software inventory lists the product, the image is in its install directory and
        the parent is its launcher.
      source: asset_inventory
      field: ComputerName
      indicates: legitimate_vendor_launch
    - id: name_belongs_to_other_product
      name: Name belongs to another installed product
      description: >-
        A different installed product ships an executable with this name in this
        location.
      source: baseline
      field: ImageFileName
      indicates: coincidental_file_name

  risk_logic:
    required:
      - signed_binary_started_to_load_dll

    supporting:
      any:
        - image_in_user_writable_path
        - masquerade_binary_dropped
        - dropped_by_unexpected_writer
        - non_interactive_parent
      all:
        - image_in_user_writable_path
        - masquerade_binary_dropped

    contradicting:
      any:
        - vendor_product_installed
        - name_belongs_to_other_product
      all: []

  verdict:
    low_risk_when:
      - signed_binary_started_to_load_dll
      - vendor_product_installed
      - name_belongs_to_other_product
    suspicious_when:
      - signed_binary_started_to_load_dll
      - image_in_user_writable_path
    high_risk_when:
      - signed_binary_started_to_load_dll
      - image_in_user_writable_path
      - masquerade_binary_dropped
      - dropped_by_unexpected_writer

  false_positive:
    - condition: The vendor's software is installed.
      explanation: >-
        Its launcher passes -uiDll to its own program. Both sit in the product's
        directory under Program Files.
    - condition: Another product ships Genuine.exe.
      explanation: >-
        Licence-check components carry that name. They run from their product's install
        path.
