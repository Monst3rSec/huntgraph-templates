# Converted from THORCollective/HEARTH Flames/H126.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h126-headless-browser-started-by-non-browser-parent-t1555-003
version: 1.0.0

info:
  name: Headless or unsandboxed browser started by a non-browser parent
  description: >-
    Recent information stealers do not always read the browser's credential files
    themselves. They start Chrome or Edge headless, with the sandbox off and a throwaway
    profile directory, and take the decrypted data from that instance. In the STXRAT
    intrusion PureLogs, injected into calc.exe, did this, so calc.exe appeared as the
    parent of chrome.exe and msedge.exe. The injection is not visible to the sensor and
    neither is a read of the Login Data file. The browser start is: its switches are on
    the command line and its parent is named. A stealer that opens the credential
    database in its own code and never starts a browser leaves nothing here.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - credential-access
    - browser-credentials
    - infostealer
    - headless-browser
    - purelogs
    - stxrat
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H126.md
    - https://attack.mitre.org/techniques/T1555
    - https://attack.mitre.org/techniques/T1555/003
    - https://attack.mitre.org/detectionstrategies/DET0037
    - https://blog.deception.pro/blog/cpuz-trojan-stxrat-purelogs-data-exfil-april-2026

mitre:
  tactics:
    - TA0006
  techniques:
    - T1555
  sub_techniques:
    - T1555.003
  detection_strategies:
    - DET0037
  analytics:
    - AN0105
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary is harvesting stored browser credentials by spawning headless Chrome or
    Edge instances with --no-sandbox flags from an unexpected parent process, indicating
    infostealer activity targeting browser password stores.
  attacker_behavior:
    - Starts chrome.exe or msedge.exe with --headless, --no-sandbox and --disable-gpu.
    - Points --user-data-dir at a randomly named folder under Temp holding a copy of the profile.
    - Opens a remote debugging port and reads cookies and passwords through it.
    - Does this from a hollowed system utility such as calc.exe.
    - Closes the browser within seconds and sends the data over its existing channel.
  legitimate_behavior:
    - Test automation frameworks start headless browsers with these switches.
    - PDF and screenshot services render pages in a headless browser.
    - Developers debug with a remote debugging port.
  risk_indicator:
    - The parent is a system utility, a proxy binary or an unknown executable.
    - The profile directory is a random folder under Temp.
    - Chrome and Edge are both started this way from the same parent within seconds.
    - The host is not a build, test or rendering machine.
    - The browser process lives for only a few seconds.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: headless-or-unsandboxed-browser-from-non-browser-parent
        name: Browser started headless or without sandbox by a non-browser parent
        purpose: >-
          Return browser starts that carry --headless or --no-sandbox where the parent
          is not the browser itself or its updater. The browser's own child processes
          inherit the switches and are removed by the parent test. Automation parents
          such as node and python are kept, because stealers are written in those too.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(chrome|msedge|brave|opera|vivaldi)\.exe$/i
          | ParentBaseFileName!=/^(chrome|msedge|brave|opera|vivaldi|msedgewebview2|GoogleUpdate|MicrosoftEdgeUpdate|setup)\.exe$/i
          | CommandLine=/--no-sandbox|--headless/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: browser-with-temporary-profile-directory
        name: Browser started with a profile directory under Temp or ProgramData
        purpose: >-
          Return browser starts whose --user-data-dir points into a Temp folder or
          ProgramData, from a non-browser parent.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(chrome|msedge|brave|opera|vivaldi)\.exe$/i
          | ParentBaseFileName!=/^(chrome|msedge|brave|opera|vivaldi|msedgewebview2)\.exe$/i
          | CommandLine=/--user-data-dir=["']?[^"']*\\(Temp|ProgramData)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: browser-with-remote-debugging-from-non-browser-parent
        name: Browser started with remote debugging by a non-browser parent
        purpose: >-
          Return browser starts that open a remote debugging port or pipe from a
          non-browser parent, the route used to read cookies and passwords out of a
          running instance.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(chrome|msedge|brave|opera|vivaldi)\.exe$/i
          | ParentBaseFileName!=/^(chrome|msedge|brave|opera|vivaldi|msedgewebview2)\.exe$/i
          | CommandLine=/--remote-debugging-(port|pipe)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: browser-started-by-system-utility
        name: Browser started by a system utility or proxy binary
        purpose: >-
          Return any browser start whose parent is a utility that has no reason to open
          a browser, the calc.exe to chrome.exe lineage, whatever the switches.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(chrome|msedge|brave|opera|vivaldi)\.exe$/i
          | ParentBaseFileName=/^(calc|notepad|mspaint|rundll32|regsvr32|dllhost|msbuild|installutil|regasm|regsvcs|aspnet_compiler|werfault|wscript|cscript|mshta|conhost|AddInProcess32|vbc|csc)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: browser_started_for_credential_access
      name: Browser started headless, unsandboxed or by an unexpected parent
      description: >-
        Chrome, Edge or a relative was started by a non-browser parent with headless,
        no-sandbox, remote debugging or a temporary profile, or by a system utility.
      source: process_creation
      field: command_line
      indicates: browser_credential_harvesting

  supporting:
    - id: system_utility_parent
      name: Parent is a system utility or proxy binary
      description: >-
        The parent is calc.exe, notepad.exe, a .NET utility or another program that does
        not start browsers.
      source: process_creation
      field: parent_process
      indicates: injected_or_hollowed_parent
    - id: temporary_profile_directory
      name: Profile directory is a random Temp folder
      description: >-
        The --user-data-dir value is a randomly named folder under Temp or ProgramData.
      source: process_creation
      field: command_line
      indicates: throwaway_browser_profile
    - id: several_browsers_same_parent
      name: Several browsers started by one parent
      description: >-
        The same parent process id starts Chrome and Edge this way within seconds. The
        agent derives this from the returned events.
      source: process_creation
      field: parent_process_id
      indicates: sweep_of_installed_browsers
    - id: ordinary_workstation_user
      name: Runs in an ordinary user's session
      description: >-
        The user is not a developer or a test service account.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: test_or_rendering_host
      name: Host runs browser automation
      description: >-
        Asset records class the host as a build agent, test machine or rendering
        service.
      source: asset_inventory
      field: ComputerName
      indicates: expected_browser_automation
    - id: recurring_automation_parent
      name: Parent is a known automation product
      description: >-
        The same parent and command line recur on the host from a test framework or a
        reporting product.
      source: baseline
      field: ParentBaseFileName
      indicates: routine_automation

  risk_logic:
    required:
      - browser_started_for_credential_access

    supporting:
      any:
        - system_utility_parent
        - temporary_profile_directory
        - several_browsers_same_parent
        - ordinary_workstation_user
      all:
        - system_utility_parent
        - temporary_profile_directory

    contradicting:
      any:
        - test_or_rendering_host
        - recurring_automation_parent
      all: []

  verdict:
    low_risk_when:
      - browser_started_for_credential_access
      - test_or_rendering_host
    suspicious_when:
      - browser_started_for_credential_access
      - ordinary_workstation_user
    high_risk_when:
      - browser_started_for_credential_access
      - system_utility_parent
      - temporary_profile_directory

  false_positive:
    - condition: Selenium, Puppeteer and Playwright.
      explanation: >-
        Test frameworks start browsers headless, unsandboxed and with a temporary
        profile. The parent is a driver or a language runtime on a build or developer
        machine.
    - condition: Applications that print or render through a headless browser.
      explanation: >-
        Reporting tools and some desktop applications call Edge headless to make a PDF.
        The parent is that application and the command names a local file.
    - condition: Scripts that open a web page.
      explanation: >-
        A script host starting a browser with a URL and no special switches matches the
        last case. The command line is a single address.
