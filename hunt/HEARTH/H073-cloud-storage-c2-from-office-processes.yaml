# Converted from THORCollective/HEARTH Flames/H073.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# Also holds H085 (Google Drive API used for command and control by the GearDoor
# backdoor, Silver Dragon). Same technique and same question, which process talks to the
# storage service; the Google Drive API hosts and a case for them were added for it.
type: detection

id: hg-win-hearth-h073-cloud-storage-c2-from-office-processes-t1102-002
version: 1.1.0

info:
  name: Cloud storage service used as a command and control channel from Office
  description: >-
    APT28 has run intrusions against defence and diplomatic organisations in which a
    weaponised Office document leads to an implant that takes its tasking from, and
    returns its output to, a consumer cloud storage service such as filen.io. The
    traffic is TLS to a storage provider and passes proxy allow-lists, and the payload
    runs in memory. HEARTH also lists client exploitation and process injection, neither
    of which this deployment can observe. What remains is which process talks to the
    storage service: an Office application, a script host or a system utility resolving a
    storage API domain is not a person syncing files.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - command-and-control
    - cloud-storage
    - web-service
    - apt28
    - filen
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H073.md
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H085.md
    - https://attack.mitre.org/techniques/T1102
    - https://attack.mitre.org/techniques/T1102/002
    - https://attack.mitre.org/detectionstrategies/DET0035

mitre:
  tactics:
    - TA0011
  techniques:
    - T1102
  sub_techniques:
    - T1102.002
  detection_strategies:
    - DET0035
  analytics:
    - AN0100
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
    - etw:Microsoft-Windows-WinINet
  data_components:
    - Process Creation
    - Network Traffic Content

hypothesis:
  statement: >-
    An adversary is abusing legitimate cloud storage services as command-and-control
    channels, delivering fileless payloads through weaponized Office documents and
    targeting defense and diplomatic organizations, to conduct espionage while evading
    network-based detection.
  attacker_behavior:
    - Sends a weaponised document from a compromised government mail account.
    - Runs a memory-only implant from the Office process or a process it injects into.
    - Polls a cloud storage API for command files and uploads results to the same account.
    - Uses a less common storage provider that the organisation does not otherwise use.
    - Starts a system utility or script host from Office to carry the next stage.
  legitimate_behavior:
    - Office applications open and save documents on the organisation's own cloud storage.
    - Sync clients for approved storage services run on every workstation.
    - Users reach personal storage through a browser.
  risk_indicator:
    - The process resolving the storage domain is Office, a script host or a system binary.
    - The provider is one the organisation does not use.
    - Requests recur at a steady interval from one process.
    - Office starts rundll32, a script host or an interpreter around the same time.
    - The user recently opened a document from an external sender.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: uncommon-storage-service-requested
        name: DNS request for a less common cloud storage service
        purpose: >-
          Return requests for storage providers that enterprises seldom adopt,
          including filen.io, from any process. The providers an organisation does use
          should be removed from the pattern before a long-window run.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)(filen\.io|filen\.net|koofr\.net|koofr\.eu|pcloud\.com|mega\.nz|mega\.co\.nz|icedrive\.net|internxt\.com|proton\.me|4shared\.com|mediafire\.com|yandex\.net|disk\.yandex\.com|opendrive\.com|sync\.com)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: storage-api-requested-by-office-or-system-process
        name: Cloud storage API resolved by Office, a script host or a system utility
        purpose: >-
          Return storage-service requests whose requester is a process that does not
          sync files. This covers the mainstream providers too, where the requester and
          not the destination is what is wrong.
        query: |
          #event_simpleName=DnsRequest
          | ContextBaseFileName=/^(winword|excel|powerpnt|outlook|msaccess|mspub|onenote|wscript|cscript|mshta|rundll32|regsvr32|msbuild|installutil|powershell|pwsh|cmd|dllhost|svchost|werfault|notepad|msiexec)\.exe$/i
          | DomainName=/(^|\.)(filen\.io|filen\.net|koofr\.net|pcloud\.com|mega\.nz|mega\.co\.nz|icedrive\.net|content\.dropboxapi\.com|api\.dropboxapi\.com|api\.box\.com|upload\.box\.com|4shared\.com|mediafire\.com|disk\.yandex\.com|cloud-api\.yandex\.net|drive\.google\.com|drive\.googleapis\.com|www\.googleapis\.com)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: google-drive-api-requested-by-non-client-process
        name: Google Drive API host resolved by a process that is not a browser or the Drive client
        purpose: >-
          Return requests for the Drive API's own host from anything other than a
          browser, the Google Drive client or an Office application with a Drive
          add-in. A backdoor that takes tasking from a Drive account runs under its own
          image name, which the requester list in the previous case cannot anticipate.
          www.googleapis.com also serves the Drive API but is shared by every Google
          API and is returned only for the requesters named in the previous case.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/^drive\.googleapis\.com$/i
          | ContextBaseFileName!=/^(chrome|msedge|firefox|brave|opera|iexplore|GoogleDriveFS|googledrivesync|GoogleUpdate|msedgewebview2|rclone)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: office-spawned-loader-or-script-host
        name: Office application starting a loader or script host
        purpose: >-
          Return the processes Office starts that carry a next stage, so the agent can
          place a storage request after a document was opened.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(winword|excel|powerpnt|outlook|msaccess|mspub|onenote)\.exe$/i
          | FileName=/^(rundll32|regsvr32|mshta|wscript|cscript|powershell|pwsh|cmd|msbuild|installutil|certutil|dllhost)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: storage_service_request
      name: Cloud storage service contacted
      description: >-
        A DNS request names a cloud storage or storage API domain from the host.
      source: dns_request
      field: query_name
      indicates: web_service_channel_candidate

  supporting:
    - id: non_sync_requester
      name: Requester is not a sync client or browser
      description: >-
        The process that resolved the storage domain is an Office application, a script
        host or a system utility.
      source: dns_request
      field: process_name
      indicates: implant_using_storage_service
    - id: office_child_loader
      name: Office started a loader or script host
      description: >-
        A process whose parent is an Office application is rundll32, a script host, an
        interpreter or a .NET loader.
      source: process_creation
      field: parent_process
      indicates: document_driven_execution
    - id: unused_provider
      name: Provider is not used by the organisation
      description: >-
        The storage provider is absent from the organisation's approved and observed
        services.
      source: asset_inventory
      field: DomainName
      indicates: unsanctioned_service
    - id: targeted_user
      name: User is in a targeted role
      description: >-
        The account belongs to someone in defence, diplomatic, policy or executive work.
      source: process_creation
      field: user
      indicates: targeted_victim_profile

  contradicting:
    - id: approved_storage_integration
      name: Office add-in or integration for an approved provider
      description: >-
        The organisation uses the provider, and an Office integration for it is deployed
        to the host.
      source: asset_inventory
      field: ComputerName
      indicates: approved_storage_integration
    - id: provider_common_in_estate
      name: Provider is requested by many hosts routinely
      description: >-
        Earlier activity shows the same domain requested from most hosts by sync clients
        and browsers over a long period.
      source: baseline
      field: DomainName
      indicates: established_destination

  risk_logic:
    required:
      - storage_service_request

    supporting:
      any:
        - non_sync_requester
        - office_child_loader
        - unused_provider
        - targeted_user
      all:
        - non_sync_requester
        - unused_provider

    contradicting:
      any:
        - approved_storage_integration
        - provider_common_in_estate
      all: []

  verdict:
    low_risk_when:
      - storage_service_request
      - approved_storage_integration
      - provider_common_in_estate
    suspicious_when:
      - storage_service_request
      - unused_provider
    high_risk_when:
      - storage_service_request
      - unused_provider
      - non_sync_requester

  false_positive:
    - condition: Staff use a personal storage account in a browser.
      explanation: >-
        The first case returns this. The requester is a browser and the pattern is
        occasional; whether it is allowed is policy.
    - condition: Office opens documents from an approved storage integration.
      explanation: >-
        Box and Dropbox integrations make Office resolve their API domains. The provider
        is approved and the integration is installed.
    - condition: PowerShell scripts use a storage API for backups.
      explanation: >-
        Administrators automate uploads to approved storage. The job is scheduled, runs
        under a service account, and targets the organisation's tenant.
