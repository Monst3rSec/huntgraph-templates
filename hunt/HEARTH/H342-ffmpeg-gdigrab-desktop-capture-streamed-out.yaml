# Converted from THORCollective/HEARTH Flames/H342.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH also cites T1572 and T1105. The tunnel is the subject of H036, H046 and
# H062; one case here returns tunnel clients for placing the capture in time.
type: detection

id: hg-win-hearth-h342-ffmpeg-gdigrab-desktop-capture-streamed-out-t1113
version: 1.0.0

info:
  name: FFmpeg gdigrab capturing the desktop to a stream
  description: >-
    In a KongTuke ClickFix intrusion that ended in SystemBC, the operator fetched a
    stock FFmpeg build from gyan.dev and ran it with the gdigrab input device to capture
    the desktop, sending the encoded stream out through a reverse SSH tunnel beside a
    Chisel client and a Cloudflare tunnel. No screenshot file is written and no implant
    calls a capture API, so detections built on either see nothing. What remains is the
    command line: FFmpeg requires -f gdigrab or ddagrab and -i desktop whatever the
    executable is called, and a streaming capture names a URL, a pipe or a streaming
    muxer as its output.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - collection
    - screen-capture
    - ffmpeg
    - gdigrab
    - kongtuke
    - systembc
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H342.md
    - https://attack.mitre.org/techniques/T1113
    - https://attack.mitre.org/detectionstrategies/DET0346

mitre:
  tactics:
    - TA0009
  techniques:
    - T1113
  sub_techniques: []
  detection_strategies:
    - DET0346
  analytics:
    - AN0980
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An operator with interactive access has downloaded a legitimate FFmpeg build and is
    using its gdigrab input device to capture the victim's desktop, piping the encoded
    stream to a loopback port or remote endpoint reached through a reverse SSH, Chisel
    or Cloudflare tunnel, producing continuous visual surveillance of the console with
    no screenshot files written to disk and no RAT screen-capture module for EDR to
    recognise.
  attacker_behavior:
    - Downloads an FFmpeg build into a user-writable or staging directory.
    - Runs it with -f gdigrab -i desktop, or -i title= for one window.
    - Sends the output to a URL, a loopback port or standard output and not to a file.
    - Lowers frame rate and size and silences FFmpeg's console output.
    - Runs a reverse SSH, Chisel or Cloudflare tunnel on the same host.
  legitimate_behavior:
    - Support, training and QA staff record the screen with FFmpeg to a video file.
    - OBS and screen-recording products bundle FFmpeg in their own install directory.
    - Test rigs record a display during automated UI runs.
  risk_indicator:
    - The output is a network URL, a pipe or a streaming muxer.
    - The FFmpeg image is under AppData, ProgramData, Users\Public, PerfLogs or a Temp folder.
    - The command has no duration limit and suppresses output.
    - A tunnel client runs on the host around the same time.
    - The host is a server or belongs to a user with no media work.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: screen-capture-input-device-on-command-line
        name: Command line naming the gdigrab or ddagrab input device
        purpose: >-
          Return any process whose command line names FFmpeg's desktop capture devices
          or the desktop and title= inputs. The image name is not tested, so a renamed
          FFmpeg is returned. This is an unanchored match over every Windows process
          start; the pattern is specific enough to keep the result small.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\b(gdigrab|ddagrab)\b|\s-i\s+"?(desktop|title=)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ffmpeg-with-streaming-output
        name: FFmpeg writing to a network URL, a pipe or a streaming muxer
        purpose: >-
          Return FFmpeg under its own name whose output is a URL scheme, standard output
          or a streaming container. This catches a capture through a device the first
          case does not name, and also returns legitimate streaming, which the agent
          separates by path and user.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^ffmpeg\.exe$/i
          | CommandLine=/\b(rtmps?|rtsp|udp|tcp|srt|https?):\/\/|\s-f\s+(mpegts|flv|rtp|nut)\b|\spipe:|\s-\s*$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ffmpeg-running-from-user-writable-path
        name: FFmpeg running from a user-writable or staging directory
        purpose: >-
          Return FFmpeg processes whose image is outside an installed application
          directory, whatever their arguments.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^ffmpeg\.exe$/i
          | ImageFileName=/\\(AppData|ProgramData|Users\\Public|PerfLogs|Windows\\Temp|Temp|Downloads)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ffmpeg-executable-written
        name: FFmpeg executable written to disk
        purpose: >-
          Return writes of ffmpeg.exe, ffprobe.exe and ffplay.exe with the writing
          process, to show when and how the build arrived. Installers of recording
          products are returned too.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\ff(mpeg|probe|play)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ffmpeg-build-site-requested
        name: DNS request for the FFmpeg Windows build site
        purpose: >-
          Return requests for gyan.dev, where the reported build came from, with the
          requesting process.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)gyan\.dev$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: tunnel-client-on-capture-host
        name: Reverse tunnel client started
        purpose: >-
          Return SSH remote forwards, Chisel clients and Cloudflare quick tunnels, the
          three routes reported beside the capture, so the agent can place a capture
          command next to the channel that carried it. H036, H046 and H062 hunt these in
          their own right.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(ssh|plink|cloudflared|chisel)\.exe$/i
          | CommandLine=/\s-R\s+\S+|\btunnel\s+.*--url\b|\bclient\s+.*\bR:/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: desktop_capture_command
      name: FFmpeg desktop capture command
      description: >-
        A process command line names the gdigrab or ddagrab device, or the desktop or
        title= input.
      source: process_creation
      field: command_line
      indicates: screen_capture_by_utility

  supporting:
    - id: stream_not_file_output
      name: Output is a stream and not a file
      description: >-
        The same command line ends in a network URL, a loopback port, a pipe or a
        streaming muxer, which the agent reads from the returned event.
      source: process_creation
      field: command_line
      indicates: live_surveillance_stream
    - id: ffmpeg_in_staging_path
      name: FFmpeg runs from a staging directory
      description: >-
        The image path is under AppData, ProgramData, Users\Public, PerfLogs, Temp or
        Downloads.
      source: process_creation
      field: image_path
      indicates: operator_supplied_tool
    - id: ffmpeg_recently_written
      name: FFmpeg was written shortly before it ran
      description: >-
        An ffmpeg executable was written on the host by a shell, a download utility or
        an archive tool close to the capture.
      source: file_creation
      field: file_path
      indicates: tool_transfer
    - id: build_site_resolved
      name: FFmpeg build site resolved by a non-browser process
      description: >-
        The request for gyan.dev came from PowerShell, curl or another process that is
        not a browser.
      source: dns_request
      field: process_name
      indicates: scripted_tool_download
    - id: tunnel_client_nearby
      name: Tunnel client running on the host
      description: >-
        A reverse SSH, Chisel or Cloudflare tunnel process started on the host near the
        capture, by the agent's comparison of event times.
      source: process_creation
      field: image_name
      indicates: exfiltration_channel_present

  contradicting:
    - id: recording_role
      name: User records the screen as part of their work
      description: >-
        The account belongs to support, training, QA or media staff who record screens
        routinely.
      source: identity_context
      field: UserName
      indicates: expected_screen_recording
    - id: bundled_with_recording_product
      name: FFmpeg belongs to an installed recording product
      description: >-
        The image sits in the install directory of a recording or streaming product
        deployed to the host.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software

  risk_logic:
    required:
      - desktop_capture_command

    supporting:
      any:
        - stream_not_file_output
        - ffmpeg_in_staging_path
        - ffmpeg_recently_written
        - build_site_resolved
        - tunnel_client_nearby
      all:
        - stream_not_file_output
        - ffmpeg_in_staging_path

    contradicting:
      any:
        - recording_role
        - bundled_with_recording_product
      all: []

  verdict:
    low_risk_when:
      - desktop_capture_command
      - recording_role
      - bundled_with_recording_product
    suspicious_when:
      - desktop_capture_command
      - ffmpeg_in_staging_path
    high_risk_when:
      - desktop_capture_command
      - stream_not_file_output
      - ffmpeg_in_staging_path

  false_positive:
    - condition: Staff record tutorials or bug reports with FFmpeg.
      explanation: >-
        The command writes an .mp4 or .mkv file, runs for a bounded time and belongs to
        a user who does this often.
    - condition: A streaming product drives FFmpeg.
      explanation: >-
        The parent is the product and the image is in its install directory; the
        destination is a known streaming service.
    - condition: UI test automation records the display.
      explanation: >-
        The host is a test machine, the parent is the test runner and the output is a
        file kept with the test results.
