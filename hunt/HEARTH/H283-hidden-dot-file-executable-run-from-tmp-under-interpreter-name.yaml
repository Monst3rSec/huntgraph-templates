# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-lin-hearth-h283-hidden-dot-file-executable-run-from-tmp-under-interpreter-name-t1564-001
version: 1.0.0

info:
  name: Dot-prefixed hidden executable run from /tmp and a payload staged under an interpreter's name
  description: >-
    After exploiting an AI inference gateway, the adversary stages second-stage payloads
    in /tmp as dot-prefixed hidden files and runs them through a relay whose command
    line reads exec /tmp/.name or -c /tmp/.name. A separate ELF is written into a
    directory named /tmp/python3 and started with supervisord-style arguments, so that a
    process listing reads as an interpreter or a daemon. The payload directories are
    then made immutable with chattr +i. H019 already returns every process that runs
    from a scratch directory; this template narrows to the concealment: an image path
    with a dot-prefixed component under /tmp, /var/tmp or /dev/shm, a relay command
    naming such a path, an image inside a directory named after an interpreter or system
    daemon, the immutable flag set on a scratch path, and hidden executables written
    there.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - stealth
    - hidden-files
    - masquerading
    - ai-gateway
    - chattr
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H283.md
    - https://attack.mitre.org/techniques/T1564
    - https://attack.mitre.org/techniques/T1564/001
    - https://attack.mitre.org/detectionstrategies/DET0032

mitre:
  tactics:
    - TA0005
  techniques:
    - T1564
  sub_techniques:
    - T1564.001
  detection_strategies:
    - DET0032
  analytics:
    - AN0092
  platforms:
    - Linux
  data_sources:
    - auditd:EXECVE
    - auditd:FILE
  data_components:
    - Command Execution
    - File Creation

hypothesis:
  statement: >-
    After exploiting an exposed AI inference gateway, an adversary stages second-stage
    payloads in /tmp as dot-prefixed hidden files and executes them through a relay,
    while separately writing an ELF into a directory named /tmp/python3 and launching it
    with supervisord-style arguments so the process reads as a legitimate interpreter or
    daemon, then makes the payload directories immutable with chattr +i.
  attacker_behavior:
    - Writes the payload to /tmp under a name beginning with a dot.
    - Runs it with a relay command of the form exec /tmp/.name or sh -c /tmp/.name.
    - Places another ELF in a directory called /tmp/python3 and starts it with
      daemon-style arguments.
    - Sets chattr +i on the payload directories.
  legitimate_behavior:
    - AppImage and Snap mount under /tmp/.mount_ and run from there.
    - Build tools and test runners execute temporary binaries from /tmp.
    - A few installers unpack into hidden temporary directories.
  risk_indicator:
    - A process image under a scratch directory has a dot-prefixed file or directory in its path.
    - A scratch directory is named after an interpreter or system daemon and holds the
      running image.
    - The parent is an application service such as a Python gateway worker.
    - chattr +i is applied to a path under a scratch directory.
    - The image hash is unknown to the estate.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        image_hash: SHA256HashData
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewExecutableWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: image-with-dot-prefixed-component-in-scratch-directory
        name: Process image with a hidden path component under a scratch directory
        purpose: >-
          Return processes whose image is under /tmp, /var/tmp or /dev/shm and has a
          file or directory name beginning with a dot somewhere in the path. AppImage
          and Snap mount points are excluded.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ImageFileName=/^\/(tmp|var\/tmp|dev\/shm)\/(.*\/)?\.[^\/]/
          | ImageFileName!=/^\/tmp\/\.(mount_|snap)/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: relay-command-naming-hidden-scratch-path
        name: Relay command naming a hidden file in a scratch directory
        purpose: >-
          Return shells and launchers whose command line executes a dot-prefixed path in
          a scratch directory, the exec /tmp/. and -c /tmp/. forms the source report
          matches. This sees a relay whose own image is /bin/sh while the payload is
          hidden.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/(\bexec|\s-c|\bnohup|\bsetsid|\bsh|\bbash)\s+[\"']?\/(tmp|var\/tmp|dev\/shm)\/\.[^\/\s]/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: image-in-directory-named-after-interpreter-or-daemon
        name: Process image inside a scratch directory named after an interpreter or daemon
        purpose: >-
          Return processes whose image sits directly in a scratch directory that carries
          the name of an interpreter or system daemon, such as /tmp/python3/, where the
          directory name is doing the work of a process name.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ImageFileName=/^\/(tmp|var\/tmp|dev\/shm)\/(python[0-9.]*|perl|bash|sh|node|java|php[0-9.]*|ruby|systemd[^\/]*|sshd|crond?|supervisord?|dbus[^\/]*|kworker[^\/]*)\/[^\/]+$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: immutable-flag-set-on-scratch-path
        name: chattr +i applied to a path under a scratch directory
        purpose: >-
          Return chattr runs that set the immutable flag on anything under /tmp,
          /var/tmp or /dev/shm. Nothing legitimate needs a temporary file to resist
          deletion.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^chattr$/
          | CommandLine=/\s(-[a-zA-Z]+\s+)*\+[a-zA-Z]*i[a-zA-Z]*\s/
          | CommandLine=/\/(tmp|var\/tmp|dev\/shm)(\/|\s|$)/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: hidden-executable-written-to-scratch-directory
        name: Executable written under a hidden name in a scratch directory
        purpose: >-
          Return executables written under a dot-prefixed file or directory in a scratch
          directory, with the writing process id, so a payload that is staged and not
          yet run is still seen.
        query: |
          #event_simpleName=NewExecutableWritten
          | event_platform=Lin
          | TargetFileName=/^\/(tmp|var\/tmp|dev\/shm)\/(.*\/)?\.[^\/]/
          | TargetFileName!=/^\/tmp\/\.(mount_|snap)/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: execution_from_concealed_scratch_path
      name: Execution from a concealed path in a scratch directory
      description: >-
        A process image under /tmp, /var/tmp or /dev/shm has a dot-prefixed path
        component or sits in a directory named after an interpreter or daemon.
      source: process_creation
      field: image_path
      indicates: hidden_payload_execution

  supporting:
    - id: relay_command
      name: Relay command executes the hidden path
      description: >-
        A shell or launcher command line executes a dot-prefixed path in a scratch
        directory.
      source: process_creation
      field: command_line
      indicates: relayed_execution
    - id: application_service_parent
      name: Parent is an application service
      description: >-
        The process descends from a Python, Node or Java service, such as an inference
        gateway worker, rather than from a build tool or a user's shell.
      source: process_creation
      field: parent_process
      indicates: post_exploitation_of_service
    - id: immutable_flag_set
      name: Immutable flag set on the payload path
      description: >-
        chattr +i was run against a path under a scratch directory on the same host.
      source: process_creation
      field: command_line
      indicates: cleanup_resistance
    - id: hidden_executable_written
      name: Hidden executable written before it ran
      description: >-
        An executable was written under a dot-prefixed name in a scratch directory
        before the process started.
      source: file_creation
      field: file_path
      indicates: payload_staged_on_host
    - id: hash_unknown_to_estate
      name: Image hash is rare
      description: >-
        The image hash appears on this host only. The agent derives this by comparing
        hashes across the returned events.
      source: process_creation
      field: image_hash
      indicates: non_standard_binary

  contradicting:
    - id: build_or_test_tooling
      name: Build, test or packaging tool
      description: >-
        The path and parent match a compiler, test runner or self-extracting installer
        that the host runs routinely.
      source: baseline
      field: ImageFileName
      indicates: routine_temporary_execution
    - id: developer_workstation
      name: Host is a developer or CI machine
      description: >-
        The host builds software and executes temporary binaries as part of that work.
      source: asset_inventory
      field: ComputerName
      indicates: expected_build_activity

  risk_logic:
    required:
      - execution_from_concealed_scratch_path

    supporting:
      any:
        - relay_command
        - application_service_parent
        - immutable_flag_set
        - hidden_executable_written
        - hash_unknown_to_estate
      all:
        - application_service_parent
        - immutable_flag_set

    contradicting:
      any:
        - build_or_test_tooling
        - developer_workstation
      all: []

  verdict:
    low_risk_when:
      - execution_from_concealed_scratch_path
      - build_or_test_tooling
      - developer_workstation
    suspicious_when:
      - execution_from_concealed_scratch_path
      - application_service_parent
    high_risk_when:
      - execution_from_concealed_scratch_path
      - application_service_parent
      - immutable_flag_set

  false_positive:
    - condition: Self-extracting installers and AppImages.
      explanation: >-
        Some unpack into hidden temporary directories and run from there. The mount
        prefixes are excluded; the rest are named for a product and started by a user or
        a package tool.
    - condition: Language toolchains.
      explanation: >-
        Go, Rust and test frameworks run binaries from /tmp, occasionally under dot
        directories. The parent is the toolchain and the host is a build machine.
