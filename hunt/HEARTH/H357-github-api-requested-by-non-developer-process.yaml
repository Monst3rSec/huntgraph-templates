# Converted from THORCollective/HEARTH Flames/H357.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH cites T1102.001, T1071.001 and T1573.001. The Issues search, the Contents
# API paths and the 401 that triggers the fallback are inside TLS and are not
# visible, so the dead-drop step cannot be told from routine tasking. What the
# sensor records is the process that resolves api.github.com, which is the
# tasking channel, and the template is filed under T1102.002.
type: detection

id: hg-win-hearth-h357-github-api-requested-by-non-developer-process-t1102-002
version: 1.0.0

info:
  name: GitHub API resolved by a process that is not a browser, Git client or developer tool
  description: >-
    ShelbyLoader V2 and the ShelbyC2 V2 RAT, described by Unit 42, take tasking from a
    GitHub repository through the Contents API with an embedded personal access token,
    reading and writing files under a directory named after a sixteen-character machine
    identifier every 63 seconds. If the token is revoked and the API answers 401, the
    loader searches GitHub Issues for today's date and decrypts a new owner, repository
    and token from an HTML comment. All of that is HTTPS to api.github.com, and neither
    the path nor the status code reaches the sensor. The process does: a .NET host or an
    unknown executable resolving api.github.com on a machine with no development role is
    not a Git client. The hunt returns those requests and any command line that carries
    a GitHub token or the API paths.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - command-and-control
    - web-service
    - github
    - dead-drop-resolver
    - shelbyloader
    - shelbyc2
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H357.md
    - https://attack.mitre.org/techniques/T1102
    - https://attack.mitre.org/techniques/T1102/002
    - https://attack.mitre.org/detectionstrategies/DET0035

mitre:
  tactics:
    - TA0011
  techniques:
    - T1102
  sub_techniques:
    - T1102.002
  detection_strategies:
    - DET0035
  analytics:
    - AN0100
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
    - etw:Microsoft-Windows-WinINet
  data_components:
    - Process Creation
    - Network Traffic Content

hypothesis:
  statement: >-
    An implant is using GitHub as its control channel in two layers: repository Contents
    API reads and writes under a per-machine directory for routine tasking, and, when
    that token is revoked and the API answers 401, a dead-drop resolver that searches
    GitHub Issues for text matching today's date and decrypts new C2 parameters out of
    an HTML comment, so takedown of the repository or revocation of the token does not
    sever control.
  attacker_behavior:
    - Embeds a GitHub personal access token in the loader.
    - Polls a file in a repository for tasking and uploads results to the same directory.
    - Beacons on a fixed interval and backs off for an hour when rate limited.
    - Falls back to an Issues search to recover a new repository and token.
  legitimate_behavior:
    - Git clients, the GitHub CLI, IDEs and package managers call api.github.com.
    - Browsers call it for signed-in GitHub sessions.
    - Updaters of many desktop applications check GitHub releases through it.
    - CI agents and automation scripts use it with a token.
  risk_indicator:
    - The requester is a .NET utility, a script host, a system binary or an executable in a user-writable path.
    - The host belongs to someone with no development role.
    - Requests from one process recur at a steady interval near a minute.
    - A command line carries a GitHub token or a contents or issue-search API path.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: github-api-requested-by-unexpected-process
        name: api.github.com resolved by a process that is not a browser or developer tool
        purpose: >-
          Return requests for api.github.com from anything other than browsers, Git and
          its helpers, the GitHub clients, common IDEs and language runtimes.
          Application updaters that check GitHub releases are returned and repeat across
          hosts under the product's name. The list of expected requesters should be
          extended for the estate before a long-window run.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/^api\.github\.com$/i
          | ContextBaseFileName!=/^(chrome|msedge|firefox|brave|opera|msedgewebview2|git|git-remote-https|git-lfs|git-credential-manager|gh|GitHubDesktop|Code|Code - Insiders|devenv|rider64|idea64|pycharm64|webstorm64|node|python|python3|dotnet|nuget|winget|WindowsPackageManagerServer|pwsh|powershell)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: github-api-requested-by-dotnet-utility-or-system-binary
        name: GitHub API or raw content host resolved by a .NET utility, script host or system binary
        purpose: >-
          Return requests for the API and raw content hosts from the processes an
          in-memory .NET loader runs in or as. PowerShell is included here although the
          first case leaves it out; administrators' scripts are returned with it.
        query: |
          #event_simpleName=DnsRequest
          | ContextBaseFileName=/^(InstallUtil|MSBuild|RegAsm|RegSvcs|AddInProcess|AddInProcess32|aspnet_compiler|csc|vbc|rundll32|regsvr32|dllhost|svchost|wscript|cscript|mshta|powershell|pwsh|RuntimeBroker|explorer)\.exe$/i
          | DomainName=/^(api\.github\.com|raw\.githubusercontent\.com|gist\.githubusercontent\.com)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: github-token-or-api-path-on-command-line
        name: Command line carrying a GitHub token or a contents or issue-search API path
        purpose: >-
          Return processes whose command line contains a personal access token or the
          two API paths the implant uses. The reported loader holds its token in the
          binary and passes none of this on a command line; this case finds scripted
          variants and operator testing.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/github_pat_[A-Za-z0-9_]{20,}|\bghp_[A-Za-z0-9]{30,}|api\.github\.com\/(search\/issues|repos\/[^\/\s"]+\/[^\/\s"]+\/contents)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: github_api_request
      name: GitHub API resolved on the host
      description: >-
        A DNS request names api.github.com or a GitHub raw content host.
      source: dns_request
      field: query_name
      indicates: web_service_channel_candidate

  supporting:
    - id: requester_not_developer_tool
      name: Requester is not a browser, Git client or developer tool
      description: >-
        The process that made the request is a .NET utility, a script host, a system
        binary or an executable the estate does not know as a developer tool.
      source: dns_request
      field: process_name
      indicates: implant_using_code_hosting_api
    - id: steady_request_interval
      name: Requests recur at a steady interval
      description: >-
        Requests from one process id repeat at a near-constant interval, about a minute
        in the reported case, which the agent derives from the times of the returned
        events. DNS caching hides some repetitions.
      source: dns_request
      field: process_id
      indicates: beacon_interval
    - id: non_developer_user
      name: User has no development role
      description: >-
        The account on the host belongs to someone who does not write or build software.
      source: process_creation
      field: user
      indicates: activity_outside_user_role
    - id: token_or_api_path_in_command
      name: Token or API path on a command line
      description: >-
        A command line on the host carries a GitHub token or a contents or issue search
        path.
      source: process_creation
      field: command_line
      indicates: scripted_api_use

  contradicting:
    - id: developer_or_ci_host
      name: Host is a developer workstation or CI agent
      description: >-
        The host is used for development or runs automation that calls the GitHub API.
      source: asset_inventory
      field: ComputerName
      indicates: expected_api_use
    - id: requester_common_in_estate
      name: Requester resolves the API on many hosts
      description: >-
        Earlier activity shows the same process name requesting api.github.com on most
        hosts, as an application updater does.
      source: baseline
      field: ContextBaseFileName
      indicates: established_requester

  risk_logic:
    required:
      - github_api_request

    supporting:
      any:
        - requester_not_developer_tool
        - steady_request_interval
        - non_developer_user
        - token_or_api_path_in_command
      all:
        - requester_not_developer_tool
        - non_developer_user

    contradicting:
      any:
        - developer_or_ci_host
        - requester_common_in_estate
      all: []

  verdict:
    low_risk_when:
      - github_api_request
      - developer_or_ci_host
      - requester_common_in_estate
    suspicious_when:
      - github_api_request
      - requester_not_developer_tool
    high_risk_when:
      - github_api_request
      - requester_not_developer_tool
      - steady_request_interval

  false_positive:
    - condition: Desktop applications check GitHub releases for updates.
      explanation: >-
        The requester is the application or its updater, the same on every host that has
        it, and it asks once or twice a day.
    - condition: Administrators' PowerShell scripts download tools from GitHub.
      explanation: >-
        The second case returns them. They run under an administrator or a service
        account and ask once per run.
    - condition: Developer tools not in the exclusion list.
      explanation: >-
        Editors, language servers and build tools call the API. The user is a developer
        and the tool is installed.
