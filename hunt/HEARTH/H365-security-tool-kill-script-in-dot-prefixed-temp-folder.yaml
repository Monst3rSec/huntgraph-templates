# Converted from THORCollective/HEARTH Flames/H365.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH cites T1685, T1564.001 and T1505.003. T1685 decomposes into
# sub-techniques and none covers stopping an endpoint agent; the hypothesis is
# about where the script is hidden, so the template is filed under T1564.001. The
# JSP web shells of the same intrusion are H191's subject. A sensor that the
# script succeeds in stopping reports nothing afterwards.
type: detection

id: hg-win-hearth-h365-security-tool-kill-script-in-dot-prefixed-temp-folder-t1564-001
version: 1.0.0

info:
  name: Security-tool kill script staged in a dot-prefixed folder under Windows Temp
  description: >-
    ShinyHunters, after exploiting PeopleSoft Environment Management (CVE-2026-35273),
    staged tooling on the application server in C:\Windows\Temp\.bea-cache, a folder
    named to look like BEA or WebLogic scratch space, holding cs_disable.cmd to turn off
    the CrowdStrike sensor. The same intrusion used a scheduled task named MeshFwFix and
    a modified MeshAgent at C:\Windows\Temp\ma.exe. A leading dot is a Unix habit; on
    Windows few programs create such folders under the system's temporary and shared
    directories, and tools that skip dot entries pass over them. The hunt returns
    scripts and executables written into dot-prefixed folders there, commands that run
    from them, commands aimed at the Falcon sensor's services and uninstaller, and the
    reported names.
  severity: critical
  author: huntgraph
  tags:
    - hearth
    - defense-evasion
    - hidden-directory
    - edr-tampering
    - crowdstrike
    - peoplesoft
    - weblogic
    - shinyhunters
    - cve-2026-35273
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H365.md
    - https://attack.mitre.org/techniques/T1564
    - https://attack.mitre.org/techniques/T1564/001
    - https://attack.mitre.org/detectionstrategies/DET0032

mitre:
  tactics:
    - TA0005
  techniques:
    - T1564
  sub_techniques:
    - T1564.001
  detection_strategies:
    - DET0032
  analytics:
    - AN0091
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - File Creation
    - Process Creation

hypothesis:
  statement: >-
    An operator who has reached a PeopleSoft application server is staging their tooling
    inside a hidden, dot-prefixed directory whose name imitates the middleware's own
    scratch space, C:\Windows\Temp\.bea-cache\, holding cs_disable.cmd to turn off
    CrowdStrike, so the staging directory reads as a BEA/WebLogic cache artefact to
    anyone reviewing the host, is skipped by directory listings that ignore dot-prefixed
    entries, and sits in a path that is routinely excluded from scanning.
  attacker_behavior:
    - Creates a dot-prefixed folder under Windows\Temp named after middleware cache.
    - Writes a batch script there that stops or removes the endpoint sensor.
    - Runs the script from the application server's service account.
    - Stages a remote-access agent and a scheduled task beside it.
  legitimate_behavior:
    - The .NET runtime extracts single-file applications under a .net folder in Temp.
    - Ported Unix tools create dot folders in a user's profile, seldom in system directories.
    - Administrators stop or uninstall the sensor during supported maintenance, with a token.
  risk_indicator:
    - A script or executable is written into a dot-prefixed folder under Windows\Temp, ProgramData, Public or PerfLogs.
    - The writer is a Java, web or application server process or a shell under one.
    - A command names the Falcon sensor's services with stop, delete, disable or unload.
    - The folder name imitates a product's cache and the product does not create it.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: script-written-into-dot-prefixed-system-folder
        name: Script written into a dot-prefixed folder under a system temporary or shared directory
        purpose: >-
          Return scripts written into a folder whose name starts with a dot directly
          under Windows\Temp, ProgramData, Users\Public or PerfLogs, with the writing
          process. The .NET extraction folder is left out.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/\\(Windows\\Temp|ProgramData|Users\\Public|PerfLogs)\\\.[^\\]+\\/i
          | TargetFileName!=/\\\.net\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: executable-written-into-dot-prefixed-system-folder
        name: Executable written into a dot-prefixed folder under a system temporary or shared directory
        purpose: >-
          Return PE files written into the same kind of folder.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\(Windows\\Temp|ProgramData|Users\\Public|PerfLogs)\\\.[^\\]+\\/i
          | TargetFileName!=/\\\.net\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-running-from-dot-prefixed-system-folder
        name: Command line naming a file in a dot-prefixed system folder
        purpose: >-
          Return processes whose command line names a script, executable or DLL inside
          such a folder: the batch file being run, or a tool started from there.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\\(Windows\\Temp|ProgramData|Users\\Public|PerfLogs)\\\.[^\\"\s]+\\[^\\"\s]+\.(cmd|bat|ps1|vbs|js|exe|dll)\b/i
          | CommandLine!=/\\\.net\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-against-falcon-sensor-service
        name: Service, driver or registry command aimed at the Falcon sensor
        purpose: >-
          Return sc, net, taskkill, reg, fltmc, PowerShell, cmd and wmic commands that
          name the sensor's services or driver together with a stopping or removing
          verb. These are the lines a disable script runs. Tamper protection refuses
          most of them; the attempt is still recorded. If one succeeds the host goes
          quiet, and the last events before the silence are these.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(sc|net|net1|taskkill|reg|fltmc|powershell|pwsh|cmd|wmic)\.exe$/i
          | CommandLine=/\b(csagent|csfalconservice|csfalconcontainer|csdevicecontrol|csboot)\b|CrowdStrike/i
          | CommandLine=/\b(stop|delete|unload|disabled|uninstall|Stop-Service|Remove-Item|Set-Service)\b|\s\/f\b|start=\s*(disabled|4)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: falcon-uninstaller-started
        name: Falcon uninstall tool or installer run with an uninstall switch
        purpose: >-
          Return the sensor's uninstall tool and its installer run with an uninstall
          argument, with the parent, so an uninstall outside maintenance is seen.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(CsUninstallTool|WindowsSensor.*|FalconSensor_Windows.*)\.exe$/i
          | CommandLine=/uninstall|CsUninstallTool/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reported-artifact-names
        name: Command line naming the reported script, agent or task
        purpose: >-
          Return command lines that name cs_disable.cmd, the .bea-cache folder, the
          MeshAgent copy at Windows\Temp\ma.exe or the MeshFwFix task. These are
          indicators from one intrusion and are kept for retrospective scoping.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/cs_disable\.cmd|\\\.bea-cache\\|\\Windows\\Temp\\ma\.exe|MeshFwFix/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: tooling_in_dot_prefixed_folder
      name: Script or executable staged in a dot-prefixed system folder
      description: >-
        A script or PE is written into, or a command runs a file from, a folder whose
        name starts with a dot under Windows\Temp, ProgramData, Users\Public or
        PerfLogs.
      source: file_creation
      field: file_path
      indicates: hidden_staging_directory

  supporting:
    - id: writer_is_application_server
      name: Writer is an application or web server process
      description: >-
        The file was written by java.exe, a web server worker, or a shell started by
        one.
      source: file_creation
      field: writer_process_name
      indicates: post_exploitation_staging
    - id: sensor_tamper_command
      name: Command aimed at the endpoint sensor
      description: >-
        A command names the Falcon sensor's services, driver or uninstaller with a
        stopping or removing verb.
      source: process_creation
      field: command_line
      indicates: security_tool_tampering
    - id: script_run_from_staging_folder
      name: Script run from the dot-prefixed folder
      description: >-
        cmd.exe or PowerShell runs a script whose path is inside the folder.
      source: process_creation
      field: command_line
      indicates: staged_tool_execution
    - id: tamper_parent_is_server_or_script
      name: Tamper command's parent is a script or server process
      description: >-
        The parent of the sensor command is cmd.exe running a batch file, or an
        application server process.
      source: process_creation
      field: parent_process
      indicates: scripted_defense_impairment
    - id: folder_imitates_product_cache
      name: Folder name imitates a product's cache
      description: >-
        The folder is named after middleware or a vendor cache and the product on the
        host does not create it.
      source: file_creation
      field: file_path
      indicates: masqueraded_directory_name

  contradicting:
    - id: sensor_maintenance_window
      name: Sensor maintenance under a change record
      description: >-
        The security team was uninstalling or reinstalling the sensor on the host under
        a recorded change, with a maintenance token.
      source: identity_context
      field: UserName
      indicates: authorised_maintenance
    - id: product_creates_dot_folder
      name: Installed product creates the folder
      description: >-
        An approved product on the host is documented to create the dot-prefixed folder
        and the same folder is on every host with it.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software

  risk_logic:
    required:
      - tooling_in_dot_prefixed_folder

    supporting:
      any:
        - writer_is_application_server
        - sensor_tamper_command
        - script_run_from_staging_folder
        - tamper_parent_is_server_or_script
        - folder_imitates_product_cache
      all:
        - sensor_tamper_command
        - writer_is_application_server

    contradicting:
      any:
        - sensor_maintenance_window
        - product_creates_dot_folder
      all: []

  verdict:
    low_risk_when:
      - tooling_in_dot_prefixed_folder
      - sensor_maintenance_window
      - product_creates_dot_folder
    suspicious_when:
      - tooling_in_dot_prefixed_folder
      - writer_is_application_server
    high_risk_when:
      - tooling_in_dot_prefixed_folder
      - writer_is_application_server
      - sensor_tamper_command

  false_positive:
    - condition: Cross-platform tools create dot folders under ProgramData.
      explanation: >-
        Some agents and developer tools ported from Unix do. The folder repeats on every
        host with the tool and its files are the tool's.
    - condition: The security team removes the sensor from a host being retired.
      explanation: >-
        The uninstall tool runs under an administrator with a change record, and no
        script sits in a dot-prefixed folder.
