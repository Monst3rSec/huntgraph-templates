# Converted from THORCollective/HEARTH Flames/H025.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h025-fake-driver-install-python-rat-t1204-002
version: 1.0.0

info:
  name: Python RAT installed through a fake interview driver-install command
  description: >-
    PylangGhost is a Python remote access trojan delivered by fake job-interview sites
    aimed at people with cryptocurrency and blockchain experience. The site claims the
    camera or microphone needs a driver and gives the candidate a command to copy and
    run. That command downloads an archive, unpacks it into the user's profile and starts
    a script that launches a bundled Python interpreter on the trojan. The hunt follows
    that chain on the endpoint: the download-and-unpack one-liner, a script host starting
    Python, and a Python interpreter running from a directory where no Python
    installation lives.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - execution
    - user-execution
    - python
    - remote-access-trojan
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H025.md
    - https://attack.mitre.org/techniques/T1204
    - https://attack.mitre.org/techniques/T1204/002
    - https://attack.mitre.org/techniques/T1059
    - https://attack.mitre.org/techniques/T1059/006
    - https://attack.mitre.org/detectionstrategies/DET0294
    - https://attack.mitre.org/detectionstrategies/DET0063
    - https://blog.talosintelligence.com/python-version-of-golangghost-rat/

mitre:
  tactics:
    - TA0002
  techniques:
    - T1204
    - T1059
  sub_techniques:
    - T1204.002
    - T1059.006
  detection_strategies:
    - DET0294
    - DET0063
  analytics:
    - AN0819
    - AN0172
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    Threat actors are using a Python-based remote access trojan called PylangGhost to
    target Windows systems of employees with cryptocurrency and blockchain experience,
    tricking them through fake job interview sites into copying, pasting and executing a
    command that claims to install required video drivers.
  attacker_behavior:
    - Gives the candidate a one-line command that downloads a zip with curl or Invoke-WebRequest.
    - Unpacks the archive into the user's profile or Temp with Expand-Archive or tar.
    - Starts a Visual Basic script with wscript that launches the bundled Python interpreter.
    - Runs a renamed or portable Python from a user-writable directory on a script named after a driver.
    - Sets a Run key so the script starts at every logon.
  legitimate_behavior:
    - Developers install portable Python distributions and virtual environments under their profile.
    - Software bundles its own Python runtime under AppData.
    - Real driver and conferencing installers download and unpack archives.
  risk_indicator:
    - One command line downloads an archive, unpacks it and starts a script.
    - A script host is the parent of a Python interpreter.
    - Python runs from Temp, Downloads, Public or an unfamiliar AppData folder.
    - The script or archive name refers to camera, video or audio drivers.
    - The user is in a recruiting pipeline or works with cryptocurrency systems.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: download-unpack-run-one-liner
        name: One command that downloads an archive, unpacks it and starts a script
        purpose: >-
          Return the pasted command itself: a fetch, an extraction and a script-host or
          interpreter launch on one command line.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(cmd|powershell|pwsh)\.exe$/i
          | CommandLine=/\b(curl|Invoke-WebRequest|iwr|wget|Start-BitsTransfer)\b/i
          | CommandLine=/Expand-Archive|\btar\s+-?x|\.zip\b/i
          | CommandLine=/\b(wscript|cscript|python\w*|pythonw)\b|\.vbs\b|\.py\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: script-host-spawned-python
        name: Python interpreter started by a script host
        purpose: >-
          Return Python processes whose parent is wscript or cscript, the launcher
          arrangement the trojan uses and ordinary Python work does not.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(wscript|cscript|mshta)\.exe$/i
          | FileName=/^python\d*w?\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: python-from-delivery-directory
        name: Python interpreter running from a delivery or temporary directory
        purpose: >-
          Return Python interpreters whose own image sits in Temp, Downloads, Public or
          directly under Roaming, where an unpacked bundle lands and an installed
          distribution does not.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^python\d*w?\.exe$/i
          | ImageFileName=/\\(AppData\\Local\\Temp|Downloads|Users\\Public|Windows\\Temp|AppData\\Roaming\\[^\\]+)\\([^\\]+\\)?python\d*w?\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: driver-themed-script-written
        name: Script named after a camera or audio driver written to a user profile
        purpose: >-
          Return script files with driver-themed names created under user profiles, the
          lure's cover story left on disk.
        query: |
          #event_simpleName=NewScriptWritten
          | event_platform=Win
          | TargetFileName=/\\Users\\/i
          | TargetFileName=/(nvidia|camera|webcam|driver|microphone|audio|realtek)[^\\]*\.(py|pyw|vbs|bat|cmd|ps1)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: delivered_python_execution
      name: Python run from a delivered bundle
      description: >-
        A process event shows a download-unpack-run command, a script host starting
        Python, or a Python interpreter whose image path is in a delivery or temporary
        directory.
      source: process_creation
      field: command_line
      indicates: delivered_script_interpreter_execution

  supporting:
    - id: script_host_parent
      name: Python parented by a script host
      description: >-
        The parent of the Python process is wscript, cscript or mshta, not a terminal,
        an editor or a packaged application.
      source: process_creation
      field: parent_process
      indicates: staged_execution_chain
    - id: interpreter_in_writable_path
      name: Interpreter image in a writable delivery path
      description: >-
        The Python image path is under Temp, Downloads, Public or an unfamiliar Roaming
        folder.
      source: process_creation
      field: image_path
      indicates: portable_interpreter_bundle
    - id: driver_lure_script
      name: Driver-themed script on disk
      description: >-
        A script whose name refers to camera, video or audio drivers was written under a
        user profile.
      source: file_creation
      field: file_path
      indicates: social_engineering_artifact
    - id: targeted_user_population
      name: User matches the targeted population
      description: >-
        The account belongs to someone in cryptocurrency, blockchain or engineering
        roles, or someone known to be interviewing.
      source: process_creation
      field: user
      indicates: targeted_victim_profile

  contradicting:
    - id: developer_python_environment
      name: Host is a developer machine with portable Python
      description: >-
        Asset records class the host as a developer workstation and the interpreter path
        belongs to a known virtual environment or tool bundle.
      source: asset_inventory
      field: ComputerName
      indicates: expected_development_activity
    - id: bundled_runtime_known
      name: Interpreter belongs to installed software
      description: >-
        Earlier activity shows the same interpreter path and hash started by the same
        application on many hosts.
      source: baseline
      field: ImageFileName
      indicates: established_software_behaviour

  risk_logic:
    required:
      - delivered_python_execution

    supporting:
      any:
        - script_host_parent
        - interpreter_in_writable_path
        - driver_lure_script
        - targeted_user_population
      all:
        - script_host_parent
        - interpreter_in_writable_path

    contradicting:
      any:
        - developer_python_environment
        - bundled_runtime_known
      all: []

  verdict:
    low_risk_when:
      - delivered_python_execution
      - developer_python_environment
      - bundled_runtime_known
    suspicious_when:
      - delivered_python_execution
      - interpreter_in_writable_path
    high_risk_when:
      - delivered_python_execution
      - interpreter_in_writable_path
      - script_host_parent
      - driver_lure_script

  false_positive:
    - condition: Developers use portable Python and virtual environments.
      explanation: >-
        Interpreters under a profile are normal for developers. They sit in recognisable
        environment folders, are started from terminals or editors, and never from a
        script host.
    - condition: Applications bundle a Python runtime.
      explanation: >-
        Some desktop software ships Python under AppData. The path, hash and parent are
        the same on every host with the product.
    - condition: A real installer downloads and unpacks an archive.
      explanation: >-
        Vendor setup scripts chain a download and an extraction. The source is the
        vendor's domain and what runs next is a signed installer, not a script host
        starting Python.
