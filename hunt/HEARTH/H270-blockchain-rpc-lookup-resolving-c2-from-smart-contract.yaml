# Converted from THORCollective/HEARTH Flames/H270.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# Also holds H333 (counterfeit npm package polling an Ethereum Sepolia RPC endpoint at
# application run time). The Sepolia hosts were added to both host lists for it.
type: detection

id: hg-any-hearth-h270-blockchain-rpc-lookup-resolving-c2-from-smart-contract-t1102-001
version: 1.1.0

info:
  name: Public blockchain RPC endpoint queried to resolve a C2 address
  description: >-
    An implant that keeps its C2 address in a smart contract cannot have that address
    taken down: the operator rewrites the contract's storage for a few cents and every
    implant reads the new value on its next poll. The read is an HTTP POST carrying a
    JSON-RPC eth_call, or getAccountInfo on Solana, to a public RPC endpoint such as
    polygon-rpc.com or eth.llamarpc.com. The method and the contract address sit in the
    request body, which this telemetry does not carry. The name lookup does, with the
    process that made it. In most estates no server and few workstations ever resolve a
    blockchain RPC host, so the hunt returns those lookups, a narrower set from
    processes that are neither browsers nor developer tooling, and command lines that
    carry the JSON-RPC method by name. Rotation across several providers by one process
    and a fixed polling interval are for the agent to derive from the returned events.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - command-and-control
    - dead-drop-resolver
    - blockchain
    - json-rpc
    - etherhiding
    - cross-platform
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H270.md
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H333.md
    - https://attack.mitre.org/techniques/T1102
    - https://attack.mitre.org/techniques/T1102/001
    - https://attack.mitre.org/detectionstrategies/DET0058

mitre:
  tactics:
    - TA0011
  techniques:
    - T1102
  sub_techniques:
    - T1102.001
  detection_strategies:
    - DET0058
  analytics:
    - AN0158
    - AN0159
    - AN0160
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - WinEventLog:Sysmon
    - auditd:SYSCALL
    - macos:osquery
  data_components:
    - Network Connection Creation

hypothesis:
  statement: >-
    An implant that stores its C2 address on a public blockchain reads it by issuing an
    HTTP POST with a read-only JSON-RPC call, eth_call on EVM chains or getAccountInfo
    on Solana, to a public RPC endpoint, from a process that is not a browser and not a
    developer's Web3 tooling.
  attacker_behavior:
    - Resolves a public RPC host such as polygon-rpc.com, eth.llamarpc.com or
      ethereum-rpc.publicnode.com.
    - Sends eth_call against one contract with one method selector on an interval.
    - Shuffles through a hardcoded list of RPC providers for resilience.
    - Connects to a newly learned address straight after the short RPC response.
  legitimate_behavior:
    - Developers run Hardhat, Foundry, ethers.js and web3.py projects that call RPC endpoints.
    - Browser wallet extensions such as MetaMask query them from the browser process.
    - Treasury, payments and blockchain-analytics functions and their servers do so by design.
    - Security tooling resolves on-chain indicators during enrichment.
  risk_indicator:
    - The host is a server or a workstation with no blockchain function.
    - The requesting process is not a browser, a wallet or a development tool.
    - One process resolves several different RPC providers in a short period.
    - Lookups repeat at a fixed interval.
    - A first-ever destination is contacted by the same process straight afterwards.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: lookup-of-public-blockchain-rpc-host
        name: DNS request for a public blockchain RPC host
        purpose: >-
          Return every lookup of a public RPC provider, with the requesting process. The
          list covers the providers the hypothesis names and the commonly used
          alternatives; it is not exhaustive, and an implant that uses a provider
          outside it, a hardcoded address or DNS over HTTPS is not returned. The agent
          counts distinct providers per process and the spacing of lookups.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)(polygon-rpc\.com|llamarpc\.com|publicnode\.com|rpc\.ankr\.com|cloudflare-eth\.com|infura\.io|sepolia\.org|sepolia\.dev|g\.alchemy\.com|quiknode\.pro|1rpc\.io|drpc\.org|blastapi\.io|blockpi\.network|nodereal\.io|getblock\.io|nownodes\.io|chainstack\.com|omniatech\.io|onfinality\.io|rpc\.flashbots\.net|rpc\.mevblocker\.io|bsc-dataseed[0-9]*\.[a-z]+\.[a-z]+|arb1\.arbitrum\.io|mainnet\.optimism\.io|mainnet\.base\.org|api\.avax\.network|api\.trongrid\.io|mainnet\.solana\.com|mainnet-beta\.solana\.com|helius-rpc\.com|rpcpool\.com)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: rpc-lookup-by-process-outside-browser-and-web3-tooling
        name: RPC host resolved by a process that is not a browser or Web3 tool
        purpose: >-
          The same lookups with browsers, wallets and the usual development runtimes
          removed, which is the population the hypothesis is about. A browser result is
          not automatically clean, since injected page script uses the same route, but
          it is left to the first case.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)(polygon-rpc\.com|llamarpc\.com|publicnode\.com|rpc\.ankr\.com|cloudflare-eth\.com|infura\.io|sepolia\.org|sepolia\.dev|g\.alchemy\.com|quiknode\.pro|1rpc\.io|drpc\.org|blastapi\.io|blockpi\.network|nodereal\.io|getblock\.io|nownodes\.io|chainstack\.com|omniatech\.io|onfinality\.io|rpc\.flashbots\.net|rpc\.mevblocker\.io|bsc-dataseed[0-9]*\.[a-z]+\.[a-z]+|arb1\.arbitrum\.io|mainnet\.optimism\.io|mainnet\.base\.org|api\.avax\.network|api\.trongrid\.io|mainnet\.solana\.com|mainnet-beta\.solana\.com|helius-rpc\.com|rpcpool\.com)$/i
          | ContextBaseFileName!=/^(chrome|msedge|firefox|brave|opera|vivaldi|safari|arc|msedgewebview2|node|npm|npx|yarn|pnpm|bun|deno|python[0-9.]*|cargo|forge|cast|anvil|hardhat|geth|solana|ledger live|exodus|code|cursor)(\.exe)?$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: json-rpc-read-method-on-command-line
        name: Command line carrying a read-only JSON-RPC method
        purpose: >-
          Return fetch tools and interpreters whose command line names eth_call,
          eth_getTransactionByHash or getAccountInfo, the script-driven form of the
          resolver. A compiled implant builds the request in memory and shows nothing
          here.
        query: |
          #event_simpleName=ProcessRollup2
          | FileName=/^(curl|wget|powershell|pwsh|cmd|python[0-9.]*|node|bash|sh|zsh|dash)(\.exe)?$/i
          | CommandLine=/\beth_call\b|eth_getTransactionByHash|eth_getStorageAt|getAccountInfo|getSignaturesForAddress/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: blockchain_rpc_lookup
      name: Lookup of a public blockchain RPC host
      description: >-
        A process on the host resolved the name of a public blockchain RPC provider.
      source: dns_request
      field: query_name
      indicates: blockchain_state_read

  supporting:
    - id: requester_outside_browser_and_tooling
      name: Requesting process is not a browser or Web3 tool
      description: >-
        The process that made the lookup is not a browser, a wallet or a development
        runtime.
      source: dns_request
      field: process_name
      indicates: unexpected_rpc_client
    - id: provider_rotation
      name: One process resolves several RPC providers
      description: >-
        The same process id resolves several different RPC providers within minutes, the
        failover pattern of a hardcoded list. The agent derives this from the returned
        events.
      source: dns_request
      field: process_id
      indicates: hardcoded_endpoint_failover
    - id: host_without_blockchain_role
      name: Host has no blockchain function
      description: >-
        The host is a server or a workstation in a role with no reason to read chain
        state.
      source: asset_inventory
      field: ComputerName
      indicates: no_business_reason
    - id: rpc_method_in_command
      name: JSON-RPC read method on a command line
      description: >-
        A fetch tool or interpreter on the host was started with eth_call,
        eth_getTransactionByHash or getAccountInfo in its arguments.
      source: process_creation
      field: command_line
      indicates: scripted_dead_drop_read

  contradicting:
    - id: web3_development_host
      name: Host is used for Web3 development or treasury work
      description: >-
        The host belongs to an engineering, treasury or blockchain-analytics function
        where RPC calls are routine.
      source: asset_inventory
      field: ComputerName
      indicates: expected_blockchain_tooling
    - id: known_wallet_or_tool
      name: Process is a known wallet or development tool
      description: >-
        The requesting process is an installed wallet application or a development tool
        the user is known to run.
      source: baseline
      field: DomainName
      indicates: routine_web3_traffic

  risk_logic:
    required:
      - blockchain_rpc_lookup

    supporting:
      any:
        - requester_outside_browser_and_tooling
        - provider_rotation
        - host_without_blockchain_role
        - rpc_method_in_command
      all:
        - requester_outside_browser_and_tooling
        - host_without_blockchain_role

    contradicting:
      any:
        - web3_development_host
        - known_wallet_or_tool
      all: []

  verdict:
    low_risk_when:
      - blockchain_rpc_lookup
      - web3_development_host
      - known_wallet_or_tool
    suspicious_when:
      - blockchain_rpc_lookup
      - requester_outside_browser_and_tooling
    high_risk_when:
      - blockchain_rpc_lookup
      - requester_outside_browser_and_tooling
      - host_without_blockchain_role
      - provider_rotation

  false_positive:
    - condition: Web3 development and wallets.
      explanation: >-
        Hardhat, Foundry, ethers.js projects and browser wallets produce exactly these
        lookups. The traffic is varied and bursty, and the host belongs to someone who
        does that work.
    - condition: Package tests in CI.
      explanation: >-
        Web3 dependencies call RPC endpoints during test runs. The requester is a
        language runtime under a build account on a build host.
    - condition: Security enrichment.
      explanation: >-
        Tools that resolve on-chain indicators run from analyst workstations and
        platform servers that can be named.
