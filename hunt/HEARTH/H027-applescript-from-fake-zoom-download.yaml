# Converted from THORCollective/HEARTH Flames/H027.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-mac-hearth-h027-applescript-from-fake-zoom-download-t1566-002
version: 1.0.0

info:
  name: Downloaded AppleScript from a fake Zoom link run on macOS
  description: >-
    In the BlueNoroff campaign against cryptocurrency organisations, a target on a staged
    video call is sent a link on a look-alike Zoom domain to a so-called extension or
    support script. The file is an AppleScript, padded with more than ten thousand blank
    lines so the payload at the bottom is not seen when it opens, and running it fetches
    the next stage with curl. The link, the domain and the file's size are not things the
    sensor reports. It does report the script being run from a download location, script
    interpreters fetching remote content, and DNS requests for domains that imitate Zoom.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - initial-access
    - execution
    - applescript
    - bluenoroff
    - macos
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H027.md
    - https://attack.mitre.org/techniques/T1566
    - https://attack.mitre.org/techniques/T1566/002
    - https://attack.mitre.org/techniques/T1059
    - https://attack.mitre.org/techniques/T1059/002
    - https://attack.mitre.org/detectionstrategies/DET0107
    - https://attack.mitre.org/detectionstrategies/DET0414
    - https://www.huntress.com/blog/inside-bluenoroff-web3-intrusion-analysis

mitre:
  tactics:
    - TA0001
    - TA0002
  techniques:
    - T1566
    - T1059
  sub_techniques:
    - T1566.002
    - T1059.002
  detection_strategies:
    - DET0107
    - DET0414
  analytics:
    - AN0300
    - AN1164
  platforms:
    - macOS
  data_sources:
    - macos:unifiedlog
  data_components:
    - Process Creation
    - Network Traffic Content

hypothesis:
  statement: >-
    BlueNoroff threat actors are delivering malicious AppleScript files through fake Zoom
    domains, using oversized files with more than 10,000 blank lines to mask the payload,
    to gain initial access into cryptocurrency organizations.
  attacker_behavior:
    - Sends a link on a Zoom look-alike domain to a file presented as a Zoom extension or SDK fix.
    - Pads the AppleScript with thousands of blank lines so the commands are off-screen in Script Editor.
    - Has the script call curl through do shell script to fetch and run the next stage.
    - Runs the script with osascript or through Script Editor from the Downloads folder.
    - Follows with a request for the user's password to install further components.
  legitimate_behavior:
    - Users and administrators run their own AppleScripts for automation.
    - Management tooling calls osascript for prompts and notifications.
    - The real Zoom client is installed from zoom.us and updates itself.
  risk_indicator:
    - A script file in Downloads, Desktop or a temporary directory is run with osascript.
    - osascript or Script Editor is the parent of curl, a shell or a newly written binary.
    - The script or its parent path carries Zoom, meeting or SDK wording.
    - The host resolves a domain that contains zoom but is not owned by Zoom.
    - The user works at a cryptocurrency or Web3 organisation.

requires:
  platforms:
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: downloaded-applescript-executed
        name: AppleScript file run from a download or temporary location
        purpose: >-
          Return osascript runs of a script file that sits where a browser or chat client
          saves downloads. The image name is an exact match and runs first.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=osascript
          | CommandLine=/\.(scpt|scptd|applescript)\b/i
          | CommandLine=/\/(Downloads|Desktop|Documents)\/|\/(private\/)?(tmp|var\/folders)\/|\/Users\/Shared\//
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: applescript-host-spawned-fetch
        name: curl or a shell started by osascript or Script Editor
        purpose: >-
          Return the script's next step: a download tool or shell whose parent is an
          AppleScript host, with the URL on the command line.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | ParentBaseFileName=/^(osascript|Script Editor|applet|osacompile)$/
          | FileName=/^(curl|wget|sh|bash|zsh|python3?|nscurl)$/
          | CommandLine=/https?:\/\/|\|\s*(ba|z)?sh\b|base64|chmod\s+\+x/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: zoom-themed-script-executed
        name: Script with Zoom or meeting wording run by an AppleScript host
        purpose: >-
          Return AppleScript runs whose file name carries the lure's theme, wherever the
          file was saved.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Mac
          | FileName=/^(osascript|Script Editor)$/
          | CommandLine=/(zoom|meeting|sdk|webinar|teams|support)[^\/]*\.(scpt|scptd|applescript)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: zoom-lookalike-domain-request
        name: DNS request for a domain imitating Zoom
        purpose: >-
          Return requests for names that contain zoom but do not end in a domain Zoom
          owns, the host-side trace of the link being followed.
        query: |
          #event_simpleName=DnsRequest
          | event_platform=Mac
          | DomainName=/zoom/i
          | DomainName!=/(^|\.)(zoom\.us|zoom\.com|zoomgov\.com|zoom\.com\.cn|zoomcdn\.com|zdassets\.com|zoominfo\.com)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: delivered_applescript_run
      name: Delivered AppleScript executed
      description: >-
        A process event shows osascript or Script Editor running a script file from a
        download or temporary location, or starting a download tool or shell.
      source: process_creation
      field: command_line
      indicates: delivered_script_execution

  supporting:
    - id: script_host_child_fetch
      name: AppleScript host started a download or shell
      description: >-
        The parent of a curl, shell or interpreter process is osascript or Script
        Editor, showing the script reached out for more code.
      source: process_creation
      field: parent_process
      indicates: staged_payload_retrieval
    - id: lookalike_zoom_domain
      name: Host resolved a Zoom look-alike domain
      description: >-
        A DNS request names a domain that contains zoom and is not one Zoom operates.
      source: dns_request
      field: query_name
      indicates: lure_infrastructure_contacted
    - id: targeted_macos_user
      name: User matches the targeted population
      description: >-
        The account belongs to someone in a cryptocurrency, Web3 or finance engineering
        role.
      source: process_creation
      field: user
      indicates: targeted_victim_profile

  contradicting:
    - id: known_automation_script
      name: Script is the user's or the estate's own automation
      description: >-
        Earlier activity shows the same script path run on this host repeatedly over a
        long period.
      source: baseline
      field: CommandLine
      indicates: established_user_automation
    - id: managed_osascript_usage
      name: osascript is driven by management tooling
      description: >-
        The host's management agent is recorded as using osascript for prompts, and the
        parent chain leads to that agent.
      source: asset_inventory
      field: ComputerName
      indicates: managed_tooling_activity

  risk_logic:
    required:
      - delivered_applescript_run

    supporting:
      any:
        - script_host_child_fetch
        - lookalike_zoom_domain
        - targeted_macos_user
      all:
        - script_host_child_fetch
        - lookalike_zoom_domain

    contradicting:
      any:
        - known_automation_script
        - managed_osascript_usage
      all: []

  verdict:
    low_risk_when:
      - delivered_applescript_run
      - known_automation_script
      - managed_osascript_usage
    suspicious_when:
      - delivered_applescript_run
      - script_host_child_fetch
    high_risk_when:
      - delivered_applescript_run
      - script_host_child_fetch
      - lookalike_zoom_domain

  false_positive:
    - condition: Users run their own AppleScripts.
      explanation: >-
        Personal automation lives in Documents and Desktop too. It recurs on the same
        host over months and does not start curl against an unfamiliar domain.
    - condition: Management agents call osascript.
      explanation: >-
        Device-management tools use osascript for dialogs and can shell out. The parent
        chain is the agent and the commands repeat fleet-wide.
    - condition: A legitimate product has zoom in its domain.
      explanation: >-
        Unrelated companies and Zoom integrations use the word. A DNS hit matters on a
        host that also ran a downloaded script; alone it is a lead, not a finding.
