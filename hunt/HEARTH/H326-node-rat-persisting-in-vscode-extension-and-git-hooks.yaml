# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h326-node-rat-persisting-in-vscode-extension-and-git-hooks-t1176-002
version: 1.0.0

info:
  name: Node.js RAT persisting through a fake Copilot VS Code extension and git hooks
  description: >-
    Mirage Kitten's Node.js RATs stay on Windows developer workstations by living inside
    the developer's tools. A VS Code extension called GitHub Copilot Helper activates on
    every editor start; code marked # shepherd-persist; is added to
    .git/hooks/post-merge and post-checkout so a git pull or checkout runs the implant
    again; and trojanized colorized_terminal and pretty-log packages are placed straight
    into node_modules without ever being published. The extension manifest, the hook's
    contents and the package contents are not visible to the sensor. An extension runs
    inside the editor's own extension host and starts no process of its own, and files
    copied into node_modules look like any install. What is visible is node.exe, or the
    renamed nodew.exe, being started by git or its shell, a Copilot-named extension
    folder that GitHub did not publish, hook scripts being written, and node running the
    reported scripts from vendor-named folders in the profile. H034 hunts what an IDE
    extension starts and where the editor connects; this template is the persistence
    placement.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - ide-extensions
    - vscode
    - git-hooks
    - nodejs
    - mirage-kitten
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H326.md
    - https://attack.mitre.org/techniques/T1176
    - https://attack.mitre.org/techniques/T1176/002
    - https://attack.mitre.org/detectionstrategies/DET0561

mitre:
  tactics:
    - TA0003
  techniques:
    - T1176
  sub_techniques:
    - T1176.002
  detection_strategies:
    - DET0561
  analytics:
    - AN1548
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    A Node.js RAT persists on Windows developer workstations inside the developer's own
    toolchain: a VS Code extension named GitHub Copilot Helper that activates on
    start-up, code injected into .git/hooks/post-merge and post-checkout, and trojanized
    packages placed in node_modules, with node.exe or nodew.exe running under Code.exe,
    git.exe or sh.exe.
  attacker_behavior:
    - Installs an extension folder named after GitHub Copilot under .vscode\extensions.
    - Appends implant start-up code to post-merge and post-checkout hooks in local repositories.
    - Bundles unpublished colorized_terminal and pretty-log packages into a project's node_modules.
    - Runs the implant with a copy of node named nodew.exe.
    - Keeps scripts under AppData\Roaming\Microsoft and AppData\Local\Intel named after updaters.
  legitimate_behavior:
    - Husky, lefthook and pre-commit run node from git hooks in most JavaScript projects.
    - VS Code installs and updates extensions, writing scripts under .vscode\extensions.
    - GitHub's own Copilot extensions are installed on developer machines.
    - Extensions start node for language servers and formatters.
  risk_indicator:
    - A hook starts node against a script outside the repository.
    - An extension folder carries copilot in its name and its publisher prefix is not github.
    - A process named nodew.exe runs, a name Node.js does not ship.
    - node runs a .js file from AppData\Roaming\Microsoft or AppData\Local\Intel.
    - post-merge or post-checkout is written in a repository that has no hook manager.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: node-started-by-git-or-git-shell
        name: node started by git or the shell git uses for hooks
        purpose: >-
          Return node.exe and nodew.exe processes whose parent is git.exe or Git's
          sh.exe or bash.exe, which is how a hook's command runs. Hook managers produce
          the same lineage in volume on developer machines; the agent keeps the events
          whose script path is outside the repository or names a profile folder. A hook
          that starts the implant through another launcher appears under that launcher
          and is not returned.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(node|nodew)\.exe$/i
          | ParentBaseFileName=/^(git|sh|bash)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: process-named-nodew
        name: Process named nodew.exe
        purpose: >-
          Return every process named nodew.exe. Node.js distributes no binary of that
          name, so it is a renamed copy wherever it runs and whatever starts it.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^nodew\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-running-script-from-vendor-named-profile-folder
        name: node running a .js file from AppData\Roaming\Microsoft or AppData\Local\Intel
        purpose: >-
          Return node processes whose command line names a JavaScript file under the two
          profile folders the reported scripts use. Neither Microsoft nor Intel ships
          Node scripts there.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(node|nodew)\.exe$/i
          | CommandLine=/\\AppData\\(Roaming\\Microsoft|Local\\Intel)\\[^"]*\.(js|mjs|cjs)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: copilot-named-extension-folder-not-published-by-github
        name: Script written into a Copilot-named VS Code extension folder that is not GitHub's
        purpose: >-
          Return scripts written under .vscode\extensions into a folder whose name
          contains copilot and does not begin github., the prefix of the genuine
          extensions. All extension installs write scripts, so the folder name is what
          keeps this case small. An implant extension under an unrelated name is not
          returned.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/\\\.vscode\\extensions\\[^\\]*copilot[^\\]*\\/i
          | TargetFileName!=/\\\.vscode\\extensions\\github\./i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: git-hook-script-written
        name: post-merge, post-checkout or another client hook written under .git\hooks
        purpose: >-
          Return hook files created under any .git\hooks folder, leaving out the .sample
          files git init writes. This depends on the sensor classifying an extensionless
          hook as a script; where it does not, the case returns nothing and the first
          case is the only view of the hooks. An append to an existing hook is a
          modification and is not reported.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/\\\.git\\hooks\\(post-merge|post-checkout|post-commit|post-rewrite|pre-commit|pre-push|prepare-commit-msg)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: node_started_from_developer_tooling
      name: node runs as a side effect of a developer tool
      description: >-
        node.exe or nodew.exe is started by git, its hook shell or the editor, or runs a
        script from a vendor-named profile folder.
      source: process_creation
      field: parent_process
      indicates: toolchain_resident_execution

  supporting:
    - id: script_outside_repository
      name: Script path is outside the repository
      description: >-
        The command line of the hook-started node names a file under AppData or another
        path outside the working repository.
      source: process_creation
      field: command_line
      indicates: foreign_code_in_hook
    - id: renamed_node_binary
      name: Interpreter is named nodew.exe
      description: >-
        The image name is nodew.exe.
      source: process_creation
      field: image_name
      indicates: renamed_interpreter
    - id: fake_copilot_extension_folder
      name: Copilot-named extension not published by GitHub
      description: >-
        A script was written into an extension folder that uses the Copilot name without
        the github publisher prefix.
      source: file_creation
      field: file_path
      indicates: impersonated_extension
    - id: hook_file_written
      name: Client-side git hook written
      description: >-
        A post-merge, post-checkout or similar hook file was created under .git\hooks.
      source: file_creation
      field: file_path
      indicates: hook_persistence
    - id: hook_writer_is_node
      name: Hook or extension written by node
      description: >-
        The writing process id belongs to node.exe or nodew.exe and not to git or the
        editor. The agent resolves it against the process events.
      source: file_creation
      field: writer_process_id
      indicates: implant_managed_persistence

  contradicting:
    - id: hook_manager_in_repository
      name: Repository uses a hook manager
      description: >-
        The project uses husky, lefthook or pre-commit and the hook runs its usual
        command.
      source: baseline
      field: CommandLine
      indicates: routine_hook_execution
    - id: approved_extension
      name: Extension is on the approved list
      description: >-
        The extension folder matches an extension the organisation has approved.
      source: asset_inventory
      field: TargetFileName
      indicates: sanctioned_extension

  risk_logic:
    required:
      - node_started_from_developer_tooling

    supporting:
      any:
        - script_outside_repository
        - renamed_node_binary
        - fake_copilot_extension_folder
        - hook_file_written
        - hook_writer_is_node
      all:
        - script_outside_repository
        - hook_file_written

    contradicting:
      any:
        - hook_manager_in_repository
        - approved_extension
      all: []

  verdict:
    low_risk_when:
      - node_started_from_developer_tooling
      - hook_manager_in_repository
      - approved_extension
    suspicious_when:
      - node_started_from_developer_tooling
      - script_outside_repository
    high_risk_when:
      - node_started_from_developer_tooling
      - script_outside_repository
      - hook_writer_is_node

  false_positive:
    - condition: Hook managers such as husky and lefthook.
      explanation: >-
        husky, lint-staged and lefthook start node from sh.exe on every commit and
        merge. The script is inside the repository's node_modules and the project lists
        the manager in package.json.
    - condition: Third-party extensions with Copilot in the name.
      explanation: >-
        The marketplace has many. The publisher is known and the extension was installed
        by the editor, not written by node.
    - condition: Developers writing their own hooks.
      explanation: >-
        A hand-written hook is created from an editor or a shell in a repository the
        user owns.
