type: detection

id: hg-win-hearth-h171-seo-poisoned-installer-screenconnect-cryptojacking-chain-t1053-005
version: 1.0.0

info:
  name: SEO-poisoned installer leading to ScreenConnect and a miner under a Windows System Health task
  description: >-
    A campaign Microsoft documented in May 2026 serves trojanised copies of hardware and
    codec utilities through poisoned search results. The archive holds a signed launcher
    and an autorun.dll that side-loads when the launcher runs, installs a package
    silently with msiexec, sets up ScreenConnect against directdownload.icu on port
    8041, plants RuntimeHost.exe under a Caches\D3F4E2A1 folder, registers scheduled
    tasks named Windows System Health, and hollows a GPU miner into InstallUtil, RegAsm,
    MSBuild and similar .NET utilities. The side-load is a Module Load event and the
    hollowing is process injection; this deployment collects neither and neither is
    claimed. The hunt reads the parts around them: the DLL as it is written, the silent
    install, the cache folder, the task names, the Run value, the ScreenConnect
    destination and .NET utilities that hold outbound connections.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - scheduled-task
    - screenconnect
    - cryptojacking
    - seo-poisoning
    - remote-access
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H171.md
    - https://attack.mitre.org/techniques/T1053
    - https://attack.mitre.org/techniques/T1219
    - https://attack.mitre.org/techniques/T1053/005
    - https://attack.mitre.org/techniques/T1219/002
    - https://attack.mitre.org/detectionstrategies/DET0441
    - https://attack.mitre.org/detectionstrategies/DET0259

