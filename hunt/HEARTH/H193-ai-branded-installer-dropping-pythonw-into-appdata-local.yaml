# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h193-ai-branded-installer-dropping-pythonw-into-appdata-local-t1204-002
version: 1.0.0

info:
  name: AI-branded fake installer dropping pythonw.exe into AppData\Local and running a Python downloader
  description: >-
    Microsoft reported installers named after AI products (ProFluxeFlowAi, a deepseek-v4
    build and others) that a user downloads and runs. The installer writes pythonw.exe
    and a LICENSE.txt directly into %AppData%\Local and starts the interpreter there,
    which runs a Python downloader and calls a stealer's server. Python installed
    properly sits under Local\Programs\Python or the Store's WindowsApps folder, never
    at the top of AppData\Local. The sensor reports the interpreter being written and
    run, the installer starting from Downloads and the domains requested. It does not
    report LICENSE.txt, which is a text file, and whether the installer's signing
    certificate was revoked is not on the event.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - execution
    - user-execution
    - malicious-file
    - fake-installer
    - ai-lure
    - python
    - infostealer
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H193.md
    - https://attack.mitre.org/techniques/T1204/002
    - https://attack.mitre.org/detectionstrategies/DET0294
    - https://www.microsoft.com/en-us/security/blog/2026/06/08/ai-brands-as-bait-how-threat-actors-are-using-the-ai-hype-in-social-engineering/

mitre:
  tactics:
    - TA0002
  techniques:
    - T1204
  sub_techniques:
    - T1204.002
  detection_strategies:
    - DET0294
  analytics:
    - AN0819
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    Adversaries lure users into running AI-branded fake installers (*AI*Setup.exe,
    deepseek-v4*.exe, *Flux*Ai*.exe) that drop a renamed pythonw.exe + LICENSE.txt into
    %AppData%\Local and execute a Python downloader beaconing to a stealer C2.
  attacker_behavior:
    - Publishes an installer named after an AI product and promotes it through ads and social posts.
    - The installer writes pythonw.exe and LICENSE.txt into the top of AppData\Local.
    - Starts that pythonw.exe with no arguments or with a script beside it.
    - The interpreter downloads a stealer and calls its server.
  legitimate_behavior:
    - The Python installer places pythonw.exe under Local\Programs\Python.
    - The Microsoft Store places an alias under Local\Microsoft\WindowsApps.
    - Applications bundle a private Python inside their own folder under AppData\Local.
    - Users download real installers for AI desktop clients.
  risk_indicator:
    - pythonw.exe runs from AppData\Local itself and not from a subfolder.
    - Its parent is an installer started from Downloads minutes earlier.
    - The installer's file name carries an AI brand and the word setup or install.
    - The interpreter requests a domain no other host requests.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: pythonw-running-from-top-of-appdata-local
        name: pythonw.exe running directly from AppData\Local
        purpose: >-
          Return pythonw.exe whose image is in AppData\Local itself, with its parent.
          The path is anchored at the end so the Python installer's own location and the
          Store alias do not match. An interpreter renamed to something else is not
          matched by name and shows only in the file-write case if it keeps the name on
          disk.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^pythonw?\.exe$/i
          | ImageFileName=/\\AppData\\Local\\pythonw?\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: pythonw-written-to-top-of-appdata-local
        name: pythonw.exe written directly into AppData\Local
        purpose: >-
          Return the interpreter as it is written, with the writing process, which is
          the installer. LICENSE.txt written beside it is a text file and is not
          reported.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\AppData\\Local\\pythonw?\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ai-branded-installer-started-from-downloads
        name: Installer with an AI brand in its name started from Downloads or Desktop
        purpose: >-
          Return executables started from a Downloads or Desktop folder whose name
          carries setup or install and an AI product name or the letters AI as a word
          part. The brand list is a starting point and the AI test is case-sensitive to
          keep words such as Mail and Paint out. Real AI desktop clients match; the
          agent keeps the ones that go on to start pythonw.exe.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ImageFileName=/\\(Downloads|Desktop)\\[^\\]+\.exe$/i
          | FileName=/setup|install/i
          | FileName=/[Dd]eep[Ss]eek|[Cc]hat[Gg][Pp][Tt]|[Oo]pen[Aa][Ii]|[Gg]emini|[Ff]lux|[Ss]ora|[Mm]idjourney|[Kk]ling|[Gg]rok|(^|[^A-Z])A[Ii]([^a-z]|$)/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: reported-stealer-domain-resolved
        name: DNS request for a reported stealer domain
        purpose: >-
          Return requests for the three domains Microsoft reported, with the requester.
          These are point-in-time indicators and the hashes HEARTH lists rotate, so the
          other cases are the hunt.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)(brokeapt\.com|ssffaa19\.xyz|rongtv\.xyz)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: pythonw_in_appdata_local_root
      name: pythonw.exe ran from the top of AppData\Local
      description: >-
        The image path of a Python interpreter is AppData\Local itself, where no Python
        installer places it.
      source: process_creation
      field: image_path
      indicates: interpreter_dropped_by_installer

  supporting:
    - id: parent_is_downloaded_installer
      name: Parent is an installer
      description: >-
        The parent of the interpreter is a setup executable and not a Python launcher or
        an IDE.
      source: process_creation
      field: parent_process
      indicates: installer_started_interpreter
    - id: interpreter_written_by_installer
      name: Interpreter written by another process
      description: >-
        pythonw.exe was written into AppData\Local by a process that is not a Python
        installer.
      source: file_creation
      field: writer_process_name
      indicates: payload_dropped
    - id: interpreter_written_to_local_root
      name: Interpreter file placed at the top of AppData\Local
      description: >-
        The written path is AppData\Local\pythonw.exe.
      source: file_creation
      field: file_path
      indicates: payload_dropped
    - id: interpreter_requested_rare_domain
      name: Interpreter requested an unfamiliar domain
      description: >-
        pythonw.exe requested a reported domain, or one no other host in the estate
        requests. The agent derives rarity from the returned events.
      source: dns_request
      field: query_name
      indicates: stealer_command_and_control

  contradicting:
    - id: packaged_application_runtime
      name: Interpreter belongs to a deployed application
      description: >-
        Software inventory shows a sanctioned application that installs its Python
        runtime at this path.
      source: asset_inventory
      field: ComputerName
      indicates: sanctioned_software

  risk_logic:
    required:
      - pythonw_in_appdata_local_root

    supporting:
      any:
        - parent_is_downloaded_installer
        - interpreter_written_by_installer
        - interpreter_written_to_local_root
        - interpreter_requested_rare_domain
      all:
        - parent_is_downloaded_installer
        - interpreter_written_by_installer

    contradicting:
      any:
        - packaged_application_runtime
      all: []

  verdict:
    low_risk_when:
      - pythonw_in_appdata_local_root
      - packaged_application_runtime
    suspicious_when:
      - pythonw_in_appdata_local_root
      - parent_is_downloaded_installer
    high_risk_when:
      - pythonw_in_appdata_local_root
      - parent_is_downloaded_installer
      - interpreter_written_by_installer
      - interpreter_requested_rare_domain

  false_positive:
    - condition: A portable tool unpacks Python into AppData\Local.
      explanation: >-
        It is rare, the tool is known to the user, and the interpreter runs a script
        from the same tool.
    - condition: Users install real AI desktop clients from Downloads.
      explanation: >-
        They do not write or start pythonw.exe at the top of AppData\Local.
