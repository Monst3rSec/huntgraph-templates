# Converted from THORCollective/HEARTH Flames/H067.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# Also holds H081 (typosquatted npm packages that inject an MCP server into AI coding
# assistants and harvest SSH keys, cloud credentials and LLM API keys; SANDWORM_MODE).
# The package there need not have mcp in its name, so it is the third case that covers
# it; the LLM key names and AI client configuration files were added for it.
type: detection

id: hg-any-hearth-h067-untrusted-mcp-server-package-execution-t1195-002
version: 1.1.0

info:
  name: Typosquatted or trojanised MCP server package run on a developer host
  description: >-
    Model Context Protocol servers give an AI agent tools, and they are distributed
    through npm and PyPI like any other package. A typosquatted or trojanised one runs
    with the developer's rights the moment an AI client starts it, and can also rewrite
    its tool descriptions to steer the agent. Registry-side registration and the content
    of tool descriptions are not endpoint telemetry. The endpoint does show which MCP
    packages are fetched and run, usually by a package runner such as npx or uvx that
    downloads on demand, and what the resulting process does next. The hunt returns those
    launches for comparison with an approved inventory, and the shell and transfer
    commands a package process starts.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - initial-access
    - supply-chain
    - mcp
    - typosquatting
    - ai-agent
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H067.md
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H081.md
    - https://attack.mitre.org/techniques/T1195
    - https://attack.mitre.org/techniques/T1195/002
    - https://attack.mitre.org/detectionstrategies/DET0309
    - https://semgrep.dev/blog/2025/so-the-first-malicious-mcp-server-has-been-found-on-npm-what-does-this-mean-for-mcp-security/
    - https://www.docker.com/blog/mcp-horror-stories-the-supply-chain-attack/

mitre:
  tactics:
    - TA0001
  techniques:
    - T1195
  sub_techniques:
    - T1195.002
  detection_strategies:
    - DET0309
  analytics:
    - AN0862
    - AN0863
    - AN0864
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - WinEventLog:Sysmon
    - auditd:SYSCALL
    - macos:endpointsecurity
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary is registering typosquatted or trojanised MCP server packages in public
    registries and package managers, targeting developers and AI agents that consume MCP
    tooling, to achieve code execution or data exfiltration through tool poisoning.
  attacker_behavior:
    - Publishes a package whose name is one character from a popular MCP server.
    - Relies on an AI client configuration that runs the server with npx -y or uvx, fetching whatever the name resolves to.
    - Runs a post-install or start-up routine that reads tokens, SSH keys and environment files.
    - Sends the harvest out with curl or an HTTP call from the package's process.
    - Changes tool descriptions between sessions to inject instructions into the agent.
    - Ships an ordinary-looking typosquatted package that adds a rogue MCP server to the AI coding assistant's configuration and collects LLM provider API keys.
  legitimate_behavior:
    - Developers run official and internal MCP servers through package runners every day.
    - AI clients start the same configured servers at each launch.
    - MCP servers legitimately run shell commands and make network calls as their tools require.
  risk_indicator:
    - The package name is not on the approved inventory or differs slightly from one that is.
    - The package is fetched on demand with an auto-confirm flag and no pinned version.
    - The server process starts a shell, a transfer tool or reads credential stores.
    - The same unfamiliar package appears on several developer hosts within days.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: mcp-package-run-through-runner
        name: MCP server package fetched and run by a package runner
        purpose: >-
          Return package-runner invocations that name an MCP package, with the package
          name and any version on the command line for comparison with the approved
          inventory.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/\b(npx|pnpx|bunx|uvx|pipx)(\.cmd|\.exe)?"?\s+(-\S+\s+)*\S*mcp\S*|\b(pnpm|yarn)\s+dlx\s+\S*mcp\S*|\buv\s+(tool\s+)?run\s+(-\S+\s+)*\S*mcp\S*/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: mcp-package-installed
        name: MCP server package installed from a public registry
        purpose: >-
          Return explicit installs of packages with mcp in the name, the other way a
          server arrives on a host.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/\b(npm|pnpm|yarn|bun)(\.cmd|\.exe)?"?\s+(install|i|add)\s+(-\S+\s+)*\S*mcp\S*|\b(pip3?|uv\s+pip|pipx)\s+install\s+(-\S+\s+)*\S*mcp\S*/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: package-runtime-spawned-credential-or-transfer-command
        name: Node or Python runtime starting a command that reads secrets or sends data
        purpose: >-
          Return children of package runtimes whose command line names credential
          stores or pipes data to a transfer tool, the behaviour a trojanised server
          shows whatever it is called.
        query: |
          #event_simpleName=ProcessRollup2
          | ParentBaseFileName=/^(node|npx|bun|deno|python[0-9.]*|uv|uvx)(\.exe)?$/i
          | CommandLine=/\.ssh[\\\/]|id_(rsa|ed25519)|\.aws[\\\/]credentials|\.npmrc|\.env\b|\.config[\\\/]gcloud|\.kube[\\\/]config|Login Data|keychain|claude[\\\/_.]|\.cursor[\\\/]|\.codeium[\\\/]|\.continue[\\\/]|mcp\.json|mcp_config\.json|(ANTHROPIC|OPENAI|GEMINI|GOOGLE|MISTRAL|COHERE|GROQ|TOGETHER|FIREWORKS|REPLICATE|OPENROUTER)_API_KEY/i
          | CommandLine=/\b(curl|wget|nc|ncat|scp|Invoke-WebRequest|Invoke-RestMethod|iwr|irm|cat|type|tar|zip|base64)\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: mcp_package_launch
      name: MCP server package fetched or run
      description: >-
        A command line fetches, installs or runs a package with mcp in its name through
        a package manager or runner.
      source: process_creation
      field: command_line
      indicates: third_party_agent_tooling_executed

  supporting:
    - id: package_not_in_inventory
      name: Package is not on the approved inventory
      description: >-
        The package name is absent from the organisation's approved MCP server list, or
        differs from an approved name by a small edit.
      source: asset_inventory
      field: CommandLine
      indicates: unvetted_or_typosquatted_package
    - id: runtime_child_touching_secrets
      name: Package runtime started a command that reads secrets or sends data
      description: >-
        A child of node, Python or a package runner names credential files or agent
        configuration together with a transfer or archive tool.
      source: process_creation
      field: command_line
      indicates: credential_collection_by_package
    - id: ai_client_parent
      name: Server started by an AI client
      description: >-
        The parent of the runner is an AI desktop client, an IDE or an agent process,
        which starts whatever its configuration names.
      source: process_creation
      field: parent_process
      indicates: automatic_execution_through_agent_configuration
    - id: runner_cache_image
      name: Server runs from a package cache
      description: >-
        The image or script path is under a runner's download cache, showing the package
        was fetched on demand and not installed from an internal mirror.
      source: process_creation
      field: image_path
      indicates: on_demand_public_fetch

  contradicting:
    - id: approved_mcp_server
      name: Package is an approved MCP server
      description: >-
        The exact package name and publisher are on the approved inventory for the
        user's team.
      source: asset_inventory
      field: ComputerName
      indicates: approved_developer_tooling
    - id: package_long_in_use
      name: Same package has run across the team for a long period
      description: >-
        Earlier activity shows the identical package name launched on many developer
        hosts over months.
      source: baseline
      field: CommandLine
      indicates: established_development_workflow

  risk_logic:
    required:
      - mcp_package_launch

    supporting:
      any:
        - package_not_in_inventory
        - runtime_child_touching_secrets
        - ai_client_parent
        - runner_cache_image
      all:
        - package_not_in_inventory
        - runtime_child_touching_secrets

    contradicting:
      any:
        - approved_mcp_server
        - package_long_in_use
      all: []

  verdict:
    low_risk_when:
      - mcp_package_launch
      - approved_mcp_server
      - package_long_in_use
    suspicious_when:
      - mcp_package_launch
      - package_not_in_inventory
    high_risk_when:
      - mcp_package_launch
      - package_not_in_inventory
      - runtime_child_touching_secrets

  false_positive:
    - condition: Developers run official and internal MCP servers.
      explanation: >-
        Nearly every hit is this. The value of the first two cases is the list of
        package names in use, which the agent compares with the approved inventory.
    - condition: An MCP server's tools legitimately run commands and read files.
      explanation: >-
        A filesystem or shell server starts cat, tar and curl because the agent asked it
        to. The files are in the project, not credential stores, and the server is an
        approved one.
    - condition: Build scripts read .env and .npmrc.
      explanation: >-
        Node and Python build tooling touches these files constantly. The third case
        needs a transfer or archive tool as well, and still returns some of it.
