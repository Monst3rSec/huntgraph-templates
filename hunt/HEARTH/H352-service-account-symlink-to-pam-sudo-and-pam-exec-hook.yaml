# Converted from THORCollective/HEARTH Flames/H352.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH also cites T1548.003 and T1222.002. Its primary anchors, an ownership
# change and a non-root write inside /etc/pam.d, are file modification and
# metadata events the sensor does not report; the hunt reads the commands that
# set the chain up. Steps done by system call inside a program are not seen.
type: detection

id: hg-lin-hearth-h352-service-account-symlink-to-pam-sudo-and-pam-exec-hook-t1556-003
version: 1.0.0

info:
  name: Service account linking a log file to /etc/pam.d/sudo and adding a pam_exec hook
  description: >-
    After command injection on Zimbra (CVE-2026-73570) gave an operator the zimbra
    service account, they reached root with no exploit. zmmailboxdmgr is a
    sudo-authorised helper that writes its log as root; the operator replaced that log,
    zmmailboxd.out, with a symbolic link to /etc/pam.d/sudo, ran the helper so the PAM
    file became owned by zimbra, added a pam_exec session line pointing at a script, and
    triggered a sudo session through a second helper, zmstat-fd. The hook ran as root
    and wrote a NOPASSWD: ALL sudoers entry; the PAM file was then restored. The
    ownership change and the file writes are not reported by the sensor. The commands
    are: a symbolic link whose target is a PAM or sudoers file, a command line that
    names pam_exec, and shell or file utilities that write into /etc/pam.d or
    /etc/sudoers.d.
  severity: critical
  author: huntgraph
  tags:
    - hearth
    - privilege-escalation
    - pam
    - pam-exec
    - sudoers
    - symlink
    - zimbra
    - cve-2026-73570
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H352.md
    - https://attack.mitre.org/techniques/T1556
    - https://attack.mitre.org/techniques/T1556/003
    - https://attack.mitre.org/detectionstrategies/DET0454

mitre:
  tactics:
    - TA0112
    - TA0003
    - TA0006
  techniques:
    - T1556
  sub_techniques:
    - T1556.003
  detection_strategies:
    - DET0454
  analytics:
    - AN1250
  platforms:
    - Linux
  data_sources:
    - auditd:SYSCALL
  data_components:
    - Process Creation
    - File Modification

hypothesis:
  statement: >-
    An operator holding only the unprivileged zimbra service account reaches root
    without an exploit and without touching a setuid binary: they replace a log file
    that a sudo-authorized helper writes as root with a symlink to /etc/pam.d/sudo, let
    the helper chown the PAM configuration to the service account, add a pam_exec
    session line pointing at a local script, trigger a sudo session through a second
    legitimate helper so the hook runs as root and writes a NOPASSWD: ALL sudoers entry,
    then restore the original PAM file and keep only the sudoers entry.
  attacker_behavior:
    - Backs up /etc/pam.d/sudo and deletes the helper's log file.
    - Creates a symbolic link from the log file's path to /etc/pam.d/sudo.
    - Runs the sudo-authorised helper so the PAM file changes owner.
    - Appends a pam_exec session line that runs a local script.
    - Triggers a sudo session, then restores the PAM file and removes the staging files.
  legitimate_behavior:
    - Root, package managers and configuration management edit /etc/pam.d.
    - A few products add pam_exec lines at install time, for logging or home-directory setup.
    - Zimbra's control scripts run zmmailboxdmgr and zmstat-fd through sudo all day.
  risk_indicator:
    - ln -s names a file under /etc/pam.d or /etc/sudoers as its target.
    - A command line outside a package installation names pam_exec.
    - A shell or utility run by a service account writes into /etc/pam.d or /etc/sudoers.d.
    - The user is zimbra, postfix, www-data or another account with no interactive role.
    - The parent chain leads to a mail or web service process.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: symlink-targeting-pam-or-sudoers
        name: Symbolic link created to a PAM or sudoers file
        purpose: >-
          Return ln commands with the symbolic flag and a path under /etc/pam.d,
          /etc/sudoers or /etc/security. A link made with the symlink system call from
          inside a script interpreter or a compiled tool starts no ln process and is not
          seen.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^ln$/
          | CommandLine=/\s-[a-zA-Z]*s|--symbolic/
          | CommandLine=/\/etc\/(pam\.d|sudoers|security)\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-line-naming-pam-exec
        name: Command line naming pam_exec
        purpose: >-
          Return any process whose command line contains pam_exec: an echo, sed or tee
          that adds the line, an editor opened on it, or a grep for it. This is an
          unanchored match over every Linux process start.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/pam_exec/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: utility-writing-or-changing-ownership-in-pam-directory
        name: File utility acting on a file in /etc/pam.d
        purpose: >-
          Return chown, chmod, cp, mv, tee, sed, install, dd and truncate commands that
          name a path under /etc/pam.d. The backup of the sudo file and its restoration
          are returned here. The ownership change the helper itself makes is a system
          call and is not.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(chown|chgrp|chmod|cp|mv|tee|sed|install|dd|truncate)$/
          | CommandLine=/\/etc\/pam\.d\//
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: shell-redirecting-into-pam-or-sudoers
        name: Shell command redirecting into /etc/pam.d or /etc/sudoers.d
        purpose: >-
          Return shells whose -c command redirects output into a PAM or sudoers file or
          contains a NOPASSWD grant. A redirect typed into an already-open interactive
          shell is not on any command line.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(sh|bash|dash|zsh|ksh)$/
          | CommandLine=/>\s*\/etc\/(pam\.d|sudoers\.d)\/|>\s*\/etc\/sudoers\b|NOPASSWD\s*:/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: zimbra-privileged-helper-run-through-sudo
        name: sudo running the Zimbra mailbox manager or statistics helper
        purpose: >-
          Return sudo invocations of zmmailboxdmgr and zmstat-fd, the two helpers the
          chain uses. They run routinely on a Zimbra server; the agent keeps the ones
          that fall between a symbolic link and a pam_exec command on the same host.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^sudo$/
          | CommandLine=/zmmailboxdmgr|zmstat-fd/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: pam_or_sudoers_tampering_command
      name: Command that links to or writes a PAM or sudoers file
      description: >-
        A process creates a symbolic link to a PAM or sudoers file, names pam_exec on
        its command line, or writes into /etc/pam.d or /etc/sudoers.d.
      source: process_creation
      field: command_line
      indicates: authentication_stack_modification

  supporting:
    - id: service_account_actor
      name: Command ran as a service account
      description: >-
        The user on the event is zimbra, postfix, www-data, nginx, apache, mysql or
        another account with no interactive role.
      source: process_creation
      field: user
      indicates: non_root_actor_on_authentication_files
    - id: link_then_helper_then_hook
      name: Link, helper run and hook follow each other
      description: >-
        A symbolic link to the PAM file, a sudo run of a privileged helper and a
        pam_exec command occur on one host within minutes, by the agent's ordering of
        the returned events.
      source: process_creation
      field: process_id
      indicates: privileged_file_write_chain
    - id: service_process_ancestry
      name: Parent chain leads to a mail or web service
      description: >-
        The parent of the command is a shell started by a mail, monitoring or web
        service process.
      source: process_creation
      field: parent_process
      indicates: post_exploitation_of_service
    - id: nopasswd_grant_written
      name: NOPASSWD grant written
      description: >-
        A shell command writes a NOPASSWD rule or redirects into /etc/sudoers.d.
      source: process_creation
      field: command_line
      indicates: passwordless_root_persistence

  contradicting:
    - id: package_or_config_management
      name: Change made by a package manager or configuration management
      description: >-
        The parent chain is dpkg, rpm, apt, yum, dnf, Ansible, Puppet, Chef or Salt and
        the change matches a known package or playbook.
      source: process_creation
      field: parent_process
      indicates: managed_configuration_change
    - id: change_window_administration
      name: Administrator change in a recorded window
      description: >-
        A named administrator made the change as root under a change record.
      source: identity_context
      field: UserName
      indicates: authorised_administration

  risk_logic:
    required:
      - pam_or_sudoers_tampering_command

    supporting:
      any:
        - service_account_actor
        - link_then_helper_then_hook
        - service_process_ancestry
        - nopasswd_grant_written
      all:
        - service_account_actor
        - link_then_helper_then_hook

    contradicting:
      any:
        - package_or_config_management
        - change_window_administration
      all: []

  verdict:
    low_risk_when:
      - pam_or_sudoers_tampering_command
      - package_or_config_management
      - change_window_administration
    suspicious_when:
      - pam_or_sudoers_tampering_command
      - service_account_actor
    high_risk_when:
      - pam_or_sudoers_tampering_command
      - service_account_actor
      - link_then_helper_then_hook

  false_positive:
    - condition: A package installs a pam_exec line.
      explanation: >-
        The command runs under the package manager's maintainer script as root, on every
        host that takes the package.
    - condition: Configuration management rewrites PAM files.
      explanation: >-
        The parent is the management agent, the user is root and the same change lands
        across the estate.
    - condition: An administrator searches for pam_exec.
      explanation: >-
        A grep for the string is returned by the second case. It writes nothing and the
        user is an administrator.
