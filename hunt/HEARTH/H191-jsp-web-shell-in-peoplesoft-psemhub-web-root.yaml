# Converted from THORCollective/HEARTH Flames/H191.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-lin-hearth-h191-jsp-web-shell-in-peoplesoft-psemhub-web-root-t1505-003
version: 1.0.0

info:
  name: JSP web shell written into the PeopleSoft PSEMHUB web root and used to run commands
  description: >-
    After exploiting CVE-2026-35273 (H190), ShinyHunters kept access to PeopleSoft web
    servers by writing JSP web shells into the PSEMHUB.war application directory and by
    planting XML under envmetadata/data/environment that XMLDecoder runs when the
    application restarts. Oracle ships PSEMHUB.war as static content, so a new JSP there
    is not a deployment. The sensor reports a script file being written and the
    processes the WebLogic Java process starts; it does not report an XML data file
    being written, and it does not see the HTTP requests that drive the shell. The hunt
    reads the JSP write where the sensor classes it as a script, the commands that touch
    the web root, and the discovery commands Java starts once the shell is used.
  severity: critical
  author: huntgraph
  tags:
    - hearth
    - persistence
    - web-shell
    - jsp
    - peoplesoft
    - psemhub
    - weblogic
    - shinyhunters
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H191.md
    - https://attack.mitre.org/techniques/T1505/003
    - https://attack.mitre.org/detectionstrategies/DET0394
    - https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit/

mitre:
  tactics:
    - TA0003
  techniques:
    - T1505
  sub_techniques:
    - T1505.003
  detection_strategies:
    - DET0394
  analytics:
    - AN1109
  platforms:
    - Linux
  data_sources:
    - auditd:SYSCALL
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An adversary has written a JSP web shell (or XMLDecoder-abusing XML) into the
    PeopleSoft PSEMHUB.war web root to persist RCE on the public-facing PIA/WebLogic
    server.
  attacker_behavior:
    - Writes a .jsp file under applications/peoplesoft/PSEMHUB.war on the web server.
    - Stages files under PSEMHUB.war/envmetadata/transactions and in folders named logs, persistantstorage or scratchpad.
    - Plants XML under envmetadata/data/environment that runs when the application restarts.
    - Sends requests to the JSP, which runs id, whoami, uname or a shell as the WebLogic account.
  legitimate_behavior:
    - A PeopleTools patch or upgrade replaces the contents of PSEMHUB.war.
    - The Environment Management hub writes its own data files under envmetadata.
    - Administrators list and back up the web root from a shell.
  risk_indicator:
    - A JSP appears under PSEMHUB.war outside a PeopleTools change.
    - The file is written by the Java process itself and not by a deployment tool.
    - java on the PeopleSoft web host is the parent of id, whoami, uname or ifconfig.
    - A command copies or decodes a file into the web root.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: jsp-written-under-psemhub-web-root
        name: JSP file written under the PSEMHUB application directory
        purpose: >-
          Return .jsp and .jspx files created under a PSEMHUB directory, with the
          writing process id. This depends on the Linux sensor classing JSP as a script;
          where it does not, the case returns nothing and the process cases are what
          remain. XML planted under envmetadata/data/environment is a data file and is
          not reported at all.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/\/PSEMHUB(\.war)?\//
          | TargetFileName=/\.jspx?$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-writing-into-psemhub-web-root
        name: Shell or file utility naming the PSEMHUB web root or its staging folders
        purpose: >-
          Return file utilities, shells and interpreters whose command line names
          PSEMHUB.war or the envmetadata staging and data folders. This is how the JSP
          or the XML shows up when the operator places it from a shell. A file written
          by the Java process through the exploit itself starts no process and is not
          seen here.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | FileName=/^(sh|bash|dash|ksh|cp|mv|tee|touch|chmod|chown|install|curl|wget|base64|unzip|jar|tar|sed|python[0-9.]*|perl)$/
          | CommandLine=/PSEMHUB(\.war)?\/|envmetadata\/(transactions|data\/environment)/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: java-started-discovery-utility
        name: Java process starting a discovery utility directly
        purpose: >-
          Return id, whoami, uname, ifconfig and hostname when their parent is java. A
          JSP shell that passes its command straight to Runtime.exec produces exactly
          this, with no shell in between. The parent name cannot tell WebLogic from any
          other Java service, so restrict the run to PeopleSoft web hosts by host name.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ParentBaseFileName=java
          | FileName=/^(id|whoami|uname|ifconfig|hostname)$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: java-started-shell-running-discovery
        name: Java process starting a shell that runs a discovery command
        purpose: >-
          Return shells started by java whose command line runs id, whoami, uname,
          ifconfig, a passwd read or a listing of the web root. H190 returns every shell
          and transfer tool java starts on these hosts; this case keeps the ones that
          look like a person checking where the shell landed.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ParentBaseFileName=java
          | FileName=/^(sh|bash|dash|ksh)$/
          | CommandLine=/\b(id|whoami|ifconfig|hostname)\b|uname\s+-a|\/etc\/passwd|PSEMHUB/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: web_tier_java_ran_command
      name: PeopleSoft web tier Java process ran a command
      description: >-
        The parent of a discovery utility or a shell running one is java on a PeopleSoft
        web host.
      source: process_creation
      field: parent_process
      indicates: web_shell_command_execution

  supporting:
    - id: jsp_written_in_web_root
      name: JSP written under PSEMHUB
      description: >-
        A .jsp file was created under the PSEMHUB application directory on the same
        host.
      source: file_creation
      field: file_path
      indicates: web_shell_file_placed
    - id: command_touched_web_root
      name: Command wrote into the web root
      description: >-
        A shell or file utility names PSEMHUB.war or its envmetadata folders on its
        command line.
      source: process_creation
      field: command_line
      indicates: web_root_tampering
    - id: runs_as_weblogic_account
      name: Child runs as the PeopleSoft service account
      description: >-
        The user on the child is the account WebLogic runs under.
      source: process_creation
      field: user
      indicates: execution_in_application_context

  contradicting:
    - id: host_is_not_peoplesoft
      name: Host is not a PeopleSoft server
      description: >-
        Inventory shows the host runs a different Java application that starts these
        utilities by design.
      source: asset_inventory
      field: ComputerName
      indicates: unrelated_java_service
    - id: recorded_peopletools_change
      name: Activity matches a recorded PeopleTools change
      description: >-
        A change record covers a PeopleTools patch or redeployment of the web domain at
        this time.
      source: change_management
      field: ComputerName
      indicates: authorised_maintenance

  risk_logic:
    required:
      - web_tier_java_ran_command

    supporting:
      any:
        - jsp_written_in_web_root
        - command_touched_web_root
        - runs_as_weblogic_account
      all:
        - jsp_written_in_web_root
        - runs_as_weblogic_account

    contradicting:
      any:
        - host_is_not_peoplesoft
        - recorded_peopletools_change
      all: []

  verdict:
    low_risk_when:
      - web_tier_java_ran_command
      - host_is_not_peoplesoft
      - recorded_peopletools_change
    suspicious_when:
      - web_tier_java_ran_command
      - runs_as_weblogic_account
    high_risk_when:
      - web_tier_java_ran_command
      - runs_as_weblogic_account
      - jsp_written_in_web_root

  false_positive:
    - condition: Monitoring agents written in Java run uname or hostname.
      explanation: >-
        They run on a schedule on every host they monitor and are not the WebLogic
        process.
    - condition: A PeopleTools patch rewrites PSEMHUB.war.
      explanation: >-
        The writes fall inside a change window and come from the installer, and no
        discovery command follows.
