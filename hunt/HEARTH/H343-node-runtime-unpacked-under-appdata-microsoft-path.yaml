# Converted from THORCollective/HEARTH Flames/H343.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH also cites T1105 and T1036.005. Distinct from H209, H233 and H251, which
# hunt Node loaders that arrive through a remote-support session or a package.
type: detection

id: hg-win-hearth-h343-node-runtime-unpacked-under-appdata-microsoft-path-t1059-007
version: 1.0.0

info:
  name: Official Node.js runtime unpacked under an AppData path that imitates a Microsoft component
  description: >-
    In a KongTuke ClickFix intrusion the operator downloaded official Node.js builds
    from nodejs.org, unpacked them into
    AppData\Local\Microsoft\Assemblies\41f2\node-v18.19.0-win-x64 and ran node.exe as
    the interpreter for a JavaScript implant that is rewritten on every run. The binary
    is genuine and signed, so nothing matches it. What is wrong is where it sits: a
    developer runtime below AppData\Local\Microsoft, in a folder with a short hex name,
    still in the layout of the release archive. Version managers and editors keep Node
    elsewhere. The script the runtime executes is read by the interpreter and is not
    seen; the hunt returns the runtime, its arrival and the download that preceded it.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - execution
    - javascript
    - nodejs
    - bring-your-own-interpreter
    - kongtuke
    - etherrat
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H343.md
    - https://attack.mitre.org/techniques/T1059
    - https://attack.mitre.org/techniques/T1059/007
    - https://attack.mitre.org/detectionstrategies/DET0264

mitre:
  tactics:
    - TA0002
  techniques:
    - T1059
  sub_techniques:
    - T1059.007
  detection_strategies:
    - DET0264
  analytics:
    - AN0733
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    Rather than compiling an implant, an operator is downloading an official Node.js
    Windows build from nodejs.org, unpacking it into a hex-named directory under
    %LOCALAPPDATA%\Microsoft\ that mimics a Microsoft component path, and running
    node.exe to execute JavaScript payloads, so the malicious logic is interpreted
    script held off-disk or re-obfuscated per run, and the only process on the endpoint
    is an unmodified, legitimately-signed developer runtime that no signature will ever
    match.
  attacker_behavior:
    - Fetches the Node.js zip from nodejs.org with PowerShell or curl.
    - Extracts it below AppData\Local\Microsoft in a folder with a short hex name.
    - Runs node.exe against a script or an inline -e argument.
    - Keeps the runtime connected to a controller and moves data through it.
  legitimate_behavior:
    - Developers install Node.js under Program Files or through nvm, fnm, Volta or nvs.
    - Editors and desktop applications ship their own Node or Electron runtime in their install folder.
    - Build agents unpack a Node archive into a tool cache.
  risk_indicator:
    - node.exe runs from below AppData\Local\Microsoft or AppData\Roaming\Microsoft.
    - The directory still has the release archive's node-v<version>-win-x64 name.
    - A parent folder has a four to eight character hex name.
    - nodejs.org was resolved by PowerShell, curl or another non-browser process.
    - The user has no development role.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: node-running-below-appdata-microsoft
        name: node.exe running from below AppData Microsoft folders
        purpose: >-
          Return node.exe whose image is under AppData\Local\Microsoft or
          AppData\Roaming\Microsoft. Visual Studio Code installs under
          AppData\Local\Programs and is not matched.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^node\.exe$/i
          | ImageFileName=/\\AppData\\(Local|Roaming)\\Microsoft\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-running-from-release-archive-layout-in-user-path
        name: node.exe running from an unpacked release archive or a hex-named folder
        purpose: >-
          Return node.exe run straight out of the official zip's directory name, or from
          a folder with a short hex name, anywhere under a user profile, ProgramData or
          a Temp folder. Version managers rename the directory and are not matched; a
          build agent's tool cache can be.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^node\.exe$/i
          | ImageFileName=/\\(Users|ProgramData|Windows\\Temp)\\.*\\(node-v\d+\.\d+\.\d+-win-(x64|x86|arm64)|[0-9a-f]{4,8})\\node\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: node-executable-written-under-appdata
        name: node.exe written under AppData outside a version manager
        purpose: >-
          Return writes of node.exe below AppData, with the writing process, leaving out
          the directories nvm, fnm, Volta and nvs use. The writer shows whether an
          archive tool or a script unpacked it.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\AppData\\.*\\node\.exe$/i
          | TargetFileName!=/\\AppData\\(Local|Roaming)\\(nvm|fnm|fnm_multishells|Volta|nvs)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: nodejs-download-host-requested-by-non-browser
        name: nodejs.org resolved by a shell or download utility
        purpose: >-
          Return requests for nodejs.org from PowerShell, curl and the other utilities a
          pasted command uses. A version manager resolving it under its own name is not
          returned.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/^(dist\.)?nodejs\.org$/i
          | ContextBaseFileName=/^(powershell|pwsh|curl|certutil|bitsadmin|cmd|mshta|wscript|cscript|rundll32|msiexec)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: node_runtime_in_masquerading_path
      name: Node runtime runs from a user-writable path that is not a version manager's
      description: >-
        node.exe runs from below AppData Microsoft folders, from an unpacked release
        archive directory or from a hex-named folder in a user-writable location.
      source: process_creation
      field: image_path
      indicates: interpreter_brought_by_operator

  supporting:
    - id: node_written_by_script_or_archiver
      name: Runtime was unpacked by a script or archive tool
      description: >-
        node.exe was written under AppData by PowerShell, tar, 7-Zip or Explorer's zip
        handler and not by an installer or version manager.
      source: file_creation
      field: writer_process_name
      indicates: runtime_extracted_not_installed
    - id: nodejs_fetched_by_utility
      name: nodejs.org resolved by a non-browser process
      description: >-
        A shell or download utility resolved nodejs.org on the host before the runtime
        appeared, by the agent's comparison of event times.
      source: dns_request
      field: process_name
      indicates: scripted_runtime_download
    - id: node_inline_or_hidden_script
      name: Runtime started with inline code or a script beside it
      description: >-
        The node.exe command line carries -e or --eval, or a script in the same AppData
        tree.
      source: process_creation
      field: command_line
      indicates: script_payload_execution
    - id: node_started_by_shell_or_autorun
      name: Runtime started by a shell, script host or autorun
      description: >-
        The parent is PowerShell, cmd, a script host, a scheduled task host or Explorer
        at logon and not an editor or terminal the user works in.
      source: process_creation
      field: parent_process
      indicates: non_interactive_launch
    - id: non_developer_user
      name: User has no development role
      description: >-
        The account belongs to someone who does not write or build software.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: developer_or_build_host
      name: Host is a developer workstation or build agent
      description: >-
        The host is used for software development or runs a CI agent whose tool cache
        holds Node archives.
      source: asset_inventory
      field: ComputerName
      indicates: expected_developer_tooling
    - id: product_bundles_node
      name: Installed product ships Node in that path
      description: >-
        An approved application on the host keeps a Node runtime in the directory
        returned.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software

  risk_logic:
    required:
      - node_runtime_in_masquerading_path

    supporting:
      any:
        - node_written_by_script_or_archiver
        - nodejs_fetched_by_utility
        - node_inline_or_hidden_script
        - node_started_by_shell_or_autorun
        - non_developer_user
      all:
        - nodejs_fetched_by_utility
        - non_developer_user

    contradicting:
      any:
        - developer_or_build_host
        - product_bundles_node
      all: []

  verdict:
    low_risk_when:
      - node_runtime_in_masquerading_path
      - developer_or_build_host
      - product_bundles_node
    suspicious_when:
      - node_runtime_in_masquerading_path
      - non_developer_user
    high_risk_when:
      - node_runtime_in_masquerading_path
      - nodejs_fetched_by_utility
      - non_developer_user

  false_positive:
    - condition: A CI agent unpacks Node archives into a tool cache.
      explanation: >-
        The directory keeps the archive name. The host is a build agent, the parent is
        the agent process and the path is its work folder.
    - condition: A developer unpacks a Node zip by hand to test a version.
      explanation: >-
        The user is a developer and the folder is in Downloads or a project directory,
        not below a Microsoft component path.
    - condition: A Microsoft or third-party product keeps a Node runtime under AppData.
      explanation: >-
        It is the same path on every host that has the product and was written by the
        product's installer.
