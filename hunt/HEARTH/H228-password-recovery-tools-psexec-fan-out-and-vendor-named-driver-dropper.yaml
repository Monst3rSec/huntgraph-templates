# Converted from THORCollective/HEARTH Flames/H228.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h228-password-recovery-tools-psexec-fan-out-and-vendor-named-driver-dropper-t1555-003
version: 1.0.0

info:
  name: Password-recovery tools, PsExec fan-out and a vendor-named driver dropper before ransomware
  description: >-
    Symantec ties GodDamn ransomware to the lineage behind Monster and Beast. In a June
    2026 intrusion the operators kept access through AnyDesk set up for unattended use,
    ran Mimikatz and a set of NirSoft password-recovery tools from a user's Music
    folder, moved with PsExec, and used a utility named symantec.exe to drop the signed
    PoisonX driver g11.sys and stop security software before encrypting. The driver load
    and the termination of security processes are not events this deployment collects.
    The earlier steps each start a process or write a file: the credential tools by name
    and location, the PsExec service starting commands, AnyDesk being given a password,
    a binary named after a security vendor writing a driver. H119 holds PsExec-style
    execution and H058 driver staging in their general forms; this template returns the
    pieces of this one chain so the agent can order them.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - credential-access
    - lateral-movement
    - ransomware
    - goddamn
    - nirsoft
    - psexec
    - anydesk
    - byovd
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H228.md
    - https://attack.mitre.org/techniques/T1555
    - https://attack.mitre.org/techniques/T1555/003
    - https://attack.mitre.org/techniques/T1569/002
    - https://attack.mitre.org/detectionstrategies/DET0037
    - https://attack.mitre.org/detectionstrategies/DET0421
    - https://thehackernews.com/2026/07/goddamn-ransomware-uses-poisonx-driver.html
    - https://gbhackers.com/goddamn-ransomware-attack/

mitre:
  tactics:
    - TA0006
    - TA0002
  techniques:
    - T1555
    - T1569
  sub_techniques:
    - T1555.003
    - T1569.002
  detection_strategies:
    - DET0037
    - DET0421
  analytics:
    - AN0105
    - AN1185
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    A ransomware operator harvests local credential stores, uses PsExec to move across
    hosts, then loads a signed PoisonX driver or masqueraded security binary to impair
    endpoint defenses before encryption.
  attacker_behavior:
    - Stages Mimikatz and NirSoft password-recovery tools under a user's Music folder and runs them.
    - Sets an unattended-access password on AnyDesk by piping it into the client.
    - Runs commands on further hosts through the PsExec service.
    - Runs a utility named symantec.exe that writes the driver g11.sys.
    - Starts the encryptor once security software has stopped.
  legitimate_behavior:
    - Help desk staff use NirSoft tools to recover a user's own passwords.
    - Administrators use PsExec and AnyDesk.
    - Security products write their own drivers from their own install directories.
  risk_indicator:
    - A password-recovery tool runs from Music, Pictures, Videos or another user-writable folder.
    - The PsExec service starts commands on several hosts under one account.
    - AnyDesk is given a password from a command line.
    - A binary named after a security vendor runs from outside any product directory.
    - That binary writes a .sys file.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: password-recovery-tool-started
        name: Password-recovery tool started under its own name
        purpose: >-
          Return starts of Mimikatz and the NirSoft password-recovery tools named in the
          reporting, with their path. This is a match on file name and sees only a tool
          that was not renamed.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(WebBrowserPassView|ChromePass|PasswordFox|VNCPassView|MailPassView|WirelessKeyView|NetPass|mspass|iepv|rdpv|pspv|BulletsPassView|OperaPassView|mimikatz)(64|32|_x64|-x64)?\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: executable-run-from-user-media-folder
        name: Executable run from a user's Music, Pictures or Videos folder
        purpose: >-
          Return any process whose image sits in a profile's media folders, where this
          operator staged its tools. A renamed credential tool is returned here by
          location.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ImageFileName=/\\Users\\[^\\]+\\(Music|Pictures|Videos)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: process-started-by-psexec-service
        name: Process started by the PsExec service
        purpose: >-
          Return the children of psexesvc.exe on each destination host, with the
          account. The agent counts hosts per account from the returned events to see
          the fan-out. A PsExec service installed under another name with -r is not
          matched; H119 covers that.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^psexesvc\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: anydesk-unattended-access-configured-by-command
        name: AnyDesk given an unattended-access password or installed silently
        purpose: >-
          Return commands that pipe a password into AnyDesk or install it silently to
          start with Windows. The piped form is one cmd.exe command line that holds both
          the echo and the AnyDesk switch.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/anydesk/i
          | CommandLine=/--set-password\b|--install\b.*--silent\b|--silent\b.*--install\b|--start-with-win\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: security-vendor-named-binary-outside-product-directory
        name: Binary named after a security vendor running outside a product directory
        purpose: >-
          Return processes named for a vendor alone, such as symantec.exe, whose image
          is not under Program Files or the vendor's ProgramData directory. Real
          products name their binaries after components, not after the company.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(symantec|norton|mcafee|defender|kaspersky|sophos|crowdstrike|sentinelone|eset|avast|bitdefender|trendmicro)\.exe$/i
          | ImageFileName!=/\\(Program Files( \(x86\))?|ProgramData\\(Symantec|McAfee|Sophos|Microsoft|ESET|Bitdefender|Kaspersky Lab|Trend Micro|CrowdStrike))\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: driver-written-by-vendor-named-binary
        name: Driver written by a vendor-named binary
        purpose: >-
          Return .sys files whose writer is a process named for a security vendor. The
          load of the driver is not a collected event; the write is the visible step.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\.sys$/i
          | ContextBaseFileName=/^(symantec|norton|mcafee|defender|kaspersky|sophos|crowdstrike|sentinelone|eset|avast|bitdefender|trendmicro)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: poisonx-driver-written
        name: Driver named g11.sys written
        purpose: >-
          Return any write of g11.sys, the PoisonX driver's reported name, whatever
          wrote it. A copy under another name is returned only by the previous case.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\g11\.sys$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: goddamn-encryptor-started
        name: Encryptor started under its reported name
        purpose: >-
          Return starts of a binary named in the encrypter-windows pattern reported for
          this family. The name is trivially changed; file renames to the ransom
          extension are not a collected event.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^encrypter-windows-[\w-]+\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: credential_tool_executed
      name: Password-recovery or credential tool executed
      description: >-
        A named password-recovery tool or Mimikatz started, or an executable ran from a
        user's media folder.
      source: process_creation
      field: image_name
      indicates: credential_store_harvesting

  supporting:
    - id: tool_in_user_media_folder
      name: Tool runs from a media folder
      description: >-
        The image path is under a profile's Music, Pictures or Videos folder.
      source: process_creation
      field: image_path
      indicates: operator_tool_staging
    - id: psexec_service_child
      name: Command started by the PsExec service
      description: >-
        The parent of a command is psexesvc.exe.
      source: process_creation
      field: parent_process
      indicates: remote_service_execution
    - id: one_account_on_several_hosts
      name: One account across several hosts
      description: >-
        The same account appears on PsExec service children on several hosts after the
        credential tools ran. The agent counts hosts per account from the returned
        events.
      source: process_creation
      field: user
      indicates: lateral_fan_out
    - id: anydesk_password_set
      name: AnyDesk configured for unattended access
      description: >-
        A command pipes a password into AnyDesk or installs it silently.
      source: process_creation
      field: command_line
      indicates: remote_access_persistence
    - id: driver_written_by_masqueraded_binary
      name: Driver written by a vendor-named binary
      description: >-
        A .sys file is written and the writer is a process named for a security vendor.
      source: file_creation
      field: writer_process_name
      indicates: defence_impairment_staging
    - id: poisonx_driver_name
      name: Driver is named g11.sys
      description: >-
        The written driver's path ends in g11.sys.
      source: file_creation
      field: file_path
      indicates: known_vulnerable_driver

  contradicting:
    - id: help_desk_password_recovery
      name: Tool run by support staff for the user
      description: >-
        The account is help desk staff, a ticket covers the recovery and no remote
        execution follows.
      source: identity_context
      field: UserName
      indicates: authorised_password_recovery
    - id: approved_remote_administration
      name: PsExec and AnyDesk are approved on the host
      description: >-
        Asset records list the tools as approved and the source is an administration
        host.
      source: asset_inventory
      field: ComputerName
      indicates: routine_administration

  risk_logic:
    required:
      - credential_tool_executed

    supporting:
      any:
        - tool_in_user_media_folder
        - psexec_service_child
        - one_account_on_several_hosts
        - anydesk_password_set
        - driver_written_by_masqueraded_binary
        - poisonx_driver_name
      all:
        - psexec_service_child
        - driver_written_by_masqueraded_binary

    contradicting:
      any:
        - help_desk_password_recovery
        - approved_remote_administration
      all: []

  verdict:
    low_risk_when:
      - credential_tool_executed
      - help_desk_password_recovery
      - approved_remote_administration
    suspicious_when:
      - credential_tool_executed
      - tool_in_user_media_folder
    high_risk_when:
      - credential_tool_executed
      - psexec_service_child
      - driver_written_by_masqueraded_binary

  false_positive:
    - condition: NirSoft tools used for support.
      explanation: >-
        They are common on technicians' machines and run from a tools folder. One tool
        run once for one user is the support shape; several in a row from Music is not.
    - condition: Media players and games installed in a profile.
      explanation: >-
        The media-folder case returns any executable there. Most are portable players or
        game launchers the user started.
    - condition: PsExec in administration scripts.
      explanation: >-
        Software distribution and patch scripts use it. The source host and account are
        the administration ones and the commands repeat.
