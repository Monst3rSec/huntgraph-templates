type: detection

id: hg-win-hearth-h160-browser-named-scheduled-task-running-regsvr32-t1053-005
version: 1.0.0

info:
  name: Scheduled task named after a browser check that runs regsvr32 every minute
  description: >-
    Kimsuky keeps its PebbleDash and AppleSeed implants running with a scheduled task
    called ChromeCheck when it has administrator rights and EdgeCheck when it does not.
    The task runs regsvr32 /s against the implant every minute, and the implant is a DLL
    kept under a user-writable path with an extension such as .cfg or .db so that it
    does not look like one. Event 4698 is not collected. The hunt returns the task being
    created through schtasks, regsvr32 being started by the Task Scheduler against a
    file that is not a .dll or sits in a writable directory, and the names regsvr32
    resolves. A task registered through the Task Scheduler API starts no schtasks
    process and is seen only through the regsvr32 it runs.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - scheduled-task
    - regsvr32
    - kimsuky
    - appleseed
    - pebbledash
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H160.md
    - https://attack.mitre.org/techniques/T1053
    - https://attack.mitre.org/techniques/T1053/005
    - https://attack.mitre.org/techniques/T1218
    - https://attack.mitre.org/techniques/T1218/010
    - https://attack.mitre.org/detectionstrategies/DET0441
    - https://attack.mitre.org/detectionstrategies/DET0282

mitre:
  tactics:
    - TA0003
    - TA0002
    - TA0005
  techniques:
    - T1053
    - T1218
  sub_techniques:
    - T1053.005
    - T1218.010
  detection_strategies:
    - DET0441
    - DET0282
  analytics:
    - AN1221
    - AN0785
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
    - WinEventLog:Security
  data_components:
    - Process Creation
    - Network Connection Creation

hypothesis:
  statement: >-
    Kimsuky (DPRK) is persisting PebbleDash and AppleSeed implants on Windows hosts by
    creating scheduled tasks named ChromeCheck (elevated) or EdgeCheck (non-elevated)
    that invoke regsvr32 /s <path> every minute, disguising the persistence under
    browser-update branding.
  attacker_behavior:
    - Creates a scheduled task with a browser-update name and a one-minute repetition.
    - Sets the task's action to regsvr32 /s against the implant file.
    - Stores the implant under ProgramData or AppData with a non-DLL extension.
    - Has the implant contact its server through tunnel services and free Korean domains.
  legitimate_behavior:
    - Google and Microsoft updaters register their own tasks through the Task Scheduler API, not schtasks.
    - Installers register COM components with regsvr32 from Program Files.
    - A few legacy applications re-register a component from a logon task.
  risk_indicator:
    - schtasks creates a task whose action is regsvr32.
    - The task is named ChromeCheck, EdgeCheck or another browser-update name.
    - The Task Scheduler starts regsvr32 /s against a file that is not a .dll or is in a writable directory.
    - The same regsvr32 command starts every minute.
    - regsvr32 resolves an external name.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: scheduled-task-created-with-regsvr32-action
        name: schtasks creating a task whose action is regsvr32
        purpose: >-
          Return schtasks /create commands whose /tr action runs regsvr32, under any
          task name. Image name first, then the verb, then the action.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^schtasks\.exe$/i
          | CommandLine=/\/create\b/i
          | CommandLine=/\/tr\s+.*regsvr32/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: scheduled-task-created-under-browser-check-name
        name: schtasks creating a task with a browser-check name
        purpose: >-
          Return schtasks /create commands that use the reported task names, whatever
          the action, which covers the wscript variant. The vendors' own updater tasks
          are registered through the API and start no schtasks process, so a match here
          is not the real updater.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^schtasks\.exe$/i
          | CommandLine=/\/create\b/i
          | CommandLine=/\/tn\s+["']?[^"']*(ChromeCheck|EdgeCheck|GoogleCache|GoogleUpdate)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: regsvr32-started-by-task-scheduler-against-unusual-file
        name: Task Scheduler starting regsvr32 against a non-DLL or a writable path
        purpose: >-
          Return regsvr32 whose parent is the Task Scheduler's service host and whose
          command line names a file under ProgramData, AppData, Public or Temp, or a
          file with a data-file extension. This is the task running, and it is seen
          however the task was registered. On Windows 10 and later the parent is
          svchost.exe; the service group is on the parent's own command line, which this
          event does not carry.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^regsvr32\.exe$/i
          | ParentBaseFileName=/^(svchost|taskeng|taskhostw)\.exe$/i
          | CommandLine=/\\(ProgramData|AppData|Users\\Public|Windows\\Temp)\\|\.(cfg|db|dat|xml|log|tmp|txt|bin)["']?(\s|$)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: name-requested-by-regsvr32
        name: Name request made by regsvr32
        purpose: >-
          Return every name regsvr32 resolves. Registering a component needs no network,
          so the set is small; a DLL running inside regsvr32 that contacts its server
          shows here, including the trycloudflare.com and free .kr domains reported for
          this actor.
        query: |
          #event_simpleName=DnsRequest
          | ContextBaseFileName=/^regsvr32\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: regsvr32_task_command
      name: regsvr32 registered as, or run by, a scheduled task
      description: >-
        A schtasks command creates a task whose action is regsvr32 or whose name is one
        of the browser-check names, or the Task Scheduler starts regsvr32 against a file
        in a writable path.
      source: process_creation
      field: command_line
      indicates: proxy_execution_persistence

  supporting:
    - id: task_scheduler_parent
      name: regsvr32 started by the Task Scheduler
      description: >-
        The parent of the regsvr32 process is the Task Scheduler's service host.
      source: process_creation
      field: parent_process
      indicates: task_driven_execution
    - id: minute_interval_relaunch
      name: Same regsvr32 command every minute
      description: >-
        Successive starts of the same command on one host are about a minute apart,
        which the agent derives from the timestamps of the returned events.
      source: process_creation
      field: process_id
      indicates: watchdog_persistence
    - id: task_created_by_schtasks
      name: Task created with schtasks
      description: >-
        The creating process is schtasks.exe, which the vendors' updaters do not use for
        their own tasks.
      source: process_creation
      field: image_name
      indicates: manual_task_registration
    - id: regsvr32_resolved_external_name
      name: regsvr32 resolved an external name
      description: >-
        A name request comes from regsvr32, and the name is a tunnel service, a free
        dynamic domain or otherwise unrelated to software on the host.
      source: dns_request
      field: query_name
      indicates: implant_beaconing
    - id: non_administrative_user_context
      name: Task runs in an ordinary user's context
      description: >-
        The user on the regsvr32 event is an ordinary account, the non-elevated
        EdgeCheck form.
      source: process_creation
      field: user
      indicates: user_level_persistence

  contradicting:
    - id: packaged_component_registration
      name: Task belongs to installed software
      description: >-
        Asset records identify the task and the registered file as part of a product
        deployed to the host, present on every host that has it.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software_installation

  risk_logic:
    required:
      - regsvr32_task_command

    supporting:
      any:
        - task_scheduler_parent
        - minute_interval_relaunch
        - task_created_by_schtasks
        - regsvr32_resolved_external_name
        - non_administrative_user_context
      all:
        - task_scheduler_parent
        - minute_interval_relaunch

    contradicting:
      any:
        - packaged_component_registration
      all: []

  verdict:
    low_risk_when:
      - regsvr32_task_command
      - packaged_component_registration
    suspicious_when:
      - regsvr32_task_command
      - task_scheduler_parent
    high_risk_when:
      - regsvr32_task_command
      - minute_interval_relaunch
      - regsvr32_resolved_external_name

  false_positive:
    - condition: Legacy applications that re-register components.
      explanation: >-
        A few line-of-business products run regsvr32 from a logon task. The file is a
        .dll or .ocx under Program Files and the task runs at logon, not every minute.
    - condition: Software packaging scripts.
      explanation: >-
        Deployment tools create tasks with schtasks, and some name them after the
        product they update. The action is the vendor's updater, not regsvr32.
