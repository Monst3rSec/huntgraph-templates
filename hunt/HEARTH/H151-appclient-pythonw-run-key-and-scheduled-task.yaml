type: detection

id: hg-win-hearth-h151-appclient-pythonw-run-key-and-scheduled-task-t1547-001
version: 1.0.0

info:
  name: pythonw -m appclient kept running by a Run key and a scheduled task
  description: >-
    Silver Fox installs the ABCDoor backdoor as a Cython-compiled Python module and
    keeps it running two ways at once: an HKCU Run value named AppClient and a scheduled
    task named AppClient, each of which starts pythonw.exe -m appclient. The task
    repeats every minute. Installation leaves values under HKCU\Software\CarEmu and log
    files under %LOCALAPPDATA%\applogs. The hunt returns the module being run, the task
    being created, the Run value and the install markers. Event 4698 is not collected,
    so a task registered through the Task Scheduler API without schtasks is seen only
    through the pythonw process it starts each minute. The log files are neither PE
    files nor scripts and their creation is not reported.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - run-key
    - scheduled-task
    - python
    - silver-fox
    - abcdoor
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H151.md
    - https://attack.mitre.org/techniques/T1547
    - https://attack.mitre.org/techniques/T1547/001
    - https://attack.mitre.org/techniques/T1053
    - https://attack.mitre.org/techniques/T1053/005
    - https://attack.mitre.org/detectionstrategies/DET0365
    - https://attack.mitre.org/detectionstrategies/DET0441

mitre:
  tactics:
    - TA0003
    - TA0004
  techniques:
    - T1547
    - T1053
  sub_techniques:
    - T1547.001
    - T1053.005
  detection_strategies:
    - DET0365
    - DET0441
  analytics:
    - AN1032
    - AN1221
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - Windows Registry Key Modification

hypothesis:
  statement: >-
    Silver Fox persists ABCDoor on Windows through an HKCU Run key value AppClient and a
    scheduled task AppClient, both invoking pythonw.exe -m appclient, with installation
    artefacts under HKCU\Software\CarEmu and %LOCALAPPDATA%\applogs.
  attacker_behavior:
    - Installs a Python runtime and a compiled module named appclient in the user profile.
    - Adds an HKCU Run value named AppClient that starts pythonw.exe -m appclient.
    - Creates a scheduled task named AppClient with the same action, repeating every minute.
    - Records install time and channel under HKCU\Software\CarEmu.
  legitimate_behavior:
    - In-house Python tools are started as modules from scheduled tasks.
    - Developers run their own modules with python -m.
    - A business application may happen to be called AppClient.
  risk_indicator:
    - pythonw.exe runs with -m appclient.
    - schtasks creates a task named AppClient or one whose action is pythonw -m.
    - A Run value named AppClient is written, or one whose data starts a Python module.
    - Values appear under HKCU\Software\CarEmu.
    - The same pythonw command starts every minute under the Task Scheduler.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: pythonw-running-appclient-module
        name: Python interpreter running the appclient module
        purpose: >-
          Return every start of python.exe or pythonw.exe with -m appclient. The image
          name and the module name are both exact. The parent on each event tells the
          Run key start, under Explorer, from the task start, under the Task Scheduler
          service.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^pythonw?\.exe$/i
          | CommandLine=/\s-m\s+appclient\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: scheduled-task-created-for-appclient
        name: schtasks creating the AppClient task or a pythonw module task
        purpose: >-
          Return schtasks /create commands that name AppClient or whose action runs
          pythonw with -m. A task registered through the Task Scheduler API starts no
          schtasks process and is not seen here.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^schtasks\.exe$/i
          | CommandLine=/\/create\b/i
          | CommandLine=/\bAppClient\b|pythonw(\.exe)?["']?\s+-m\s/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: run-value-named-appclient
        name: Run value named AppClient written
        purpose: >-
          Return writes of a Run value named AppClient, with its data, however the write
          was made.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run\\?$/i
          | RegValueName=/^AppClient$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: run-value-starting-python-module
        name: Run value whose data starts a Python module
        purpose: >-
          Return Run values under any name whose data runs python or pythonw with -m,
          which survives a change of the value's name.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\CurrentVersion\\Run\\?$/i
          | RegStringValue=/pythonw?(\.exe)?["']?\s+-m\s/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: caremu-install-marker-written
        name: Value written under HKCU\Software\CarEmu
        purpose: >-
          Return writes under the CarEmu key, where the installer records
          FirstInstallTime and InstallChannel. This case depends on the sensor reporting
          writes under an arbitrary HKCU\Software key; confirm in the tenant.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\Software\\CarEmu(\\|$)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-naming-install-artefacts
        name: Command naming the CarEmu key, the applogs directory or the AppClient Run value
        purpose: >-
          Return commands that name the install key, the log directory or set the Run
          value from reg.exe or PowerShell, for an installer that does its work through
          commands.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\\Software\\CarEmu\b|\\AppData\\Local\\applogs\\|CurrentVersion\\Run\b.*\bAppClient\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: appclient_module_execution
      name: pythonw runs the appclient module
      description: >-
        A Python interpreter starts with -m appclient on its command line.
      source: process_creation
      field: command_line
      indicates: backdoor_module_execution

  supporting:
    - id: run_value_appclient
      name: Run value AppClient present
      description: >-
        A value named AppClient is written under a CurrentVersion\Run key.
      source: registry
      field: registry_value
      indicates: logon_persistence
    - id: run_data_starts_python_module
      name: Run value data starts a Python module
      description: >-
        The data of a Run value runs python or pythonw with -m.
      source: registry
      field: registry_data
      indicates: interpreter_based_persistence
    - id: task_created_for_module
      name: Scheduled task created for the module
      description: >-
        schtasks creates a task named AppClient, or one whose action is pythonw with -m.
      source: process_creation
      field: image_name
      indicates: scheduled_task_persistence
    - id: install_marker_key
      name: CarEmu install marker written
      description: >-
        Values are written under HKCU\Software\CarEmu.
      source: registry
      field: registry_path
      indicates: implant_installation
    - id: started_by_task_scheduler
      name: Module started by the Task Scheduler
      description: >-
        The parent of the pythonw process is the Task Scheduler service host.
      source: process_creation
      field: parent_process
      indicates: task_driven_relaunch
    - id: minute_interval_relaunch
      name: Module restarts every minute
      description: >-
        Successive starts of the same command on one host are about a minute apart,
        which the agent derives from the timestamps of the returned events.
      source: process_creation
      field: process_id
      indicates: watchdog_persistence
    - id: interpreter_in_user_profile
      name: Interpreter runs from the user profile
      description: >-
        The pythonw image is under AppData or another user-writable directory, not a
        system-wide Python install.
      source: process_creation
      field: image_path
      indicates: bundled_runtime

  contradicting:
    - id: in_house_application
      name: appclient is an in-house application
      description: >-
        Asset records list a business application of that name deployed to the host,
        with the same Run value or task on every host that has it.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software_installation

  risk_logic:
    required:
      - appclient_module_execution

    supporting:
      any:
        - run_value_appclient
        - run_data_starts_python_module
        - task_created_for_module
        - install_marker_key
        - started_by_task_scheduler
        - minute_interval_relaunch
        - interpreter_in_user_profile
      all:
        - run_value_appclient
        - task_created_for_module

    contradicting:
      any:
        - in_house_application
      all: []

  verdict:
    low_risk_when:
      - appclient_module_execution
      - in_house_application
    suspicious_when:
      - appclient_module_execution
      - started_by_task_scheduler
    high_risk_when:
      - appclient_module_execution
      - run_value_appclient
      - install_marker_key

  false_positive:
    - condition: A business application named AppClient.
      explanation: >-
        The name is generic. A real one is deployed by IT, installed under Program Files
        and has no CarEmu key.
    - condition: Developers running their own module.
      explanation: >-
        A module called appclient in a project runs from a development shell, not from a
        Run key or a task repeating every minute.
