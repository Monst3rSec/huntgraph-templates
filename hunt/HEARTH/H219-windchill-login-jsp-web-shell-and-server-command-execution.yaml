# Converted from THORCollective/HEARTH Flames/H219.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h219-windchill-login-jsp-web-shell-and-server-command-execution-t1505-003
version: 1.0.0

info:
  name: JSP web shell under the Windchill login path and commands from the application server
  description: >-
    CVE-2026-12569 gives an unauthenticated attacker code execution on PTC Windchill and
    FlexPLM through deserialisation of untrusted data. The reported use is a JSP web
    shell written under the Windchill login path with a name of sixteen lowercase hex
    characters, a file listing saved as flst.txt, and commands run through the shell
    under the application server's account. The request, its X-windchill-req header and
    the source address are in the web access log, which this connector does not ingest.
    What the sensor has is the JSP written to disk, where it reports script writes for
    that extension, and the shells, transfer tools and archivers the Java process then
    starts. H105 returns Java application servers starting commands in general; this
    template adds the Windchill process and the web shell file.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - web-shell
    - windchill
    - flexplm
    - jsp
    - cve-2026-12569
    - windows
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H219.md
    - https://attack.mitre.org/techniques/T1505
    - https://attack.mitre.org/techniques/T1505/003
    - https://attack.mitre.org/detectionstrategies/DET0394
    - https://fieldeffect.com/blog/ptc-windchill-flaw-allows-unauthenticated-rce
    - https://www.ptc.com/en/about/trust-center/advisory-center/active-advisories/windchill-flexplm-rce-vulnerability

mitre:
  tactics:
    - TA0003
  techniques:
    - T1505
  sub_techniques:
    - T1505.003
  detection_strategies:
    - DET0394
  analytics:
    - AN1108
    - AN1109
  platforms:
    - Windows
    - Linux
  data_sources:
    - WinEventLog:Sysmon
    - auditd:SYSCALL
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An adversary exploits PTC Windchill or FlexPLM to write a JSP web shell under the
    Windchill login path, then uses the application server account to run shell commands
    or transfer tools.
  attacker_behavior:
    - Sends a crafted request to an unpatched Windchill or FlexPLM server.
    - Writes a JSP file with a sixteen-character hex name under the Windchill login path.
    - Lists the file system into flst.txt in /tmp or the Windchill working directory.
    - Runs cmd, PowerShell, sh or bash through the web shell as the service account.
    - Fetches tools with curl or wget and packs design and product data with tar, zip or 7z.
  legitimate_behavior:
    - Windchill patches and plug-in deployments write JSP files under the application path.
    - The application server starts helper processes during maintenance and indexing.
    - PTC support staff run diagnostic commands on the server.
  risk_indicator:
    - A JSP with a sixteen-character hex name appears under a login directory.
    - The Java process that serves Windchill starts a shell, a transfer tool or an archiver.
    - A command names flst.txt.
    - The JSP write and the first shell fall within minutes of each other.
    - No patch or deployment is scheduled for the server.

requires:
  platforms:
    - windows
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: hex-named-jsp-written-under-login-directory
        name: JSP with a sixteen-character hex name written under a login directory
        purpose: >-
          Return script writes whose path ends in a login directory and a
          sixteen-character hex name with a .jsp extension, the naming PTC reports for
          the web shell. The path test does not depend on where Windchill is installed.
          This case depends on the sensor reporting a JSP write as a script write on the
          server's platform; H123 relies on the same for Windows web roots. Where it
          does not, the web shell file is not seen and the process cases carry the hunt.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/[\\\/]login[\\\/][0-9a-f]{16}\.jsp$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: jsp-written-under-windchill-or-flexplm-path
        name: JSP written anywhere under a Windchill or FlexPLM path
        purpose: >-
          Return every JSP write under a path that names Windchill or FlexPLM, whatever
          the file is called, for a web shell that does not keep the reported naming.
          Patch and plug-in deployment write here too and arrive as many files from one
          installer process; a single file written by the Java process itself is the
          other shape.
        query: |
          #event_simpleName=NewScriptWritten
          | TargetFileName=/\.jspx?$/i
          | TargetFileName=/[\\\/](Windchill|FlexPLM)[^\\\/]*[\\\/]/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: windchill-application-server-process
        name: Java or web server process that belongs to Windchill
        purpose: >-
          Return the Java, Tomcat and Apache processes whose command line names
          Windchill or FlexPLM, with their process ids. A child process event carries
          only its parent's name, java, and not the parent's command line, so this case
          gives the agent the set of process ids that are Windchill, to match against
          the parent process id on the events the next two cases return.
        query: |
          #event_simpleName=ProcessRollup2
          | FileName=/^(java|javaw|jsvc|tomcat\d*w?|httpd|prunsrv|wrapper)(\.exe)?$/i
          | CommandLine=/windchill|flexplm/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: java-spawned-windows-shell-transfer-or-archive-tool
        name: Java process starting a shell, transfer tool or archiver on Windows
        purpose: >-
          Return shells, transfer tools and archivers whose parent is Java or Tomcat.
          The agent keeps the events whose parent process id is a Windchill process from
          the previous case. A web shell that reads and writes files through Java's own
          classes starts no process and is not seen here.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(java|javaw|tomcat\d*w?)\.exe$/i
          | FileName=/^(cmd|powershell|pwsh|curl|certutil|bitsadmin|tar|7z|7za|zip|rar)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: java-spawned-unix-shell-transfer-or-archive-tool
        name: Java process starting a shell, transfer tool or archiver on Linux
        purpose: >-
          The same for Linux servers. Windchill's own start and stop scripts run shells
          under Java; those repeat with the same command line and name files under the
          install directory.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ParentBaseFileName=/^(java|jsvc|tomcat[0-9]*)$/
          | FileName=/^(sh|bash|dash|curl|wget|tar|zip|7z|7za|python[0-9.]*|perl|nc|ncat)$/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-naming-file-listing-artefact
        name: Command that names flst.txt
        purpose: >-
          Return any command that names flst.txt, the file listing reported beside the
          web shell. A listing written from inside the JSP leaves no command.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/\bflst\.txt\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: application_server_child_command
      name: Application server started a shell, transfer tool or archiver
      description: >-
        The Java process that serves Windchill or FlexPLM is the parent of a command
        interpreter, a download utility or an archiver. The agent establishes that the
        parent is Windchill by matching the parent process id to a process the
        server-process case returned.
      source: process_creation
      field: command_line
      indicates: web_shell_command_execution

  supporting:
    - id: hex_named_jsp_written
      name: Hex-named JSP written under a login directory
      description: >-
        A .jsp file with a sixteen-character hex name was written under a login
        directory.
      source: file_creation
      field: file_path
      indicates: web_shell_dropped
    - id: parent_is_windchill_server
      name: Parent process id is a Windchill server process
      description: >-
        The command's parent process id is that of a Java or Tomcat process whose
        command line names Windchill or FlexPLM.
      source: process_creation
      field: parent_process_id
      indicates: exploited_application_server
    - id: service_account_runs_command
      name: Command runs as the application service account
      description: >-
        The user on the command is the account the Windchill service runs under.
      source: process_creation
      field: user
      indicates: command_execution_through_web_application
    - id: transfer_or_archive_tool_used
      name: Child is a transfer tool or an archiver
      description: >-
        The child is curl, wget, certutil, tar, zip or 7z rather than a bare shell.
      source: process_creation
      field: image_name
      indicates: tool_transfer_or_data_staging
    - id: jsp_then_command_within_minutes
      name: JSP write precedes the first command by minutes
      description: >-
        The JSP write and the first shell under the Windchill process fall within
        minutes on the same host. The agent derives this from the timestamps of the
        returned events.
      source: file_creation
      field: host
      indicates: exploitation_followed_by_use

  contradicting:
    - id: scheduled_patch_or_deployment
      name: Server was being patched or deployed to
      description: >-
        Change records show a Windchill patch, plug-in deployment or vendor support
        session at the time.
      source: asset_inventory
      field: ComputerName
      indicates: authorised_maintenance
    - id: recurring_server_helper_command
      name: Same command recurs from the server
      description: >-
        The command line recurs unchanged on the host over weeks and names files under
        the install directory.
      source: baseline
      field: CommandLine
      indicates: routine_application_helper

  risk_logic:
    required:
      - application_server_child_command

    supporting:
      any:
        - hex_named_jsp_written
        - parent_is_windchill_server
        - service_account_runs_command
        - transfer_or_archive_tool_used
        - jsp_then_command_within_minutes
      all:
        - parent_is_windchill_server
        - hex_named_jsp_written

    contradicting:
      any:
        - scheduled_patch_or_deployment
        - recurring_server_helper_command
      all: []

  verdict:
    low_risk_when:
      - application_server_child_command
      - scheduled_patch_or_deployment
      - recurring_server_helper_command
    suspicious_when:
      - application_server_child_command
      - parent_is_windchill_server
    high_risk_when:
      - application_server_child_command
      - parent_is_windchill_server
      - hex_named_jsp_written

  false_positive:
    - condition: Windchill patching and plug-in deployment.
      explanation: >-
        Installers write many JSP files under the application path in one run, with
        descriptive names, and the change is on record.
    - condition: Windchill start, stop and indexing scripts.
      explanation: >-
        The server runs shell scripts of its own. They repeat with the same command line
        and stay inside the install directory.
    - condition: Other Java applications on the same host.
      explanation: >-
        The two Java-parent cases return children of any Java process. Only those whose
        parent process id is a Windchill process belong to this hunt; the rest are
        H105's subject.
