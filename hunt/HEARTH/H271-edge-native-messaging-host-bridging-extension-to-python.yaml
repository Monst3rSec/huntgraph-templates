# Converted from THORCollective/HEARTH Flames/H271.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h271-edge-native-messaging-host-bridging-extension-to-python-t1176-001
version: 1.0.0

info:
  name: Edge native messaging host registered to run an interpreter for a sideloaded extension
  description: >-
    A browser extension is sandboxed; a native messaging host is not. UNC6692's
    Edgecution backdoor registers a host manifest under
    HKCU\SOFTWARE\Microsoft\Edge\NativeMessagingHosts so that a sideloaded extension can
    pass commands to a Python process running as the user. When an extension connects,
    the browser starts the host through cmd.exe with the calling extension's origin,
    chrome-extension://<id>/, as an argument, and that argument stays on the command
    line of the host process. The hunt returns interpreters started that way, host
    launches whose path is in a user-writable directory, the registry writes that
    register a host, and commands that do the same through reg.exe or PowerShell. The
    manifest JSON on disk is not reported by the sensor. Loading of the unpacked
    extension itself is covered by H066.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - browser-extensions
    - native-messaging
    - microsoft-edge
    - unc6692
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H271.md
    - https://attack.mitre.org/techniques/T1176
    - https://attack.mitre.org/techniques/T1176/001
    - https://attack.mitre.org/detectionstrategies/DET0044

mitre:
  tactics:
    - TA0003
  techniques:
    - T1176
  sub_techniques:
    - T1176.001
  detection_strategies:
    - DET0044
  analytics:
    - AN0123
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - Windows Registry Key Modification

hypothesis:
  statement: >-
    Threat actors are registering malicious Microsoft Edge native messaging host
    manifests through HKCU\SOFTWARE\Microsoft\Edge\NativeMessagingHosts registry
    sub-keys to bridge a sideloaded browser extension with a Python-based host process,
    enabling arbitrary command execution beyond the browser sandbox on compromised
    endpoints.
  attacker_behavior:
    - Creates a sub-key under HKCU\SOFTWARE\Microsoft\Edge\NativeMessagingHosts pointing
      at a manifest named com.<random>.api.json.
    - Sets an AppKey value under HKCU\SOFTWARE\Microsoft\Edge.
    - Sideloads an extension that opens a native messaging port to the host.
    - Runs a Python host that executes shell and PowerShell commands sent by the extension.
  legitimate_behavior:
    - Password managers, conferencing clients and smart-card middleware register native
      messaging hosts.
    - Their hosts are signed executables under Program Files or a per-user install directory.
    - Developers build and register hosts of their own while testing extensions.
  risk_indicator:
    - The host process is python, PowerShell or a script host rather than a vendor executable.
    - The host path is under AppData, ProgramData, Public or Temp.
    - The manifest name is a random com.<string>.api pattern.
    - The registration is written by a script, a shell or an unknown binary.
    - Shells and discovery commands appear under the host process.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: interpreter-started-as-native-messaging-host
        name: Script interpreter started with an extension origin argument
        purpose: >-
          Return interpreters whose command line carries a chrome-extension:// origin,
          the argument the browser hands a native messaging host. The browser's direct
          child is cmd.exe, and the interpreter is cmd's child, so no parent test is
          applied. Vendor hosts are almost always executables of their own and do not
          match.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(python[0-9.]*w?|pythonw|py|powershell|pwsh|wscript|cscript|node|mshta)\.exe$/i
          | CommandLine=/chrome-extension:\/\/[a-p]{32}\//
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: native-host-launched-from-user-writable-path
        name: Native messaging host launched from a user-writable directory
        purpose: >-
          Return the cmd.exe launcher a Chromium browser starts for a native host, where
          the host path is under a directory the user can write to. Per-user installs of
          legitimate software also live in AppData, so the agent reads the path and the
          extension id.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(msedge|chrome)\.exe$/i
          | FileName=/^cmd\.exe$/i
          | CommandLine=/chrome-extension:\/\/[a-p]{32}\//
          | CommandLine=/\\(AppData|ProgramData|Users\\Public|Windows\\Temp)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: native-messaging-host-key-written
        name: Value written under a NativeMessagingHosts key
        purpose: >-
          Return registry writes under the Edge and Chrome NativeMessagingHosts keys, in
          the user or machine hive, with the manifest path in the data. It depends on
          the sensor reporting writes under these keys, which no other template relies
          on; confirm in the tenant.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\Software\\(Microsoft\\Edge|Google\\Chrome)\\NativeMessagingHosts\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: edge-appkey-value-written
        name: AppKey value written under the Edge key
        purpose: >-
          Return writes of the AppKey value the reported backdoor leaves beside the host
          registration. Same dependence on registry coverage as the case above.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\Software\\Microsoft\\Edge(\\AppKey)?\\?$/i
          | RegValueName=/^AppKey$/i or RegObjectName=/\\AppKey\\?$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-registering-native-messaging-host
        name: Command naming a NativeMessagingHosts key
        purpose: >-
          Return reg.exe, PowerShell and cmd commands that name the key, which is how a
          script or an operator registers a host and is visible whatever the registry
          coverage.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(reg|powershell|pwsh|cmd)\.exe$/i
          | CommandLine=/NativeMessagingHosts/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: interpreter_native_host
      name: Interpreter running as a native messaging host
      description: >-
        A script interpreter or a host under a user-writable path was started with a
        chrome-extension:// origin argument, so a browser extension is driving it.
      source: process_creation
      field: command_line
      indicates: extension_bridged_to_host_process

  supporting:
    - id: host_registration_written
      name: Native messaging host registered in the registry
      description: >-
        A value was written under an Edge or Chrome NativeMessagingHosts key naming a
        manifest.
      source: registry
      field: registry_path
      indicates: native_host_registered
    - id: manifest_in_writable_path
      name: Manifest path is user-writable or randomly named
      description: >-
        The registered manifest sits under AppData, ProgramData or Temp, or follows the
        com.<random>.api.json pattern.
      source: registry
      field: registry_data
      indicates: non_vendor_manifest
    - id: registration_by_command
      name: Registration made from a shell
      description: >-
        reg.exe, PowerShell or cmd named the NativeMessagingHosts key on its command
        line.
      source: process_creation
      field: command_line
      indicates: scripted_registration
    - id: commands_under_host_process
      name: Shells or discovery tools under the host
      description: >-
        The host interpreter started shells, PowerShell or discovery utilities. The
        agent derives this by following the host's process id on later events.
      source: process_creation
      field: parent_process_id
      indicates: command_execution_outside_sandbox

  contradicting:
    - id: known_vendor_host
      name: Host belongs to installed vendor software
      description: >-
        The extension id and host path match a password manager, conferencing client or
        middleware product installed on the machine.
      source: baseline
      field: CommandLine
      indicates: approved_browser_integration
    - id: extension_developer
      name: User develops browser extensions
      description: >-
        The account belongs to a developer who builds and tests native messaging hosts.
      source: identity_context
      field: UserName
      indicates: development_activity

  risk_logic:
    required:
      - interpreter_native_host

    supporting:
      any:
        - host_registration_written
        - manifest_in_writable_path
        - registration_by_command
        - commands_under_host_process
      all:
        - host_registration_written
        - manifest_in_writable_path

    contradicting:
      any:
        - known_vendor_host
        - extension_developer
      all: []

  verdict:
    low_risk_when:
      - interpreter_native_host
      - known_vendor_host
      - extension_developer
    suspicious_when:
      - interpreter_native_host
      - manifest_in_writable_path
    high_risk_when:
      - interpreter_native_host
      - manifest_in_writable_path
      - commands_under_host_process

  false_positive:
    - condition: Vendor native messaging hosts.
      explanation: >-
        Password managers and conferencing clients register hosts and are started the
        same way. Their hosts are signed executables at stable paths and their extension
        ids are published.
    - condition: Extension development.
      explanation: >-
        A developer's host is often a Python or Node script in a project folder. The
        account is a developer's and the extension is their own.
