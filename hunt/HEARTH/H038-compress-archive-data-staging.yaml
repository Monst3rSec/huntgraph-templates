# Converted from THORCollective/HEARTH Flames/H038.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h038-compress-archive-data-staging-t1560-001
version: 1.0.0

info:
  name: Compress-Archive used to package stolen data for exfiltration
  description: >-
    Compress-Archive ships with PowerShell, so a stealer written in PowerShell needs no
    archiver of its own. The KimJongRAT variant gathers browser profiles, credentials and
    documents into a working folder, zips the folder with Compress-Archive and uploads
    the result. The cmdlet is equally common in build scripts and administration, so the
    hunt returns it when the source or destination gives it away: browser and credential
    stores, user document trees, and archives written to temporary or public
    directories.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - collection
    - archive
    - powershell
    - infostealer
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H038.md
    - https://attack.mitre.org/techniques/T1560
    - https://attack.mitre.org/techniques/T1560/001
    - https://attack.mitre.org/detectionstrategies/DET0298
    - https://unit42.paloaltonetworks.com/kimjongrat-stealer-variant-powershell/

mitre:
  tactics:
    - TA0009
  techniques:
    - T1560
  sub_techniques:
    - T1560.001
  detection_strategies:
    - DET0298
  analytics:
    - AN0831
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    Threat actors are using PowerShell's Compress-Archive cmdlet to compress stolen
    victim data into ZIP archives for exfiltration to attacker-controlled servers.
  attacker_behavior:
    - Copies browser profiles, credential stores and documents into a working folder under Temp or AppData.
    - Runs Compress-Archive over that folder to produce one zip.
    - Uploads the zip with Invoke-WebRequest, Invoke-RestMethod or a web client and deletes it.
    - Issues the whole sequence from a hidden PowerShell process started by a loader or script host.
  legitimate_behavior:
    - Build and release scripts package artefacts with Compress-Archive.
    - Administrators zip logs and configuration for a support case.
    - Users and backup scripts archive their own folders.
  risk_indicator:
    - The source path is a browser profile, a credential store or another user's profile.
    - The archive is written to Temp, Public or ProgramData.
    - The same command line or the same parent then uploads a file.
    - PowerShell was started hidden or by a script host, an Office application or an unknown binary.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ZipFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: compress-archive-over-sensitive-stores
        name: Compress-Archive over browser, credential or profile data
        purpose: >-
          Return Compress-Archive commands whose paths include browser profiles,
          credential stores or user data trees, the content a stealer packages.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/Compress-Archive/i
          | CommandLine=/\\(Google\\Chrome|Microsoft\\Edge|BraveSoftware|Mozilla\\Firefox|Opera Software)\\|User Data|Login Data|\\Microsoft\\(Credentials|Protect|Vault)\\|\\(Documents|Desktop|Downloads)\b|\.(kdbx|pfx|ppk|ovpn|rdp)\b|wallet/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: compress-archive-to-scratch-path
        name: Compress-Archive writing to a temporary or public directory
        purpose: >-
          Return Compress-Archive commands whose destination is a scratch location,
          where staged archives wait to be uploaded.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/Compress-Archive/i
          | CommandLine=/-(dest|destinationpath)\w*\s+\S*(\\Temp\\|\\Users\\Public\\|\\ProgramData\\|\\PerfLogs\\|\$env:(TEMP|TMP|PUBLIC|APPDATA|LOCALAPPDATA))/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: compress-archive-then-upload
        name: Compress-Archive and an upload in one command line
        purpose: >-
          Return command lines that both archive and send, the complete collection and
          exfiltration step in one process.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/Compress-Archive/i
          | CommandLine=/Invoke-WebRequest|Invoke-RestMethod|\b(iwr|irm)\b|UploadFile|UploadData|-Method\s+(Post|Put)|-InFile\b|Net\.WebClient|HttpClient/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: zip-written-by-powershell-to-scratch-path
        name: Zip file written by PowerShell into a scratch directory
        purpose: >-
          Return archives PowerShell wrote under temporary and public directories, which
          catches the cmdlet when it is called from a script file and never appears on a
          command line.
        query: |
          #event_simpleName=ZipFileWritten
          | ContextBaseFileName=/^(powershell|pwsh)\.exe$/i
          | TargetFileName=/\\(AppData\\Local\\Temp|Windows\\Temp|Users\\Public|ProgramData|PerfLogs)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: compress_archive_command
      name: Compress-Archive packaging data
      description: >-
        A PowerShell command line calls Compress-Archive with a source and destination
        path, or PowerShell is recorded writing a zip file.
      source: process_creation
      field: command_line
      indicates: data_archived_for_staging

  supporting:
    - id: sensitive_source_paths
      name: Source includes browser, credential or user data
      description: >-
        The paths on the command line name browser profiles, credential stores, key
        files or user document folders.
      source: process_creation
      field: command_line
      indicates: sensitive_data_collection
    - id: archive_in_scratch_path
      name: Archive written to a scratch directory
      description: >-
        A zip written by PowerShell lands under Temp, Public, ProgramData or PerfLogs.
      source: file_creation
      field: file_path
      indicates: staging_outside_normal_storage
    - id: archive_writer_is_powershell
      name: Archive writer is PowerShell
      description: >-
        The process named on the zip-written event is PowerShell, tying the file to the
        cmdlet and not to an archiver or a browser download.
      source: file_creation
      field: writer_process_name
      indicates: script_created_archive
    - id: loader_or_script_parent
      name: PowerShell started by a script host or unknown binary
      description: >-
        The parent is a script host, an Office application, a scheduled-task host or an
        executable in a writable path.
      source: process_creation
      field: parent_process
      indicates: abnormal_execution_chain

  contradicting:
    - id: build_or_release_job
      name: Command belongs to a build or release job
      description: >-
        The host is a build agent or developer machine and the paths are project output
        directories.
      source: asset_inventory
      field: ComputerName
      indicates: expected_build_activity
    - id: recurring_archive_job
      name: Same archive command recurs on schedule
      description: >-
        Earlier activity shows the identical command line on this host at regular
        intervals.
      source: baseline
      field: CommandLine
      indicates: established_automation

  risk_logic:
    required:
      - compress_archive_command

    supporting:
      any:
        - sensitive_source_paths
        - archive_in_scratch_path
        - archive_writer_is_powershell
        - loader_or_script_parent
      all:
        - sensitive_source_paths
        - archive_in_scratch_path

    contradicting:
      any:
        - build_or_release_job
        - recurring_archive_job
      all: []

  verdict:
    low_risk_when:
      - compress_archive_command
      - build_or_release_job
      - recurring_archive_job
    suspicious_when:
      - compress_archive_command
      - sensitive_source_paths
    high_risk_when:
      - compress_archive_command
      - sensitive_source_paths
      - archive_in_scratch_path
      - loader_or_script_parent

  false_positive:
    - condition: Build and release pipelines package output.
      explanation: >-
        Compress-Archive is a staple of build scripts. The sources are project
        directories, the host is a build agent and the job repeats.
    - condition: An administrator zips logs for a support case.
      explanation: >-
        The source is a log or configuration directory, the account is administrative,
        and a ticket usually exists.
    - condition: A user archives their own documents.
      explanation: >-
        The Documents and Desktop match is broad on purpose. An interactive user zipping
        one folder to their own profile is ordinary; a hidden PowerShell process doing it
        to Temp is not.
