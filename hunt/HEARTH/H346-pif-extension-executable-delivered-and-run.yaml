# Converted from THORCollective/HEARTH Flames/H346.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# HEARTH also cites T1204.001 and T1566.002. The mismatch between the requested
# URL and the delivered file is proxy and gateway evidence and is not collected.
type: detection

id: hg-win-hearth-h346-pif-extension-executable-delivered-and-run-t1036-008
version: 1.0.0

info:
  name: Executable with a .pif extension written and run
  description: >-
    A DarkMe phishing link ending in .png returned image.pif, a 64-bit executable with
    forged version information. Windows still runs a PE that carries the .pif extension,
    Explorer labels it a shortcut to an MS-DOS program, and extension lists built around
    .exe and .scr often leave it out. The extension has almost no legitimate use in
    process telemetry on a current estate. The redirect from an image URL to an
    executable is seen at the web gateway and not by the sensor; the hunt returns the
    .pif written to disk, the .pif running, and what it starts. AutoIt-based loaders
    that rename their interpreter to .pif are returned by the same cases.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - defense-evasion
    - masquerading
    - pif
    - file-type
    - darkme
    - phishing
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H346.md
    - https://attack.mitre.org/techniques/T1036
    - https://attack.mitre.org/techniques/T1036/008
    - https://attack.mitre.org/detectionstrategies/DET0226

mitre:
  tactics:
    - TA0005
  techniques:
    - T1036
  sub_techniques:
    - T1036.008
  detection_strategies:
    - DET0226
  analytics:
    - AN0630
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    A phishing link whose URL ends in .png is returning a PE32+ executable with a .pif
    extension and forged version metadata, relying on .pif still being an executable
    file type on modern Windows while browsers, mail gateways and users all treat the
    requested extension as the real one, so the dropper reaches disk and runs from a
    user-writable path with an extension that essentially never appears in legitimate
    execution telemetry.
  attacker_behavior:
    - Serves a PE with a .pif extension from a link that names an image or document.
    - Relies on the user opening the download from the browser or Downloads folder.
    - Runs msiexec or a script host from the .pif to fetch the next stage.
    - Gives the file version information that names a security product.
  legitimate_behavior:
    - Very old line-of-business software ships .pif shortcuts for DOS programs.
    - Those shortcuts are not PE files and start a 16-bit or console program.
  risk_indicator:
    - A process image path ends in .pif.
    - The .pif was written by a browser, a mail client or an archive tool.
    - The file sits in Downloads, Temp, AppData or another user-writable directory.
    - The .pif process starts msiexec, a shell or a script host.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: process-image-with-pif-extension
        name: Process whose image has a .pif extension
        purpose: >-
          Return every process whose image path ends in .pif. The sensor reports the
          path as executed, so a PE renamed to .pif appears here whatever its metadata
          claims.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ImageFileName=/\.pif$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: pe-file-written-with-pif-extension
        name: PE file written with a .pif extension
        purpose: >-
          Return PE files written with a .pif extension and the process that wrote them.
          The event fires on PE content, so a true DOS shortcut is not returned. A
          browser download is written under a temporary name and renamed; where the
          rename is not reported as a write, the file is seen first when it runs.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\.pif$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: process-started-by-pif-image
        name: Process started by a .pif image
        purpose: >-
          Return the children of a process whose file name ends in .pif: the installer
          fetch, the shell or the script host that carries the next stage.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/\.pif$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-line-running-pif-file
        name: Shell or launcher command line naming a .pif file
        purpose: >-
          Return shells, Explorer and script hosts whose command line names a .pif file,
          which covers a .pif started through cmd /c start or a script and the copy
          commands AutoIt loaders use to build one.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(cmd|powershell|pwsh|explorer|wscript|cscript|mshta|rundll32)\.exe$/i
          | CommandLine=/\.pif("|\s|$)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: pif_image_executed
      name: Executable with a .pif extension ran
      description: >-
        A process image path ends in .pif.
      source: process_creation
      field: image_path
      indicates: masqueraded_file_type_execution

  supporting:
    - id: pif_pe_written
      name: PE written to disk as .pif
      description: >-
        A file with PE content and a .pif extension was written on the host.
      source: file_creation
      field: file_path
      indicates: executable_delivered_under_legacy_extension
    - id: pif_written_by_browser_or_mail
      name: Writer is a browser, mail client or archive tool
      description: >-
        The process that wrote the .pif is a browser, Outlook or an archive utility.
      source: file_creation
      field: writer_process_name
      indicates: user_delivered_download
    - id: pif_in_user_writable_path
      name: File runs from a user-writable directory
      description: >-
        The image is under Downloads, Temp, AppData, Desktop or Users\Public.
      source: process_creation
      field: image_path
      indicates: unmanaged_execution_location
    - id: pif_started_next_stage
      name: .pif process started an installer, shell or script host
      description: >-
        A child of the .pif process is msiexec, cmd, PowerShell or a script host.
      source: process_creation
      field: parent_process
      indicates: dropper_follow_on_execution

  contradicting:
    - id: legacy_application_host
      name: Host runs legacy software that ships .pif files
      description: >-
        The host has a documented legacy application whose .pif shortcuts are in its
        install directory.
      source: asset_inventory
      field: ComputerName
      indicates: legacy_software
    - id: pif_long_established
      name: Same .pif has run on the host for a long time
      description: >-
        Earlier activity shows the same path running regularly over a long period.
      source: baseline
      field: ImageFileName
      indicates: established_execution

  risk_logic:
    required:
      - pif_image_executed

    supporting:
      any:
        - pif_pe_written
        - pif_written_by_browser_or_mail
        - pif_in_user_writable_path
        - pif_started_next_stage
      all:
        - pif_written_by_browser_or_mail
        - pif_in_user_writable_path

    contradicting:
      any:
        - legacy_application_host
        - pif_long_established
      all: []

  verdict:
    low_risk_when:
      - pif_image_executed
      - legacy_application_host
      - pif_long_established
    suspicious_when:
      - pif_image_executed
      - pif_in_user_writable_path
    high_risk_when:
      - pif_image_executed
      - pif_in_user_writable_path
      - pif_started_next_stage

  false_positive:
    - condition: Legacy software keeps .pif shortcuts.
      explanation: >-
        They sit in the application's folder, have been there for years and are not PE
        files, so the file-write case does not return them.
