# Converted from THORCollective/HEARTH Flames/H124.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h124-system-dll-name-written-to-user-writable-path-t1574-001
version: 1.0.0

info:
  name: DLL carrying a Windows system library name written to a user-writable path
  description: >-
    A Windows program looks in its own folder for a library before it looks in System32.
    A file named CRYPTBASE.dll or VERSION.dll placed beside a signed executable is
    therefore loaded in place of the real one. In the STXRAT case a trojanised CPU-Z
    package carried a malicious CRYPTBASE.dll that the signed CPU-Z binary loaded on
    start. The load is a Module Load event, which this deployment does not collect, and
    the hunt does not claim it. It reads the step before: a DLL with one of the
    system-library names HijackLibs lists as commonly side-loaded being written into
    Downloads, AppData, ProgramData, a Temp folder or the Public profile. A file with
    that name in such a place has no reason to exist other than to be found first.
    Whether it was then loaded, and by what, the agent has to establish from the
    processes that ran from the same folder.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - stealth
    - dll-side-loading
    - search-order-hijacking
    - cryptbase
    - stxrat
    - trojanised-installer
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H124.md
    - https://attack.mitre.org/techniques/T1574
    - https://attack.mitre.org/techniques/T1574/001
    - https://attack.mitre.org/detectionstrategies/DET0201
    - https://blog.deception.pro/blog/cpuz-trojan-stxrat-purelogs-data-exfil-april-2026
    - https://hijacklibs.net/entries/microsoft/built-in/cryptbase.html

mitre:
  tactics:
    - TA0005
  techniques:
    - T1574
  sub_techniques:
    - T1574.001
  detection_strategies:
    - DET0201
  analytics:
    - AN0577
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - File Creation

hypothesis:
  statement: >-
    An adversary is side-loading a malicious DLL (such as CRYPTBASE.dll) by placing it
    in the same directory as a legitimate signed executable, indicated by known-abused
    DLLs loading from user-writable paths rather than System32.
  attacker_behavior:
    - Ships a signed application together with a DLL named after a system library it imports.
    - Unpacks both into Downloads, AppData, ProgramData or a Temp folder.
    - Starts the signed application, which loads the planted DLL from its own folder.
    - Runs the payload inside the trusted process.
  legitimate_behavior:
    - Applications redistribute dbghelp.dll and a few other Microsoft libraries in their own folders.
    - Game modifications and overlays use version.dll and winmm.dll as proxy libraries.
    - Installers unpack their own copies into a Temp folder during setup.
  risk_indicator:
    - The DLL name is a system library that is never redistributed, such as cryptbase.dll.
    - The folder is Downloads, a Temp extraction folder or a new folder under ProgramData.
    - The file was written by an archive tool, a browser or a script host.
    - The hash is not a Microsoft build of that library.
    - A signed executable ran from the same folder straight afterwards.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId
        file_hash: SHA256HashData
        writer_process_name: ContextBaseFileName

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: system-dll-name-written-under-user-profile
        name: System library name written under a user profile
        purpose: >-
          Return DLLs with a commonly side-loaded system-library name written anywhere
          under a user's Downloads, Desktop, Documents or AppData folders, with path,
          hash and writing process. The file name is anchored at the end of the path and
          tested first.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\(cryptbase|version|dbghelp|winmm|wtsapi32|userenv|profapi|dwmapi|uxtheme|winhttp|iphlpapi|netapi32|sspicli|cryptsp|dbgcore|msimg32|propsys|secur32|wldp|edputil|textshaping)\.dll$/i
          | TargetFileName=/\\Users\\[^\\]+\\(Downloads|Desktop|Documents|AppData)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: system-dll-name-written-to-shared-writable-path
        name: System library name written to ProgramData, Temp or the Public profile
        purpose: >-
          Return the same names written under ProgramData, Windows\Temp, PerfLogs or the
          Public profile, the locations a payload dropped with elevation uses.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\(cryptbase|version|dbghelp|winmm|wtsapi32|userenv|profapi|dwmapi|uxtheme|winhttp|iphlpapi|netapi32|sspicli|cryptsp|dbgcore|msimg32|propsys|secur32|wldp|edputil|textshaping)\.dll$/i
          | TargetFileName=/\\(ProgramData|Windows\\Temp|PerfLogs|Users\\Public)\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: system_dll_name_in_writable_path
      name: System library name written to a user-writable path
      description: >-
        A DLL named after a Windows system library was written into a user profile,
        ProgramData, a Temp folder or the Public profile.
      source: file_creation
      field: file_path
      indicates: dll_planted_for_search_order_hijack

  supporting:
    - id: written_by_unpacker_or_script
      name: Written by an archive tool, browser or script host
      description: >-
        The writing process is an archive utility, a browser, an installer run from
        Downloads or a script interpreter.
      source: file_creation
      field: writer_process_name
      indicates: delivered_in_a_package
    - id: writer_dropped_companion_executable
      name: Same writer placed an executable beside it
      description: >-
        The same writing process id wrote an executable into the same folder. The agent
        looks this up from the process id; this template does not return those writes.
      source: file_creation
      field: writer_process_id
      indicates: signed_host_application_bundled
    - id: hash_not_microsoft_build
      name: Hash is not a Microsoft build of the library
      description: >-
        The hash on the event is unknown to reputation sources as the system library of
        that name.
      source: file_creation
      field: file_hash
      indicates: impostor_library

  contradicting:
    - id: vendor_redistributed_library
      name: Library is part of an installed product
      description: >-
        The same path and hash are present across the fleet as part of a known
        application.
      source: baseline
      field: SHA256HashData
      indicates: legitimate_redistributable
    - id: known_good_hash
      name: Hash is a genuine Microsoft library
      description: >-
        Reputation sources identify the hash as Microsoft's own build.
      source: threat_intel
      field: SHA256HashData
      indicates: genuine_system_library

  risk_logic:
    required:
      - system_dll_name_in_writable_path

    supporting:
      any:
        - written_by_unpacker_or_script
        - writer_dropped_companion_executable
        - hash_not_microsoft_build
      all:
        - written_by_unpacker_or_script
        - hash_not_microsoft_build

    contradicting:
      any:
        - vendor_redistributed_library
        - known_good_hash
      all: []

  verdict:
    low_risk_when:
      - system_dll_name_in_writable_path
      - vendor_redistributed_library
    suspicious_when:
      - system_dll_name_in_writable_path
      - hash_not_microsoft_build
    high_risk_when:
      - system_dll_name_in_writable_path
      - hash_not_microsoft_build
      - written_by_unpacker_or_script

  false_positive:
    - condition: Applications that ship dbghelp.dll.
      explanation: >-
        Many products install their own dbghelp.dll, some under AppData. The path is the
        product's folder and the hash is Microsoft's.
    - condition: Game modifications and overlays.
      explanation: >-
        version.dll and winmm.dll proxies are a common way to load a mod. They sit in
        game folders on machines where games are played.
    - condition: Installers unpacking into Temp.
      explanation: >-
        A setup program may carry genuine copies of system libraries. They are removed
        when setup ends and the writer is the installer.
