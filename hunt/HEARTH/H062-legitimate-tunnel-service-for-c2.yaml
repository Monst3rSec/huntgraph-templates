# Converted from THORCollective/HEARTH Flames/H062.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h062-legitimate-tunnel-service-for-c2-t1572
version: 1.0.0

info:
  name: Legitimate tunnelling service used to reach a command and control server
  description: >-
    TryCloudflare, Microsoft Dev Tunnels, VS Code tunnels and ngrok let a program on an
    endpoint make an outbound connection to the provider, which then hands inbound
    traffic back down it. Developers use them to share a local web service. Malware uses
    them because the endpoint only ever talks to Cloudflare or Microsoft over TLS, so
    firewalls and reputation lists see nothing wrong. HEARTH is explicit that the tools'
    presence is a weak signal by itself. The hunt therefore returns the tunnel clients
    with what started them and where they ran from, and the DNS requests for tunnel
    domains with the process that made them, so the agent can separate a developer's
    session from a tunnel opened by a script or an implant.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - command-and-control
    - tunnel
    - cloudflared
    - dev-tunnels
    - ngrok
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H062.md
    - https://attack.mitre.org/techniques/T1572
    - https://attack.mitre.org/detectionstrategies/DET0538
    - https://isc.sans.edu/diary/31724
    - https://www.sentinelone.com/labs/operation-digital-eye-chinese-apt-compromises-critical-digital-infrastructure-via-visual-studio-code-tunnels/

mitre:
  tactics:
    - TA0011
  techniques:
    - T1572
  sub_techniques: []
  detection_strategies:
    - DET0538
  analytics:
    - AN1483
    - AN1484
    - AN1485
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - WinEventLog:Sysmon
    - linux:osquery
    - macos:unifiedlog
  data_components:
    - Process Creation
    - Network Traffic Content

hypothesis:
  statement: >-
    An adversary is making use of legitimate tunnelling services such as TryCloudflare
    and Microsoft Dev Tunnels in their malware to bypass firewalls and establish a
    connection to a command and control server.
  attacker_behavior:
    - Runs cloudflared with a quick tunnel to expose a local port without an account.
    - Starts a VS Code tunnel or devtunnel host as a service so the host is reachable from a browser.
    - Uses ngrok or a similar client with a token to forward RDP, SSH or a SOCKS port.
    - Drops the client into a temporary or user-writable directory under a changed name.
    - Has malware call a trycloudflare.com or devtunnels.ms hostname as its command and control address.
  legitimate_behavior:
    - Developers share local web services and use remote development tunnels.
    - Operations teams run named Cloudflare tunnels for published internal applications.
    - Demonstrations and webhook testing rely on ngrok and similar tools.
  risk_indicator:
    - The tunnel client runs on a server or a non-developer workstation.
    - The parent is a script host, a service, a scheduled task or an unknown binary.
    - The client's image is in a temporary or user-writable path, or is renamed.
    - The forwarded port is 3389, 22, 445 or a proxy port.
    - A tunnel domain is resolved by a process that is not a browser or a known developer tool.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: tunnel-client-by-image-name
        name: Tunnel client executed
        purpose: >-
          Return runs of the tunnel clients by image name on any platform, with the
          command line that shows what was exposed.
        query: |
          #event_simpleName=ProcessRollup2
          | ImageFileName=/[\\\/](cloudflared|devtunnel|ngrok|code-tunnel|localtunnel|bore|pinggy|zrok|tailscale-funnel)[^\\\/]*$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: tunnel-arguments-on-command-line
        name: Tunnel arguments on a command line
        purpose: >-
          Return invocations by argument shape, which survives renaming the binary: a
          quick tunnel URL, a devtunnel host, a VS Code tunnel or an ngrok forward.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/\stunnel\s+(--url|run|--no-autoupdate|--accept-server-license-terms|service\s+install)|\sdevtunnel\s+(host|create|port)|\scode(\.exe)?"?\s+tunnel\b|\sngrok\s+(tcp|http|tls|start)\b|\s--url\s+(tcp|rdp|ssh|http):\/\/(localhost|127\.0\.0\.1)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: tunnel-domain-requested-by-non-browser
        name: Tunnel service domain resolved by a non-browser process
        purpose: >-
          Return DNS requests for tunnel hostnames made by anything other than a
          browser, which catches malware that calls a tunnel URL and never runs a tunnel
          client.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)(trycloudflare\.com|devtunnels\.ms|tunnels\.api\.visualstudio\.com|ngrok\.io|ngrok-free\.app|ngrok\.app|ngrok\.dev|loca\.lt|pinggy\.io|serveo\.net|localhost\.run|zrok\.io)$/i
          | ContextBaseFileName!=/^(chrome|msedge|firefox|brave|opera|safari|Google Chrome.*|Microsoft Edge.*|com\.apple\.WebKit.*)(\.exe)?$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: tunnel_service_use
      name: Tunnelling service used from the host
      description: >-
        A tunnel client ran on the host, a command line carries tunnel arguments, or a
        non-browser process resolved a tunnel service domain.
      source: process_creation
      field: command_line
      indicates: protocol_tunnel_through_third_party_service

  supporting:
    - id: unattended_launcher
      name: Tunnel started by a script, service or unknown binary
      description: >-
        The parent is a script host, a service or scheduler, or an executable in a
        writable path, not a terminal or an IDE.
      source: process_creation
      field: parent_process
      indicates: unattended_persistent_tunnel
    - id: client_in_writable_path
      name: Client binary in a temporary or user-writable path
      description: >-
        The tunnel client's image is under Temp, Downloads, ProgramData, Public or a
        hidden directory, not an installed location.
      source: process_creation
      field: image_path
      indicates: portable_tool_deployment
    - id: tunnel_domain_by_odd_process
      name: Tunnel hostname resolved by an unexpected process
      description: >-
        The process that resolved the tunnel domain is a script interpreter, a system
        utility or an unknown binary.
      source: dns_request
      field: process_name
      indicates: malware_using_tunnel_endpoint
    - id: tunnel_hostname
      name: Specific tunnel hostname requested
      description: >-
        The DNS request names a generated subdomain of a tunnel service, which
        identifies the particular tunnel.
      source: dns_request
      field: query_name
      indicates: tunnel_endpoint_identified
    - id: non_developer_host_user
      name: User or host has no development role
      description: >-
        The account is not a developer and the host is a server or a business
        workstation.
      source: process_creation
      field: user
      indicates: activity_outside_user_role

  contradicting:
    - id: developer_workstation
      name: Host is a developer workstation
      description: >-
        Asset records class the host as a developer machine where tunnel tools are
        expected.
      source: asset_inventory
      field: ComputerName
      indicates: expected_development_activity
    - id: published_tunnel_service
      name: Tunnel is a documented published service
      description: >-
        A change record covers a named tunnel that publishes an internal application
        from this host.
      source: change_management
      field: ComputerName
      indicates: approved_remote_access

  risk_logic:
    required:
      - tunnel_service_use

    supporting:
      any:
        - unattended_launcher
        - client_in_writable_path
        - tunnel_domain_by_odd_process
        - tunnel_hostname
        - non_developer_host_user
      all:
        - unattended_launcher
        - non_developer_host_user

    contradicting:
      any:
        - developer_workstation
        - published_tunnel_service
      all: []

  verdict:
    low_risk_when:
      - tunnel_service_use
      - developer_workstation
    suspicious_when:
      - tunnel_service_use
      - non_developer_host_user
    high_risk_when:
      - tunnel_service_use
      - non_developer_host_user
      - unattended_launcher

  false_positive:
    - condition: Developers use tunnels for their work.
      explanation: >-
        This is the tools' purpose and the bulk of what the hunt returns. A developer
        starts the client from a terminal or IDE on their own machine and exposes a web
        port.
    - condition: An operations team publishes an application through a named tunnel.
      explanation: >-
        Cloudflare tunnels run as an installed service on a known server with a fixed
        configuration and a change record.
    - condition: A web page embeds content hosted on a tunnel domain.
      explanation: >-
        Browsers are excluded from the DNS case, but an embedded web view in another
        application can still resolve one. It is a single lookup with no client and no
        repetition.
