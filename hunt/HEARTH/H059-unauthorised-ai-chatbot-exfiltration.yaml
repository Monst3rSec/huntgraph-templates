# Converted from THORCollective/HEARTH Flames/H059.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h059-unauthorised-ai-chatbot-exfiltration-t1567
version: 1.0.0

info:
  name: Unauthorised AI chatbot platforms used by insiders to move data out
  description: >-
    Pasting or uploading company material into a public AI chatbot hands it to the
    provider, where it may be retained, used for training or exposed if the account is
    compromised. With a personal account the same conversation is reachable from a
    personal device, which makes the chatbot a transfer channel that email and storage
    controls do not cover. Which platforms are unauthorised is the organisation's
    decision. The hunt returns DNS requests for the major chatbot domains and the
    desktop applications and AI browsers that talk to them; how much data was sent is
    not something the sensor measures.
  severity: medium
  author: huntgraph
  tags:
    - hearth
    - exfiltration
    - insider-threat
    - ai-chatbot
    - shadow-it
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H059.md
    - https://attack.mitre.org/techniques/T1567
    - https://attack.mitre.org/detectionstrategies/DET0548
    - https://insiderthreatmatrix.org/articles/AR4/sections/IF001/subsections/IF001.006
    - https://insiderthreatmatrix.org/articles/AR4/sections/IF018/subsections/IF018.002
    - https://www.ncsc.gov.uk/blog-post/chatgpt-and-large-language-models-whats-the-risk

# HEARTH pitches this at T1567 and none of its sub-techniques (code repository, cloud
# storage, text storage site, webhook) describes a chatbot, so the parent is kept as
# upstream wrote it.
mitre:
  tactics:
    - TA0010
  techniques:
    - T1567
  sub_techniques: []
  detection_strategies:
    - DET0548
  analytics:
    - AN1511
    - AN1513
  platforms:
    - Windows
    - macOS
  data_sources:
    - WinEventLog:Security
    - macos:unifiedlog
  data_components:
    - Process Creation
    - Network Traffic Content

hypothesis:
  statement: >-
    Insiders may be using unauthorised AI chatbot platforms for exfiltration, sharing
    sensitive data with the provider or moving it to a personal device through a personal
    account, bypassing other data-loss controls.
  attacker_behavior:
    - Pastes source code, customer data or documents into a chatbot under a personal account.
    - Uploads files to the chatbot and retrieves the conversation later from a personal device.
    - Installs a chatbot desktop application or an AI browser the organisation has not approved.
    - Uses a command-line client or script against a chatbot API with a personal key.
    - Concentrates the activity before leaving the organisation.
  legitimate_behavior:
    - Staff use the chatbot platforms the organisation has licensed and approved.
    - Developers call approved model APIs from code and tools.
    - Browsers resolve chatbot domains through embedded widgets and links without any upload.
  risk_indicator:
    - The domain belongs to a platform not on the approved list.
    - Requests come from a user with access to sensitive data and no approved use case.
    - A chatbot desktop application or AI browser appears on a host that should not have it.
    - Activity rises sharply for one user, or coincides with a resignation.
    - Large files or archives were staged on the host beforehand.

requires:
  platforms:
    - windows
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: ai-chatbot-domain-requested
        name: DNS request for an AI chatbot platform
        purpose: >-
          Return requests for the main chatbot domains. Remove the organisation's
          approved platforms from the pattern before running this over a long window,
          or the result will be dominated by sanctioned use.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)(chatgpt\.com|chat\.openai\.com|claude\.ai|gemini\.google\.com|copilot\.microsoft\.com|perplexity\.ai|chat\.deepseek\.com|chat\.mistral\.ai|grok\.com|poe\.com|you\.com|huggingface\.co|character\.ai|chat\.qwen\.ai|kimi\.com|manus\.im|meta\.ai)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ai-chatbot-requested-by-non-browser
        name: AI chatbot or model API resolved by a non-browser process
        purpose: >-
          Return requests for chatbot and model API domains made by scripts, command-line
          tools and desktop applications, where a file can be sent without a browser
          upload dialog.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)(chatgpt\.com|openai\.com|claude\.ai|anthropic\.com|generativelanguage\.googleapis\.com|perplexity\.ai|deepseek\.com|mistral\.ai|x\.ai|groq\.com|openrouter\.ai|together\.ai|cohere\.com)$/i
          | ContextBaseFileName!=/^(chrome|msedge|firefox|brave|opera|vivaldi|arc|safari|Google Chrome.*|Microsoft Edge.*|Safari.*|com\.apple\.WebKit.*|msedgewebview2)(\.exe)?$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ai-desktop-app-or-browser-executed
        name: AI chatbot desktop application or AI browser executed
        purpose: >-
          Return runs of chatbot desktop clients and AI-first browsers by image name,
          which shows unapproved software as well as use.
        query: |
          #event_simpleName=ProcessRollup2
          | ImageFileName=/[\\\/](ChatGPT|Claude|Perplexity|Comet|Copilot|DeepSeek|Gemini|Ollama|LM Studio|Jan|Poe|Dia|Atlas|ChatGPT Atlas)(\.exe|\.app\/Contents\/MacOS\/[^\/]+)?$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: chatbot_platform_contact
      name: Host contacted an AI chatbot platform
      description: >-
        A DNS request names an AI chatbot or model API domain, or a chatbot desktop
        application or AI browser ran on the host.
      source: dns_request
      field: query_name
      indicates: ai_chatbot_platform_use

  supporting:
    - id: platform_not_approved
      name: Platform is not on the approved list
      description: >-
        The domain or application belongs to a platform the organisation has not
        sanctioned for the user's group.
      source: asset_inventory
      field: DomainName
      indicates: unsanctioned_service_use
    - id: non_browser_client
      name: Request made by a script, tool or desktop client
      description: >-
        The process that resolved the domain is not a browser, which allows file
        contents to be sent programmatically.
      source: dns_request
      field: process_name
      indicates: programmatic_data_transfer
    - id: chatbot_application_present
      name: Chatbot application or AI browser on the host
      description: >-
        A process event shows a chatbot desktop client or an AI browser running from the
        host.
      source: process_creation
      field: image_path
      indicates: unapproved_software_installed
    - id: sensitive_role_user
      name: User handles sensitive data
      description: >-
        The account has access to source code, customer records or financial data, or is
        under heightened monitoring such as a notice period.
      source: process_creation
      field: user
      indicates: elevated_insider_risk

  contradicting:
    - id: approved_platform_and_licence
      name: User holds a licence for the platform
      description: >-
        Identity records show the user is licensed for the platform under the
        organisation's enterprise agreement.
      source: identity_context
      field: UserName
      indicates: sanctioned_service_use
    - id: passive_page_embed
      name: Request is a passive embed or link preview
      description: >-
        The requests are isolated single lookups from a browser with no sustained
        session, as an embedded widget or link preview produces.
      source: derived
      field: DomainName
      indicates: incidental_resolution

  risk_logic:
    required:
      - chatbot_platform_contact

    supporting:
      any:
        - platform_not_approved
        - non_browser_client
        - chatbot_application_present
        - sensitive_role_user
      all:
        - platform_not_approved
        - sensitive_role_user

    contradicting:
      any:
        - approved_platform_and_licence
        - passive_page_embed
      all: []

  verdict:
    low_risk_when:
      - chatbot_platform_contact
      - approved_platform_and_licence
    suspicious_when:
      - chatbot_platform_contact
      - platform_not_approved
    high_risk_when:
      - chatbot_platform_contact
      - platform_not_approved
      - sensitive_role_user

  false_positive:
    - condition: The platform is one the organisation licenses.
      explanation: >-
        Most hits in most estates are approved use. The pattern is meant to be trimmed
        to the unapproved platforms before the hunt is run.
    - condition: Developer tools call model APIs.
      explanation: >-
        Editors, coding assistants and build tools resolve model API domains constantly.
        They are approved or not as a matter of policy, and the process name says which
        tool it was.
    - condition: A DNS request is not an upload.
      explanation: >-
        Resolution shows contact, not content or volume. Establishing what was sent
        needs proxy, CASB or the provider's own audit logs.
