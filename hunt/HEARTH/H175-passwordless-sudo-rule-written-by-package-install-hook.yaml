# Converted from THORCollective/HEARTH Flames/H175.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-lin-hearth-h175-passwordless-sudo-rule-written-by-package-install-hook-t1548-003
version: 1.0.0

info:
  name: Passwordless sudo rule written from a package install hook on a CI runner
  description: >-
    The Miasma harvester, delivered through trojanised @redhat-cloud-services npm
    packages (Microsoft, June 2026), gives the runner account passwordless root before
    doing anything else: it echoes a NOPASSWD:ALL rule into a file that is bind-mounted
    over /etc/sudoers.d, then checks the result with sudo -n true. Legitimate sudoers
    changes come from visudo, package managers, cloud-init or configuration management.
    The sensor does not report writes under /etc/sudoers.d as file events, and the path
    the report gives (/mnt/runner) does not even contain the word sudoers, so the hunt
    reads the rule text and the sudoers path on command lines, the bind mount, and the
    validation call.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - privilege-escalation
    - sudoers
    - nopasswd
    - ci-cd
    - supply-chain
    - npm
    - miasma
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H175.md
    - https://attack.mitre.org/techniques/T1548
    - https://attack.mitre.org/techniques/T1548/003
    - https://attack.mitre.org/detectionstrategies/DET0052

mitre:
  tactics:
    - TA0004
  techniques:
    - T1548
  sub_techniques:
    - T1548.003
  detection_strategies:
    - DET0052
  analytics: []
  platforms:
    - Linux
  data_sources:
    - CrowdStrike:Endpoint
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    A compromised npm dependency executing inside a self-hosted CI/CD runner (GitHub
    Actions) is granting itself passwordless root by writing a NOPASSWD:ALL rule for the
    runner account, for example echo 'runner ALL=(ALL) NOPASSWD:ALL' > /mnt/runner with
    /mnt/runner bind-mounted over /etc/sudoers.d, or a direct write or append to
    /etc/sudoers or a file under /etc/sudoers.d, immediately after an npm install or npm
    ci preinstall hook fires, then validating the new privilege with sudo -n true.
  attacker_behavior:
    - Runs from a preinstall hook when the pipeline installs dependencies.
    - Writes a NOPASSWD:ALL rule for the runner account through a shell redirect or tee.
    - Reaches /etc/sudoers.d through a bind mount under another path.
    - Checks the grant with sudo -n true.
    - Drops a Bun runtime and second-stage script under /tmp and continues as root.
  legitimate_behavior:
    - Image build scripts and cloud-init add a NOPASSWD rule for a service account.
    - Configuration management writes files under /etc/sudoers.d.
    - Pipeline scripts call sudo -n true to test whether sudo needs a password.
  risk_indicator:
    - The command carrying the rule descends from node, npm or bun.
    - The rule is written during a job, not during image build or first boot.
    - The destination is a mount point that maps onto /etc/sudoers.d.
    - sudo -n true follows from the same parent within seconds.
    - A bun binary or a p*.js script runs from /tmp in the same job.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: nopasswd-rule-text-in-command
        name: Command line carrying a NOPASSWD:ALL rule
        purpose: >-
          Return any command whose line contains the rule text, whatever file it is
          aimed at; the reported destination is a bind-mounted path with no sudoers in
          its name. A redirect belongs to the shell, so echo with a redirect is seen
          when the line was passed to sh -c, which is how a Node child process runs it.
          Typed into an already running interactive shell, the echo is a builtin and
          starts no process.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/NOPASSWD\s*:\s*ALL/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: sudoers-path-written-or-mounted-over
        name: Command writing to, or bind-mounting over, the sudoers tree
        purpose: >-
          Return redirects, tee, copy, move and install commands whose target is
          /etc/sudoers or /etc/sudoers.d, and bind mounts that land on it. visudo is
          excluded by image.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ImageFileName!=/\/visudo$/
          | CommandLine=/(>>?\s*|\btee\b(\s+-a)?\s+|\b(cp|mv|install|ln|dd)\b[^|;&]*\s|--bind\s[^|;&]*|-o\s+\S*bind\S*\s[^|;&]*)\/etc\/sudoers(\.d\b|\s|$|")/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: non-interactive-sudo-check
        name: sudo -n true run to test for passwordless sudo
        purpose: >-
          Return the validation call with its parent. Pipeline scripts make the same
          check, so the agent keeps the events whose parent chain leads to node, npm or
          bun, or that follow a rule write from the first two cases on the same host.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ImageFileName=/\/sudo$/
          | CommandLine=/\s-n\s+true\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: bun-or-stage-script-running-from-tmp
        name: Bun runtime or p*.js script running from /tmp
        purpose: >-
          Return the companion artefacts the report lists: a bun binary under a /tmp/b-*
          directory and a second-stage script named p*.js in /tmp.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | ImageFileName=/^\/tmp\/b-[A-Za-z0-9]+\/bun$/ or CommandLine=/\/tmp\/p[^\/\s]*\.js\b/
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: nopasswd_rule_written
      name: Passwordless sudo rule written by a command
      description: >-
        A command line carries a NOPASSWD:ALL rule or writes to the sudoers tree, and it
        is not visudo, a package manager or configuration management.
      source: process_creation
      field: command_line
      indicates: sudoers_privilege_grant

  supporting:
    - id: writer_descends_from_package_install
      name: Writer descends from a package install
      description: >-
        The parent of the command is node, npm or bun, or a shell one of them started,
        which the agent establishes by following parent process ids.
      source: process_creation
      field: parent_process
      indicates: install_hook_execution
    - id: grant_validated
      name: Grant checked with sudo -n true
      description: >-
        sudo -n true runs from the same parent after the write.
      source: process_creation
      field: image_path
      indicates: privilege_validation
    - id: runner_account_context
      name: Command runs as the runner account
      description: >-
        The user on the event is the CI runner's service account.
      source: process_creation
      field: user
      indicates: ci_runner_context
    - id: stage_runtime_in_tmp
      name: Bun runtime or stage script under /tmp
      description: >-
        A bun binary under /tmp/b-* or a p*.js script in /tmp runs in the same job.
      source: process_creation
      field: parent_process_id
      indicates: second_stage_execution

  contradicting:
    - id: image_build_or_first_boot
      name: Rule written during image build or first boot
      description: >-
        The command's ancestry is cloud-init, a Packer or Docker build, or the runner's
        own installation script, and it runs once when the host is created.
      source: derived
      field: ParentBaseFileName
      indicates: provisioning_step
    - id: configuration_management_run
      name: Rule matches configuration management
      description: >-
        The rule and file match what Ansible, Chef or Puppet is recorded to deploy on
        this host.
      source: change_management
      field: ComputerName
      indicates: managed_sudoers_policy

  risk_logic:
    required:
      - nopasswd_rule_written

    supporting:
      any:
        - writer_descends_from_package_install
        - grant_validated
        - runner_account_context
        - stage_runtime_in_tmp
      all:
        - writer_descends_from_package_install
        - grant_validated

    contradicting:
      any:
        - image_build_or_first_boot
        - configuration_management_run
      all: []

  verdict:
    low_risk_when:
      - nopasswd_rule_written
      - image_build_or_first_boot
      - configuration_management_run
    suspicious_when:
      - nopasswd_rule_written
      - writer_descends_from_package_install
    high_risk_when:
      - nopasswd_rule_written
      - writer_descends_from_package_install
      - grant_validated
      - stage_runtime_in_tmp

  false_positive:
    - condition: Hosted-runner images grant the runner passwordless sudo.
      explanation: >-
        The rule is written once when the image is built, not during a job and not from
        a Node process.
    - condition: A pipeline step configures sudo on purpose.
      explanation: >-
        The step is in the workflow file and runs from the job's shell, not from a
        dependency's install hook.
    - condition: Scripts test for sudo.
      explanation: >-
        sudo -n true alone is common. It matters only after a rule write on the same
        host.
