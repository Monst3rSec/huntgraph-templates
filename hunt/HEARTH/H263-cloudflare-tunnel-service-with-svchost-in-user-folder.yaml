# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h263-cloudflare-tunnel-service-with-svchost-in-user-folder-t1543-003
version: 1.0.0

info:
  name: Cloudflare Tunnel service installed from a remote-control session with svchost.exe in a user folder
  description: >-
    An intruder who controls an RMM console uses its remote-control feature to reach
    managed endpoints and turn the session into lasting outbound access: a Cloudflare
    Tunnel connector is registered as a Windows service named Cloudflared and the
    connector binary is staged in a user-writable path, seen as svchost.exe in a user's
    Documents folder. The console's audit log, the session records in the Application
    log and service-install events 7045 and 4697 are not collected. The endpoint still
    shows svchost.exe running or being written outside the system directories, the
    connector's token arguments under any name, the service key where the sensor reports
    it, services.exe starting an image from a user profile, the connector's name
    requests and port 7844, and what the remote-control agent starts. H062 covers tunnel
    clients run by hand; this template covers the installed service and the renamed
    binary.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - windows-service
    - cloudflare-tunnel
    - masquerading
    - rmm
    - command-and-control
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H263.md
    - https://attack.mitre.org/techniques/T1543
    - https://attack.mitre.org/techniques/T1036
    - https://attack.mitre.org/techniques/T1572
    - https://attack.mitre.org/techniques/T1543/003
    - https://attack.mitre.org/techniques/T1036/005
    - https://attack.mitre.org/detectionstrategies/DET0552
    - https://attack.mitre.org/detectionstrategies/DET0347
    - https://attack.mitre.org/detectionstrategies/DET0538

mitre:
  tactics:
    - TA0003
    - TA0004
    - TA0005
    - TA0011
  techniques:
    - T1543
    - T1036
    - T1572
  sub_techniques:
    - T1543.003
    - T1036.005
  detection_strategies:
    - DET0552
    - DET0347
    - DET0538
  analytics:
    - AN1527
    - AN0983
    - AN1483
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation
    - Windows Registry Key Modification
    - Network Connection Creation

hypothesis:
  statement: >-
    An adversary who has taken over an RMM console uses its remote-control feature to
    reach managed endpoints and convert the session into durable outbound access: a
    Cloudflare Tunnel connector is registered as a Windows service named Cloudflared and
    the connector binary is staged under a user-writable path, observed as svchost.exe
    in a user's Documents folder, with egress to the tunnel provider's edge on port
    7844.
  attacker_behavior:
    - Opens a remote-control session to the endpoint from the RMM console.
    - "Writes the connector into a user's Documents folder as svchost.exe."
    - Installs it as an auto-start service with a tunnel token.
    - Leaves an outbound-only session to the tunnel edge on port 7844.
  legitimate_behavior:
    - IT and development teams run Cloudflare Tunnel connectors from Program Files.
    - "Support staff use the RMM's remote control and run commands through it."
    - Windows servicing writes svchost.exe inside the Windows directory.
  risk_indicator:
    - svchost.exe runs from anywhere but System32 or SysWOW64.
    - A process with tunnel run and a token is not named cloudflared.exe.
    - services.exe starts an image from a user profile.
    - A process other than cloudflared.exe connects on port 7844 or resolves the tunnel edge.
    - The install descends from the remote-control agent and not a deployment tool.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
        - AsepValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
    - source: network_connection
      connector: crowdstrike-ngsiem
      event_types:
        - NetworkConnectIP4
      fields:
        agent_id: aid
        host: ComputerName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
        remote_address: RemoteAddressIP4
        remote_port: RemotePort

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: svchost-running-outside-system-directories
        name: svchost.exe running from outside the system directories
        purpose: >-
          Return every svchost.exe whose image is not in System32, SysWOW64 or the
          component store.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^svchost\.exe$/i
          | ImageFileName!=/\\Windows\\(System32|SysWOW64|WinSxS\\[^\\]+)\\svchost\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: svchost-written-outside-windows-directory
        name: svchost.exe written outside the Windows directory
        purpose: >-
          Return executables written under the name svchost.exe anywhere but the Windows
          tree.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\svchost\.exe$/i
          | TargetFileName!=/\\Windows\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: tunnel-connector-token-arguments
        name: "Tunnel connector arguments with a token, under any image name"
        purpose: >-
          Return processes whose arguments are a connector's service install with a
          token, a tunnel run with a token, or a cloudflared service install. The test
          is on the arguments so that a connector renamed to svchost.exe matches. Every
          Windows process event is tested against the regex.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | CommandLine=/\sservice\s+install\s+ey[A-Za-z0-9_-]{20,}|\stunnel\s+(--\S+\s+)*run\s+--token\b|cloudflared(\.exe)?"?\s+service\s+install/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: cloudflared-service-key-written
        name: Value written under the Cloudflared service key
        purpose: >-
          Return values written under a service key named Cloudflared, with the image
          path in the data. Depends on the sensor reporting service key values; confirm
          in the tenant.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\Services\\Cloudflared$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: service-image-path-with-tunnel-arguments
        name: Service image path with tunnel arguments or a user-profile binary
        purpose: >-
          Return ImagePath values of any service that carry tunnel arguments or point
          under a user profile.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\(Current)?ControlSet\d*\\Services\\[^\\]+$/i
          | RegValueName=/^ImagePath$/i
          | RegStringValue=/tunnel\s+run|--token\b|cloudflared|\\Users\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: service-image-path-with-tunnel-arguments-autostart-event
        name: "Service image path with tunnel arguments, autostart event"
        purpose: >-
          The same test on the sensor's autostart registry event, where a service image
          path may be reported instead.
        query: |
          #event_simpleName=AsepValueUpdate
          | RegObjectName=/\\(Current)?ControlSet\d*\\Services\\[^\\]+$/i
          | RegValueName=/^ImagePath$/i
          | RegStringValue=/tunnel\s+run|--token\b|cloudflared|\\Users\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: service-process-started-from-user-profile
        name: Service Control Manager starting an image from a user profile
        purpose: >-
          Return processes whose parent is services.exe and whose image is under a
          user's Documents, Downloads, Desktop or AppData, or under Users\Public. This
          is the installed service running, however it was registered.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^services\.exe$/i
          | ImageFileName=/\\Users\\[^\\]+\\(AppData|Documents|Downloads|Desktop)\\|\\Users\\Public\\/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: tunnel-edge-resolved
        name: DNS request for the tunnel edge
        purpose: >-
          Return requests for argotunnel.com names with the requesting process, whatever
          it is called. Hosts with a sanctioned connector appear here at each reconnect.
        query: |
          #event_simpleName=DnsRequest
          | DomainName=/(^|\.)argotunnel\.com$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: port-7844-connection-from-other-process
        name: Connection on port 7844 from a process not named cloudflared
        purpose: >-
          Return connections to port 7844 from any process other than cloudflared.exe,
          the renamed connector. Whether the sensor reports the connector's default QUIC
          transport as a connection event is not established; the DNS case does not
          depend on it.
        query: |
          #event_simpleName=NetworkConnectIP4
          | RemotePort=7844
          | ContextBaseFileName!=/^cloudflared\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: process-started-by-remote-control-agent
        name: Process started by the N-central Take Control agent
        purpose: >-
          Return what the Take Control service and its helpers start, the lineage step
          (1) of the hypothesis names. Other RMM products have other process names,
          which H182 lists; the session start and end records are in the Application log
          and are not read.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^BASup[A-Za-z]*\.exe$/i
          | FileName!=/^(BASup[A-Za-z]*|conhost)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: connector_installed_from_user_path
      name: Tunnel connector or fake svchost.exe in a user-writable path
      description: >-
        A process named svchost.exe runs outside the system directories, or a process
        under a user profile carries tunnel connector arguments or is started by the
        Service Control Manager.
      source: process_creation
      field: image_path
      indicates: masqueraded_tunnel_service

  supporting:
    - id: connector_arguments
      name: Arguments are a connector run with a token
      description: >-
        The command line is a tunnel run or a service install with a token.
      source: process_creation
      field: command_line
      indicates: tunnel_connector
    - id: started_by_scm
      name: Parent is services.exe
      description: >-
        The process was started by the Service Control Manager.
      source: process_creation
      field: parent_process
      indicates: runs_as_service
    - id: service_key_written
      name: Cloudflared service key written
      description: >-
        A value was written under a service key named Cloudflared or with tunnel
        arguments in its image path.
      source: registry
      field: registry_data
      indicates: service_registered
    - id: binary_staged
      name: svchost.exe written outside Windows
      description: >-
        An executable named svchost.exe was written under a user-writable path.
      source: file_creation
      field: file_path
      indicates: connector_staged
    - id: edge_lookup_by_renamed_process
      name: Tunnel edge resolved by a process not named cloudflared
      description: >-
        The process that asked for the argotunnel.com name is not cloudflared.exe.
      source: dns_request
      field: process_name
      indicates: renamed_connector_egress
    - id: port_7844_egress
      name: Port 7844 egress from a renamed process
      description: >-
        A process not named cloudflared.exe connected on port 7844.
      source: network_connection
      field: remote_port
      indicates: tunnel_edge_session
    - id: remote_control_lineage
      name: Install descends from a remote-control session
      description: >-
        The staging and install commands descend from the remote-control agent's
        processes. The agent follows parent process ids from the returned events.
      source: process_creation
      field: parent_process_id
      indicates: rmm_session_abuse

  contradicting:
    - id: inventoried_connector
      name: Connector is in the software inventory
      description: >-
        The host is recorded as running an approved connector installed from Program
        Files by a deployment tool.
      source: asset_inventory
      field: ComputerName
      indicates: sanctioned_tunnel
    - id: change_record_for_session
      name: Session matches a support ticket
      description: >-
        The remote-control session and what it ran match a support ticket for the host.
      source: baseline
      field: CommandLine
      indicates: authorised_support_session

  risk_logic:
    required:
      - connector_installed_from_user_path

    supporting:
      any:
        - connector_arguments
        - started_by_scm
        - service_key_written
        - binary_staged
        - edge_lookup_by_renamed_process
        - port_7844_egress
        - remote_control_lineage
      all:
        - connector_arguments
        - started_by_scm

    contradicting:
      any:
        - inventoried_connector
        - change_record_for_session
      all: []

  verdict:
    low_risk_when:
      - connector_installed_from_user_path
      - inventoried_connector
      - change_record_for_session
    suspicious_when:
      - connector_installed_from_user_path
      - started_by_scm
    high_risk_when:
      - connector_installed_from_user_path
      - connector_arguments
      - edge_lookup_by_renamed_process

  false_positive:
    - condition: Sanctioned Cloudflare Tunnel connectors.
      explanation: >-
        They are named cloudflared.exe, sit in Program Files and are in the inventory.
        The DNS case returns them; the image-path cases do not.
    - condition: Routine remote support.
      explanation: >-
        Technicians run commands through the RMM agent all day. A ticket accounts for
        the session.
    - condition: Per-user updaters registered as services.
      explanation: >-
        A few signed products run a service from the profile, as in H253.
