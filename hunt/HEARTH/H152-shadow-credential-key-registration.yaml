# Converted from THORCollective/HEARTH Flames/H152.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-any-hearth-h152-shadow-credential-key-registration-t1556
version: 1.0.0

info:
  name: Shadow credentials registered on an Active Directory account
  description: >-
    An account that can write another account's msDS-KeyCredentialLink attribute can add
    its own public key there and then log on as that account with PKINIT, with no
    password. The key stays after a password reset. Whisker, pyWhisker and Certipy's
    shadow command automate it. The write is a directory change recorded on a domain
    controller as event 5136, which this deployment does not collect, and it is made
    over LDAP with no process on the controller. What the sensor can see is the tool
    being run on a managed host. A write made from a machine with no sensor, or relayed
    through ntlmrelayx from one, leaves nothing here. The legitimate writers, Windows
    Hello for Business enrolment and Entra Connect, also write over LDAP and start no
    command, so they do not appear.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - credential-access
    - persistence
    - shadow-credentials
    - active-directory
    - pkinit
    - whisker
    - certipy
    - windows
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H152.md
    - https://attack.mitre.org/techniques/T1556
    - https://attack.mitre.org/detectionstrategies/DET0104

mitre:
  tactics:
    - TA0006
    - TA0003
  techniques:
    - T1556
  sub_techniques: []
  detection_strategies:
    - DET0104
  analytics: []
  platforms:
    - Windows
    - Linux
  data_sources:
    - CrowdStrike:Endpoint
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    Threat actors register attacker-controlled key credentials in msDS-KeyCredentialLink
    on privileged Active Directory user and computer objects (Whisker, pyWhisker,
    Certipy shadow auto) to obtain a persistent passwordless PKINIT authentication
    primitive that survives password resets.
  attacker_behavior:
    - Runs Whisker, pyWhisker or Certipy shadow against a privileged user or a computer account.
    - Writes the attribute directly with PowerShell directory cmdlets or an LDAP tool.
    - Requests a ticket for the target with the generated certificate and recovers its NT hash.
    - Relays coerced authentication to LDAP and sets the attribute from the relay.
  legitimate_behavior:
    - Windows Hello for Business enrolment writes key credentials for the enrolling user.
    - Entra Connect synchronises key credentials under its service account.
    - Identity engineers list or clean up key credentials during troubleshooting.
  risk_indicator:
    - A key-credential tool is named on a command line of a workstation or member server.
    - The target is an administrator, a domain controller or another computer account.
    - A certificate-based ticket request for the same target follows on the host.
    - The account running it is not an identity-engineering account.

requires:
  platforms:
    - windows
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: key-credential-tool-invoked
        name: Shadow-credential tool invoked
        purpose: >-
          Return commands that run Whisker with one of its verbs, pyWhisker, Certipy's
          shadow command, bloodyAD's shadowCredentials action or a relay with the
          shadow-credentials option. Tool names are matched together with their verbs so
          a file that merely has the word in its path is left out. A renamed binary run
          with the same arguments still matches on the verbs for Certipy and the relay,
          and does not for Whisker.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/\bwhisker(\.exe)?["']?\s+(add|list|remove|clear)\b|\bpywhisker\b|\bInvoke-Whisker\b|\bcertipy(-ad)?(\.exe)?["']?\s+shadow\b|\bshadowCredentials\b|--shadow-credentials\b|--shadow-target\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: key-credential-attribute-named-on-command-line
        name: Command line naming msDS-KeyCredentialLink
        purpose: >-
          Return any command that names the attribute: a directory cmdlet that sets it,
          an LDAP modify, or a query that reads it. The attribute name is rare on
          command lines, so no further narrowing is applied.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/msDS-KeyCredentialLink/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: certificate-ticket-request-after-key-registration
        name: Ticket requested with a certificate
        purpose: >-
          Return the step that uses the new key: Rubeus asktgt with a certificate,
          Certipy auth or the PKINITtools scripts. Whisker prints the Rubeus command for
          the operator to run next. H153 carries the same case for certificates obtained
          from a certificate authority.
        query: |
          #event_simpleName=ProcessRollup2
          | CommandLine=/\basktgt\b.*\/certificate:|\bcertipy(-ad)?(\.exe)?["']?\s+auth\b|gettgtpkinit|getnthash\.py|PKINITtools/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: key_credential_tool_command
      name: Key-credential tool or attribute on a command line
      description: >-
        A process command line runs a shadow-credential tool or names the
        msDS-KeyCredentialLink attribute, showing the write was attempted from this
        host.
      source: process_creation
      field: command_line
      indicates: alternate_credential_registered

  supporting:
    - id: add_action_against_named_target
      name: Action is an add against a named account
      description: >-
        The command uses the add or auto action and names a target account, as opposed
        to listing existing keys.
      source: process_creation
      field: command_line
      indicates: credential_write_attempt
    - id: certificate_ticket_request_follows
      name: Certificate-based ticket request on the same host
      description: >-
        A ticket request with a certificate is run on the host after the tool, which the
        agent establishes from the order of the returned events.
      source: process_creation
      field: process_id
      indicates: shadow_credential_used
    - id: non_identity_engineering_host
      name: Host is a workstation or ordinary server
      description: >-
        The host on the event is not an identity-management or administration server.
      source: process_creation
      field: host
      indicates: directory_write_from_unexpected_host
    - id: non_identity_engineering_account
      name: Account is not an identity engineer
      description: >-
        The user is an ordinary user or an unrelated service account.
      source: process_creation
      field: user
      indicates: delegated_right_abused
    - id: operator_driven_parent
      name: Started from a shell, script or remote session
      description: >-
        The parent is an interactive shell, a script host or a remote-management
        process.
      source: process_creation
      field: parent_process
      indicates: operator_driven_execution

  contradicting:
    - id: sanctioned_security_test
      name: Run is an authorised test
      description: >-
        A change or engagement record covers the host, account and time for a
        penetration test or an attack-path review.
      source: change_management
      field: ComputerName
      indicates: authorised_security_testing
    - id: identity_engineering_task
      name: Work is identity engineering
      description: >-
        The account belongs to the identity team and the command lists or removes stale
        key credentials during recorded troubleshooting.
      source: identity_context
      field: UserName
      indicates: routine_directory_administration

  risk_logic:
    required:
      - key_credential_tool_command

    supporting:
      any:
        - add_action_against_named_target
        - certificate_ticket_request_follows
        - non_identity_engineering_host
        - non_identity_engineering_account
        - operator_driven_parent
      all:
        - add_action_against_named_target
        - certificate_ticket_request_follows

    contradicting:
      any:
        - sanctioned_security_test
        - identity_engineering_task
      all: []

  verdict:
    low_risk_when:
      - key_credential_tool_command
      - sanctioned_security_test
    suspicious_when:
      - key_credential_tool_command
      - non_identity_engineering_account
    high_risk_when:
      - key_credential_tool_command
      - add_action_against_named_target
      - certificate_ticket_request_follows

  false_positive:
    - condition: Penetration tests and attack-path reviews.
      explanation: >-
        Testers run the same tools. The engagement record, host and account are the only
        distinction.
    - condition: Identity engineers auditing key credentials.
      explanation: >-
        A script that reads msDS-KeyCredentialLink to find orphaned Windows Hello keys
        names the attribute. It reads and does not add.
