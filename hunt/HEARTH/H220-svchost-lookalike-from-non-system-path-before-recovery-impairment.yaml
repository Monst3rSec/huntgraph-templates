# Converted from THORCollective/HEARTH Flames/H220.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
# Also holds H361 (Akira GOST tunnel run as C:\PerfLogs\Temp\svchost.exe with its settings
# in a side-loaded config.dll). The svchost-outside-system-directory case returns it; the
# DLL load is not collected.
type: detection

id: hg-win-hearth-h220-svchost-lookalike-from-non-system-path-before-recovery-impairment-t1036-005
version: 1.1.0

info:
  name: Service-host lookalike running outside the system directory before recovery impairment
  description: >-
    In a Qilin intrusion reported by Halcyon the ransomware payload was named
    Svchosts.exe, one letter away from svchost.exe. It reached thirty endpoints and
    tried to delete shadow copies before encryption was stopped. The real service host
    runs only from the Windows system directory under the Service Control Manager. A
    binary with a near-miss name, or the exact name in another directory, is the
    masquerade, and the sensor records both the name and the path on every start.
    Recovery impairment by command is H112's subject and is returned here only so the
    agent can place it after the lookalike on the same host. Share access events 5140
    and 5145 are not collected; spread is read from the same file name being written and
    started on more than one host.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - stealth
    - masquerading
    - svchost
    - qilin
    - ransomware
    - recovery-impairment
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H220.md
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H361.md
    - https://attack.mitre.org/techniques/T1036
    - https://attack.mitre.org/techniques/T1036/005
    - https://attack.mitre.org/detectionstrategies/DET0347
    - https://www.halcyon.ai/blog/how-one-letter-hid-a-ransomware-army-qilin

mitre:
  tactics:
    - TA0005
  techniques:
    - T1036
  sub_techniques:
    - T1036.005
  detection_strategies:
    - DET0347
  analytics:
    - AN0983
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    A Qilin operator stages a service-host lookalike named Svchosts.exe from a
    non-system path, then runs recovery impairment commands before ransomware spreads to
    additional hosts.
  attacker_behavior:
    - Names the payload Svchosts.exe or another near miss of svchost.exe.
    - Runs it from ProgramData, a user profile, Windows\Temp, Users\Public or an admin share.
    - Deletes shadow copies and backup catalogues and turns off boot recovery.
    - Copies the same file to further hosts and starts it through a service, a task or WMI.
    - Encrypts files once recovery is impaired.
  legitimate_behavior:
    - svchost.exe runs from System32 and SysWOW64 under services.exe.
    - Servicing writes svchost.exe into WinSxS.
    - Backup software and administrators run vssadmin, wbadmin and bcdedit.
  risk_indicator:
    - A process is named like svchost.exe but not exactly.
    - svchost.exe runs from a directory other than System32, SysWOW64 or WinSxS.
    - A recovery impairment command follows on the same host within thirty minutes.
    - The lookalike is the parent of the recovery command.
    - The same lookalike name is written or started on several hosts.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_name: ContextBaseFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: service-host-lookalike-process-started
        name: Process whose name is a near miss of svchost.exe
        purpose: >-
          Return every start of a process named Svchosts.exe or another close
          misspelling of svchost.exe, whatever its path. The names are listed exactly,
          so the case is cheap over a long window. A lookalike spelt some other way is
          not matched; the next case does not depend on spelling.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(svchosts|scvhost|scvhosts|svhost|svhosts|svchos|svch0st|svchosl|svchots|svchostt|suchost|svcchost|svchhost|svvchost|svchoost|svchost\d+)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: svchost-running-outside-system-directory
        name: svchost.exe running from outside the system directories
        purpose: >-
          Return starts of a file named exactly svchost.exe whose image path is not
          under System32, SysWOW64 or WinSxS. The image path carries a device prefix, so
          the test is on the directory, not the drive.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^svchost\.exe$/i
          | ImageFileName!=/\\Windows\\(System32|SysWOW64|WinSxS\\[^\\]+)\\svchost\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: service-host-lookalike-file-written
        name: Executable with a svchost lookalike name written to disk
        purpose: >-
          Return executables written under a lookalike name, with the writing process. A
          copy over an admin share is written on the destination by the System process.
          The same name written on several hosts is the spread; the agent counts hosts
          from the returned events.
        query: |
          #event_simpleName=PeFileWritten
          | TargetFileName=/\\(svchosts|scvhost|scvhosts|svhost|svhosts|svchos|svch0st|svchosl|svchots|svchostt|suchost|svcchost|svchhost|svvchost|svchoost|svchost\d+)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: process-started-by-service-host-lookalike
        name: Any process started by a svchost lookalike
        purpose: >-
          Return every child of a lookalike. A recovery command, a shell or a copy of
          itself started by the payload shows here with the lookalike named as parent.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^(svchosts|scvhost|scvhosts|svhost|svhosts|svchos|svch0st|svchosl|svchots|svchostt|suchost|svcchost|svchhost|svvchost|svchoost|svchost\d+)\.exe$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: recovery-impairment-command
        name: Shadow copy, backup catalogue or boot recovery impairment command
        purpose: >-
          Return recovery impairment commands from any parent. Administrators and backup
          products run some of these, so the case does not stand alone: the agent keeps
          the events that fall within thirty minutes after a lookalike on the same host.
          Deletion of shadow copies through COM or WMI from inside the payload starts no
          process and is not seen. H112 holds the wider form of this case.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(vssadmin|wmic|wbadmin|bcdedit|diskshadow|powershell|pwsh)\.exe$/i
          | CommandLine=/delete\s+shadows|shadowcopy\s+delete|resize\s+shadowstorage|delete\s+(catalog|systemstatebackup|backup)|recoveryenabled\s+no|bootstatuspolicy\s+ignoreallfailures|Win32_ShadowCopy|diskshadow(\.exe)?["']?\s+\/s\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: service_host_lookalike_executed
      name: Service-host lookalike executed
      description: >-
        A process named as a near miss of svchost.exe started, or a file named
        svchost.exe ran from outside the system directories.
      source: process_creation
      field: image_name
      indicates: masqueraded_payload_execution

  supporting:
    - id: lookalike_in_user_writable_path
      name: Image path is user-writable or a share
      description: >-
        The image is under ProgramData, a user profile, Windows\Temp, Users\Public or an
        ADMIN$ path.
      source: process_creation
      field: image_path
      indicates: payload_staged_outside_system_directory
    - id: recovery_impairment_after_lookalike
      name: Recovery impairment command follows the lookalike
      description: >-
        A shadow copy, backup catalogue or boot recovery command runs on the same host
        within thirty minutes after the lookalike started. The agent derives the order
        and the interval from the returned events.
      source: process_creation
      field: command_line
      indicates: inhibit_system_recovery
    - id: lookalike_is_parent_of_command
      name: Lookalike is the parent of a command
      description: >-
        The parent named on a recovery command or a shell is the lookalike.
      source: process_creation
      field: parent_process
      indicates: payload_driven_impairment
    - id: lookalike_written_to_disk
      name: Lookalike executable written
      description: >-
        An executable with the lookalike name was written on the host.
      source: file_creation
      field: file_path
      indicates: payload_staging
    - id: lookalike_written_by_system_or_remote_tool
      name: Writer is System or a remote execution tool
      description: >-
        The writing process is System, a service host or a remote administration tool,
        as with a copy over an admin share.
      source: file_creation
      field: writer_process_name
      indicates: lateral_tool_transfer
    - id: same_name_on_several_hosts
      name: Same lookalike on several hosts
      description: >-
        The lookalike name is written or started on two or more hosts. The agent counts
        distinct hosts in the returned events.
      source: process_creation
      field: host
      indicates: ransomware_propagation

  contradicting:
    - id: known_product_binary
      name: Binary belongs to an installed product
      description: >-
        Asset records tie the file name and path to software approved on the host.
      source: asset_inventory
      field: ComputerName
      indicates: approved_software
    - id: backup_maintenance_window
      name: Recovery command is routine backup maintenance
      description: >-
        The same recovery command recurs on the host from a backup agent or a scheduled
        job.
      source: baseline
      field: CommandLine
      indicates: routine_backup_administration

  risk_logic:
    required:
      - service_host_lookalike_executed

    supporting:
      any:
        - lookalike_in_user_writable_path
        - recovery_impairment_after_lookalike
        - lookalike_is_parent_of_command
        - lookalike_written_to_disk
        - lookalike_written_by_system_or_remote_tool
        - same_name_on_several_hosts
      all:
        - lookalike_in_user_writable_path
        - recovery_impairment_after_lookalike

    contradicting:
      any:
        - known_product_binary
        - backup_maintenance_window
      all: []

  verdict:
    low_risk_when:
      - service_host_lookalike_executed
      - known_product_binary
    suspicious_when:
      - service_host_lookalike_executed
      - lookalike_in_user_writable_path
    high_risk_when:
      - service_host_lookalike_executed
      - lookalike_in_user_writable_path
      - recovery_impairment_after_lookalike

  false_positive:
    - condition: Third-party software that ships a file named like svchost.
      explanation: >-
        A few products and many unwanted programs do this. An approved product has a
        signer and an install directory on record; an unwanted program is still worth
        the look.
    - condition: Servicing and recovery environments.
      explanation: >-
        Offline servicing can run svchost.exe from a mounted image or a staging
        directory. The parent is a servicing process and no recovery command follows.
    - condition: Backup and imaging products.
      explanation: >-
        They resize shadow storage and delete old catalogues on a schedule. The command
        recurs and no lookalike precedes it.
