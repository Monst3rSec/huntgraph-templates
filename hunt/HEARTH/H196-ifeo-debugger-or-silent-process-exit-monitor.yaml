# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-win-hearth-h196-ifeo-debugger-or-silent-process-exit-monitor-t1546-012
version: 1.0.0

info:
  name: Debugger, GlobalFlag or SilentProcessExit monitor registered for a Windows binary
  description: >-
    A Debugger value under Image File Execution Options makes Windows start the named
    program whenever the target binary is launched, with the target's path as its
    argument. A GlobalFlag of 0x200 with a MonitorProcess value under SilentProcessExit
    starts a program when the target exits. ESET reported FishMonger setting a binary in
    %SystemRoot%\Fonts as the debugger for vds.exe, a service Windows starts on demand,
    and hiding the key with a kernel driver. Because the driver hides the key from
    enumeration, the write and the launch are what remain: the registry event, the
    command that set the value, and a program outside System32 started by services.exe
    with a System32 binary as its argument.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - persistence
    - privilege-escalation
    - image-file-execution-options
    - silent-process-exit
    - registry
    - fishmonger
    - windows
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H196.md
    - https://attack.mitre.org/techniques/T1546/012
    - https://attack.mitre.org/detectionstrategies/DET0422
    - https://www.welivesecurity.com/en/eset-research/fishmongers-arsenal-upgraded-sprysocks-windows/

mitre:
  tactics:
    - TA0003
    - TA0004
  techniques:
    - T1546
  sub_techniques:
    - T1546.012
  detection_strategies:
    - DET0422
  analytics:
    - AN1186
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Windows Registry Key Modification
    - Process Creation

hypothesis:
  statement: >-
    An adversary establishes persistence/defense-evasion by writing a Debugger,
    GlobalFlag, or SilentProcessExit value under Image File Execution Options so
    attacker code runs when a legitimate auto-started binary (e.g., vds.exe) launches or
    exits.
  attacker_behavior:
    - Writes a Debugger value under Image File Execution Options for a binary Windows starts by itself.
    - Points the value at a program in a directory such as Windows\Fonts or ProgramData.
    - Sets GlobalFlag and a SilentProcessExit MonitorProcess so a program runs when the target exits.
    - Hides the key from registry tools with a kernel driver.
  legitimate_behavior:
    - Developers attach a debugger to their own application while diagnosing start-up.
    - Application Verifier and gflags set GlobalFlag for a program under test.
    - Some products register a Debugger value to replace a Windows tool, such as Process Explorer for Task Manager.
    - Crash-dump collection uses SilentProcessExit with a reporting mode and no monitor.
  risk_indicator:
    - The target is a service binary or a security tool, not an application under development.
    - The debugger or monitor path is outside System32 and Program Files.
    - The value is written by a process that is not a debugger, an installer or a registry editor run by an administrator.
    - services.exe starts a program from a user-writable path with a System32 binary as its argument.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: registry
      connector: crowdstrike-ngsiem
      event_types:
        - RegGenericValueUpdate
        - AsepValueUpdate
      fields:
        agent_id: aid
        host: ComputerName
        registry_path: RegObjectName
        registry_value: RegValueName
        registry_data: RegStringValue
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: ifeo-or-silent-exit-value-written
        name: Debugger, GlobalFlag or MonitorProcess value written
        purpose: >-
          Return registry writes of the four values under an Image File Execution
          Options or SilentProcessExit subkey, with the target binary in the path and
          the program in the data. This depends on the sensor reporting writes under
          these keys as a generic value update; confirm in the tenant.
        query: |
          #event_simpleName=RegGenericValueUpdate
          | RegObjectName=/\\(Image File Execution Options|SilentProcessExit)\\[^\\]+\\?$/i
          | RegValueName=/^(Debugger|GlobalFlag|MonitorProcess|ReportingMode)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: ifeo-or-silent-exit-autostart-value-written
        name: The same values reported as an autostart entry
        purpose: >-
          The sensor reports some autostart locations under a separate event name. This
          case reads the same keys and values there, so the hunt does not depend on
          which of the two the tenant emits.
        query: |
          #event_simpleName=AsepValueUpdate
          | RegObjectName=/\\(Image File Execution Options|SilentProcessExit)\\[^\\]+\\?$/i
          | RegValueName=/^(Debugger|GlobalFlag|MonitorProcess|ReportingMode)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: command-setting-ifeo-or-silent-exit-value
        name: Command line that sets one of the values
        purpose: >-
          Return reg, PowerShell, cmd, gflags and regedit commands that name either key
          together with one of the values. A value set through the registry API by the
          malware itself starts no process and shows only in the registry cases.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | FileName=/^(reg|regedit|powershell|pwsh|cmd|gflags|wmic)\.exe$/i
          | CommandLine=/Image File Execution Options|SilentProcessExit/i
          | CommandLine=/Debugger|GlobalFlag|MonitorProcess|ReportingMode/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: service-control-manager-started-debugger-from-odd-path
        name: services.exe starting a program outside System32 with a System32 binary as its argument
        purpose: >-
          Return processes started by services.exe whose image is under Fonts,
          ProgramData, a Temp folder or a user profile and whose command line carries
          the path of a System32 executable. With a Debugger value set, Windows starts
          the debugger in place of the target, so the parent is whatever would have
          started the target and the target's path is the argument. A target started by
          something other than services.exe is not returned by this case.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Win
          | ParentBaseFileName=/^services\.exe$/i
          | ImageFileName=/\\(Windows\\Fonts|ProgramData|Windows\\Temp|Users|PerfLogs)\\/i
          | CommandLine=/\\Windows\\System32\\[^\\"]+\.exe/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: ifeo_value_set
      name: Debugger, GlobalFlag or monitor value set
      description: >-
        A Debugger, GlobalFlag, MonitorProcess or ReportingMode value was written under
        an Image File Execution Options or SilentProcessExit subkey.
      source: registry
      field: registry_value
      indicates: execution_hijack_registered

  supporting:
    - id: target_is_system_binary
      name: Target is a service or security binary
      description: >-
        The subkey names a binary Windows starts by itself or a security tool.
      source: registry
      field: registry_path
      indicates: persistence_through_trusted_binary
    - id: debugger_outside_system_paths
      name: Registered program is outside System32 and Program Files
      description: >-
        The value data points at a program under Fonts, ProgramData, a Temp folder or a
        user profile.
      source: registry
      field: registry_data
      indicates: attacker_controlled_debugger
    - id: value_set_by_command
      name: Value set from a command line
      description: >-
        A reg, PowerShell or gflags command names the key and the value.
      source: process_creation
      field: command_line
      indicates: scripted_registry_change
    - id: debugger_started_in_place_of_target
      name: Program started with a System32 binary as its argument
      description: >-
        services.exe started a program from an unusual path whose command line carries
        the target's path.
      source: process_creation
      field: image_path
      indicates: hijack_triggered

  contradicting:
    - id: developer_or_test_host
      name: Host is a developer or test machine
      description: >-
        Inventory shows the host is used for software development or testing and the
        target is the team's own application.
      source: asset_inventory
      field: ComputerName
      indicates: debugging_activity
    - id: sanctioned_tool_replacement
      name: Value belongs to a sanctioned tool
      description: >-
        The value is a documented replacement, such as Process Explorer for Task
        Manager, deployed by the organisation.
      source: change_management
      field: ComputerName
      indicates: authorised_configuration

  risk_logic:
    required:
      - ifeo_value_set

    supporting:
      any:
        - target_is_system_binary
        - debugger_outside_system_paths
        - value_set_by_command
        - debugger_started_in_place_of_target
      all:
        - target_is_system_binary
        - debugger_outside_system_paths

    contradicting:
      any:
        - developer_or_test_host
        - sanctioned_tool_replacement
      all: []

  verdict:
    low_risk_when:
      - ifeo_value_set
      - developer_or_test_host
      - sanctioned_tool_replacement
    suspicious_when:
      - ifeo_value_set
      - target_is_system_binary
    high_risk_when:
      - ifeo_value_set
      - target_is_system_binary
      - debugger_outside_system_paths
      - debugger_started_in_place_of_target

  false_positive:
    - condition: Developers debug their own services.
      explanation: >-
        The target is their application, the debugger is a known debugger and the host
        is a development machine.
    - condition: Process Explorer replaces Task Manager.
      explanation: >-
        The target is taskmgr.exe and the data is the Sysinternals path.
    - condition: Crash-dump collection through SilentProcessExit.
      explanation: >-
        ReportingMode is set with a dump folder and there is no MonitorProcess value.
