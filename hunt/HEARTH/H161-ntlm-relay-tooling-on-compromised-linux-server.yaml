# Converted from THORCollective/HEARTH Flames/H161.md. hunt/HEARTH/ sits outside the
# validated corpus; see hunt/HEARTH/README.md.
type: detection

id: hg-lin-hearth-h161-ntlm-relay-tooling-on-compromised-linux-server-t1557
version: 1.0.0

info:
  name: NTLM relay and coercion tooling run on a Linux server against domain controllers
  description: >-
    After taking over an internet-facing Linux server, a Confluence host or an F5 BIG-IP
    in the reported intrusion, the intruder used it as a base inside the network:
    Responder to answer name-resolution broadcasts, ntlmrelayx to relay captured
    authentication, kerbrute to guess accounts, and a proof of concept for
    CVE-2025-33073 to coerce a Windows host into authenticating. A BIG-IP carries no
    sensor and is out of reach. On a Linux server that does carry one, the tools are
    processes with recognisable arguments, they open listeners on Windows service ports,
    and they connect to domain controllers on Kerberos, LDAP and SMB ports from a host
    that has no reason to. The relayed and coerced authentication itself is packet
    content, and the controller's logon events for it are not read here.
  severity: high
  author: huntgraph
  tags:
    - hearth
    - credential-access
    - ntlm-relay
    - responder
    - impacket
    - kerbrute
    - cve-2025-33073
    - linux
  references:
    - https://github.com/THORCollective/HEARTH/blob/main/Flames/H161.md
    - https://attack.mitre.org/techniques/T1557
    - https://attack.mitre.org/detectionstrategies/DET0296

mitre:
  tactics:
    - TA0006
  techniques:
    - T1557
  sub_techniques: []
  detection_strategies:
    - DET0296
  analytics: []
  platforms:
    - Linux
  data_sources:
    - CrowdStrike:Endpoint
  data_components:
    - Process Creation
    - Network Connection Creation

hypothesis:
  statement: >-
    An attacker on a compromised Linux host (Confluence or F5 BIG-IP) is performing NTLM
    relay coercion against an internal Windows domain controller, running responder,
    ntlmrelayx, kerbrute or a CVE-2025-33073 proof of concept to coerce and relay
    authentication for credential theft and lateral movement.
  attacker_behavior:
    - Downloads or unpacks Responder, Impacket, kerbrute or NetExec onto the server.
    - Starts a poisoner or relay that listens on SMB, HTTP and name-resolution ports.
    - Coerces a Windows host to authenticate to the server and relays it to LDAP or SMB on a domain controller.
    - Guesses user names and passwords against Kerberos with kerbrute.
  legitimate_behavior:
    - Linux application servers bind to the directory over LDAP from their own service process.
    - Samba and SSSD services talk to domain controllers on Kerberos, LDAP and SMB ports.
    - Security teams run these tools from dedicated assessment hosts.
  risk_indicator:
    - A relay, poisoning or coercion tool is named on a command line of an application server.
    - The command names a relay target, a coercion method or CVE-2025-33073.
    - A Python or tool process listens on port 445, 139, 137 or 5355.
    - A Python or tool process connects to Kerberos, LDAP, SMB or WinRM ports.
    - The process runs as the web application's service account.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
        parent_process_id: ParentProcessId
    - source: network_connection
      connector: crowdstrike-ngsiem
      event_types:
        - NetworkConnectIP4
      fields:
        agent_id: aid
        host: ComputerName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
        remote_address: RemoteAddressIP4
        remote_port: RemotePort
    - source: network_listen
      connector: crowdstrike-ngsiem
      event_types:
        - NetworkListenIP4
      fields:
        agent_id: aid
        host: ComputerName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
        local_port: LocalPort

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: relay-or-poisoning-tool-invoked
        name: Relay, poisoning, coercion or Kerberos-guessing tool invoked
        purpose: >-
          Return Linux commands that name Responder, ntlmrelayx, kerbrute, NetExec and
          the common coercion scripts. The names are matched as whole words and nxc only
          together with a protocol, since it is three letters. A tool copied under
          another name matches only through its arguments, in the next case.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/\b(responder|ntlmrelayx|kerbrute|netexec|crackmapexec|krbrelayx|mitm6|petitpotam|printerbug|dfscoerce|coercer|dnstool)(\.py)?\b|\bnxc\s+(smb|ldap|winrm|mssql|rdp|wmi)\b|\bimpacket-[a-z]+\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: relay-target-or-coercion-arguments
        name: Command carrying relay-target or coercion arguments
        purpose: >-
          Return commands with the arguments these tools take whatever the file is
          called: a relay target given as a protocol URL, the SMB2 support switch, the
          relay's attack options, or the CVE number of the coercion proof of concept.
        query: |
          #event_simpleName=ProcessRollup2
          | event_platform=Lin
          | CommandLine=/CVE-2025-33073|-smb2support\b|--no-(http|smb|wcf|raw)-server\b|\s-tf?\s+\S*(ldaps?|smb|https?|mssql|winrm|rpc):\/\/|--escalate-user\b|--delegate-access\b|--shadow-credentials\b|--adcs\b/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: directory-service-connection-from-script-or-tool
        name: Kerberos, LDAP, SMB or WinRM connection from an interpreter or relay tool
        purpose: >-
          Return outbound connections from Linux hosts to Windows service ports when the
          connecting process is Python, Perl, Ruby or one of the tools by name. Port 445
          is included because the platform and process tests come first and keep the set
          small. Java, Samba and SSSD are not in the process list, so an application's
          own directory binds are left out. Whether the destination is a domain
          controller is for the agent to establish from the address.
        query: |
          #event_simpleName=NetworkConnectIP4
          | event_platform=Lin
          | RemotePort=/^(88|389|636|445|5985|5986)$/
          | ContextBaseFileName=/^(python[0-9.]*|responder|kerbrute[^\/]*|nxc|netexec|crackmapexec|ntlmrelayx(\.py)?|mitm6|ruby|perl)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: windows-service-port-listener-opened-by-script-or-tool
        name: Listener on a Windows service port opened by an interpreter or relay tool
        purpose: >-
          Return listeners on SMB, NetBIOS, LLMNR, mDNS, LDAP and MSSQL ports opened on
          Linux by Python or one of the tools. Responder and ntlmrelayx both have to
          listen to receive authentication. Port 80 is left out because web servers and
          test servers hold it.
        query: |
          #event_simpleName=NetworkListenIP4
          | event_platform=Lin
          | LocalPort=/^(445|139|137|138|5355|5353|389|1433)$/
          | ContextBaseFileName=/^(python[0-9.]*|responder|kerbrute[^\/]*|nxc|netexec|crackmapexec|ntlmrelayx(\.py)?|mitm6|ruby|perl)$/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: relay_tool_command
      name: Relay, poisoning or coercion tool on a command line
      description: >-
        A Linux process command line names a relay, poisoning, coercion or
        Kerberos-guessing tool, or carries the arguments one takes.
      source: process_creation
      field: command_line
      indicates: adversary_in_the_middle_tooling

  supporting:
    - id: connection_to_directory_service_port
      name: Tool connected to a Windows service port
      description: >-
        An interpreter or tool process connects out to Kerberos, LDAP, SMB or WinRM
        ports.
      source: network_connection
      field: remote_port
      indicates: relay_or_guessing_traffic
    - id: destination_is_domain_controller
      name: Destination is a domain controller
      description: >-
        The remote address on the connection belongs to a domain controller.
      source: network_connection
      field: remote_address
      indicates: directory_service_targeted
    - id: many_accounts_or_hosts_in_succession
      name: Run of connections in quick succession
      description: >-
        The same process makes many connections to port 88, or to port 445 on many
        addresses, within minutes, which the agent derives by counting the returned
        events.
      source: network_connection
      field: process_id
      indicates: account_guessing_or_sweep
    - id: listener_on_windows_service_port
      name: Tool listening on a Windows service port
      description: >-
        An interpreter or tool process opens a listener on an SMB, NetBIOS, LLMNR or
        LDAP port on the Linux host.
      source: network_listen
      field: local_port
      indicates: authentication_capture_listener
    - id: listener_process_is_interpreter
      name: Listener belongs to Python or a named tool
      description: >-
        The listening process is Python or a tool binary, not Samba.
      source: network_listen
      field: process_name
      indicates: rogue_service
    - id: web_service_account_context
      name: Runs as the application's service account
      description: >-
        The user on the event is the account the web application runs under.
      source: process_creation
      field: user
      indicates: post_exploitation_of_web_service
    - id: application_server_ancestry
      name: Parent is the application or a shell under it
      description: >-
        The parent is Java, a web server worker or a shell, which the agent follows up
        the process tree to the application.
      source: process_creation
      field: parent_process
      indicates: execution_from_compromised_service

  contradicting:
    - id: authorised_assessment_host
      name: Host is an authorised assessment system
      description: >-
        Asset records class the host as a penetration-testing or red-team system.
      source: asset_inventory
      field: ComputerName
      indicates: authorised_security_testing
    - id: recorded_security_test
      name: Run is covered by an engagement record
      description: >-
        A change or engagement record covers the host and time.
      source: change_management
      field: ComputerName
      indicates: authorised_security_testing

  risk_logic:
    required:
      - relay_tool_command

    supporting:
      any:
        - connection_to_directory_service_port
        - destination_is_domain_controller
        - many_accounts_or_hosts_in_succession
        - listener_on_windows_service_port
        - listener_process_is_interpreter
        - web_service_account_context
        - application_server_ancestry
      all:
        - listener_on_windows_service_port
        - connection_to_directory_service_port

    contradicting:
      any:
        - authorised_assessment_host
        - recorded_security_test
      all: []

  verdict:
    low_risk_when:
      - relay_tool_command
      - authorised_assessment_host
    suspicious_when:
      - relay_tool_command
      - web_service_account_context
    high_risk_when:
      - relay_tool_command
      - listener_on_windows_service_port
      - destination_is_domain_controller

  false_positive:
    - condition: Penetration tests.
      explanation: >-
        Testers run exactly these tools, sometimes from a server they were given. The
        engagement record is the only distinction.
    - condition: Python scripts that bind to the directory.
      explanation: >-
        Provisioning and reporting scripts use LDAP from Python. They connect to 389 or
        636 only, on a schedule, and open no listener.
    - condition: Documentation and package names.
      explanation: >-
        A package manager installing impacket, or a grep for responder, names the tool
        without running it. The image on the event is the package manager or grep.
