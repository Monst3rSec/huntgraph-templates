evidence:
  required:
    - id: tool_keyword_on_command_line
      name: "Group3r keyword in a command line"
      description: >-
        A process was created whose command line contains a string published as a keyword for
        Group3r -- a switch, a function name, a module name or a literal the tool emits. The
        string is specific to the tool, so its presence means a copy of the tool was invoked on
        this host.
      source: process_creation
      field: command_line
      indicates: offensive_tool_execution

  supporting:
    - id: tool_file_on_disk
      name: "Group3r file written to disk"
      description: >-
        A file whose name matches one of the tool's published artefacts was created on the host,
        which places a copy of the tool on disk rather than only in a transient command line.
      source: file_creation
      field: file_path
      indicates: tooling_staged_on_host
    - id: user_writable_path
      name: Tool run from a user-writable directory
      description: >-
        The image path or the referenced file sits under Downloads, Temp, AppData, a profile
        directory or a public share, which is where tooling is dropped rather than where managed
        software is installed.
      source: process_creation
      field: image_path
      indicates: unmanaged_binary_location
    - id: first_time_for_host
      name: First occurrence on this host
      description: >-
        No command line carrying this tool's keywords has been seen on the host during the
        baseline window, so the run is new rather than part of a standing workflow.
      source: baseline
      field: ComputerName
      indicates: unusual_activity_for_host
    - id: unexpected_account
      name: Account not associated with tooling
      description: >-
        The invoking account is a service account, a shared account or a user whose role does
        not include security testing or system engineering.
      source: process_creation
      field: user
      indicates: unexpected_actor
    - id: interactive_parent
      name: Launched from an interactive shell
      description: >-
        The parent process is a shell, a remote-management agent or a script host rather than an
        installer or a management platform, which is hands-on use rather than a packaged
        deployment.
      source: process_creation
      field: parent_process
      indicates: hands_on_keyboard_activity

  contradicting:
    - id: sanctioned_engagement
      name: Approved testing engagement
      description: >-
        The host, account and time fall inside a recorded red-team or penetration-test
        engagement, which authorises exactly this tooling.
      source: asset_inventory
      field: ComputerName
      indicates: legitimate_enterprise_activity
    - id: security_product_handling
      name: Security product handling a sample
      description: >-
        The command line or the file write belongs to the endpoint security product, a sandbox
        or an archiver scanning, quarantining or unpacking a copy of the tool, which echoes its
        name without running it.
      source: process_creation
      field: parent_process
      indicates: security_tooling_activity
    - id: routine_for_this_operator
      name: Routine for this host and account
      description: >-
        The same account has run the same tool on the same host repeatedly across the baseline
        window with a stable command shape, matching a standing administrative or research
        workflow.
      source: baseline
      field: CommandLine
      indicates: established_workflow

  risk_logic:
    required:
      - tool_keyword_on_command_line

    supporting:
      any:
        - tool_file_on_disk
        - user_writable_path
        - first_time_for_host
        - unexpected_account
        - interactive_parent
      all:
        - first_time_for_host
        - user_writable_path

    contradicting:
      any:
        - sanctioned_engagement
        - security_product_handling
        - routine_for_this_operator
      all: []

  verdict:
    low_risk_when:
      - tool_keyword_on_command_line
      - sanctioned_engagement
      - security_product_handling
      - routine_for_this_operator
    suspicious_when:
      - tool_keyword_on_command_line
      - first_time_for_host
    high_risk_when:
      - tool_keyword_on_command_line
      - user_writable_path
      - first_time_for_host
      - unexpected_account

  false_positive:
    - condition: "An approved red-team or penetration-test engagement is running."
      explanation: >-
        Testers run exactly this tooling by design, reproducing every piece of evidence here.
        The engagement record names the host, the account and the window; matches outside it are
        the ones worth reading.
    - condition: "The endpoint security product scans or quarantines a copy of the tool."
      explanation: >-
        Scanners and archivers put the sample's path on their own command line and write
        quarantined copies to disk, so the tool's name appears without the tool ever executing.
        The process is the security product itself.
    - condition: "An engineer researches or documents the tool."
      explanation: >-
        Cloning the project, reading its source or writing about it puts the tool's filenames
        and function names into command lines and onto disk without any of it being run against
        the estate. The activity clusters on a developer workstation and stops at fetch and
        read.
    - condition: "A legitimate product ships a file or switch with the same name."
      explanation: >-
        Some keywords are generic enough to collide with unrelated software, especially the
        shorter filenames. A collision repeats at volume across many hosts with a stable parent,
        where real tool use is sparse and varied.
