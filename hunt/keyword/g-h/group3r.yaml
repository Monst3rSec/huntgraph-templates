type: detection

id: hg-any-keyword-group3r
version: 1.0.0

info:
  name: "Group3r tool keywords observed on an endpoint"
  description: >-
    Find vulnerabilities in AD Group Policy. Keyword sweep for the tool Group3r, built from
    the 92 keywords mthcht/ThreatHunting-Keywords publishes for it. The hunt is the tool's
    own vocabulary: command switches, function names, filenames and strings that the tool
    emits and that nothing else on the estate should. The query returns the raw matching
    events rather than a count, so the agent can read the full command line, the user and
    the host for itself. Every distinct keyword upstream publishes for the tool is carried,
    whether or not upstream marks it endpoint-detectable. 2 upstream rows repeated a keyword
    already in the set and were dropped.
  severity: high
  author: huntgraph
  tags:
    - keyword-hunt
    - threathunting-keywords
    - g-h
    - offensive-tool-keyword
    - discovery
    - knotweed
  references:
    - https://raw.githubusercontent.com/mthcht/ThreatHunting-Keywords/main/tools/G-H/Group3r.csv
    - https://github.com/Group3r/Group3r

