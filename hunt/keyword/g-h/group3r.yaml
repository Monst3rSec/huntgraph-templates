# ATT&CK STIX bundle by tools/attack_extract.py, which is why this file is
# excluded from tools/validate.py.
mitre:
  tactics:
    - TA0007
    - TA0040
  techniques: []
  sub_techniques:
    - T1484.002
    - T1069.002
    - T1087.002
  detection_strategies: []
  analytics: []
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - CrowdStrike:Endpoint
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An adversary or an unsanctioned insider running Group3r on a managed host will leave the
    tool's own strings in process command lines and in the filenames it drops, because those
    strings are how the tool is invoked and what it installs; no unrelated software on the
    estate produces them.
  attacker_behavior:
    - "Downloads or copies Group3r onto the host and invokes it from a shell."
    - "Calls the tool's functions or switches, which appear verbatim in the command line."
    - "Drops the tool's modules, binaries or output files onto disk under their published names."
    - "Renames the binary while leaving the command switches and function names unchanged."
    - "Reported in use by KNOTWEED."
  legitimate_behavior:
    - "Administrators and red teams use Group3r under an approved engagement."
    - "Security tooling scans, quarantines or unpacks a copy of the tool, echoing its name."
    - "Documentation, research notes or installer manifests mention the tool by name."
    - "A build or package pipeline mirrors the project for internal review."
  risk_indicator:
    - "The host is a workstation or server with no engineering or red-team role."
    - "The tool runs from a user-writable path such as Downloads, Temp or a public share."
    - "The invoking account is a service account or one that has never run tooling before."
    - "The run is a one-off with no change ticket, engagement window or ancestor that explains it."

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewScriptWritten
        - PeFileWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: command-line-keywords
        name: "Group3r keywords in a process command line"
        purpose: >-
