type: detection

id: hg-win-password-strings-searched-for-across-windows-files-t1552-001
version: 1.0.0

info:
  name: Password strings searched for across Windows files
  description: >-
    Configuration files, deployment answer files, scripts and notes left on Windows hosts
    and shares still carry cleartext passwords, and the cheapest way to find them is to ask
    the operating system: findstr /s /i password over *.xml, *.ini, *.config and *.txt, or
    Select-String over a directory tree. Attackers search in the local language too, so the
    terms are not only English. People do search their own files for a word now and then,
    but a recursive search for password terms across configuration file types, often with
    the output saved to a file, is credential hunting.
  severity: medium
  author: huntgraph
  tags:
    - credential-access
    - credentials-in-files
    - discovery
    - windows
  references:
    - https://attack.mitre.org/techniques/T1552/001
    - https://attack.mitre.org/detectionstrategies/DET0307
    - https://attack.mitre.org/techniques/T1552
    - https://raw.githubusercontent.com/SigmaHQ/sigma/2e8fd89f82d9104c1b30321a307254ddeea17de2/rules-threat-hunting/windows/process_creation/proc_creation_win_findstr_password_recon.yml

mitre:
  tactics:
    - TA0006
  techniques:
    - T1552
  sub_techniques:
    - T1552.001
  detection_strategies:
    - DET0307
  analytics:
    - AN0856
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary on a Windows host may search local and mapped files for password strings
    with findstr, Select-String or a filename sweep, in order to recover cleartext
    credentials stored in configuration, deployment and script files.
  attacker_behavior:
    - Runs findstr /s /i with password terms across configuration and text file types.
    - Runs Select-String or Get-ChildItem piped to Select-String over directory trees.
    - Sweeps for files named after passwords, credentials or VNC and FTP client settings with dir /s.
    - Searches in the host's language, such as contraseña, passwort, hasło or 密碼.
    - Redirects the matches to a file for later collection.
  legitimate_behavior:
    - Developers grep their own source trees for a configuration key.
    - Security teams run audit scripts that search for stored secrets.
    - Administrators check a configuration file for a setting by name.
  risk_indicator:
    - The search is recursive and targets configuration, script or text file types.
    - The search spans a profile, program data, a web root or a network share.
    - The output is written to a file in a temporary or public directory.
    - The account is not a developer and has not searched like this before.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        - aid
        - ComputerName
        - UserName
        - FileName
        - CommandLine
        - ParentBaseFileName

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: findstr-searching-for-password-terms
        name: findstr searching for password terms
        purpose: >-
          Return every findstr run whose search terms are a word for password in one of the
          languages attackers use. The command line carries the file types, the search root
          and any output redirection.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | FileName=/^findstr\.exe$/i
          | CommandLine=/(passw|pwd|contrase|passwort|mot de passe|passe|senha|senord|parola|heslo|hasło|jelszó|salasana|пароль|密碼|密码|パスワード|암호|credential|secret|connectionstring)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - user
            - command_line

      - id: powershell-select-string-for-password-terms
        name: Select-String searching for password terms
        purpose: >-
          Catch the PowerShell form of the same search, which is typed inline on the command
          line when run from a remote shell or a one-liner.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | FileName=/^(powershell|pwsh)\.exe$/i
          | CommandLine=/(Select-String|\bsls\b)/i
          | CommandLine=/(passw|pwd|contrase|passwort|senha|parola|heslo|credential|secret|connectionstring)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - user
            - command_line

      - id: files-swept-by-credential-name
        name: Recursive sweep for credential-named files
        purpose: >-
          Surface the filename form of the hunt, where dir or Get-ChildItem walks a tree for
          files named after passwords, credentials or saved client settings.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(\bdir\b.*\/s|Get-ChildItem.*-Recurse|\bgci\b.*-r)/i
          | CommandLine=/(\*pass\w*\*|\*cred\w*\*|\*vnc\w*\*|unattend\w*\.xml|sysprep\.(inf|xml)|web\.config|\*\.kdbx|filezilla|winscp\.ini)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - user
            - command_line

evidence:
  required:
    - id: password_search_issued
      name: Search for password strings or credential files
      description: >-
        findstr or Select-String was run with a password term, or a recursive listing was
        run for credential-named files.
      source: process_creation
      field: CommandLine
      indicates: credential_pattern_search

  supporting:
    - id: recursive_over_config_types
      name: Recursive search over configuration file types
      description: >-
        The search recurses (/s, -Recurse) and targets .xml, .ini, .config, .txt, .ps1 or
        similar file types that hold stored settings.
      source: process_creation
      field: CommandLine
      indicates: broad_credential_search
    - id: matches_saved_to_file
      name: Matches redirected to a file
      description: >-
        The command redirects its output to a file, collecting the matches for later
        retrieval.
      source: process_creation
      field: CommandLine
      indicates: collection_staging
    - id: launched_from_remote_or_script_shell
      name: Launched from a remote or script shell
      description: >-
        The search was started by a WinRM or WMI provider host, a script host or a shell
        started by one, rather than by an interactive console.
      source: process_creation
      field: ParentBaseFileName
      indicates: hands_on_keyboard_activity
    - id: searcher_unusual
      name: Account does not usually search like this
      description: >-
        This account has not run password-term searches on this host during the baseline
        window.
      source: baseline
      field: UserName
      indicates: unusual_activity_for_user

  contradicting:
    - id: secrets_audit_tooling
      name: Security team secrets audit
      description: >-
        The search is part of a recorded secrets-scanning exercise run by the security team.
      source: change_management
      field: UserName
      indicates: authorised_security_testing
    - id: developer_workstation
      name: Developer searching their own tree
      description: >-
        The host is a developer workstation and the search is scoped to a source checkout
        in the user's own profile.
      source: asset_inventory
      field: ComputerName
      indicates: expected_developer_activity

  risk_logic:
    required:
      - password_search_issued

    supporting:
      any:
        - recursive_over_config_types
        - matches_saved_to_file
        - launched_from_remote_or_script_shell
        - searcher_unusual
      all:
        - recursive_over_config_types
        - matches_saved_to_file

    contradicting:
      any:
        - secrets_audit_tooling
        - developer_workstation
      all: []

  verdict:
    low_risk_when:
      - password_search_issued
      - secrets_audit_tooling
      - developer_workstation
    suspicious_when:
      - password_search_issued
      - recursive_over_config_types
    high_risk_when:
      - password_search_issued
      - recursive_over_config_types
      - matches_saved_to_file
      - searcher_unusual

  false_positive:
    - condition: A developer searches a checkout for a configuration key.
      explanation: >-
        The search is scoped to a source tree in the developer's own profile and the host is
        a developer workstation. Output is read on screen, not saved.
    - condition: The security team runs a secrets-scanning script.
      explanation: >-
        The search matches every piece of evidence but is run by a known account during a
        recorded exercise, which the change record identifies.
