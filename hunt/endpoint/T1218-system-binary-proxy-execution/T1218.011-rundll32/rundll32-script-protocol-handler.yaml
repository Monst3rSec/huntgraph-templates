type: detection

id: hg-win-rundll32-script-protocol-handler-t1218-011
version: 1.0.0

info:
  name: Rundll32 executing script content through a protocol handler
  description: >-
    rundll32.exe can be coerced into running script code instead of a DLL export by
    invoking mshtml's RunHTMLApplication with a `javascript:` or `vbscript:` argument.
    Nothing is written to disk, no scripting engine appears in the process tree, and the
    executing image is a signed Microsoft binary. Because no legitimate Windows component
    or vendor installer invokes rundll32 this way, the pattern is far closer to a
    high-confidence signal than the general LOLBin case, and it survives renaming of the
    payload because the syntax itself is the artefact.
  severity: critical
  author: huntgraph
  tags:
    - stealth
    - proxy-execution
    - fileless
    - rundll32
    - windows
  references:
    - https://attack.mitre.org/techniques/T1218/011
    - https://attack.mitre.org/detectionstrategies/DET0475
    - https://lolbas-project.github.io/lolbas/Binaries/Rundll32/

mitre:
  tactics:
    - TA0005
  techniques:
    - T1218
  sub_techniques:
    - T1218.011
  detection_strategies:
    - DET0475
  analytics:
    - AN1308
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - Network Connection Creation

hypothesis:
  statement: >-
    An adversary may execute script code entirely in memory by passing a `javascript:` or
    `vbscript:` protocol argument to rundll32.exe together with mshtml's
    RunHTMLApplication entry point, avoiding both a payload file on disk and the
    appearance of a scripting host in the process tree.
  attacker_behavior:
    - Invokes rundll32.exe with `javascript:"\..\mshtml,RunHTMLApplication "` followed by inline script.
    - Uses GetObject with a `script:` or `scriptlet:` moniker to pull remote SCT content at runtime.
    - Chains document.write or ActiveX object creation to bootstrap a larger stage in memory.
    - Spawns the invocation from a document-handling parent after a phishing lure is opened.
  legitimate_behavior:
    - Security testing and red-team tooling reproduce the documented Poweliks syntax during authorised exercises.
    - Detection engineers execute the pattern deliberately to validate telemetry coverage.
    - Malware analysis sandboxes running on managed endpoints replay samples using this syntax.
  risk_indicator:
    - The command line combines rundll32.exe with a protocol scheme and RunHTMLApplication.
    - A remote scriptlet URL appears inside the command line or a DNS lookup follows immediately.
    - The parent process is a document, mail or browser application.
    - The host is not a designated testing or analysis endpoint.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
        process_id: TargetProcessId
    - source: process_creation
      connector: wazuh
      event_types:
        - sysmon_event1
        - windows_security
      fields:
        agent_id: agent.id
        host: win.system.computer
        user: win.eventdata.user
        image_name: win.eventdata.image
        command_line: win.eventdata.commandLine
        parent_process: win.eventdata.parentImage
        process_id: win.eventdata.processId
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_id: ContextProcessId
    - source: dns_request
      connector: wazuh
      event_types:
        - sysmon_event_22
      fields:
        agent_id: agent.id
        host: win.system.computer
        query_name: win.eventdata.queryName
        process_id: win.eventdata.processId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: protocol-handler-invocation
        name: Rundll32 invoked with a script protocol and RunHTMLApplication
        purpose: >-
          Catch the mshtml RunHTMLApplication syntax in any spacing or casing variant,
          which is the defining artefact of script execution through rundll32.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | FileName=/^rundll32\.exe$/i
          | CommandLine=/(javascript|vbscript)\s*:/i
          | CommandLine=/RunHTMLApplication|mshtml/i
        filters:
          include: []
          exclude:
            - "ComputerName belonging to the designated malware-analysis or purple-team subnet"
        baseline:
          required: false
          window: null
          compare: []

      - id: remote-scriptlet-moniker
        name: Rundll32 pulling a remote scriptlet
        purpose: >-
          Isolate the subset that reaches out for remote script content through a
          GetObject script moniker, which converts an in-memory execution into a staged
          download.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | FileName=/^rundll32\.exe$/i
          | CommandLine=/GetObject\s*\(\s*["']?script(let)?\s*:/i
          | CommandLine=/(?<payload_url>https?\s*:?\s*(\[:\])?\/\/[^\s"']+)/i
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: rundll32-dns-followup
        name: DNS lookup issued by a script-invoking rundll32 process
        purpose: >-
          Confirm that a protocol-handler invocation actually resolved an external name,
          distinguishing a live retrieval attempt from an inert command line.
        query: |
          #event_simpleName=/^(ProcessRollup2|DnsRequest)$/
          | case {
              #event_simpleName=ProcessRollup2
                | FileName=/^rundll32\.exe$/i
                | CommandLine=/(javascript|vbscript)\s*:/i
                | script_rundll_pid := TargetProcessId ;
              #event_simpleName=DnsRequest ;
            }
          | groupBy([ComputerName, ContextProcessId],
                    function=[collect([CommandLine, ParentBaseFileName, DomainName]),
                              count(as=events)])
          | script_rundll_pid = ContextProcessId
        filters:
          include: []
          exclude:
            - "DomainName on the approved corporate allowlist"
        baseline:
          required: true
          window: 30d
          compare:
            - domain
            - host

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 101024
      group: huntgraph,windows,stealth,proxy-execution
      lists: []

    cases:
      - id: protocol-handler-invocation
        covers: protocol-handler-invocation
        name: Rundll32 invoked with a script protocol and RunHTMLApplication
        purpose: >-
          Catch the mshtml RunHTMLApplication syntax in any spacing or casing variant,
          which is the defining artefact of script execution through rundll32.
        rule: |
          <rule id="101024" level="14">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.image" type="pcre2">(?i)^rundll32\.exe$</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(javascript|vbscript)\s*:</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)RunHTMLApplication|mshtml</field>
            <description>Rundll32 invoked with a script protocol and RunHTMLApplication</description>
            <mitre><id>T1218.011</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

      - id: remote-scriptlet-moniker
        covers: remote-scriptlet-moniker
        name: Rundll32 pulling a remote scriptlet
        purpose: >-
          Isolate the subset that reaches out for remote script content through a
          GetObject script moniker, which converts an in-memory execution into a
          staged download.
        rule: |
          <rule id="101025" level="14">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.image" type="pcre2">(?i)^rundll32\.exe$</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)GetObject\s*\(\s*["']?script(let)?\s*:</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(?:https?\s*:?\s*(\[:\])?\/\/[^\s"']+)</field>
            <description>Rundll32 pulling a remote scriptlet</description>
            <mitre><id>T1218.011</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: rundll32-dns-followup
        reason: >-
          Depends on a 30d baseline comparison (domain, host); a stateless rule holds
          no history.

evidence:
  required:
    - id: script_protocol_invocation
      name: Script protocol handler passed to rundll32
      description: >-
        The rundll32.exe command line contains a `javascript:` or `vbscript:` scheme
        together with mshtml or RunHTMLApplication, which is the documented syntax for
        executing script through the binary.
      source: process_creation
      field: command_line
      indicates: fileless_script_execution

  supporting:
    - id: remote_scriptlet_url
      name: Remote scriptlet URL in the command line
      description: >-
        A GetObject script moniker references an http or https URL, showing that the
        in-memory stub is designed to fetch further code at runtime.
      source: process_creation
      field: command_line
      indicates: possible_payload_retrieval
    - id: delivery_parent
      name: Document or mail application as parent
      description: >-
        rundll32.exe was spawned by an Office application, PDF reader, mail client,
        browser or archive utility, which places the execution immediately after a
        user-opened lure.
      source: process_creation
      field: parent_process
      indicates: abnormal_execution_chain
    - id: outbound_resolution
      name: DNS resolution from the invoking process
      description: >-
        The same rundll32.exe process issued a DNS query, confirming the script attempted
        to reach an external host rather than failing inertly.
      source: dns_request
      field: query_name
      indicates: active_command_and_control_attempt

  contradicting:
    - id: sanctioned_test_host
      name: Designated testing or analysis endpoint
      description: >-
        The host is a registered malware-analysis, detection-validation or purple-team
        system where this syntax is executed deliberately.
      source: asset_inventory
      field: ComputerName
      indicates: authorised_security_testing
    - id: scheduled_validation_window
      name: Execution inside an approved validation window
      description: >-
        The execution falls inside a change-managed detection-validation exercise with a
        recorded start and end time and a named owner.
      source: change_management
      field: ComputerName
      indicates: authorised_security_testing

  risk_logic:
    required:
      - script_protocol_invocation

    supporting:
      any:
        - remote_scriptlet_url
        - delivery_parent
        - outbound_resolution
      all:
        - remote_scriptlet_url
        - outbound_resolution

    contradicting:
      any:
        - sanctioned_test_host
        - scheduled_validation_window
      all: []

  verdict:
    low_risk_when:
      - script_protocol_invocation
      - sanctioned_test_host
      - scheduled_validation_window
    suspicious_when:
      - script_protocol_invocation
      - delivery_parent
    high_risk_when:
      - script_protocol_invocation
      - delivery_parent
      - remote_scriptlet_url
      - outbound_resolution

  false_positive:
    - condition: A detection engineer executes the published Poweliks syntax to validate coverage.
      explanation: >-
        Coverage testing reproduces the exact command line an adversary would use, so the
        required evidence is indistinguishable. Only asset context — the host being a
        known validation endpoint, or the run falling inside a recorded exercise —
        separates the two.
    - condition: A malware sandbox running on a managed endpoint detonates a sample using this syntax.
      explanation: >-
        Analysis hosts are frequently enrolled in the same EDR tenant as production. The
        activity is real execution of real malware and will look identical; scoping it out
        depends on the asset inventory rather than on any telemetry field.
    - condition: A security awareness or training platform simulates a fileless execution chain.
      explanation: >-
        Simulation platforms deliberately emit LOLBin behaviour to exercise the response
        process. These runs cluster tightly in time across a defined user population and
        correlate with a scheduled campaign.
