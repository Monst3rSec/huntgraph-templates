# Deliberately skipped detection targets.
#
# A target listed here is one this project has decided NOT to cover, as opposed
# to one it has not reached yet. Recording the decision matters: without this
# file every skip looks like outstanding work forever, and the honest reason
# gets lost the moment the person who made the call moves on.
#
# The bar for a skip is narrow. It is not "this is hard" or "the query would be
# noisy" — it is "the only observable this technique produces is one we cannot
# collect, so anything written here would look like coverage and detect
# nothing". A template that fails silently is worse than an acknowledged gap,
# because it converts a known blind spot into an unknown one.
#
# Revisit this file whenever telemetry changes. Most entries below turn into
# writable targets the day module-load, process-handle-access or OS API
# telemetry is confirmed available in NG-SIEM.
#
# Format:
#   - id:      MITRE technique or sub-technique id
#     name:    MITRE name, for readability
#     reason:  why no honest template can be written today
#     revisit: the concrete change that would make this writable

skipped:
  - id: T1480.002
    name: Mutual Exclusion
    reason: >-
      A named mutex is a kernel object. It creates no file, no process, no
      registry value and no network connection, so no collectable stream
      witnesses it. The Unix variants rest on flock/lockf syscalls and produce
      only a zero-byte lock file, which the executable-write events will never
      emit. Any query would amount to guessing a mutex name inside a command
      line.
    revisit: OS API execution telemetry

  - id: T1497.002
    name: User Activity Based Checks
    reason: >-
      Probing for a human — cursor position, last input time, foreground window,
      recent document counts — is entirely API-level. There is no command-line
      equivalent to a cursor-position call, and the analytic's other two legs
      rest on process-handle access and workstation lock events that are not
      collectable here.
    revisit: OS API execution and process access telemetry

  - id: T1497.003
    name: Time Based Checks
    reason: >-
      Covered in substance by T1678. The analytic's stated observable is sleeps
      and ping loops, which is textually the same command-line behaviour the
      delay-execution template already hunts. The part genuinely specific to
      this leaf — sampling a clock either side of a sleep to notice a sandbox
      accelerating it — is API-level and invisible. Writing a second file would
      restate the first under a different id.
    revisit: not expected to change; this is a scope decision, not a gap

  - id: T1622
    name: Debugger Evasion
    reason: >-
      Asking whether a debugger is attached is a flag read, a timing comparison
      or a process-flag inspection. None of these touch disk, spawn a process or
      cross the network.
    revisit: OS API execution telemetry

  - id: T1684.002
    name: Email Spoofing
    reason: >-
      Every analytic under this technique declares a single component,
      Application Log Content, drawn from mail-service records. The observables
      are all authentication results and header-versus-envelope mismatches,
      which exist only in the receiving mail infrastructure — there is no
      process, file, registry or network artefact on the endpoint, and the
      technique has no execution component at all. The adjacent local mail
      submission behaviour is covered honestly by T1684.001, which rests on the
      analytic that does declare execution.
    revisit: a mail-platform connector; an endpoint sensor cannot serve this

  - id: T1129
    name: Shared Modules
    reason: >-
      The technique is loading a module into a process. Module load is precisely
      the component this deployment cannot collect, and every alternative signal
      belongs to whatever the loaded code then does, which other templates
      already own.
    revisit: module load telemetry

  - id: T1218.003
    name: CMSTP
    reason: >-
      The proxy-execution family is only worth a template where the invocation
      itself is visible and distinctive. For this binary the meaningful evidence
      is the module it loads and the COM object it instantiates; the command
      line alone does not separate abuse from the legitimate connection-manager
      workflow.
    revisit: module load telemetry

  - id: T1218.008
    name: Odbcconf
    reason: >-
      Same shape as T1218.003 — the payload is a DLL registered through the
      utility, so the observable that matters is the module load rather than the
      command line.
    revisit: module load telemetry

  - id: T1218.009
    name: Regsvcs/Regasm
    reason: >-
      Both utilities execute code through assembly registration. Without module
      load telemetry the only remaining signal is the utility running at all,
      which is ordinary on any host with a .NET toolchain present.
    revisit: module load telemetry

  - id: T1010
    name: Application Window Discovery
    reason: >-
      Every one of the 37 procedure examples describes the same thing: compiled
      code calling EnumWindows or GetForegroundWindow to read window titles.
      That is the Windows analytic, and it rests on process access and OS API
      execution, neither of which is collectable here. The two analytics that do
      declare process creation cover behaviour the corpus cannot honestly claim.
      The macOS one is AppleScript asking System Events for running
      applications, which the T1059.002 template already hunts with a sharper
      discriminator — inline script text — so a second file would restate it.
      The Linux one is execution of X11 utilities such as xdotool, wmctrl,
      xprop and xwininfo; those strings appear only in the analytic's own text
      and in none of the procedure examples, and a template built on them would
      mark T1010 covered while every attested instance of the technique went on
      producing no evidence at all.
    revisit: OS API execution and process access telemetry

  - id: T1001.001
    name: Junk Data
    reason: >-
      The technique is padding — random bytes appended, prepended or interleaved
      inside C2 messages. It exists entirely between the two endpoints of a
      connection and leaves nothing at all on the host: no file, no process
      argument, no registry value. The Windows analytic asks for network traffic
      content to measure payload entropy, and for process access, and neither is
      collectable here. What remains is a connection record showing which
      process reached which address, which describes every network-using program
      on the estate and says nothing about whether the bytes were padded. The
      analytic's other leg, a disproportionate send-to-receive ratio, needs byte
      counts that the endpoint connection events do not carry. Any template
      written from what is left would be a generic beaconing hunt wearing this
      technique's id.
    revisit: packet capture or flow byte counts with network traffic content

  - id: T1001.003
    name: Protocol or Service Impersonation
    reason: >-
      Every discriminator this technique has is a field inside a packet: a
      forged TLS handshake that is not really TLS, HTTP headers shaped to look
      like Gmail or Drive, a URI path copied from a real web application, a
      certificate presented to make the session look trusted. An endpoint sensor
      records that a process connected to an address on a port. It cannot tell a
      genuine TLS session on 443 from a FakeTLS one, because the difference is
      the handshake bytes, and it cannot read a header it never sees. The
      analytic pairs connection creation with SSL/TLS handshake analysis from a
      network sensor, and without that second half the first half is just
      outbound traffic. Skipped rather than reduced to a port-mismatch query,
      which would detect a different thing and call it this one.
    revisit: packet capture with TLS handshake and HTTP header inspection

  - id: T1132.002
    name: Non-Standard Encoding
    reason: >-
      Separating non-standard encoding from standard encoding requires looking at
      the encoded output and finding that it does not validate as base64 or hex.
      That is a payload test, and the payload is on the wire. The host-side half
      the analytic describes — a process constructing a custom alphabet or
      running an XOR or base-N loop — lives inside script bodies and compiled
      code, and reaching it needs PowerShell script-block execution telemetry
      that this connector set does not publish. The residue that does reach a
      command line is a fragment of an obfuscated one-liner, which is command
      obfuscation rather than channel encoding and is already covered by the
      T1027.010 templates. A file built on it would be
      T1132.001's file with a different regex and a misleading id.
    revisit: script block execution telemetry, plus packet content to separate the alphabets

  - id: T1573.001
    name: Symmetric Cryptography
    reason: >-
      Nothing on the host announces which cipher a program chose. The Windows
      analytic reaches the behaviour through module load — an unexpected process
      pulling in bcryptprimitives or a similar library — and module load is not
      collectable here, which is the same wall several T1218 entries above hit.
      The Linux analytic's process creation leg would only surface an explicit
      openssl invocation, and that ground is already held by the T1027.013
      template, which matches the same cipher arguments for the payload case.
      The part specific to this leaf, that the traffic itself is AES or RC4
      rather than something else, is only visible to something reading the
      bytes.
    revisit: module load telemetry, plus packet content to attribute the cipher

  - id: T1573.002
    name: Asymmetric Cryptography
    reason: >-
      MITRE's own description places SSL/TLS inside this technique, which makes
      its population every HTTPS connection in the estate. There is no endpoint
      observable that narrows that: the analytic depends on module load for the
      crypto library and on certificate and handshake inspection to find the
      malformed chains, and neither is available. Key generation on an endpoint
      is visible in a command line, but it is a different behaviour, and the
      corpus already covers certificate and private-key handling under T1553.002
      and T1552.004. Writing this one would mean claiming coverage of encrypted
      C2 on the strength of observing encryption.
    revisit: module load telemetry, plus TLS inspection for certificates and handshakes

  - id: T1090.004
    name: Domain Fronting
    reason: >-
      The technique is defined by a disagreement between two fields: the name in
      the TLS SNI and the name in the HTTP Host header. MITRE's own detection
      strategy is titled for that mismatch, and the Windows analytic's first log
      source is network traffic content carrying the handshake and the headers.
      Neither field reaches an endpoint sensor. The analytic's second leg,
      network connection creation, is collectable, but on its own it says only
      that a process connected to a CDN edge over 443 — which a browser, an
      update client and every telemetry agent do all day, and which fires
      identically whether or not any fronting occurred. A file built on that leg
      would be a hunt for CDN-hosted C2, properly belonging to T1102 or
      T1071.001, mislabelled with this id and unable to confirm the one property
      that makes the technique what it is. The connection-shape angles that could
      otherwise carry it are already held honestly under T1090.002 for a single
      external intermediary and T1090.003 for chained relays.
    revisit: TLS handshake and HTTP header inspection at the egress point

  - id: T1048.002
    name: Exfiltration Over Asymmetric Encrypted Non-C2 Protocol
    reason: >-
      This leaf is defined by a property of the transport that an endpoint sensor
      cannot observe: that the alternate channel's encryption uses a key pair
      rather than a shared secret. MITRE's own description places HTTPS and TLS
      inside it, so its population is every encrypted outbound session in the
      estate, and the Windows analytic's discriminating leg is certificate
      analysis in ssl.log — network traffic content, which is not collected here.
      The two collectable legs, process creation and network connection creation,
      say only that a non-browser process opened a session on port 443 to an
      address the host has not used before. That is a real hunt, but it is not
      this one: it is indistinguishable from generic exfiltration and it is
      already carried honestly elsewhere. The sibling leaves are writable because
      each has an observable that survives on the host — T1048.001 because a
      shared key has to be supplied to a local cipher invocation, T1048.003
      because a cleartext protocol names itself with its port. Asymmetric
      encryption has neither. A file written here would restate T1048.001's
      structure with the one distinguishing condition removed, inflating coverage
      by one id while detecting nothing the other two do not.
    revisit: >-
      TLS handshake and certificate inspection at the egress point, which would
      supply the issuer, chain and JA3-style properties the analytic's ssl.log
      leg depends on
