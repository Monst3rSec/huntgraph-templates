# Logical field names, and how each connector expresses them.
#
# The logical name is what evidence[].field cites once a template is migrated.
# Each connector resolves it to its own field. A null under a connector means
# that connector genuinely cannot supply the field — a template whose evidence
# depends on it must NOT declare that connector, because the L3 cross-connector
# check would (correctly) fail. That is the vendor-level equivalent of
# blocked-telemetry, and it is why this file records absence explicitly rather
# than leaving a gap.
#
# Wazuh names are the RULE form (win.eventdata.x). The Indexer uses a
# data. prefix on the same paths; these are for <field name="..."> in a rule.

sources:

  process_creation:
    anchors:
      windows: [sysmon_event1, windows_security]
      linux:   [audit_command]
      macos:   [macos_process]
    fields:
      command_line:    {crowdstrike: CommandLine,         windows: win.eventdata.commandLine,     linux: audit.execve.a1,   macos: null}
      parent_process:  {crowdstrike: ParentBaseFileName,  windows: win.eventdata.parentImage,     linux: audit.ppid,        macos: null}
      image_path:      {crowdstrike: ImageFileName,       windows: win.eventdata.image,           linux: audit.exe,         macos: null}
      # CrowdStrike FileName is the on-disk name. Sysmon's originalFileName is the
      # PE version-resource name, which for a disguised file is unrelated to what
      # is on disk — mapping to it would produce a rule that never fires. Sysmon
      # has no basename field, so this resolves to the full image path and rules
      # keying on a name must anchor their pcre2 with $.
      image_name:      {crowdstrike: FileName,            windows: win.eventdata.image,           linux: audit.exe,        macos: null}
      user:            {crowdstrike: UserName,            windows: win.eventdata.user,            linux: audit.auid,        macos: null}
      host:            {crowdstrike: ComputerName,        windows: win.system.computer,           linux: agent.name,        macos: agent.name}
      # Sysmon packs several algorithms into one string (SHA256=...,MD5=...), so a
      # rule must match a substring rather than compare equality.
      image_hash:      {crowdstrike: SHA256HashData,      windows: win.eventdata.hashes,          linux: null,              macos: null}
      process_id:      {crowdstrike: TargetProcessId,     windows: win.eventdata.processId,       linux: audit.pid,         macos: null}
      agent_id:        {crowdstrike: aid,                 windows: agent.id,                      linux: agent.id,          macos: agent.id}

  file_creation:
    anchors:
      windows: [sysmon_event_11]
      linux:   [syscheck_entry_added]
      macos:   [syscheck_entry_added]
    fields:
      file_path:         {crowdstrike: TargetFileName,   windows: win.eventdata.targetFilename, linux: syscheck.path, macos: syscheck.path}
      # Syscheck reports the writing process only when the directory is monitored
      # in whodata mode (audit-backed). Plain FIM reports the change and not who
      # made it, so a rule using this is inert unless whodata is configured.
      writer_process_id: {crowdstrike: ContextProcessId, windows: win.eventdata.processId,      linux: syscheck.audit.process.id, macos: syscheck.audit.process.id}
      file_hash:         {crowdstrike: SHA256HashData,   windows: win.eventdata.hashes,         linux: syscheck.sha256_after, macos: syscheck.sha256_after}
      host:              {crowdstrike: ComputerName,     windows: win.system.computer,          linux: agent.name,    macos: agent.name}
      agent_id:          {crowdstrike: aid,              windows: agent.id,                     linux: agent.id,      macos: agent.id}

  network_connection:
    anchors:
      windows: [sysmon_event3]
      linux:   [audit_network]
      macos:   [macos_network]
    fields:
      remote_address: {crowdstrike: RemoteAddressIP4,   windows: win.eventdata.destinationIp,   linux: null, macos: null}
      remote_port:    {crowdstrike: RemotePort,         windows: win.eventdata.destinationPort, linux: null, macos: null}
      local_port:     {crowdstrike: LocalPort,          windows: win.eventdata.sourcePort,      linux: null, macos: null}
      local_address:  {crowdstrike: LocalAddressIP4,    windows: win.eventdata.sourceIp,        linux: null, macos: null}
      protocol:       {crowdstrike: Protocol,           windows: win.eventdata.protocol,        linux: null, macos: null}
      process_id:     {crowdstrike: ContextProcessId,   windows: win.eventdata.processId,       linux: null, macos: null}
      process_name:   {crowdstrike: ContextBaseFileName, windows: win.eventdata.image,          linux: null, macos: null}
      host:           {crowdstrike: ComputerName,       windows: win.system.computer,           linux: agent.name, macos: agent.name}
      agent_id:       {crowdstrike: aid,                windows: agent.id,                      linux: agent.id,   macos: agent.id}

  dns_request:
    anchors:
      windows: [sysmon_event_22]
      linux:   []
      macos:   []
    fields:
      query_name:    {crowdstrike: DomainName,          windows: win.eventdata.queryName,    linux: null, macos: null}
      query_results: {crowdstrike: IP4Records,          windows: win.eventdata.queryResults, linux: null, macos: null}
      process_name:  {crowdstrike: ContextBaseFileName, windows: win.eventdata.image,        linux: null, macos: null}
      process_id:    {crowdstrike: ContextProcessId,    windows: win.eventdata.processId,    linux: null, macos: null}
      host:          {crowdstrike: ComputerName,        windows: win.system.computer,        linux: agent.name, macos: agent.name}
      agent_id:      {crowdstrike: aid,                 windows: agent.id,                   linux: agent.id,   macos: agent.id}

  registry:
    anchors:
      windows: [sysmon_event_13, sysmon_event_12]
      linux:   []
      macos:   []
    fields:
      # Sysmon 13 puts the full key+value path in targetObject and the data in
      # details, so registry_path and registry_value both resolve to the same
      # field. That is lossy against CrowdStrike's split, and any rule keying on
      # a value name must anchor its pcre2 to the end of targetObject.
      registry_path:  {crowdstrike: RegObjectName,  windows: win.eventdata.targetObject, linux: null, macos: null}
      registry_value: {crowdstrike: RegValueName,   windows: win.eventdata.targetObject, linux: null, macos: null}
      registry_data:  {crowdstrike: RegStringValue, windows: win.eventdata.details,      linux: null, macos: null}
      user:           {crowdstrike: UserName,       windows: win.eventdata.user,         linux: null, macos: null}
      host:           {crowdstrike: ComputerName,   windows: win.system.computer,        linux: agent.name, macos: agent.name}
      agent_id:       {crowdstrike: aid,            windows: agent.id,                   linux: agent.id,   macos: agent.id}

  network_share_access:
    anchors:
      windows: [windows_security]
      linux:   []
      macos:   []
    fields:
      share_name:     {crowdstrike: ShareName,        windows: win.eventdata.shareName,          linux: null, macos: null}
      file_path:      {crowdstrike: TargetFileName,   windows: win.eventdata.relativeTargetName, linux: null, macos: null}
      remote_address: {crowdstrike: RemoteAddressIP4, windows: win.eventdata.ipAddress,          linux: null, macos: null}
      user:           {crowdstrike: UserName,         windows: win.eventdata.subjectUserName,    linux: null, macos: null}
      host:           {crowdstrike: ComputerName,     windows: win.system.computer,              linux: agent.name, macos: agent.name}
      agent_id:       {crowdstrike: aid,              windows: agent.id,                         linux: agent.id,   macos: agent.id}

  authentication:
    anchors:
      windows: [windows_security]
      linux:   [pam, sshd]
      macos:   []
    fields:
      user:                {crowdstrike: UserName,         windows: win.eventdata.targetUserName,          linux: data.srcuser, macos: null}
      logon_type:          {crowdstrike: LogonType,        windows: win.eventdata.logonType,               linux: null,         macos: null}
      remote_address:      {crowdstrike: RemoteAddressIP4, windows: win.eventdata.ipAddress,               linux: data.srcip,   macos: null}
      failure_substatus:   {crowdstrike: SubStatus,        windows: win.eventdata.subStatus,               linux: null,         macos: null}
      user_principal:      {crowdstrike: UserPrincipal,    windows: win.eventdata.targetUserPrincipalName, linux: null,         macos: null}
      logon_time:          {crowdstrike: LogonTime,        windows: timestamp,                             linux: timestamp,    macos: timestamp}
      host:                {crowdstrike: ComputerName,     windows: win.system.computer,                   linux: agent.name,   macos: agent.name}
      agent_id:            {crowdstrike: aid,              windows: agent.id,                              linux: agent.id,     macos: agent.id}
      # No Wazuh equivalent. CrowdStrike derives admin status on the session
      # record; Windows Security 4624 does not carry it as a field, so any
      # template whose evidence cites this cannot declare the wazuh connector.
      user_is_admin:       {crowdstrike: UserIsAdmin,      windows: null, linux: null, macos: null}
      logon_server:        {crowdstrike: LogonServer,      windows: null, linux: null, macos: null}

  logon_session:
    anchors:
      windows: [windows_security]
      linux:   [pam, sshd]
      macos:   []
    fields:
      user:           {crowdstrike: UserName,         windows: win.eventdata.targetUserName,          linux: data.srcuser, macos: null}
      user_principal: {crowdstrike: UserPrincipal,    windows: win.eventdata.targetUserPrincipalName, linux: null,         macos: null}
      user_sid:       {crowdstrike: UserSid,          windows: win.eventdata.targetUserSid,           linux: null,         macos: null}
      logon_type:     {crowdstrike: LogonType,        windows: win.eventdata.logonType,               linux: null,         macos: null}
      remote_address: {crowdstrike: RemoteAddressIP4, windows: win.eventdata.ipAddress,               linux: data.srcip,   macos: null}
      logon_time:     {crowdstrike: LogonTime,        windows: timestamp,                             linux: timestamp,    macos: timestamp}
      host:           {crowdstrike: ComputerName,     windows: win.system.computer,                   linux: agent.name,   macos: agent.name}
      agent_id:       {crowdstrike: aid,              windows: agent.id,                              linux: agent.id,     macos: agent.id}
      user_is_admin:  {crowdstrike: UserIsAdmin,      windows: null, linux: null, macos: null}
