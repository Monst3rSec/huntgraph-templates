id: hg-win-lolbin-signed-proxy-execution
info:
  name: Signed binary proxy execution via developer LOLBins
  severity: high
  description: >-
    msbuild, installutil, regsvcs, mshta, and similar signed Microsoft binaries used to
    execute attacker-supplied code, inheriting the trust of their signature.
  author:
    - huntgraph
  tags:
    - defense-evasion
    - lolbin
    - execution
    - windows
  references:
    - https://attack.mitre.org/techniques/T1127/
    - https://lolbas-project.github.io/
  mitre:
    tactics:
      - TA0005
    techniques:
      - T1127.001
      - T1218.005

hypothesis: |
  Application allowlisting trusts Microsoft signatures. A signed developer utility that
  can compile or execute arbitrary input therefore becomes an execution primitive that
  is allowed by policy. msbuild.exe running an inline task is indistinguishable from
  msbuild.exe building software, unless you look at where the file came from and who
  launched it.

  On a developer workstation this is routine; on a finance user's laptop it is not. The
  discriminator is the host population, which no static rule can know in advance — the
  same query must be noisy in engineering and near-silent everywhere else.

requires:
  platforms:
    - windows
  data_sources:
    - process_creation
  connectors:
    - crowdstrike-ngsiem

baseline:
  window: 45d
  queries:
    - id: lolbin_host_population
      description: Which hosts run developer LOLBins at all — the engineering estate.
      query: |
        #event_simpleName=ProcessRollup2
        | FileName=/msbuild\.exe|installutil\.exe|regsvcs\.exe|regasm\.exe|mshta\.exe|cmstp\.exe/i
        | groupBy([ComputerName, FileName], function=count(as=hits))
    - id: lolbin_parents
      description: Normal launchers — IDEs and build agents versus shells.
      query: |
        #event_simpleName=ProcessRollup2
        | FileName=/msbuild\.exe|installutil\.exe|regsvcs\.exe|mshta\.exe/i
        | groupBy([ParentBaseFileName], function=count(as=hits))
  signals:
    - peer_comparison
    - parent_process_distribution
    - per_host_frequency
    - rare_command_lines

hunt:
  connector: crowdstrike-ngsiem
  window: 7d
  max_results: 5000
  query: |
    #event_simpleName=ProcessRollup2
    | FileName=/msbuild\.exe|installutil\.exe|regsvcs\.exe|regasm\.exe|mshta\.exe|cmstp\.exe|ieexec\.exe/i
    | CommandLine=/\\Users\\|\\Temp\\|\\AppData\\|\\ProgramData\\|\\Downloads\\|https?:\/\/|\\\\/i
    {{tuning_filters}}
  tunable:
    exclude_hosts: []
    exclude_parents: []
    exclude_paths: []
    min_rarity: 0.05

triage:
  fields:
    - ComputerName
    - UserName
    - FileName
    - CommandLine
    - ParentBaseFileName
  escalate_when: |
    The host is not part of the baseline engineering population, the input file lives in
    a user-writable or temporary directory, the parent is a shell, script host, Office
    application, or browser rather than an IDE or build agent, or the command references
    a remote path. mshta with an inline script or a URL is escalation-worthy on any host.
  false_positive_hints:
    - Developer workstations and CI build agents run msbuild constantly and legitimately.
    - Visual Studio invokes msbuild from temporary project directories.
    - Some enterprise applications ship .NET installers that call installutil at setup.

output:
  finding_title: Signed binary proxy execution — {{FileName}} on {{ComputerName}}
