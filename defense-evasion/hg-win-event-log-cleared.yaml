id: hg-win-event-log-cleared
info:
  name: Windows event log cleared or audit policy disabled
  severity: high
  description: >-
    Clearing the Security, System, or PowerShell operational logs, or disabling audit
    policy — the standard cleanup step after hands-on-keyboard activity.
  author:
    - huntgraph
  tags:
    - defense-evasion
    - anti-forensics
    - windows
  references:
    - https://attack.mitre.org/techniques/T1070/001/
  mitre:
    tactics:
      - TA0005
    techniques:
      - T1070.001
      - T1562.002

hypothesis: |
  Clearing an event log destroys the record of what happened before it. Adversaries do
  this after achieving their objective on a host; the act itself is loud, but only if
  someone is watching for it, and the evidence it destroys is precisely what an
  investigation would otherwise rely on.

  Log clearing is rare but not unheard of in normal operations — imaging, some
  troubleshooting runbooks, and a few management tools clear logs deliberately. The
  environment's own pattern of who clears logs, on which hosts, and via which process
  is what separates routine maintenance from cleanup.

requires:
  platforms:
    - windows
  data_sources:
    - windows_event_log
    - process_creation
  connectors:
    - crowdstrike-ngsiem

baseline:
  window: 90d
  queries:
    - id: historical_log_clears
      description: Every prior clear, with actor and host — usually a very short list.
      query: |
        #event_simpleName=EventLogCleared
        | groupBy([ComputerName, UserName, LogName], function=count(as=hits))
    - id: wevtutil_usage
      description: Command-line log manipulation, which may not raise a clear event.
      query: |
        #event_simpleName=ProcessRollup2 FileName=/wevtutil\.exe|PowerShell\.exe/i
        | CommandLine=/clear-log|cl\s|clear-eventlog|Limit-EventLog/i
        | groupBy([ComputerName, UserName, CommandLine])
  signals:
    - first_seen
    - per_host_frequency
    - rare_command_lines

hunt:
  connector: crowdstrike-ngsiem
  window: 7d
  max_results: 1000
  query: |
    #event_simpleName=/EventLogCleared|ProcessRollup2/
    | (#event_simpleName=EventLogCleared
       or CommandLine=/wevtutil\s+(cl|clear-log)|Clear-EventLog|auditpol\s+\/(clear|remove)|fsutil\s+usn\s+deletejournal/i)
    {{tuning_filters}}
  tunable:
    exclude_hosts: []
    exclude_users: []
    exclude_command_lines: []

triage:
  fields:
    - ComputerName
    - UserName
    - LogName
    - CommandLine
    - ParentBaseFileName
  escalate_when: |
    The Security log is the one cleared, several logs are cleared on one host in quick
    succession, the host has no history of log clearing in the baseline, or the clear
    is preceded within the same session by authentication from an unusual source or by
    credential-access activity. A clear performed by an interactive user account rather
    than a maintenance service account escalates.
  false_positive_hints:
    - Golden-image builds and sysprep clear logs before capture.
    - Some SCCM and vulnerability-management task sequences clear logs routinely.
    - Log-forwarding agents may clear after a successful upload on constrained hosts.

output:
  finding_title: Event log cleared on {{ComputerName}} by {{UserName}}
