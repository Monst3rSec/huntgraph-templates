id: hg-any-cloud-credential-file-access
info:
  name: Access to cloud credential and secret files
  severity: high
  description: >-
    Processes reading well-known credential stores — ~/.aws/credentials, kubeconfig,
    ~/.ssh keys, cloud CLI token caches — from anything other than their owning tool.
  author:
    - huntgraph
  tags:
    - credential-access
    - cloud
    - secrets
  references:
    - https://attack.mitre.org/techniques/T1552/001/
  mitre:
    tactics:
      - TA0006
    techniques:
      - T1552.001

hypothesis: |
  Developer and CI hosts hold long-lived cloud credentials in predictable file paths.
  Harvesting them requires no exploit and no privilege escalation — just a read. This
  makes credential files a high-value, low-noise target, and post-compromise scripts
  routinely sweep the whole set in one pass.

  A legitimate read comes from the owning tool (aws, kubectl, ssh, terraform) under an
  interactive session. The hunt signal is a *different* process reading them, or one
  process reading several unrelated credential stores in quick succession — a sweep,
  not a workflow.

requires:
  platforms:
    - linux
    - macos
    - windows
  data_sources:
    - file_access
    - process_creation
  connectors:
    - crowdstrike-ngsiem

baseline:
  window: 30d
  queries:
    - id: credential_file_readers
      description: Which processes normally read credential files on which hosts.
      query: |
        #event_simpleName=/FileOpen|ProcessRollup2/
        | FilePath=/\.aws\/credentials|\.kube\/config|\.ssh\/id_|\.azure\/|\.config\/gcloud\//i
        | groupBy([ImageFileName, ComputerName], function=count(as=hits))
    - id: credential_reader_users
      description: Which users perform these reads, to separate humans from services.
      query: |
        #event_simpleName=FileOpen
        | FilePath=/\.aws\/credentials|\.kube\/config|\.ssh\/id_/i
        | groupBy([UserName, ImageFileName])
  signals:
    - value_distribution
    - per_host_frequency
    - first_seen

hunt:
  connector: crowdstrike-ngsiem
  window: 7d
  max_results: 5000
  query: |
    #event_simpleName=FileOpen
    | FilePath=/\.aws\/credentials|\.aws\/config|\.kube\/config|\.ssh\/id_[a-z]+$|\.azure\/accessTokens|\.config\/gcloud\/credentials|\.docker\/config\.json|\.npmrc|\.pypirc/i
    {{tuning_filters}}
  tunable:
    exclude_images: []
    exclude_users: []
    exclude_hosts: []
    min_rarity: 0.02

triage:
  fields:
    - ComputerName
    - UserName
    - ImageFileName
    - CommandLine
    - FilePath
    - ParentBaseFileName
  escalate_when: |
    The reading process is not the tool that owns the file (aws reading ~/.aws is
    expected; a shell, curl, python one-liner, or archiver reading it is not), or one
    process reads three or more unrelated credential stores within a few minutes —
    the shape of a sweep rather than a workflow. Reads by a process with no TTY on a
    workstation, or immediately followed by outbound network activity, escalate.
  false_positive_hints:
    - Backup, sync, and antivirus agents walk home directories and touch every file.
    - IDEs and editors read ~/.aws and ~/.kube to populate cloud integrations.
    - Terraform, kubectl, and cloud CLIs read several credential files legitimately.
    - Shell startup scripts may read ~/.npmrc or ~/.pypirc on every login.

output:
  finding_title: Credential file access by {{ImageFileName}} on {{ComputerName}}
