# How an item's confidence is computed. Every number here is a judgement, which is why
# they live in a file a person can read and change rather than in the code.
#
#   confidence = 100 * (  source        * who published it
#                       + corroboration * how many other publishers carry the same story
#                       + specificity   * how much of it can be hunted on
#                       + relevance     * whether it is threat content at all )
#
# Each component is 0..1 and is written to the CSV beside the total, so a score can be
# argued with rather than taken on trust.

weights:
  source: 0.30
  corroboration: 0.20
  specificity: 0.30
  relevance: 0.20

# Lower bound of each band, on the 0-100 total. Below `medium` is `low`.
# `medium` is set just above what a reliable source writing on-topic reaches with
# nothing else (0.85 * 30 + 20 = 45.5), so that band always means at least one concrete
# hook: a CVE, an indicator, a behaviour, or a second publisher.
bands:
  high: 65
  medium: 50

# Reliability by feed category. A source in several categories takes the highest.
category_reliability:
  government-cert: 0.95
  threat-research: 0.85
  vulnerability-exploit: 0.70
  threat-news: 0.65
  ai-soc-vendor: 0.40
default_reliability: 0.40

# Per-source overrides, by entity id. Each needs a reason: an override with none is a
# number nobody can revisit.
source_reliability:
  msrc-update-guide: 0.95        # the vendor of record for what it describes
  exploit-db: 0.55               # unvetted submissions
  full-disclosure-seclists: 0.55 # unmoderated mailing list
  ransomware-live: 0.50          # relays claims made by the actors themselves
  orryx-ai: 0.20                 # feed list notes the domain's ownership is unverified

# Component score by number of OTHER publishers carrying the same story: index 0 is
# nobody else, the last entry applies from there upwards. This counts reporting, not
# independent verification — three outlets rewriting one vendor's post still score 3.
corroboration_steps: [0.0, 0.5, 0.8, 1.0]

# Two items are the same story when they share a CVE id (and neither is a roundup
# listing more than `cve_roundup_limit` of them), or their title and summary are at
# least this similar (TF-IDF cosine).
similarity_threshold: 0.30
cve_roundup_limit: 5
