type: detection

id: hg-win-sustained-two-way-exchange-with-a-public-web-service-t1102-002

version: 1.0.0

info:
  name: Sustained two-way exchange with a public web service
  description: >-
    When a web service carries the whole channel, the adversary gets an operator console
    that never needs infrastructure of its own. Commands go up as a document edit, a
    comment, an issue, a message or a file; results come back the same way. The destination
    is a domain the organisation depends on, the traffic is TLS, and the provider's own
    reputation stands behind every packet, so nothing about the address is available as a
    signal. An endpoint sensor cannot read what moved — no headers, no payload, no byte
    direction — and this template does not pretend otherwise. What it can see is the
    relationship: which process holds it, how long it lasts, and how narrow it is. A person
    using a cloud service produces bursts of connections across many hosts of that service,
    clustered around when they were working. An implant tasked through the same service
    produces a thin, patient, unbroken relationship with one endpoint, held by a process
    that has no user interface and often no business on the network at all, continuing
    through the night. The half of bidirectionality that is genuinely observable on an
    endpoint is not byte symmetry but consequence: instructions arriving mean something
    runs, so children appearing beneath the process that holds the channel is the closest
    thing to direct evidence that the exchange is two-way rather than a one-way feed. This
    is a baseline-dependent template. Without history of which processes normally talk to
    which services, the required evidence is close to meaningless.
  severity: medium
  author: huntgraph
  tags:
    - command-and-control
    - web-service
    - beaconing
    - tasking
    - windows
  references:
    - https://attack.mitre.org/techniques/T1102/002
    - https://attack.mitre.org/detectionstrategies/DET0035
    - https://attack.mitre.org/techniques/T1102
    - https://attack.mitre.org/techniques/T1102/003

mitre:
  tactics:
    - TA0011
  techniques:
    - T1102
  sub_techniques:
    - T1102.002
  detection_strategies:
    - DET0035
  analytics:
    - AN0100
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Network Connection Creation
    - Process Creation

hypothesis:
  statement: >-
    An adversary may run both directions of their command and control through a legitimate
    web service so that tasking and results travel as ordinary use of a platform the
    organisation cannot block, obtaining an interactive channel with no infrastructure of
    their own to be discovered.
  attacker_behavior:
    - Polls a document, message channel, issue tracker or storage API for new instructions.
    - Returns command output through the same service as an edit, comment, message or file.
    - Holds the channel from a process with no user interface, often out of a staging directory.
    - Keeps the exchange going continuously, including outside any working pattern.
    - Uses a single API endpoint of the service rather than the many hosts a client would touch.
  legitimate_behavior:
    - Users work in cloud document, storage and collaboration services throughout the day.
    - Sanctioned integrations synchronise data with a platform on a fixed schedule.
    - Backup and file-sync clients maintain long-lived sessions with a storage service.
    - Chat and ticketing clients hold persistent connections to their platform.
    - Build agents and scripts call platform APIs as part of normal automation.
  risk_indicator:
    - The process holding the channel is a script host or an image in a staging directory.
    - Contact is confined to one endpoint of a service whose clients normally use many.
    - The relationship continues at a steady rate outside the host's working pattern.
    - Processes are created beneath the channel process shortly after it contacts the service.
    - Neither the process nor the destination pairing has history on the host or in the estate.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        - aid
        - ComputerName
        - UserName
        - FileName
        - ImageFileName
        - CommandLine
        - ParentBaseFileName
        - TargetProcessId
    - source: network_connection
      event_types:
        - NetworkConnectIP4
        - NetworkConnectIP6
      fields:
        - aid
        - ComputerName
        - ContextBaseFileName
        - ContextProcessId
        - RemoteAddressIP4
        - RemotePort
    - source: dns_request
      event_types:
        - DnsRequest
      fields:
        - aid
        - ComputerName
        - DomainName
        - ContextProcessId
        - ContextBaseFileName

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: platform-api-reached-by-a-process-that-is-not-its-client
        name: Collaboration or storage API resolved by a process with no relationship to it
        purpose: >-
          Name the actor, because the destination cannot carry the finding. Every one of
          these services has a known client, and traffic to them from a script host, a
          proxy-execution binary or an unrecognised image is outside the population the
          adversary is hiding in. This is the one thing about web-service command and
          control that stays true regardless of what is inside the traffic.
        query: |
          #event_simpleName=/^DnsRequest$/
          | DomainName=/(^|\.)(api\.telegram\.org|discord(app)?\.com|slack\.com|hooks\.slack\.com|graph\.microsoft\.com|api\.dropboxapi\.com|content\.dropboxapi\.com|api\.github\.com|api\.gitlab\.com|api\.trello\.com|api\.notion\.com|api\.box\.com|api\.pcloud\.com|api\.mediafire\.com|script\.google(usercontent)?\.com|sheets\.googleapis\.com|www\.googleapis\.com|api\.onedrive\.com|api\.pushbullet\.com|api\.imgur\.com)$/i
          | ContextBaseFileName!=/^(chrome|msedge|firefox|iexplore|brave|opera|vivaldi|Teams|slack|Discord|OneDrive|Dropbox|outlook|git|code|devenv)\.exe$/i
        filters:
          include: []
          exclude:
            - "Sanctioned integrations and automation accounts documented to call these APIs"
            - "Backup, sync and archiving agents with an approved cloud storage target"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - process
            - domain
            - organization

      - id: long-lived-relationship-with-a-single-endpoint
        name: Many connections to one address of a service whose clients use many
        purpose: >-
          The shape of a tasked channel as opposed to a used platform. Real clients of these
          services spread their traffic across authentication, content, telemetry and
          presence hosts, so a high connection count paired with a very low distinct-address
          count is not what using the platform looks like. Ranking by connection count
          against a single endpoint puts the narrow, patient relationships at the top, which
          is where a channel sits and where interactive use does not.
        query: |
          #event_simpleName=/^(DnsRequest|NetworkConnectIP4|NetworkConnectIP6)$/
          | ContextBaseFileName!=/^(chrome|msedge|firefox|iexplore|brave|opera|vivaldi|Teams|slack|Discord|OneDrive|Dropbox|outlook|svchost|MsMpEng|CcmExec)\.exe$/i
          | case {
              #event_simpleName=/^DnsRequest$/
                | DomainName=/(^|\.)(api\.telegram\.org|discord(app)?\.com|slack\.com|hooks\.slack\.com|graph\.microsoft\.com|api\.dropboxapi\.com|content\.dropboxapi\.com|api\.github\.com|api\.gitlab\.com|api\.trello\.com|api\.notion\.com|api\.box\.com|api\.pcloud\.com|api\.mediafire\.com|script\.google(usercontent)?\.com|sheets\.googleapis\.com|www\.googleapis\.com|api\.onedrive\.com|api\.pushbullet\.com|api\.imgur\.com)$/i
                | service_name := DomainName ;
              #event_simpleName=/^(NetworkConnectIP4|NetworkConnectIP6)$/
                | RemotePort in (80, 443, 8443)
                | RemoteAddressIP4!=/^(10\.|127\.|169\.254\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/
                | channel_address := RemoteAddressIP4 ;
            }
          | groupBy([ComputerName, ContextProcessId, ContextBaseFileName],
                    function=[count(field=channel_address, distinct=true, as=distinct_hosts),
                              count(as=connections),
                              collect([service_name, channel_address, RemotePort], limit=5)])
        filters:
          include: []
          exclude:
            - "Monitoring and telemetry agents that poll a single collector endpoint"
            - "Licence and heartbeat services with one fixed endpoint by design"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - process
            - remote_address
            - organization

      - id: channel-process-launched-from-a-staging-path-or-delivery-lineage
        name: Process holding the channel runs from a staging path or delivered content
        purpose: >-
          Explain where the process came from, which is the piece the network events cannot
          supply. Sanctioned integrations run from installation directories and are started
          by services or schedulers; a channel process is typically launched by a document
          handler, archive tool, mail client or another interpreter, and it runs from a
          directory the operator could write to. Either fact turns a narrow network
          relationship into an account of how it got there.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | ImageFileName=/\\(Temp|AppData|ProgramData|Downloads|PerfLogs|Users\\Public)\\/i
            or ParentBaseFileName=/^(winword|excel|powerpnt|outlook|acrobat|acrord32|7zg|7zfm|winrar|explorer|mshta|wscript|cscript)\.exe$/i
          | ImageFileName!=/\\(ccmcache|SoftwareDistribution|Package Cache|Installer)\\/i
        filters:
          include: []
          exclude:
            - "Self-updating applications that run their staged new version from a profile path"
            - "Installer and bootstrapper lineages during a known deployment window"
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - path
            - parent_process

      - id: work-appearing-beneath-the-channel-process
        name: Processes created by the process that holds the service channel
        purpose: >-
          The only observable half of bidirectionality available to an endpoint. Byte
          direction is invisible, but consequence is not: a channel that carries commands
          produces execution, so children under the process that maintains the service
          relationship are as close as this telemetry gets to showing that instructions came
          back down. It also raises the finding from an anomalous connection to an operator
          acting on the host.
        query: |
          #event_simpleName=/^(NetworkConnectIP4|NetworkConnectIP6|ProcessRollup2|SyntheticProcessRollup2)$/
          | case {
              #event_simpleName=/^(NetworkConnectIP4|NetworkConnectIP6)$/
                | RemotePort in (80, 443, 8443)
                | RemoteAddressIP4!=/^(10\.|127\.|169\.254\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)/
                | channel_destination := RemoteAddressIP4 ;
              #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
                | FileName=/^(cmd|powershell|pwsh|whoami|net|net1|nltest|systeminfo|tasklist|reg|schtasks|wmic|curl|certutil|rundll32|findstr)\.exe$/i
                | tasked_command := CommandLine ;
            }
          | groupBy([ComputerName, ContextProcessId, ContextBaseFileName],
                    function=[collect([channel_destination, tasked_command], limit=10),
                              count(field=tasked_command, distinct=true, as=commands)])
        filters:
          include: []
          exclude:
            - "Automation and configuration-management agents that legitimately run commands"
            - "Remote support sessions with a matching change or incident record"
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - parent_process
            - command_line

evidence:
  required:
    - id: sustained_channel_to_a_public_service
      name: Narrow, sustained relationship with a public web service endpoint
      description: >-
        A single process maintained repeated contact with one endpoint of a public
        collaboration, storage or messaging service over an extended period, which is the
        footprint of a channel rather than of the platform being used.
      source: network_connection
      field: RemoteAddressIP4
      indicates: web_service_command_channel

  supporting:
    - id: non_client_process_holds_the_channel
      name: Channel held by a process that is not the service's client
      description: >-
        The process talking to the platform is a script host, a proxy-execution binary or
        an unrecognised image rather than the application the service belongs to, which is
        the discriminator that survives the destination being beyond suspicion.
      source: network_connection
      field: ContextBaseFileName
      indicates: unexpected_network_actor
    - id: service_resolved_by_that_process
      name: Platform API resolved by the same process
      description: >-
        The process itself queried the service's API name, identifying which platform is
        carrying the channel and giving an analyst a provider to raise a preservation or
        takedown request with.
      source: dns_request
      field: DomainName
      indicates: c2_platform_identified
    - id: channel_process_from_a_staging_path
      name: Channel process runs from a staging path or delivery lineage
      description: >-
        The image behind the channel lives in a temporary, profile or public directory, or
        was launched by a document handler, archive tool or mail client, which is where a
        delivered implant runs from and where sanctioned integrations do not.
      source: process_creation
      field: ImageFileName
      indicates: payload_executed_from_staging_path
    - id: commands_executed_beneath_the_channel
      name: Commands run by the process holding the channel
      description: >-
        Enumeration or execution processes were created directly beneath the process that
        maintains the service relationship, which is instructions arriving and being acted
        on rather than a one-way feed.
      source: process_creation
      field: ParentBaseFileName
      indicates: interactive_tasking_observed
    - id: single_endpoint_shape
      name: Contact confined to one endpoint of the service
      description: >-
        The connection count is high while the number of distinct addresses of the service
        is one or two, unlike a real client which spreads traffic across authentication,
        content and telemetry hosts.
      source: derived
      field: distinct_hosts
      indicates: automated_channel_shape

  contradicting:
    - id: platform_client_or_browser
      name: Traffic belongs to the platform's own client
      description: >-
        The process holding the relationship is the browser or the vendor's own client
        application, for which a long-lived session with the platform is exactly correct.
      source: network_connection
      field: ContextBaseFileName
      indicates: legitimate_user_activity
    - id: sanctioned_integration
      name: Approved integration with the platform
      description: >-
        The host runs a documented integration or automation that synchronises with this
        service under an account the organisation owns.
      source: asset_inventory
      field: ComputerName
      indicates: legitimate_enterprise_activity
    - id: fleetwide_agent_cadence
      name: Same process and cadence across the estate
      description: >-
        The identical process contacts the same endpoint on the same rhythm across many
        hosts, which is deployed software rather than a channel aimed at one machine.
      source: baseline
      field: ContextBaseFileName
      indicates: software_deployment_wave

  risk_logic:
    required:
      - sustained_channel_to_a_public_service

    supporting:
      any:
        - non_client_process_holds_the_channel
        - service_resolved_by_that_process
        - channel_process_from_a_staging_path
        - commands_executed_beneath_the_channel
        - single_endpoint_shape
      all:
        - non_client_process_holds_the_channel
        - channel_process_from_a_staging_path
        - commands_executed_beneath_the_channel

    contradicting:
      any:
        - platform_client_or_browser
        - sanctioned_integration
        - fleetwide_agent_cadence
      all: []

  verdict:
    low_risk_when:
      - sustained_channel_to_a_public_service
      - platform_client_or_browser
      - sanctioned_integration
      - fleetwide_agent_cadence
    suspicious_when:
      - sustained_channel_to_a_public_service
      - non_client_process_holds_the_channel
      - single_endpoint_shape
    high_risk_when:
      - sustained_channel_to_a_public_service
      - non_client_process_holds_the_channel
      - single_endpoint_shape
      - channel_process_from_a_staging_path
      - commands_executed_beneath_the_channel

  false_positive:
    - condition: A backup or file-sync client holds a long session with a storage service.
      explanation: >-
        Sync clients produce exactly the required shape: one process, one storage endpoint,
        continuous contact around the clock. They are separated on the process rather than
        the pattern, and on the fact that the same process and endpoint pairing appears on
        every host with the client installed.
    - condition: A sanctioned integration posts to a chat or ticketing platform on a schedule.
      explanation: >-
        Alerting and reporting integrations call webhook and API endpoints continuously from
        non-browser processes, which satisfies both the actor and the narrowness tests. They
        run from an installation directory under a service account and are recorded in the
        organisation's integration inventory, which is why that inventory is contradicting
        evidence rather than a tuning note.
    - condition: A monitoring agent polls a single collector endpoint.
      explanation: >-
        Telemetry agents are the closest benign analogue to a beacon and will dominate the
        narrow-relationship case if not excluded. They are stable, fleet-wide and identical
        across hosts, so the baseline comparison against the organisation removes them
        rather than a per-host rule.
    - condition: A build agent or script calls a platform API as part of automation.
      explanation: >-
        Automation on engineering hosts calls repository and collaboration APIs from
        interpreters, which looks like a script host holding a channel. The recurring
        association with pipeline runs and the absence of enumeration commands beneath the
        process separate it.
    - condition: A remote support session drives commands from an operator's console.
      explanation: >-
        A legitimate support tool holding a session with its vendor platform and spawning
        commands satisfies almost every item here, including tasking. It is distinguished
        by context rather than telemetry: an approved tool, an authenticated engineer and a
        matching incident or change record.
