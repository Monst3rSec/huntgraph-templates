type: detection

id: hg-win-collection-assembled-on-a-second-internal-host-t1074-002

version: 1.0.0

info:
  name: Collection assembled on a second internal host
  description: >-
    Remote staging is local staging moved one hop out, and the hop is the point. An operator
    who gathers everything on the machine they compromised has put the evidence and the
    payload on a monitored endpoint; an operator who pushes it to an internal file server or
    a forgotten build box has put it somewhere with more disk, better egress and far less
    scrutiny, and has reduced the number of connections their command channel has to make to
    one. So the observable here is not a local directory filling up but a transfer whose
    destination is another machine inside the estate, and the strongest form of it is
    something only share telemetry shows: one destination receiving business data from
    several unrelated source hosts inside one window. That convergence across hosts is the
    signature, and it is the reason this file is not a restatement of T1074.001, where every
    path is local. It is also deliberately not T1570, which owns tooling moving outward to a
    host an operator has just reached; here the payload is data and the direction is inward
    to a collection point. What happens to the collection afterwards belongs to T1560.001
    and to Exfiltration.
  severity: medium
  author: huntgraph
  tags:
    - collection
    - data-staged
    - remote-data-staging
    - smb
    - windows
  references:
    - https://attack.mitre.org/techniques/T1074/002
    - https://attack.mitre.org/detectionstrategies/DET0071
    - https://attack.mitre.org/techniques/T1074
    - https://attack.mitre.org/techniques/T1074/001
    - https://attack.mitre.org/techniques/T1570

mitre:
  tactics:
    - TA0009
  techniques:
    - T1074
  sub_techniques:
    - T1074.002
  detection_strategies:
    - DET0071
  analytics:
    - AN0194
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
    - WinEventLog:Microsoft-Windows-SMBClient/Security
    - WinEventLog:PowerShell
  data_components:
    - Network Share Access
    - Command Execution

hypothesis:
  statement: >-
    An adversary collecting from more than one machine may push what they take to a single
    internal host rather than out of the network directly, assembling the whole collection
    on a system with space and egress that nobody watches, so that only one transfer has to
    cross the perimeter and only one machine has to hold the evidence.
  attacker_behavior:
    - Copies business documents or archives to a UNC path on another internal machine.
    - Sends data from several different source hosts to the same destination share.
    - Writes to a share the account and host have never written to before.
    - Uses scp, rsync or a similar transfer to an internal address rather than an external one.
    - Chooses a destination with capacity and weak monitoring, such as a build or archive server.
  legitimate_behavior:
    - Users save their work to departmental file shares all day.
    - Backup and archiving agents push data to a central store by design.
    - Build and deployment pipelines copy artefacts between internal systems continuously.
    - Log shippers and diagnostic collectors aggregate onto a central server.
    - Departmental migrations move whole trees to a new server.
  risk_indicator:
    - One destination share receives data from several unrelated source hosts at once.
    - The writing account has no baseline history with that destination.
    - The transfer carries documents or archives rather than build or application artefacts.
    - The copy is issued from an interactive shell rather than by a scheduled agent.
    - The destination is an internal address that is not a recognised file or backup server.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: network_share_access
      event_types:
        - SmbFileCreate
        - SmbClientConnect
      fields:
        - aid
        - ComputerName
        - UserName
        - ShareName
        - TargetFileName
        - RemoteAddressIP4
    - source: process_creation
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        - aid
        - ComputerName
        - UserName
        - FileName
        - ImageFileName
        - CommandLine
        - ParentBaseFileName

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: one-destination-fed-by-several-source-hosts
        name: One destination share receiving data from several source hosts
        purpose: >-
          This is the discriminator, and it is visible in no other telemetry. Group writes by
          the destination share and count how many distinct machines are feeding it with
          document and archive content in the same window. A departmental share has a stable
          population; a collection point acquires one suddenly, from hosts with no business
          relationship to each other.
        query: |
          #event_simpleName=/^SmbFileCreate$/
          | TargetFileName=/\.(docx?|xlsx?|pptx?|pdf|csv|msg|eml|pst|ost|zip|7z|rar|tar|gz)$/i
          | UserName!=/\$$/
          | groupBy([ShareName, RemoteAddressIP4],
                    function=[count(ComputerName, distinct=true, as=source_hosts),
                              count(TargetFileName, distinct=true, as=distinct_files),
                              collect([ComputerName, UserName, TargetFileName, aid], limit=50)])
          | source_hosts>=3
          | sort(source_hosts, order=desc)
        filters:
          include: []
          exclude:
            - "Recognised departmental file servers, home-directory servers and backup targets"
            - "Build artefact and package repository shares fed by many agents by design"
        baseline:
          required: true
          window: 90d
          compare:
            - remote_address
            - organization

      - id: documents-or-archives-copied-to-a-unc-destination
        name: Documents or archives copied out to a UNC destination
        purpose: >-
          Catch the instruction that performs the push, and keep it off the ground T1570
          owns. Excluding executable and installer extensions leaves transfers whose payload
          is data, which is what makes this staging for removal rather than tooling arriving
          on a host an operator has just reached.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\\\\[^\\\s"]+\\[^\\\s"]+/
          | CommandLine=/\b(copy|xcopy|robocopy|Copy-Item|move|Move-Item)\b/i
          | CommandLine=/\.(docx?|xlsx?|pptx?|pdf|csv|msg|eml|pst|ost|zip|7z|rar|tar|gz|mdb|accdb|bak|dmp)\b/i
          | CommandLine!=/\.(exe|dll|msi|sys|cab)\b/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=transfers), collect([CommandLine, ImageFileName], limit=50)])
          | sort(transfers, order=asc)
        filters:
          include: []
          exclude:
            - "Scheduled backup and archiving jobs writing to their designated targets"
            - "Departmental migrations running inside a recorded change window"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: data-pushed-to-an-internal-address-over-scp-or-rsync
        name: Data pushed to an internal address over scp or rsync
        purpose: >-
          Cover the transport that share telemetry never sees. Operators on mixed estates
          move collections with scp, rsync or pscp rather than SMB, and the destination being
          a private address is what makes this staging inside the network rather than
          exfiltration straight out of it.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\b(scp|pscp|rsync|sftp|psftp|bitsadmin|curl)\b/i
          | CommandLine=/(\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b|\b192\.168\.\d{1,3}\.\d{1,3}\b|\b172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}\b)/
          | CommandLine=/\.(docx?|xlsx?|pptx?|pdf|csv|msg|eml|pst|zip|7z|rar|tar|gz|bak|dmp)\b/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=transfers), collect([CommandLine], limit=50)])
          | sort(transfers, order=asc)
        filters:
          include: []
          exclude:
            - "Managed file transfer and log shipping jobs with fixed internal endpoints"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - remote_address

      - id: first-write-to-a-destination-share
        name: First write to a destination the account has never used
        purpose: >-
          Provide the rarity leg that makes the volume cases usable. A collection point is
          almost always somewhere the compromised account has never written before, so
          sorting the rarest account and destination pairings to the top surfaces the new
          relationship. This case does nothing until the baseline window is populated.
        query: |
          #event_simpleName=/^(SmbFileCreate|SmbClientConnect)$/
          | UserName!=/\$$/
          | ShareName!=/^(SYSVOL|NETLOGON|IPC\$|print\$)$/i
          | groupBy([UserName, ShareName, RemoteAddressIP4],
                    function=[count(as=writes),
                              count(ComputerName, distinct=true, as=source_hosts),
                              collect([TargetFileName], limit=50)])
          | sort(writes, order=asc)
        filters:
          include: []
          exclude:
            - "Home-directory and departmental shares that every account writes to routinely"
            - "Newly provisioned accounts inside their first weeks, where nothing has history"
        baseline:
          required: true
          window: 90d
          compare:
            - user
            - remote_address
            - organization

evidence:
  required:
    - id: data_written_to_another_host
      name: Business data written to a share on another internal machine
      description: >-
        Documents, mail stores or archives were written to a UNC destination or pushed to an
        internal address, placing collected data on a machine other than the one that held it.
      source: network_share_access
      field: TargetFileName
      indicates: collection_staging

  supporting:
    - id: many_source_hosts_one_destination
      name: Several unrelated source hosts feeding one destination
      description: >-
        The same destination share received document or archive content from several distinct
        machines in one window, which is a collection point being assembled rather than a
        share being used.
      source: network_share_access
      field: ShareName
      indicates: collection_staging
    - id: no_history_with_destination
      name: No baseline history between this account and the destination
      description: >-
        The account has never written to this share or address within the baseline window, so
        the relationship was created for this activity.
      source: baseline
      field: RemoteAddressIP4
      indicates: unusual_activity_for_user
    - id: transfer_command_issued
      name: Copy or transfer command naming a remote destination
      description: >-
        A copy, robocopy, scp or rsync invocation named a UNC path or an internal address and
        carried data rather than software, which states the intent behind the writes.
      source: process_creation
      field: CommandLine
      indicates: collection_staging
    - id: interactive_origin
      name: Transfer issued from a shell rather than an agent
      description: >-
        The transfer was started by a command shell, script host or remote-execution service
        rather than by a scheduled backup, build or shipping agent.
      source: process_creation
      field: ParentBaseFileName
      indicates: hands_on_keyboard_activity

  contradicting:
    - id: backup_or_archive_target
      name: Recognised backup or archive destination
      description: >-
        The destination is a designated backup, archiving or home-directory server, which
        receives data from many hosts because that is its purpose.
      source: asset_inventory
      field: RemoteAddressIP4
      indicates: legitimate_enterprise_activity
    - id: build_or_shipping_pipeline
      name: Build artefact or log shipping pipeline
      description: >-
        The writes come from a build, deployment or log-shipping agent aggregating onto a
        central system on a fixed schedule.
      source: process_creation
      field: ImageFileName
      indicates: scheduled_automation_job
    - id: recorded_migration
      name: Recorded migration or decommission
      description: >-
        The transfer belongs to a share migration or server decommission with a change
        record, which moves whole trees between internal hosts deliberately.
      source: change_management
      field: CommandLine
      indicates: legitimate_administrative_action

  risk_logic:
    required:
      - data_written_to_another_host

    supporting:
      any:
        - many_source_hosts_one_destination
        - no_history_with_destination
        - transfer_command_issued
        - interactive_origin
      all:
        - many_source_hosts_one_destination
        - no_history_with_destination

    contradicting:
      any:
        - backup_or_archive_target
        - build_or_shipping_pipeline
        - recorded_migration
      all: []

  verdict:
    low_risk_when:
      - data_written_to_another_host
      - backup_or_archive_target
      - build_or_shipping_pipeline
      - recorded_migration
    suspicious_when:
      - data_written_to_another_host
      - no_history_with_destination
    high_risk_when:
      - data_written_to_another_host
      - many_source_hosts_one_destination
      - transfer_command_issued
      - interactive_origin

  false_positive:
    - condition: A backup or archiving agent aggregates data onto a central store.
      explanation: >-
        Aggregating from many hosts onto one destination is exactly what backup does, and it
        satisfies the strongest evidence here at far greater scale. It is separable because
        the destination is a known backup target, the identity is a service or machine
        account, and the population of source hosts is stable rather than newly formed.
    - condition: A build or deployment pipeline copies artefacts between internal systems.
      explanation: >-
        Pipelines move archives between hosts constantly and can carry tar and zip content
        that matches the extension filter. They run from build agents on a fixed schedule
        against repository shares, and the payload is build output rather than documents.
    - condition: Users save their work to a departmental file share.
      explanation: >-
        Ordinary saving produces writes of exactly these file types from many workstations to
        one share, which is why the host-count case cannot stand alone. Those shares have
        long baseline history with the same accounts, so the rarity leg is the separator.
    - condition: A department is migrated to a new file server.
      explanation: >-
        Migration reproduces the convergence, the extensions and the recursive copy together,
        because it is the same operation for a good reason. It is bounded by a change record
        and runs from administrative hosts to a destination provisioned for the purpose.
    - condition: A log shipper or diagnostic collector aggregates onto a central server.
      explanation: >-
        Collectors pull from the whole estate to one place and often compress before sending.
        The content is logs and diagnostics rather than business documents, and the acting
        process is the shipping agent running as a service.
