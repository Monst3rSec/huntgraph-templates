type: detection

id: hg-win-junk-appended-to-a-binary-to-change-its-hash-t1027-001
version: 1.0.0

info:
  name: Junk appended to a binary to change its hash
  description: >-
    Padding a payload costs the adversary nothing and buys two things at once. Appending
    bytes that the loader never reads changes the checksum, so a hash blocklist that already
    knows the file stops matching it, and inflating the file past a scanner's size ceiling
    means some products stop looking at it at all — sandboxes, mail gateways and public
    scanning services all decline files above a threshold. The file still runs exactly as it
    did before, which is why nothing downstream looks different. Endpoint telemetry does not
    publish file size, so a hunt cannot ask "is this file implausibly large"; what it can see
    is the act of padding, because appending junk to an executable on a workstation takes a
    concatenation, a byte-write loop or a size-manipulation utility, and each of those has a
    recognisable command line. The consequence is visible too: a padded sample is unique by
    construction, so its hash appears on exactly one host in an estate where every other
    executable in the same directory appears on hundreds.
  severity: medium
  author: huntgraph
  tags:
    - stealth
    - obfuscation
    - binary-padding
    - windows
  references:
    - https://attack.mitre.org/techniques/T1027/001
    - https://attack.mitre.org/detectionstrategies/DET0553
    - https://attack.mitre.org/techniques/T1027

mitre:
  tactics:
    - TA0005
  techniques:
    - T1027
  sub_techniques:
    - T1027.001
  detection_strategies:
    - DET0553
  analytics:
    - AN1528
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An adversary may append junk bytes to a payload so that its hash no longer matches a
    blocklist and its size exceeds what scanners will inspect, obtaining a functionally
    identical binary that static controls no longer recognise.
  attacker_behavior:
    - Concatenates a payload with a junk file to produce a new executable.
    - Appends generated bytes to an existing binary with a script or byte-write loop.
    - Uses a file-size utility to inflate the artefact without altering its code.
    - Runs the padded output from the directory it was assembled in.
    - Repeats the padding after a control blocks the previous hash.
  legitimate_behavior:
    - Installers and self-extracting packages concatenate payloads into a single stub.
    - Build tooling appends resources, signatures or manifests to compiled output.
    - Backup and disk-provisioning tools pre-allocate large files deliberately.
    - Developers assemble binaries from parts during packaging on engineering hosts.
    - Media and virtual-disk workflows create very large files as a matter of course.
  risk_indicator:
    - The concatenation targets an executable in a user-writable directory.
    - The appending is done by a shell or interpreter rather than a build tool.
    - The resulting executable runs and its hash is seen on one host only.
    - The host has no development, packaging or imaging role.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        - aid
        - ComputerName
        - UserName
        - FileName
        - ImageFileName
        - CommandLine
        - ParentBaseFileName
        - SHA256HashData
    - source: file_creation
      event_types:
        - PeFileWritten
        - NewExecutableWritten
      fields:
        - aid
        - ComputerName
        - TargetFileName
        - ContextProcessId
        - SHA256HashData

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: executable-assembled-by-concatenation
        name: Executable produced by binary concatenation
        purpose: >-
          Surface the cheapest form of padding, where a payload and a junk file are joined
          into a new executable in one command. The binary-mode switch matters: text-mode
          copies are ordinary file handling, binary-mode concatenation of an executable with
          something else is assembly of a new artefact.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\bcopy\s+\/b\b/i
          | CommandLine=/\S+\s*\+\s*\S+/
          | CommandLine=/\.(exe|dll|scr|ocx|cpl|sys|bin|dat)\b/i
        filters:
          include: []
          exclude:
            - "Packaging scripts on build and imaging hosts"
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - user
            - command_line

      - id: junk-bytes-appended-by-script
        name: Bytes appended to a binary by an interpreter
        purpose: >-
          Catch the scripted route, where generated or random bytes are written onto the end
          of an existing file. The distinguishing detail is that the write is an append to a
          binary that already exists rather than the creation of a new file, so the code is
          untouched and only the checksum moves.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Add-Content\s+[^|]*-(Encoding\s+Byte|AsByteStream)|::AppendAllBytes|::WriteAllBytes|FileMode\]::Append|fsutil\s+file\s+(setvaliddata|createnew)|New-Object\s+byte\[\]\s*\d{4,}|Get-Random\s+[^|]*-Count\s+\d{4,})/i
          | CommandLine=/\.(exe|dll|scr|ocx|cpl|sys|bin|dat)\b/i
        filters:
          include: []
          exclude:
            - "Disk provisioning and pre-allocation jobs on server builds"
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - user
            - command_line

      - id: padded-output-written-locally
        name: Executable written into a user-writable directory
        purpose: >-
          Locate the artefact the padding produced. On its own this is ordinary; scoped to a
          host and window where a concatenation or append command was seen, it identifies the
          file that was padded and gives the hash to pivot on.
        query: |
          #event_simpleName=/^(PeFileWritten|NewExecutableWritten)$/
          | TargetFileName=/\\(AppData|Temp|ProgramData|Users|Public|Downloads|PerfLogs)\\/i
          | TargetFileName!=/\\(ccmcache|SoftwareDistribution|Installer|Package Cache)\\/i
        filters:
          include:
            - "Hosts and time windows where an appending or concatenation command line was seen"
          exclude:
            - "ContextProcessId of software distribution agents and vendor installers"
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - path
            - organization

      - id: single-host-hash-executed
        name: Executable running whose hash exists on one host only
        purpose: >-
          Confirm the padding achieved its purpose. Every copy of a padded sample is unique,
          so it executes with a hash that has no presence anywhere else in the estate, unlike
          an installed product whose binaries are identical on every machine that runs them.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | ImageFileName=/\\(AppData|Temp|ProgramData|Users|Public|Downloads|PerfLogs)\\/i
          | ImageFileName!=/\\(ccmcache|SoftwareDistribution|Package Cache)\\/i
          | groupBy([SHA256HashData],
                    function=[count(ComputerName, distinct=true, as=hosts),
                              count(as=executions),
                              collect([ComputerName, UserName, ImageFileName], limit=5)])
          | hosts <= 1
          | sort(executions, order=asc)
        filters:
          include: []
          exclude:
            - "Per-user builds of self-updating applications that hash differently per install"
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - path
            - organization

evidence:
  required:
    - id: bytes_appended_to_executable
      name: Junk appended to an executable
      description: >-
        A command line joined an executable to other content in binary mode, appended
        generated bytes to it, or inflated it with a size utility, which changes the file's
        hash and length without changing what it does.
      source: process_creation
      field: CommandLine
      indicates: hash_evasion

  supporting:
    - id: padded_file_written
      name: Padded executable landed on disk
      description: >-
        An executable was written into a user-writable directory on the same host, which is
        the artefact the padding produced and the file that will be run.
      source: file_creation
      field: TargetFileName
      indicates: payload_staging
    - id: unique_hash_executed
      name: Executed hash exists on one host only
      description: >-
        The executable that ran has a hash with no presence elsewhere in the estate, which is
        the expected result of appending unique junk to a known payload.
      source: process_creation
      field: SHA256HashData
      indicates: unusual_binary_in_environment
    - id: written_by_non_installer
      name: Written by something other than an installer
      description: >-
        The process that wrote the executable is not a distribution agent or vendor
        installer, so the file was produced locally rather than delivered.
      source: file_creation
      field: ContextProcessId
      indicates: abnormal_execution_chain
    - id: unusual_for_host
      name: No history of binary assembly on this host
      description: >-
        Concatenation and byte-append commands have not been seen on this host during the
        baseline window, so the activity is a deviation as well as a padding operation.
      source: baseline
      field: ComputerName
      indicates: unusual_activity_for_host

  contradicting:
    - id: packaging_workflow
      name: Packaging or imaging work
      description: >-
        The concatenation belongs to a build, installer-packaging or disk-imaging workflow on
        a host whose role is to assemble binaries from parts.
      source: asset_inventory
      field: ComputerName
      indicates: expected_developer_activity
    - id: vendor_installer_wrote_file
      name: Written by a recognised installer
      description: >-
        The executable was produced by a software distribution agent or self-extracting
        vendor package unpacking its own contents.
      source: file_creation
      field: ContextProcessId
      indicates: legitimate_enterprise_activity
    - id: hash_seen_across_estate
      name: Same hash present on many hosts
      description: >-
        The executable's hash appears widely, which means it is a distributed product binary
        rather than a one-off artefact assembled on this machine.
      source: baseline
      field: SHA256HashData
      indicates: legitimate_application_component

  risk_logic:
    required:
      - bytes_appended_to_executable

    supporting:
      any:
        - padded_file_written
        - unique_hash_executed
        - written_by_non_installer
        - unusual_for_host
      all:
        - padded_file_written
        - unique_hash_executed

    contradicting:
      any:
        - packaging_workflow
        - vendor_installer_wrote_file
        - hash_seen_across_estate
      all: []

  verdict:
    low_risk_when:
      - bytes_appended_to_executable
      - packaging_workflow
      - vendor_installer_wrote_file
      - hash_seen_across_estate
    suspicious_when:
      - bytes_appended_to_executable
      - unusual_for_host
    high_risk_when:
      - bytes_appended_to_executable
      - padded_file_written
      - unique_hash_executed
      - written_by_non_installer

  false_positive:
    - condition: An installer stub is built by concatenating a payload onto a loader.
      explanation: >-
        Self-extracting archives and installer stubs are assembled exactly this way, in
        binary mode, joining an executable to a data blob. They are built on packaging hosts
        by build tooling, and the resulting hash then appears on every machine the package is
        delivered to rather than on one.
    - condition: A provisioning script pre-allocates a large file.
      explanation: >-
        Disk and database provisioning uses the same size-manipulation utilities to reserve
        space. The target is a data file or virtual disk rather than an executable, and the
        operation runs under a service account on a server as part of a scheduled build.
    - condition: A developer appends a manifest, signature or resource to a compiled binary.
      explanation: >-
        Post-build steps routinely modify an executable after linking. These run inside a
        build workspace under a compiler or build agent parent, not from a download or
        temporary directory under an interactive shell.
    - condition: An application updates itself with a per-installation binary.
      explanation: >-
        A few products compile or personalise a binary per install, so its hash is genuinely
        unique to a host. These live under the product's installation directory and reappear
        with the same file name on every host running the product.
