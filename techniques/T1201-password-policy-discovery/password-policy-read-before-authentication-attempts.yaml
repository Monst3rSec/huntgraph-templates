type: detection

id: hg-any-password-policy-read-before-authentication-attempts-t1201

version: 1.0.0

info:
  name: Password policy read before authentication attempts against many accounts
  description: >-
    This is reconnaissance with one purpose, and naming the purpose is what makes it
    hunt-worthy. An operator who has a list of accounts and wants to guess passwords has to
    know two numbers first: how long and complex a password must be, so the guess list is
    not wasted on candidates the policy forbids, and how many failures an account tolerates
    before it locks, so the campaign can stay underneath it. `net accounts /domain` answers
    both in one line. That is why the command turns up in the reconnaissance phase of Turla,
    OilRig, Kwampirs and Operation CuckooBees rather than anywhere else in their tooling.
    Read on its own the command is weak evidence — a support engineer diagnosing a locked
    account runs it too, and so does any script that documents domain configuration. Read as
    the precursor it is, it becomes strong: this file is the front half of the password
    spraying template, and the case that joins a policy query to a subsequent burst of
    failed logons from the same host is the one worth deploying first. The tell that
    separates the two readings is depth. An engineer answering a question runs the command
    once and stops; an operator preparing a campaign runs it, then authenticates.
  severity: medium
  author: huntgraph
  tags:
    - discovery
    - password-policy
    - credential-access-precursor
    - password-spraying
    - windows
    - linux
  references:
    - https://attack.mitre.org/techniques/T1201
    - https://attack.mitre.org/detectionstrategies/DET0161
    - https://attack.mitre.org/techniques/T1110/003

mitre:
  tactics:
    - TA0007
  techniques:
    - T1201
  sub_techniques: []
  detection_strategies:
    - DET0161
  analytics:
    - AN0455
    - AN0456
  platforms:
    - Windows
    - Linux
  data_sources:
    - WinEventLog:Sysmon
    - auditd:SYSCALL
  data_components:
    - Process Creation
    - Command Execution

hypothesis:
  statement: >-
    An adversary holding a set of account names may read the domain or local password policy
    to learn the minimum length, complexity requirement and lockout threshold, and then
    shape a guessing campaign that stays below the threshold so no account ever locks and no
    per-account alert is raised.
  attacker_behavior:
    - Runs net accounts or net accounts /domain to read length, age and lockout settings.
    - Retrieves the domain policy through Get-ADDefaultDomainPasswordPolicy or a PowerView equivalent.
    - Exports the local security policy with secedit to read the account lockout section offline.
    - Uses an offensive framework module such as Get-PassPol or a pass-pol switch to fetch the policy remotely.
    - Reads chage output, login.defs or the PAM password-quality configuration on a Linux host.
    - Begins authentication attempts against many accounts shortly after reading the policy.
  legitimate_behavior:
    - A service desk engineer checks the lockout threshold while investigating a locked account.
    - Configuration and compliance tooling documents the effective password policy on a schedule.
    - A build or hardening script reads policy to confirm a baseline was applied.
    - An administrator reads login.defs or pwquality.conf while changing password requirements on a Linux host.
    - Identity migration work compares the policy of two domains during a merge.
  risk_indicator:
    - The policy query is followed by failed authentication against many distinct accounts from the same host.
    - The querying process was launched by an interpreter, a remote-execution service or a delivery-chain parent.
    - The same principal runs other account and group enumeration in the same short window.
    - The host has no history of policy queries during the baseline window.
    - The account running the query is not one that administers identity.

requires:
  platforms:
    - windows
    - linux
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        - aid
        - ComputerName
        - UserName
        - FileName
        - ImageFileName
        - CommandLine
        - ParentBaseFileName
    - source: authentication
      event_types:
        - UserLogonFailed2
      fields:
        - aid
        - ComputerName
        - UserName
        - RemoteAddressIP4

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: domain-password-policy-queried
        name: Domain or local password policy read from the command line
        purpose: >-
          Surface the read itself across the utilities that answer the question — the Net
          command, the directory cmdlet, the security-policy export and the offensive
          framework modules that wrap them. Ranking ascending puts the rare invocations
          first, because the volume in any estate comes from a handful of management hosts
          that do this constantly and from nowhere else.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(\bnet1?\s+accounts\b|Get-ADDefaultDomainPasswordPolicy|Get-ADFineGrainedPasswordPolicy|\bsecedit\b.{0,40}\/export|Get-PassPol|Get-DomainPolicy|--pass-pol|\bpass-pol\b|Get-GPPasswordPolicy)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=queries), collect([CommandLine, ImageFileName, aid], limit=50)])
          | sort(queries, order=asc)
        filters:
          include: []
          exclude:
            - "ComputerName of identity administration and service desk workstations"
            - "ParentBaseFileName of the configuration-compliance and policy-reporting agents"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - parent_process
            - command_line

      - id: unix-password-policy-configuration-read
        name: Password ageing and quality configuration read on a Linux host
        purpose: >-
          Cover the equivalent question on Linux, where there is no single command and the
          answer lives in configuration files. Reading chage output for another user, or
          grepping the PAM password-quality settings, is the same reconnaissance step
          expressed through the tools the platform provides.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(\bchage\b\s+-l|\/etc\/login\.defs|\/etc\/security\/pwquality\.conf|\/etc\/pam\.d\/(common-password|system-auth|password-auth)|pam_pwquality|pam_cracklib|\bpwscore\b)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=reads), collect([CommandLine], limit=50)])
          | sort(reads, order=asc)
        filters:
          include: []
          exclude:
            - "Configuration management agents that template PAM and login.defs on every host"
            - "ComputerName of build and golden-image hosts where hardening is applied"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: policy-query-then-account-failures
        name: Policy read followed by failed logons against many accounts
        purpose: >-
          Join the reconnaissance to the campaign it was preparing for. This is the case
          that turns a common administrative command into a finding: a host that reads the
          lockout threshold and then produces authentication failures spread across a wide
          set of accounts is doing the two halves of a spray, and the breadth of distinct
          accounts is what distinguishes it from a user with a stale credential.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2|UserLogonFailed2)$/
          | case {
              #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
                | CommandLine=/(\bnet1?\s+accounts\b|Get-ADDefaultDomainPasswordPolicy|\bsecedit\b.{0,40}\/export|Get-PassPol|--pass-pol|Get-DomainPolicy)/i
                | policy_query := CommandLine ;
              #event_simpleName=UserLogonFailed2
                | attempted_account := UserName ;
            }
          | groupBy([ComputerName],
                    function=[collect([policy_query, ParentBaseFileName, RemoteAddressIP4], limit=50),
                              count(attempted_account, distinct=true, as=accounts_attempted)])
          | policy_query=/.+/
          | accounts_attempted >= 10
          | sort(accounts_attempted, order=desc)
        filters:
          include: []
          exclude:
            - "ComputerName of gateways and appliances that authenticate on behalf of many users"
        baseline:
          required: true
          window: 30d
          compare:
            - host
            - user
            - organization

evidence:
  required:
    - id: password_policy_query
      name: Password policy read
      description: >-
        A command read the domain or local password policy — length, complexity, age or
        lockout threshold — through Net, a directory cmdlet, a security-policy export or the
        Linux ageing and password-quality configuration.
      source: process_creation
      field: CommandLine
      indicates: password_policy_discovery

  supporting:
    - id: authentication_burst_follows
      name: Failed logons against many accounts from the same host
      description: >-
        The host that read the policy went on to produce authentication failures spread
        across a wide set of distinct accounts, which is the campaign the policy read was
        sizing.
      source: authentication
      field: UserName
      indicates: credential_attack_in_progress
    - id: scripted_or_remote_parent
      name: Interpreter or remote-execution parent
      description: >-
        The querying process was launched by a command interpreter, a remote-execution
        service or a delivery-chain parent rather than by an interactive administrative
        session or a management agent.
      source: process_creation
      field: ParentBaseFileName
      indicates: abnormal_execution_chain
    - id: offensive_tooling_syntax
      name: Offensive framework module invoked
      description: >-
        The command used a module name specific to an offensive framework, such as a
        pass-pol switch or a PowerView policy function, which has no counterpart in native
        administration.
      source: process_creation
      field: ImageFileName
      indicates: known_offensive_tooling
    - id: rare_for_host
      name: No history of policy queries on this host
      description: >-
        Nothing comparable has been seen on this host during the baseline window, unlike the
        management systems where policy queries recur.
      source: baseline
      field: CommandLine
      indicates: unusual_activity_for_host

  contradicting:
    - id: identity_administration_host
      name: Identity administration or service desk host
      description: >-
        The host is a directory administration workstation or service desk system where
        reading the password policy is part of routine account support work.
      source: asset_inventory
      field: ComputerName
      indicates: legitimate_enterprise_activity
    - id: compliance_tooling
      name: Configuration or compliance agent
      description: >-
        The approved compliance, hardening or documentation agent performed the read as part
        of its scheduled policy collection.
      source: process_creation
      field: FileName
      indicates: legitimate_enterprise_activity
    - id: recurring_schedule
      name: Query recurs on a stable schedule
      description: >-
        The same query appears at a regular interval across many hosts, which is automated
        documentation rather than a one-off question asked before an attack.
      source: baseline
      field: ComputerName
      indicates: scheduled_automation_job

  risk_logic:
    required:
      - password_policy_query

    supporting:
      any:
        - authentication_burst_follows
        - scripted_or_remote_parent
        - offensive_tooling_syntax
        - rare_for_host
      all:
        - authentication_burst_follows
        - rare_for_host

    contradicting:
      any:
        - identity_administration_host
        - compliance_tooling
        - recurring_schedule
      all: []

  verdict:
    low_risk_when:
      - password_policy_query
      - identity_administration_host
      - compliance_tooling
      - recurring_schedule
    suspicious_when:
      - password_policy_query
      - rare_for_host
      - scripted_or_remote_parent
    high_risk_when:
      - password_policy_query
      - rare_for_host
      - scripted_or_remote_parent
      - authentication_burst_follows
      - offensive_tooling_syntax

  false_positive:
    - condition: A service desk engineer checks the lockout threshold while investigating a locked account.
      explanation: >-
        This is the single most common benign source and it reproduces the required evidence
        exactly. It is distinguished by the absence of any follow-on authentication from that
        host, by an interactive parent, and by the engineer's account appearing in the
        service desk group.
    - condition: Compliance or hardening tooling documents the effective policy on a schedule.
      explanation: >-
        Policy documentation runs from a known agent, recurs on a fixed interval and appears
        identically across a large share of the estate, which is the opposite of the one-off
        query this hypothesis is about.
    - condition: A Linux configuration management run templates login.defs and the PAM stack.
      explanation: >-
        Configuration management reads and rewrites exactly the files in the second case,
        often on every host in a converge cycle. It is identifiable by the agent as parent
        and by the write that accompanies the read.
    - condition: An identity migration project compares password policies between two domains.
      explanation: >-
        Migration work legitimately queries policy repeatedly and from unusual hosts, which
        defeats the baseline. It is bounded in time and should be recorded as a change so the
        window can be attributed rather than rediscovered.
    - condition: A host both reads policy and produces many logon failures because a service account credential expired.
      explanation: >-
        An expired credential on a busy host can generate failures across several accounts
        while an engineer is simultaneously reading the policy to diagnose it. The
        distinguishing feature is that the failures concentrate on a few service accounts
        rather than spreading across a wide and unrelated set of names.
