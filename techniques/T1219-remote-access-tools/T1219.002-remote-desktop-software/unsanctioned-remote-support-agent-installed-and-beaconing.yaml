type: detection

id: hg-win-unsanctioned-remote-support-agent-installed-and-beaconing-t1219-002

version: 1.0.0

info:
  name: Unsanctioned remote support agent installed and beaconing
  description: >-
    Commercial remote support and remote monitoring products give an adversary the thing a
    shell does not: the user's screen, keyboard and session, delivered by signed software
    that application control usually permits and that a help desk has a plausible reason to
    run. The agent connects outward to the vendor's cloud relay, so no listener is opened and
    no inbound firewall rule is needed, and the operator joins from the vendor's portal.
    Because the product is genuine, nothing about the binary, the signature or the traffic is
    anomalous in itself, and hunting for the names of remote support tools across an estate
    that legitimately runs one of them produces nothing but the sanctioned product. The
    discriminator is therefore not which product it is but whether it is the estate's
    product. Almost every organisation standardises on one remote support tool; a second one
    appearing on a single host, written into a profile or temporary directory rather than
    installed, and immediately holding a session with its vendor's relay is the finding. That
    judgement is impossible without estate history, so the baseline is a precondition rather
    than an enrichment. This is the outbound, relay-brokered form of remote control and is
    distinct from a server installed locally to accept an inbound connection.
  severity: high
  author: huntgraph
  tags:
    - command-and-control
    - remote-access
    - remote-monitoring
    - remote-desktop
    - windows
  references:
    - https://attack.mitre.org/techniques/T1219/002
    - https://attack.mitre.org/detectionstrategies/DET0259
    - https://attack.mitre.org/techniques/T1219
    - https://attack.mitre.org/techniques/T1021/005

mitre:
  tactics:
    - TA0011
  techniques:
    - T1219
  sub_techniques:
    - T1219.002
  detection_strategies:
    - DET0259
  analytics:
    - AN0714
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - File Creation
    - Network Connection Creation

hypothesis:
  statement: >-
    An adversary may install a commercial remote support agent on a compromised host so that
    they control the desktop through the vendor's cloud relay, obtaining hands-on access with
    signed software that endpoint controls permit and that needs no inbound firewall rule.
  attacker_behavior:
    - Writes a portable remote support agent into a profile or temporary directory and runs it there.
    - Chooses a product the organisation does not use, so no existing deployment explains it.
    - Lets the agent register outward with the vendor relay rather than opening a listener.
    - Keeps the session open so the host can be rejoined from the vendor portal at will.
    - Uses the graphical session to operate applications as the user rather than issuing commands.
  legitimate_behavior:
    - The service desk deploys its standard remote support agent across the estate.
    - Vendors run their own support tool during a diagnostic session with permission.
    - Managed service providers install monitoring agents on the systems they administer.
    - Users install a consumer remote access product to reach their own machines.
  risk_indicator:
    - The product is not the one the organisation has standardised on.
    - The agent binary is written to a user-writable path rather than an installation directory.
    - The agent appears on one host rather than across a deployment group.
    - The relay endpoint has never been contacted by anything else in the estate.
    - The binary hash is unknown elsewhere in the estate during the baseline window.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - PeFileWritten
        - NewExecutableWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId
        file_hash: SHA256HashData
    - source: file_creation
      connector: wazuh
      event_types:
        - sysmon_event_11
      fields:
        agent_id: agent.id
        host: win.system.computer
        file_path: win.eventdata.targetFilename
        writer_process_id: win.eventdata.processId
        file_hash: win.eventdata.hashes
    - source: network_connection
      connector: crowdstrike-ngsiem
      event_types:
        - NetworkConnectIP4
        - NetworkConnectIP6
      fields:
        agent_id: aid
        host: ComputerName
        process_name: ContextBaseFileName
        process_id: ContextProcessId
        remote_address: RemoteAddressIP4
        remote_port: RemotePort
    - source: network_connection
      connector: wazuh
      event_types:
        - sysmon_event3
      fields:
        agent_id: agent.id
        host: win.system.computer
        process_name: win.eventdata.image
        process_id: win.eventdata.processId
        remote_address: win.eventdata.destinationIp
        remote_port: win.eventdata.destinationPort
    - source: dns_request
      connector: crowdstrike-ngsiem
      event_types:
        - DnsRequest
      fields:
        agent_id: aid
        host: ComputerName
        query_name: DomainName
        process_id: ContextProcessId
    - source: dns_request
      connector: wazuh
      event_types:
        - sysmon_event_22
      fields:
        agent_id: agent.id
        host: win.system.computer
        query_name: win.eventdata.queryName
        process_id: win.eventdata.processId

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: remote-support-agent-binary-written
        name: Remote support agent binary appearing on a host
        purpose: >-
          Establish the base population. The product is legitimate, so the question is not
          whether a remote support agent exists but which one and where, and sorting by
          rarity puts the single unsanctioned arrival above the estate's own standard tool.
        query: |
          #event_simpleName=/^(PeFileWritten|NewExecutableWritten)$/
          | TargetFileName=/\\(teamviewer|tv_w32|tv_x64|anydesk|screenconnect|connectwisecontrol|logmein|lmiguardiansvc|ammyy|aa_v\d+|atera|ateraagent|splashtop|srmanager|srservice|supremo|netsupport|client32|pcicfgui|remoteutilities|rutserv|rfusclient|simplehelp|action1|ninjarmm|ninjaone|netbird|dwagent|gotoassist|zohoassist|rustdesk|todesk|dameware|meshagent|ultravnc|tightvnc|winvnc|x11vnc)[^\\]*\.exe$/i
          | groupBy([ComputerName, TargetFileName, SHA256HashData],
                    function=[count(as=writes)])
          | sort(writes, order=asc)
        filters:
          include: []
          exclude:
            - "The remote support product the organisation has standardised on"
            - "Managed service provider agents covered by the support contract"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - path
            - organization

      - id: agent-dropped-outside-an-installation-path
        name: Agent written to a profile or temporary directory
        purpose: >-
          Separate a deployment from a drop. A product the service desk rolls out lands in a
          program directory through an installer; a portable agent an operator brings with
          them lands wherever they can write, and runs from there.
        query: |
          #event_simpleName=/^(PeFileWritten|NewExecutableWritten)$/
          | TargetFileName=/(teamviewer|anydesk|screenconnect|connectwise|logmein|ammyy|atera|splashtop|srmanager|supremo|netsupport|client32|rutserv|rfusclient|simplehelp|action1|ninjarmm|netbird|dwagent|zohoassist|rustdesk|todesk|meshagent|ultravnc|tightvnc|winvnc)/i
          | TargetFileName=/\\(Users|AppData|Temp|Downloads|Public|PerfLogs|Windows\\Temp)\\/i
          | groupBy([ComputerName, TargetFileName, ContextProcessId],
                    function=[count(as=writes), collect([SHA256HashData, aid], limit=50)])
          | sort(writes, order=asc)
        filters:
          include: []
          exclude:
            - "Installer staging directories used by the sanctioned deployment platform"
        baseline:
          required: false
          window: null
          compare: []

      - id: vendor-relay-contacted-from-this-host
        name: Remote support vendor relay resolved and connected to
        purpose: >-
          Confirm the agent registered rather than merely landing on disk. The relay is what
          makes the host reachable from the vendor portal, so contact with it is the point at
          which a dropped binary becomes an open channel.
        query: |
          #event_simpleName=/^(NetworkConnectIP4|NetworkConnectIP6|DnsRequest)$/
          | case {
              #event_simpleName=DnsRequest
                | DomainName=/(^|\.)(teamviewer\.com|anydesk\.com|screenconnect\.com|connectwise\.com|logmein\.com|logmeinrescue\.com|ammyy\.com|atera\.com|splashtop\.com|supremocontrol\.com|netsupportsoftware\.com|remoteutilities\.com|simple-help\.com|action1\.com|ninjarmm\.com|ninjaone\.com|dwservice\.net|assist\.zoho\.com|rustdesk\.com|todesk\.com|netbird\.io|gotoassist\.com|meshcentral\.com)$/i
                | relay_domain := DomainName ;
              #event_simpleName=/^(NetworkConnectIP4|NetworkConnectIP6)$/
                | RemotePort in (443, 80, 5938, 7070, 6568, 5650, 8041)
                | peer := RemoteAddressIP4 ;
            }
          | groupBy([ComputerName, ContextProcessId],
                    function=[collect([ContextBaseFileName, relay_domain, peer, DomainName]),
                              count(as=events)])
          | relay_domain=/.+/
          | peer=/.+/
        filters:
          include: []
          exclude:
            - "The vendor relay belonging to the organisation's own remote support product"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - domain
            - organization

      - id: agent-holding-a-steady-outbound-session
        name: Remote support agent keeping a session open to its relay
        purpose: >-
          Show the channel is live rather than dormant. These agents hold or repeatedly
          re-establish an outbound session so the operator can join at any time, and that
          persistence on a host with no support relationship is the access itself.
        query: |
          #event_simpleName=/^(NetworkConnectIP4|NetworkConnectIP6)$/
          | ContextBaseFileName=/^(teamviewer|tv_w32|tv_x64|anydesk|screenconnect|connectwisecontrol|logmein|lmiguardiansvc|ammyy|aa_v\d+|ateraagent|srmanager|srservice|supremo|client32|pcicfgui|rutserv|rfusclient|simplehelp|action1|ninjarmm|ninjarmmagent|dwagent|zohoassist|rustdesk|todesk|meshagent|winvnc|ultravnc|tvnserver)[^\\]*\.exe$/i
          | RemotePort in (443, 80, 5938, 7070, 6568, 5650, 8041, 5900)
          | groupBy([ComputerName, ContextBaseFileName, RemoteAddressIP4, RemotePort],
                    function=[count(as=connections)])
          | sort(connections, order=asc)
        filters:
          include: []
          exclude:
            - "The sanctioned remote support agent maintaining its normal management session"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - process
            - remote_address

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 101072
      group: huntgraph,windows,command-and-control,remote-access
      lists: []

    cases:
      - id: agent-dropped-outside-an-installation-path
        covers: agent-dropped-outside-an-installation-path
        name: Agent written to a profile or temporary directory
        purpose: >-
          Separate a deployment from a drop. A product the service desk rolls out
          lands in a program directory through an installer; a portable agent an
          operator brings with them lands wherever they can write, and runs from
          there.
        rule: |
          <rule id="101072" level="12">
            <if_group>sysmon_event_11</if_group>
            <field name="win.eventdata.targetFilename" type="pcre2">(?i)(teamviewer|anydesk|screenconnect|connectwise|logmein|ammyy|atera|splashtop|srmanager|supremo|netsupport|client32|rutserv|rfusclient|simplehelp|action1|ninjarmm|netbird|dwagent|zohoassist|rustdesk|todesk|meshagent|ultravnc|tightvnc|winvnc)</field>
            <field name="win.eventdata.targetFilename" type="pcre2">(?i)\\(Users|AppData|Temp|Downloads|Public|PerfLogs|Windows\\Temp)\\</field>
            <description>Agent written to a profile or temporary directory</description>
            <mitre><id>T1219.002</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: remote-support-agent-binary-written
        reason: >-
          Depends on a 90d baseline comparison (host, path, organization); a stateless
          rule holds no history.
      - case: vendor-relay-contacted-from-this-host
        reason: >-
          Depends on a 90d baseline comparison (host, domain, organization); a
          stateless rule holds no history.
      - case: agent-holding-a-steady-outbound-session
        reason: >-
          Depends on a 90d baseline comparison (host, process, remote_address); a
          stateless rule holds no history.

evidence:
  required:
    - id: unsanctioned_remote_support_agent_written
      name: A remote support agent that is not the estate's product appeared
      description: >-
        A commercial remote support or monitoring agent was written to this host, and it is
        not the product the organisation has standardised on, so no existing deployment
        accounts for its presence.
      source: file_creation
      field: file_path
      indicates: remote_access_tool_deployed

  supporting:
    - id: agent_dropped_outside_an_installation_path
      name: Agent written to a profile or temporary directory
      description: >-
        The binary landed somewhere a user or an operator can write rather than in a program
        directory, which is how a portable agent is brought in rather than deployed.
      source: file_creation
      field: writer_process_id
      indicates: tooling_staged_on_host
    - id: vendor_relay_resolved
      name: Vendor relay resolved from this machine
      description: >-
        The host looked up the remote support vendor's relay domain, showing the agent tried
        to register rather than sitting inert on disk.
      source: dns_request
      field: query_name
      indicates: external_service_contacted
    - id: agent_holding_an_outbound_session
      name: Agent maintaining a session with its relay
      description: >-
        The agent process kept or repeatedly re-established an outbound connection, which is
        what leaves the host joinable from the vendor's portal.
      source: network_connection
      field: process_name
      indicates: inbound_access_available
    - id: relay_endpoint_new_to_the_estate
      name: Relay endpoint not contacted by anything else
      description: >-
        No other host has reached this destination during the baseline window, so the channel
        belongs to this machine alone rather than to a managed deployment.
      source: network_connection
      field: remote_address
      indicates: unusual_destination
    - id: binary_unseen_elsewhere_in_the_estate
      name: Binary hash unknown across the estate
      description: >-
        The hash has not been observed on any other host during the baseline window, which
        separates a single introduced agent from a distributed standard build component.
      source: baseline
      field: SHA256HashData
      indicates: unusual_activity_for_host

  contradicting:
    - id: sanctioned_remote_support_product
      name: Product is the estate's standard remote support tool
      description: >-
        The agent is the remote support or monitoring product the organisation operates, and
        this host is within its documented deployment scope.
      source: asset_inventory
      field: ComputerName
      indicates: legitimate_enterprise_activity
    - id: recorded_support_session
      name: Recorded support or vendor diagnostic session
      description: >-
        A support record covers a vendor or service desk engineer running their own remote
        tool on this machine during the window in which the agent appeared.
      source: change_management
      field: ComputerName
      indicates: legitimate_administrative_action
    - id: fleetwide_rollout
      name: Same agent appearing across a deployment group
      description: >-
        The identical binary arrived on many hosts within one window, which is a managed
        rollout rather than a single introduced agent.
      source: baseline
      field: ComputerName
      indicates: software_deployment_wave

  risk_logic:
    required:
      - unsanctioned_remote_support_agent_written

    supporting:
      any:
        - agent_dropped_outside_an_installation_path
        - vendor_relay_resolved
        - agent_holding_an_outbound_session
        - relay_endpoint_new_to_the_estate
        - binary_unseen_elsewhere_in_the_estate
      all:
        - agent_dropped_outside_an_installation_path
        - agent_holding_an_outbound_session

    contradicting:
      any:
        - sanctioned_remote_support_product
        - recorded_support_session
        - fleetwide_rollout
      all: []

  verdict:
    low_risk_when:
      - unsanctioned_remote_support_agent_written
      - sanctioned_remote_support_product
      - recorded_support_session
      - fleetwide_rollout
    suspicious_when:
      - unsanctioned_remote_support_agent_written
      - binary_unseen_elsewhere_in_the_estate
    high_risk_when:
      - unsanctioned_remote_support_agent_written
      - agent_dropped_outside_an_installation_path
      - agent_holding_an_outbound_session
      - relay_endpoint_new_to_the_estate

  false_positive:
    - condition: The service desk deploys its standard remote support agent to a new machine.
      explanation: >-
        This produces the same file write and the same relay traffic. It is separated by the
        product being the sanctioned one, by the binary landing in a program directory through
        an installer, and by the same hash appearing across a deployment group rather than on
        one host.
    - condition: A managed service provider installs its monitoring agent on systems it administers.
      explanation: >-
        Provider agents are genuine remote monitoring tools and will match the name patterns.
        They are covered by contract, appear consistently across the systems in scope, and
        their relay endpoints are contacted by many hosts rather than one.
    - condition: A vendor engineer runs their own remote tool during a diagnostic call.
      explanation: >-
        A one-off portable agent from a temporary directory is exactly the shape this template
        escalates, which is why a support record is contradicting evidence. The session is
        short, is attended by the user, and the agent is normally removed afterwards.
    - condition: A user installs a consumer remote access product to reach their own machine.
      explanation: >-
        This is unsanctioned but not adversarial, and it looks identical on the endpoint. It
        is usually installed properly under the user's profile through the vendor's own
        installer, and the relay contact follows the user's own working pattern rather than
        appearing alongside other intrusion activity.
