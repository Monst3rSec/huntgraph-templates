type: detection

id: hg-win-one-password-tried-across-many-accounts-t1110-003

version: 1.0.0

info:
  name: One password tried across many accounts below the lockout threshold
  description: >-
    Spraying is the horizontal shape of brute force and it is built specifically to defeat
    the control most estates rely on. A lockout policy counts failures per account, so an
    operator who tries one plausible password against a thousand accounts never approaches
    the threshold on any of them, never generates a lockout, and never produces the alert
    that a per-account rule would raise. The volume can be large while the depth stays at
    one or two attempts, which means the finding lives in breadth per source and in the
    ratio of attempts to distinct accounts, not in a failure count. Throttled campaigns push
    this further, spacing a single attempt per account over twenty-four hours so that any
    aggregation window shorter than a day sees nothing at all. Two caveats matter when
    reading the result: spraying conducted over Kerberos or LDAP does not raise the same
    logon-failure telemetry as SMB, and a mix of unknown-name and wrong-password failures
    from one source is the signature of a harvested account list rather than of a person.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - brute-force
    - password-spraying
    - authentication
    - windows
  references:
    - https://attack.mitre.org/techniques/T1110/003
    - https://attack.mitre.org/detectionstrategies/DET0487
    - https://attack.mitre.org/techniques/T1110

mitre:
  tactics:
    - TA0006
  techniques:
    - T1110
  sub_techniques:
    - T1110.003
  detection_strategies:
    - DET0487
  analytics:
    - AN1336
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
  data_components:
    - User Account Authentication

hypothesis:
  statement: >-
    An adversary may try a single plausible password against a large number of accounts so
    that no account accumulates enough failures to lock, obtaining valid credentials from
    whichever user chose that password without ever tripping a per-account threshold.
  attacker_behavior:
    - Enumerates or acquires a list of account names and attempts one common password against each.
    - Keeps attempts per account at or below one or two so lockout counters never fill.
    - Spaces rounds over hours or days, using a fresh password each round.
    - Prefers authentication paths that raise less visible failure telemetry than SMB.
  legitimate_behavior:
    - A management appliance or gateway authenticates on behalf of many users with stale settings.
    - A directory or policy change causes failures across a large share of the user population.
    - An authorised vulnerability scan or credential audit exercises many accounts from one host.
    - A migration or federation cutover replays credentials for many users at once.
  risk_indicator:
    - One source touches a large number of distinct accounts with only one or two attempts each.
    - The activity is paced across a day or more rather than arriving as a burst.
    - The source attempts names that do not exist alongside names that do.
    - A single account from that same source eventually authenticates successfully.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: authentication
      event_types:
        - UserLogonFailed2
        - UserLogon
      fields:
        - aid
        - ComputerName
        - UserName
        - LogonType
        - RemoteAddressIP4
        - SubStatus
        - LogonServer
        - UserIsAdmin

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: one-source-many-accounts-shallow-depth
        name: A single source touching many accounts once or twice each
        purpose: >-
          Express the shape directly: breadth of distinct accounts from one source, with the
          per-account depth held low. The low depth is not incidental — it is the deliberate
          property that keeps the campaign under the lockout policy, so it belongs in the
          selection rather than in the commentary.
        query: |
          #event_simpleName=UserLogonFailed2
          | groupBy([RemoteAddressIP4],
                    function=[count(as=attempts),
                              count(UserName, distinct=true, as=distinct_accounts),
                              collect([UserName, ComputerName, LogonServer], limit=20)])
          | distinct_accounts >= 20
          | attempts_per_account := attempts / distinct_accounts
          | attempts_per_account <= 3
          | sort(distinct_accounts, order=desc)
        filters:
          include: []
          exclude:
            - "Source addresses of gateways and appliances that authenticate for many users by design"
        baseline:
          required: true
          window: 30d
          compare:
            - remote_address
            - user
            - organization

      - id: spray-paced-across-days
        name: Breadth accumulated slowly rather than in a burst
        purpose: >-
          Catch the throttled variant, which is invisible to any ten-minute correlation. The
          selection here is deliberately the opposite of a burst: wide account coverage
          spread over at least a day, with no account attempted more than about twice.
        query: |
          #event_simpleName=UserLogonFailed2
          | groupBy([RemoteAddressIP4, LogonServer],
                    function=[count(as=attempts),
                              count(UserName, distinct=true, as=distinct_accounts),
                              min(@timestamp, as=first_seen),
                              max(@timestamp, as=last_seen)])
          | span_hours := (last_seen - first_seen) / 3600000
          | distinct_accounts >= 15
          | attempts <= (distinct_accounts * 2)
          | span_hours >= 24
          | sort(distinct_accounts, order=desc)
        filters:
          include: []
          exclude: []
        baseline:
          required: true
          window: 90d
          compare:
            - remote_address
            - organization

      - id: names-that-do-not-exist-alongside-names-that-do
        name: A source attempting both real and non-existent account names
        purpose: >-
          Read the failure reasons to tell a replayed list from a person. A user or a
          misconfigured client only ever fails against accounts that exist; a sprayed list
          built from harvesting or from a naming convention contains names the directory has
          never held.
        query: |
          #event_simpleName=UserLogonFailed2
          | case {
              SubStatus=/0xC0000064/i | unknown_name := UserName ;
              SubStatus=/0xC000006A/i | wrong_password := UserName ;
              SubStatus=/0xC0000072/i | disabled_account := UserName ;
            }
          | groupBy([RemoteAddressIP4],
                    function=[count(unknown_name, distinct=true, as=names_absent_from_directory),
                              count(wrong_password, distinct=true, as=real_accounts_wrong_password),
                              count(disabled_account, distinct=true, as=disabled_accounts)])
          | names_absent_from_directory >= 5
          | real_accounts_wrong_password >= 5
          | sort(names_absent_from_directory, order=desc)
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: spray-lands-on-one-account
        name: Broad failure from a source with a single success
        purpose: >-
          Confirm the payoff. A spray is characterised by an extreme ratio — hundreds of
          accounts refused and one accepted — which is what separates it from credential
          reuse, where a large share of the attempts succeed.
        query: |
          #event_simpleName=/^(UserLogonFailed2|UserLogon)$/
          | case {
              #event_simpleName=UserLogonFailed2 | sprayed := UserName ;
              #event_simpleName=UserLogon        | landed := UserName ;
            }
          | groupBy([RemoteAddressIP4],
                    function=[count(sprayed, distinct=true, as=accounts_refused),
                              count(landed, distinct=true, as=accounts_entered),
                              collect([landed, ComputerName, LogonType, UserIsAdmin], limit=10)])
          | accounts_refused >= 20
          | accounts_entered >= 1
          | sort(accounts_refused, order=desc)
        filters:
          include: []
          exclude:
            - "Sources where the successful account is the appliance's own service identity"
        baseline:
          required: true
          window: 30d
          compare:
            - remote_address
            - user
            - host

evidence:
  required:
    - id: one_source_many_accounts
      name: A single source attempting a large set of distinct accounts
      description: >-
        One address produced authentication failures against a number of different accounts
        far beyond anything it has done before, which is the horizontal shape that no
        per-account failure counter will ever register.
      source: authentication
      field: RemoteAddressIP4
      indicates: horizontal_authentication_sweep

  supporting:
    - id: attempt_rate_below_lockout
      name: Attempts per account held below the lockout threshold
      description: >-
        The ratio of total attempts to distinct accounts stays at one or two, which is a
        deliberate property of the campaign rather than a coincidence and is the reason no
        lockout was ever raised.
      source: derived
      field: attempts_per_account
      indicates: lockout_threshold_evasion
    - id: paced_across_days
      name: Coverage accumulated over a day or more
      description: >-
        The breadth was built up slowly rather than in a burst, which defeats short
        correlation windows and points at throttling rather than at an automated client
        retrying as fast as it can.
      source: derived
      field: span_hours
      indicates: deliberate_throttling
    - id: nonexistent_names_attempted
      name: Attempts against names the directory does not hold
      description: >-
        The source presented account names that do not exist alongside names that do, which
        is what a harvested or generated list looks like and what a misconfigured client
        never produces.
      source: authentication
      field: SubStatus
      indicates: account_list_replay
    - id: spray_landed
      name: One account accepted amid mass refusal
      description: >-
        A single account authenticated successfully from the same source that was refused by
        many others, which is the intended outcome of a spray and its characteristic ratio.
      source: authentication
      field: UserName
      indicates: credential_guess_succeeded
    - id: unfamiliar_source
      name: Source with no authentication history in the estate
      description: >-
        The address has not authenticated against this organisation during the baseline
        window, so it is not an appliance or gateway that legitimately acts for many users.
      source: baseline
      field: RemoteAddressIP4
      indicates: unusual_source_for_organization

  contradicting:
    - id: service_appliance_source
      name: Gateway or appliance acting for many users
      description: >-
        The source is an inventoried mail gateway, VDI broker, monitoring platform or
        federation proxy whose role is to authenticate on behalf of a large user population,
        which reproduces the breadth exactly.
      source: asset_inventory
      field: RemoteAddressIP4
      indicates: legitimate_enterprise_activity
    - id: authorised_credential_audit
      name: Recorded scan or credential audit
      description: >-
        A change or engagement record covers an authorised scan or password-quality audit
        exercising many accounts from the observed source within this window.
      source: change_management
      field: RemoteAddressIP4
      indicates: authorised_security_testing
    - id: estate_wide_failure_wave
      name: Failures across the estate from many sources
      description: >-
        The same accounts are failing from many unrelated sources at the same time, which
        indicates a directory, policy or certificate change rather than one source working
        through a list.
      source: baseline
      field: UserName
      indicates: expected_operational_change

  risk_logic:
    required:
      - one_source_many_accounts

    supporting:
      any:
        - attempt_rate_below_lockout
        - paced_across_days
        - nonexistent_names_attempted
        - spray_landed
        - unfamiliar_source
      all:
        - attempt_rate_below_lockout
        - nonexistent_names_attempted
        - spray_landed

    contradicting:
      any:
        - service_appliance_source
        - authorised_credential_audit
        - estate_wide_failure_wave
      all: []

  verdict:
    low_risk_when:
      - one_source_many_accounts
      - service_appliance_source
      - authorised_credential_audit
      - estate_wide_failure_wave
    suspicious_when:
      - one_source_many_accounts
      - attempt_rate_below_lockout
    high_risk_when:
      - one_source_many_accounts
      - attempt_rate_below_lockout
      - nonexistent_names_attempted
      - spray_landed
      - unfamiliar_source

  false_positive:
    - condition: A mail gateway or VDI broker authenticates for the whole user population.
      explanation: >-
        These platforms produce precisely the required evidence — one source, hundreds of
        distinct accounts, one or two attempts each — whenever a setting drifts or a
        certificate expires. They are separable because the source is inventoried, the
        account set matches the platform's own user base rather than a naming pattern, and
        every attempted name exists in the directory.
    - condition: A directory or password-policy change causes widespread failures.
      explanation: >-
        A forced rotation, a trust change or a lockout-policy edit makes many accounts fail
        at once. The difference is the source distribution: the failures come from each
        user's own device rather than converging on a single address.
    - condition: An authorised vulnerability scan or password audit runs against the estate.
      explanation: >-
        Scans deliberately reproduce the technique from one host, including attempts against
        names that do not exist. Only the change record and the scanner's known address
        distinguish them, which is why both are modelled as contradicting evidence.
    - condition: An identity migration replays credentials for many users during cutover.
      explanation: >-
        Migration tooling authenticates as many accounts in a short period and fails for
        those not yet migrated. The activity is bounded by a scheduled window, the account
        set matches the migration batch, and it stops when the batch completes rather than
        continuing to widen.
