type: detection

id: hg-win-breached-credential-pairs-replayed-t1110-004

version: 1.0.0

info:
  name: Breached username and password pairs replayed against accounts
  description: >-
    Credential stuffing is the one member of this family that is not really guessing. The
    operator already holds username and password pairs that were valid somewhere else, and
    is testing whether a person reused one here. That changes the telemetry completely. There
    is no iteration, because there is nothing to iterate — each pair is presented once and
    abandoned if refused. There is no burst of failures to threshold on, because the whole
    campaign may be a few dozen attempts. What there is instead is an unusually high success
    rate: spraying lands on roughly one account in several hundred, while a stuffing list
    matched against a population that reuses passwords lands on several in a few dozen. So
    the finding is a success, not a failure — a first-ever successful logon for an account
    from a source it has never authenticated from, with no preceding failure activity to
    explain it. The benign twin is uncomfortable: a new VPN concentrator, egress NAT or
    remote-access gateway also produces many users succeeding from one previously unseen
    address, which is why the address must be checked against inventory before the pattern
    means anything.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - brute-force
    - credential-stuffing
    - authentication
    - windows
  references:
    - https://attack.mitre.org/techniques/T1110/004
    - https://attack.mitre.org/detectionstrategies/DET0460
    - https://attack.mitre.org/techniques/T1110

mitre:
  tactics:
    - TA0006
  techniques:
    - T1110
  sub_techniques:
    - T1110.004
  detection_strategies:
    - DET0460
  analytics:
    - AN1262
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
  data_components:
    - User Account Authentication

hypothesis:
  statement: >-
    An adversary holding username and password pairs from an unrelated breach may present
    each pair once against this environment so that any user who reused a password is
    entered directly, obtaining working access without generating the failure volume that
    guessing or spraying would.
  attacker_behavior:
    - Presents each username with its own distinct password taken from a breach corpus.
    - Tries each pair once and never returns to an account that refused it.
    - Works from a source with no prior relationship to the environment, often a proxy or hosting range.
    - Converts several unrelated accounts in the same short window rather than one.
  legitimate_behavior:
    - A new VPN concentrator or egress address begins carrying many users' sessions.
    - Staff travelling or working from a new office authenticate from an unfamiliar address.
    - A remote-access gateway or broker is migrated and its address changes.
    - A conditional-access or federation change alters where sessions appear to originate.
  risk_indicator:
    - An account authenticates successfully from a source it has never used before, with no failures leading up to it.
    - The proportion of successes to attempts from that source is far higher than any brute-force campaign would produce.
    - Several unrelated accounts succeed from the same source in a short window.
    - No account is ever attempted twice, so refused pairs are abandoned rather than retried.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: authentication
      event_types:
        - UserLogon
        - UserLogonFailed2
      fields:
        - aid
        - ComputerName
        - UserName
        - LogonType
        - RemoteAddressIP4
        - SubStatus
        - LogonServer
        - UserIsAdmin

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: first-success-from-an-unfamiliar-source
        name: An account's first successful logon from a new source
        purpose: >-
          Lead with the success rather than the failure, because a stuffed pair is expected
          to work and may leave no failed attempt at all. The finding is the account and
          source combination appearing for the first time, which is why the baseline
          comparison rather than the count carries the weight.
        query: |
          #event_simpleName=UserLogon
          | LogonType=/^(3|10)$/
          | groupBy([UserName, RemoteAddressIP4],
                    function=[count(as=logons),
                              min(@timestamp, as=first_seen),
                              collect([ComputerName, LogonServer, UserIsAdmin], limit=5)])
        filters:
          include: []
          exclude:
            - "Inventoried VPN, egress and remote-access addresses that carry many users' sessions"
        baseline:
          required: true
          window: 90d
          compare:
            - user
            - remote_address
            - organization

      - id: success-rate-too-high-for-guessing
        name: A source whose attempts succeed far more often than chance
        purpose: >-
          Measure the ratio rather than the volume. This is the single strongest separator in
          the family: a guessing or spraying source is refused almost every time, while a
          source holding pairs that were valid elsewhere converts a large fraction of what it
          presents.
        query: |
          #event_simpleName=/^(UserLogon|UserLogonFailed2)$/
          | case {
              #event_simpleName=UserLogon        | accepted := UserName ;
              #event_simpleName=UserLogonFailed2 | refused := UserName ;
            }
          | groupBy([RemoteAddressIP4],
                    function=[count(accepted, as=successes),
                              count(refused, as=failures),
                              count(accepted, distinct=true, as=accounts_entered),
                              collect([accepted, ComputerName, LogonType], limit=10)])
          | attempts := successes + failures
          | success_rate := successes / attempts
          | attempts >= 10
        filters:
          include: []
          exclude:
            - "Shared egress addresses where a high success rate is the normal condition"
        baseline:
          required: true
          window: 90d
          compare:
            - remote_address
            - organization

      - id: successes-across-unrelated-accounts
        name: One source entering several unrelated accounts
        purpose: >-
          Look at the breadth of successes, which no other member of this family produces. A
          guessing run enters one account and a spray enters about one; a stuffing list
          against a population that reuses passwords enters several at once, and those
          accounts share no team, host or role.
        query: |
          #event_simpleName=UserLogon
          | LogonType=/^(3|10)$/
          | groupBy([RemoteAddressIP4],
                    function=[count(UserName, distinct=true, as=accounts_entered),
                              count(ComputerName, distinct=true, as=hosts_reached),
                              collect([UserName, LogonServer, UserIsAdmin], limit=20)])
        filters:
          include: []
          exclude:
            - "Addresses belonging to jump hosts, brokers and management platforms"
        baseline:
          required: true
          window: 90d
          compare:
            - remote_address
            - user
            - organization

      - id: no-account-ever-retried
        name: Every account attempted exactly once and abandoned
        purpose: >-
          Capture the absence of iteration, which is what an operator does when they already
          believe the password. Guessing returns to the same account with a new secret and
          spraying returns in later rounds, so a source that touches many accounts and never
          revisits any of them is presenting pairs rather than searching for one.
        query: |
          #event_simpleName=UserLogonFailed2
          | groupBy([RemoteAddressIP4, UserName],
                    function=[count(as=attempts_for_account),
                              collect([ComputerName, SubStatus], limit=3)])
          | attempts_for_account <= 1
          | groupBy([RemoteAddressIP4],
                    function=[count(UserName, distinct=true, as=accounts_tried_once)])
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: success_from_source_without_history
      name: Successful logon from a source the account has never used
      description: >-
        An account authenticated successfully from an address it has no history with during
        the baseline window, and without a preceding run of failures that would explain the
        access as the end of a guessing attempt.
      source: authentication
      field: RemoteAddressIP4
      indicates: unfamiliar_source_successful_logon

  supporting:
    - id: elevated_success_rate
      name: Success rate far above any brute-force campaign
      description: >-
        The proportion of accepted to presented credentials from this source is orders of
        magnitude higher than guessing or spraying can achieve, which means the pairs were
        known to be valid before they were used.
      source: derived
      field: success_rate
      indicates: known_valid_credentials
    - id: successes_across_unrelated_accounts
      name: Several unrelated accounts entered from one source
      description: >-
        The same source authenticated successfully as multiple accounts that share no team,
        host or role, which is reuse across a harvested list rather than one compromised
        identity being used.
      source: authentication
      field: UserName
      indicates: broad_account_compromise
    - id: no_retry_per_account
      name: No account attempted more than once
      description: >-
        Every account touched by this source was attempted exactly once and never revisited,
        so refused pairs were abandoned rather than iterated, which is only rational when the
        operator believed each password to begin with.
      source: derived
      field: attempts_for_account
      indicates: precomputed_credential_pairs
    - id: remote_network_logon
      name: Access arriving as a network or remote interactive session
      description: >-
        The logon type shows the session came over the network or through remote interactive
        access rather than from the console, which is the only path a replayed pair can take.
      source: authentication
      field: LogonType
      indicates: remote_authentication_attempt
    - id: unfamiliar_source_for_organization
      name: Source unseen anywhere in the organisation
      description: >-
        The address has not appeared in authentication telemetry for any account during the
        baseline window, so it is not a newly routed but legitimate egress path.
      source: baseline
      field: RemoteAddressIP4
      indicates: unusual_source_for_organization

  contradicting:
    - id: corporate_egress_or_vpn
      name: Inventoried egress, VPN or gateway address
      description: >-
        The source is a recorded corporate egress point, VPN concentrator or remote-access
        gateway, which legitimately carries many users to successful logons from one address
        and reproduces both the breadth and the high success rate.
      source: asset_inventory
      field: RemoteAddressIP4
      indicates: legitimate_enterprise_activity
    - id: network_change_moved_egress
      name: Recorded change moved where sessions originate
      description: >-
        A change record covers a gateway migration, address reassignment or conditional-access
        edit in this window, which makes an established population appear from a new address
        all at once.
      source: change_management
      field: RemoteAddressIP4
      indicates: expected_operational_change
    - id: strong_authentication_satisfied
      name: Session satisfied a second authentication factor
      description: >-
        The successful session cleared a second factor or a compliant-device requirement,
        which a replayed password pair on its own cannot do.
      source: identity_context
      field: UserName
      indicates: additional_authentication_satisfied

  risk_logic:
    required:
      - success_from_source_without_history

    supporting:
      any:
        - elevated_success_rate
        - successes_across_unrelated_accounts
        - no_retry_per_account
        - remote_network_logon
        - unfamiliar_source_for_organization
      all:
        - elevated_success_rate
        - successes_across_unrelated_accounts
        - no_retry_per_account

    contradicting:
      any:
        - corporate_egress_or_vpn
        - network_change_moved_egress
        - strong_authentication_satisfied
      all: []

  verdict:
    low_risk_when:
      - success_from_source_without_history
      - corporate_egress_or_vpn
      - network_change_moved_egress
      - strong_authentication_satisfied
    suspicious_when:
      - success_from_source_without_history
      - unfamiliar_source_for_organization
    high_risk_when:
      - success_from_source_without_history
      - elevated_success_rate
      - successes_across_unrelated_accounts
      - no_retry_per_account
      - remote_network_logon

  false_positive:
    - condition: A new VPN concentrator or egress address starts carrying user sessions.
      explanation: >-
        This is the benign twin and it produces every part of the pattern: an unfamiliar
        address, many unrelated accounts, and a very high success rate because the users are
        genuine. The separators are inventory and shape of onset — a routing change moves the
        whole population at once and the address is recorded, whereas a stuffing source
        converts a handful of accounts out of a list and the rest are refused.
    - condition: Staff travel or work from a new location or home network.
      explanation: >-
        A single user authenticating from a new address satisfies the required evidence on
        its own. It does not satisfy the breadth or the ratio, because one person's sessions
        succeed every time and involve exactly one account, so the escalation tiers hold it at
        the lowest level.
    - condition: A conditional-access or federation change alters the apparent source of sessions.
      explanation: >-
        Proxying or a policy change can rewrite where logons appear to come from, making a
        long-standing population look new. The change record dates the switch, and the account
        set is the entire user base rather than a scattered subset.
    - condition: A shared jump host or broker authenticates as many administrators.
      explanation: >-
        Management infrastructure logs on as many privileged identities from one address with
        a near-perfect success rate. It is distinguished by being inventoried, by a stable
        account set that does not change from day to day, and by the absence of any refused
        attempts alongside the successes.
