type: detection

id: hg-win-repeated-password-guesses-against-one-account-t1110-001

version: 1.0.0

info:
  name: Many passwords tried against a single account
  description: >-
    Password guessing is the vertical shape of brute force: one account is chosen and the
    password is varied until something works. That makes the count of failures per account
    the measurement, not the count of failures overall — a hundred failures spread across a
    hundred accounts is a different technique, and a hundred failures against one account
    is this one. The difficulty is that the estate produces exactly this pattern by
    accident all day: a phone, a mapped drive, a scheduled task or a service that still
    holds a rotated password will hammer one account from one source indefinitely. The
    discriminator is variation. A stale client replays the same wrong secret at a metronomic
    rate for days and never stops on its own; a person or a tool working through a list
    varies the password, runs in bursts, and either stops when the list is exhausted or
    stops because it succeeded. The failure reason carries this: attempts that fail because
    the password is wrong on an account that genuinely exists mean the name is already
    known and only the secret is being iterated.
  severity: medium
  author: huntgraph
  tags:
    - credential-access
    - brute-force
    - password-guessing
    - authentication
    - windows
  references:
    - https://attack.mitre.org/techniques/T1110/001
    - https://attack.mitre.org/detectionstrategies/DET0551
    - https://attack.mitre.org/techniques/T1110

mitre:
  tactics:
    - TA0006
  techniques:
    - T1110
  sub_techniques:
    - T1110.001
  detection_strategies:
    - DET0551
  analytics:
    - AN1521
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
  data_components:
    - User Account Authentication

hypothesis:
  statement: >-
    An adversary with no valid credentials may work through a list of passwords against a
    single chosen account so that one of them authenticates, obtaining a working identity
    without needing any prior knowledge of the environment's secrets.
  attacker_behavior:
    - Picks one account, usually an administrator or service identity, and iterates passwords against it.
    - Drives the attempts through a management service such as SMB, RDP or WinRM.
    - Works in bursts, pausing when a lockout threshold is approached and resuming afterwards.
    - Stops abruptly on the account once an attempt succeeds.
  legitimate_behavior:
    - A phone, mail client or mapped drive retries a password the user has since changed.
    - A scheduled task or service runs under an account whose password was rotated without updating it.
    - Users mistype passwords, particularly after a forced change or on an unfamiliar keyboard.
    - Backup and monitoring agents retry with cached credentials after a directory change.
  risk_indicator:
    - Failures concentrate on one account while the rest of the estate is quiet.
    - A single source is responsible and it targets no other account.
    - The failures are wrong-password failures on an account that exists, not unknown-name failures.
    - A successful logon for that account follows the run of failures from the same source.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: authentication
      event_types:
        - UserLogonFailed2
        - UserLogon
      fields:
        - aid
        - ComputerName
        - UserName
        - LogonType
        - RemoteAddressIP4
        - SubStatus
        - LogonServer
        - UserIsAdmin

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: failures-concentrated-on-one-account
        name: Authentication failures piled onto a single account
        purpose: >-
          Measure the depth of failure per account rather than the volume of failure
          overall, which is the only measurement that separates guessing from a sweep
          across the user population.
        query: |
          #event_simpleName=UserLogonFailed2
          | groupBy([UserName],
                    function=[count(as=failures),
                              count(RemoteAddressIP4, distinct=true, as=distinct_sources),
                              collect([ComputerName, LogonType, LogonServer], limit=5)])
          | failures >= 15
        filters:
          include: []
          exclude:
            - "Accounts known to be held by an appliance or client with a stale cached password"
        baseline:
          required: true
          window: 30d
          compare:
            - user
            - remote_address
            - organization

      - id: source-fixated-on-a-single-account
        name: One source attempting one account and nothing else
        purpose: >-
          Invert the aggregation onto the source so that fixation becomes visible. A
          guessing source touches one name repeatedly; a spraying source touches many names
          once, and the two are indistinguishable until the counts are read this way round.
        query: |
          #event_simpleName=UserLogonFailed2
          | groupBy([RemoteAddressIP4],
                    function=[count(as=attempts),
                              count(UserName, distinct=true, as=distinct_accounts),
                              collect([UserName, ComputerName, LogonType], limit=5)])
          | distinct_accounts <= 2
        filters:
          include: []
          exclude:
            - "Source addresses of appliances that authenticate on behalf of one service identity"
        baseline:
          required: true
          window: 30d
          compare:
            - remote_address
            - user
            - organization

      - id: wrong-password-rather-than-wrong-name
        name: Failures caused by the password, not the account name
        purpose: >-
          Separate iteration over passwords from iteration over names. A failure on an
          account that exists means the name is already settled and only the secret is being
          varied, which is the defining motion of guessing.
        query: |
          #event_simpleName=UserLogonFailed2
          | case {
              SubStatus=/0xC000006A/i | wrong_password := UserName ;
              SubStatus=/0xC0000064/i | unknown_account := UserName ;
              SubStatus=/0xC0000234/i | locked_out := UserName ;
            }
          | groupBy([UserName, RemoteAddressIP4],
                    function=[count(wrong_password, as=password_failures),
                              count(unknown_account, as=name_failures),
                              count(locked_out, as=lockout_failures)])
          | password_failures >= 10
          | name_failures <= 1
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: guessing-run-ends-in-success
        name: A run of failures on an account followed by a logon
        purpose: >-
          Confirm the guessing worked, which is the only case here that turns a noisy
          nuisance into an access event. The pairing must be on the same account and the
          same source, otherwise an unrelated logon closes the gap by coincidence.
        query: |
          #event_simpleName=/^(UserLogonFailed2|UserLogon)$/
          | case {
              #event_simpleName=UserLogonFailed2 | failed_attempt := UserName ;
              #event_simpleName=UserLogon        | succeeded := UserName ;
            }
          | groupBy([UserName, RemoteAddressIP4],
                    function=[count(failed_attempt, as=failures),
                              count(succeeded, as=successes),
                              collect([ComputerName, LogonType, UserIsAdmin], limit=5)])
          | failures >= 10
        filters:
          include: []
          exclude:
            - "Accounts whose password was reset during the window, where failures precede a legitimate first use"
        baseline:
          required: true
          window: 30d
          compare:
            - user
            - remote_address
            - host

evidence:
  required:
    - id: failures_concentrated_on_one_account
      name: Repeated authentication failures against a single account
      description: >-
        One account accumulated a run of failed authentications well beyond its own normal
        rate while the surrounding population stayed quiet, which is the vertical shape that
        distinguishes guessing from any broader sweep.
      source: authentication
      field: UserName
      indicates: repeated_authentication_failure

  supporting:
    - id: fixated_source
      name: Source attempting only that account
      description: >-
        The address responsible for the failures attempted no other account in the window,
        so the operator had already chosen a target rather than working across a list.
      source: authentication
      field: RemoteAddressIP4
      indicates: single_account_targeting
    - id: wrong_password_not_wrong_name
      name: Failures are wrong-password on an existing account
      description: >-
        The failure reason shows the account name resolved and the supplied secret was
        rejected, meaning the password is what is being varied rather than the username.
      source: authentication
      field: SubStatus
      indicates: password_iteration
    - id: remote_logon_channel
      name: Attempts arriving over a remote service
      description: >-
        The logon type shows network or remote interactive access rather than a console
        session, which is how guessing reaches an account it has no local presence for.
      source: authentication
      field: LogonType
      indicates: remote_authentication_attempt
    - id: success_after_failure_run
      name: Successful logon closing the failure run
      description: >-
        The same account authenticated successfully from the same source after the run of
        failures, which is the point at which the guessing stopped because it worked.
      source: authentication
      field: UserIsAdmin
      indicates: credential_guess_succeeded
    - id: unusual_for_account
      name: No history of failure for this account
      description: >-
        The account has no comparable failure rate during the baseline window, so the run is
        a change in its behaviour and not a long-standing misconfiguration.
      source: baseline
      field: UserName
      indicates: unusual_activity_for_user

  contradicting:
    - id: cached_credential_client
      name: Client holding a stale cached password
      description: >-
        The source is a known device or agent that stores the account's password and retries
        it after a rotation, producing an identical concentration of failures on one account
        indefinitely.
      source: asset_inventory
      field: RemoteAddressIP4
      indicates: stale_cached_credential
    - id: service_account_after_rotation
      name: Service identity rotated without updating dependents
      description: >-
        A recorded password rotation for this account left services or tasks still presenting
        the previous secret, which produces the failure run as a direct consequence.
      source: change_management
      field: UserName
      indicates: expected_operational_change
    - id: authorised_assessment
      name: Recorded credential-strength assessment
      description: >-
        An engagement record covers authorised guessing against this account from the
        observed source, naming the operator and the window.
      source: change_management
      field: RemoteAddressIP4
      indicates: authorised_security_testing

  risk_logic:
    required:
      - failures_concentrated_on_one_account

    supporting:
      any:
        - fixated_source
        - wrong_password_not_wrong_name
        - remote_logon_channel
        - success_after_failure_run
        - unusual_for_account
      all:
        - fixated_source
        - wrong_password_not_wrong_name
        - success_after_failure_run

    contradicting:
      any:
        - cached_credential_client
        - service_account_after_rotation
        - authorised_assessment
      all: []

  verdict:
    low_risk_when:
      - failures_concentrated_on_one_account
      - cached_credential_client
      - service_account_after_rotation
      - authorised_assessment
    suspicious_when:
      - failures_concentrated_on_one_account
      - fixated_source
    high_risk_when:
      - failures_concentrated_on_one_account
      - fixated_source
      - wrong_password_not_wrong_name
      - success_after_failure_run
      - unusual_for_account

  false_positive:
    - condition: A phone or mail client keeps presenting a password the user has changed.
      explanation: >-
        This is the closest benign twin and it reproduces the required evidence exactly: one
        account, one source, hundreds of wrong-password failures. It is separable by rhythm
        rather than by volume — the interval between attempts is constant, the same secret is
        replayed rather than varied, it continues for days without a success, and the source
        resolves to a device already registered to that user.
    - condition: A scheduled task or service runs under an account whose password was rotated.
      explanation: >-
        The failures start at the moment of rotation and come from a host that has legitimately
        run that identity for a long time. The change record for the rotation dates the onset,
        and no attempt ever succeeds until someone updates the stored secret.
    - condition: A user mistypes a password repeatedly after a forced change.
      explanation: >-
        Human retries are small in number, arrive from the user's own workstation at the
        console, and end in a success within a handful of attempts. Guessing runs are an order
        of magnitude longer and arrive over a network logon type.
    - condition: A credential-strength assessment guesses against a nominated account.
      explanation: >-
        Authorised assessments reproduce the behaviour deliberately, including the wrong-password
        failure reason and the eventual success. Only the engagement record and the known
        operator source separate them from an intrusion.
