type: detection

id: hg-win-password-hashes-captured-and-cracked-offline-t1110-002

version: 1.0.0

info:
  name: Password hashes captured for offline cracking
  description: >-
    Password cracking is the member of this family with no authentication telemetry at all.
    The guessing happens against a file on a machine the defender does not own, at a rate no
    directory would ever see, and the account under attack never registers a single failed
    logon. Waiting for authentication events here produces nothing, which is why the hunt has
    to move to either end of the process: the capture of the credential material before it
    leaves, and the tooling that consumes it if the cracking is done on-network. The capture
    is the stronger observable because it is narrow. There are only a handful of ways to
    obtain the local account database or the directory store on a live Windows system —
    saving the registry hives, extracting an install-from-media snapshot of the directory,
    or reading the store out of a volume shadow copy because the live file is locked — and
    each of those leaves a distinctive command line. The awkward part is that the same three
    mechanisms are what backup software and domain-controller promotion use legitimately, so
    the discriminator is who invoked them, whether the output was then archived for removal,
    and whether cracking tooling appeared anywhere near it.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - brute-force
    - password-cracking
    - credential-material
    - windows
  references:
    - https://attack.mitre.org/techniques/T1110/002
    - https://attack.mitre.org/detectionstrategies/DET0105
    - https://attack.mitre.org/techniques/T1110

mitre:
  tactics:
    - TA0006
  techniques:
    - T1110
  sub_techniques:
    - T1110.002
  detection_strategies:
    - DET0105
  analytics:
    - AN0292
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Creation

hypothesis:
  statement: >-
    An adversary holding hashed credential material may recover the plaintext passwords by
    guessing against the hashes offline, so that the attack produces no authentication
    telemetry in the target environment and the resulting credentials can be used as if they
    had been given legitimately.
  attacker_behavior:
    - Saves the registry hives holding local account secrets to a file on disk.
    - Extracts the directory store, using a shadow copy or an install-from-media snapshot because the live file is locked.
    - Archives the captured material so it can be taken off the network for cracking.
    - Runs cracking tooling with a wordlist or rule set against the captured hashes.
  legitimate_behavior:
    - Backup software reads the directory store and system hives as part of a scheduled job.
    - Domain-controller promotion and demotion create install-from-media snapshots.
    - Administrators export registry hives during troubleshooting or migration.
    - Security teams run password-quality audits against a directory extract under an agreed scope.
  risk_indicator:
    - The hive or directory export is written to a user-writable or staging path rather than a backup target.
    - A shadow copy is created and the directory store read from it within the same short window.
    - The captured material is archived or compressed shortly after it is produced.
    - Cracking tooling or a wordlist appears on the same host or on one the operator also touched.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        - aid
        - ComputerName
        - UserName
        - FileName
        - ImageFileName
        - CommandLine
        - ParentBaseFileName
    - source: file_creation
      event_types:
        - PeFileWritten
        - NewExecutableWritten
      fields:
        - aid
        - ComputerName
        - TargetFileName
        - ContextProcessId
        - SHA256HashData

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: credential-store-copied-from-a-live-system
        name: Account database or directory store extracted
        purpose: >-
          Catch the capture, which is the step that must happen on a machine the defender
          owns. Cracking itself is invisible, so the material leaving the credential store is
          the earliest and most reliable point at which this technique is observable.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(reg(\.exe)?\s+save\s+.*\\(sam|system|security)\b|ntdsutil.*\bifm\b|create\s+full\s+|esentutl.*\/y.*ntds\.dit|copy\s+.*ntds\.dit|\bsecretsdump\b|\bntdsdump\b)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=captures), collect([CommandLine], limit=5)])
          | sort(captures, order=asc)
        filters:
          include: []
          exclude:
            - "Backup and directory-maintenance service accounts running on their scheduled hosts"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line
            - organization

      - id: shadow-copy-used-to-reach-a-locked-store
        name: Volume shadow copy created and the directory store read from it
        purpose: >-
          Isolate the mechanism used to defeat the file lock on a running domain controller.
          A shadow copy on its own is routine, but one created and then read for the
          directory store or the system hives within the same window is not.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | case {
              CommandLine=/(vssadmin(\.exe)?\s+create\s+shadow|Win32_ShadowCopy.*Create|diskshadow.*\bcreate\b)/i
                | shadow_created := CommandLine ;
              CommandLine=/(HarddiskVolumeShadowCopy|\\GLOBALROOT\\Device\\)/i
                | shadow_read := CommandLine ;
            }
          | groupBy([ComputerName, UserName],
                    function=[collect([shadow_created, shadow_read, FileName, ParentBaseFileName], limit=10),
                              count(as=events)])
          | shadow_created=/.+/
          | shadow_read=/.+/
        filters:
          include: []
          exclude:
            - "Backup agents whose normal operation is to snapshot and read volumes"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - organization

      - id: cracking-tooling-executed-or-staged
        name: Hash-cracking tooling run with a wordlist or rule set
        purpose: >-
          Cover the case where the cracking is done on-network rather than off it, which is
          the only circumstance in which the guessing itself is visible. The argument shape
          matters as much as the binary name, since these tools are routinely renamed.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(hashcat|\bjohn(\.exe)?\b|ophcrack|rcrack|rainbowcrack|l0phtcrack|\bcain\b|DSInternals|Test-PasswordQuality)/i
          | CommandLine=/(-m\s*\d{3,5}\b|-a\s*[0-3]\b|--wordlist|--rules|--potfile|--show|rockyou|\.potfile|--format\s*=\s*(nt|netntlm|krb5))/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=runs), collect([CommandLine], limit=5)])
        filters:
          include: []
          exclude:
            - "Hosts belonging to the security team where password-quality auditing is in scope"
        baseline:
          required: false
          window: null
          compare: []

      - id: cracking-binary-written-to-disk
        name: Cracking executable planted on a host
        purpose: >-
          Find the tooling before it runs, and find renamed copies whose command line gives
          nothing away. A GPU cracking binary appearing on a server or workstation has no
          ordinary reason to be there.
        query: |
          #event_simpleName=/^(PeFileWritten|NewExecutableWritten)$/
          | TargetFileName=/(hashcat|john|ophcrack|rcrack|rainbowcrack|l0phtcrack|mimikatz|secretsdump)/i
          | groupBy([ComputerName, TargetFileName, SHA256HashData],
                    function=[count(as=writes), collect([ContextProcessId], limit=5)])
          | sort(writes, order=asc)
        filters:
          include: []
          exclude:
            - "Approved security-tooling distribution paths on analyst workstations"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - path
            - organization

      - id: captured-material-archived-for-removal
        name: Credential material compressed for transfer
        purpose: >-
          Confirm the material was prepared to leave, which is what has to happen when the
          cracking is done elsewhere. This is the step that turns a hive export into an
          exfiltration of credential material rather than a troubleshooting artefact.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(7z|winrar|rar(\.exe)?|tar(\.exe)?|makecab|Compress-Archive)/i
          | CommandLine=/(ntds\.dit|\bsam\b|\bsystem\.hiv|\bsecurity\.hiv|\.hive|\bsam\.save|\bsystem\.save)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=archives), collect([CommandLine], limit=5)])
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

evidence:
  required:
    - id: hash_material_captured
      name: Credential store extracted from a live system
      description: >-
        The local account database or the directory store was read out of a running system
        through hive export, an install-from-media snapshot or a shadow copy, which is the
        only step of offline cracking that occurs inside the environment.
      source: process_creation
      field: CommandLine
      indicates: credential_material_capture

  supporting:
    - id: shadow_copy_used_for_locked_file
      name: Shadow copy created to reach a locked store
      description: >-
        A volume snapshot was created and then read for the directory store or system hives
        in the same window, which is the standard way to defeat the lock on a running domain
        controller.
      source: process_creation
      field: FileName
      indicates: locked_file_bypass
    - id: cracking_tool_executed
      name: Hash-cracking tooling invoked
      description: >-
        A cracking tool was run with a mode, wordlist or rule argument, meaning the guessing
        was performed on-network and is visible rather than happening on infrastructure the
        defender cannot see.
      source: process_creation
      field: CommandLine
      indicates: offline_cracking_tooling
    - id: cracking_binary_written
      name: Cracking executable planted on a host
      description: >-
        A cracking or credential-extraction binary was written to disk, which places the
        tooling in the environment even if it was renamed or never run under its own name.
      source: file_creation
      field: TargetFileName
      indicates: tooling_staged_on_disk
    - id: material_archived_for_removal
      name: Captured material compressed for transfer
      description: >-
        The extracted hives or directory store were archived shortly after capture, which is
        the preparation step for cracking somewhere the defender has no visibility.
      source: process_creation
      field: ParentBaseFileName
      indicates: staged_for_exfiltration
    - id: unusual_for_host
      name: No history of credential-store access on this host
      description: >-
        This host has not produced hive or directory exports during the baseline window, so
        the activity is a deviation rather than a recurring maintenance job.
      source: baseline
      field: ComputerName
      indicates: unusual_activity_for_host

  contradicting:
    - id: authorised_password_audit
      name: Recorded password-quality audit
      description: >-
        An agreed audit extracts the directory store and runs cracking tooling against it on
        purpose, reproducing both the capture and the tooling exactly; the engagement record
        names the operator, the hosts and the window.
      source: change_management
      field: UserName
      indicates: authorised_security_testing
    - id: backup_or_promotion_activity
      name: Backup job or controller promotion
      description: >-
        The extraction was performed by a backup agent on its schedule, or by a
        domain-controller promotion or demotion that legitimately produces an
        install-from-media snapshot.
      source: change_management
      field: ComputerName
      indicates: legitimate_backup_operation
    - id: security_tool_component
      name: Component of an installed security product
      description: >-
        The binary matched by name belongs to an inventoried security or auditing product
        deployed to this host as part of the standard build.
      source: asset_inventory
      field: FileName
      indicates: legitimate_application_component

  risk_logic:
    required:
      - hash_material_captured

    supporting:
      any:
        - shadow_copy_used_for_locked_file
        - cracking_tool_executed
        - cracking_binary_written
        - material_archived_for_removal
        - unusual_for_host
      all:
        - cracking_tool_executed
        - material_archived_for_removal

    contradicting:
      any:
        - authorised_password_audit
        - backup_or_promotion_activity
        - security_tool_component
      all: []

  verdict:
    low_risk_when:
      - hash_material_captured
      - authorised_password_audit
      - backup_or_promotion_activity
      - security_tool_component
    suspicious_when:
      - hash_material_captured
      - unusual_for_host
    high_risk_when:
      - hash_material_captured
      - shadow_copy_used_for_locked_file
      - cracking_tool_executed
      - cracking_binary_written
      - material_archived_for_removal

  false_positive:
    - condition: A backup agent reads the directory store and system hives on schedule.
      explanation: >-
        Backup is the legitimate twin of the capture step and uses the same shadow-copy
        mechanism. It runs under the backup service account, on the agent's own schedule, from
        the same hosts every cycle, and the output goes to a backup target rather than to a
        user-writable path or an archive.
    - condition: Domain-controller promotion creates an install-from-media snapshot.
      explanation: >-
        Promotion and demotion legitimately export the directory store with the same utility
        an adversary would use. The activity sits inside a change window, is performed by a
        directory administrator, and is followed by the new controller appearing rather than
        by the snapshot being compressed.
    - condition: A security team runs a password-quality audit against a directory extract.
      explanation: >-
        Audits reproduce this technique end to end, including the cracking tooling and the
        wordlist arguments. Nothing in the telemetry separates them from an intrusion, which
        is why the engagement record is modelled as contradicting evidence rather than as a
        query exclusion.
    - condition: An administrator exports registry hives while troubleshooting or migrating.
      explanation: >-
        Hive exports are a normal support action, but troubleshooting rarely targets the SAM
        and SECURITY hives specifically, and the export is not archived and removed
        afterwards. The escalation depends on the archive and tooling evidence, not on the
        export alone.
