type: detection

id: hg-win-sysvol-policy-files-read-for-embedded-passwords-t1552-006

version: 1.0.0

info:
  name: SYSVOL policy files read for embedded passwords
  description: >-
    Group Policy Preferences let an administrator set a local account password once and push
    it to the estate. The password is stored in an XML file on SYSVOL as a cpassword
    attribute, encrypted with an AES key Microsoft published, which makes it plaintext in
    practice. SYSVOL is readable by every domain user, so this is a credential source that
    needs no privilege at all: an ordinary account can list the share, find Groups.xml and
    recover a local administrator password that is very often identical across thousands of
    machines. Nothing is written and nothing is executed on the domain controller, so there
    is no modification to catch — the observable is the read. The difficulty is that SYSVOL
    is read constantly and legitimately: every domain-joined machine pulls policy from it,
    and backup, replication-health and GPO-reporting tools walk the whole tree. The
    discriminator is not the share access but the reader: a machine account processing policy
    or a backup agent sweeping a tree looks nothing like an interactive account running a
    recursive XML search or invoking a decryption routine against a cpassword value.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - unsecured-credentials
    - group-policy
    - sysvol
    - windows
  references:
    - https://attack.mitre.org/techniques/T1552/006
    - https://attack.mitre.org/detectionstrategies/DET0381
    - https://attack.mitre.org/techniques/T1552

mitre:
  tactics:
    - TA0006
  techniques:
    - T1552
  sub_techniques:
    - T1552.006
  detection_strategies:
    - DET0381
  analytics:
    - AN1075
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Network Share Access
    - Process Creation

hypothesis:
  statement: >-
    An adversary holding any domain account may enumerate the policy XML files on SYSVOL and
    decrypt the cpassword attribute inside them, obtaining a local administrator password
    that is valid across every machine the policy applied to, without needing elevation on
    any host.
  attacker_behavior:
    - Lists the policy tree on SYSVOL recursively looking for XML files.
    - Reads Groups.xml or the other preference files that carry a cpassword attribute.
    - Decrypts the cpassword value using the published AES key.
    - Runs a packaged tool that performs the search and decryption in one step.
  legitimate_behavior:
    - Every domain-joined machine reads SYSVOL when it processes policy.
    - Backup and replication-health tooling walks the whole SYSVOL tree on a schedule.
    - GPO reporting and documentation tools parse policy XML across all objects.
    - Administrators open policy files directly while diagnosing a preference that will not apply.
  risk_indicator:
    - The SYSVOL tree is searched recursively for XML rather than a named policy being fetched.
    - The command line names cpassword or a preference file that carries one.
    - A decryption routine or a known GPP password tool is invoked.
    - The reader is an interactive user account rather than a machine account or backup agent.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - sysmon_event1
        - windows_security
      fields:
        agent_id: agent.id
        host: win.system.computer
        user: win.eventdata.user
        image_name: win.eventdata.image
        image_path: win.eventdata.image
        command_line: win.eventdata.commandLine
        parent_process: win.eventdata.parentImage
    - source: network_share_access
      connector: crowdstrike-ngsiem
      event_types:
        - SmbClientConnect
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        share_name: ShareName
        remote_address: RemoteAddressIP4
    - source: network_share_access
      connector: wazuh
      event_types:
        - windows_security
      fields:
        agent_id: agent.id
        host: win.system.computer
        user: win.eventdata.subjectUserName
        share_name: win.eventdata.shareName
        remote_address: win.eventdata.ipAddress

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: sysvol-searched-for-policy-xml
        name: SYSVOL tree searched recursively for XML files
        purpose: >-
          Surface the enumeration step. Policy processing fetches the specific files a
          machine needs by path; a recursive search for every XML file under the domain
          share is a hunt for the ones that carry a password.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(\\\\[^\\]+\\SYSVOL|\\SYSVOL\\|sysvol\\+[^\\ ]+\\+Policies)/i
          | CommandLine=/(\bdir\b.{0,20}\/s|Get-ChildItem|\bgci\b|-Recurse|\bfindstr\b\s+\/s|\bfind(str)?\b.{0,30}\.xml)/i
          | CommandLine=/\.xml/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=searches), collect([CommandLine, aid], limit=50)])
          | sort(searches, order=asc)
        filters:
          include: []
          exclude:
            - "Backup, SYSVOL replication-health and GPO documentation tooling"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - organization

      - id: preference-file-or-cpassword-referenced
        name: Preference file or cpassword attribute named directly
        purpose: >-
          Catch the targeted read. The preference files that carry a cpassword are a short,
          fixed list, and naming the attribute itself has no configuration purpose at all.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(cpassword|Groups\.xml|Services\.xml|ScheduledTasks\.xml|DataSources\.xml|Printers\.xml|Drives\.xml)/i
          | groupBy([ComputerName, UserName, FileName, ImageFileName, ParentBaseFileName],
                    function=[count(as=reads), collect([CommandLine], limit=50)])
          | sort(reads, order=asc)
        filters:
          include: []
          exclude:
            - "Group Policy management consoles and preference-editing tools run by directory administrators"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: gpp-password-tool-or-decryption
        name: GPP password tool or AES decryption of a policy value
        purpose: >-
          Identify the decryption step, which is what turns a readable file into a usable
          credential. Nothing in policy administration needs to decrypt cpassword, because
          the management console writes it rather than reading it back.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Get-GPPPassword|Find-GPOPassword|Get-CachedGPPPassword|gpprefdecrypt|gpp_decrypt|windows\/gather\/credentials\/gpp|Get-DecryptedCpassword)/i
          | groupBy([ComputerName, UserName, FileName, ImageFileName, ParentBaseFileName],
                    function=[count(as=runs), collect([CommandLine], limit=50)])
          | sort(runs, order=asc)
        filters:
          include: []
          exclude:
            - "Authorised red-team and directory security-assessment hosts"
        baseline:
          required: false
          window: null
          compare: []

      - id: sysvol-reached-by-interactive-account
        name: SYSVOL reached by an interactive account from an unusual host
        purpose: >-
          Provide the share-access half of the correlation while removing the bulk of the
          noise. Policy processing connects to SYSVOL under the machine account, so
          restricting to non-machine accounts and sorting by rarity leaves the hosts and
          users that have no routine reason to be there.
        query: |
          #event_simpleName=/^SmbClientConnect$/
          | ShareName=/^SYSVOL$/i
          | UserName!=/\$$/
          | groupBy([ComputerName, UserName, ShareName, RemoteAddressIP4],
                    function=[count(as=connects)])
          | sort(connects, order=asc)
        filters:
          include: []
          exclude:
            - "Directory administration jump hosts and the accounts that manage policy from them"
            - "Backup and replication-health service accounts with standing SYSVOL access"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - organization

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 101408
      group: huntgraph,windows,credential-access,unsecured-credentials
      lists: []

    cases:
      - id: gpp-password-tool-or-decryption
        covers: gpp-password-tool-or-decryption
        name: GPP password tool or AES decryption of a policy value
        purpose: >-
          Identify the decryption step, which is what turns a readable file into a
          usable credential. Nothing in policy administration needs to decrypt
          cpassword, because the management console writes it rather than reading it
          back.
        rule: |
          <rule id="101408" level="12">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Get-GPPPassword|Find-GPOPassword|Get-CachedGPPPassword|gpprefdecrypt|gpp_decrypt|windows\/gather\/credentials\/gpp|Get-DecryptedCpassword)</field>
            <description>GPP password tool or AES decryption of a policy value</description>
            <mitre><id>T1552.006</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: sysvol-searched-for-policy-xml
        reason: >-
          Depends on a 90d baseline comparison (host, user, organization); a stateless
          rule holds no history.
      - case: preference-file-or-cpassword-referenced
        reason: >-
          Depends on a 90d baseline comparison (host, user, command_line); a stateless
          rule holds no history.
      - case: sysvol-reached-by-interactive-account
        reason: >-
          Depends on a 90d baseline comparison (host, user, organization); a stateless
          rule holds no history.

evidence:
  required:
    - id: gpp_credential_file_read
      name: Policy preference file or cpassword read from SYSVOL
      description: >-
        A process searched the SYSVOL policy tree for XML, or addressed a preference file or
        the cpassword attribute directly, which is a read for embedded credentials rather
        than policy processing.
      source: process_creation
      field: command_line
      indicates: stored_credential_discovery

  supporting:
    - id: decryption_tooling
      name: GPP password tool or decryption routine invoked
      description: >-
        A tool or routine that recovers the plaintext behind a cpassword value ran on the
        host, which converts a readable file into a usable credential.
      source: process_creation
      field: image_name
      indicates: credential_decryption_attempt
    - id: sysvol_share_access
      name: SYSVOL reached by a non-machine account
      description: >-
        The host connected to the domain SYSVOL share under a user account rather than the
        machine account that normal policy processing uses.
      source: network_share_access
      field: share_name
      indicates: share_enumeration
    - id: interactive_reader
      name: Read from a shell or script host
      description: >-
        The reading process was started by a command shell, script host or remote-execution
        service, not by the policy client, a backup agent or a management console.
      source: process_creation
      field: parent_process
      indicates: hands_on_keyboard_activity
    - id: first_seen_for_user
      name: No history of SYSVOL access for this account
      description: >-
        The account has no baseline history of reaching SYSVOL outside policy processing, so
        the access is a deviation and not part of an administrative routine.
      source: baseline
      field: UserName
      indicates: unusual_activity_for_host

  contradicting:
    - id: backup_or_replication_agent
      name: Backup or replication-health tooling
      description: >-
        The reader is an approved backup, SYSVOL replication-health or GPO documentation
        product whose function is to walk the whole policy tree.
      source: process_creation
      field: image_path
      indicates: legitimate_enterprise_activity
    - id: machine_account_policy_processing
      name: Machine account processing policy
      description: >-
        The SYSVOL connection was made under a computer account as part of ordinary Group
        Policy refresh, which every domain-joined host performs continually.
      source: network_share_access
      field: user
      indicates: routine_policy_processing
    - id: fleetwide_sysvol_read
      name: Same read across the estate
      description: >-
        The identical access appears across a large share of hosts in one window, which is a
        scheduled sweep or a policy refresh cycle rather than a targeted search.
      source: baseline
      field: ComputerName
      indicates: software_deployment_wave

  risk_logic:
    required:
      - gpp_credential_file_read

    supporting:
      any:
        - decryption_tooling
        - sysvol_share_access
        - interactive_reader
        - first_seen_for_user
      all:
        - decryption_tooling
        - interactive_reader

    contradicting:
      any:
        - backup_or_replication_agent
        - machine_account_policy_processing
        - fleetwide_sysvol_read
      all: []

  verdict:
    low_risk_when:
      - gpp_credential_file_read
      - backup_or_replication_agent
      - machine_account_policy_processing
      - fleetwide_sysvol_read
    suspicious_when:
      - gpp_credential_file_read
      - first_seen_for_user
    high_risk_when:
      - gpp_credential_file_read
      - decryption_tooling
      - sysvol_share_access
      - interactive_reader

  false_positive:
    - condition: A backup product walks the whole SYSVOL tree.
      explanation: >-
        Backing up policy means reading every XML file under the share, which reproduces the
        enumeration evidence exactly. The acting process is the backup client, it runs under
        a service account on a fixed schedule, and it never decrypts anything it reads.
    - condition: A GPO reporting or documentation tool parses preference files.
      explanation: >-
        Reporting products read Groups.xml and its siblings to describe what policy does,
        which produces the same file references. They run from a management server against
        every policy object rather than against the handful that carry a password.
    - condition: A domain-joined machine refreshes Group Policy.
      explanation: >-
        Policy refresh connects to SYSVOL constantly, which is why the share access alone
        carries no weight here. Refresh runs under the machine account and fetches named
        paths rather than searching the tree.
    - condition: An administrator opens a preference file to diagnose a policy that will not apply.
      explanation: >-
        Reading the XML by hand is a normal troubleshooting step for a preference that is
        not landing. It is a single named file opened by a directory administrator from a
        management host, with no recursive search and no decryption routine alongside it.
