type: detection

id: hg-lin-shell-history-read-for-credentials-t1552-003

version: 1.0.0

info:
  name: Shell history read for credentials left on the command line
  description: >-
    Anything typed as an argument ends up in the shell history file, and people type
    secrets as arguments constantly — database passwords after -p, tokens in curl headers,
    passphrases passed to openssl, connection strings pasted into a client. The history
    file sits in the user's home directory with ordinary permissions, so an adversary who
    lands as any user, or who escalates to another user, gets a written record of what that
    account has been authenticating to and often the credential itself. This is one of the
    cheapest post-compromise moves available: no tooling, no privilege beyond the account
    already held, and no memory access. The history file is written by the shell on exit and
    read back only when the shell starts, so it has almost no legitimate reader. The
    discriminator is who is doing the reading and whose file it is: an interactive shell
    grepping another user's history for the word password is not the same act as a backup
    agent including home directories in a sweep.
  severity: medium
  author: huntgraph
  tags:
    - credential-access
    - unsecured-credentials
    - shell-history
    - linux
  references:
    - https://attack.mitre.org/techniques/T1552/003
    - https://attack.mitre.org/detectionstrategies/DET0385
    - https://attack.mitre.org/techniques/T1552

mitre:
  tactics:
    - TA0006
  techniques:
    - T1552
  sub_techniques:
    - T1552.003
  detection_strategies:
    - DET0385
  analytics:
    - AN1085
  platforms:
    - Linux
  data_sources:
    - auditd:EXECVE
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary may read the shell history of the current or another user so that
    credentials typed as command-line arguments, along with the hosts and services those
    credentials belong to, can be recovered without touching memory or escalating privilege.
  attacker_behavior:
    - Reads the history file with a pager or shell utility rather than through a shell session.
    - Searches history for words such as password, token or key.
    - Reads the history of another user's home directory after switching accounts.
    - Collects history alongside other credential files in the same home directory.
  legitimate_behavior:
    - Backup agents include home directories, and therefore history files, in their sweeps.
    - Users grep their own history to recall a command they ran earlier.
    - Configuration management reads or truncates history files as part of hardening.
    - Support engineers review a user's recent commands while reconstructing an incident.
  risk_indicator:
    - The history file read belongs to a different user than the one reading it.
    - The read is filtered on credential keywords rather than on a command being recalled.
    - Other credential stores in the same home directory are collected in the same window.
    - The read follows a privilege switch or an account change within a short window.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - audit_command
      fields:
        agent_id: agent.id
        host: agent.name
        user: audit.auid
        image_path: audit.exe
        command_line: audit.execve.a1
        parent_process: audit.ppid

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: history-file-read-by-utility
        name: History file read with a shell utility
        purpose: >-
          Surface direct reads of the history file. The shell loads its own history without
          spawning anything, so a pager, copier or encoder addressing the file is an
          external reader rather than a session starting.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\.(bash|zsh|ksh|sh|python|mysql|psql)_history\b/i
          | CommandLine=/\b(cat|less|more|head|tail|cp|scp|rsync|dd|tar|base64|xxd|strings|awk|sed|vi|vim|nano|nc)\b/
          | groupBy([ComputerName, UserName, ImageFileName, ParentBaseFileName],
                    function=[count(as=reads), collect([CommandLine, aid], limit=50)])
          | sort(reads, order=asc)
        filters:
          include: []
          exclude:
            - "Approved backup and configuration-management agents that sweep home directories"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - organization

      - id: history-searched-for-secrets
        name: History searched for credential keywords
        purpose: >-
          Separate recall from harvesting. A user grepping history looks for a command; an
          adversary looks for the word password, and the search term is the whole
          difference between the two.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(_history\b|\bhistory\b)/i
          | CommandLine=/\b(grep|egrep|zgrep|rg|ag|awk|sed)\b/
          | CommandLine=/(password|passwd|passphrase|token|secret|api[_-]?key|-p[A-Za-z0-9]|Authorization|ssh\s+-i|mysql|psql|aws_secret)/i
          | groupBy([ComputerName, UserName, ImageFileName, ParentBaseFileName],
                    function=[count(as=searches), collect([CommandLine], limit=50)])
          | sort(searches, order=asc)
        filters:
          include: []
          exclude:
            - "Secret-scanning and hygiene tooling that audits home directories on a schedule"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: another-users-history-read
        name: History read out of another user's home directory
        purpose: >-
          Isolate the cross-account read, which has no benign explanation on a multi-user
          host outside support work. Reading your own history is ordinary; reading someone
          else's is collection.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(\/home\/[A-Za-z0-9._-]+\/\.[a-z]+_history|\/root\/\.[a-z]+_history)/
          | CommandLine=/\b(cat|less|more|head|tail|grep|egrep|cp|scp|rsync|tar|strings|awk|sed)\b/
          | groupBy([ComputerName, UserName, ImageFileName, ParentBaseFileName],
                    function=[count(as=reads), collect([CommandLine], limit=50)])
          | sort(reads, order=asc)
        filters:
          include: []
          exclude:
            - "Administrators reviewing a user's session during a recorded support case"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - path

      - id: history-taken-with-other-credential-stores
        name: History collected alongside other credential files
        purpose: >-
          Confirm the read is part of a credential sweep rather than an isolated look, by
          catching the history file being handled in the same command as the other secrets
          that live in a home directory.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/_history\b/i
          | CommandLine=/(\.aws\/credentials|\.ssh\/|\.netrc|\.docker\/config\.json|\.kube\/config|\.git-credentials|\.pgpass|\.my\.cnf)/
          | groupBy([ComputerName, UserName, ImageFileName, ParentBaseFileName],
                    function=[count(as=events), collect([CommandLine], limit=50)])
          | sort(events, order=asc)
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 101376
      group: huntgraph,linux,credential-access,unsecured-credentials
      lists: []

    cases:
      - id: history-taken-with-other-credential-stores
        covers: history-taken-with-other-credential-stores
        name: History collected alongside other credential files
        purpose: >-
          Confirm the read is part of a credential sweep rather than an isolated look,
          by catching the history file being handled in the same command as the other
          secrets that live in a home directory.
        rule: |
          <rule id="101376" level="8">
            <if_group>audit_command</if_group>
            <field name="audit.execve.a1" type="pcre2">(?i)_history\b</field>
            <field name="audit.execve.a1" type="pcre2">(\.aws\/credentials|\.ssh\/|\.netrc|\.docker\/config\.json|\.kube\/config|\.git-credentials|\.pgpass|\.my\.cnf)</field>
            <description>History collected alongside other credential files</description>
            <mitre><id>T1552.003</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: history-file-read-by-utility
        reason: >-
          Depends on a 90d baseline comparison (host, user, organization); a stateless
          rule holds no history.
      - case: history-searched-for-secrets
        reason: >-
          Depends on a 90d baseline comparison (host, user, command_line); a stateless
          rule holds no history.
      - case: another-users-history-read
        reason: >-
          Depends on a 90d baseline comparison (host, user, path); a stateless rule
          holds no history.

evidence:
  required:
    - id: history_file_read
      name: Shell history file read outside a shell session
      description: >-
        A process read or copied a shell history file using a utility, which the shell
        itself never needs to do because it loads its own history internally.
      source: process_creation
      field: command_line
      indicates: stored_credential_discovery

  supporting:
    - id: secret_keyword_search
      name: History filtered on credential keywords
      description: >-
        The read was filtered on words such as password, token or key rather than on a
        command being recalled, which is harvesting rather than recall.
      source: process_creation
      field: image_path
      indicates: credential_pattern_search
    - id: cross_user_history
      name: Another user's history file read
      description: >-
        The history file addressed belongs to a different home directory than the account
        performing the read, so the reader is collecting someone else's session record.
      source: process_creation
      field: user
      indicates: cross_account_collection
    - id: privilege_switch_ancestry
      name: Read follows a privilege or account switch
      description: >-
        The reading process descends from su, sudo or a newly established session, placing
        the read immediately after an account change.
      source: process_creation
      field: parent_process
      indicates: post_escalation_collection
    - id: unprecedented_read
      name: No comparable read in the baseline
      description: >-
        Neither this host nor this account has read a history file in the baseline window
        outside the regular cadence of its agents.
      source: baseline
      field: ComputerName
      indicates: unusual_activity_for_host

  contradicting:
    - id: backup_or_config_agent
      name: Backup or configuration-management agent
      description: >-
        The reader is an approved backup or configuration-management client whose sweep of
        home directories necessarily includes history files.
      source: process_creation
      field: image_path
      indicates: legitimate_enterprise_activity
    - id: own_history_recall
      name: User recalling their own commands
      description: >-
        The account read its own history file, which is ordinary shell use and produces the
        same command line as collection does.
      source: process_creation
      field: user
      indicates: routine_user_activity
    - id: recorded_support_review
      name: Recorded support or forensic review
      description: >-
        An incident or support record covers an engineer reviewing a user's recent commands
        while reconstructing what happened.
      source: change_management
      field: ComputerName
      indicates: legitimate_administrative_action

  risk_logic:
    required:
      - history_file_read

    supporting:
      any:
        - secret_keyword_search
        - cross_user_history
        - privilege_switch_ancestry
        - unprecedented_read
      all:
        - cross_user_history
        - privilege_switch_ancestry

    contradicting:
      any:
        - backup_or_config_agent
        - own_history_recall
        - recorded_support_review
      all: []

  verdict:
    low_risk_when:
      - history_file_read
      - backup_or_config_agent
      - own_history_recall
      - recorded_support_review
    suspicious_when:
      - history_file_read
      - unprecedented_read
    high_risk_when:
      - history_file_read
      - secret_keyword_search
      - cross_user_history
      - privilege_switch_ancestry

  false_positive:
    - condition: A backup agent sweeps home directories.
      explanation: >-
        Full-home backup reads every dotfile including history, reproducing the required
        evidence. The acting process is the backup client, it runs under a service account
        on a schedule, and it reads whole trees rather than history files specifically.
    - condition: A user greps their own history to recall a command.
      explanation: >-
        This is routine and produces an identical command line. The account matches the home
        directory being read and the search term is a command or a hostname rather than a
        credential keyword.
    - condition: Configuration management truncates or audits history files during hardening.
      explanation: >-
        Some hardening baselines disable or clear shell history, which requires touching the
        same files. The agent is the acting process and the same action appears uniformly
        across every host in the group.
    - condition: A support engineer reviews a user's recent commands after an incident.
      explanation: >-
        Reading another user's history during a legitimate investigation is exactly the
        cross-account read this hunt looks for. It is distinguished by a named engineer, an
        incident record, and no accompanying sweep of the other credential files nearby.
