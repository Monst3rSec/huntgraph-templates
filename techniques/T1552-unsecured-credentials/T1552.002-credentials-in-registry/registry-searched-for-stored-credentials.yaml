type: detection

id: hg-win-registry-searched-for-stored-credentials-t1552-002

version: 1.0.0

info:
  name: Registry searched for stored credentials
  description: >-
    The registry is where Windows and third-party software park the secrets they need to
    start without a human present: autologon passwords under Winlogon, saved session
    passwords for terminal and VNC clients, SNMP community strings, mail account
    passwords under Outlook profiles. None of it is protected against a reader who already
    has the right context, so an adversary does not need to touch LSASS or drop a driver —
    a keyword sweep of the hive returns usable credentials with an ordinary built-in tool.
    Reads leave no registry-modification trace, so the observable is the search itself: a
    recursive keyword query across a hive, or a targeted read of a key whose only interesting
    content is a password. The discriminator is intent expressed in the command line —
    inventory agents read specific values they already know the name of, while credential
    discovery searches for the word.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - unsecured-credentials
    - registry
    - discovery
    - windows
  references:
    - https://attack.mitre.org/techniques/T1552/002
    - https://attack.mitre.org/detectionstrategies/DET0250
    - https://attack.mitre.org/techniques/T1552

mitre:
  tactics:
    - TA0006
  techniques:
    - T1552
  sub_techniques:
    - T1552.002
  detection_strategies:
    - DET0250
  analytics:
    - AN0694
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary may sweep the registry for values containing passwords, or read the small
    set of keys known to hold them, so that credentials for other accounts and systems can
    be obtained without touching LSASS, dropping tooling or triggering a credential-theft
    detection.
  attacker_behavior:
    - Runs a recursive keyword query across a hive looking for the word password.
    - Reads keys known to hold secrets, such as the autologon or saved-session values.
    - Uses a harvesting script or utility that walks the same keys in one pass.
    - Repeats the sweep in both the machine and the current-user hive.
  legitimate_behavior:
    - Inventory and configuration agents read named registry values on a schedule.
    - Installers and application launchers read their own product keys at startup.
    - Administrators check an autologon or service configuration while diagnosing a fault.
    - Security and compliance scanners audit the same keys for weak configuration.
  risk_indicator:
    - The query searches for a keyword rather than reading a value by name.
    - The sweep is recursive and spans a whole hive.
    - The reader is a shell or script host rather than an agent or installer.
    - Several unrelated credential-bearing keys are read in the same short window.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - sysmon_event1
        - windows_security
      fields:
        agent_id: agent.id
        host: win.system.computer
        user: win.eventdata.user
        image_name: win.eventdata.image
        image_path: win.eventdata.image
        command_line: win.eventdata.commandLine
        parent_process: win.eventdata.parentImage

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: reg-query-keyword-sweep
        name: Recursive registry query filtered on a credential keyword
        purpose: >-
          Surface the canonical form of this technique, where reg.exe is asked to search a
          hive for a word rather than to read a value. Software reads values it already
          knows the name of, so the keyword filter is the intent.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | FileName=/^reg\.exe$/i
          | CommandLine=/\bquery\b/i
          | CommandLine=/\/f\s+["']?(password|passwd|pwd|pass|cred|credential|login|secret|apikey|token)/i
          | groupBy([ComputerName, UserName, ParentBaseFileName],
                    function=[count(as=queries), collect([CommandLine], limit=5)])
          | sort(queries, order=asc)
        filters:
          include: []
          exclude:
            - "Compliance and configuration-audit agents that query hives on a fixed schedule"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - organization

      - id: powershell-hive-walk-for-secrets
        name: Registry walked from PowerShell looking for password values
        purpose: >-
          Catch the same sweep written in PowerShell, where a recursive enumeration is
          piped into a string match instead of using the built-in keyword filter.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\b(Get-ChildItem|Get-ItemProperty|Get-Item|gci|gp)\b/i
          | CommandLine=/(HKLM:|HKCU:|HKEY_LOCAL_MACHINE|HKEY_CURRENT_USER|Registry::)/i
          | CommandLine=/(password|passwd|pwd|credential|secret)/i
          | CommandLine=/(-Recurse|Select-String|Where-Object|\bsls\b|\bwhere\b)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=sweeps), collect([CommandLine], limit=5)])
          | sort(sweeps, order=asc)
        filters:
          include: []
          exclude:
            - "Endpoint management scripts that enumerate configuration hives by design"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: known-credential-keys-read
        name: Keys known to hold secrets read directly
        purpose: >-
          Cover the targeted route, where the adversary already knows which keys hold
          usable material and reads them by name rather than searching. These paths have
          no legitimate reader outside the owning product itself.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Winlogon.{0,40}(DefaultPassword|AltDefaultPassword|AutoAdminLogon)|SimonTatham\\+PuTTY\\+Sessions|(Real|Tight|Ultra|Win)VNC|SNMP\\+Parameters\\+(ValidCommunities|TrapConfiguration)|Terminal Server Client\\+Servers|Profiles\\+Outlook|WinSCP\s*2\\+Sessions|Policies\\+Microsoft\\+Windows\\+Installer)/i
          | CommandLine=/(reg(\.exe)?\s+query|Get-ItemProperty|Get-ItemPropertyValue|Get-ChildItem|Registry::)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=reads), collect([CommandLine], limit=5)])
          | sort(reads, order=asc)
        filters:
          include: []
          exclude:
            - "The owning product reading its own saved-session or profile keys at startup"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: registry-credential-harvester-invoked
        name: Harvesting utility or module that walks the credential keys
        purpose: >-
          Identify the packaged form, where a single tool or module performs the whole
          sweep in one pass. The tool name is the finding because these exist only to
          collect stored credentials.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\b(lazagne|Get-UnattendedInstallFile|Get-Webconfig|Get-ApplicationHost|Get-SiteListPassword|Get-CachedGPPPassword|Get-RegistryAutoLogon|Invoke-PrivescCheck|SessionGopher|SharpWeb)\b/i
          | groupBy([ComputerName, UserName, FileName, ImageFileName, ParentBaseFileName],
                    function=[count(as=runs), collect([CommandLine], limit=5)])
          | sort(runs, order=asc)
        filters:
          include: []
          exclude:
            - "Authorised red-team and penetration-testing hosts"
        baseline:
          required: false
          window: null
          compare: []

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 101360
      group: huntgraph,windows,credential-access,unsecured-credentials
      lists: []

    cases:
      - id: registry-credential-harvester-invoked
        covers: registry-credential-harvester-invoked
        name: Harvesting utility or module that walks the credential keys
        purpose: >-
          Identify the packaged form, where a single tool or module performs the whole
          sweep in one pass. The tool name is the finding because these exist only to
          collect stored credentials.
        rule: |
          <rule id="101360" level="12">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)\b(lazagne|Get-UnattendedInstallFile|Get-Webconfig|Get-ApplicationHost|Get-SiteListPassword|Get-CachedGPPPassword|Get-RegistryAutoLogon|Invoke-PrivescCheck|SessionGopher|SharpWeb)\b</field>
            <description>Harvesting utility or module that walks the credential keys</description>
            <mitre><id>T1552.002</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: reg-query-keyword-sweep
        reason: >-
          Depends on a 90d baseline comparison (host, user, organization); a stateless
          rule holds no history.
      - case: powershell-hive-walk-for-secrets
        reason: >-
          Depends on a 90d baseline comparison (host, user, command_line); a stateless
          rule holds no history.
      - case: known-credential-keys-read
        reason: >-
          Depends on a 90d baseline comparison (host, user, command_line); a stateless
          rule holds no history.

evidence:
  required:
    - id: registry_searched_for_credentials
      name: Registry queried for credential material
      description: >-
        A process searched the registry for values containing a password keyword, or read a
        key whose only notable content is a stored secret, which is credential discovery
        rather than configuration reading.
      source: process_creation
      field: command_line
      indicates: stored_credential_discovery

  supporting:
    - id: recursive_hive_sweep
      name: Whole-hive recursive search
      description: >-
        The query spans an entire hive recursively rather than addressing a single key,
        which is how a search behaves and not how an application reads its own settings.
      source: process_creation
      field: image_name
      indicates: broad_credential_search
    - id: harvester_tooling
      name: Credential harvesting utility present
      description: >-
        A tool or module that exists specifically to extract stored credentials from the
        registry was executed on the host.
      source: process_creation
      field: image_path
      indicates: credential_harvesting_tool
    - id: shell_ancestry
      name: Run from a shell or script host
      description: >-
        The reading process was started by a command shell, script host or remote-execution
        service rather than by an installer, service manager or management agent.
      source: process_creation
      field: parent_process
      indicates: hands_on_keyboard_activity
    - id: unprecedented_for_host
      name: No comparable query in the baseline
      description: >-
        This host and account have not run a comparable registry search during the baseline
        window, so the activity is a deviation as well as a credential query.
      source: baseline
      field: ComputerName
      indicates: unusual_activity_for_host

  contradicting:
    - id: inventory_or_audit_agent
      name: Inventory, patching or compliance agent
      description: >-
        The reading process belongs to an approved management or compliance agent whose
        job includes enumerating configuration keys on a schedule.
      source: process_creation
      field: user
      indicates: legitimate_enterprise_activity
    - id: owning_product_read
      name: The owning application reading its own key
      description: >-
        A terminal, mail or remote-access client read its own saved-session key as part of
        starting up, which is the key's intended use.
      source: asset_inventory
      field: ImageFileName
      indicates: legitimate_application_component
    - id: fleetwide_identical_query
      name: Identical query across the estate
      description: >-
        The same command line appears on a large share of hosts within one window, which is
        a distributed script rather than a targeted search.
      source: baseline
      field: CommandLine
      indicates: software_deployment_wave

  risk_logic:
    required:
      - registry_searched_for_credentials

    supporting:
      any:
        - recursive_hive_sweep
        - harvester_tooling
        - shell_ancestry
        - unprecedented_for_host
      all:
        - harvester_tooling
        - shell_ancestry

    contradicting:
      any:
        - inventory_or_audit_agent
        - owning_product_read
        - fleetwide_identical_query
      all: []

  verdict:
    low_risk_when:
      - registry_searched_for_credentials
      - inventory_or_audit_agent
      - owning_product_read
      - fleetwide_identical_query
    suspicious_when:
      - registry_searched_for_credentials
      - unprecedented_for_host
    high_risk_when:
      - registry_searched_for_credentials
      - recursive_hive_sweep
      - harvester_tooling
      - shell_ancestry

  false_positive:
    - condition: An inventory or compliance agent enumerates configuration keys.
      explanation: >-
        Audit tooling reads autologon and service keys precisely because they are weak
        spots, producing the same reads. The agent is the acting process, the cadence is
        fixed, and the pattern is identical across the fleet rather than confined to one host.
    - condition: A remote-access or mail client reads its own saved-session key.
      explanation: >-
        PuTTY, VNC and Outlook read their own credential values every time they start. The
        reader is the product's own binary rather than reg.exe or a script host.
    - condition: An administrator checks an autologon setting while fixing a kiosk build.
      explanation: >-
        Reading the Winlogon values is reasonable support work on unattended machines. It is
        a single targeted read by a named engineer, not a keyword sweep, and usually has a
        ticket behind it.
    - condition: A build or provisioning script queries product keys during imaging.
      explanation: >-
        Imaging scripts read configuration keys to decide what to install. These run under
        the provisioning account, at build time, and appear identically on every machine
        that passes through the pipeline.
