type: detection

id: hg-lin-credential-bearing-files-searched-t1552-001
version: 1.0.0

info:
  name: Filesystem searched for credential-bearing files
  description: >-
    Credentials end up in files far more often than anyone intends: private keys, cloud
    profiles, environment files, connection strings in application configuration, shell
    history containing a pasted token. An adversary who lands on a host looks for them
    immediately, because it is cheap and frequently works. The behaviour is a search
    pattern rather than a single access — a recursive grep for password-shaped strings, or
    a sweep of the well-known credential paths — and it is issued shortly after arrival by
    an account that has no reason to be reading other people's secrets.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - unsecured-credentials
    - discovery
    - linux
  references:
    - https://attack.mitre.org/techniques/T1552/001
    - https://attack.mitre.org/detectionstrategies/DET0307
    - https://attack.mitre.org/techniques/T1552

mitre:
  tactics:
    - TA0006
  techniques:
    - T1552
  sub_techniques:
    - T1552.001
  detection_strategies:
    - DET0307
  analytics:
    - AN0857
  platforms:
    - Linux
  data_sources:
    - auditd:EXECVE
    - auditd:SYSCALL
  data_components:
    - Command Execution
    - File Access

hypothesis:
  statement: >-
    An adversary may search the filesystem for files containing credentials — private keys,
    cloud profiles, environment files and application configuration — harvesting secrets
    that were stored in plaintext without needing to compromise any credential store.
  attacker_behavior:
    - Runs a recursive grep or find for password, secret, token or key strings.
    - Reads the well-known credential paths such as SSH keys, cloud profiles and environment files.
    - Sweeps application configuration directories for connection strings.
    - Archives what is found before moving it off the host.
  legitimate_behavior:
    - Developers search their own project directories for configuration values.
    - Configuration management reads credential files as part of provisioning.
    - Backup and security-scanning tools read broadly across the filesystem.
    - Secret-scanning tooling deliberately searches for exposed credentials.
  risk_indicator:
    - The search covers other users' home directories or the whole filesystem.
    - Several distinct credential locations are touched in one session.
    - The activity is issued by a web service account or a shell reached remotely.
    - The results are archived shortly afterwards.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - audit_command
      fields:
        agent_id: agent.id
        host: agent.name
        image_path: audit.exe
        command_line: audit.execve.a1
        parent_process: audit.ppid

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: recursive-secret-search
        name: Recursive search for credential-shaped strings
        purpose: >-
          Surface the sweep pattern, where a search runs recursively for the words that
          precede a secret in a configuration file.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\b(grep|egrep|rg|ag|ack|find)\b/i
          | CommandLine=/(password|passwd|secret|api[_-]?key|token|credential|BEGIN\s+(RSA|OPENSSH|EC|PRIVATE))/i
          | CommandLine=/(-r\b|-R\b|--recursive|\/home|\/etc|\/var\/www|\/opt|\s\/\s)/i
          | groupBy([ComputerName, ImageFileName, ParentBaseFileName],
                    function=[count(as=searches), collect([CommandLine], limit=5)])
          | sort(searches, order=asc)
        filters:
          include: []
          exclude:
            - "Approved secret-scanning tooling and its service account"
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - command_line
            - organization

      - id: well-known-credential-paths
        name: Well-known credential locations read
        purpose: >-
          Catch the direct approach, where the operator skips searching and goes straight
          to the paths that reliably hold secrets.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(\.ssh\/id_[a-z0-9]+|\.aws\/credentials|\.azure\/|\.kube\/config|\.docker\/config\.json|\.netrc|\.pgpass|\.git-credentials|\.env\b|credentials\.json)/i
          | CommandLine=/\b(cat|less|more|head|tail|cp|scp|base64|xxd|strings)\b/i
          | groupBy([ComputerName, ImageFileName, ParentBaseFileName],
                    function=[count(as=reads), collect([CommandLine], limit=10)])
        filters:
          include: []
          exclude:
            - "Configuration-management agents that read credential files during provisioning"
        baseline:
          required: true
          window: 45d
          compare:
            - host
            - command_line

      - id: findings-archived
        name: Credential material collected into an archive
        purpose: >-
          Identify the packaging step, which turns a search into a collection prepared for
          transfer.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\b(tar|zip|gzip|7z|base64)\b/i
          | CommandLine=/(\.ssh|\.aws|\.kube|\.env|credential|secret|id_rsa)/i
          | groupBy([ComputerName, ImageFileName, ParentBaseFileName],
                    function=[count(as=events), collect([CommandLine], limit=5)])
        filters:
          include: []
          exclude:
            - "Backup agents that archive home directories by design"
        baseline:
          required: false
          window: null
          compare: []

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 101344
      group: huntgraph,linux,credential-access,unsecured-credentials
      lists: []

    cases:
      - id: findings-archived
        covers: findings-archived
        name: Credential material collected into an archive
        purpose: >-
          Identify the packaging step, which turns a search into a collection prepared
          for transfer.
        rule: |
          <rule id="101344" level="12">
            <if_group>audit_command</if_group>
            <field name="audit.execve.a1" type="pcre2">(?i)\b(tar|zip|gzip|7z|base64)\b</field>
            <field name="audit.execve.a1" type="pcre2">(?i)(\.ssh|\.aws|\.kube|\.env|credential|secret|id_rsa)</field>
            <description>Credential material collected into an archive</description>
            <mitre><id>T1552.001</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: recursive-secret-search
        reason: >-
          Depends on a 45d baseline comparison (host, command_line, organization); a
          stateless rule holds no history.
      - case: well-known-credential-paths
        reason: >-
          Depends on a 45d baseline comparison (host, command_line); a stateless rule
          holds no history.

evidence:
  required:
    - id: credential_search
      name: Filesystem searched or credential paths read
      description: >-
        A recursive search for credential-shaped strings was run, or well-known credential
        files were read directly, indicating a hunt for secrets stored in plaintext.
      source: process_creation
      field: command_line
      indicates: credential_material_capture

  supporting:
    - id: broad_scope
      name: Search covers other users or the whole filesystem
      description: >-
        The search reaches beyond the acting user's own directories into other home
        directories, system configuration or the filesystem root.
      source: process_creation
      field: command_line
      indicates: hands_on_keyboard_activity
    - id: multiple_credential_locations
      name: Several credential locations touched
      description: >-
        More than one distinct class of credential file was accessed in the same session,
        which is systematic harvesting rather than a developer opening one config.
      source: process_creation
      field: command_line
      indicates: systematic_collection
    - id: service_account_actor
      name: Issued by a service account or remote shell
      description: >-
        The activity runs under a web service or application account, or from a shell
        reached remotely, rather than under an interactive developer session.
      source: process_creation
      field: parent_process
      indicates: abnormal_execution_chain
    - id: results_archived
      name: Findings compressed for transfer
      description: >-
        Credential files were archived shortly after being located, indicating collection
        for exfiltration rather than inspection.
      source: process_creation
      field: command_line
      indicates: collection_staging

  contradicting:
    - id: secret_scanning_tool
      name: Approved secret-scanning tooling
      description: >-
        The search is performed by a sanctioned secret-scanning product that looks for
        exposed credentials as its function.
      source: process_creation
      field: image_path
      indicates: legitimate_enterprise_activity
    - id: developer_own_project
      name: Developer searching their own project
      description: >-
        The search is scoped to the acting user's own project or home directory on an
        engineering host.
      source: asset_inventory
      field: ComputerName
      indicates: expected_developer_activity
    - id: provisioning_read
      name: Configuration management reading credentials
      description: >-
        An approved configuration-management agent read credential files as part of
        provisioning a host or a service.
      source: process_creation
      field: parent_process
      indicates: legitimate_enterprise_activity

  risk_logic:
    required:
      - credential_search

    supporting:
      any:
        - broad_scope
        - multiple_credential_locations
        - service_account_actor
        - results_archived
      all:
        - broad_scope
        - service_account_actor

    contradicting:
      any:
        - secret_scanning_tool
        - developer_own_project
        - provisioning_read
      all: []

  verdict:
    low_risk_when:
      - credential_search
      - secret_scanning_tool
      - developer_own_project
      - provisioning_read
    suspicious_when:
      - credential_search
      - multiple_credential_locations
    high_risk_when:
      - credential_search
      - broad_scope
      - service_account_actor
      - results_archived

  false_positive:
    - condition: A developer greps their own project for a configuration value.
      explanation: >-
        Searching for a setting by name is routine development work and matches the
        required evidence exactly. It is scoped to the user's own directories on an
        engineering host.
    - condition: Secret-scanning tooling searches for exposed credentials.
      explanation: >-
        Security tooling reproduces this technique deliberately and at breadth, matching
        the scope evidence too. It runs from a known product under its own account on a
        schedule.
    - condition: Configuration management reads credential files during provisioning.
      explanation: >-
        Provisioning legitimately reads keys and profiles to place them. The agent is the
        acting process and the pattern repeats across the fleet.
    - condition: A backup agent archives home directories including credential files.
      explanation: >-
        Backups sweep broadly and compress what they find, reproducing the archiving
        evidence. The acting process is an approved backup client with a fixed schedule.
