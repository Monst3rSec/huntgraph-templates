type: detection

id: hg-lin-pam-stack-or-module-changed-outside-package-management-t1556-003

version: 1.0.0

info:
  name: PAM stack or module changed outside package management
  description: >-
    Every local login, every sudo, every SSH password prompt and most service authentications
    on a Linux host are decided by the same small stack of PAM configuration files and shared
    modules. Editing that stack is the most durable backdoor available: a line inserted into
    the authentication chain can make one attacker-chosen password work for every account, or
    make authentication succeed unconditionally, and a patched pam_unix.so can do the same
    while also writing every password it validates to a file. Nothing about the resulting
    logins is anomalous — they succeed, they are attributed to real accounts, and password
    rotation does not touch them. The stack is also almost never edited by hand: modules
    arrive through the package manager and configuration is generated by distribution tools
    or pushed by configuration management. That is the discriminator. A shell writing to
    /etc/pam.d or a shared object appearing in the security module directory without a
    package transaction behind it is the finding, not a precursor to one.
  severity: critical
  author: huntgraph
  tags:
    - persistence
    - credential-access
    - defense-impairment
    - authentication
    - pam
    - linux
  references:
    - https://attack.mitre.org/techniques/T1556/003
    - https://attack.mitre.org/detectionstrategies/DET0454
    - https://attack.mitre.org/techniques/T1556

mitre:
  tactics:
    - TA0003
    - TA0006
    - TA0112
  techniques:
    - T1556
  sub_techniques:
    - T1556.003
  detection_strategies:
    - DET0454
  analytics:
    - AN1250
  platforms:
    - Linux
  data_sources:
    - auditd:SYSCALL
  data_components:
    - File Modification
    - Process Creation

hypothesis:
  statement: >-
    An adversary may modify the PAM configuration stack or replace a PAM shared module so
    that a password of their choosing authenticates any account or authentication succeeds
    unconditionally, obtaining persistent access that survives password rotation and produces
    login records indistinguishable from legitimate ones.
  attacker_behavior:
    - Inserts a permissive directive into an authentication chain under /etc/pam.d.
    - Adds nullok to the Unix module so empty passwords are accepted.
    - Replaces pam_unix.so with a patched build that accepts a fixed backdoor password.
    - Compiles or fetches a module locally and installs it into the security module directory.
  legitimate_behavior:
    - Package upgrades replace PAM modules and refresh their configuration.
    - Distribution tools regenerate the authentication stack when auth settings change.
    - Configuration management pushes a standard PAM policy across the estate.
    - Administrators integrate a new authentication provider such as SSSD or a MFA module.
  risk_indicator:
    - The configuration is edited by a shell redirect or stream editor rather than regenerated.
    - A directive is added that makes authentication succeed regardless of the password.
    - A module shared object is written with no package transaction covering it.
    - The change appears on one host rather than across the estate.

requires:
  platforms:
    - linux
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - audit_command
      fields:
        agent_id: agent.id
        host: agent.name
        user: audit.auid
        image_path: audit.exe
        command_line: audit.execve.a1
        parent_process: audit.ppid
    - source: file_creation
      connector: crowdstrike-ngsiem
      event_types:
        - NewExecutableWritten
      fields:
        agent_id: aid
        host: ComputerName
        file_path: TargetFileName
        writer_process_id: ContextProcessId
    - source: file_creation
      connector: wazuh
      event_types:
        - syscheck_entry_added
      fields:
        agent_id: agent.id
        host: agent.name
        file_path: syscheck.path
        writer_process_id: syscheck.audit.process.id

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: pam-configuration-edited-from-a-shell
        name: Authentication stack edited by hand
        purpose: >-
          Surface direct edits to the files that decide every authentication on the host.
          Distribution tooling regenerates these files wholesale and configuration management
          renders them from a template, so a redirect, stream editor or text editor pointed at
          /etc/pam.d is a route that governed change never takes.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\/etc\/(pam\.d\/|pam\.conf|security\/)/
          | CommandLine=/(>>|>|tee\b|sed\s+-i|perl\s+-p?i|printf\b|echo\b|vi\b|vim\b|nano\b|ed\b)/i
          | groupBy([ComputerName, UserName, ImageFileName, ParentBaseFileName],
                    function=[count(as=changes), collect([CommandLine], limit=5)])
          | sort(changes, order=asc)
        filters:
          include: []
          exclude:
            - "ParentBaseFileName of the configuration-management agent that renders PAM policy"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - command_line
            - organization

      - id: authentication-stack-made-permissive
        name: Directive added that lets authentication succeed
        purpose: >-
          Isolate the specific content that turns a configuration change into a backdoor.
          Naming pam_permit in an auth chain, marking a module sufficient, or adding nullok
          means the decision no longer depends on the supplied password, which is the whole
          point of the technique rather than an incidental edit.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(pam_permit\.so|pam_succeed_if\.so|nullok(_secure)?|auth\s+sufficient|auth\s+optional)/i
          | CommandLine=/(\/etc\/pam|>>|>|tee\b|sed\s+-i|perl\s+-p?i)/i
          | groupBy([ComputerName, UserName, ImageFileName, ParentBaseFileName],
                    function=[count(as=changes), collect([CommandLine], limit=5)])
          | sort(changes, order=asc)
        filters:
          include: []
          exclude:
            - "Hosts where passwordless console access is a documented kiosk or appliance design"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - command_line
            - organization

      - id: pam-module-written-to-the-security-directory
        name: PAM shared module written on disk
        purpose: >-
          Catch the deeper form, where the configuration is untouched and the module itself is
          replaced with a patched build. This is invisible to anyone reviewing /etc/pam.d and
          is the version that both backdoors authentication and harvests the passwords it sees.
        query: |
          #event_simpleName=NewExecutableWritten
          | TargetFileName=/\/(lib|lib64|usr\/lib|usr\/lib64|usr\/local\/lib)\/([^\/]+\/)?security\/pam_[^\/]+\.so$/
          | groupBy([ComputerName, TargetFileName, ContextProcessId],
                    function=[count(as=writes)])
          | sort(writes, order=asc)
        filters:
          include: []
          exclude:
            - "ContextProcessId of the package manager during a recorded upgrade window"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - path
            - organization

      - id: pam-module-staged-or-built-locally
        name: PAM module compiled, fetched or copied into place
        purpose: >-
          Cover the staging step that precedes the replacement. Modules ship in packages, so a
          compiler, downloader or plain copy handling a file named like a PAM module describes
          a build the distribution never produced.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/pam_[a-z0-9_]+\.so/
          | CommandLine=/(\bgcc\b|\bcc\b|\bclang\b|\bmake\b|\bcurl\b|\bwget\b|\bcp\b|\bmv\b|\binstall\b|\bpatchelf\b|\bobjcopy\b)/i
          | groupBy([ComputerName, UserName, ImageFileName, ParentBaseFileName],
                    function=[count(as=events), collect([CommandLine], limit=5)])
          | sort(events, order=asc)
        filters:
          include: []
          exclude:
            - "Build hosts where authentication modules are compiled as part of a release pipeline"
        baseline:
          required: false
          window: null
          compare: []

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 102016
      group: huntgraph,linux,persistence,credential-access
      lists: []

    cases:
      - id: pam-module-staged-or-built-locally
        covers: pam-module-staged-or-built-locally
        name: PAM module compiled, fetched or copied into place
        purpose: >-
          Cover the staging step that precedes the replacement. Modules ship in
          packages, so a compiler, downloader or plain copy handling a file named like
          a PAM module describes a build the distribution never produced.
        rule: |
          <rule id="102016" level="14">
            <if_group>audit_command</if_group>
            <field name="audit.execve.a1" type="pcre2">pam_[a-z0-9_]+\.so</field>
            <field name="audit.execve.a1" type="pcre2">(?i)(\bgcc\b|\bcc\b|\bclang\b|\bmake\b|\bcurl\b|\bwget\b|\bcp\b|\bmv\b|\binstall\b|\bpatchelf\b|\bobjcopy\b)</field>
            <description>PAM module compiled, fetched or copied into place</description>
            <mitre><id>T1556.003</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: pam-configuration-edited-from-a-shell
        reason: >-
          Depends on a 90d baseline comparison (host, command_line, organization); a
          stateless rule holds no history.
      - case: authentication-stack-made-permissive
        reason: >-
          Depends on a 90d baseline comparison (host, command_line, organization); a
          stateless rule holds no history.
      - case: pam-module-written-to-the-security-directory
        reason: >-
          Depends on a 90d baseline comparison (host, path, organization); a stateless
          rule holds no history.

evidence:
  required:
    - id: pam_stack_modified
      name: PAM configuration or module changed
      description: >-
        A file that decides authentication on this host was edited or a PAM module was handled
        outside the package manager, which changes how every login on the system is evaluated.
      source: process_creation
      field: command_line
      indicates: authentication_process_modification

  supporting:
    - id: permissive_directive_added
      name: Directive that lets authentication succeed regardless
      description: >-
        The change names a permissive module, marks a module sufficient, or allows empty
        passwords, so authentication no longer depends on the password supplied.
      source: process_creation
      field: image_path
      indicates: authentication_bypass_installed
    - id: module_binary_replaced
      name: Shared module written into the security directory
      description: >-
        A PAM module shared object appeared in the security module directory, which is the
        form of this technique that leaves the configuration files looking untouched.
      source: file_creation
      field: file_path
      indicates: authentication_component_tampering
    - id: no_package_transaction
      name: No package transaction accounts for the change
      description: >-
        No package manager activity covers this host in the surrounding window, so the module
        or configuration change did not arrive the way PAM components normally arrive.
      source: derived
      field: ParentBaseFileName
      indicates: unmanaged_system_change
    - id: unprecedented_for_host
      name: No comparable PAM change in the baseline
      description: >-
        The authentication stack has not been touched this way on this host during the
        baseline window, so the edit is a deviation as well as a modification.
      source: baseline
      field: ComputerName
      indicates: unusual_activity_for_host

  contradicting:
    - id: package_manager_upgrade
      name: Delivered by the package manager
      description: >-
        The change was made beneath a package manager transaction, which is how PAM modules
        and their default configuration are normally replaced.
      source: process_creation
      field: parent_process
      indicates: legitimate_enterprise_activity
    - id: config_management_run
      name: Rendered by configuration management
      description: >-
        The writing process is the approved configuration-management agent applying a governed
        authentication policy, which produces the same files across the estate.
      source: file_creation
      field: writer_process_id
      indicates: legitimate_enterprise_activity
    - id: approved_auth_integration
      name: Recorded authentication integration work
      description: >-
        A change record covers integrating an authentication provider or multi-factor module
        on this host in this window.
      source: change_management
      field: ComputerName
      indicates: legitimate_administrative_action

  risk_logic:
    required:
      - pam_stack_modified

    supporting:
      any:
        - permissive_directive_added
        - module_binary_replaced
        - no_package_transaction
        - unprecedented_for_host
      all:
        - permissive_directive_added
        - no_package_transaction

    contradicting:
      any:
        - package_manager_upgrade
        - config_management_run
        - approved_auth_integration
      all: []

  verdict:
    low_risk_when:
      - pam_stack_modified
      - package_manager_upgrade
      - config_management_run
      - approved_auth_integration
    suspicious_when:
      - pam_stack_modified
      - unprecedented_for_host
    high_risk_when:
      - pam_stack_modified
      - permissive_directive_added
      - module_binary_replaced
      - no_package_transaction

  false_positive:
    - condition: A package upgrade replaces PAM modules and refreshes their configuration.
      explanation: >-
        Upgrading libpam or an authentication package writes exactly these files and modules,
        reproducing the strongest supporting evidence. The discriminator is the package
        transaction around it and the fact that the same version lands across the fleet.
    - condition: A distribution tool regenerates the authentication stack.
      explanation: >-
        Utilities that manage the auth stack rewrite the whole file when a setting changes,
        and the result can legitimately contain permissive lines for local console access. They
        run as a known binary and regenerate rather than append.
    - condition: Configuration management pushes a standard PAM policy.
      explanation: >-
        Managed estates render /etc/pam.d from templates on every run. The agent is the writing
        process, the content is identical on peer hosts, and the cadence is fixed.
    - condition: An administrator integrates a new authentication provider or MFA module.
      explanation: >-
        Adding SSSD, a directory client or a multi-factor module means editing the stack and
        installing a module, which is genuinely this technique performed for a good reason. It
        is tied to a change record and the module comes from a signed vendor package rather
        than a local build.
