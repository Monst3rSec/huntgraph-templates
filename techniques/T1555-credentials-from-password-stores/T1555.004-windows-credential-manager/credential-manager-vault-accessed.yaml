type: detection

id: hg-win-credential-manager-vault-accessed-t1555-004
version: 1.0.0

info:
  name: Windows Credential Manager vault enumerated or dumped
  description: >-
    Credential Manager holds what users have told Windows to remember: mapped drive
    credentials, remote desktop logons, saved web and application passwords. Reading it
    requires no privilege beyond the owning user, and the contents are frequently domain
    credentials for other systems, which makes it a cheap route from one compromised
    workstation to somewhere better. Enumerating the vault is not something ordinary
    software does, so the discriminator is mostly who is asking rather than how.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - credential-manager
    - password-store
    - windows
  references:
    - https://attack.mitre.org/techniques/T1555/004
    - https://attack.mitre.org/detectionstrategies/DET0134
    - https://attack.mitre.org/techniques/T1555

mitre:
  tactics:
    - TA0006
  techniques:
    - T1555
  sub_techniques:
    - T1555.004
  detection_strategies:
    - DET0134
  analytics:
    - AN0378
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Metadata
    - Process Access

hypothesis:
  statement: >-
    An adversary may enumerate or dump the Windows Credential Manager vault, harvesting
    saved credentials for network shares, remote systems and applications without needing
    any privilege beyond the compromised user's own session.
  attacker_behavior:
    - Lists stored credentials with vaultcmd or cmdkey to see what the user has saved.
    - Reads the credential and vault directories under the user profile directly.
    - Uses PowerShell or a utility that calls the credential APIs to extract secrets.
    - Follows a successful read by authenticating to the systems those credentials cover.
  legitimate_behavior:
    - Users and administrators list saved credentials while troubleshooting a mapped drive.
    - Backup and profile-migration tooling copies the credential store.
    - Some enterprise applications read their own saved credentials at startup.
    - Support scripts clear stale credentials during a password rotation.
  risk_indicator:
    - The enumeration is followed by remote authentication attempts.
    - The reader is a script host or a binary in a user-writable directory.
    - The credential directories are copied rather than queried.
    - The activity is unprecedented for the host and user.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - sysmon_event1
        - windows_security
      fields:
        agent_id: agent.id
        host: win.system.computer
        user: win.eventdata.user
        image_name: win.eventdata.image
        image_path: win.eventdata.image
        command_line: win.eventdata.commandLine
        parent_process: win.eventdata.parentImage
    - source: network_connection
      connector: crowdstrike-ngsiem
      event_types:
        - NetworkConnectIP4
      fields:
        agent_id: aid
        host: ComputerName
        process_id: ContextProcessId
        remote_address: RemoteAddressIP4
        remote_port: RemotePort
    - source: network_connection
      connector: wazuh
      event_types:
        - sysmon_event3
      fields:
        agent_id: agent.id
        host: win.system.computer
        process_id: win.eventdata.processId
        remote_address: win.eventdata.destinationIp
        remote_port: win.eventdata.destinationPort

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: vault-enumerated
        name: Credential vault listed
        purpose: >-
          Surface enumeration of stored credentials, which is the reconnaissance step that
          tells an operator which systems the user can already reach.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(vaultcmd(\.exe)?\s+.*\/list|cmdkey(\.exe)?\s+.*\/list|Get-StoredCredential|PasswordVault|CredEnumerate|CredentialPicker)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=enumerations), collect([CommandLine, ImageFileName, aid], limit=50)])
          | sort(enumerations, order=asc)
        filters:
          include: []
          exclude:
            - "Approved backup and profile-migration tooling"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - command_line

      - id: credential-directories-copied
        name: Credential store directories copied
        purpose: >-
          Catch bulk collection, where the vault files themselves are taken for offline
          processing rather than queried in place.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Microsoft\\\\(Credentials|Vault|Protect)|\\\\AppData\\\\(Local|Roaming)\\\\Microsoft\\\\Credentials)/i
          | CommandLine=/\b(copy|xcopy|robocopy|Copy-Item|tar|Compress-Archive|7z)\b/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=events), collect([CommandLine], limit=50)])
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: enumeration-then-remote-auth
        name: Vault enumeration followed by remote authentication
        purpose: >-
          Join the harvest to its use, which is what converts a credential read into
          observed lateral movement.
        query: |
          #event_simpleName=/^(ProcessRollup2|NetworkConnectIP4)$/
          | case {
              #event_simpleName=ProcessRollup2
                | CommandLine=/(vaultcmd|cmdkey.*\/list|PasswordVault|CredEnumerate)/i
                | vault_read := CommandLine ;
              #event_simpleName=NetworkConnectIP4
                | RemotePort=/^(445|3389|5985|5986)$/ ;
            }
          | groupBy([ComputerName, UserName],
                    function=[collect([vault_read, RemoteAddressIP4, RemotePort, ParentBaseFileName, ContextProcessId]),
                              count(RemoteAddressIP4, distinct=true, as=distinct_targets)])
          | vault_read=/.+/
        filters:
          include: []
          exclude:
            - "ComputerName of approved management servers and jump hosts"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - remote_address

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 101488
      group: huntgraph,windows,credential-access,credential-manager
      lists: []

    cases:
      - id: credential-directories-copied
        covers: credential-directories-copied
        name: Credential store directories copied
        purpose: >-
          Catch bulk collection, where the vault files themselves are taken for
          offline processing rather than queried in place.
        rule: |
          <rule id="101488" level="12">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Microsoft\\\\(Credentials|Vault|Protect)|\\\\AppData\\\\(Local|Roaming)\\\\Microsoft\\\\Credentials)</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)\b(copy|xcopy|robocopy|Copy-Item|tar|Compress-Archive|7z)\b</field>
            <description>Credential store directories copied</description>
            <mitre><id>T1555.004</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: vault-enumerated
        reason: >-
          Depends on a 60d baseline comparison (host, user, command_line); a stateless
          rule holds no history.
      - case: enumeration-then-remote-auth
        reason: >-
          Depends on a 60d baseline comparison (host, user, remote_address); a
          stateless rule holds no history.

evidence:
  required:
    - id: vault_accessed
      name: Credential vault enumerated or copied
      description: >-
        Stored credentials were listed through the credential utilities or APIs, or the
        credential store directories were copied, exposing secrets the user had saved.
      source: process_creation
      field: command_line
      indicates: credential_material_capture

  supporting:
    - id: store_copied
      name: Credential directories taken rather than queried
      description: >-
        The vault files were copied or archived rather than enumerated in place, which is
        collection for offline processing.
      source: process_creation
      field: command_line
      indicates: collection_staging
    - id: remote_auth_followed
      name: Remote authentication followed the read
      description: >-
        The host connected to remote systems on administrative or remote-desktop ports
        after the vault was read, which is the harvested credential being used.
      source: network_connection
      field: remote_port
      indicates: lateral_movement_attempt
    - id: untrusted_reader
      name: Reader is a script host or user-writable binary
      description: >-
        The accessing process is an interpreter or an executable in a user-writable
        directory rather than an installed management or backup tool.
      source: process_creation
      field: image_path
      indicates: untrusted_execution_location
    - id: rare_for_user
      name: Access unprecedented for this user
      description: >-
        This user and host have not enumerated the credential store during the baseline
        window, unlike support staff who do so while troubleshooting.
      source: baseline
      field: UserName
      indicates: unusual_activity_for_host

  contradicting:
    - id: migration_tooling
      name: Backup or profile-migration tooling
      description: >-
        The reader is an approved backup or profile-migration product that handles the
        credential store as part of moving a user profile.
      source: process_creation
      field: image_path
      indicates: legitimate_enterprise_activity
    - id: support_troubleshooting
      name: Recorded credential troubleshooting
      description: >-
        An incident record covers a support engineer listing or clearing saved credentials
        while resolving an access fault.
      source: change_management
      field: UserName
      indicates: legitimate_administrative_action
    - id: application_own_credentials
      name: Application reading its own saved credentials
      description: >-
        The reader is an installed enterprise application retrieving credentials it saved
        itself, which it does on every start.
      source: process_creation
      field: image_path
      indicates: legitimate_application_component

  risk_logic:
    required:
      - vault_accessed

    supporting:
      any:
        - store_copied
        - remote_auth_followed
        - untrusted_reader
        - rare_for_user
      all:
        - remote_auth_followed
        - untrusted_reader

    contradicting:
      any:
        - migration_tooling
        - support_troubleshooting
        - application_own_credentials
      all: []

  verdict:
    low_risk_when:
      - vault_accessed
      - migration_tooling
      - support_troubleshooting
      - application_own_credentials
    suspicious_when:
      - vault_accessed
      - rare_for_user
    high_risk_when:
      - vault_accessed
      - store_copied
      - remote_auth_followed
      - untrusted_reader

  false_positive:
    - condition: A user or support engineer lists saved credentials while fixing a mapped drive.
      explanation: >-
        Listing stored credentials is the normal first step in diagnosing a failed drive
        mapping or remote desktop logon. It is interactive, tied to a named user, and
        usually accompanied by an incident record.
    - condition: Profile-migration tooling copies the credential store.
      explanation: >-
        Moving a user to a new machine requires carrying saved credentials, which
        reproduces the copy evidence. The acting process is an approved product operating
        across many users.
    - condition: An enterprise application reads credentials it saved itself.
      explanation: >-
        Applications that offer to remember a password read the vault on every start. The
        reader is installed software with a stable path present across the estate.
    - condition: A support script clears stale credentials during a password rotation.
      explanation: >-
        Rotation workflows enumerate and delete saved entries so users are re-prompted.
        These run under a support account across a defined population in a scheduled window.
