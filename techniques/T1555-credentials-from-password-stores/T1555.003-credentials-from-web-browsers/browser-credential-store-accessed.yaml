type: detection

id: hg-win-browser-credential-store-accessed-t1555-003
version: 1.0.0

info:
  name: Browser credential store accessed by another process
  description: >-
    Browsers hold the credentials people actually use — the SaaS consoles, the internal
    portals, the password manager's own vault sometimes — and the files holding them sit
    in predictable paths under the user profile. Reading them requires no privilege beyond
    the user's own, which makes this one of the cheapest post-compromise actions available
    and a common first stop after initial access. The observation that holds is simple:
    something other than the browser is reading the browser's credential database.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - browser-credentials
    - password-store
    - windows
  references:
    - https://attack.mitre.org/techniques/T1555/003
    - https://attack.mitre.org/detectionstrategies/DET0037
    - https://attack.mitre.org/techniques/T1555

mitre:
  tactics:
    - TA0006
  techniques:
    - T1555
  sub_techniques:
    - T1555.003
  detection_strategies:
    - DET0037
  analytics:
    - AN0105
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Security
    - WinEventLog:Sysmon
  data_components:
    - Process Creation
    - File Access
    - Process Access

hypothesis:
  statement: >-
    An adversary may read the credential databases a browser keeps under the user profile,
    harvesting saved passwords, cookies and session tokens without needing any privilege
    beyond the compromised user's own.
  attacker_behavior:
    - Copies Login Data, Web Data or the cookies database out of a browser profile directory.
    - References the local state file that holds the key protecting those databases.
    - Uses a script host or an ad hoc utility to read the files while the browser is closed.
    - Archives the collected files before moving them off the host.
  legitimate_behavior:
    - Backup and profile-migration tools copy browser profiles wholesale.
    - Enterprise browser management and sync clients read profile data.
    - Forensic and support tooling collects browser artefacts during an investigation.
    - The browser itself reads these files constantly.
  risk_indicator:
    - The reading process is not the browser that owns the profile.
    - The command references the credential database rather than the whole profile.
    - The local state or encryption key file is referenced alongside it.
    - The reader is a script host or a binary in a user-writable directory.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - sysmon_event1
        - windows_security
      fields:
        agent_id: agent.id
        host: win.system.computer
        user: win.eventdata.user
        image_name: win.eventdata.image
        image_path: win.eventdata.image
        command_line: win.eventdata.commandLine
        parent_process: win.eventdata.parentImage

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: credential-database-referenced
        name: Browser credential database referenced by a non-browser process
        purpose: >-
          Surface direct references to the specific files holding saved credentials,
          excluding the browsers that legitimately own them.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Login Data|Web Data|Cookies|logins\.json|key4\.db|cert9\.db|signons\.sqlite)/i
          | FileName!=/^(chrome|msedge|firefox|brave|opera|vivaldi|iexplore)\.exe$/i
          | groupBy([ComputerName, UserName, FileName, ImageFileName, ParentBaseFileName],
                    function=[count(as=accesses), collect([CommandLine, aid], limit=50)])
          | sort(accesses, order=asc)
        filters:
          include: []
          exclude:
            - "ImageFileName of approved backup, profile-migration and browser-management tooling"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - process
            - organization

      - id: local-state-key-referenced
        name: Browser encryption key file referenced
        purpose: >-
          Isolate references to the key material that makes the credential database
          readable, which has no purpose outside credential extraction.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Local State|os_crypt|encrypted_key|DPAPI|CryptUnprotectData)/i
          | CommandLine=/(Chrome|Edge|Brave|Opera|Vivaldi|Mozilla|User Data)/i
          | FileName!=/^(chrome|msedge|firefox|brave|opera|vivaldi)\.exe$/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=accesses), collect([CommandLine], limit=50)])
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: profile-copied-to-staging
        name: Browser profile files copied to a staging location
        purpose: >-
          Catch the collection step, where credential files are copied out of the profile
          for archiving or transfer.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(User Data|Mozilla\\Firefox\\Profiles)/i
          | CommandLine=/\b(copy|xcopy|robocopy|Copy-Item|move|Compress-Archive|tar|7z|rar)\b/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=events), collect([CommandLine], limit=50)])
        filters:
          include: []
          exclude:
            - "Approved profile-migration and backup tooling"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - command_line

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 101472
      group: huntgraph,windows,credential-access,browser-credentials
      lists: []

    cases:
      - id: local-state-key-referenced
        covers: local-state-key-referenced
        name: Browser encryption key file referenced
        purpose: >-
          Isolate references to the key material that makes the credential database
          readable, which has no purpose outside credential extraction.
        rule: |
          <rule id="101472" level="12">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Local State|os_crypt|encrypted_key|DPAPI|CryptUnprotectData)</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Chrome|Edge|Brave|Opera|Vivaldi|Mozilla|User Data)</field>
            <field name="win.eventdata.image" type="pcre2" negate="yes">(?i)^(chrome|msedge|firefox|brave|opera|vivaldi)\.exe$</field>
            <description>Browser encryption key file referenced</description>
            <mitre><id>T1555.003</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: credential-database-referenced
        reason: >-
          Depends on a 60d baseline comparison (host, user, process, organization); a
          stateless rule holds no history.
      - case: profile-copied-to-staging
        reason: >-
          Depends on a 60d baseline comparison (host, user, command_line); a stateless
          rule holds no history.

evidence:
  required:
    - id: credential_store_access
      name: Browser credential store referenced by another process
      description: >-
        A process that is not the owning browser referenced a browser credential database,
        cookie store or the key material protecting them.
      source: process_creation
      field: command_line
      indicates: credential_material_capture

  supporting:
    - id: key_material_referenced
      name: Encryption key file referenced
      description: >-
        The local state file or the decryption interface protecting the credential database
        was referenced, which serves no purpose other than making the store readable.
      source: process_creation
      field: command_line
      indicates: credential_decryption_attempt
    - id: staged_or_archived
      name: Profile files copied or archived
      description: >-
        Credential files were copied out of the profile or compressed, which is collection
        for transfer rather than reading in place.
      source: process_creation
      field: command_line
      indicates: collection_staging
    - id: untrusted_reader
      name: Reader is a script host or user-writable binary
      description: >-
        The accessing process is an interpreter or an executable in a user-writable
        directory rather than an installed management or backup tool.
      source: process_creation
      field: image_path
      indicates: untrusted_execution_location
    - id: rare_for_host
      name: Access unprecedented for this host
      description: >-
        No comparable access has been observed on this host during the baseline window,
        unlike the steady activity of a deployed profile-management product.
      source: baseline
      field: ComputerName
      indicates: unusual_activity_for_host

  contradicting:
    - id: backup_or_migration_tool
      name: Approved backup or profile-migration tool
      description: >-
        The reader is an approved backup, profile-migration or browser-management product
        that handles profile data by design.
      source: process_creation
      field: image_path
      indicates: legitimate_enterprise_activity
    - id: forensic_collection
      name: Sanctioned forensic collection
      description: >-
        The access belongs to a recorded investigation in which browser artefacts were
        deliberately collected.
      source: change_management
      field: ComputerName
      indicates: authorised_security_testing
    - id: fleetwide_tooling
      name: Same reader across the estate
      description: >-
        The same process reads profile data across many hosts on a regular cadence, which
        is deployed tooling rather than a targeted harvest.
      source: baseline
      field: ComputerName
      indicates: legitimate_enterprise_activity

  risk_logic:
    required:
      - credential_store_access

    supporting:
      any:
        - key_material_referenced
        - staged_or_archived
        - untrusted_reader
        - rare_for_host
      all:
        - key_material_referenced
        - untrusted_reader

    contradicting:
      any:
        - backup_or_migration_tool
        - forensic_collection
        - fleetwide_tooling
      all: []

  verdict:
    low_risk_when:
      - credential_store_access
      - backup_or_migration_tool
      - forensic_collection
      - fleetwide_tooling
    suspicious_when:
      - credential_store_access
      - rare_for_host
    high_risk_when:
      - credential_store_access
      - key_material_referenced
      - staged_or_archived
      - untrusted_reader

  false_positive:
    - condition: A backup or profile-migration tool copies browser profiles wholesale.
      explanation: >-
        Migration products copy the entire profile including credential databases, which
        reproduces both the required and the staging evidence. They are installed tooling
        acting across many hosts on a schedule.
    - condition: Enterprise browser management reads profile data.
      explanation: >-
        Managed browser configuration and sync legitimately touch profile files. The reader
        is a signed management component present throughout the estate.
    - condition: Forensic tooling collects browser artefacts during an investigation.
      explanation: >-
        Investigative collection deliberately harvests exactly these files. It is covered
        by an incident record and performed by a named responder.
    - condition: A user copies their own profile between machines.
      explanation: >-
        Self-service profile migration does happen, particularly during hardware refresh.
        It is interactive, involves the whole profile directory rather than the credential
        database specifically, and is tied to one named user.
