type: detection

id: hg-win-authentication-page-modified-to-capture-credentials-t1056-003
version: 1.0.0

info:
  name: Authentication page modified to capture submitted credentials
  description: >-
    An adversary who reaches a web server hosting a login page can alter it to record what
    users type before passing them on to the real authentication. Every user who signs in
    afterwards is compromised, the portal behaves normally so nobody reports a problem, and
    the credentials are valid for whatever else those accounts reach. The observable is not
    the theft but the change: server-side content in an authentication path being rewritten
    by something that is not the deployment pipeline.
  severity: critical
  author: huntgraph
  tags:
    - credential-access
    - collection
    - web-portal
    - input-capture
    - windows
  references:
    - https://attack.mitre.org/techniques/T1056/003
    - https://attack.mitre.org/detectionstrategies/DET0480
    - https://attack.mitre.org/techniques/T1056

mitre:
  tactics:
    - TA0009
    - TA0006
  techniques:
    - T1056
  sub_techniques:
    - T1056.003
  detection_strategies:
    - DET0480
  analytics:
    - AN1321
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - File Creation
    - Network Traffic Content

hypothesis:
  statement: >-
    An adversary with access to a web server may modify an authentication page or its
    handler so that submitted credentials are recorded before being passed to the real
    login process, compromising every user who signs in afterwards without the portal
    appearing to malfunction.
  attacker_behavior:
    - Rewrites a login page or its server-side handler to log submitted values.
    - Adds a script include that posts credentials to a collection endpoint.
    - Writes captured values to a file inside or near the web root for later retrieval.
    - Makes the change outside any deployment, so the application version is unchanged.
  legitimate_behavior:
    - Deployment pipelines publish authentication pages during releases.
    - Developers edit login pages while working on the application.
    - Configuration management updates web content across a farm.
    - Application frameworks regenerate compiled page artefacts at runtime.
  risk_indicator:
    - The authentication page was written by something other than the deployment pipeline.
    - A collection file appears in or near the web root.
    - The change affects one server rather than the whole farm.
    - The writing process is a web worker or an interactive shell on the server.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: file_creation
      event_types:
        - NewScriptWritten
        - PeFileWritten
      fields:
        - aid
        - ComputerName
        - TargetFileName
        - ContextProcessId
    - source: process_creation
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        - aid
        - ComputerName
        - UserName
        - FileName
        - CommandLine
        - ParentBaseFileName

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: authentication-page-rewritten
        name: Authentication page or handler rewritten
        purpose: >-
          Surface changes to the specific pages that accept credentials, which are a small
          and identifiable subset of web content.
        query: |
          #event_simpleName=/^(NewScriptWritten|PeFileWritten)$/
          | TargetFileName=/\\(inetpub|wwwroot|htdocs|webapps|www|public_html)\\/i
          | TargetFileName=/(login|logon|signin|sign-in|auth|authenticate|sso|password)[^\\]*\.(aspx?|ashx|asmx|php\d?|jsp|jspx|cshtml|js|html?)$/i
          | groupBy([ComputerName, TargetFileName, ContextProcessId],
                    function=[count(as=writes)])
          | sort(writes, order=asc)
        filters:
          include: []
          exclude:
            - "ContextProcessId of the approved deployment pipeline agent"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - path
            - organization

      - id: collection-file-in-web-root
        name: Collection file written inside the web root
        purpose: >-
          Catch the store the capture writes into, which is often the only artefact if the
          page edit itself is subtle.
        query: |
          #event_simpleName=/^(NewScriptWritten|PeFileWritten)$/
          | TargetFileName=/\\(inetpub|wwwroot|htdocs|webapps|www|public_html)\\/i
          | TargetFileName=/\.(log|txt|dat|csv|tmp|json)$/i
          | groupBy([ComputerName, TargetFileName, ContextProcessId],
                    function=[count(as=writes)])
          | sort(writes, order=asc)
        filters:
          include: []
          exclude:
            - "Application logging directories documented for the hosted application"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - path
            - organization

      - id: content-edited-from-a-shell
        name: Web content edited from a shell on the server
        purpose: >-
          Identify content changes made interactively or through a web worker rather than
          by a release, which is how an unrecorded edit reaches production.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/\\(inetpub|wwwroot|htdocs|webapps|public_html)\\/i
          | CommandLine=/\b(copy|xcopy|Copy-Item|Set-Content|Add-Content|echo|>|Move-Item|sed)\b/i
          | ParentBaseFileName=/^(w3wp|httpd|nginx|tomcat\d*|java|php-cgi|cmd|powershell|pwsh|wsmprovhost|winrshost)\.exe$/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=edits), collect([CommandLine], limit=5)])
        filters:
          include: []
          exclude:
            - "Approved deployment automation publishing content"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - command_line

evidence:
  required:
    - id: auth_content_modified
      name: Authentication content modified outside deployment
      description: >-
        A login page, its handler, or content in the authentication path was written by a
        process other than the deployment pipeline, changing what happens to submitted
        credentials.
      source: file_creation
      field: TargetFileName
      indicates: credential_material_capture

  supporting:
    - id: collection_file_present
      name: Collection file inside the web root
      description: >-
        A text, log or data file appeared in a web-accessible directory outside the
        application's documented logging paths, which is where captured values are stored.
      source: file_creation
      field: TargetFileName
      indicates: collection_staging
    - id: shell_or_worker_editor
      name: Edited from a shell or the web worker
      description: >-
        The change was made through an interactive shell on the server or by the web worker
        process itself, rather than by a release.
      source: process_creation
      field: ParentBaseFileName
      indicates: abnormal_execution_chain
    - id: single_server_change
      name: Change confined to one server
      description: >-
        The modification appears on one host rather than across the farm, which no
        deployment produces.
      source: baseline
      field: ComputerName
      indicates: unusual_activity_for_host
    - id: outside_release_window
      name: Change outside any release
      description: >-
        No deployment activity accompanies the change during the baseline window, so the
        content moved without a release behind it.
      source: baseline
      field: TargetFileName
      indicates: unauthorised_content_change

  contradicting:
    - id: deployment_pipeline
      name: Approved deployment publishing content
      description: >-
        The write was performed by the deployment agent publishing application content
        during a release.
      source: file_creation
      field: ContextProcessId
      indicates: legitimate_enterprise_activity
    - id: framework_regeneration
      name: Framework regenerating compiled artefacts
      description: >-
        The files are compiled page artefacts the application framework regenerates at
        runtime rather than source content.
      source: file_creation
      field: TargetFileName
      indicates: legitimate_application_component
    - id: development_server
      name: Development or staging server
      description: >-
        The host is a development or staging system where developers edit application
        content directly.
      source: asset_inventory
      field: ComputerName
      indicates: expected_developer_activity

  risk_logic:
    required:
      - auth_content_modified

    supporting:
      any:
        - collection_file_present
        - shell_or_worker_editor
        - single_server_change
        - outside_release_window
      all:
        - shell_or_worker_editor
        - outside_release_window

    contradicting:
      any:
        - deployment_pipeline
        - framework_regeneration
        - development_server
      all: []

  verdict:
    low_risk_when:
      - auth_content_modified
      - deployment_pipeline
      - framework_regeneration
      - development_server
    suspicious_when:
      - auth_content_modified
      - single_server_change
    high_risk_when:
      - auth_content_modified
      - collection_file_present
      - shell_or_worker_editor
      - outside_release_window

  false_positive:
    - condition: A deployment pipeline publishes authentication pages during a release.
      explanation: >-
        Releases rewrite login pages legitimately and frequently. The deployment agent is
        the writing process and the change lands across the whole farm within a release
        window.
    - condition: A developer edits a login page on a development server.
      explanation: >-
        Direct editing is normal on non-production systems, reproducing the shell-editor
        evidence. Host role is the discriminator.
    - condition: An application framework regenerates compiled page artefacts.
      explanation: >-
        Some frameworks compile pages on first request, writing into the web root at
        runtime. These are generated artefacts rather than source files and recur on every
        application start.
    - condition: Configuration management updates web content across a farm.
      explanation: >-
        Managed content changes are written programmatically outside the deployment
        pipeline, which matches the required evidence. They appear identically across every
        server in the farm.
