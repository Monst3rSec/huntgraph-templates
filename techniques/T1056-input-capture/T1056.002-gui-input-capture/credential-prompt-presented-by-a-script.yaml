type: detection

id: hg-win-credential-prompt-presented-by-a-script-t1056-002
version: 1.0.0

info:
  name: Credential prompt presented by a script rather than the operating system
  description: >-
    Users are trained to type their password when Windows asks, and a script can ask in a
    way that looks near-identical. The prompt costs an adversary nothing, needs no
    elevation, and yields a plaintext credential that no amount of memory protection would
    have given them — the user simply hands it over. The mechanisms are small and specific:
    the credential dialog cmdlet, the credential UI API, or a forms dialog built to
    resemble one, all invoked from a script rather than by an application that has a reason
    to authenticate.
  severity: high
  author: huntgraph
  tags:
    - credential-access
    - collection
    - input-capture
    - social-engineering
    - windows
  references:
    - https://attack.mitre.org/techniques/T1056/002
    - https://attack.mitre.org/detectionstrategies/DET0521
    - https://attack.mitre.org/techniques/T1056

mitre:
  tactics:
    - TA0009
    - TA0006
  techniques:
    - T1056
  sub_techniques:
    - T1056.002
  detection_strategies:
    - DET0521
  analytics:
    - AN1440
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
    - WinEventLog:PowerShell
  data_components:
    - Process Creation
    - Command Execution

hypothesis:
  statement: >-
    An adversary may present a credential prompt from a script so that the user types their
    password into an attacker-controlled dialog, obtaining a plaintext credential without
    touching any credential store or process memory.
  attacker_behavior:
    - Calls the credential dialog cmdlet or the credential UI API from a script.
    - Builds a forms dialog styled to resemble the operating system's own prompt.
    - Loops the prompt until the user supplies something that validates.
    - Writes the captured credential to a file or sends it onward immediately.
  legitimate_behavior:
    - Administrative scripts prompt for alternate credentials before connecting to a resource.
    - Deployment and management tooling asks for credentials interactively.
    - Applications prompt through the operating system's credential interface by design.
    - Support scripts request an administrator password to complete a task.
  risk_indicator:
    - The prompting script was launched by a document handler or archive tool.
    - The captured value is written to a file or sent over the network.
    - The prompt is presented in a loop or repeated until accepted.
    - The pattern is unprecedented for the host and user.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - sysmon_event1
        - windows_security
      fields:
        agent_id: agent.id
        host: win.system.computer
        user: win.eventdata.user
        image_name: win.eventdata.image
        command_line: win.eventdata.commandLine
        parent_process: win.eventdata.parentImage

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: credential-dialog-from-script
        name: Credential dialog invoked from a script
        purpose: >-
          Surface the prompting mechanisms themselves, which are specific enough to match
          directly and rare enough outside administrative scripting.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Get-Credential|PromptForCredential|CredUIPromptForCredentials|CredUIPromptForWindowsCredentials|System\.Windows\.Forms.*Password|PasswordChar)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=prompts), collect([CommandLine], limit=5)])
          | sort(prompts, order=asc)
        filters:
          include: []
          exclude:
            - "Administrative scripting hosts where credential prompting is routine"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - command_line

      - id: prompt-from-delivery-parent
        name: Credential prompt launched by a delivery application
        purpose: >-
          Establish that the prompt followed user-opened content, which is the phishing
          shape rather than an administrator running a script.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Get-Credential|PromptForCredential|CredUIPrompt)/i
          | ParentBaseFileName=/^(winword|excel|powerpnt|outlook|acrord32|acrobat|chrome|msedge|firefox|7zfm|winrar|mshta|wscript|cscript)\.exe$/i
          | groupBy([ComputerName, UserName, ParentBaseFileName],
                    function=[count(as=prompts), collect([CommandLine], limit=5)])
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

      - id: captured-value-persisted
        name: Prompted credential written out or sent onward
        purpose: >-
          Identify the collection step, which distinguishes a script that uses a credential
          from one that harvests it.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Get-Credential|PromptForCredential|CredUIPrompt)/i
          | CommandLine=/(Out-File|Set-Content|Export-Clixml|>\s*[A-Za-z]:\\|Invoke-WebRequest|Invoke-RestMethod|UploadString|Send-MailMessage)/i
          | groupBy([ComputerName, UserName, ParentBaseFileName],
                    function=[count(as=events), collect([CommandLine], limit=5)])
        filters:
          include: []
          exclude: []
        baseline:
          required: false
          window: null
          compare: []

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 100144
      group: huntgraph,windows,credential-access,collection
      lists: []

    cases:
      - id: prompt-from-delivery-parent
        covers: prompt-from-delivery-parent
        name: Credential prompt launched by a delivery application
        purpose: >-
          Establish that the prompt followed user-opened content, which is the
          phishing shape rather than an administrator running a script.
        rule: |
          <rule id="100144" level="12">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Get-Credential|PromptForCredential|CredUIPrompt)</field>
            <field name="win.eventdata.parentImage" type="pcre2">(?i)^(winword|excel|powerpnt|outlook|acrord32|acrobat|chrome|msedge|firefox|7zfm|winrar|mshta|wscript|cscript)\.exe$</field>
            <description>Credential prompt launched by a delivery application</description>
            <mitre><id>T1056.002</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

      - id: captured-value-persisted
        covers: captured-value-persisted
        name: Prompted credential written out or sent onward
        purpose: >-
          Identify the collection step, which distinguishes a script that uses a
          credential from one that harvests it.
        rule: |
          <rule id="100145" level="12">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Get-Credential|PromptForCredential|CredUIPrompt)</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Out-File|Set-Content|Export-Clixml|&gt;\s*[A-Za-z]:\\|Invoke-WebRequest|Invoke-RestMethod|UploadString|Send-MailMessage)</field>
            <description>Prompted credential written out or sent onward</description>
            <mitre><id>T1056.002</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: credential-dialog-from-script
        reason: >-
          Depends on a 60d baseline comparison (host, user, command_line); a stateless
          rule holds no history.

evidence:
  required:
    - id: script_credential_prompt
      name: Credential prompt raised from a script
      description: >-
        A script invoked a credential dialog or built a password input form, asking the
        user for a credential rather than obtaining one from a store or a session.
      source: process_creation
      field: command_line
      indicates: user_supplied_credential_capture

  supporting:
    - id: delivery_parent
      name: Prompt launched by a delivery application
      description: >-
        The prompting script was started by a document handler, archive utility, mail
        client or browser, placing the prompt immediately after user-opened content.
      source: process_creation
      field: parent_process
      indicates: abnormal_execution_chain
    - id: value_persisted
      name: Captured value written out or transmitted
      description: >-
        The prompted credential is written to a file or sent over the network rather than
        used in place, which is harvesting rather than authentication.
      source: process_creation
      field: command_line
      indicates: collection_staging
    - id: forms_dialog_used
      name: Custom dialog rather than the system interface
      description: >-
        The prompt is built from forms components with a masked input rather than raised
        through the operating system's credential interface, which is imitation rather than
        use.
      source: process_creation
      field: command_line
      indicates: user_facing_deception
    - id: rare_for_user
      name: Unprecedented for this host and user
      description: >-
        No comparable prompting has occurred for this host or user during the baseline
        window, unlike administrative scripting where it is routine.
      source: baseline
      field: UserName
      indicates: unusual_activity_for_host

  contradicting:
    - id: administrative_scripting
      name: Administrative script requesting alternate credentials
      description: >-
        The prompt belongs to an administrative script that legitimately asks for alternate
        credentials before connecting to a resource.
      source: asset_inventory
      field: ComputerName
      indicates: legitimate_administrative_action
    - id: management_tooling
      name: Deployment or management tooling
      description: >-
        The prompt is raised by an approved management or deployment product that asks for
        credentials interactively as part of its workflow.
      source: process_creation
      field: image_name
      indicates: legitimate_enterprise_activity
    - id: recurring_for_user
      name: Routine prompting for this user
      description: >-
        This user encounters the same prompt regularly across the baseline window, which
        reads as an established workflow rather than a lure.
      source: baseline
      field: UserName
      indicates: legitimate_enterprise_activity

  risk_logic:
    required:
      - script_credential_prompt

    supporting:
      any:
        - delivery_parent
        - value_persisted
        - forms_dialog_used
        - rare_for_user
      all:
        - delivery_parent
        - value_persisted

    contradicting:
      any:
        - administrative_scripting
        - management_tooling
        - recurring_for_user
      all: []

  verdict:
    low_risk_when:
      - script_credential_prompt
      - administrative_scripting
      - management_tooling
      - recurring_for_user
    suspicious_when:
      - script_credential_prompt
      - rare_for_user
    high_risk_when:
      - script_credential_prompt
      - delivery_parent
      - value_persisted
      - forms_dialog_used

  false_positive:
    - condition: An administrative script prompts for alternate credentials.
      explanation: >-
        Asking for a credential before connecting to a resource is normal scripting
        practice and uses the same cmdlet. It occurs on administrative hosts under accounts
        with a history of such work.
    - condition: Deployment or management tooling asks for credentials interactively.
      explanation: >-
        Management products prompt as part of their workflow. The prompting process is a
        recognisable product rather than an ad hoc script.
    - condition: A support script requests an administrator password to complete a task.
      explanation: >-
        Guided support frequently needs elevation credentials. These prompts are tied to an
        incident record and the value is used immediately rather than written out.
    - condition: A developer tests a credential dialog while building an application.
      explanation: >-
        Building authentication flows involves raising these prompts repeatedly. This
        clusters on engineering hosts under the developer's own account.
