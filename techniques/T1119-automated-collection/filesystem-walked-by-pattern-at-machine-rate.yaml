type: detection

id: hg-win-filesystem-walked-by-pattern-at-machine-rate-t1119

version: 1.0.0

info:
  name: Filesystem walked by pattern at machine rate
  description: >-
    Automated Collection is not about which data is taken but about how. Every other file in
    this group asks what was read or where it was put; this one asks whether a human could
    plausibly have done it. A person opens files one at a time, chooses them by what they
    contain and gets bored. A collector is given a pattern and a root, walks everything
    underneath, and finishes a thousand files in the time a person opens three. That
    difference is measurable, and rate and breadth are the discriminators this file is built
    on, because the individual commands a collector issues are the same commands an
    administrator issues. There are three shapes worth hunting and they are all here:
    enumeration, extension filtering and a copy or write compressed into one instruction,
    which is a script rather than a session; the same instruction recurring far more often
    than any person would type it; and a collection pipeline installed on a schedule, which
    is MITRE's own phrasing of collecting at set intervals. Where the mechanism is a
    scheduled task the scheduling behaviour itself belongs to T1053, where the data gathered
    lands in one folder that is T1074.001, and where it is compressed that is T1560.001.
  severity: medium
  author: huntgraph
  tags:
    - collection
    - automated-collection
    - scripted-collection
    - windows
  references:
    - https://attack.mitre.org/techniques/T1119
    - https://attack.mitre.org/detectionstrategies/DET0186
    - https://attack.mitre.org/techniques/T1074/001
    - https://attack.mitre.org/techniques/T1560/001
    - https://attack.mitre.org/techniques/T1053

mitre:
  tactics:
    - TA0009
  techniques:
    - T1119
  sub_techniques: []
  detection_strategies:
    - DET0186
  analytics:
    - AN0531
  platforms:
    - Windows
  data_sources:
    - WinEventLog:Sysmon
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary may collect data by script rather than by hand, giving a tool a file
    pattern and a starting directory and letting it walk the filesystem, so that the volume
    and the rate of what is gathered are set by the machine and exceed anything a person
    working through the same files could produce.
  attacker_behavior:
    - Combines a recursive enumerator, an extension filter and a copy in one instruction.
    - Iterates over a matched file set with an explicit loop construct.
    - Repeats the same collection command far more often than a person would type it.
    - Installs a collection pipeline on a schedule so it runs at set intervals unattended.
    - Runs the collector from a parent that has no relationship with document handling.
  legitimate_behavior:
    - Backup, archiving and imaging agents walk the filesystem by pattern continuously.
    - Search indexers and classification scanners are built to do exactly this.
    - Inventory, licensing and compliance scripts sweep for file types on a schedule.
    - Developers write file-processing loops over their own project trees.
    - Log rotation and support-bundle jobs gather files by pattern every day.
  risk_indicator:
    - The enumeration, the filter and the copy appear in one command rather than a session.
    - The rate or repetition is far outside what an interactive user produces.
    - The pattern targets business documents rather than logs, packages or source code.
    - The parent is a mail client, browser, macro host, archive tool or remote-execution service.
    - Neither the host nor the account has baseline history of the command.

requires:
  platforms:
    - windows
  connectors:
    - crowdstrike-ngsiem
    - wazuh
  logs:
    - source: process_creation
      connector: crowdstrike-ngsiem
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        agent_id: aid
        host: ComputerName
        user: UserName
        image_name: FileName
        image_path: ImageFileName
        command_line: CommandLine
        parent_process: ParentBaseFileName
    - source: process_creation
      connector: wazuh
      event_types:
        - sysmon_event1
        - windows_security
      fields:
        agent_id: agent.id
        host: win.system.computer
        user: win.eventdata.user
        image_name: win.eventdata.image
        image_path: win.eventdata.image
        command_line: win.eventdata.commandLine
        parent_process: win.eventdata.parentImage

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: enumerate-filter-and-copy-in-one-instruction
        name: Enumeration, extension filter and copy compressed into one instruction
        purpose: >-
          Hunt the mechanism rather than the data. A person browsing performs these three
          steps as three separate acts across a session; finding all of them inside a single
          command line means the decision about which files to take was made by a pattern in
          advance, which is the definition of automated collection.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Get-ChildItem|\bgci\b|-Recurse|\bdir\b[^|]{0,40}\/s|\bforfiles\b|\bwhere\b\s+\/r|\brobocopy\b)/i
          | CommandLine=/(-Include|-Filter|\*\.(docx?|xlsx?|pptx?|pdf|csv|msg|eml|pst|txt|rtf)|\.(docx?|xlsx?|pptx?|pdf|csv|msg|eml|pst)\b)/i
          | CommandLine=/(Copy-Item|\bcopy\b|\bxcopy\b|Compress-Archive|Out-File|Set-Content|Get-Content|\bmove\b)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=runs), collect([CommandLine], limit=8)])
          | sort(runs, order=asc)
        filters:
          include: []
          exclude:
            - "Backup, archiving, indexing and classification agents"
            - "Inventory, licensing and compliance scanners run from a management server"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: iteration-construct-driving-file-collection
        name: Explicit loop iterating over a matched document set
        purpose: >-
          Catch the collector that spreads its work over several commands instead of one. A
          loop construct wrapped around a document pattern is a machine working through a
          list, and it is the shape a hand-written collection script takes when the operator
          wants to do something to each file rather than simply copy it.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(ForEach-Object|\bforeach\b|\|\s*%\s*\{|\bfor\b\s+\/[rfd]\b|\bwhile\b\s+read\b|\.GetFiles\(|EnumerateFiles)/i
          | CommandLine=/\*?\.(docx?|xlsx?|pptx?|pdf|csv|msg|eml|pst|ost|mdb|accdb|sqlite3?)\b/i
          | CommandLine=/(Copy-Item|\bcopy\b|Get-Content|\[Convert\]|Compress-Archive|Out-File|Add-Content|ReadAllBytes)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=runs), collect([CommandLine], limit=8)])
          | sort(runs, order=asc)
        filters:
          include: []
          exclude:
            - "Developer and data-analysis workstations where file-processing loops are ordinary work"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: collection-command-repeating-at-machine-rate
        name: Collection command repeating far above interactive rate
        purpose: >-
          Make the rate itself the evidence. Counting how often one collection command shape
          runs on a host, and how many distinct forms of it appear, separates a script
          working through a tree from a person who ran something similar once. Sorting by
          volume rather than rarity is deliberate here: this is the one case in the file
          where the high end of the distribution is the interesting end.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(Get-ChildItem|-Recurse|\bdir\b[^|]{0,40}\/s|\bforfiles\b|Copy-Item|\bcopy\b|\bxcopy\b|Get-Content)/i
          | CommandLine=/\.(docx?|xlsx?|pptx?|pdf|csv|msg|eml|pst|ost)\b/i
          | groupBy([ComputerName, UserName, ParentBaseFileName],
                    function=[count(as=executions),
                              count(CommandLine, distinct=true, as=distinct_commands),
                              collect([FileName, CommandLine], limit=15)])
          | executions>=50
          | sort(executions, order=desc)
        filters:
          include: []
          exclude:
            - "Backup and indexing service processes, whose rate is always higher than an adversary's"
            - "Log rotation and support-bundle jobs that gather by pattern every day"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - organization

      - id: collection-pipeline-installed-on-a-schedule
        name: Collection pipeline registered to run at set intervals
        purpose: >-
          Cover MITRE's own phrasing of collecting at specific time intervals. The scheduling
          mechanism belongs to T1053; what matters here is the payload, because a scheduled
          task whose command line is itself a document-gathering pipeline is automated
          collection made persistent rather than a maintenance job.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(schtasks[^|]{0,20}\/create|Register-ScheduledTask|New-ScheduledTaskAction|\bat\b\s+\d{1,2}:\d{2})/i
          | CommandLine=/(Get-ChildItem|-Recurse|\bdir\b[^|]{0,40}\/s|\bforfiles\b|Copy-Item|\bcopy\b|\bxcopy\b|\brobocopy\b|Compress-Archive)/i
          | CommandLine=/\.(docx?|xlsx?|pptx?|pdf|csv|msg|eml|pst|ost)\b|\*\.(docx?|xlsx?|pdf|csv)/i
          | groupBy([ComputerName, UserName, FileName, ParentBaseFileName],
                    function=[count(as=registrations), collect([CommandLine], limit=8)])
          | sort(registrations, order=asc)
        filters:
          include: []
          exclude:
            - "Configuration management platforms that register reporting and inventory tasks"
        baseline:
          required: true
          window: 90d
          compare:
            - host
            - user
            - command_line

      - id: collector-started-by-an-unexpected-parent
        name: Collection pipeline started by a process with no document role
        purpose: >-
          Give the actor leg, which is what carries the cases whose commands are otherwise
          ordinary. A gathering pipeline whose parent is a mail client, a browser, a macro
          host, an archive utility or a remote-execution service did not come from an
          administrator at a console.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | ParentBaseFileName=/^(winword\.exe|excel\.exe|powerpnt\.exe|outlook\.exe|chrome\.exe|msedge\.exe|firefox\.exe|7z(FM|G)?\.exe|winrar\.exe|mshta\.exe|wscript\.exe|cscript\.exe|wmiprvse\.exe|wsmprovhost\.exe|psexesvc\.exe)$/i
          | CommandLine=/(Get-ChildItem|-Recurse|\bdir\b[^|]{0,40}\/s|\bforfiles\b|ForEach-Object|\bfor\b\s+\/[rfd]\b)/i
          | CommandLine=/(Copy-Item|\bcopy\b|\bxcopy\b|\brobocopy\b|Compress-Archive|Get-Content|Out-File)/i
          | groupBy([ComputerName, UserName, ParentBaseFileName, FileName],
                    function=[count(as=runs), collect([CommandLine], limit=8)])
          | sort(runs, order=asc)
        filters:
          include: []
          exclude:
            - "Approved remote administration platforms that invoke file operations through WMI or WinRM"
        baseline:
          required: false
          window: null
          compare: []

  - platform: wazuh
    language: wazuh-rules
    ruleset:
      base_id: 100608
      group: huntgraph,windows,collection,automated-collection
      lists: []

    cases:
      - id: collector-started-by-an-unexpected-parent
        covers: collector-started-by-an-unexpected-parent
        name: Collection pipeline started by a process with no document role
        purpose: >-
          Give the actor leg, which is what carries the cases whose commands are
          otherwise ordinary. A gathering pipeline whose parent is a mail client, a
          browser, a macro host, an archive utility or a remote-execution service did
          not come from an administrator at a console.
        rule: |
          <rule id="100608" level="8">
            <if_group>sysmon_event1</if_group>
            <field name="win.eventdata.parentImage" type="pcre2">(?i)^(winword\.exe|excel\.exe|powerpnt\.exe|outlook\.exe|chrome\.exe|msedge\.exe|firefox\.exe|7z(FM|G)?\.exe|winrar\.exe|mshta\.exe|wscript\.exe|cscript\.exe|wmiprvse\.exe|wsmprovhost\.exe|psexesvc\.exe)$</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Get-ChildItem|-Recurse|\bdir\b[^|]{0,40}\/s|\bforfiles\b|ForEach-Object|\bfor\b\s+\/[rfd]\b)</field>
            <field name="win.eventdata.commandLine" type="pcre2">(?i)(Copy-Item|\bcopy\b|\bxcopy\b|\brobocopy\b|Compress-Archive|Get-Content|Out-File)</field>
            <description>Collection pipeline started by a process with no document role</description>
            <mitre><id>T1119</id></mitre>
          </rule>
        correlation:
          frequency: null
          timeframe: null
          same_field: null
        limitations:
          - Derived from the CQL filter chain; the aggregation in the original case
            is not represented.

    not_portable:
      - case: enumerate-filter-and-copy-in-one-instruction
        reason: >-
          Depends on a 90d baseline comparison (host, user, command_line); a stateless
          rule holds no history.
      - case: iteration-construct-driving-file-collection
        reason: >-
          Depends on a 90d baseline comparison (host, user, command_line); a stateless
          rule holds no history.
      - case: collection-command-repeating-at-machine-rate
        reason: >-
          Depends on a 90d baseline comparison (host, user, organization); a stateless
          rule holds no history.
      - case: collection-pipeline-installed-on-a-schedule
        reason: >-
          Depends on a 90d baseline comparison (host, user, command_line); a stateless
          rule holds no history.

evidence:
  required:
    - id: patterned_file_collection
      name: Files gathered by pattern rather than by choice
      description: >-
        A single instruction combined a recursive enumerator, a file-type pattern and a copy
        or read, or wrapped a loop around a matched document set, which means the selection
        was made by a rule in advance rather than by a person looking at the files.
      source: process_creation
      field: command_line
      indicates: collection_staging

  supporting:
    - id: machine_rate_repetition
      name: Repetition far above an interactive rate
      description: >-
        The collection command shape ran on the host far more often than a person could
        plausibly issue it, or in several distinct forms in quick succession, which is a
        script working through a tree.
      source: process_creation
      field: command_line
      indicates: non_standard_automation
    - id: scheduled_collection
      name: Collection pipeline registered to run unattended
      description: >-
        The gathering pipeline was installed as a scheduled task or timed job, making the
        collection recur at set intervals without anyone present.
      source: process_creation
      field: image_name
      indicates: scheduled_automation_job
    - id: unexpected_parent
      name: Started by a process with no document-handling role
      description: >-
        The collector was launched by a mail client, browser, macro host, archive utility or
        remote-execution service rather than by a shell an administrator is working in.
      source: process_creation
      field: parent_process
      indicates: abnormal_execution_chain
    - id: no_baseline_for_command
      name: No history of this command on the host or account
      description: >-
        The command shape has no baseline history for this host or user, so it is not part of
        an established maintenance or reporting routine.
      source: baseline
      field: CommandLine
      indicates: unusual_activity_for_host

  contradicting:
    - id: backup_or_indexing_agent
      name: Backup, indexing or classification agent
      description: >-
        The acting process belongs to an approved backup, archiving, indexing or
        classification product, which walks the filesystem by pattern as its entire function.
      source: process_creation
      field: image_path
      indicates: legitimate_enterprise_activity
    - id: inventory_or_compliance_sweep
      name: Inventory, licensing or compliance sweep
      description: >-
        The pattern search is a scheduled inventory, licensing or compliance job run from a
        management platform against the whole estate.
      source: process_creation
      field: parent_process
      indicates: scheduled_automation_job
    - id: developer_processing_own_files
      name: Developer or analyst processing their own tree
      description: >-
        The loop operates inside the account's own project or working directory on a host
        whose role makes file-processing scripts ordinary work.
      source: asset_inventory
      field: ComputerName
      indicates: expected_developer_activity

  risk_logic:
    required:
      - patterned_file_collection

    supporting:
      any:
        - machine_rate_repetition
        - scheduled_collection
        - unexpected_parent
        - no_baseline_for_command
      all:
        - machine_rate_repetition
        - unexpected_parent

    contradicting:
      any:
        - backup_or_indexing_agent
        - inventory_or_compliance_sweep
        - developer_processing_own_files
      all: []

  verdict:
    low_risk_when:
      - patterned_file_collection
      - backup_or_indexing_agent
      - inventory_or_compliance_sweep
      - developer_processing_own_files
    suspicious_when:
      - patterned_file_collection
      - no_baseline_for_command
    high_risk_when:
      - patterned_file_collection
      - machine_rate_repetition
      - unexpected_parent
      - scheduled_collection

  false_positive:
    - condition: A backup or archiving agent walks the filesystem by pattern.
      explanation: >-
        This is automated collection performed for a good reason, and it produces higher
        rates than any adversary will. It is separable by the acting image, a service
        identity, a fixed schedule, and the fact that the same behaviour appears on every
        protected host rather than on one.
    - condition: The search indexer or a classification scanner sweeps for document types.
      explanation: >-
        Indexers and classifiers exist to enumerate and read documents by pattern
        continuously, which satisfies both the mechanism and the rate evidence. They run as
        long-lived services and never appear under an interactive parent.
    - condition: An inventory, licensing or compliance script sweeps for file types on a schedule.
      explanation: >-
        Compliance sweeps reproduce the scheduled-collection evidence precisely, since they
        are a gathering pipeline registered to run at intervals. They are pushed by a
        management platform, they run estate-wide, and their output goes to a reporting
        endpoint rather than a local scratch directory.
    - condition: A developer or analyst runs a file-processing loop over a project tree.
      explanation: >-
        Loops over matched file sets are ordinary work on engineering and analytical
        endpoints, which is why the loop case alone carries little weight there. The tree is
        the account's own, the file types are source and data rather than documents and mail,
        and the host role makes it expected.
    - condition: Log rotation or a support-bundle job gathers files by pattern every day.
      explanation: >-
        Rotation and diagnostic collection enumerate, filter and copy in one instruction,
        matching the required evidence exactly. The patterns target logs and configuration
        rather than business documents, and the schedule has long baseline history.
