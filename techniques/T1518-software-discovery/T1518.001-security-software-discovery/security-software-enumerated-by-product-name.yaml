type: detection

id: hg-any-security-software-enumerated-by-product-name-t1518-001
version: 1.0.0

info:
  name: Security software enumerated by product name before proceeding
  description: >-
    Generic service and process enumeration is noise. Enumeration that names products is
    not. An administrator listing services does not type `csagent`, `SentinelAgent`,
    `ds_agent` and `ekrn` into the same command line, and nothing in an ordinary workday
    asks the operating system through `root\SecurityCenter2` which antivirus products are
    registered, or greps `launchctl list` for Little Snitch. That is somebody establishing
    what is watching before deciding whether to continue, which is the one question in
    Discovery whose answer changes the attacker's plan rather than merely informing it. The
    strength of this hunt comes from breadth: a support script names the one agent it is
    troubleshooting, while an operator sweeps a vendor list because they do not yet know
    what is installed. The chain that follows — discovery, then an attempt to stop,
    uninstall or exclude the agent that was found — is covered as escalation context here;
    the tampering itself belongs to the Defense Impairment templates and is not restated.
  severity: medium
  author: huntgraph
  tags:
    - discovery
    - security-software-discovery
    - edr-enumeration
    - defence-evasion-preparation
    - windows
    - linux
    - macos
  references:
    - https://attack.mitre.org/techniques/T1518/001
    - https://attack.mitre.org/detectionstrategies/DET0016
    - https://attack.mitre.org/techniques/T1518

mitre:
  tactics:
    - TA0007
  techniques:
    - T1518
  sub_techniques:
    - T1518.001
  detection_strategies:
    - DET0016
  analytics:
    - AN0048
    - AN0049
    - AN0050
  platforms:
    - Windows
    - Linux
    - macOS
  data_sources:
    - WinEventLog:Security
    - auditd:SYSCALL
  data_components:
    - Process Creation

hypothesis:
  statement: >-
    An adversary with execution on a host may enumerate the antivirus, endpoint detection,
    firewall and monitoring agents installed on it by product name, in order to decide
    whether to proceed, which techniques to avoid, and which agent to disable or exclude
    before the next stage runs.
  attacker_behavior:
    - Names several security vendors in one service, process or registry query.
    - Asks the operating system which antivirus and firewall products are registered.
    - Probes the installation directories and registry keys belonging to endpoint agents.
    - Lists loaded kernel extensions or system extensions to find monitoring components.
    - Attempts to stop, uninstall or exclude an agent shortly after confirming it is present.
  legitimate_behavior:
    - Compliance and inventory tooling verifies that the approved agent is installed and healthy.
    - The endpoint agent's own installer and updater query its services and registry keys.
    - Support engineers check the state of one named agent while investigating a fault.
    - Migration projects enumerate a competitor's product before replacing it.
    - Build and imaging pipelines confirm agent presence before releasing a host.
  risk_indicator:
    - Several distinct security vendors are named in a single command or lineage.
    - The query targets the antivirus registration interface rather than a specific known agent.
    - The querying process was launched by an interpreter, document handler or network-facing server.
    - Agent installation paths are probed rather than agent health being read from the product itself.
    - A stop, uninstall or exclusion attempt follows the enumeration within the window.

requires:
  platforms:
    - windows
    - linux
    - macos
  connectors:
    - crowdstrike-ngsiem
  logs:
    - source: process_creation
      event_types:
        - ProcessRollup2
        - SyntheticProcessRollup2
      fields:
        - aid
        - ComputerName
        - UserName
        - FileName
        - CommandLine
        - ParentBaseFileName

query:
  - platform: crowdstrike
    language: cql

    cases:
      - id: vendor-names-in-a-service-or-process-query
        name: Security vendors named in a service or process enumeration
        purpose: >-
          The core discriminator. Rank by how many distinct vendors one lineage names,
          because breadth is what separates an operator sweeping for whatever is installed
          from a support script checking the one agent it owns.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(\bsc(\.exe)?\s+(query|queryex|qc)|\bnet(\.exe)?\s+start\b|Get-Service\b|Win32_Service\b|\bwmic\s+service\b|\btasklist(\.exe)?\b|Get-Process\b|Win32_Process\b|\bps\s+-?(aux|ef|A|e)\b|\bpgrep\b|\bsystemctl\s+(status|list-units|is-active)\b|\blaunchctl\s+list\b|\bfindstr\b|\bgrep\b)/i
          | case {
              CommandLine=/(csagent|csfalcon|crowdstrike|falcon-sensor)/i        | vendor := "crowdstrike" ;
              CommandLine=/(msmpeng|windefend|mpcmdrun|defender|mssense|senseir|securityhealth|wscsvc|mpdefendercore)/i | vendor := "microsoft" ;
              CommandLine=/(sentinelagent|sentinelone|sentinelstatic)/i          | vendor := "sentinelone" ;
              CommandLine=/(cbdefense|carbonblack|carbon black|repmgr|repux|cbagent)/i | vendor := "carbonblack" ;
              CommandLine=/(cylancesvc|cylance)/i                                | vendor := "cylance" ;
              CommandLine=/(sophos|savservice|sophosfs)/i                        | vendor := "sophos" ;
              CommandLine=/(mcafee|masvc|mfemms|mcshield|trellix)/i              | vendor := "mcafee" ;
              CommandLine=/(symantec|ccsvchst|sepmasterservice|norton)/i         | vendor := "symantec" ;
              CommandLine=/(trendmicro|trend micro|ds_agent|tmccsf|ntrtscan)/i   | vendor := "trendmicro" ;
              CommandLine=/(\bekrn\b|\begui\b|\beset\b)/i                        | vendor := "eset" ;
              CommandLine=/(kaspersky|klnagent|\bavp\b)/i                        | vendor := "kaspersky" ;
              CommandLine=/(bitdefender|bdservicehost|vsserv)/i                  | vendor := "bitdefender" ;
              CommandLine=/(malwarebytes|mbamservice)/i                          | vendor := "malwarebytes" ;
              CommandLine=/(\bxagt\b|fireeye|mandiant)/i                         | vendor := "fireeye" ;
              CommandLine=/(cortex|traps|cyserver|paloalto|palo alto)/i          | vendor := "paloalto" ;
              CommandLine=/(elastic-agent|winlogbeat|filebeat|osquery|wazuh|ossec|auditd|sysmon)/i | vendor := "opensource" ;
              CommandLine=/(taniumclient|qualys-cloud-agent|ir_agent|rapid7|nessus|\bjamf\b|\bsanta\b)/i | vendor := "management" ;
              CommandLine=/(little ?snitch|knockknock|blockblock|lulu|objective-see|oversight|reikey)/i | vendor := "macos_security" ;
            }
          | groupBy([ComputerName, UserName, ParentBaseFileName, FileName],
                    function=[count(vendor, distinct=true, as=distinct_vendors),
                              collect([vendor, CommandLine], limit=20),
                              min(@timestamp, as=first_seen),
                              max(@timestamp, as=last_seen)])
          | distinct_vendors >= 1
          | sort(distinct_vendors, order=desc)
        filters:
          include: []
          exclude:
            - "ParentBaseFileName of the endpoint agent's own installer, updater and health-check components"
            - "ParentBaseFileName of the compliance and inventory agents that verify agent presence on a schedule"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - command_line

      - id: antivirus-registration-queried-through-the-os
        name: Antivirus and firewall registration asked of the operating system
        purpose: >-
          Catch the question that does not need to know any product name in advance.
          Querying the security-centre namespace or the firewall profile returns whatever
          is installed, which is precisely what an operator who has just arrived wants and
          what a support engineer who already knows the estate does not need.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(SecurityCenter2|AntiVirusProduct|AntiSpywareProduct|FirewallProduct|Get-MpComputerStatus|Get-MpPreference|Get-MpThreat|MSFT_MpComputerStatus|Get-NetFirewallProfile|netsh\s+(advfirewall|firewall)\s+show|Get-WindowsFeature\s+.*Defender|systemextensionsctl\s+list|\bkextstat\b|\bspctl\s+--status\b|\bcsrutil\s+status\b)/i
        filters:
          include: []
          exclude:
            - "Compliance scanners whose defined job is to report antivirus registration state"
            - "Imaging and build pipelines that verify protection status before release"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - parent_process

      - id: agent-install-paths-and-keys-probed
        name: Endpoint agent installation paths and registry keys probed
        purpose: >-
          Find the operator testing for a footprint on disk rather than reading health from
          the product. Listing a vendor's program directory or querying its registry key is
          how presence is confirmed without touching the agent's own interfaces.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | CommandLine=/(\bdir\b|\bls\b|\bls\s+-|\bfind\b|Test-Path\b|Get-ChildItem\b|\bgci\b|\bstat\b|\breg(\.exe)?\s+query\b|Get-ItemProperty\b|\bmdfind\b)/i
          | CommandLine=/(Program Files[^"]*\\(Windows Defender|CrowdStrike|SentinelOne|Sophos|McAfee|Symantec|Trend Micro|ESET|Kaspersky|Bitdefender|Malwarebytes|Carbon Black|Cylance|Elastic|Tanium)|SOFTWARE\\+(CrowdStrike|SentinelOne|Sophos|McAfee|Symantec|TrendMicro|ESET|KasperskyLab|Bitdefender|Malwarebytes|Microsoft\\Windows Defender)|\/opt\/(CrowdStrike|sophos-spl|McAfee|sentinelone|wazuh-agent)|\/Library\/(Application Support\/(CrowdStrike|SentinelOne|Objective Development)|Little Snitch)|\/etc\/(falcon|sophos|wazuh|ossec)|\/usr\/local\/(crowdstrike|sentinelone|santa))/i
        filters:
          include: []
          exclude:
            - "Agent installers, uninstallers and migration tooling running inside a deployment window"
            - "Backup and antivirus exclusion management that enumerates vendor paths by design"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - path

      - id: discovery-then-defence-tampering
        name: Enumeration followed by an attempt on the agent that was found
        purpose: >-
          Join the reconnaissance to its purpose. The tampering half is owned by the Defense
          Impairment templates; what this case adds is the pairing, because discovery
          followed within the window by a stop, uninstall or exclusion is the sequence that
          makes the reconnaissance unambiguous.
        query: |
          #event_simpleName=/^(ProcessRollup2|SyntheticProcessRollup2)$/
          | case {
              CommandLine=/(csagent|csfalcon|crowdstrike|msmpeng|windefend|mssense|sentinelagent|sentinelone|cbdefense|carbonblack|cylance|sophos|mcafee|symantec|trendmicro|ds_agent|\bekrn\b|kaspersky|bitdefender|malwarebytes|\bxagt\b|cortex|elastic-agent|osquery|wazuh|little ?snitch)/i
                | CommandLine=/(\bsc(\.exe)?\s+(query|queryex|qc)|Get-Service\b|\btasklist(\.exe)?\b|Get-Process\b|\bps\s+-?(aux|ef)\b|\bpgrep\b|\bsystemctl\s+(status|is-active)\b|\blaunchctl\s+list\b|\breg(\.exe)?\s+query\b|Test-Path\b|\bdir\b|\bls\b)/i
                | enumerated := CommandLine ;
              CommandLine=/(\bsc(\.exe)?\s+(stop|delete|config)\b|\bnet(\.exe)?\s+stop\b|Stop-Service\b|Set-Service\b|\btaskkill(\.exe)?\b|Stop-Process\b|\bsystemctl\s+(stop|disable|mask)\b|\blaunchctl\s+(unload|bootout|disable)\b|Set-MpPreference\b|Add-MpPreference\b.*Exclusion|\bmsiexec\b.*\/x|\bwmic\s+product\s+.*\bcall\s+uninstall\b|\brpm\s+-e\b|\bdpkg\s+--purge\b|\bapt(-get)?\s+remove\b)/i
                | tampered := CommandLine ;
            }
          | groupBy([ComputerName, UserName],
                    function=[collect([enumerated, tampered, ParentBaseFileName, FileName], limit=10),
                              min(@timestamp, as=first_seen),
                              max(@timestamp, as=last_seen)])
          | enumerated=/.+/ and tampered=/.+/
        filters:
          include: []
          exclude:
            - "Approved agent migration and upgrade windows where the old product is enumerated then removed"
        baseline:
          required: true
          window: 60d
          compare:
            - host
            - user
            - process

evidence:
  required:
    - id: security_product_named
      name: A security product named in an enumeration command
      description: >-
        An enumeration command referenced an antivirus, endpoint detection, firewall or
        monitoring product by name, by installation path or by registry key, rather than
        listing services and processes generically.
      source: process_creation
      field: CommandLine
      indicates: defensive_posture_enumerated

  supporting:
    - id: breadth_of_vendors
      name: Several distinct vendors named together
      description: >-
        More than one security vendor was named by the same lineage within the window,
        which is a sweep for whatever happens to be installed rather than a check on the
        one agent the environment is known to run.
      source: process_creation
      field: CommandLine
      indicates: broad_vendor_sweep
    - id: security_registration_query
      name: Antivirus registration asked of the operating system
      description: >-
        The security-centre namespace, Defender status interface, firewall profile or
        system-extension listing was queried, which returns the protection stack without
        the caller needing to know any product name in advance.
      source: process_creation
      field: CommandLine
      indicates: protection_stack_discovered
    - id: install_path_probe
      name: Agent footprint probed on disk or in the registry
      description: >-
        A vendor installation directory or registry key was listed or tested rather than
        agent health being read from the product's own interface, which confirms presence
        without interacting with the agent.
      source: process_creation
      field: CommandLine
      indicates: agent_footprint_probed
    - id: non_administrative_parent
      name: Parent process with no administrative role
      description: >-
        The enumeration was launched by an interpreter, document handler, archive utility
        or network-facing server rather than by a management agent, installer or
        administrative shell.
      source: process_creation
      field: ParentBaseFileName
      indicates: abnormal_execution_chain
    - id: tampering_followup
      name: Stop, uninstall or exclusion attempt after the enumeration
      description: >-
        The same user on the same host attempted to stop, remove or exclude a security
        product shortly after enumerating it, which is the reconnaissance being acted upon.
      source: process_creation
      field: FileName
      indicates: defence_impairment_attempt
    - id: rare_for_host
      name: Enumeration unprecedented for this host
      description: >-
        No comparable product-name enumeration has been seen for this host and user during
        the baseline window, unlike compliance checks which recur on a fixed cycle.
      source: baseline
      field: CommandLine
      indicates: unusual_activity_for_host

  contradicting:
    - id: security_vendor_tooling
      name: The security product's own components
      description: >-
        The installer, updater or health-check component belonging to the security product
        itself performed the query, which necessarily names its own services and paths.
      source: process_creation
      field: ParentBaseFileName
      indicates: legitimate_enterprise_activity
    - id: inventory_or_compliance_sweep
      name: Recurring compliance or inventory sweep
      description: >-
        The same enumeration recurs on a stable cycle and appears across many hosts, which
        is a compliance posture check rather than a decision being made about one host.
      source: baseline
      field: ComputerName
      indicates: scheduled_automation_job
    - id: security_operations_host
      name: Host or account belonging to security operations
      description: >-
        The host is a security-operations or engineering system, or the account is an
        identity whose normal work is verifying and administering endpoint agents.
      source: asset_inventory
      field: ComputerName
      indicates: expected_administrative_activity
    - id: agent_deployment_change
      name: Approved agent deployment or migration
      description: >-
        A change record covers an agent rollout, upgrade or migration on this host, which
        accounts for both the vendor enumeration and any removal that followed it.
      source: change_management
      field: ComputerName
      indicates: approved_change_window

  risk_logic:
    required:
      - security_product_named

    supporting:
      any:
        - breadth_of_vendors
        - security_registration_query
        - install_path_probe
        - non_administrative_parent
        - tampering_followup
        - rare_for_host
      all:
        - breadth_of_vendors
        - tampering_followup

    contradicting:
      any:
        - security_vendor_tooling
        - inventory_or_compliance_sweep
        - security_operations_host
        - agent_deployment_change
      all: []

  verdict:
    low_risk_when:
      - security_product_named
      - security_vendor_tooling
      - inventory_or_compliance_sweep
      - security_operations_host
      - agent_deployment_change
    suspicious_when:
      - security_product_named
      - breadth_of_vendors
      - rare_for_host
    high_risk_when:
      - security_product_named
      - breadth_of_vendors
      - non_administrative_parent
      - security_registration_query
      - tampering_followup

  false_positive:
    - condition: A compliance agent verifies that the approved endpoint agent is installed and running.
      explanation: >-
        Posture checking is the largest legitimate source of this behaviour and reproduces
        the required evidence exactly, sometimes across several vendors during a migration
        period. It recurs on a fixed cycle from a stable parent across the whole estate,
        which is visible in the baseline and quite unlike a single host being surveyed once.
    - condition: The endpoint agent's own updater queries its services and registry keys.
      explanation: >-
        A product naming itself is unavoidable and would otherwise dominate the results. It
        is excluded by parent rather than by command line so that the same strings issued
        from an interpreter still surface.
    - condition: A migration project enumerates a competitor product before removing it.
      explanation: >-
        Agent replacement legitimately produces the strongest pairing in this file —
        enumerate a vendor, then uninstall it — and does so at scale. It is distinguished
        by a change record, a deployment window and a consistent pattern across many hosts
        rather than depth on one.
    - condition: A support engineer checks the state of one named agent during a fault.
      explanation: >-
        Naming a single product is ordinary troubleshooting and is why this file ranks on
        breadth rather than on any single vendor match. One vendor named by an interactive
        shell with an incident record behind it is not the pattern being hunted.
    - condition: A build pipeline confirms protection status before releasing an image.
      explanation: >-
        Imaging routinely queries the antivirus registration interface, which is otherwise
        one of the sharper signals here. It occurs on build hosts, at image-creation time,
        and under an identity that does nothing else.
