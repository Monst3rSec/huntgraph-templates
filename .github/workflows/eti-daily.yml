# ETI — one aggregation run a day.
#
# The ETI sub-project is self-contained under ETI/: its own venv, its own
# dependencies, its own tests, its own entrypoint. This file is the one piece that
# cannot live there, because GitHub reads workflows only from .github/workflows. So
# it is kept deliberately thin — it calls ETI/run.sh and makes no decisions of its
# own. Anything you want to change about what a run does belongs in ETI/.
#
# It never touches the detection corpus and never runs tools/validate.py; the
# `validate` workflow owns that. A push made with GITHUB_TOKEN does not start another
# workflow run, so committing the day's output here cannot loop.

name: eti-daily

on:
  schedule:
    - cron: "17 5 * * *"        # 05:17 UTC, daily
  workflow_dispatch:
    inputs:
      window_hours:
        description: "How far back a dated item may be and still count as new"
        type: string
        default: "72"
      draft_bands:
        description: "Which bands earn a template draft"
        type: choice
        options: ["high", "high+medium", "none"]
        default: "high"
      commit:
        description: "Commit output/, state/ and templates/ back to the branch"
        type: boolean
        default: true

permissions:
  contents: write

# One run at a time. Two runs committing to the same branch would race, and the
# second would be working from a stale state/.
concurrency:
  group: eti-daily
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ETI
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ETI/requirements.txt

      - name: Tests
        run: ./run.sh test

      - name: Aggregate
        id: run
        run: |
          set -o pipefail
          args=(--window-hours "${{ inputs.window_hours || '72' }}")
          case "${{ inputs.draft_bands || 'high' }}" in
            high)        args+=(--draft-band high) ;;
            high+medium) args+=(--draft-band high --draft-band medium) ;;
            none)        args+=(--no-drafts) ;;
          esac
          ./run.sh "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "csv=ETI/$(ls -t output/*.csv | head -1)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Upload the run
        uses: actions/upload-artifact@v4
        with:
          name: eti-${{ steps.run.outputs.day }}
          path: |
            ${{ steps.run.outputs.csv }}
            ETI/templates/${{ steps.run.outputs.day }}
          if-no-files-found: warn
          retention-days: 30

      - name: Commit the day's content
        if: ${{ inputs.commit != false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output state templates
          if git diff --staged --quiet; then
            echo "nothing to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "ETI ${{ steps.run.outputs.day }}: daily run"
          # Another job may have landed a commit while this one was fetching feeds.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
