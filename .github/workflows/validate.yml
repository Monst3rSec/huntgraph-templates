name: validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Cache the ATT&CK STIX bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/huntgraph
          key: attack-stix-${{ hashFiles('tools/attack_extract.py') }}
          restore-keys: attack-stix-

      - name: Prove the validator still catches defects
        run: python3 tools/test_validator.py

      - name: Validate the corpus
        run: python3 tools/validate.py --strict
